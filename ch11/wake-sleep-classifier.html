<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wake/Sleep Classifier</title>
</head>
<body>
<style>
  :root {
    color-scheme: light;
    --paper: #ffffff; --ink: #222222; --ink-2: #666666; --ink-3: #9a9a9a;
    --rule: #dcdcdc; --grid: #ececec; --raw: #b4b4b4; --raw-dot: #8c8c8c; --clean: #444444;
    --window: rgba(34, 34, 34, 0.06); --window-edge: #222222;
    --ma: #2a78d6; --med: #1baf7a; --wm: #4a3aa7; --ewma: #eb6834;
    --wake: #eb6834; --light: #2a78d6; --deep: #4a3aa7; --rem: #1baf7a; --sleep: #2a78d6;
    --sans: "Helvetica Neue", Helvetica, -apple-system, Arial, sans-serif;
    --mono: Menlo, "SF Mono", Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.4; padding-block: 18px 28px; padding-inline: 16px; -webkit-font-smoothing: antialiased; }
  .stage { max-width: 1200px; margin: 0 auto; display: grid; gap: 14px; }
  .slide { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 26px 34px 16px; display: grid; grid-template-rows: auto 1fr auto; gap: 10px; min-height: 0; position: relative; outline: none; cursor: pointer; user-select: none; }
  .slide:focus-visible { box-shadow: 0 0 0 3px rgba(42,120,214,.35); }
  .head h1 { margin: 0; font-size: clamp(22px, 2.6vw, 30px); font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; line-height: 1.15; }
  .head h1 .tag { display: inline-block; font-family: var(--mono); font-weight: 400; font-size: 0.6em; color: var(--ink-2); margin-left: 10px; vertical-align: middle; background: #f4f4f4; padding: 2px 8px; border-radius: 4px; }
  .head p { margin: 6px 0 0; color: #444; font-size: clamp(15px, 1.6vw, 18px); max-width: none; }
  .chart-wrap { position: relative; min-height: 0; }
  .code { margin: 8px 0 0; font-family: var(--mono); font-size: clamp(13px, 1.35vw, 16px); color: var(--ink); background: #f4f6f9; border: 1px solid var(--rule); border-radius: 5px; padding: 6px 12px; white-space: pre; overflow-x: auto; }
  .code[hidden] { display: none; }
  .code .p { color: var(--ma); font-weight: 700; }
  svg.chart { display: block; width: 100%; height: auto; max-height: calc(100vh - 360px); overflow: visible; }
  .tt { position: absolute; pointer-events: none; display: none; background: #fff; border: 1px solid var(--rule); border-radius: 4px; padding: 6px 9px; font-family: var(--mono); font-size: 12px; color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,.08); white-space: nowrap; z-index: 2; }
  .tt .row { display: flex; gap: 10px; justify-content: space-between; }
  .tt .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .foot { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--ink-3); padding-top: 4px; }
  .foot .ctr { font-family: var(--mono); }
  .bar { display:flex; flex-wrap:wrap; gap:12px 24px; align-items:center; padding:14px 18px; border:1px solid var(--rule); border-radius:6px; background:#f6f7f9; font-size:14px; color:var(--ink); }
  .group { display:flex; align-items:center; gap:8px; }
  .group label { font-size:13px; font-weight:700; color:var(--ink); }
  .val { font-family:var(--mono); font-size:14px; font-weight:700; color:var(--ma); min-width:5ch; }
  button, select { font:inherit; font-size:14px; color:var(--ink); background:#fff; border:1px solid #9a9a9a; border-radius:5px; padding:7px 13px; cursor:pointer; }
  button:hover, select:hover { border-color:var(--ink); }
  button.primary { background:var(--ma); color:#fff; border-color:var(--ma); min-width:88px; font-weight:700; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline:2px solid var(--ma); outline-offset:2px; }
  input[type=range] { accent-color:var(--ma); width:150px; height:30px; cursor:pointer; }
  .hint { margin-left:auto; color:var(--ink-2); font-size:12px; }
  .hint kbd { font-family:var(--mono); background:#fff; border:1px solid var(--rule); border-radius:3px; padding:0 5px; font-size:11px; }
  .grid line { stroke: var(--grid); stroke-width: 1; }
  .axis line, .axis path { stroke: var(--ink-2); stroke-width: 1; fill: none; }
  .axis text { font-family: var(--mono); font-size: 12px; fill: var(--ink-2); }
  .axis-title { font-family: var(--sans); font-size: 12px; fill: var(--ink-2); }
  .mono { font-family: var(--mono); }
  .dlabel { font-family: var(--sans); font-size: 13px; font-weight: 700; }
  .ann { font-family: var(--mono); font-size: 13px; fill: var(--ink); }
  .win-rect { fill: var(--window); stroke: var(--window-edge); stroke-width: 1; stroke-dasharray: 3 3; }
  .crosshair { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 2 2; }
  @media (max-width: 720px) { .slide { padding: 18px 16px 12px; min-height: 0; } .hint { display: none; } }
</style>
<div class="stage">
  <section class="slide" id="slide" tabindex="0" aria-live="polite">
    <div class="head">
      <h1 id="title"></h1>
      <p id="subtitle"></p>
      <pre class="code" id="code" hidden></pre>
    </div>
    <div class="chart-wrap">
      <svg class="chart" id="chart" viewBox="0 0 1200 620" role="img" aria-label="Wake/sleep feature distributions and held-out predictions"></svg>
      <div class="tt" id="tt"></div>
    </div>
    <div class="foot">
      <span>CS328 &nbsp;·&nbsp; Measuring Sleep Patterns</span>
      <span class="ctr" id="counter"></span>
    </div>
  </section>
  <div class="bar">
    <div class="group">
      <button id="prev" title="Previous (←)">‹ Prev</button>
      <button id="play" class="primary" title="Play / pause (space)">Play</button>
      <button id="next" title="Next (→)">Next ›</button>
      <button id="restart" title="Restart this step (r)">Restart</button>
      <button id="reset" title="Reset all dials to defaults">Reset dials</button>
    </div>
    <div class="group">
      <label for="roll">Rolling window</label>
      <input type="range" id="roll" min="1" max="30" step="1" value="10">
      <span class="val" id="rollVal">10 min</span>
    </div>
    <div class="group">
      <label for="speed">Speed</label>
      <select id="speed">
        <option value="20">very slow</option>
        <option value="40">slow</option>
        <option value="100" selected>normal</option>
        <option value="300">fast</option>
        <option value="0">instant</option>
      </select>
    </div>
    <span class="hint"><kbd>→</kbd> finish / next &nbsp; <kbd>←</kbd> back &nbsp; <kbd>space</kbd> play</span>
  </div>
</div>

  const NE = EP.length, NW = EP.filter(e => !e.sleep).length, NS = NE - NW;
  function rollAll() { const w = rollW(); SUBS.forEach(s => { const d = DATA.subs[s]; let acc = 0; d.roll = []; for (let i = 0; i < d.mad.length; i++) { acc += d.mad[i] / 1e6; if (i >= w) acc -= d.mad[i - w] / 1e6; d.roll.push(acc / Math.min(i + 1, w)); } }); EP.forEach(e => { e.roll = DATA.subs[e.s].roll[e.i]; }); }
  // held-out subject
  const HS = DATA.held, HD = DATA.subs[HS], NH = HD.mad.length, TRUTH = HD.stage.map(v => v !== 0 ? 1 : 0), PRED = DATA.pred;
  const TRAIN = SUBS.filter(s => s !== HS);

  const chart = $('chart');
  const W = 1200, H = 620, PL = 70, PR = 30, PT = 22;
  // histogram geometry
  const LO = -5, HI = Math.log10(0.5), NBIN = 49, BW = (HI - LO) / NBIN;
  const XLO = -4, XHI = HI;
  const HR = { y0: PT + 8, y1: H - 90 };
  const xl = lv => PL + ((lv - XLO) / (XHI - XLO)) * (W - PL - PR);
  const YL0 = Math.log10(0.7), YL1 = 3;
  const yl = c => HR.y1 - ((Math.log10(Math.max(c, 0.7)) - YL0) / (YL1 - YL0)) * (HR.y1 - HR.y0);
  const binOf = v => Math.max(0, Math.min(NBIN - 1, Math.floor((Math.log10(Math.max(v, 1e-5)) - LO) / BW)));

  function steps() {
    return [
      { title: 'Distribution of per-epoch MAD for wake and sleep epochs', tag: `${NE.toLocaleString()} epochs · ${SUBS.length} subjects`, frames: NE, mode: 'mad',
        subtitle: 'The distribution of per-epoch MAD for wake epochs and for sleep epochs.' },
      { title: 'Distribution of the rolling-mean MAD over 10 minutes', tag: `window = ${rollMin} min = ${rollW()} epochs`, frames: NE, mode: 'roll', presets: { roll: 10 }, code: `roll_mad = mad.rolling(window=<b class="p">${rollW()}</b>, min_periods=1).mean()`,
        subtitle: 'The distribution of the rolling-mean MAD for wake epochs and for sleep epochs.' },
      { title: 'Prediction versus PSG on the held-out night', tag: `subject ${HS} · ${NH} epochs · random forest`, frames: NH, mode: 'pred', speedScale: 0.25, code: 'clf = RandomForestClassifier(n_estimators=100, max_depth=12, class_weight="balanced")',
        subtitle: 'Scoring the random forest’s predictions against the PSG labels of a held-out night.' },
    ];
  }

  let G = {}, mode = 'mad';
  function enter(step) {
    chart.innerHTML = '';
    mode = steps()[step].mode; rollAll();
    if (mode === 'pred') { enterPred(); return; }
    const grid = el('g', { class: 'grid' }, chart), axis = el('g', { class: 'axis' }, chart);
    for (let p = 0; p <= 3; p++) { const y = yl(Math.pow(10, p)); el('line', { x1: PL, x2: W - PR, y1: y, y2: y }, grid); txt(axis, PL - 8, y + 4, p === 0 ? '1' : p === 1 ? '10' : p === 2 ? '100' : '1000', { 'text-anchor': 'end' }); }
    for (let p = -4; p <= 0; p++) {
      for (let m = 1; m < 10; m++) { const lv = p + Math.log10(m); if (lv > XHI) break; const x = xl(lv); el('line', { x1: x, x2: x, y1: m === 1 ? HR.y0 : HR.y1 - 4, y2: HR.y1, stroke: m === 1 ? undefined : 'var(--ink-3)' }, m === 1 ? grid : axis); if (m === 1) txt(axis, x, HR.y1 + 18, ['0.0001', '0.001', '0.01', '0.1', '1'][p + 4], { 'text-anchor': 'middle' }); }
    }
    el('path', { d: `M${PL},${HR.y0}V${HR.y1}H${W - PR}` }, axis);
    txt(chart, PL - 56, HR.y0 - 6, 'number of epochs (log axis)', { class: 'axis-title' });
    txt(chart, W - PR, HR.y1 + 36, mode === 'mad' ? 'Mean Amplitude Deviation per epoch (g, log axis)' : `rolling-mean MAD over ${rollMin} min (g, log axis)`, { class: 'axis-title', 'text-anchor': 'end' });
    G.bars = el('g', {}, chart);
    G.cur = el('g', {}, chart);
    legend(el('g', {}, chart), W - PR - 230, HR.y0 + 8, [{ c: STAGE.W.c, n: `Wake epochs (n = ${NW})`, box: true, op: 0.55 }, { c: 'var(--sleep)', n: `Sleep epochs (n = ${NS.toLocaleString()})`, box: true, op: 0.55 }]);
    G.hover = el('g', {}, chart);
    el('rect', { x: PL, y: HR.y0, width: W - PL - PR, height: HR.y1 - HR.y0, fill: 'transparent' }, chart);
  }

  function renderHist(cursor) {
    G.bars.innerHTML = ''; G.cur.innerHTML = '';
    const cw = new Array(NBIN).fill(0), cs = new Array(NBIN).fill(0);
    const val = e => mode === 'mad' ? e.mad : e.roll;
    for (let k = 0; k <= cursor; k++) { const e = EP[k]; const b = binOf(val(e)); if (e.sleep) cs[b]++; else cw[b]++; }
    let dS = '', dW = '', oS = '', oW = '';
    for (let b = 0; b < NBIN; b++) {
      const x0 = xl(LO + b * BW), x1 = xl(LO + (b + 1) * BW); if (x1 < PL) continue;
      const xa = Math.max(PL, x0);
      if (cs[b] > 0) { const y = yl(cs[b]); dS += `M${xa.toFixed(1)},${HR.y1}V${y.toFixed(1)}H${x1.toFixed(1)}V${HR.y1}Z`; oS += `M${xa.toFixed(1)},${HR.y1}V${y.toFixed(1)}H${x1.toFixed(1)}V${HR.y1}`; }
      if (cw[b] > 0) { const y = yl(cw[b]); dW += `M${xa.toFixed(1)},${HR.y1}V${y.toFixed(1)}H${x1.toFixed(1)}V${HR.y1}Z`; oW += `M${xa.toFixed(1)},${HR.y1}V${y.toFixed(1)}H${x1.toFixed(1)}V${HR.y1}`; }
    }
    el('path', { d: dS, fill: 'var(--sleep)', opacity: 0.45 }, G.bars);
    el('path', { d: oS, fill: 'none', stroke: 'var(--sleep)', 'stroke-width': 1 }, G.bars);
    el('path', { d: dW, fill: STAGE.W.c, opacity: 0.45 }, G.bars);
    el('path', { d: oW, fill: 'none', stroke: STAGE.W.c, 'stroke-width': 1 }, G.bars);
    if (cursor < 0) return;
    const e = EP[cursor], v = val(e), x = xl(Math.log10(Math.max(v, 1e-5)));
    const c = e.sleep ? 'var(--sleep)' : STAGE.W.c;
    el('path', { d: `M${x},${HR.y1 + 2}l-6,10h12z`, fill: c }, G.cur);
    el('line', { x1: x, x2: x, y1: HR.y0, y2: HR.y1, stroke: c, 'stroke-dasharray': '3 3', opacity: 0.7 }, G.cur);
    let nw = 0, ns = 0; for (let k = 0; k <= cursor; k++) if (EP[k].sleep) ns++; else nw++;
    txt(G.cur, PL + 12, HR.y0 + 18, `epoch ${cursor + 1} of ${NE} · subject ${e.s} · ${mode === 'mad' ? 'MAD' : 'rolling MAD'} = ${v.toFixed(4)} g · ${e.sleep ? 'sleep' : 'wake'}`, { class: 'dlabel', fill: c });
    txt(G.cur, PL + 12, HR.y1 + 60, `binned so far: ${nw} wake · ${ns} sleep`, { class: 'ann', fill: 'var(--ink-2)' });
  }

  // ---------------- step 3: strips + confusion matrix
  const SX0 = PL, SX1 = 800, SY = { psg: [PT + 40, PT + 150], pred: [PT + 190, PT + 300], err: [PT + 316, PT + 336] };
  const xh = i => SX0 + (i / NH) * (SX1 - SX0);
  const CM = { x: 910, y: PT + 60, cell: 120 };
  function enterPred() {
    const axis = el('g', { class: 'axis' }, chart), grid = el('g', { class: 'grid' }, chart);
    [['psg', 'PSG ground truth'], ['pred', 'random forest prediction']].forEach(([k, name]) => {
      const [y0, y1] = SY[k];
      el('rect', { x: SX0, y: y0, width: SX1 - SX0, height: y1 - y0, fill: '#f4f4f4', stroke: 'var(--rule)' }, chart);
      txt(chart, SX0, y0 - 6, name, { class: 'axis-title' });
    });
    txt(chart, SX0, SY.err[0] - 4, 'disagreements', { class: 'axis-title', 'font-size': 11 });
    for (let hh = 0; hh <= NH / 120; hh += 1) { const x = xh(hh * 120); el('line', { x1: x, x2: x, y1: SY.err[1] + 2, y2: SY.err[1] + 6, stroke: 'var(--ink-2)' }, axis); txt(axis, x, SY.err[1] + 20, hh, { 'text-anchor': 'middle' }); }
    el('line', { x1: SX0, x2: SX1, y1: SY.err[1] + 2, y2: SY.err[1] + 2 }, axis);
    txt(chart, SX1, SY.err[1] + 38, 'hours from start of labeled recording', { class: 'axis-title', 'text-anchor': 'end' });
    G.strips = el('g', {}, chart); G.cur = el('g', {}, chart); G.cm = el('g', {}, chart);
    legend(el('g', {}, chart), SX0, SY.err[1] + 56, [{ c: 'var(--sleep)', n: 'Sleep', box: true, op: 0.85 }, { c: STAGE.W.c, n: 'Wake', box: true, op: 0.9 }, { c: 'var(--ink)', n: 'prediction ≠ PSG', box: true }]);
    txt(chart, SX0 + 190, SY.err[1] + 76, `train: subjects ${TRAIN.join(', ')}   ·   test: subject ${HS}`, { class: 'ann', 'font-size': 12, fill: 'var(--ink-2)' });
    txt(chart, SX0 + 190, SY.err[1] + 96, 'features: MAD, max, std, 95th pct, activity count, 10-min rolling MAD and count', { class: 'ann', 'font-size': 12, fill: 'var(--ink-2)' });
    // matrix frame
    const { x, y, cell } = CM;
    txt(chart, x + cell, y - 30, 'Predicted label', { class: 'axis-title', 'text-anchor': 'middle', 'font-size': 13 });
    ['Wake', 'Sleep'].forEach((n, j) => txt(chart, x + cell * (j + 0.5), y - 10, n, { class: 'axis-title', 'text-anchor': 'middle', 'font-size': 13 }));
    ['Wake', 'Sleep'].forEach((n, i) => txt(chart, x - 8, y + cell * (i + 0.5) + 4, n, { class: 'axis-title', 'text-anchor': 'end', 'font-size': 13 }));
    txt(chart, x - 62, y + cell, 'Actual', { class: 'axis-title', 'text-anchor': 'middle', 'font-size': 13, transform: `rotate(-90 ${x - 62} ${y + cell})` });
    G.hover = el('g', {}, chart);
  }
  function renderPred(cursor) {
    G.strips.innerHTML = ''; G.cur.innerHTML = ''; G.cm.innerHTML = '';
    let dT = { 0: '', 1: '' }, dP = { 0: '', 1: '' }, dE = '';
    const cm = [[0, 0], [0, 0]];
    for (let i = 0; i <= cursor; i++) {
      const w = (xh(i + 1) - xh(i)).toFixed(2), x = xh(i).toFixed(1);
      dT[TRUTH[i]] += `M${x},${SY.psg[0]}h${w}v${SY.psg[1] - SY.psg[0]}h-${w}z`;
      dP[PRED[i]] += `M${x},${SY.pred[0]}h${w}v${SY.pred[1] - SY.pred[0]}h-${w}z`;
      if (TRUTH[i] !== PRED[i]) dE += `M${x},${SY.err[0]}h${w}v${SY.err[1] - SY.err[0]}h-${w}z`;
      cm[TRUTH[i]][PRED[i]]++;
    }
    el('path', { d: dT[1], fill: 'var(--sleep)', opacity: 0.85 }, G.strips); el('path', { d: dT[0], fill: STAGE.W.c, opacity: 0.9 }, G.strips);
    el('path', { d: dP[1], fill: 'var(--sleep)', opacity: 0.85 }, G.strips); el('path', { d: dP[0], fill: STAGE.W.c, opacity: 0.9 }, G.strips);
    el('path', { d: dE, fill: 'var(--ink)' }, G.strips);
    if (cursor >= 0) {
      const x = xh(cursor + 1);
      el('line', { class: 'crosshair', x1: x, x2: x, y1: SY.psg[0], y2: SY.err[1] }, G.cur);
      const t = TRUTH[cursor], p = PRED[cursor];
      txt(G.cur, x + (cursor > NH * 0.7 ? -8 : 8), SY.psg[0] - 22, `epoch ${cursor} · PSG ${t ? 'sleep' : 'wake'} · predicted ${p ? 'sleep' : 'wake'}${t !== p ? ' · error' : ''}`, { class: 'dlabel', fill: t !== p ? 'var(--ink)' : (p ? 'var(--sleep)' : STAGE.W.c), 'text-anchor': cursor > NH * 0.7 ? 'end' : 'start' });
    }
    // matrix (labels [0]=wake, [1]=sleep)
    const { x, y, cell } = CM;
    for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) {
      const rowSum = cm[i][0] + cm[i][1], frac = rowSum ? cm[i][j] / rowSum : 0;
      el('rect', { x: x + j * cell, y: y + i * cell, width: cell, height: cell, fill: 'var(--ma)', opacity: 0.08 + 0.85 * frac, stroke: '#fff' }, G.cm);
      txt(G.cm, x + (j + 0.5) * cell, y + (i + 0.5) * cell - 2, cm[i][j], { class: 'mono', 'font-size': 26, 'font-weight': 700, 'text-anchor': 'middle', fill: frac > 0.5 ? '#fff' : 'var(--ink)' });
      txt(G.cm, x + (j + 0.5) * cell, y + (i + 0.5) * cell + 20, rowSum ? `(${(100 * frac).toFixed(1)}%)` : '', { class: 'mono', 'font-size': 13, 'text-anchor': 'middle', fill: frac > 0.5 ? '#fff' : 'var(--ink)' });
    }
    const tot = cm[0][0] + cm[0][1] + cm[1][0] + cm[1][1];
    const rows = [['sleep sensitivity', cm[1][0] + cm[1][1] ? (100 * cm[1][1] / (cm[1][0] + cm[1][1])).toFixed(1) + ' %' : '–', 'var(--sleep)'], ['wake sensitivity', cm[0][0] + cm[0][1] ? (100 * cm[0][0] / (cm[0][0] + cm[0][1])).toFixed(1) + ' %' : '–', STAGE.W.c], ['accuracy', tot ? (100 * (cm[0][0] + cm[1][1]) / tot).toFixed(1) + ' %' : '–', 'var(--ink)']];
    rows.forEach((r, k) => { const yy = y + 2 * cell + 40 + k * 30; txt(G.cm, x, yy, r[0], { class: 'axis-title', 'font-size': 13 }); txt(G.cm, x + 2 * cell, yy, r[1], { class: 'mono', 'font-size': 20, 'font-weight': 700, fill: r[2], 'text-anchor': 'end' }); el('line', { x1: x, x2: x + 2 * cell, y1: yy + 8, y2: yy + 8, stroke: 'var(--grid)' }, G.cm); });
  }

  function render(cursor) { if (mode === 'pred') renderPred(cursor); else renderHist(cursor); }

  const tt = $('tt');
  chart.addEventListener('mousemove', evt => {
    const pt = chart.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY;
    const p = pt.matrixTransform(chart.getScreenCTM().inverse());
    G.hover.innerHTML = '';
    if (mode === 'pred') {
      if (p.x < SX0 || p.x > SX1 || p.y < SY.psg[0] || p.y > SY.err[1]) { tt.style.display = 'none'; return; }
      const i = Math.max(0, Math.min(NH - 1, Math.floor((p.x - SX0) / (SX1 - SX0) * NH)));
      el('line', { class: 'crosshair', x1: xh(i + 0.5), x2: xh(i + 0.5), y1: SY.psg[0], y2: SY.err[1] }, G.hover);
      tt.innerHTML = `<div class="row"><span>epoch</span><b>${i}</b></div><div class="row"><span>time</span><span>${(i / 120).toFixed(2)} h</span></div><div class="row"><span>PSG</span><span>${TRUTH[i] ? 'sleep' : 'wake'}</span></div><div class="row"><span>predicted</span><span>${PRED[i] ? 'sleep' : 'wake'}</span></div><div class="row"><span>MAD</span><span>${(HD.mad[i] / 1e6).toFixed(4)} g</span></div>`;
    } else {
      if (p.x < PL || p.x > W - PR || p.y < HR.y0 || p.y > HR.y1) { tt.style.display = 'none'; return; }
      const lv = XLO + (p.x - PL) / (W - PL - PR) * (XHI - XLO); const b = binOf(Math.pow(10, lv));
      const val = e => mode === 'mad' ? e.mad : e.roll; let nw = 0, ns = 0; EP.forEach(e => { if (binOf(val(e)) === b) { if (e.sleep) ns++; else nw++; } });
      el('rect', { x: xl(LO + b * BW), y: HR.y0, width: xl(LO + (b + 1) * BW) - xl(LO + b * BW), height: HR.y1 - HR.y0, fill: 'var(--window)' }, G.hover);
      tt.innerHTML = `<div class="row"><span>bin</span><span>${Math.pow(10, LO + b * BW).toExponential(1)} – ${Math.pow(10, LO + (b + 1) * BW).toExponential(1)} g</span></div><div class="row"><span><i class="sw" style="background:${STAGE.W.hex}"></i>wake (all)</span><span>${nw}</span></div><div class="row"><span><i class="sw" style="background:#2a78d6"></i>sleep (all)</span><span>${ns}</span></div>`;
    }
    tt.style.display = 'block';
    const wrap = chart.parentElement.getBoundingClientRect();
    const px = evt.clientX - wrap.left, py = evt.clientY - wrap.top;
    tt.style.left = (px + 16 + tt.offsetWidth > wrap.width ? px - tt.offsetWidth - 12 : px + 16) + 'px';
    tt.style.top = Math.max(0, py - 10) + 'px';
  });
  chart.addEventListener('mouseleave', () => { tt.style.display = 'none'; G.hover.innerHTML = ''; });

  makeEngine({ steps, enter, render, speedDefault: '100', dials: [{ id: 'roll', def: 10 }],
    onDial: (id, v) => { if (id === 'roll') { rollMin = parseInt(v, 10); $('rollVal').textContent = rollMin + ' min'; } } });

})();
</script>
</body>
</html>

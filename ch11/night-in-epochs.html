      const y = binary ? ysB(lv) : ysL(lv);
      paths[key] = (paths[key] || '') + `M${xs(i).toFixed(1)},${y.toFixed(1)}H${xs(i + 1).toFixed(1)}`;
      if (prevLv != null && prevLv !== y) vert += `M${xs(i).toFixed(1)},${prevLv.toFixed(1)}V${y.toFixed(1)}`;
      prevLv = y;
    }
    el('path', { d: vert, stroke: 'var(--ink-3)', 'stroke-width': 1, fill: 'none' }, G.hyp);
    for (const k in paths) el('path', { d: paths[k], stroke: k === 'S' ? 'var(--sleep)' : STAGE[k].c, 'stroke-width': 3, fill: 'none', 'stroke-linecap': 'butt' }, G.hyp);
  }

  function cursorMark(i, binary) {
    G.cur.innerHTML = '';
    if (i < 0) return;
    const x = xs(i + 1);
    el('line', { class: 'crosshair', x1: x, x2: x, y1: PT, y2: hypBottom }, G.cur);
    const s = lab[i];
    const name = !s ? 'unscored' : binary ? (s === 'W' ? 'WAKE' : 'SLEEP') : LEVEL_NAME[LEVELS[s]];
    const right = i > N * 0.75;
    txt(G.cur, x + (right ? -8 : 8), hypBottom - 8, `epoch ${i} · ${(i * EPOCH_MIN).toFixed(1)} min · ${name}`, { class: 'dlabel', fill: s ? (binary && s !== 'W' ? 'var(--sleep)' : STAGE[s].c) : 'var(--ink-2)', 'text-anchor': right ? 'end' : 'start' });
  }

  function counts(upto) {
    const c = { W: 0, L: 0, D: 0, R: 0, scored: 0 }; let onset = -1;
    for (let i = 0; i <= upto; i++) { const s = lab[i]; if (!s) continue; c[s]++; c.scored++; if (onset < 0 && s !== 'W') onset = i; }
    let waso = 0; if (onset >= 0) for (let i = onset; i <= upto; i++) if (lab[i] === 'W') waso++;
    return { c, onset, waso };
  }

  // lower area for step 1: last 40 epochs as boxes
  function drawStrip(upto) {
    G.lower.innerHTML = '';
    const y0 = hypBottom + 70, bw = 24, bh = 40, K = 40;
    txt(G.lower, PL, y0 - 12, 'the most recent 40 epochs, one box per 30 s', { class: 'axis-title' });
    txt(G.lower, W - PR, y0 - 12, 'W wake · L light · D deep · R REM · – unscored', { class: 'axis-title', 'text-anchor': 'end' });
    const x0 = PL + ((W - PL - PR) - K * bw) / 2;
    for (let j = 0; j < K; j++) {
      const i = upto - (K - 1) + j; if (i < 0) continue;
      const s = lab[i]; const x = x0 + j * bw;
      el('rect', { x, y: y0, width: bw - 2, height: bh, fill: s ? STAGE[s].c : '#eee', opacity: s ? 0.9 : 1, rx: 2 }, G.lower);
      txt(G.lower, x + (bw - 2) / 2, y0 + bh / 2 + 5, s || '–', { class: 'mono', 'font-size': 15, fill: s ? '#fff' : 'var(--ink-3)', 'text-anchor': 'middle', 'font-weight': 700 });
      if (i % 5 === 0) txt(G.lower, x + (bw - 2) / 2, y0 + bh + 16, i, { class: 'mono', 'font-size': 15, fill: 'var(--ink-2)', 'text-anchor': 'middle' });
    }
    if (upto >= 0) { const xc = x0 + (K - 1) * bw + (bw - 2) / 2; el('path', { d: `M${xs(upto + 1)},${hypBottom + 40}L${xc},${y0 - 2}`, stroke: 'var(--ink-3)', 'stroke-dasharray': '2 3', fill: 'none' }, G.lower); }
    txt(G.lower, PL, y0 + bh + 44, `epochs scored so far: ${upto + 1} of ${N}   ·   ${((upto + 1) * EPOCH_MIN).toFixed(1)} min`, { class: 'ann' });
  }

  // lower area for step 2: stacked bar + metric readouts
  function drawMetrics(upto) {
    G.lower.innerHTML = '';
    const { c, onset, waso } = counts(upto);
    const y0 = hypBottom + 62;
    const tib = c.scored * EPOCH_MIN, tst = (c.L + c.D + c.R) * EPOCH_MIN;
    // stacked bar
    const barW = Math.round((W - PL - PR) * 0.52), barX = PL, barH = 26;
    txt(G.lower, barX, y0 - 10, 'time in each stage (stacked, minutes)', { class: 'axis-title' });
    el('rect', { x: barX, y: y0, width: barW, height: barH, fill: '#f4f4f4', stroke: 'var(--rule)' }, G.lower);
    const total = N * EPOCH_MIN; let x = barX;
    ['W', 'L', 'D', 'R'].forEach(k => {
      const w = (c[k] * EPOCH_MIN / total) * barW;
      if (w > 0) el('rect', { x, y: y0, width: w, height: barH, fill: STAGE[k].c, opacity: 0.9 }, G.lower);
      x += w;
    });
    let ly = y0 + barH + 22;
    ['W', 'L', 'D', 'R'].forEach((k, j) => {
      const lx = barX + j * 175;
      el('rect', { x: lx, y: ly - 10, width: 12, height: 12, fill: STAGE[k].c, rx: 2 }, G.lower);
      txt(G.lower, lx + 18, ly, `${STAGE[k].n.split(' ')[0]} ${(c[k] * EPOCH_MIN).toFixed(1)} min`, { class: 'ann', style: 'font-size:17px' });
    });
    ly += 34;
    const F = ['TST = (light + deep + REM epochs) × 0.5 min', 'efficiency = TST / time in bed', 'onset latency = epochs before the first sleep epoch × 0.5 min', 'WASO = wake epochs after sleep onset × 0.5 min'];
    F.forEach((f, j) => txt(G.lower, barX, ly + j * 24, f, { class: 'ann', style: 'font-size:17px', fill: 'var(--ink-2)' }));
    // readouts on the right
    const rx = W - PR - 440, rows = [
      ['time in bed', `${tib.toFixed(1)} min`, 'var(--ink)'],
      ['total sleep time (TST)', `${tst.toFixed(1)} min`, 'var(--sleep)'],
      ['sleep efficiency', tib > 0 ? `${(100 * tst / tib).toFixed(1)} %` : '–', 'var(--sleep)'],
      ['sleep onset latency', onset >= 0 ? `${(onset * EPOCH_MIN).toFixed(1)} min` : '–', 'var(--ink)'],
      ['wake after sleep onset (WASO)', onset >= 0 ? `${(waso * EPOCH_MIN).toFixed(1)} min` : '–', STAGE.W.c],
    ];
    rows.forEach((r, j) => {
      const y = y0 + 4 + j * 34;
      txt(G.lower, rx, y + 14, r[0], { class: 'axis-title', 'font-size': 15, fill: 'var(--ink-2)' });
      txt(G.lower, W - PR, y + 14, r[1], { class: 'mono', 'font-size': 20, 'font-weight': 700, fill: r[2], 'text-anchor': 'end' });
      el('line', { x1: rx, x2: W - PR, y1: y + 24, y2: y + 24, stroke: 'var(--grid)' }, G.lower);
    });
  }

  function drawBinary(upto) {
    G.lower.innerHTML = '';
    const y0 = hypBottom + 70, h = 60;
    txt(G.lower, PL, y0 - 12, 'wake / sleep strip, one column per epoch', { class: 'axis-title' });
    el('rect', { x: PL, y: y0, width: W - PL - PR, height: h, fill: '#f4f4f4', stroke: 'var(--rule)' }, G.lower);
    let dW = '', dS = '';
    for (let i = 0; i <= upto; i++) { const s = lab[i]; if (!s) continue; const seg = `M${xs(i).toFixed(1)},${y0}h${(xs(i + 1) - xs(i)).toFixed(2)}v${h}h-${(xs(i + 1) - xs(i)).toFixed(2)}z`; if (s === 'W') dW += seg; else dS += seg; }
    el('path', { d: dS, fill: 'var(--sleep)', opacity: 0.85 }, G.lower);
    el('path', { d: dW, fill: STAGE.W.c, opacity: 0.9 }, G.lower);
    const { c } = counts(upto);
    const nS = c.L + c.D + c.R;
    txt(G.lower, PL, y0 + h + 30, `sleep epochs: ${nS}   ·   wake epochs: ${c.W}   ·   TST = ${(nS * EPOCH_MIN).toFixed(1)} min`, { class: 'ann', 'font-size': 15 });
  }

  function render(cursor, step) {
    const binary = step === 2;
    hypnogram(cursor, binary);
    cursorMark(cursor, binary);
    if (step === 0) drawStrip(cursor); else if (step === 1) drawMetrics(cursor); else drawBinary(cursor);
  }

  const tt = $('tt');
  chart.addEventListener('mousemove', evt => {
    const pt = chart.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY;
    const p = pt.matrixTransform(chart.getScreenCTM().inverse());
    if (p.y < PT || p.y > hypBottom || p.x < PL || p.x > W - PR) { tt.style.display = 'none'; G.hover.innerHTML = ''; return; }
    const i = Math.max(0, Math.min(N - 1, Math.floor((p.x - PL) / (W - PL - PR) * N)));
    G.hover.innerHTML = '';
    el('line', { class: 'crosshair', x1: xs(i), x2: xs(i), y1: PT, y2: hypBottom }, G.hover);
    const s = lab[i];
    tt.innerHTML = `<div class="row"><span>epoch</span><b>${i}</b></div><div class="row"><span>time</span><span>${(i * EPOCH_MIN).toFixed(1)} min</span></div><div class="row"><span><i class="sw" style="background:${s ? STAGE[s].hex : '#ddd'}"></i>stage</span><span>${s ? STAGE[s].n : 'unscored'}</span></div>`;
    tt.style.display = 'block';
    const wrap = chart.parentElement.getBoundingClientRect();
    const px = evt.clientX - wrap.left, py = evt.clientY - wrap.top;
    tt.style.left = (px + 16 + tt.offsetWidth > wrap.width ? px - tt.offsetWidth - 12 : px + 16) + 'px';
    tt.style.top = Math.max(0, py - 10) + 'px';
  });
  chart.addEventListener('mouseleave', () => { tt.style.display = 'none'; G.hover.innerHTML = ''; });

  loadSubject();
  makeEngine({
    steps, enter, render, speedDefault: '40',
    dials: [{ id: 'subject', def: '1066528' }],
    onDial: (id, v) => { if (id === 'subject') { subject = v; loadSubject(); } },
  });

})();
</script>
</body>
</html>

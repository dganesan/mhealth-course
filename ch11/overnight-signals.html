<style>
  :root {
    color-scheme: light;
    --paper: #ffffff; --ink: #222222; --ink-2: #666666; --ink-3: #9a9a9a;

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.4; padding-block: 10px 10px; padding-inline: 14px; -webkit-font-smoothing: antialiased; }

  .slide:focus-visible { box-shadow: 0 0 0 3px rgba(42,120,214,.35); }
  .head h1 { margin: 0; font-size: clamp(20px, 2.2vw, 28px); font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; line-height: 1.15; }
  .head h1 .tag { display: inline-block; font-family: var(--mono); font-weight: 400; font-size: 0.6em; color: var(--ink-2); margin-left: 10px; vertical-align: middle; background: #f4f4f4; padding: 2px 8px; border-radius: 4px; }

  .chart-wrap { position: relative; min-height: 0; height: 100%; display: flex; justify-content: center; align-items: center; }
  svg.chart { display: block; height: 100%; width: auto; max-width: 100%; max-height: 100%; overflow: visible; }
  .tt { position: absolute; pointer-events: none; display: none; background: #fff; border: 1px solid var(--rule); border-radius: 4px; padding: 6px 9px; font-family: var(--mono); font-size: 12px; color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,.08); white-space: nowrap; z-index: 2; }

  .tt .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .foot { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--ink-3); padding-top: 4px; }
  .foot .ctr { font-family: var(--mono); }

  button.primary { background:var(--ma); color:#fff; border-color:var(--ma); min-width:88px; font-weight:700; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline:2px solid var(--ma); outline-offset:2px; }

  .hint { margin-left:auto; color:var(--ink-2); font-size:12px; }
  .hint kbd { font-family:var(--mono); background:#fff; border:1px solid var(--rule); border-radius:3px; padding:0 5px; font-size:11px; }
  .grid line { stroke: var(--grid); stroke-width: 1; }
  .axis line, .axis path { stroke: var(--ink-2); stroke-width: 1; fill: none; }
  .axis text { font-family: var(--mono); font-size: 12px; fill: var(--ink-2); }
  .axis-title { font-family: var(--sans); font-size: 12px; fill: var(--ink-2); }
  .mono { font-family: var(--mono); }
  .dlabel { font-family: var(--sans); font-size: 13px; font-weight: 700; }
  .ann { font-family: var(--mono); font-size: 13px; fill: var(--ink); }
  .win-rect { fill: var(--window); stroke: var(--window-edge); stroke-width: 1; stroke-dasharray: 3 3; }

      for (let i = 0; i <= cursor; i++) { const v = D.hr[i]; if (v == null) { pen = false; continue; } d += (pen ? 'L' : 'M') + xs(D.ei[i] + 0.5).toFixed(1) + ',' + yHr(v).toFixed(1); pen = true; }
      el('path', { d, fill: 'none', stroke: 'var(--ma)', 'stroke-width': 1.6 }, G.lines);
      const v = D.hr[cursor];
      if (v != null) {
        const x = xs(D.ei[cursor] + 0.5), y = yHr(v);
        el('circle', { cx: x, cy: y, r: 4, fill: 'var(--ma)', stroke: '#fff', 'stroke-width': 1.5 }, G.cur);
        const right = cursor > N * 0.7;
        txt(G.cur, x + (right ? -10 : 10), Math.max(P.hr.y0 + 14, y - 10), `HR = ${v} bpm`, { class: 'dlabel', fill: 'var(--ma)', 'text-anchor': right ? 'end' : 'start' });
      }
    }
    const s = code2stage(D.stage[cursor]); const k = P.act ? 'act' : 'hr';
    const x = xs(D.ei[cursor] + 1);
    el('line', { class: 'crosshair', x1: x, x2: x, y1: P[k].y0, y2: P[Object.keys(P).pop()].y1 }, G.cur);
    txt(G.cur, x + (cursor > N * 0.7 ? -8 : 8), P[Object.keys(P).pop()].y1 - 8, `epoch ${cursor} · ${((D.ei[cursor] - E0) / 120).toFixed(2)} h · ${STAGE[s].n}`, { class: 'dlabel', fill: STAGE[s].c, 'text-anchor': cursor > N * 0.7 ? 'end' : 'start' });
  }

  const tt = $('tt');
  chart.addEventListener('mousemove', evt => {
    const pt = chart.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY;
    const p = pt.matrixTransform(chart.getScreenCTM().inverse());
    if (p.x < PL || p.x > W - PR) { tt.style.display = 'none'; G.hover.innerHTML = ''; return; }
    const e = E0 + (p.x - PL) / (W - PL - PR) * (E1 - E0);
    let i = 0, best = 1e9; for (let j = 0; j < N; j++) { const dd = Math.abs(D.ei[j] + 0.5 - e); if (dd < best) { best = dd; i = j; } }
    G.hover.innerHTML = '';
    el('line', { class: 'crosshair', x1: xs(D.ei[i] + 0.5), x2: xs(D.ei[i] + 0.5), y1: PT, y2: H - PB - 20 }, G.hover);
    const s = code2stage(D.stage[i]);
    tt.innerHTML = `<div class="row"><span>epoch</span><b>${i}</b></div><div class="row"><span>time</span><span>${((D.ei[i] - E0) / 120).toFixed(2)} h</span></div><div class="row"><span><i class="sw" style="background:${STAGE[s].hex}"></i>PSG stage</span><span>${STAGE[s].n}</span></div><div class="row"><span><i class="sw" style="background:#222"></i>MAD</span><span>${(D.mad[i] / 1e6).toFixed(4)} g</span></div><div class="row"><span><i class="sw" style="background:#2a78d6"></i>heart rate</span><span>${D.hr[i] == null ? '–' : D.hr[i] + ' bpm'}</span></div>`;
    tt.style.display = 'block';
    const wrap = chart.parentElement.getBoundingClientRect();
    const px = evt.clientX - wrap.left, py = evt.clientY - wrap.top;
    tt.style.left = (px + 16 + tt.offsetWidth > wrap.width ? px - tt.offsetWidth - 12 : px + 16) + 'px';
    tt.style.top = Math.max(0, py - 10) + 'px';
  });
  chart.addEventListener('mouseleave', () => { tt.style.display = 'none'; G.hover.innerHTML = ''; });

  loadSubject();
  makeEngine({ steps, enter, render, speedDefault: '30', dials: [{ id: 'subject', def: '46343' }], onDial: (id, v) => { if (id === 'subject') { subject = v; loadSubject(); } } });

})();
</script>

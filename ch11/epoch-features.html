<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Per-Epoch Motion Features</title>
</head>
<body>
<style>
  :root {
    color-scheme: light;
    --paper: #ffffff; --ink: #222222; --ink-2: #666666; --ink-3: #9a9a9a;
    --rule: #dcdcdc; --grid: #ececec; --raw: #b4b4b4; --raw-dot: #8c8c8c; --clean: #444444;
    --window: rgba(34, 34, 34, 0.06); --window-edge: #222222;
    --ma: #2a78d6; --med: #1baf7a; --wm: #4a3aa7; --ewma: #eb6834;
    --wake: #eb6834; --light: #2a78d6; --deep: #4a3aa7; --rem: #1baf7a; --sleep: #2a78d6;
    --sans: "Helvetica Neue", Helvetica, -apple-system, Arial, sans-serif;
    --mono: Menlo, "SF Mono", Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.4; padding-block: 10px 10px; padding-inline: 14px; -webkit-font-smoothing: antialiased; }
  .stage { max-width: 1880px; margin: 0 auto; display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 10px; height: calc(100vh - 20px); }
  .slide { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 16px 30px 8px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 6px; min-height: 0; position: relative; outline: none; cursor: pointer; user-select: none; }
  .slide:focus-visible { box-shadow: 0 0 0 3px rgba(42,120,214,.35); }
  .head h1 { margin: 0; font-size: clamp(20px, 2.2vw, 28px); font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; line-height: 1.15; }
  .head h1 .tag { display: inline-block; font-family: var(--mono); font-weight: 400; font-size: 0.6em; color: var(--ink-2); margin-left: 10px; vertical-align: middle; background: #f4f4f4; padding: 2px 8px; border-radius: 4px; }
  .head p { margin: 6px 0 0; color: #444; font-size: clamp(15px, 1.6vw, 18px); max-width: none; }
  .chart-wrap { position: relative; min-height: 0; height: 100%; display: flex; justify-content: center; align-items: center; }
  .code { margin: 8px 0 0; font-family: var(--mono); font-size: clamp(13px, 1.35vw, 16px); color: var(--ink); background: #f4f6f9; border: 1px solid var(--rule); border-radius: 5px; padding: 6px 12px; white-space: pre; overflow-x: auto; }
  .code[hidden] { display: none; }
  .code .p { color: var(--ma); font-weight: 700; }
  svg.chart { display: block; height: 100%; width: auto; max-width: 100%; max-height: 100%; overflow: visible; }
  .tt { position: absolute; pointer-events: none; display: none; background: #fff; border: 1px solid var(--rule); border-radius: 4px; padding: 6px 9px; font-family: var(--mono); font-size: 12px; color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,.08); white-space: nowrap; z-index: 2; }
  .tt .row { display: flex; gap: 10px; justify-content: space-between; }
  .tt .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .foot { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--ink-3); padding-top: 4px; }
  .foot .ctr { font-family: var(--mono); }
  .bar { display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; padding:9px 14px; border:1px solid var(--rule); border-radius:6px; background:#f6f7f9; font-size:14px; color:var(--ink); }
  .group { display:flex; align-items:center; gap:8px; }
  .group label { font-size:13px; font-weight:700; color:var(--ink); }
  .val { font-family:var(--mono); font-size:14px; font-weight:700; color:var(--ma); min-width:5ch; }
  button, select { font:inherit; font-size:14px; color:var(--ink); background:#fff; border:1px solid #9a9a9a; border-radius:5px; padding:7px 13px; cursor:pointer; }
  button:hover, select:hover { border-color:var(--ink); }
  button.primary { background:var(--ma); color:#fff; border-color:var(--ma); min-width:88px; font-weight:700; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline:2px solid var(--ma); outline-offset:2px; }
  input[type=range] { accent-color:var(--ma); width:150px; height:30px; cursor:pointer; }
  .hint { margin-left:auto; color:var(--ink-2); font-size:12px; }
  .hint kbd { font-family:var(--mono); background:#fff; border:1px solid var(--rule); border-radius:3px; padding:0 5px; font-size:11px; }
  .grid line { stroke: var(--grid); stroke-width: 1; }
  .axis line, .axis path { stroke: var(--ink-2); stroke-width: 1; fill: none; }
  .axis text { font-family: var(--mono); font-size: 12px; fill: var(--ink-2); }
  .axis-title { font-family: var(--sans); font-size: 12px; fill: var(--ink-2); }
  .mono { font-family: var(--mono); }
  .dlabel { font-family: var(--sans); font-size: 13px; font-weight: 700; }
  .ann { font-family: var(--mono); font-size: 13px; fill: var(--ink); }
  .win-rect { fill: var(--window); stroke: var(--window-edge); stroke-width: 1; stroke-dasharray: 3 3; }
  .crosshair { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 2 2; }
  @media (max-width: 720px) { .slide { padding: 18px 16px 12px; min-height: 0; } .hint { display: none; } }
  .hint { display:none !important; }
  button.tb { min-width:44px; padding:6px 10px; font-size:17px; line-height:1; }
  button.primary.tb { min-width:52px; }
</style>
<div class="stage">
  <section class="slide" id="slide" tabindex="0" aria-live="polite">
    <div class="head">
      <h1 id="title"></h1>
      <p id="subtitle"></p>
      <pre class="code" id="code" hidden></pre>
    </div>
    <div class="chart-wrap">
      <svg class="chart" id="chart" viewBox="0 0 1200 660" role="img" aria-label="Per-epoch motion features"></svg>
      <div class="tt" id="tt"></div>
    </div>
    <div class="foot">
      <span>CS328 &nbsp;·&nbsp; Measuring Sleep Patterns</span>
      <span class="ctr" id="counter"></span>
    </div>
  </section>
  <div class="bar">
    <div class="group">
      <button id="prev" class="tb" title="Previous step (←)">⏮</button>
      <button id="play" class="primary tb" title="Play / pause (space)">▶</button>
      <button id="next" class="tb" title="Next step (→)">⏭</button>
      <button id="restart" class="tb" title="Restart this step (r)">↺</button>
      <button id="reset" title="Reset all dials to defaults">Reset dials</button>
    </div>
    <div class="group">
      <label for="thr">Count threshold</label>
      <select id="thr">
        <option value="c01">0.01 g</option>
        <option value="c02">0.02 g</option>
        <option value="cnt" selected>0.05 g</option>
        <option value="c10">0.10 g</option>
      </select>
    </div>
    <div class="group">
      <label for="roll">Rolling window</label>
      <input type="range" id="roll" min="1" max="30" step="1" value="10">
      <span class="val" id="rollVal">10 min</span>
    </div>
    <div class="group">
      <label for="yscale">Feature axis</label>
      <select id="yscale">
        <option value="lin" selected>linear</option>
        <option value="log">log</option>
      </select>
    </div>
    <div class="group">
      <label for="speed">Speed</label>
      <select id="speed">
        <option value="3">very slow</option>
        <option value="6">slow</option>
        <option value="14" selected>normal</option>
        <option value="40">fast</option>
        <option value="0">instant</option>
      </select>
    </div>
    <span class="hint"><kbd>→</kbd> finish / next &nbsp; <kbd>←</kbd> back &nbsp; <kbd>space</kbd> play</span>
  </div>
</div>

    if (mode === 'mad' || mode === 'roll') {
      const r = { y0: BOT.y0, y1: BOT.y1, lo: 1e-4 }; const mx = featRange(['mad']);
      featAxes(G.feat, r, 'mad', mx, xsL, xr); G.panels.push({ k: 'mad', r, mx });
    } else {
      const keys = ['mx', 'sd', 'p95', 'cnt'], gapY = 44, hgt = (BOT.y1 - BOT.y0 - gapY) / 2;
      keys.forEach((k, j) => {
        const r = { y0: BOT.y0 + (j >= 2 ? hgt + gapY : 0), y1: BOT.y0 + (j >= 2 ? hgt + gapY : 0) + hgt, lo: k === 'cnt' ? 1 : 1e-4 };
        const mx = Math.max(featRange([k]), k === 'cnt' ? 10 : 1e-3);
        const gg = el('g', {}, G.feat);
        // two columns: shift x for odd panels by splitting the left region in two
        const colW = (xr - PL - 40) / 2, x0 = PL + (j % 2) * (colW + 40);
        r.xfun = e => x0 + ((e - E0) / (E1 - E0)) * colW; r.xr = x0 + colW; r.x0 = x0;
        const grid = el('g', { class: 'grid' }, gg), axis = el('g', { class: 'axis' }, gg);
        for (let q = 0; q <= 2; q++) { const v = mx * q / 2, y = yFeat(r, v, mx); el('line', { x1: x0, x2: r.xr, y1: y, y2: y }, grid); txt(axis, x0 - 6, y + 4, k === 'cnt' ? Math.round(v) : F[k].fmt(v), { 'text-anchor': 'end', 'font-size': 11 }); }
        if (yscale === 'log') { gg.querySelector('.grid').innerHTML = ''; gg.querySelector('.axis').innerHTML = ''; for (let p = Math.ceil(Math.log10(r.lo)); Math.pow(10, p) <= mx; p++) { const v = Math.pow(10, p), y = yFeat(r, v, mx); el('line', { x1: x0, x2: r.xr, y1: y, y2: y }, grid); txt(axis, x0 - 6, y + 4, k === 'cnt' ? v : v.toExponential(0), { 'text-anchor': 'end', 'font-size': 11 }); } }
        for (let hh = 0; hh <= (E1 - E0) / 120; hh += 1) { const x = r.xfun(E0 + hh * 120); txt(axis, x, r.y1 + 14, hh, { 'text-anchor': 'middle', 'font-size': 11 }); }
        el('path', { d: `M${x0},${r.y0}V${r.y1}H${r.xr}` }, axis);
        txt(gg, x0, r.y0 - 6, `${F[k].n} (${F[k].unit})` + (k === 'cnt' ? `, x > ${thrVal().toFixed(2)} g` : '') + (yscale === 'log' ? ', log' : '') + clipped(k), { class: 'axis-title' });
        G.panels.push({ k, r, mx, g: gg });
      });
    }
    G.series = el('g', {}, chart);
    G.zoom = el('g', {}, chart);
    G.hover = el('g', {}, chart);
    if (mode === 'roll') legend(el('g', {}, chart), PL + 12, BOT.y0 + 8, [{ c: 'var(--raw)', n: 'MAD per epoch' }, { c: 'var(--ma)', n: `rolling mean over ${rollW()} epochs` }, { c: 'var(--window-edge)', n: 'rolling window', dash: true }]);
    else if (mode === 'mad') legend(el('g', {}, chart), PL + 12, BOT.y0 + 8, [{ c: 'var(--ma)', n: 'MAD per epoch' }]);
    el('rect', { x: PL, y: PT, width: W - PL - PR, height: TOP.y1 - PT, fill: 'transparent' }, chart);
  }

  function drawZoom(i) {
    G.zoom.innerHTML = '';
    if (i < 0) return;
    const zy0 = BOT.y0, zy1 = BOT.y1 - 60, zx0 = ZX0, zx1 = ZX0 + ZW;
    const vals = []; for (let j = 0; j < NB; j++) vals.push(D.bins2s[i * NB + j] / 1e4);
    const mx = Math.max(0.02, Math.max(...vals) * 1.15, thrVal() * 1.15);
    const yz = v => zy1 - (v / mx) * (zy1 - zy0);
    el('rect', { x: zx0, y: zy0, width: ZW, height: zy1 - zy0, fill: '#fafafa', stroke: 'var(--rule)' }, G.zoom);
    txt(G.zoom, zx0, zy0 - 6, `epoch ${i} · ${NB} bins of 2 s (max per bin)`, { class: 'axis-title' });
    const bw = ZW / NB;
    vals.forEach((v, j) => el('rect', { x: zx0 + j * bw + 1, y: yz(v), width: bw - 2, height: zy1 - yz(v), fill: 'var(--raw-dot)', opacity: 0.8 }, G.zoom));
    const s = code2stage(D.stage[i]);
    el('rect', { x: zx0, y: zy0, width: ZW, height: 6, fill: STAGE[s].c, opacity: 0.6 }, G.zoom);
    txt(G.zoom, zx1, zy0 + 18, STAGE[s].n, { class: 'dlabel', fill: STAGE[s].c, 'text-anchor': 'end' });
    if (mode === 'multi') { const yt = yz(thrVal()); el('line', { x1: zx0, x2: zx1, y1: yt, y2: yt, stroke: 'var(--ewma)', 'stroke-dasharray': '4 3' }, G.zoom); txt(G.zoom, zx0 + 4, yt - 4, `threshold ${thrVal().toFixed(2)} g`, { class: 'axis-title', fill: 'var(--ewma)' }); }
    txt(G.zoom, zx0, zy1 + 14, `y max ${mx.toFixed(2)} g`, { class: 'axis-title', 'font-size': 11 });
    // readouts
    let ry = zy1 + 34;
    const rows = mode === 'multi' ? ['mx', 'sd', 'p95', 'cnt'] : ['mad'];
    rows.forEach(k => { txt(G.zoom, zx0, ry, `${F[k].n} = ${F[k].fmt(F[k].get(i))} ${F[k].unit}`, { class: 'ann', 'font-size': 13, fill: k === 'mad' ? 'var(--ma)' : 'var(--ink)' }); ry += 18; });
    if (mode === 'mad') txt(G.zoom, zx0, ry, F.mad.formula, { class: 'ann', 'font-size': 12, fill: 'var(--ink-2)' });
    if (mode === 'roll') { txt(G.zoom, zx0, ry, `rolling mean = ${rollSeries[i].toFixed(4)} g`, { class: 'ann', 'font-size': 13, fill: 'var(--ma)' }); }
  }

  function render(cursor) {
    G.win.innerHTML = ''; G.series.innerHTML = '';
    if (cursor < 0) { drawZoom(-1); return; }
    // window on the top panel
    const e = D.ei[cursor];
    el('rect', { class: 'win-rect', x: xs(e), y: TOP.y0 + 1, width: Math.max(2, xs(e + 1) - xs(e)), height: TOP.y1 - TOP.y0 - 2 }, G.win);
    const t = txt(G.win, xs(e) + (cursor > N * 0.7 ? -6 : 8), TOP.y1 - 8, `epoch ${cursor} · ${((e - E0) / 120).toFixed(2)} h`, { class: 'dlabel', fill: 'var(--ink)', 'text-anchor': cursor > N * 0.7 ? 'end' : 'start' });
    // feature series
    G.panels.forEach(p => {
      const xf = p.r.xfun || xsL;
      let d = ''; for (let i = 0; i <= cursor; i++) d += (i ? 'L' : 'M') + xf(D.ei[i] + 0.5).toFixed(1) + ',' + yFeat(p.r, F[p.k].get(i), p.mx).toFixed(1);
      const isRoll = mode === 'roll';
      el('path', { d, fill: 'none', stroke: isRoll ? 'var(--raw)' : 'var(--ma)', 'stroke-width': isRoll ? 1.2 : 1.5 }, G.series);
      if (isRoll) {
        let dr = ''; for (let i = 0; i <= cursor; i++) dr += (i ? 'L' : 'M') + xf(D.ei[i] + 0.5).toFixed(1) + ',' + yFeat(p.r, rollSeries[i], p.mx).toFixed(1);
        el('path', { d: dr, fill: 'none', stroke: 'var(--ma)', 'stroke-width': 2.5, 'stroke-linejoin': 'round' }, G.series);
        const w = rollW(), i0 = Math.max(0, cursor - w + 1);
        el('rect', { class: 'win-rect', x: xf(D.ei[i0]), y: p.r.y0 + 1, width: Math.max(2, xf(D.ei[cursor] + 1) - xf(D.ei[i0])), height: p.r.y1 - p.r.y0 - 2 }, G.series);
        el('circle', { cx: xf(D.ei[cursor] + 0.5), cy: yFeat(p.r, rollSeries[cursor], p.mx), r: 4.5, fill: 'var(--ma)', stroke: '#fff', 'stroke-width': 1.5 }, G.series);
      } else {
        el('circle', { cx: xf(D.ei[cursor] + 0.5), cy: yFeat(p.r, F[p.k].get(cursor), p.mx), r: 4, fill: 'var(--ma)', stroke: '#fff', 'stroke-width': 1.5 }, G.series);
      }
      const xr = p.r.xr || (ZX0 - 30);
      el('line', { class: 'crosshair', x1: xf(D.ei[cursor] + 0.5), x2: xf(D.ei[cursor] + 0.5), y1: p.r.y0, y2: p.r.y1 }, G.series);
    });
    // connector from window to zoom
    el('path', { d: `M${xs(e + 0.5)},${TOP.y1}L${ZX0 + ZW / 2},${BOT.y0 - 10}`, stroke: 'var(--ink-3)', 'stroke-dasharray': '2 3', fill: 'none' }, G.win);
    drawZoom(cursor);
  }

  const tt = $('tt');
  chart.addEventListener('mousemove', evt => {
    const pt = chart.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY;
    const p = pt.matrixTransform(chart.getScreenCTM().inverse());
    if (p.x < PL || p.x > W - PR || p.y < TOP.y0 || p.y > TOP.y1) { tt.style.display = 'none'; G.hover.innerHTML = ''; return; }
    const e = E0 + (p.x - PL) / (W - PL - PR) * (E1 - E0);
    let i = Math.max(0, Math.min(N - 1, Math.floor(e - E0)));
    G.hover.innerHTML = '';
    el('line', { class: 'crosshair', x1: xs(D.ei[i] + 0.5), x2: xs(D.ei[i] + 0.5), y1: TOP.y0, y2: TOP.y1 }, G.hover);
    const s = code2stage(D.stage[i]);
    tt.innerHTML = `<div class="row"><span>epoch</span><b>${i}</b></div><div class="row"><span><i class="sw" style="background:${STAGE[s].hex}"></i>PSG stage</span><span>${STAGE[s].n}</span></div>` + ['mad', 'mx', 'sd', 'p95', 'cnt'].map(k => `<div class="row"><span>${F[k].n}</span><span>${F[k].fmt(F[k].get(i))}</span></div>`).join('') + `<div class="row"><span>rolling MAD</span><span>${rollSeries[i].toFixed(4)}</span></div>`;
    tt.style.display = 'block';
    const wrap = chart.parentElement.getBoundingClientRect();
    const px = evt.clientX - wrap.left, py = evt.clientY - wrap.top;
    tt.style.left = (px + 16 + tt.offsetWidth > wrap.width ? px - tt.offsetWidth - 12 : px + 16) + 'px';
    tt.style.top = Math.max(0, py - 10) + 'px';
  });
  chart.addEventListener('mouseleave', () => { tt.style.display = 'none'; G.hover.innerHTML = ''; });

  makeEngine({ steps, enter, render, speedDefault: '14',
    dials: [{ id: 'thr', def: 'cnt' }, { id: 'roll', def: 10 }, { id: 'yscale', def: 'lin' }],
    onDial: (id, v) => { if (id === 'thr') thrKey = v; else if (id === 'roll') { rollMin = parseInt(v, 10); $('rollVal').textContent = rollMin + ' min'; } else if (id === 'yscale') yscale = v; } });

})();
</script>
</body>
</html>

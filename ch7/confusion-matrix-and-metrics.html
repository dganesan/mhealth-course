<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confusion Matrix and Metrics</title>
</head>
<body>
<style>
  :root {
    color-scheme: light;
    --paper: #ffffff; --ink: #222222; --ink-2: #666666; --ink-3: #9a9a9a; --rule: #dcdcdc; --grid: #ececec; --ma: #2a78d6;
    --sans: "Helvetica Neue", Helvetica, -apple-system, Arial, sans-serif;
    --mono: Menlo, "SF Mono", Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  #app { height: 100vh; padding: 10px 14px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px; }
  .head { padding: 4px 16px 0; }
  h1 { margin: 0; font-size: clamp(24px, 2.4vw, 36px); font-weight: 700; letter-spacing: -0.01em; }
  .main { user-select: none; -webkit-user-select: none; min-height: 0; border: 1px solid var(--rule); border-radius: 6px; padding: 10px 16px; }
  .main svg { width: 100%; height: 100%; display: block; }
  svg text { font-family: var(--sans); }
  .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 18px; border: 1px solid var(--rule); border-radius: 6px; background: #f6f7f9; }
  button { font: inherit; font-size: 18px; color: var(--ink); background: #fff; border: 1px solid #9a9a9a; border-radius: 6px; padding: 9px 16px; cursor: pointer; }
  button:hover { border-color: var(--ink); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--ma); color: #fff; border-color: var(--ma); font-weight: 700; min-width: 120px; }
  .ctl { display: inline-flex; align-items: center; gap: 10px; margin-left: 10px; flex: 1; max-width: 640px; }
  .ctl .lbl { font-family: var(--mono); font-size: 17px; color: var(--ink-2); white-space: nowrap; }
  .ctl b { font-family: var(--mono); font-size: 18px; color: var(--ma); min-width: 3ch; }
  input[type=range] { flex: 1; accent-color: var(--ma); height: 26px; }
  .step { font-family: var(--mono); font-size: 17px; color: var(--ink-2); margin-left: auto; }
  .hide { display: none !important; }
</style>

<div id="app">
  <div class="head"><h1 id="title"></h1></div>
  <div class="main"><svg id="fig" viewBox="0 0 1600 760"></svg></div>
  <div class="bar">
    <button id="prev" title="Previous step (←)">⏮ step</button>
    <button id="next" title="Next step (→)">step ⏭</button>
    <button id="play" class="primary" title="Play again (space)">▶ Play</button>
    <span class="ctl" id="c-p"><span class="lbl">precision</span><input type="range" id="sp" min="0" max="100" step="1"><b id="v-p"></b></span>
    <span class="ctl" id="c-r"><span class="lbl">recall</span><input type="range" id="sr" min="0" max="100" step="1"><b id="v-r"></b></span>
    <span class="step" id="stepno"></span>
  </div>
</div>

<script>
(() => {
// ------------------------------------------------------------ shared by the chapter 7 pages (built by tools/ch7-pages/build.py)
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const el = (parent, tag, attrs, text) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; parent.appendChild(e); return e; };
const BLUE = '#2a78d6', DEEP = '#1d5fae', TINT = '#e8f1fd', GREY = '#9a9a9a', OK = '#1baf7a', BAD = '#d6453d';
const CLS = { W: { name: 'Walking', col: '#2a78d6' }, R: { name: 'Running', col: '#7a3fb0' } };
const clamp01 = v => Math.max(0, Math.min(1, v));
const ease = u => { u = clamp01(u); return u * u * (3 - 2 * u); };
// a rounded box with centred lines of text; kind is 'data' (grey), 'model' (white, blue edge), 'agg' (blue tint) or 'out' (blue tint, bold)
function box(g, cx, cy, w, h, lines, kind = 'model', o = {}) {
  const st = { data: ['#f6f7f9', GREY, '#222', 400], model: ['#fff', BLUE, '#222', 400], agg: [TINT, BLUE, DEEP, 700], out: [TINT, BLUE, DEEP, 700] }[kind];
  const b = el(g, 'g', { opacity: o.opacity == null ? 1 : o.opacity });
  el(b, 'rect', { x: cx - w / 2, y: cy - h / 2, width: w, height: h, rx: 12, fill: o.fill || st[0], stroke: o.stroke || st[1], 'stroke-width': kind === 'out' ? 3 : 2 });
  const fs = o.fs || 23, n = lines.length;
  lines.forEach((s, i) => el(b, 'text', { x: cx, y: cy + (o.dy || 0) + (i - (n - 1) / 2) * fs * 1.2 + fs * 0.36, 'text-anchor': 'middle', 'font-size': fs, 'font-weight': o.weight || st[3], fill: o.color || st[2] }, s));
  return b;
}
// an arrow from (x1,y1) to (x2,y2), drawn up to fraction u of its length
function arrow(g, x1, y1, x2, y2, u = 1, o = {}) {
  if (u <= 0) return;
  const x = x1 + (x2 - x1) * u, y = y1 + (y2 - y1) * u, a = Math.atan2(y2 - y1, x2 - x1), col = o.col || '#7a8ea8', w = o.w || 2.5;
  el(g, 'line', { x1, y1, x2: x - Math.cos(a) * 8, y2: y - Math.sin(a) * 8, stroke: col, 'stroke-width': w, 'stroke-dasharray': o.dash || 'none' });
  el(g, 'path', { d: `M${x},${y} L${x - Math.cos(a - 0.4) * 15},${y - Math.sin(a - 0.4) * 15} L${x - Math.cos(a + 0.4) * 15},${y - Math.sin(a + 0.4) * 15} Z`, fill: col });
}
// the small tree drawn in the book's figures: a root, two inner nodes, four leaves
function miniTree(g, cx, cy, s, col = BLUE, opacity = 1) {
  const t = el(g, 'g', { opacity });
  const P = { r: [0, -1], a: [-0.7, -0.3], b: [0.7, -0.3], l: [[-1, 0.4], [-0.4, 0.4], [0.4, 0.4], [1, 0.4]] }, X = p => cx + p[0] * s, Y = p => cy + p[1] * s;
  [[P.r, P.a], [P.r, P.b], [P.a, P.l[0]], [P.a, P.l[1]], [P.b, P.l[2]], [P.b, P.l[3]]].forEach(([p, q]) => el(t, 'line', { x1: X(p), y1: Y(p), x2: X(q), y2: Y(q), stroke: col, 'stroke-width': Math.max(1.5, s / 18) }));
  el(t, 'circle', { cx: X(P.r), cy: Y(P.r), r: s * 0.13, fill: col });
  [P.a, P.b].forEach(p => el(t, 'circle', { cx: X(p), cy: Y(p), r: s * 0.1, fill: col }));
  P.l.forEach(p => el(t, 'circle', { cx: X(p), cy: Y(p), r: s * 0.085, fill: col, 'fill-opacity': 0.75 }));
  return t;
}
// a numbered chip for one training window, coloured by its activity
function chip(g, x, y, id, c, o = {}) {
  const s = o.s || 1, w = 40 * s, h = 32 * s;
  const k = el(g, 'g', { opacity: o.opacity == null ? 1 : o.opacity });
  el(k, 'rect', { x: x - w / 2, y: y - h / 2, width: w, height: h, rx: 6 * s, fill: CLS[c].col, stroke: o.ring || 'none', 'stroke-width': o.ring ? 4 : 0 });
  el(k, 'text', { x, y: y + 7 * s, 'text-anchor': 'middle', 'font-size': 20 * s, 'font-weight': 700, fill: '#fff' }, id);
  return k;
}
// a seeded random generator, so a page shows the same draw every time it loads
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

// ------------------------------------------------------------ steps: each has a title, draw(g, t) and T, the length of its animation in seconds
// `ctl` lists the ids of the bar controls the step shows; Play runs the animation
let step = 0, t = 0, timer = null, STEPS = [];
function draw() {
  const S = STEPS[step], svg = $('fig'); svg.innerHTML = '';
  $('title').textContent = S.title; $('stepno').textContent = `step ${step + 1} of ${STEPS.length}`;
  $('prev').disabled = step === 0; $('next').disabled = step === STEPS.length - 1 && (!S.T || t >= S.T);
  $('play').classList.toggle('hide', !S.T); $('play').textContent = S.playLabel || '▶ Play';
  document.querySelectorAll('.ctl').forEach(c => c.classList.toggle('hide', !(S.ctl || []).includes(c.id)));
  S.draw(el(svg, 'g', {}), t);
}
function play() {
  const S = STEPS[step]; clearInterval(timer); t = 0; if (S.reset) S.reset();
  if (!S.T) { draw(); return; }
  const t0 = performance.now();
  timer = setInterval(() => { t = Math.min(S.T, (performance.now() - t0) / 1000); if (t >= S.T) clearInterval(timer); draw(); }, 30);
  draw();
}
// a step opens at the start of its animation and waits for Play; Back shows it finished
function go(s, back = false) {
  clearInterval(timer); step = Math.max(0, Math.min(STEPS.length - 1, s)); history.replaceState(null, '', '#' + (step + 1));
  if (STEPS[step].enter) STEPS[step].enter();
  t = back ? STEPS[step].T || 0 : 0; draw();
}
function start() {
  // stepping forward first shows the end of the current step's animation, then moves on
  const fwd = () => { const S = STEPS[step]; if (S.T && t < S.T) { clearInterval(timer); t = S.T; draw(); } else go(step + 1); };
  $('prev').onclick = () => go(step - 1, true); $('next').onclick = fwd; $('play').onclick = () => play();
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight') fwd(); else if (e.key === 'ArrowLeft') go(step - 1, true);
    else if (e.key === ' ' && STEPS[step].T) { e.preventDefault(); play(); }
  });
  go((parseInt(location.hash.slice(1), 10) || 1) - 1);
}

// ------------------------------------------------------------ chapter 7, "Beyond Accuracy": the screening example, the confusion matrix (Figure 7.4), accuracy,
// precision and recall read off the matrix, F1, balanced accuracy, and the sleep-stage practice example (Figure 7.5)
const HL = '#eb6834', SICK = '#d6453d', WELL = '#1baf7a';
const label = (g, x, y, s, o = {}) => el(g, 'text', Object.assign({ x, y, 'text-anchor': 'middle', 'font-size': 24, fill: '#222' }, o), s);
const pct = v => `${Math.round(100 * v)}%`;

// a condition present in 10% of patients, and a model that labels everyone healthy
function screening(g, t) {
  const X0 = 180, Y0 = 90, s = 56;
  for (let i = 0; i < 100; i++) {
    const sick = i % 10 === 7, x = X0 + (i % 10) * s, y = Y0 + Math.floor(i / 10) * s, u = clamp01((t - 0.5) / 0.6);
    el(g, 'circle', { cx: x, cy: y, r: 20, fill: sick ? SICK : WELL, opacity: 0.85 });
    if (u > 0) el(g, 'text', { x, y: y + 7, 'text-anchor': 'middle', 'font-size': 18, 'font-weight': 700, fill: '#fff', opacity: u }, sick ? '✗' : '✓');
  }
  label(g, X0 + 4.5 * s, Y0 + 10 * s + 20, '90 healthy, 10 with the condition', { 'font-size': 23, fill: '#444' });
  const PX = 920, k = el(g, 'g', { opacity: clamp01((t - 0.3) / 0.4) });
  el(k, 'text', { x: PX, y: 150, 'font-size': 26, 'font-weight': 700, fill: '#222' }, 'Model: label everyone healthy');
  const a = el(g, 'g', { opacity: clamp01((t - 1.3) / 0.4) }), b = el(g, 'g', { opacity: clamp01((t - 2.0) / 0.4) });
  el(a, 'text', { x: PX, y: 290, 'font-size': 24, fill: '#666' }, 'accuracy');
  el(a, 'text', { x: PX, y: 350, 'font-size': 56, 'font-weight': 700, fill: WELL }, '90%');
  el(b, 'text', { x: PX, y: 460, 'font-size': 24, fill: '#666' }, 'patients with the condition it finds');
  el(b, 'text', { x: PX, y: 520, 'font-size': 56, 'font-weight': 700, fill: SICK }, '0 of 10');
}

// a confusion matrix: rows are the true labels, columns the predicted labels; `mark` picks out cells
function matrix(g, M, names, o = {}) {
  const n = M.length, cs = o.cs || 104, X0 = o.x || 300, Y0 = o.y || 120, mx = Math.max(...M.flat()), show = o.show == null ? n * n : o.show;
  label(g, X0 + n * cs / 2, Y0 - 70, 'predicted label', { 'font-size': 22, fill: '#444' });
  el(g, 'text', { x: X0 - 165, y: Y0 + n * cs / 2, 'text-anchor': 'middle', 'font-size': 22, fill: '#444', transform: `rotate(-90 ${X0 - 165} ${Y0 + n * cs / 2})` }, 'actual label');
  names.forEach((s, j) => { label(g, X0 + j * cs + cs / 2, Y0 - 20, s, { 'font-size': o.fs || 19, fill: '#444' }); el(g, 'text', { x: X0 - 14, y: Y0 + j * cs + cs / 2 + 7, 'text-anchor': 'end', 'font-size': o.fs || 19, fill: '#444' }, s); });
  M.forEach((row, i) => row.forEach((v, j) => {
    const on = !o.mark || o.mark(i, j), seen = i * n + j < show, f = v / mx;
    el(g, 'rect', { x: X0 + j * cs + 2, y: Y0 + i * cs + 2, width: cs - 4, height: cs - 4, rx: 6, fill: seen ? `rgba(42,120,214,${(0.07 + 0.75 * f).toFixed(3)})` : '#f6f7f9', opacity: on ? 1 : 0.22, stroke: o.ring && o.ring(i, j) ? HL : 'none', 'stroke-width': 5 });
    if (seen) label(g, X0 + j * cs + cs / 2, Y0 + i * cs + cs / 2 + 9, v, { 'font-size': o.vs || 27, 'font-weight': i === j ? 700 : 400, fill: on && f > 0.55 ? '#fff' : '#222', opacity: on ? 1 : 0.3 });
  }));
  return { X0, Y0, cs, n };
}
const HAR = [[20, 10, 10, 0, 0], [5, 30, 4, 0, 1], [5, 5, 30, 0, 0], [0, 0, 0, 35, 5], [0, 0, 0, 2, 5]], HN = ['Sitting', 'Standing', 'Driving', 'Running', 'Walking'];
const diag = M => M.reduce((s, r, i) => s + r[i], 0), total = M => M.flat().reduce((a, b) => a + b, 0);
const colSum = (M, j) => M.reduce((s, r) => s + r[j], 0), rowSum = (M, i) => M[i].reduce((a, b) => a + b, 0);

function build(g, t) { matrix(g, HAR, HN, { show: Math.floor(t / 0.12) }); }
function accuracy(g, t) {
  const u = clamp01(t / 0.6);
  matrix(g, HAR, HN, { mark: (i, j) => u < 1 || i === j, ring: (i, j) => u >= 1 && i === j });
  const k = el(g, 'g', { opacity: clamp01((t - 0.6) / 0.5) });
  el(k, 'text', { x: 960, y: 300, 'font-size': 26, fill: '#666' }, 'accuracy = diagonal / total');
  el(k, 'text', { x: 960, y: 370, 'font-size': 40, 'font-weight': 700, fill: HL }, `${diag(HAR)} / ${total(HAR)} = ${pct(diag(HAR) / total(HAR))}`);
}
// precision reads down a column, recall across a row; Play moves on to the next class
let cls = 4;
function perClass(kind) {
  return (g, t) => {
    const c = cls, num = HAR[c][c], den = kind === 'p' ? colSum(HAR, c) : rowSum(HAR, c), u = clamp01(t / 0.6);
    matrix(g, HAR, HN, { mark: (i, j) => u < 1 || (kind === 'p' ? j === c : i === c), ring: (i, j) => u >= 1 && i === c && j === c });
    const k = el(g, 'g', { opacity: clamp01((t - 0.5) / 0.5) });
    el(k, 'text', { x: 960, y: 230, 'font-size': 28, 'font-weight': 700, fill: '#222' }, `${kind === 'p' ? 'precision' : 'recall'} for ${HN[c]}`);
    el(k, 'text', { x: 960, y: 290, 'font-size': 23, fill: '#666' }, kind === 'p' ? `of everything predicted ${HN[c]}, how much was ${HN[c]}?` : `of every actual ${HN[c]}, how much did the model find?`);
    el(k, 'text', { x: 960, y: 380, 'font-size': 26, fill: '#444' }, kind === 'p' ? 'diagonal cell / column total' : 'diagonal cell / row total');
    el(k, 'text', { x: 960, y: 450, 'font-size': 40, 'font-weight': 700, fill: HL }, `${num} / ${den} = ${(num / den).toFixed(2)}`);
  };
}
const nextClass = { reset() { cls = (cls + 1) % 5; }, enter() { cls = 4; } };

// F1: the harmonic mean, set by the two sliders; the book's case is precision 1.0 and recall 0.01
let P = 1, Rc = 0.01;
function f1(g) {
  const ar = (P + Rc) / 2, F = P + Rc ? 2 * P * Rc / (P + Rc) : 0, X0 = 280, Y1 = 640, H = 480, bw = 220;
  [['precision', P, '#2a78d6'], ['recall', Rc, '#2a78d6'], ['arithmetic mean', ar, '#9a9a9a'], ['F1', F, HL]].forEach(([n, v, col], i) => {
    const x = X0 + i * (bw + 90);
    el(g, 'rect', { x, y: Y1 - H * v, width: bw, height: H * v, rx: 6, fill: col, opacity: 0.85 });
    label(g, x + bw / 2, Y1 - H * v - 16, i < 2 ? v.toFixed(2) : v ? (+v.toPrecision(3)).toString() : '0', { 'font-size': 30, 'font-weight': 700, fill: i === 3 ? HL : '#222' });
    label(g, x + bw / 2, Y1 + 40, n, { 'font-size': 25, 'font-weight': i === 3 ? 700 : 400, fill: i === 3 ? HL : '#444' });
  });
  el(g, 'line', { x1: X0 - 30, x2: X0 + 4 * (bw + 90) - 60, y1: Y1, y2: Y1, stroke: '#9a9a9a', 'stroke-width': 2 });
  label(g, 800, 70, 'F1 = 2 · precision · recall / (precision + recall)', { 'font-size': 26, style: 'font-family: var(--mono)', fill: '#444' });
}
const syncF = () => { $('sp').value = Math.round(P * 100); $('sr').value = Math.round(Rc * 100); $('v-p').textContent = P.toFixed(2); $('v-r').textContent = Rc.toFixed(2); };

// balanced accuracy: 95% class A, 5% class B, a model that always predicts A
function balanced(g, t) {
  const M = [[95, 0], [5, 0]], m = matrix(g, M, ['A', 'B'], { x: 330, y: 220, cs: 150, vs: 34, fs: 24 }), u = s => clamp01((t - s) / 0.5);
  const X = 900, a = el(g, 'g', { opacity: u(0.2) }), b = el(g, 'g', { opacity: u(0.9) }), c = el(g, 'g', { opacity: u(1.6) });
  el(a, 'text', { x: X, y: 200, 'font-size': 25, fill: '#666' }, 'accuracy'); el(a, 'text', { x: X, y: 255, 'font-size': 40, 'font-weight': 700, fill: '#222' }, '95 / 100 = 95%');
  el(b, 'text', { x: X, y: 350, 'font-size': 25, fill: '#666' }, 'recall for A, recall for B'); el(b, 'text', { x: X, y: 405, 'font-size': 40, 'font-weight': 700, fill: '#222' }, '100%, 0%');
  el(c, 'text', { x: X, y: 500, 'font-size': 25, fill: '#666' }, 'balanced accuracy = mean of the recalls'); el(c, 'text', { x: X, y: 555, 'font-size': 40, 'font-weight': 700, fill: HL }, '(100% + 0%) / 2 = 50%');
}

// Figure 7.5: the sleep-stage classifier; Play works through each class, then the two summary numbers
const SL = [[630, 56, 9], [84, 228, 6], [12, 2, 48]], SN = ['Wakefulness', 'REM', 'NREM'];
function sleep(g, t) {
  const k = Math.min(3, Math.floor(t / 1.2)), c = t < 3.6 ? k : -1, done = t >= 3.6;
  matrix(g, SL, SN, { x: 330, y: 160, cs: 140, vs: 30, fs: 20, mark: (i, j) => c < 0 || i === c || j === c, ring: (i, j) => c >= 0 && i === c && j === c });
  const X = 950, rec = SL.map((r, i) => r[i] / rowSum(SL, i));
  el(g, 'text', { x: X + 210, y: 120, 'text-anchor': 'middle', 'font-size': 22, fill: '#444' }, 'precision'); el(g, 'text', { x: X + 400, y: 120, 'text-anchor': 'middle', 'font-size': 22, fill: '#444' }, 'recall');
  SN.forEach((n, i) => {
    if (i > k || (i === k && !done && t < i * 1.2 + 0.3)) return;
    const y = 200 + i * 90;
    el(g, 'text', { x: X, y, 'font-size': 24, 'font-weight': 700, fill: '#222' }, n);
    label(g, X + 210, y, (SL[i][i] / colSum(SL, i)).toFixed(2), { 'font-size': 28, 'font-weight': 700, style: 'font-family: var(--mono)' });
    label(g, X + 400, y, rec[i].toFixed(2), { 'font-size': 28, 'font-weight': 700, style: 'font-family: var(--mono)' });
  });
  if (!done) return;
  const ac = diag(SL) / total(SL), ba = rec.reduce((a, b) => a + b, 0) / 3;
  el(g, 'line', { x1: X, x2: X + 470, y1: 470, y2: 470, stroke: '#9a9a9a', 'stroke-width': 1.5 });
  el(g, 'text', { x: X, y: 530, 'font-size': 24, fill: '#666' }, 'accuracy'); el(g, 'text', { x: X + 470, y: 530, 'text-anchor': 'end', 'font-size': 32, 'font-weight': 700, fill: '#222' }, pct(ac));
  el(g, 'text', { x: X, y: 600, 'font-size': 24, fill: '#666' }, 'balanced accuracy'); el(g, 'text', { x: X + 470, y: 600, 'text-anchor': 'end', 'font-size': 32, 'font-weight': 700, fill: HL }, pct(ba));
}

STEPS = [
  { title: 'Why can a 90% accurate model still be poor?', T: 2.5, draw: screening },
  { title: 'What is a confusion matrix?', T: 25 * 0.12 + 0.2, draw: build },
  { title: 'How do we read accuracy off the matrix?', T: 1.2, draw: accuracy },
  { title: 'What is precision?', T: 1.1, draw: perClass('p'), playLabel: '▶ Next class', ...nextClass },
  { title: 'What is recall?', T: 1.1, draw: perClass('r'), playLabel: '▶ Next class', ...nextClass },
  { title: 'What does F1 add?', draw: f1, ctl: ['c-p', 'c-r'], enter() { P = 1; Rc = 0.01; syncF(); } },
  { title: 'What is balanced accuracy?', T: 2.2, draw: balanced },
  { title: 'How well does the sleep-stage classifier do?', T: 3.8, draw: sleep },
];
$('sp').addEventListener('input', () => { P = +$('sp').value / 100; syncF(); draw(); });
$('sr').addEventListener('input', () => { Rc = +$('sr').value / 100; syncF(); draw(); });
start();

})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Holdout and Cross-Validation</title>
</head>
<body>
<style>
  :root {
    color-scheme: light;
    --paper: #ffffff; --ink: #222222; --ink-2: #666666; --ink-3: #9a9a9a; --rule: #dcdcdc; --grid: #ececec; --ma: #2a78d6;
    --sans: "Helvetica Neue", Helvetica, -apple-system, Arial, sans-serif;
    --mono: Menlo, "SF Mono", Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  #app { height: 100vh; padding: 10px 14px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px; }
  .head { padding: 4px 16px 0; }
  h1 { margin: 0; font-size: clamp(24px, 2.4vw, 36px); font-weight: 700; letter-spacing: -0.01em; }
  .main { user-select: none; -webkit-user-select: none; min-height: 0; border: 1px solid var(--rule); border-radius: 6px; padding: 10px 16px; }
  .main svg { width: 100%; height: 100%; display: block; }
  svg text { font-family: var(--sans); }
  .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 18px; border: 1px solid var(--rule); border-radius: 6px; background: #f6f7f9; }
  button { font: inherit; font-size: 18px; color: var(--ink); background: #fff; border: 1px solid #9a9a9a; border-radius: 6px; padding: 9px 16px; cursor: pointer; }
  button:hover { border-color: var(--ink); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--ma); color: #fff; border-color: var(--ma); font-weight: 700; min-width: 120px; }
  .ctl { display: inline-flex; align-items: center; gap: 10px; margin-left: 10px; flex: 1; max-width: 640px; }
  .ctl .lbl { font-family: var(--mono); font-size: 17px; color: var(--ink-2); white-space: nowrap; }
  .ctl b { font-family: var(--mono); font-size: 18px; color: var(--ma); min-width: 3ch; }
  input[type=range] { flex: 1; accent-color: var(--ma); height: 26px; }
  .step { font-family: var(--mono); font-size: 17px; color: var(--ink-2); margin-left: auto; }
  .hide { display: none !important; }
</style>

<div id="app">
  <div class="head"><h1 id="title"></h1></div>
  <div class="main"><svg id="fig" viewBox="0 0 1600 760"></svg></div>
  <div class="bar">
    <button id="prev" title="Previous step (←)">⏮ step</button>
    <button id="next" title="Next step (→)">step ⏭</button>
    <button id="play" class="primary" title="Play again (space)">▶ Play</button>

    <span class="step" id="stepno"></span>
  </div>
</div>

<script>
(() => {
// ------------------------------------------------------------ shared by the chapter 7 pages (built by tools/ch7-pages/build.py)
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const el = (parent, tag, attrs, text) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; parent.appendChild(e); return e; };
const BLUE = '#2a78d6', DEEP = '#1d5fae', TINT = '#e8f1fd', GREY = '#9a9a9a', OK = '#1baf7a', BAD = '#d6453d';
const CLS = { W: { name: 'Walking', col: '#2a78d6' }, R: { name: 'Running', col: '#7a3fb0' } };
const clamp01 = v => Math.max(0, Math.min(1, v));
const ease = u => { u = clamp01(u); return u * u * (3 - 2 * u); };
// a rounded box with centred lines of text; kind is 'data' (grey), 'model' (white, blue edge), 'agg' (blue tint) or 'out' (blue tint, bold)
function box(g, cx, cy, w, h, lines, kind = 'model', o = {}) {
  const st = { data: ['#f6f7f9', GREY, '#222', 400], model: ['#fff', BLUE, '#222', 400], agg: [TINT, BLUE, DEEP, 700], out: [TINT, BLUE, DEEP, 700] }[kind];
  const b = el(g, 'g', { opacity: o.opacity == null ? 1 : o.opacity });
  el(b, 'rect', { x: cx - w / 2, y: cy - h / 2, width: w, height: h, rx: 12, fill: o.fill || st[0], stroke: o.stroke || st[1], 'stroke-width': kind === 'out' ? 3 : 2 });
  const fs = o.fs || 23, n = lines.length;
  lines.forEach((s, i) => el(b, 'text', { x: cx, y: cy + (o.dy || 0) + (i - (n - 1) / 2) * fs * 1.2 + fs * 0.36, 'text-anchor': 'middle', 'font-size': fs, 'font-weight': o.weight || st[3], fill: o.color || st[2] }, s));
  return b;
}
// an arrow from (x1,y1) to (x2,y2), drawn up to fraction u of its length
function arrow(g, x1, y1, x2, y2, u = 1, o = {}) {
  if (u <= 0) return;
  const x = x1 + (x2 - x1) * u, y = y1 + (y2 - y1) * u, a = Math.atan2(y2 - y1, x2 - x1), col = o.col || '#7a8ea8', w = o.w || 2.5;
  el(g, 'line', { x1, y1, x2: x - Math.cos(a) * 8, y2: y - Math.sin(a) * 8, stroke: col, 'stroke-width': w, 'stroke-dasharray': o.dash || 'none' });
  el(g, 'path', { d: `M${x},${y} L${x - Math.cos(a - 0.4) * 15},${y - Math.sin(a - 0.4) * 15} L${x - Math.cos(a + 0.4) * 15},${y - Math.sin(a + 0.4) * 15} Z`, fill: col });
}
// the small tree drawn in the book's figures: a root, two inner nodes, four leaves
function miniTree(g, cx, cy, s, col = BLUE, opacity = 1) {
  const t = el(g, 'g', { opacity });
  const P = { r: [0, -1], a: [-0.7, -0.3], b: [0.7, -0.3], l: [[-1, 0.4], [-0.4, 0.4], [0.4, 0.4], [1, 0.4]] }, X = p => cx + p[0] * s, Y = p => cy + p[1] * s;
  [[P.r, P.a], [P.r, P.b], [P.a, P.l[0]], [P.a, P.l[1]], [P.b, P.l[2]], [P.b, P.l[3]]].forEach(([p, q]) => el(t, 'line', { x1: X(p), y1: Y(p), x2: X(q), y2: Y(q), stroke: col, 'stroke-width': Math.max(1.5, s / 18) }));
  el(t, 'circle', { cx: X(P.r), cy: Y(P.r), r: s * 0.13, fill: col });
  [P.a, P.b].forEach(p => el(t, 'circle', { cx: X(p), cy: Y(p), r: s * 0.1, fill: col }));
  P.l.forEach(p => el(t, 'circle', { cx: X(p), cy: Y(p), r: s * 0.085, fill: col, 'fill-opacity': 0.75 }));
  return t;
}
// a numbered chip for one training window, coloured by its activity
function chip(g, x, y, id, c, o = {}) {
  const s = o.s || 1, w = 40 * s, h = 32 * s;
  const k = el(g, 'g', { opacity: o.opacity == null ? 1 : o.opacity });
  el(k, 'rect', { x: x - w / 2, y: y - h / 2, width: w, height: h, rx: 6 * s, fill: CLS[c].col, stroke: o.ring || 'none', 'stroke-width': o.ring ? 4 : 0 });
  el(k, 'text', { x, y: y + 7 * s, 'text-anchor': 'middle', 'font-size': 20 * s, 'font-weight': 700, fill: '#fff' }, id);
  return k;
}
// a seeded random generator, so a page shows the same draw every time it loads
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

// ------------------------------------------------------------ steps: each has a title, draw(g, t) and T, the length of its animation in seconds
// `ctl` lists the ids of the bar controls the step shows; Play runs the animation
let step = 0, t = 0, timer = null, STEPS = [];
const PACE = 2.5;   // animations play this many times slower than their step times, to match talking through them
function draw() {
  const S = STEPS[step], svg = $('fig'); svg.innerHTML = '';
  $('title').textContent = S.title; $('stepno').textContent = `step ${step + 1} of ${STEPS.length}`;
  $('prev').disabled = step === 0; $('next').disabled = step === STEPS.length - 1 && (!S.T || t >= S.T);
  $('play').classList.toggle('hide', !S.T); $('play').textContent = S.playLabel || '▶ Play';
  document.querySelectorAll('.ctl').forEach(c => c.classList.toggle('hide', !(S.ctl || []).includes(c.id)));
  S.draw(el(svg, 'g', {}), t);
}
function play() {
  const S = STEPS[step]; clearInterval(timer); t = 0; if (S.reset) S.reset();
  if (!S.T) { draw(); return; }
  const t0 = performance.now();
  timer = setInterval(() => { t = Math.min(S.T, (performance.now() - t0) / 1000 / PACE); if (t >= S.T) clearInterval(timer); draw(); }, 30);
  draw();
}
// a step opens at the start of its animation and waits for Play; Back shows it finished
function go(s, back = false) {
  clearInterval(timer); step = Math.max(0, Math.min(STEPS.length - 1, s)); history.replaceState(null, '', '#' + (step + 1));
  if (STEPS[step].enter) STEPS[step].enter();
  t = back ? STEPS[step].T || 0 : 0; draw();
}
function start() {
  // stepping forward first shows the end of the current step's animation, then moves on
  const fwd = () => { const S = STEPS[step]; if (S.T && t < S.T) { clearInterval(timer); t = S.T; draw(); } else go(step + 1); };
  $('prev').onclick = () => go(step - 1, true); $('next').onclick = fwd; $('play').onclick = () => play();
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight') fwd(); else if (e.key === 'ArrowLeft') go(step - 1, true);
    else if (e.key === ' ' && STEPS[step].T) { e.preventDefault(); play(); }
  });
  go((parseInt(location.hash.slice(1), 10) || 1) - 1);
}

  label(g, 1190, 646, 'what we want to know', { 'font-size': 23, fill: '#444' });
  arrow(g, 735, 325, 865, 325, 1, { w: 3 });
}

// accuracy against max_depth: the windows we have, then (from `t` on) the new windows
function depthAxes(g) {
  const X0 = 170, X1 = 1450, Y0 = 60, Y1 = 600, sx = d => X0 + (d - 1) / 14 * (X1 - X0), sy = a => Y1 - (a - 0.5) / 0.52 * (Y1 - Y0);
  for (let a = 0.5; a <= 1.0001; a += 0.1) { el(g, 'line', { x1: X0, x2: X1, y1: sy(a), y2: sy(a), stroke: '#ececec', 'stroke-width': 1.5 }); el(g, 'text', { x: X0 - 14, y: sy(a) + 7, 'text-anchor': 'end', 'font-size': 20, style: 'font-family: var(--mono)', fill: '#666' }, a.toFixed(1)); }
  DEP.forEach(d => el(g, 'text', { x: sx(d), y: Y1 + 30, 'text-anchor': 'middle', 'font-size': 20, style: 'font-family: var(--mono)', fill: '#666' }, d));
  label(g, (X0 + X1) / 2, Y1 + 70, 'max_depth', { 'font-size': 22, fill: '#444', style: 'font-family: var(--mono)' });
  el(g, 'text', { x: X0 - 90, y: (Y0 + Y1) / 2, 'text-anchor': 'middle', 'font-size': 22, fill: '#444', transform: `rotate(-90 ${X0 - 90} ${(Y0 + Y1) / 2})` }, 'accuracy');
  el(g, 'rect', { x: X0, y: Y0, width: X1 - X0, height: Y1 - Y0, fill: 'none', stroke: '#666', 'stroke-width': 1.5 });
  return { sx, sy, X0, Y0 };
}
function line(g, A, n, col, sx, sy) {
  const I = [...Array(n).keys()];
  el(g, 'path', { d: I.map(i => (i ? 'L' : 'M') + sx(DEP[i]) + ',' + sy(A[i])).join(''), fill: 'none', stroke: col, 'stroke-width': 4 });
  I.forEach(i => el(g, 'circle', { cx: sx(DEP[i]), cy: sy(A[i]), r: 7, fill: col, stroke: '#fff', 'stroke-width': 2 }));
}
function key(g, X0, Y0, j, col, name) {
  el(g, 'line', { x1: X0 + 30, x2: X0 + 70, y1: Y0 + 40 + j * 40, y2: Y0 + 40 + j * 40, stroke: col, 'stroke-width': 4 });
  el(g, 'text', { x: X0 + 82, y: Y0 + 47 + j * 40, 'font-size': 22, fill: '#222' }, name);
}
function pickOnSeen(g, t) {
  const { sx, sy, X0, Y0 } = depthAxes(g);
  line(g, TRA, Math.min(15, Math.floor(t / 0.15) + 1), TR, sx, sy); key(g, X0, Y0, 0, TR, 'the windows we have');
  if (t < 2.6) return;
  el(g, 'circle', { cx: sx(DEP[PICK]), cy: sy(TRA[PICK]), r: 17, fill: 'none', stroke: '#222', 'stroke-width': 3 });
  el(g, 'text', { x: sx(DEP[PICK]), y: sy(TRA[PICK]) + 52, 'text-anchor': 'middle', 'font-size': 23, 'font-weight': 700, fill: '#222' }, `chosen: max_depth = ${DEP[PICK]}, 100%`);
}
function pickOnNew(g, t) {
  const { sx, sy, X0, Y0 } = depthAxes(g);
  line(g, TRA, 15, TR, sx, sy); key(g, X0, Y0, 0, TR, 'the windows we have');
  el(g, 'circle', { cx: sx(DEP[PICK]), cy: sy(TRA[PICK]), r: 17, fill: 'none', stroke: '#222', 'stroke-width': 3 });
  line(g, NEW, Math.min(15, Math.floor(t / 0.15) + 1), NEWC, sx, sy); key(g, X0, Y0, 1, NEWC, 'new windows');
  if (t < 2.6) return;
  el(g, 'line', { x1: sx(DEP[PICK]), x2: sx(DEP[PICK]), y1: sy(TRA[PICK]) + 18, y2: sy(NEW[PICK]) - 18, stroke: '#222', 'stroke-width': 2, 'stroke-dasharray': '7 6' });
  el(g, 'circle', { cx: sx(DEP[PICK]), cy: sy(NEW[PICK]), r: 17, fill: 'none', stroke: '#222', 'stroke-width': 3 });
  el(g, 'text', { x: sx(DEP[PICK]), y: sy(NEW[PICK]) + 52, 'text-anchor': 'middle', 'font-size': 23, 'font-weight': 700, fill: NEWC }, `on new windows: ${Math.round(100 * NEW[PICK])}%`);
  el(g, 'text', { x: sx(DEP[BEST]) - 10, y: sy(NEW[BEST]) + 62, 'text-anchor': 'start', 'font-size': 23, 'font-weight': 700, fill: NEWC }, `max_depth = ${DEP[BEST]}: ${Math.round(100 * NEW[BEST])}%`);
}

// set part of the windows aside and never train on them: they stand in for new windows
function holdOut(g, t) {
  const u = ease((t - 0.4) / 0.8), X0 = 200, W = 1200, Y = 200, f = 0.8, gap = 60 * u;
  label(g, X0 + W / 2, 150, 'the windows we have', { 'font-size': 26, 'font-weight': 700, opacity: 1 - u });
  el(g, 'rect', { x: X0, y: Y, width: W * f - 4, height: 130, rx: 10, fill: TR, opacity: 0.85 });
  el(g, 'rect', { x: X0 + W * f + 4 + gap, y: Y, width: W * (1 - f) - 4, height: 130, rx: 10, fill: u > 0 ? TE : TR, opacity: 0.85 });
  const k = el(g, 'g', { opacity: clamp01((t - 1.2) / 0.5) });
  label(k, X0 + W * f / 2, Y + 76, 'Training set', { 'font-size': 28, 'font-weight': 700, fill: '#fff' });
  label(k, X0 + W * f + gap + W * (1 - f) / 2, Y + 76, 'Test set', { 'font-size': 28, 'font-weight': 700, fill: '#fff' });
  label(k, X0 + W * f / 2, Y + 190, 'fit the model', { 'font-size': 25, 'font-weight': 700, fill: TR });
  label(k, X0 + W * f + gap + W * (1 - f) / 2, Y + 190, 'never used for training', { 'font-size': 25, 'font-weight': 700, fill: TE });
  const v = clamp01((t - 2) / 0.5), m = el(g, 'g', { opacity: v });
  box(m, 520, 600, 300, 100, ['Trained model'], 'data', { fs: 26, fill: GOOD, stroke: GOOD, color: '#fff', weight: 700 });
  arrow(m, 670, 600, 860, 600, 1); label(m, 765, 580, 'evaluate', { 'font-size': 21, fill: '#444' });
  box(m, 1080, 600, 360, 100, ['Estimate of', 'generalization accuracy'], 'out', { fs: 24 });
}

// Naive approach 2: fifty candidates scored on the same 100 test windows. All fifty are equally good (85% of new windows
// right), so the spread in their test scores is luck, and the winner's score is too optimistic
const CAND = (() => { const r = rng(5); return Array.from({ length: 50 }, () => { let c = 0; for (let i = 0; i < 100; i++) c += r() < 0.85; return c; }); })();
const WIN = CAND.indexOf(Math.max(...CAND));
const WIN_NEW = (() => { const r = rng(5); for (let i = 0; i < 5000; i++) r(); let c = 0; for (let i = 0; i < 2000; i++) c += r() < 0.85; return c / 20; })();
function grid(g, t, X0, cw, dim) {
  const Y0 = 150, ch = 96, per = 0.06, k = Math.min(50, Math.floor(t / per)), done = t >= 50 * per + 0.3;
  label(g, X0 + 5 * cw, 90, '50 candidate models, each scored on the same 100 test windows', { 'font-size': 25, 'font-weight': 700 });
  CAND.forEach((v, i) => {
    const x = X0 + (i % 10) * cw, y = Y0 + Math.floor(i / 10) * ch, seen = i < k, win = done && i === WIN;
    el(g, 'rect', { x, y, width: cw - 12, height: ch - 14, rx: 8, fill: seen ? `rgba(122,142,168,${(0.12 + 0.55 * (v - 76) / 16).toFixed(2)})` : '#f6f7f9', stroke: win ? BAD : '#e2e2e2', 'stroke-width': win ? 5 : 1.5, opacity: dim && !win ? 0.45 : 1 });
    if (seen) label(g, x + (cw - 12) / 2, y + ch / 2, `${v}%`, { 'font-size': 23, 'font-weight': win ? 700 : 400, fill: win ? BAD : '#222', opacity: dim && !win ? 0.45 : 1 });
  });
  return done;
}
function pickOnTest(g, t) {
  if (grid(g, t, 160, 128, false)) label(g, 800, 680, `chosen: the model that scores ${CAND[WIN]}% on the test set`, { 'font-size': 25, 'font-weight': 700, fill: BAD });
}
function winnerOnNew(g) {
  grid(g, 99, 60, 100, true);
  label(g, 560, 680, 'all 50 are equally good: each gets 85% of new windows right', { 'font-size': 23, fill: '#444' });
  box(g, 1310, 240, 420, 130, ['on the test set', `${CAND[WIN]}%`], 'data', { fs: 30, color: BAD, weight: 700, stroke: BAD });
  arrow(g, 1310, 310, 1310, 400, 1, { w: 3 });
  box(g, 1310, 470, 420, 130, ['on 2,000 new windows', `${Math.round(WIN_NEW)}%`], 'data', { fs: 30, color: NEWC, weight: 700, stroke: NEWC });
}

// the three sets, with the share of the data the book gives each and its one job
function threeSets(g, t) {
  const S = [['Training set', '60–80%', 'grows the tree', TR, 0.7], ['Validation set', '10–20%', 'chooses the knobs', VA, 0.15], ['Test set', '10–20%', 'reports accuracy once, at the end', TE, 0.15]];
  let x = 120; const W = 1360, Y = 260;
  S.forEach(([n, pct, job, col, f], i) => {
    const u = ease((t - 0.6 * i) / 0.6), w = W * f;
    el(g, 'rect', { x, y: Y, width: w - 8, height: 130, rx: 10, fill: col, opacity: 0.85 * u });
    const k = el(g, 'g', { opacity: u });
    label(k, x + (w - 8) / 2, Y + 58, n, { 'font-size': 27, 'font-weight': 700, fill: '#fff' });
    label(k, x + (w - 8) / 2, Y + 96, pct, { 'font-size': 23, fill: '#fff' });
    // the job under each set, on its own line so the two narrow sets do not collide
    const jy = Y + 190 + i * 55;
    el(k, 'line', { x1: x + (w - 8) / 2, x2: x + (w - 8) / 2, y1: Y + 138, y2: jy - 26, stroke: col, 'stroke-width': 2 });
    label(k, x + (w - 8) / 2, jy, job, { 'font-size': 25, fill: col, 'font-weight': 700, 'text-anchor': i === 2 ? 'end' : 'middle' });
    x += w;
  });
}

// Figure 7.1: the train/validate loop, then the test set used once
function loop(g, t) {
  el(g, 'rect', { x: 60, y: 40, width: 1480, height: 380, rx: 16, fill: '#f6f8fb', stroke: '#d4dbe5', 'stroke-width': 2 });
  el(g, 'text', { x: 90, y: 86, 'font-size': 23, 'font-weight': 700, fill: DEEP }, 'For every hyperparameter setting');
  box(g, 330, 220, 260, 110, ['Training set'], 'data', { fs: 26, fill: TR, stroke: TR, color: '#fff', weight: 700 });
  arrow(g, 460, 220, 670, 220, ease(t / 0.5)); label(g, 565, 200, 'train', { 'font-size': 21, fill: '#444', opacity: clamp01(t / 0.5) });
  box(g, 800, 220, 260, 110, ['Trained', 'model'], 'data', { fs: 26, fill: GOOD, stroke: GOOD, color: '#fff', weight: 700, opacity: clamp01((t - 0.4) / 0.4) });
  arrow(g, 930, 220, 1140, 220, ease((t - 0.8) / 0.5)); label(g, 1035, 200, 'evaluate', { 'font-size': 21, fill: '#444', opacity: clamp01((t - 0.8) / 0.5) });
  box(g, 1270, 220, 260, 110, ['Validation set'], 'data', { fs: 26, fill: VA, stroke: VA, color: '#fff', weight: 700, opacity: clamp01((t - 1.2) / 0.4) });
  // back round to the training set: change the hyperparameters and train again
  const u = clamp01((t - 1.7) / 0.7);
  if (u > 0) { el(g, 'path', { d: 'M1270,276 C1270,400 330,400 330,290', fill: 'none', stroke: VA, 'stroke-width': 3, 'stroke-dasharray': `${1400 * u} 2000` });
    if (u >= 1) { arrow(g, 330, 320, 330, 280, 1, { col: VA }); label(g, 800, 392, 'not good enough: change the hyperparameters and train again', { 'font-size': 21, fill: VA, 'font-weight': 700 }); } }
  const v = clamp01((t - 2.6) / 0.5), k = el(g, 'g', { opacity: v });
  el(k, 'text', { x: 90, y: 500, 'font-size': 23, 'font-weight': 700, fill: DEEP }, 'Once, at the very end');
  box(k, 330, 610, 260, 100, ['Chosen model'], 'data', { fs: 26, fill: GOOD, stroke: GOOD, color: '#fff', weight: 700 });
  arrow(k, 460, 610, 670, 610, 1); label(k, 565, 590, 'evaluate once', { 'font-size': 21, fill: '#444' });
  box(k, 800, 610, 260, 100, ['Test set'], 'data', { fs: 26, fill: '#eef1f5', stroke: TE, color: '#222', weight: 700 });
  arrow(k, 930, 610, 1140, 610, 1);
  box(k, 1270, 610, 260, 100, ['Estimate of', 'generalization'], 'out', { fs: 24 });
}

// Figure 7.2: five folds, each the validation fold once; the five scores averaged (max_depth=7 on the book's activity data)
const F7 = DATA.depth.folds[6], mean = a => a.reduce((s, v) => s + v, 0) / a.length;
function kfold(g, t) {
  const X0 = 300, Y0 = 110, fw = 170, fh = 74, gap = 22, per = 0.8, k = Math.min(5, Math.floor(t / per)), done = t >= 5 * per;
  label(g, X0 + 2.5 * fw, 60, 'the training data in 5 folds', { 'font-size': 23, fill: '#444' });
  for (let r = 0; r < 5; r++) {
    const y = Y0 + r * (fh + gap), shown = r < k || (r === k && !done), now = r === k && !done;
    el(g, 'text', { x: X0 - 30, y: y + fh / 2 + 9, 'text-anchor': 'end', 'font-size': 23, fill: now ? '#222' : '#666', 'font-weight': now ? 700 : 400 }, `model ${r + 1}`);
    for (let c = 0; c < 5; c++) {
      const val = c === r;
      el(g, 'rect', { x: X0 + c * fw + 4, y, width: fw - 8, height: fh, rx: 8, fill: !shown ? '#f3f4f6' : val ? VA : TR, opacity: !shown ? 1 : val ? 0.9 : 0.35 });
      if (shown) label(g, X0 + c * fw + fw / 2, y + fh / 2 + 8, val ? 'validation' : 'train', { 'font-size': 20, fill: val ? '#fff' : DEEP, 'font-weight': val ? 700 : 400 });
    }
    if (r < k || (done && r < 5)) label(g, X0 + 5 * fw + 120, y + fh / 2 + 9, F7[r].toFixed(3), { 'font-size': 27, 'font-weight': 700, fill: VA, style: 'font-family: var(--mono)' });
  }
  if (done) {
    el(g, 'line', { x1: X0 + 5 * fw + 50, x2: X0 + 5 * fw + 190, y1: Y0 + 5 * (fh + gap) - 4, y2: Y0 + 5 * (fh + gap) - 4, stroke: '#222', 'stroke-width': 2 });
    label(g, X0 + 5 * fw + 120, Y0 + 5 * (fh + gap) + 40, mean(F7).toFixed(3), { 'font-size': 32, 'font-weight': 700, fill: '#222', style: 'font-family: var(--mono)' });
    label(g, X0 + 5 * fw + 120, Y0 + 5 * (fh + gap) + 76, 'average', { 'font-size': 21, fill: '#666' });
  }
  label(g, X0 + 5 * fw + 120, 60, 'max_depth=7', { 'font-size': 22, fill: DEEP, style: 'font-family: var(--mono)', 'font-weight': 700 });
}

// Figure 7.3: 5-fold CV accuracy against max_depth, mean and ±1 standard deviation across the folds
const D = DATA.depth, M = D.folds.map(mean), SD = D.folds.map((f, i) => Math.sqrt(mean(f.map(v => (v - M[i]) ** 2))));
function curve(g, t) {
  const X0 = 170, X1 = 1450, Y0 = 50, Y1 = 610, sx = d => X0 + (d - 1) / 14 * (X1 - X0), sy = a => Y1 - (a - 0.3) / 0.72 * (Y1 - Y0);
  for (let a = 0.3; a <= 1.0001; a += 0.1) { el(g, 'line', { x1: X0, x2: X1, y1: sy(a), y2: sy(a), stroke: '#ececec', 'stroke-width': 1.5 }); el(g, 'text', { x: X0 - 14, y: sy(a) + 7, 'text-anchor': 'end', 'font-size': 20, style: 'font-family: var(--mono)', fill: '#666' }, a.toFixed(1)); }
  D.x.forEach(d => el(g, 'text', { x: sx(d), y: Y1 + 30, 'text-anchor': 'middle', 'font-size': 20, style: 'font-family: var(--mono)', fill: '#666' }, d));
  label(g, (X0 + X1) / 2, Y1 + 70, 'max_depth', { 'font-size': 22, fill: '#444', style: 'font-family: var(--mono)' });
  el(g, 'text', { x: X0 - 90, y: (Y0 + Y1) / 2, 'text-anchor': 'middle', 'font-size': 22, fill: '#444', transform: `rotate(-90 ${X0 - 90} ${(Y0 + Y1) / 2})` }, 'cross-validation accuracy');
  el(g, 'rect', { x: X0, y: Y0, width: X1 - X0, height: Y1 - Y0, fill: 'none', stroke: '#666', 'stroke-width': 1.5 });
  const n = Math.min(15, Math.floor(t / 0.25) + 1), I = [...Array(n).keys()];
  if (n > 1) el(g, 'path', { d: I.map(i => (i ? 'L' : 'M') + sx(D.x[i]) + ',' + sy(M[i] + SD[i])).join('') + I.slice().reverse().map(i => 'L' + sx(D.x[i]) + ',' + sy(M[i] - SD[i])).join('') + 'Z', fill: VA, opacity: 0.16 });
  el(g, 'path', { d: I.map(i => (i ? 'L' : 'M') + sx(D.x[i]) + ',' + sy(M[i])).join(''), fill: 'none', stroke: VA, 'stroke-width': 4 });
  I.forEach(i => el(g, 'circle', { cx: sx(D.x[i]), cy: sy(M[i]), r: 7, fill: VA, stroke: '#fff', 'stroke-width': 2 }));
  if (t >= 15 * 0.25) {
    const b = M.indexOf(Math.max(...M));
    el(g, 'circle', { cx: sx(D.x[b]), cy: sy(M[b]), r: 17, fill: 'none', stroke: '#222', 'stroke-width': 3 });
    el(g, 'text', { x: sx(D.x[b]) + 10, y: sy(M[b]) + 60, 'font-size': 23, 'font-weight': 700, fill: '#222' }, `best CV depth = ${D.x[b]}, ${M[b].toFixed(3)}`);
  }
}

STEPS = [
  { title: 'How well will the model do on new windows?', draw: generalize },
  { title: 'What if we choose max_depth using the windows we have?', T: 3, draw: pickOnSeen },
  { title: 'How does that choice do on new windows?', T: 3, draw: pickOnNew },
  { title: 'How can we estimate accuracy on new windows?', T: 2.6, draw: holdOut },
  { title: 'What if we use the test set to choose among many models?', T: 3.4, draw: pickOnTest },
  { title: 'How does the chosen model do on new windows?', draw: winnerOnNew },
  { title: 'How do we split the data?', T: 1.9, draw: threeSets },
  { title: 'How do the three sets work together?', T: 3.2, draw: loop },
  { title: 'How does 5-fold cross-validation work?', T: 4.2, draw: kfold },
  { title: 'Which max_depth does cross-validation pick?', T: 3.9, draw: curve },
];
start();

})();
</script>

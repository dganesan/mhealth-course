<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tuning with GridSearchCV</title>
</head>
<body>
<style>
  :root {
    color-scheme: light;
    --paper: #ffffff; --ink: #222222; --ink-2: #666666; --ink-3: #9a9a9a; --rule: #dcdcdc; --grid: #ececec; --ma: #2a78d6;
    --sans: "Helvetica Neue", Helvetica, -apple-system, Arial, sans-serif;
    --mono: Menlo, "SF Mono", Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  #app { height: 100vh; padding: 10px 14px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px; }
  .head { padding: 4px 16px 0; }
  h1 { margin: 0; font-size: clamp(24px, 2.4vw, 36px); font-weight: 700; letter-spacing: -0.01em; }
  .main { user-select: none; -webkit-user-select: none; min-height: 0; border: 1px solid var(--rule); border-radius: 6px; padding: 10px 16px; }
  .main svg { width: 100%; height: 100%; display: block; }
  svg text { font-family: var(--sans); }
  .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 18px; border: 1px solid var(--rule); border-radius: 6px; background: #f6f7f9; }
  button { font: inherit; font-size: 18px; color: var(--ink); background: #fff; border: 1px solid #9a9a9a; border-radius: 6px; padding: 9px 16px; cursor: pointer; }
  button:hover { border-color: var(--ink); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--ma); color: #fff; border-color: var(--ma); font-weight: 700; min-width: 120px; }
  .ctl { display: inline-flex; align-items: center; gap: 10px; margin-left: 10px; flex: 1; max-width: 640px; }
  .ctl .lbl { font-family: var(--mono); font-size: 17px; color: var(--ink-2); white-space: nowrap; }
  .ctl b { font-family: var(--mono); font-size: 18px; color: var(--ma); min-width: 3ch; }
  input[type=range] { flex: 1; accent-color: var(--ma); height: 26px; }
  .step { font-family: var(--mono); font-size: 17px; color: var(--ink-2); margin-left: auto; }
  .hide { display: none !important; }
</style>

<div id="app">
  <div class="head"><h1 id="title"></h1></div>
  <div class="main"><svg id="fig" viewBox="0 0 1600 760"></svg></div>
  <div class="bar">
    <button id="prev" title="Previous step (←)">⏮ step</button>
    <button id="next" title="Next step (→)">step ⏭</button>
    <button id="play" class="primary" title="Play again (space)">▶ Play</button>

    <span class="step" id="stepno"></span>
  </div>
</div>

<script>
(() => {
// ------------------------------------------------------------ shared by the chapter 7 pages (built by tools/ch7-pages/build.py)
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const el = (parent, tag, attrs, text) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; parent.appendChild(e); return e; };
const BLUE = '#2a78d6', DEEP = '#1d5fae', TINT = '#e8f1fd', GREY = '#9a9a9a', OK = '#1baf7a', BAD = '#d6453d';
const CLS = { W: { name: 'Walking', col: '#2a78d6' }, R: { name: 'Running', col: '#7a3fb0' } };
const clamp01 = v => Math.max(0, Math.min(1, v));
const ease = u => { u = clamp01(u); return u * u * (3 - 2 * u); };
// a rounded box with centred lines of text; kind is 'data' (grey), 'model' (white, blue edge), 'agg' (blue tint) or 'out' (blue tint, bold)
function box(g, cx, cy, w, h, lines, kind = 'model', o = {}) {
  const st = { data: ['#f6f7f9', GREY, '#222', 400], model: ['#fff', BLUE, '#222', 400], agg: [TINT, BLUE, DEEP, 700], out: [TINT, BLUE, DEEP, 700] }[kind];
  const b = el(g, 'g', { opacity: o.opacity == null ? 1 : o.opacity });
  el(b, 'rect', { x: cx - w / 2, y: cy - h / 2, width: w, height: h, rx: 12, fill: o.fill || st[0], stroke: o.stroke || st[1], 'stroke-width': kind === 'out' ? 3 : 2 });
  const fs = o.fs || 23, n = lines.length;
  lines.forEach((s, i) => el(b, 'text', { x: cx, y: cy + (o.dy || 0) + (i - (n - 1) / 2) * fs * 1.2 + fs * 0.36, 'text-anchor': 'middle', 'font-size': fs, 'font-weight': o.weight || st[3], fill: o.color || st[2] }, s));
  return b;
}
// an arrow from (x1,y1) to (x2,y2), drawn up to fraction u of its length
function arrow(g, x1, y1, x2, y2, u = 1, o = {}) {
  if (u <= 0) return;
  const x = x1 + (x2 - x1) * u, y = y1 + (y2 - y1) * u, a = Math.atan2(y2 - y1, x2 - x1), col = o.col || '#7a8ea8', w = o.w || 2.5;
  el(g, 'line', { x1, y1, x2: x - Math.cos(a) * 8, y2: y - Math.sin(a) * 8, stroke: col, 'stroke-width': w, 'stroke-dasharray': o.dash || 'none' });

}
// the small tree drawn in the book's figures: a root, two inner nodes, four leaves
function miniTree(g, cx, cy, s, col = BLUE, opacity = 1) {
  const t = el(g, 'g', { opacity });
  const P = { r: [0, -1], a: [-0.7, -0.3], b: [0.7, -0.3], l: [[-1, 0.4], [-0.4, 0.4], [0.4, 0.4], [1, 0.4]] }, X = p => cx + p[0] * s, Y = p => cy + p[1] * s;

// a numbered chip for one training window, coloured by its activity
function chip(g, x, y, id, c, o = {}) {
  const s = o.s || 1, w = 40 * s, h = 32 * s;
  const k = el(g, 'g', { opacity: o.opacity == null ? 1 : o.opacity });
  el(k, 'rect', { x: x - w / 2, y: y - h / 2, width: w, height: h, rx: 6 * s, fill: CLS[c].col, stroke: o.ring || 'none', 'stroke-width': o.ring ? 4 : 0 });

// a seeded random generator, so a page shows the same draw every time it loads
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

// `ctl` lists the ids of the bar controls the step shows; Play runs the animation
let step = 0, t = 0, timer = null, STEPS = [];
const PACE = 2.5;   // animations play this many times slower than their step times, to match talking through them
function draw() {

  const S = STEPS[step]; clearInterval(timer); t = 0; if (S.reset) S.reset();
  if (!S.T) { draw(); return; }
  const t0 = performance.now();
  timer = setInterval(() => { t = Math.min(S.T, (performance.now() - t0) / 1000 / PACE); if (t >= S.T) clearInterval(timer); draw(); }, 30);

// a step opens at the start of its animation and waits for Play; Back shows it finished
function go(s, back = false) {
  clearInterval(timer); step = Math.max(0, Math.min(STEPS.length - 1, s)); history.replaceState(null, '', '#' + (step + 1));

  // stepping forward first shows the end of the current step's animation, then moves on
  const fwd = () => { const S = STEPS[step]; if (S.T && t < S.T) { clearInterval(timer); t = S.T; draw(); } else go(step + 1); };

    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight') fwd(); else if (e.key === 'ArrowLeft') go(step - 1, true);
    else if (e.key === ' ' && STEPS[step].T) { e.preventDefault(); play(); }

    label(k, x, 320, job, { 'font-size': 26, 'font-weight': 700, fill: col });
    if (i === 0) miniTree(k, x, 460, 70, TR);
    if (i === 1) ['max_depth', 'min_samples_split'].forEach((s, r) => mono(k, x, 430 + r * 46, s, { 'text-anchor': 'middle', 'font-size': 24, fill: DEEP, 'font-weight': 700 }));
    if (i === 2) { el(k, 'rect', { x: x - 90, y: 400, width: 180, height: 100, rx: 12, fill: '#eef1f5', stroke: TE, 'stroke-width': 2.5 }); label(k, x, 464, `${(100 * G.test).toFixed(0)}%`, { 'font-size': 34, 'font-weight': 700, fill: '#444' }); }
    if (sub) sub.forEach((s, r) => label(k, x, 590 + r * 36, s, { 'font-size': 22, fill: '#444' }));
  });
}

// a tree's first two levels of splits, then the deeper levels as a fan of dots
function splits(g, T, cx, y0, w, u, depth) {
  const node = (n, x, y, d) => {
    if (!n || u < d * 0.6) return;
    el(g, 'rect', { x: x - 150, y: y - 30, width: 300, height: 56, rx: 12, fill: TINT, stroke: BLUE, 'stroke-width': 2.5 });
    mono(g, x, y + 8, n.rule, { 'text-anchor': 'middle', 'font-size': 21, fill: DEEP, 'font-weight': 700 });
    n.kids.forEach((c, j) => { const xx = x + (j ? 1 : -1) * w / 2 ** (d + 2), yy = y + 140;
      if (u < (d + 1) * 0.6) return;
      el(g, 'line', { x1: x, y1: y + 26, x2: xx, y2: yy - 30, stroke: '#9a9a9a', 'stroke-width': 2 });
      if (c) node(c, xx, yy, d + 1); });
  };
  node(T, cx, y0, 0);
  // the levels below the second, too many to read
  if (u >= 1.2) { [-3, -1, 1, 3].forEach(q => { const x = cx + q * w / 8; el(g, 'line', { x1: x, y1: y0 + 250, x2: x - 40, y2: y0 + 320, stroke: '#c9c9c9', 'stroke-width': 2 }); el(g, 'line', { x1: x, y1: y0 + 250, x2: x + 40, y2: y0 + 320, stroke: '#c9c9c9', 'stroke-width': 2 }); });
    label(g, cx, y0 + 380, `… and so on, down to depth ${depth}`, { 'font-size': 22, fill: '#666' }); }
}
// the data bar of step 1, small, across the top: `hi` picks the part in use ('train', 'val' or 'fit', the whole training part, with the test set)
const BX = 200, BW = 1200, BY = 30, BH = 56, bs = BW / NALL;
const part = { train: [BX, BX + 4 * NFOLD * bs], val: [BX + 4 * NFOLD * bs, BX + NFIT * bs], fit: [BX, BX + NFIT * bs], test: [BX + NFIT * bs + 20, BX + BW] };
function dataBar(g, hi) {
  const on = k => hi === k || (hi === 'fit' && k !== 'test') || (hi === 'fit' && k === 'test');
  const seg = (k, col, name, a = part[k]) => { el(g, 'rect', { x: a[0] + 2, y: BY, width: a[1] - a[0] - 4, height: BH, rx: 8, fill: col, opacity: on(k) ? 0.9 : 0.2 });
    label(g, (a[0] + a[1]) / 2, BY + 36, name, { 'font-size': 21, 'font-weight': 700, fill: on(k) ? '#fff' : '#888' }); };
  if (hi === 'fit') seg('fit', TR, `training: all ${NFIT} windows`);
  else { seg('train', TR, `training: ${4 * NFOLD} windows`); seg('val', VA, `validation: ${NFOLD}`); }
  seg('test', TE, `test: ${NTEST} windows`);
}
// a zoom from a part of the bar down to what it becomes
function zoom(g, a, x1, x2, y2, col, u = 1) {
  if (u <= 0) return;
  const k = el(g, 'g', { opacity: u });
  el(k, 'path', { d: `M${a[0]},${BY + BH} L${a[1]},${BY + BH} L${x2},${y2} L${x1},${y2} Z`, fill: col, opacity: 0.08 });
  el(k, 'line', { x1: a[0], y1: BY + BH, x2: x1, y2, stroke: col, 'stroke-width': 1.5, opacity: 0.6 });
  el(k, 'line', { x1: a[1], y1: BY + BH, x2: x2, y2, stroke: col, 'stroke-width': 1.5, opacity: 0.6 });
}
function onTrain(g, t) {
  dataBar(g, 'train');
  mono(g, 60, 730, `${set(WK.p, 'max_depth')}, ${set(WK.p, 'min_samples_split')}`, { 'font-size': 26, fill: DEEP, 'font-weight': 700 });
  zoom(g, part.train, 900, 1200, 228, TR, clamp01(t / 0.4));
  splits(g, WK.tree, 1050, 260, 1000, Math.max(0, t - 0.4) / 0.9 * 1.2, WK.p.max_depth);
}
// one window per square, green if the tree labels it right
function squares(g, A, X0, Y0, cols, sz, k) {
  A.slice(0, k).forEach((v, i) => el(g, 'rect', { x: X0 + (i % cols) * sz, y: Y0 + Math.floor(i / cols) * sz, width: sz - 3, height: sz - 3, rx: 3, fill: v ? OK7 : NO7, opacity: v ? 0.75 : 1 }));
}
// a small copy of the training part in five folds, with fold f as the validation fold
function folds5(g, x, y, f, w = 36) {
  for (let q = 0; q < 5; q++) el(g, 'rect', { x: x + q * w, y, width: w - 3, height: 28, rx: 4, fill: q === f ? VA : TR, opacity: q === f ? 0.9 : 0.35 });
}
function onValidation(g, t) {
  dataBar(g, 'val');
  mono(g, 60, 735, `${set(WK.p, 'max_depth')}, ${set(WK.p, 'min_samples_split')}`, { 'font-size': 26, fill: DEEP, 'font-weight': 700 });
  miniTree(g, 200, 330, 70, TR); label(g, 200, 420, 'the grown tree', { 'font-size': 22, fill: '#444' });
  arrow(g, 300, 320, 420, 320, 1, { w: 3 }); label(g, 360, 300, 'label', { 'font-size': 21, fill: '#444' });
  zoom(g, part.val, 440, 1157, 196, VA);
  const n = VAL.length, k = Math.min(n, Math.floor(t / 1.6 * n)), right = VAL.reduce((a, v) => a + v, 0);
  squares(g, VAL, 440, 200, 20, 36, k);
  if (t < 1.8) return;
  label(g, 1380, 300, `${right} of ${n} right`, { 'font-size': 26, fill: '#222' });
  label(g, 1380, 360, `score ${(right / n).toFixed(3)}`, { 'font-size': 34, 'font-weight': 700, fill: VA });
  // cross-validation: each fold takes a turn as the validation fold, and the five scores are averaged
  const c = G.combos.find(c => c.p.max_depth === WK.p.max_depth && c.p.min_samples_split === WK.p.min_samples_split);
  if (t < 2.4) return;
  label(g, 700, 530, 'with cv=5, each fold takes a turn as the validation fold', { 'font-size': 24, fill: '#444' });
  c.folds.forEach((v, f) => { const x = 140 + f * 230, k2 = el(g, 'g', { opacity: clamp01((t - 2.5 - 0.3 * f) / 0.3) });
    folds5(k2, x, 570, f); label(k2, x + 88, 640, v.toFixed(3), { 'font-size': 25, 'font-weight': f ? 400 : 700, fill: VA }); });
  if (t >= 4.1) { label(g, 1380, 590, 'average', { 'font-size': 23, fill: '#444' }); label(g, 1380, 640, c.mean.toFixed(3), { 'font-size': 34, 'font-weight': 700, fill: '#222' }); }
}
function onTest(g, t) {
  const B = G.combos[G.best].p, u = s => clamp01((t - s) / 0.4);
  dataBar(g, 'fit');
  el(g, 'text', { x: 60, y: 735, 'font-size': 25, 'font-weight': 700, fill: '#222' }, 'Best setting from the grid:');
  mono(g, 420, 735, `${set(B, 'max_depth')}, ${set(B, 'min_samples_split')}`, { 'font-size': 26, fill: DEEP, 'font-weight': 700 });
  zoom(g, part.fit, 400, 640, 300, TR, u(0));
  miniTree(el(g, 'g', { opacity: u(0.2) }), 520, 380, 80, TR); label(g, 520, 480, 'grown again', { 'font-size': 22, fill: '#444', opacity: u(0.2) });
  label(g, 520, 510, `on all ${NFIT} windows`, { 'font-size': 22, fill: '#444', opacity: u(0.2) });
  arrow(g, 630, 380, 780, 380, u(0.5), { w: 3 });
  zoom(g, part.test, 810, 1557, 216, TE, u(0.5));
  const n = TEST.length, k = Math.max(0, Math.min(n, Math.floor((t - 0.7) / 1.4 * n))), right = TEST.reduce((a, v) => a + v, 0);
  squares(g, TEST, 810, 220, 25, 30, k);
  if (t < 2.2) return;
  label(g, 1185, 650, `${right} of ${n} right: test accuracy ${G.test.toFixed(3)}`, { 'font-size': 30, 'font-weight': 700, fill: '#444' });
}

// the book's listing, each part tied back to the steps before it
const CODE = ['from sklearn.model_selection import train_test_split, GridSearchCV', 'from sklearn.tree import DecisionTreeClassifier', '',
  'X_train, X_test, y_train, y_test = train_test_split(', '    X, y, test_size=0.3, random_state=42)', '',
  'param_grid = {', "    'max_depth': [3, 5, 7, 10, None],", "    'min_samples_split': [2, 5, 10, 20],", '}',
  'grid = GridSearchCV(DecisionTreeClassifier(),', "                    param_grid, cv=5, scoring='accuracy')", 'grid.fit(X_train, y_train)', '',
  'best_clf = grid.best_estimator_', 'test_accuracy = best_clf.score(X_test, y_test)'];
const PARTS = [[3, 4, 'set the test set aside', TE], [6, 9, 'the grid of settings', DEEP], [10, 12, 'grow on the training folds,', VA, 'score on the validation fold'], [14, 15, 'grown again, then tested once', TE]];
function code(g, t) {
  el(g, 'rect', { x: 20, y: 14, width: 1560, height: 724, rx: 10, fill: '#f6f7f9', stroke: '#dcdcdc' });
  const k = Math.min(PARTS.length, Math.floor(t / 0.8) + 1), y = i => 60 + i * 41;
  PARTS.slice(0, k).forEach(([a, b, s, col, s2], i) => {
    const now = i === k - 1 && t < PARTS.length * 0.8;
    el(g, 'rect', { x: 36, y: y(a) - 29, width: 1110, height: (b - a + 1) * 41 - 4, rx: 8, fill: now ? TINT : 'none', stroke: col, 'stroke-width': 2.5 });
    const m = (y(a) + y(b)) / 2 - 8;
    el(g, 'text', { x: 1170, y: s2 ? m - 14 : m, 'font-size': 24, 'font-weight': 700, fill: col }, s);
    if (s2) el(g, 'text', { x: 1170, y: m + 18, 'font-size': 24, 'font-weight': 700, fill: col }, s2);
  });
  CODE.forEach((s, i) => mono(g, 54, y(i), s, { 'font-size': 25 }));
}

// every combination of the grid scored by 5-fold cross-validation, filled in the order GridSearchCV tries them
const per = 0.16, N = G.combos.length;
function search(g, t) {
  const C = G.combos, k = Math.min(N, Math.floor(t / per)), done = t >= N * per, lo = Math.min(...C.map(c => c.mean)), hi = Math.max(...C.map(c => c.mean));
  const D = G.param_grid.max_depth, S = G.param_grid.min_samples_split, X0 = 290, Y0 = 130, cw = 150, ch = 100;
  const at = c => [D.indexOf(c.p.max_depth), S.indexOf(c.p.min_samples_split)];
  S.forEach((v, j) => label(g, X0 + j * cw + cw / 2 - 5, Y0 - 18, v, { 'font-size': 22, fill: '#666', style: 'font-family: var(--mono)' }));
  label(g, X0 + 2 * cw, Y0 - 62, 'min_samples_split', { 'font-size': 22, fill: '#444', style: 'font-family: var(--mono)' });
  D.forEach((v, r) => el(g, 'text', { x: X0 - 18, y: Y0 + r * ch + ch / 2 + 4, 'text-anchor': 'end', 'font-size': 22, style: 'font-family: var(--mono)', fill: '#666' }, show(v)));
  el(g, 'text', { x: X0 - 110, y: Y0 + 2.5 * ch, 'text-anchor': 'middle', 'font-size': 22, style: 'font-family: var(--mono)', fill: '#444', transform: `rotate(-90 ${X0 - 110} ${Y0 + 2.5 * ch})` }, 'max_depth');
  C.forEach((c, i) => {
    const [r, j] = at(c), x = X0 + j * cw, y = Y0 + r * ch, seen = i < k, now = i === k && !done, best = done && i === G.best, f = (c.mean - lo) / (hi - lo || 1);
    el(g, 'rect', { x, y, width: cw - 10, height: ch - 10, rx: 8, fill: seen ? `rgba(42,120,214,${(0.1 + 0.8 * f * f).toFixed(3)})` : '#f6f7f9', stroke: now ? '#222' : best ? VA : '#e2e2e2', 'stroke-width': now || best ? 5 : 1.5 });
    if (seen) label(g, x + (cw - 10) / 2, y + ch / 2 + 3, c.mean.toFixed(3), { 'font-size': 23, fill: f > 0.6 ? '#fff' : '#222', 'font-weight': best ? 700 : 400 });
  });
  // the combination being scored: its five fold scores and their mean
  const cur = C[done ? G.best : Math.min(k, N - 1)], PX = 1040, BY = 300, H = 230, bw = 70, sy = v => BY + H - (v - 0.85) / 0.15 * H;
  el(g, 'text', { x: PX, y: 110, 'font-size': 24, 'font-weight': 700, fill: done ? VA : '#222' }, done ? 'Best combination' : `Combination ${Math.min(k + 1, N)} of ${N}`);
  mono(g, PX, 156, `max_depth=${show(cur.p.max_depth)}`, { 'font-size': 23, fill: DEEP, 'font-weight': 700 });
  mono(g, PX, 192, `min_samples_split=${cur.p.min_samples_split}`, { 'font-size': 23, fill: DEEP, 'font-weight': 700 });
  el(g, 'line', { x1: PX, x2: PX + 5 * (bw + 16), y1: BY + H, y2: BY + H, stroke: '#9a9a9a', 'stroke-width': 1.5 });
  cur.folds.forEach((v, j) => { const x = PX + j * (bw + 16);
    el(g, 'rect', { x, y: sy(v), width: bw, height: BY + H - sy(v), rx: 5, fill: VA, opacity: 0.85 });
    label(g, x + bw / 2, BY + H - 14, v.toFixed(3).slice(1), { 'font-size': 18, fill: '#fff', 'font-weight': 700 });
    label(g, x + bw / 2, BY + H + 28, `fold ${j + 1}`, { 'font-size': 19, fill: '#666' }); });
  el(g, 'line', { x1: PX - 6, x2: PX + 5 * (bw + 16) - 10, y1: sy(cur.mean), y2: sy(cur.mean), stroke: '#222', 'stroke-width': 2.5, 'stroke-dasharray': '8 6' });
  el(g, 'text', { x: PX, y: BY + H + 76, 'font-size': 23, fill: '#222' }, `mean of the five folds: ${cur.mean.toFixed(3)}`);
}

// Table 7.1: the step counter from Chapter 2 and the decision tree are tuned the same way
const ROWS = [['Method', 'find_peaks()', 'DecisionTreeClassifier()'], ['Tunable params', 'height, distance, prominence', 'max_depth, min_samples_split, criterion'],
  ['Manual tuning', 'try a few combinations by hand', 'try a few combinations by hand'], ['Systematic search', 'grid search over parameter ranges', 'GridSearchCV'],
  ['Score', '|detected − true| steps', 'cross-validation accuracy']];
function table(g, t) {
  const X = [60, 400, 960], Y0 = 110, rh = 110;
  label(g, X[1] + 260, Y0, 'Step counter (Chapter 2)', { 'font-size': 26, 'font-weight': 700 }); label(g, X[2] + 290, Y0, 'Decision tree', { 'font-size': 26, 'font-weight': 700 });
  el(g, 'line', { x1: 40, x2: 1560, y1: Y0 + 26, y2: Y0 + 26, stroke: '#9a9a9a', 'stroke-width': 2 });
  ROWS.forEach(([h, a, b], i) => {
    const y = Y0 + 90 + i * rh, u = clamp01((t - 0.5 * i) / 0.4), k = el(g, 'g', { opacity: u }), code = i < 2 || i === 3;
    if (i % 2) el(k, 'rect', { x: 40, y: y - 52, width: 1520, height: rh, fill: '#f6f7f9' });
    el(k, 'text', { x: X[0], y: y + 8, 'font-size': 25, 'font-weight': 700, fill: '#222' }, h);
    [[a, X[1] + 260], [b, X[2] + 290]].forEach(([s, x], j) => label(k, x, y + 8, s, Object.assign({ 'font-size': 24, fill: i === 3 && j ? DEEP : '#222', 'font-weight': i === 3 && j ? 700 : 400 }, code && !(i === 3 && !j) ? { style: 'font-family: var(--mono)' } : {})));
  });
}

STEPS = [
  { title: 'What does each set do?', T: 2.2, draw: roles },
  { title: 'What happens on the training set?', T: 2.6, draw: onTrain },
  { title: 'What happens on the validation set?', T: 4.4, draw: onValidation },
  { title: 'How do we do this for every setting?', T: N * per + 0.3, draw: search },
  { title: 'What happens on the test set?', T: 2.6, draw: onTest },
  { title: 'What does this look like in code?', T: 3.2, draw: code },
  { title: 'Where have we seen grid search before?', T: 2.4, draw: table },
];
start();

})();
</script>

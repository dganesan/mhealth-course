<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PPG Band-Pass Filtering</title>
</head>
<body>
<style>
  :root {
    color-scheme: light;
    --paper: #ffffff;
    --ink: #222222;
    --ink-2: #666666;
    --ink-3: #9a9a9a;
    --rule: #dcdcdc;
    --grid: #ececec;
    --raw: #8f8f8f;
    --raw-dot: #8c8c8c;
    --clean: #444444;
    --window: rgba(34, 34, 34, 0.06);
    --window-edge: #222222;
    --ma: #2a78d6;
    --med: #1baf7a;
    --wm: #4a3aa7;
    --ewma: #eb6834;
    --sans: "Helvetica Neue", Helvetica, -apple-system, Arial, sans-serif;
    --mono: Menlo, "SF Mono", Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.4;
    padding-block: 10px 10px;
    padding-inline: 14px;
    -webkit-font-smoothing: antialiased;
  }
  .stage { max-width: 1880px; margin: 0 auto; display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 10px; height: calc(100vh - 20px); }

  /* ---------- slide frame ---------- */
  .slide {
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 16px 30px 8px;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    gap: 6px;
    min-height: 0;
    position: relative;
    outline: none;
    cursor: pointer;
    user-select: none;
  }
  .slide:focus-visible { box-shadow: 0 0 0 3px rgba(42,120,214,.35); }
  .head h1 {
    margin: 0;
    font-size: clamp(20px, 2.2vw, 28px);
    font-weight: 700;
    letter-spacing: -0.01em;
    text-wrap: balance;
    line-height: 1.15;
  }
  .head h1 .tag {
    display: inline-block;
    font-family: var(--mono);
    font-weight: 400;
    font-size: 0.6em;
    color: var(--ink-2);
    margin-left: 10px;
    vertical-align: middle;
    background: #f4f4f4;
    padding: 2px 8px;
    border-radius: 4px;
  }
  .head p { margin: 6px 0 0; color: #444; font-size: clamp(15px, 1.6vw, 18px); max-width: none; }

  .chart-wrap { position: relative; min-height: 0; height: 100%; display: flex; justify-content: center; align-items: center; }
  svg.chart { display: block; height: 100%; width: auto; max-width: 100%; max-height: 100%; overflow: visible; }
  .tt {
    position: absolute; pointer-events: none; display: none;
    background: #fff; border: 1px solid var(--rule); border-radius: 4px;
    padding: 6px 9px; font-family: var(--mono); font-size: 12px; color: var(--ink);
    box-shadow: 0 2px 8px rgba(0,0,0,.08); white-space: nowrap; z-index: 2;
  }
  .tt .row { display: flex; gap: 10px; justify-content: space-between; }
  .tt .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

  .foot { position: absolute; top: 9px; right: 16px; display: flex; gap: 14px; align-items: baseline; font-size: 12px; color: var(--ink-3); padding: 0; pointer-events: none; }
  .foot .ctr { font-family: var(--mono); }

  /* ---------- control bar ---------- */
  .bar { display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; padding:9px 14px; border:1px solid var(--rule); border-radius:6px; background:#f6f7f9; font-size:14px; color:var(--ink); }
  .group { display:flex; align-items:center; gap:8px; }
  .group label { font-size:13px; font-weight:700; color:var(--ink); letter-spacing:0; text-transform:none; }
  .val { font-family:var(--mono); font-size:14px; font-weight:700; color:var(--ma); min-width:5ch; }
  button, select { font:inherit; font-size:14px; color:var(--ink); background:#fff; border:1px solid #9a9a9a; border-radius:5px; padding:7px 13px; cursor:pointer; }
  button:hover, select:hover { border-color:var(--ink); }
  button.primary { background:var(--ma); color:#fff; border-color:var(--ma); min-width:88px; font-weight:700; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline:2px solid var(--ma); outline-offset:2px; }
  input[type=range] { accent-color:var(--ma); width:150px; height:30px; cursor:pointer; }
  .hint { margin-left:auto; color:var(--ink-2); font-size:12px; }
  .hint kbd { font-family:var(--mono); background:#fff; border:1px solid var(--rule); border-radius:3px; padding:0 5px; font-size:11px; }

  /* ---------- svg parts ---------- */
  .grid line { stroke: var(--grid); stroke-width: 1; }
  .axis line, .axis path { stroke: var(--ink-2); stroke-width: 1; fill: none; }
  .axis text { font-family: var(--mono); font-size: 15px; fill: var(--ink-2); }
  .axis-title { font-family: var(--sans); font-size: 18px; fill: var(--ink-2); }
  .raw-line { fill: none; stroke: var(--raw-dot); stroke-width: 1.5; }
  .out-line { fill: none; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
  .zero-line { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 2 3; }
  .cursor-line { stroke: var(--ink); stroke-width: 1; stroke-dasharray: 4 3; opacity: .7; }
  .win-rect { fill: var(--window); stroke: var(--window-edge); stroke-width: 1; stroke-dasharray: 3 3; }
  .dlabel { font-family: var(--sans); font-size: 13px; font-weight: 700; }
  .mono { font-family: var(--mono); }
  .note { font-family: var(--mono); font-size: 15px; fill: var(--ink); white-space: pre; }
  .note-big { font-family: var(--mono); font-size: 22px; font-weight: 700; white-space: pre; }
  .callout text { font-family: var(--sans); font-size: 15px; fill: var(--ink-2); }
  .crosshair { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 2 2; }

  @media (max-width: 720px) {
    .slide { padding: 18px 16px 12px; min-height: 0; }
    .hint { display: none; }
  }

  .hint { display:none !important; }
  button.tb { min-width:44px; padding:6px 10px; font-size:17px; line-height:1; }
  button.primary.tb { min-width:52px; }
</style>

<div class="stage">
  <section class="slide" id="slide" tabindex="0" aria-live="polite">
    <div class="head">
      <h1 id="title">The raw PPG recording</h1>
      <p id="subtitle"></p>
    </div>
    <div class="chart-wrap">
      <svg class="chart" id="chart" viewBox="0 0 1400 640" role="img" aria-label="Raw and filtered PPG"></svg>
      <div class="tt" id="tt"></div>
    </div>
    <div class="foot">
      <span>CS328 &nbsp;·&nbsp; Sensing Heart Rhythm with PPG</span>
      <span class="ctr" id="counter"></span>
    </div>
  </section>

  <div class="bar">
    <div class="group">
      <button id="prev" class="tb" title="Previous step (←)">⏮</button>
      <button id="play" class="primary tb" title="Play / pause (space)">▶</button>
      <button id="next" class="tb" title="Next step (→)">⏭</button>
      <button id="restart" class="tb" title="Restart this step (r)">↺</button>
      <button id="reset" title="Reset all dials to the step's presets">Reset dials</button>
    </div>
    <div class="group">
      <label for="flo">Low cutoff</label>
      <input type="range" id="flo" min="0.1" max="1.5" step="0.1" value="0.5">
      <span class="val" id="floVal">0.5 Hz</span>
    </div>
    <div class="group">
      <label for="fhi">High cutoff</label>
      <input type="range" id="fhi" min="2" max="12" step="0.5" value="4">
      <span class="val" id="fhiVal">4.0 Hz</span>
    </div>
    <div class="group">
      <label for="speed">Speed</label>
      <select id="speed">
        <option value="0.25">very slow</option>
        <option value="0.5">slow</option>
        <option value="1" selected>normal</option>
        <option value="2.5">fast</option>
        <option value="0">instant</option>
      </select>
    </div>
    <span class="hint"><kbd>→</kbd> finish / next &nbsp; <kbd>←</kbd> back &nbsp; <kbd>space</kbd> play &nbsp; <kbd>r</kbd> restart</span>
  </div>
</div>

<script>
// Butterworth IIR design + filtering, mirroring scipy.signal.butter / lfilter / filtfilt.
// Design path: analog Butterworth prototype (zpk) -> lp2lp / lp2hp / lp2bp / lp2bs -> bilinear -> SOS.
// Usage:
//   const sos = butter(4, 100, 1000, 'lowpass');            // cutoff Hz, fs Hz
//   const sos = butter(4, [58, 62], 1000, 'bandstop');
//   const y = sosfilt(sos, x);                              // causal (lfilter)
//   const y = sosfiltfilt(sos, x);                          // zero-phase (filtfilt)
//   const mag = sosFreqz(sos, fHz, fs);                     // |H| at one frequency
(function (global) {
  // ---- minimal complex arithmetic
  const C = (re, im = 0) => ({ re, im });
  const cadd = (a, b) => C(a.re + b.re, a.im + b.im);
  const csub = (a, b) => C(a.re - b.re, a.im - b.im);
  const cmul = (a, b) => C(a.re * b.re - a.im * b.im, a.re * b.im + a.im * b.re);
  const cdiv = (a, b) => { const d = b.re * b.re + b.im * b.im; return C((a.re * b.re + a.im * b.im) / d, (a.im * b.re - a.re * b.im) / d); };
  const csqrt = a => { const r = Math.hypot(a.re, a.im); const re = Math.sqrt(Math.max(0, (r + a.re) / 2)); const im = Math.sign(a.im || 1) * Math.sqrt(Math.max(0, (r - a.re) / 2)); return C(re, im); };
  const cscale = (a, s) => C(a.re * s, a.im * s);

  function buttap(N) { // analog prototype poles, unit cutoff
    const p = [];
    for (let k = 1; k <= N; k++) { const th = Math.PI * (2 * k - 1) / (2 * N); p.push(C(-Math.sin(th), Math.cos(th))); }
    return { z: [], p, k: 1 };
  }
  function lp2lp(zpk, wo) { return { z: zpk.z.map(v => cscale(v, wo)), p: zpk.p.map(v => cscale(v, wo)), k: zpk.k * Math.pow(wo, zpk.p.length - zpk.z.length) }; }
  function lp2hp(zpk, wo) {
    const z = zpk.z.map(v => cdiv(C(wo), v)), p = zpk.p.map(v => cdiv(C(wo), v));
    const deg = zpk.p.length - zpk.z.length;
    for (let i = 0; i < deg; i++) z.push(C(0));
    let num = C(1), den = C(1);
    zpk.z.forEach(v => { num = cmul(num, cscale(v, -1)); });
    zpk.p.forEach(v => { den = cmul(den, cscale(v, -1)); });
    const kk = cdiv(num, den);
    return { z, p, k: zpk.k * kk.re };
  }
  function lp2bp(zpk, wo, bw) {
    const deg = zpk.p.length - zpk.z.length;
    const tr = v => { const s = cscale(v, bw / 2); const r = csqrt(csub(cmul(s, s), C(wo * wo))); return [cadd(s, r), csub(s, r)]; };
    const z = [], p = [];
    zpk.z.forEach(v => z.push(...tr(v)));
    zpk.p.forEach(v => p.push(...tr(v)));
    for (let i = 0; i < deg; i++) z.push(C(0));
    return { z, p, k: zpk.k * Math.pow(bw, deg) };
  }
  function lp2bs(zpk, wo, bw) {
    const deg = zpk.p.length - zpk.z.length;
    const tr = v => { const s = cdiv(C(bw / 2), v); const r = csqrt(csub(cmul(s, s), C(wo * wo))); return [cadd(s, r), csub(s, r)]; };
    const z = [], p = [];
    zpk.z.forEach(v => z.push(...tr(v)));
    zpk.p.forEach(v => p.push(...tr(v)));
    for (let i = 0; i < deg; i++) { z.push(C(0, wo)); z.push(C(0, -wo)); }
    let num = C(1), den = C(1);
    zpk.z.forEach(v => { num = cmul(num, cscale(v, -1)); });
    zpk.p.forEach(v => { den = cmul(den, cscale(v, -1)); });
    const kk = cdiv(num, den);
    return { z, p, k: zpk.k * kk.re };
  }
  function bilinear(zpk, fs) {
    const fs2 = 2 * fs;
    const deg = zpk.p.length - zpk.z.length;
    const tr = v => cdiv(cadd(C(fs2), v), csub(C(fs2), v));
    const z = zpk.z.map(tr), p = zpk.p.map(tr);
    for (let i = 0; i < deg; i++) z.push(C(-1));
    let num = C(1), den = C(1);
    zpk.z.forEach(v => { num = cmul(num, csub(C(fs2), v)); });
    zpk.p.forEach(v => { den = cmul(den, csub(C(fs2), v)); });
    const kk = cdiv(num, den);
    return { z, p, k: zpk.k * kk.re };
  }
  // pair conjugates -> second-order sections [b0,b1,b2,a0,a1,a2]
  function zpk2sos(zpk) {
    const pairUp = arr => {
      const rest = arr.slice(); const pairs = [];
      while (rest.length) {
        const a = rest.shift();
        if (Math.abs(a.im) < 1e-9) { // real: pair with the nearest real
          let j = rest.findIndex(v => Math.abs(v.im) < 1e-9);
          if (j >= 0) { pairs.push([a, rest.splice(j, 1)[0]]); } else pairs.push([a]);
        } else {
          let j = rest.findIndex(v => Math.abs(v.re - a.re) < 1e-7 && Math.abs(v.im + a.im) < 1e-7);
          if (j >= 0) { pairs.push([a, rest.splice(j, 1)[0]]); } else pairs.push([a, C(a.re, -a.im)]);
        }
      }
      return pairs;
    };
    const poly = pr => { // (x - r1)(x - r2) -> real coefficients [1, c1, c2]
      if (pr.length === 1) return [1, -pr[0].re, 0];
      const s = cadd(pr[0], pr[1]), m = cmul(pr[0], pr[1]);
      return [1, -s.re, m.re];
    };
    // sort poles by closeness to the unit circle so each section pairs zeros nearby (stability of cascade)
    const P = zpk.p.slice().sort((a, b) => Math.hypot(b.re, b.im) - Math.hypot(a.re, a.im));
    const Z = zpk.z.slice();
    const pp = pairUp(P);
    const sos = [];
    pp.forEach((pair, idx) => {
      // choose the zero(s) nearest this pole pair
      const zs = [];
      for (let n = 0; n < pair.length && Z.length; n++) {
        let best = 0, bd = Infinity;
        Z.forEach((v, j) => { const d = Math.hypot(v.re - pair[0].re, Math.abs(v.im) - Math.abs(pair[0].im)); if (d < bd) { bd = d; best = j; } });
        const zz = Z.splice(best, 1)[0];
        zs.push(zz);
        if (Math.abs(zz.im) > 1e-9) { // also remove its conjugate
          const cj = Z.findIndex(v => Math.abs(v.re - zz.re) < 1e-7 && Math.abs(v.im + zz.im) < 1e-7);
          if (cj >= 0) { zs.push(Z.splice(cj, 1)[0]); n++; }
        }
      }
      const b = zs.length ? poly(zs) : [1, 0, 0];
      const a = poly(pair);
      const g = idx === 0 ? zpk.k : 1;
      sos.push([b[0] * g, b[1] * g, b[2] * g, a[0], a[1], a[2]]);
    });
    return sos;
  }

  function butter(N, cutoffHz, fs, btype = 'lowpass') {
    const warp = f => 2 * fs * Math.tan(Math.PI * f / fs);
    let zpk = buttap(N);
    if (btype === 'lowpass') zpk = lp2lp(zpk, warp(cutoffHz));
    else if (btype === 'highpass') zpk = lp2hp(zpk, warp(cutoffHz));
    else {
      const w1 = warp(cutoffHz[0]), w2 = warp(cutoffHz[1]);
      const bw = w2 - w1, wo = Math.sqrt(w1 * w2);
      zpk = btype === 'bandpass' ? lp2bp(zpk, wo, bw) : lp2bs(zpk, wo, bw);
    }
    return zpk2sos(bilinear(zpk, fs));
  }

  function sosfilt(sos, x, zi) { // direct form II transposed, per section
    let y = Float64Array.from(x);
    const st = zi || sos.map(() => [0, 0]);
    sos.forEach(([b0, b1, b2, a0, a1, a2], s) => {
      const z = st[s]; const out = new Float64Array(y.length);
      for (let n = 0; n < y.length; n++) {
        const xn = y[n];
        const yn = b0 * xn + z[0];
        z[0] = b1 * xn - a1 * yn + z[1];
        z[1] = b2 * xn - a2 * yn;
        out[n] = yn;
      }
      y = out;
    });
    return y;
  }
  // steady-state initial conditions for a step of amplitude 1 (like scipy sosfilt_zi)
  function sosfiltZi(sos) {
    let scale = 1;
    return sos.map(([b0, b1, b2, a0, a1, a2]) => {
      // solve for zi such that output is constant for constant input (scale)
      const g = (b0 + b1 + b2) / (1 + a1 + a2); // dc gain of this section
      const z0 = scale * ((b1 - a1 * b0) + (b2 - a2 * b0)) / (1 + a1 + a2) * 1; // approx via steady state
      // exact: z1 = scale*(b2 - a2*b0)... use the standard linear solve
      // Steady state: y = g*scale; z0 = y - b0*scale; z1 = z0 - (b1*scale - a1*y)
      const y = g * scale;
      const zz0 = y - b0 * scale;
      const zz1 = zz0 - (b1 * scale - a1 * y);
      scale = y;
      return [zz0, zz1];
    });
  }
  function sosfiltfilt(sos, x) {
    const n = x.length;
    const pad = Math.min(n - 1, 3 * 3 * sos.length); // ~ 3 * (order) samples (scipy: 3*max(len(a),len(b)))
    // odd extension
    const ext = new Float64Array(n + 2 * pad);
    for (let i = 0; i < pad; i++) ext[i] = 2 * x[0] - x[pad - i];
    for (let i = 0; i < n; i++) ext[pad + i] = x[i];
    for (let i = 0; i < pad; i++) ext[pad + n + i] = 2 * x[n - 1] - x[n - 2 - i];
    const zi = sosfiltZi(sos);
    let y = sosfilt(sos, ext, zi.map(z => [z[0] * ext[0], z[1] * ext[0]]));
    y.reverse();
    y = sosfilt(sos, y, zi.map(z => [z[0] * y[0], z[1] * y[0]]));
    y.reverse();
    return y.slice(pad, pad + n);
  }
  function sosFreqz(sos, fHz, fs) { // magnitude response at a frequency (Hz)
    const w = 2 * Math.PI * fHz / fs;
    const e1 = C(Math.cos(-w), Math.sin(-w)), e2 = C(Math.cos(-2 * w), Math.sin(-2 * w));
    let H = C(1);
    sos.forEach(([b0, b1, b2, a0, a1, a2]) => {
      const num = cadd(C(b0), cadd(cscale(e1, b1), cscale(e2, b2)));
      const den = cadd(C(a0), cadd(cscale(e1, a1), cscale(e2, a2)));
      H = cmul(H, cdiv(num, den));
    });
    return Math.hypot(H.re, H.im);
  }
  function sosPhase(sos, fHz, fs) {
    const w = 2 * Math.PI * fHz / fs;
    const e1 = C(Math.cos(-w), Math.sin(-w)), e2 = C(Math.cos(-2 * w), Math.sin(-2 * w));
    let H = C(1);
    sos.forEach(([b0, b1, b2, a0, a1, a2]) => {
      const num = cadd(C(b0), cadd(cscale(e1, b1), cscale(e2, b2)));
      const den = cadd(C(a0), cadd(cscale(e1, a1), cscale(e2, a2)));
      H = cmul(H, cdiv(num, den));
    });
    return Math.atan2(H.im, H.re);
  }

  // ---- real FFT magnitude (radix-2, zero-padded), returns {f, mag} one-sided, mag scaled 2/N
  function rfftMag(x, fs) {
    let N = 1; while (N < x.length) N <<= 1;
    const re = new Float64Array(N), im = new Float64Array(N);
    for (let i = 0; i < x.length; i++) re[i] = x[i];
    for (let i = 1, j = 0; i < N; i++) { // bit reversal
      let bit = N >> 1; for (; j & bit; bit >>= 1) j ^= bit; j ^= bit;
      if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; }
    }
    for (let len = 2; len <= N; len <<= 1) {
      const ang = -2 * Math.PI / len, wr = Math.cos(ang), wi = Math.sin(ang);
      for (let i = 0; i < N; i += len) {
        let cr = 1, ci = 0;
        for (let j = 0; j < len / 2; j++) {
          const ur = re[i + j], ui = im[i + j];
          const vr = re[i + j + len / 2] * cr - im[i + j + len / 2] * ci;
          const vi = re[i + j + len / 2] * ci + im[i + j + len / 2] * cr;
          re[i + j] = ur + vr; im[i + j] = ui + vi;
          re[i + j + len / 2] = ur - vr; im[i + j + len / 2] = ui - vi;
          const t = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = t;
        }
      }
    }
    const half = N / 2 + 1, f = new Float64Array(half), mag = new Float64Array(half);
    for (let k = 0; k < half; k++) { f[k] = k * fs / N; mag[k] = 2 * Math.hypot(re[k], im[k]) / x.length; }
    return { f, mag };
  }

  const api = { butter, sosfilt, sosfiltfilt, sosFreqz, sosPhase, rfftMag };
  if (typeof module !== 'undefined') module.exports = api;
  global.Butter = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
(() => {
  // ------------------------------------------------------------ data

      series: 'bp',
      title: 'Band-pass filtering to the cardiac band',
      tag: () => `${f1(flo)}–${f1(fhi)} Hz · order ${ORDER}`,
      subtitle: 'How adding a low-pass filter keeps only the cardiac band of the PPG.'
    }
  ];
  const SER = {
    hp: { name: () => `high-pass ${f1(flo)} Hz`, color: 'var(--med)', hex: '#1baf7a', ylabel: 'high-pass (a.u.)' },
    bp: { name: () => `band-pass ${f1(flo)}–${f1(fhi)} Hz`, color: 'var(--ma)', hex: '#2a78d6', ylabel: 'band-pass (a.u.)' }
  };

  // ------------------------------------------------------------ layout
  const W = 1400, H = 640;
  const PL = 84, PR = 34;
  const TOP = { y0: 22, y1: 280 }, BOT = { y0: 336, y1: 592 };
  const xs = t => PL + (t - T0) / (T1 - T0) * (W - PL - PR);
  let rawLo = 0.15, rawHi = 0.95, outLo = -0.4, outHi = 0.5;
  const ysTop = v => TOP.y1 - (v - rawLo) / (rawHi - rawLo) * (TOP.y1 - TOP.y0);
  const ysBot = v => BOT.y1 - (v - outLo) / (outHi - outLo) * (BOT.y1 - BOT.y0);

  const svgNS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs = {}, parent) => { const n = document.createElementNS(svgNS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; };
  function pathOf(arr, ys, iEnd) {
    let d = '';
    for (let i = I0; i <= iEnd; i++) d += (i === I0 ? 'M' : 'L') + xs(i / FS).toFixed(1) + ',' + ys(arr[i]).toFixed(1);
    return d;
  }
  function outRange() {
    const s = STEPS[step].series; if (!s) return;
    const arr = s === 'hp' ? hp : bp;
    let lo = Infinity, hi = -Infinity;
    for (let i = I0; i <= I1; i++) { if (arr[i] < lo) lo = arr[i]; if (arr[i] > hi) hi = arr[i]; }
    const pad = 0.12 * (hi - lo);
    outLo = Math.floor((lo - pad) * 10) / 10; outHi = Math.ceil((hi + pad) * 10) / 10;
  }

  // ------------------------------------------------------------ drawing
  let G = {};
  function panelAxes(p, ys, lo, hi, tickStep, label, withTime) {
    const grid = el('g', { class: 'grid' }, chart);
    const axis = el('g', { class: 'axis' }, chart);
    for (let t = T0; t <= T1 + 1e-9; t += 2.5) {
      el('line', { x1: xs(t), x2: xs(t), y1: p.y0, y2: p.y1 }, grid);
      if (withTime) el('text', { x: xs(t), y: p.y1 + 18, 'text-anchor': 'middle' }, axis).textContent = t.toFixed(1);
    }
    const first = Math.ceil(lo / tickStep - 1e-9) * tickStep;
    for (let v = first; v <= hi + 1e-9; v += tickStep) {
      el('line', { x1: PL, x2: W - PR, y1: ys(v), y2: ys(v) }, grid);
      el('text', { x: PL - 10, y: ys(v) + 4, 'text-anchor': 'end' }, axis).textContent = v.toFixed(1);
    }
    el('path', { d: `M${PL},${p.y0}V${p.y1}H${W - PR}` }, axis);
    const yl = el('text', { class: 'axis-title', 'text-anchor': 'middle', transform: `translate(${PL - 64},${(p.y0 + p.y1) / 2}) rotate(-90)` }, chart);
    yl.textContent = label;
    if (withTime) el('text', { x: (PL + W - PR) / 2, y: p.y1 + 36, class: 'axis-title', 'text-anchor': 'middle' }, chart).textContent = 'time (seconds)';
  }
  function legend(x, y, items) {
    const g = el('g', {}, chart);
    const rowH = 24, padX = 10, padY = 8;
    const wdt = Math.max(...items.map(i => i.n.length)) * 10.5 + 2 * padX + 40;
    x = Math.min(x, W - wdt - 6);
    el('rect', { x, y, width: wdt, height: items.length * rowH + 2 * padY - 4, rx: 4, fill: '#fff', 'fill-opacity': .9, stroke: 'var(--rule)' }, g);
    items.forEach((it, j) => {
      const yy = y + padY + j * rowH + 6;
      el('line', { x1: x + padX, x2: x + padX + 18, y1: yy, y2: yy, stroke: it.c, 'stroke-width': it.dash ? 1.5 : 2.5, 'stroke-dasharray': it.dash ? '5 4' : 'none' }, g);
      el('text', { x: x + padX + 26, y: yy + 4, class: 'axis-title', fill: 'var(--ink)' }, g).textContent = it.n;
    });
    return g;
  }
  function drawStatic() {
    chart.innerHTML = '';
    const s = STEPS[step].series;
    outRange();
    panelAxes(TOP, ysTop, rawLo, rawHi, 0.2, 'raw PPG', !s);
    G.rawPath = el('path', { class: 'raw-line' }, chart);
    legend(PL + 12, TOP.y0 + 8, [{ c: 'var(--raw-dot)', n: 'raw PPG (fingertip, 125 Hz)' }]);
    if (s) {
      panelAxes(BOT, ysBot, outLo, outHi, 0.2, SER[s].ylabel, true);
      el('line', { class: 'zero-line', x1: PL, x2: W - PR, y1: ysBot(0), y2: ysBot(0) }, chart);
      G.outPath = el('path', { class: 'out-line', stroke: SER[s].color }, chart);
      legend(PL + 12, BOT.y0 + 8, [{ c: SER[s].color, n: SER[s].name() }]);
      const note = el('text', { x: W - PR - 8, y: BOT.y0 + 20, class: 'note', 'text-anchor': 'end' }, chart);
      note.textContent = s === 'hp'
        ? `butter(${ORDER}, ${f1(flo)}, btype='high')  →  filtfilt`
        : `butter(${ORDER}, [${f1(flo)}, ${f1(fhi)}], btype='band')  →  filtfilt`;
    } else {
      G.outPath = null;
      const note = el('text', { x: (PL + W - PR) / 2, y: BOT.y0 + 120, class: 'note', 'text-anchor': 'middle', fill: 'var(--ink-3)' }, chart);
      note.textContent = 'filtered signal appears here in the next step';
    }
    G.cursor = el('line', { class: 'cursor-line', x1: 0, x2: 0, y1: TOP.y0, y2: s ? BOT.y1 : TOP.y1 }, chart);
    G.readout = el('text', { x: 0, y: 0, class: 'dlabel' }, chart);
    G.hover = el('g', {}, chart);
    G.hit = el('rect', { x: PL, y: TOP.y0, width: W - PL - PR, height: BOT.y1 - TOP.y0, fill: 'transparent' }, chart);
  }
  function render() {
    const s = STEPS[step].series;
    const iEnd = Math.max(I0, Math.min(I1, Math.round(cursor * FS)));
    G.rawPath.setAttribute('d', pathOf(RAW, ysTop, s ? I1 : iEnd));
    if (s) {
      const arr = s === 'hp' ? hp : bp;
      G.outPath.setAttribute('d', pathOf(arr, ysBot, iEnd));
      const done = cursor >= T1;
      G.readout.setAttribute('x', xs(iEnd / FS) + (iEnd / FS > 26 ? -10 : 10));
      G.readout.setAttribute('text-anchor', iEnd / FS > 26 ? 'end' : 'start');
      G.readout.setAttribute('y', ysBot(arr[iEnd]) - 12);
      G.readout.setAttribute('fill', SER[s].color);
      G.readout.textContent = done ? '' : `y = ${fmt(arr[iEnd])}`;
    } else {
      G.readout.textContent = '';
    }
    const cx = xs(iEnd / FS);
    G.cursor.setAttribute('x1', cx); G.cursor.setAttribute('x2', cx);
    G.cursor.style.opacity = cursor >= T1 ? 0 : 1;
  }

  // ------------------------------------------------------------ hover
  const tt = $('tt');
  function hover(evt) {
    const pt = chart.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY;
    const p = pt.matrixTransform(chart.getScreenCTM().inverse());
    const t = Math.max(T0, Math.min(T1, T0 + (p.x - PL) / (W - PL - PR) * (T1 - T0)));
    const i = Math.round(t * FS);
    const s = STEPS[step].series;
    G.hover.innerHTML = '';
    el('line', { class: 'crosshair', x1: xs(i / FS), x2: xs(i / FS), y1: TOP.y0, y2: s ? BOT.y1 : TOP.y1 }, G.hover);
    let html = `<div class="row"><span>t</span><b>${(i / FS).toFixed(3)} s</b></div><div class="row"><span><i class="sw" style="background:var(--raw-dot)"></i>raw</span><span>${fmt(RAW[i])}</span></div>`;
    if (s && i <= Math.round(cursor * FS)) html += `<div class="row"><span><i class="sw" style="background:${SER[s].hex}"></i>${SER[s].name()}</span><span>${fmt((s === 'hp' ? hp : bp)[i])}</span></div>`;
    tt.innerHTML = html; tt.style.display = 'block';
    const wrap = chart.parentElement.getBoundingClientRect();
    const px = evt.clientX - wrap.left, py = evt.clientY - wrap.top;
    tt.style.left = (px + 16 + tt.offsetWidth > wrap.width ? px - tt.offsetWidth - 12 : px + 16) + 'px';
    tt.style.top = Math.max(0, py - 10) + 'px';
  }
  function unhover() { tt.style.display = 'none'; G.hover.innerHTML = ''; }

  // ------------------------------------------------------------ step control
  function applyPresets() {
    if (!dirty.flo) { flo = PRESET.flo; $('flo').value = flo; $('floVal').textContent = f1(flo) + ' Hz'; }
    if (!dirty.fhi) { fhi = PRESET.fhi; $('fhi').value = fhi; $('fhiVal').textContent = f1(fhi) + ' Hz'; }
  }
  function header() {
    const d = STEPS[step];
    $('title').innerHTML = d.title + `<span class="tag">${d.tag()}</span>`;
    $('subtitle').textContent = typeof d.subtitle === 'function' ? d.subtitle() : d.subtitle;
    $('counter').textContent = `${step + 1} / ${STEPS.length}`;
  }
  function enterStep(k, completed = false) {
    step = Math.max(0, Math.min(STEPS.length - 1, k));
    applyPresets();
    compute();
    header();
    try { history.replaceState(null, '', '#' + (step + 1)); } catch (_) {}
    stopPlay();
    drawStatic();
    cursor = T0;
    if (completed || speedMul === 0 || reduceMotion) finish(); else { render(); startPlay(); }
  }
  const done = () => cursor >= T1;
  function finish() { cursor = T1; stopPlay(); render(); }
  function tick(t) {
    if (!playing) return;
    const dt = Math.max(0, Math.min(0.1, (t - lastT) / 1000)); lastT = t;
    cursor = Math.min(T1, cursor + dt * BASE_RATE * speedMul);
    render();
    if (done()) { finish(); return; }
    raf = requestAnimationFrame(tick);
  }
  function startPlay() {
    if (done()) return;
    if (speedMul === 0) { finish(); return; }
    playing = true; lastT = performance.now();
    $('play').textContent = '⏸';
    raf = requestAnimationFrame(tick);
  }
  function stopPlay() { playing = false; cancelAnimationFrame(raf); $('play').textContent = '▶'; }
  function next() { if (!done()) { finish(); return; } if (step < STEPS.length - 1) enterStep(step + 1); }
  function prev() { if (step > 0) enterStep(step - 1, true); }
  function restart() { enterStep(step); }
  function redraw() { compute(); header(); drawStatic(); render(); }

  // ------------------------------------------------------------ wiring
  $('next').addEventListener('click', e => { e.stopPropagation(); next(); });
  $('prev').addEventListener('click', e => { e.stopPropagation(); prev(); });
  $('restart').addEventListener('click', e => { e.stopPropagation(); restart(); });
  $('play').addEventListener('click', e => { e.stopPropagation(); if (playing) stopPlay(); else if (done()) restart(); else startPlay(); });
  $('slide').addEventListener('click', () => next());
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
    else if (e.key === ' ') { e.preventDefault(); $('play').click(); }
    else if (e.key === 'r' || e.key === 'R') restart();
  });
  $('flo').addEventListener('input', e => { dirty.flo = true; flo = parseFloat(e.target.value); $('floVal').textContent = f1(flo) + ' Hz'; redraw(); });
  $('fhi').addEventListener('input', e => { dirty.fhi = true; fhi = parseFloat(e.target.value); $('fhiVal').textContent = f1(fhi) + ' Hz'; redraw(); });
  $('speed').addEventListener('change', e => { dirty.speed = true; speedMul = parseFloat(e.target.value); if (speedMul === 0 && playing) finish(); });
  $('reset').addEventListener('click', e => {
    e.stopPropagation();
    dirty.flo = dirty.fhi = dirty.speed = false;
    speedMul = 1; $('speed').value = '1';
    enterStep(step);
  });
  chart.addEventListener('mousemove', hover);
  chart.addEventListener('mouseleave', unhover);

  const h = parseInt((location.hash || '').replace('#', ''), 10);
  enterStep(h >= 1 && h <= STEPS.length ? h - 1 : 0);
})();
</script>
</body>
</html>

        const bx = x0 + stripW + 40;
        el('rect', { x: bx, y: y + 4, width: 300, height: 40, rx: 4, fill: '#f6f7f9', stroke: 'var(--rule)' }, g);
        txt(bx + 10, y + 30, `train ${(sw.train[k] * t).toFixed(3)}`, { class: 'mono', fill: '#2a78d6', 'font-weight': 700 }, g);
        txt(bx + 150, y + 30, `validation ${(sw.cv[k] * t).toFixed(3)}`, { class: 'mono', fill: '#4a3aa7', 'font-weight': 700 }, g);
      }
      if (t > 0 && t < 1) el('rect', { x: x0 - 4, y: y - 4, width: stripW + 6, height: 56, fill: 'none', stroke: 'var(--ink)', 'stroke-dasharray': '4 3' }, g);
    }
    const yb = y0 + 5 * rowH + 20;
    const done = p >= 1;
    el('rect', { x: x0, y: yb, width: 1040, height: 96, rx: 6, fill: '#f6f7f9', stroke: 'var(--rule)' }, g);
    txt(x0 + 20, yb + 30, `max_depth = ${depthLabel()}`, { class: 'ptitle' }, g);
    txt(x0 + 20, yb + 68, done ? `mean CV accuracy = ${mean(sw.cv).toFixed(3)} ± ${sd(sw.cv).toFixed(3)}    ·    mean training accuracy = ${mean(sw.train).toFixed(3)}` : 'mean CV accuracy = … (over the 5 validation folds)', { class: 'big', 'font-size': 20, fill: done ? 'var(--ink)' : 'var(--ink-3)' }, g);
    txt(x0 + 700, yb + 30, 'a subject is never in both the training and the validation part of a fold', { class: 'axis-title' }, g);
    legend([{ c: '#2a78d6', n: 'training subjects of the fold', box: true }, { c: '#4a3aa7', n: 'validation subjects of the fold', box: true }], W - 300, H - 60, chart);
  }

  function drawSweep(p) {
    chart.innerHTML = '';
    const g = el('g', {}, chart);
    const PL = 90, PR = 40, PT = 30, PB = 70, pw = W - PL - PR, ph = H - PT - PB;
    const sx = i => PL + (i + 0.5) / SWEEP.length * pw, sy = v => PT + ph - (v - 0.5) / (1.02 - 0.5) * ph;
    const grid = el('g', { class: 'grid' }, g), ax = el('g', { class: 'axis' }, g);
    for (let v = 0.5; v <= 1.001; v += 0.1) { el('line', { x1: PL, x2: W - PR, y1: sy(v), y2: sy(v) }, grid); txt(PL - 8, sy(v) + 4, v.toFixed(1), { 'text-anchor': 'end' }, ax); }
    SWEEP.forEach((s, i) => { el('line', { x1: sx(i), x2: sx(i), y1: PT, y2: PT + ph }, grid); txt(sx(i), PT + ph + 18, DEPTHS[i], { 'text-anchor': 'middle' }, ax); });
    el('path', { d: `M${PL},${PT}V${PT + ph}H${W - PR}` }, ax);
    txt(PL + pw / 2, PT + ph + 44, 'max_depth', { class: 'axis-title', 'text-anchor': 'middle' }, g);
    txt(PL - 50, PT + ph / 2, 'accuracy', { class: 'axis-title', 'text-anchor': 'middle', transform: `rotate(-90 ${PL - 50} ${PT + ph / 2})` }, g);
    const nPts = Math.max(1, Math.min(SWEEP.length, Math.floor(p * SWEEP.length) + 1));
    const frac = clamp01(p * SWEEP.length - (nPts - 1));
    const cvm = SWEEP.map(s => mean(s.cv)), cvs = SWEEP.map(s => sd(s.cv)), trm = SWEEP.map(s => mean(s.train));
    // band
    let band = '';
    for (let i = 0; i < nPts; i++) band += (i ? 'L' : 'M') + sx(i) + ',' + sy(cvm[i] + cvs[i]);
    for (let i = nPts - 1; i >= 0; i--) band += 'L' + sx(i) + ',' + sy(cvm[i] - cvs[i]);
    if (nPts > 1) el('path', { d: band + 'Z', fill: '#2a78d6', opacity: 0.14 }, g);
    const line = (arr, color, dash) => {
      let d = '';
      for (let i = 0; i < nPts; i++) {
        let x = sx(i), y = sy(arr[i]);
        if (i === nPts - 1 && i > 0 && p < 1) { x = sx(i - 1) + (sx(i) - sx(i - 1)) * frac; y = sy(arr[i - 1]) + (sy(arr[i]) - sy(arr[i - 1])) * frac; }
        d += (i ? 'L' : 'M') + x + ',' + y;
      }
      el('path', { d, fill: 'none', stroke: color, 'stroke-width': 2.2, 'stroke-dasharray': dash ? '7 4' : 'none' }, g);
      for (let i = 0; i < nPts - (p < 1 && frac < 1 ? 1 : 0); i++) {
        if (dash) el('rect', { x: sx(i) - 5, y: sy(arr[i]) - 5, width: 10, height: 10, fill: color, stroke: '#fff' }, g);
        else el('circle', { cx: sx(i), cy: sy(arr[i]), r: 5.5, fill: color, stroke: '#fff' }, g);
      }
    };
    line(trm, '#eb6834', false);
    line(cvm, '#2a78d6', true);
    // dial marker
    const xd = sx(di);
    el('line', { x1: xd, x2: xd, y1: PT, y2: PT + ph, stroke: 'var(--ink-2)', 'stroke-dasharray': '3 3' }, g);
    if (di < nPts) {
      txt(xd + (di > 5 ? -8 : 8), sy(trm[di]) - 14, `train ${trm[di].toFixed(3)}`, { class: 'mono', fill: '#eb6834', 'font-weight': 700, 'text-anchor': di > 5 ? 'end' : 'start' }, g);
      txt(xd + (di > 5 ? -8 : 8), sy(cvm[di]) + 22, `CV ${cvm[di].toFixed(3)} ± ${cvs[di].toFixed(3)}`, { class: 'mono', fill: '#2a78d6', 'font-weight': 700, 'text-anchor': di > 5 ? 'end' : 'start' }, g);
      txt(xd + (di > 5 ? -8 : 8), sy(0.56), `max_depth = ${depthLabel()} · gap ${(trm[di] - cvm[di]).toFixed(3)}`, { class: 'mono', fill: 'var(--ink-2)', 'text-anchor': di > 5 ? 'end' : 'start' }, g);
    }
    legend([{ c: '#eb6834', n: 'training accuracy (mean of 5 folds)' }, { c: '#2a78d6', n: '5-fold GroupKFold CV accuracy', dash: true }, { c: '#2a78d6', n: '± 1 std across folds', box: true, op: 0.2 }, { c: 'var(--ink-2)', n: 'max_depth dial', dash: true }], W - PR - 300, PT + ph - 100, chart);
  }

  function confusionUpTo(nWin) {
    const cm = Array.from({ length: 6 }, () => [0, 0, 0, 0, 0, 0]);
    let correct = 0;
    for (let i = 0; i < nWin; i++) { cm[T.y[i] - 1][T.pred[i] - 1]++; if (T.y[i] === T.pred[i]) correct++; }
    return { cm, correct };
  }
  function drawMatrix(g, cm, x0, y0, cell, opts = {}) {
    for (let i = 0; i < 6; i++) {
      const rowSum = cm[i].reduce((a, b) => a + b, 0);
      for (let j = 0; j < 6; j++) {
        const f = rowSum ? cm[i][j] / rowSum : 0;
        el('rect', { x: x0 + j * cell, y: y0 + i * cell, width: cell, height: cell, fill: blues(f), stroke: '#fff' }, g);
        txt(x0 + j * cell + cell / 2, y0 + i * cell + cell / 2 + 6, cm[i][j], { class: 'big', 'font-size': 17, 'text-anchor': 'middle', fill: f > 0.5 ? '#fff' : 'var(--ink)' }, g);
      }
    }
    el('rect', { x: x0, y: y0, width: 6 * cell, height: 6 * cell, fill: 'none', stroke: 'var(--ink-3)' }, g);
    ACT.forEach((n, i) => {
      txt(x0 - 8, y0 + i * cell + cell / 2 + 4, n, { class: 'axis-title', 'text-anchor': 'end' }, g);
      txt(x0 + i * cell + cell / 2, y0 + 6 * cell + 16, n, { class: 'axis-title', 'text-anchor': 'middle' }, g);
    });
    txt(x0 + 3 * cell, y0 + 6 * cell + 36, 'predicted activity', { class: 'axis-title', 'text-anchor': 'middle' }, g);
    txt(x0 - 84, y0 + 3 * cell, 'actual activity', { class: 'axis-title', 'text-anchor': 'middle', transform: `rotate(-90 ${x0 - 84} ${y0 + 3 * cell})` }, g);
  }

  function drawTest(p) {
    chart.innerHTML = '';
    const g = el('g', {}, chart);
    const nWin = Math.round(p * T.y.length);
    const { cm, correct } = confusionUpTo(nWin);
    // left: subjects progress
    const subs = Object.keys(TEST).map(Number);
    let offset = 0;
    txt(60, 30, 'test subjects, windows classified', { class: 'ptitle' }, g);
    subs.forEach((s, k) => {
      const n = TEST[s], done = Math.max(0, Math.min(n, nWin - offset));
      const y = 50 + k * 46;
      txt(60, y + 18, `subject ${s}`, { class: 'mono' }, g);
      el('rect', { x: 170, y: y + 4, width: 220, height: 20, fill: '#eeeeee', rx: 3 }, g);
      el('rect', { x: 170, y: y + 4, width: 220 * done / n, height: 20, fill: '#eb6834', rx: 3 }, g);
      txt(400, y + 18, `${done} / ${n}`, { class: 'mono', fill: 'var(--ink-2)' }, g);
      offset += n;
    });
    const by = 50 + subs.length * 46 + 14;
    el('rect', { x: 60, y: by, width: 400, height: 90, rx: 6, fill: '#f6f7f9', stroke: 'var(--rule)' }, g);
    txt(80, by + 30, `windows classified: ${nWin} of ${T.y.length}`, { class: 'mono', fill: 'var(--ink-2)' }, g);
    txt(80, by + 70, nWin ? `accuracy so far  ${(100 * correct / nWin).toFixed(1)}%` : 'accuracy so far  —', { class: 'big', 'font-size': 24, fill: p >= 1 ? 'var(--ink)' : '#2a78d6' }, g);
    // right: matrix
    drawMatrix(g, cm, 640, 40, 76);
    // colour key
    const kx = 640, ky = 40 + 6 * 76 + 52;
    for (let i = 0; i < 40; i++) el('rect', { x: kx + i * 4, y: ky, width: 4, height: 12, fill: blues(i / 39) }, chart);
    txt(kx + 172, ky + 11, 'fraction of the actual class (row)', { class: 'axis-title' }, chart);
    legend([{ c: '#eb6834', n: 'windows classified so far', box: true }, { c: '#eeeeee', n: 'windows still to classify', box: true }], 60, H - 62, chart);
  }

  function drawErrors(p) {
    chart.innerHTML = '';
    const g = el('g', {}, chart);
    const { cm } = confusionUpTo(T.y.length);
    const x0 = 250, y0 = 40, cell = 80;
    drawMatrix(g, cm, x0, y0, cell);
    const blocks = [
      { r: [0, 3], c: '#eb6834', name: 'walking family', err: cm[0][1] + cm[0][2] + cm[1][0] + cm[1][2] + cm[2][0] + cm[2][1] },
      { r: [3, 5], c: '#1baf7a', name: 'sitting / standing', err: cm[3][4] + cm[4][3] },
      { r: [5, 6], c: '#4a3aa7', name: 'laying', err: 0 },
    ];
    let cross = 0; for (let i = 0; i < 6; i++) for (let j = 0; j < 6; j++) { const bi = i < 3 ? 0 : i < 5 ? 1 : 2, bj = j < 3 ? 0 : j < 5 ? 1 : 2; if (bi !== bj) cross += cm[i][j]; }
    const rx = x0 + 6 * cell + 80;
    txt(rx, y0 + 14, 'errors by block', { class: 'ptitle' }, g);
    blocks.forEach((b, k) => {
      const t = clamp01(p * 3 - k);
      if (t <= 0) return;
      el('rect', { x: x0 + b.r[0] * cell + 2, y: y0 + b.r[0] * cell + 2, width: (b.r[1] - b.r[0]) * cell - 4, height: (b.r[1] - b.r[0]) * cell - 4, fill: 'none', stroke: b.c, 'stroke-width': 3.5, opacity: t }, g);
      const y = y0 + 44 + k * 78;
      txt(rx, y, b.name, { class: 'axis-title' }, g);
      txt(rx, y + 28, `${Math.round(b.err * t)} errors inside the block`, { class: 'big', 'font-size': 18, fill: b.c }, g);
    });
    if (p >= 1) {
      const y = y0 + 44 + 3 * 78;
      txt(rx, y, 'static ↔ dynamic', { class: 'axis-title' }, g);
      txt(rx, y + 28, `${cross} errors across blocks`, { class: 'big', 'font-size': 18, fill: 'var(--ink)' }, g);
      txt(rx, y + 60, `total errors ${T.y.length - cm.reduce((a, r, i) => a + r[i], 0)} of ${T.y.length}`, { class: 'mono', fill: 'var(--ink-2)' }, g);
    }
    legend(blocks.map(b => ({ c: b.c, n: b.name })), rx, H - 84, chart);
  }

  function render() {
    const id = STEPS[step].id;
    if (id === 'split') drawSplit(prog);
    else if (id === 'folds') drawFolds(prog);
    else if (id === 'sweep') drawSweep(prog);
    else if (id === 'test') drawTest(prog);
    else drawErrors(prog);
  }

  // ------------------------------------------------------------ step machinery
  function retitle() { const d = STEPS[step]; $('title').innerHTML = d.title() + `<span class="tag">${d.tag()}</span>`; }
  function enterStep(k, completed = false) {
    stopPlay(); step = k; applyPresets(k);
    const d = STEPS[k];
    retitle();
    $('subtitle').textContent = d.subtitle();
    $('counter').textContent = `${step + 1} / ${STEPS.length}`;
    try { history.replaceState(null, '', '#' + (step + 1)); } catch (_) {}
    prog = 0;
    if (completed || speed === 0 || reduceMotion) { prog = 1; render(); }
    else { render(); startPlay(); }
  }
  function tick(t) {
    if (!playing) return;
    const dt = Math.min(0.1, (t - lastT) / 1000); lastT = t;
    prog = Math.min(1, prog + dt * speed / STEPS[step].dur);
    render();
    if (prog >= 1) { stopPlay(); return; }
    raf = requestAnimationFrame(tick);
  }
  function startPlay() { if (prog >= 1) return; playing = true; lastT = performance.now(); $('play').textContent = '⏸'; raf = requestAnimationFrame(tick); }
  function stopPlay() { playing = false; cancelAnimationFrame(raf); $('play').textContent = '▶'; }
  function finish() { stopPlay(); prog = 1; render(); }
  function next() { if (prog < 1) { finish(); return; } if (step < STEPS.length - 1) enterStep(step + 1); }
  function prev() { if (step > 0) enterStep(step - 1, true); }
  function restart() { enterStep(step); }

  $('next').addEventListener('click', e => { e.stopPropagation(); next(); });
  $('prev').addEventListener('click', e => { e.stopPropagation(); prev(); });
  $('restart').addEventListener('click', e => { e.stopPropagation(); restart(); });
  $('play').addEventListener('click', e => { e.stopPropagation(); if (playing) stopPlay(); else if (prog >= 1) restart(); else startPlay(); });
  $('slide').addEventListener('click', () => next());
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
    else if (e.key === ' ') { e.preventDefault(); $('play').click(); }
    else if (e.key === 'r' || e.key === 'R') restart();
  });
  $('depth').addEventListener('input', e => { dirty.depth = true; di = parseInt(e.target.value, 10); $('depthVal').textContent = depthLabel(); retitle(); render(); });
  $('speed').addEventListener('change', e => { speed = parseFloat(e.target.value); });
  $('reset').addEventListener('click', e => { e.stopPropagation(); for (const k in dirty) delete dirty[k]; di = 4; $('depth').value = 4; $('depthVal').textContent = depthLabel(); enterStep(step); });

  const h = parseInt((location.hash || '').replace('#', ''), 10);
  enterStep(h >= 1 && h <= STEPS.length ? h - 1 : 0);
})();
</script>
</body>
</html>

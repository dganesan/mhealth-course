<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feature Families for Exercise Sequences</title>
</head>
<body>
<style>
  :root {
    color-scheme: light;
    --paper: #ffffff; --ink: #222222; --ink-2: #666666; --ink-3: #9a9a9a;
    --rule: #dcdcdc; --grid: #ececec; --raw: #8f8f8f; --raw-dot: #8c8c8c; --clean: #444444;
    --ma: #2a78d6; --med: #1baf7a; --wm: #4a3aa7; --ewma: #eb6834;
    --sans: "Helvetica Neue", Helvetica, -apple-system, Arial, sans-serif;
    --mono: Menlo, "SF Mono", Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.4; padding-block: 10px 10px; padding-inline: 14px; -webkit-font-smoothing: antialiased; }
  .stage { max-width: 1880px; margin: 0 auto; display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 10px; height: calc(100vh - 20px); }
  .slide { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 16px 30px 8px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 6px; min-height: 0; position: relative; outline: none; cursor: pointer; user-select: none; }
  .slide:focus-visible { box-shadow: 0 0 0 3px rgba(42,120,214,.35); }
  .head h1 { margin: 0; font-size: clamp(20px, 2.2vw, 28px); font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; line-height: 1.15; }
  .head h1 .tag { display: inline-block; font-family: var(--mono); font-weight: 400; font-size: 0.6em; color: var(--ink-2); margin-left: 10px; vertical-align: middle; background: #f4f4f4; padding: 2px 8px; border-radius: 4px; }
  .head p { margin: 6px 0 0; color: #444; font-size: clamp(15px, 1.6vw, 18px); max-width: none; }
  .chart-wrap { position: relative; min-height: 0; height: 100%; display: flex; justify-content: center; align-items: center; }
  svg.chart { display: block; height: 100%; width: auto; max-width: 100%; max-height: 100%; overflow: visible; }
  .tt { position: absolute; pointer-events: none; display: none; background: #fff; border: 1px solid var(--rule); border-radius: 4px; padding: 6px 9px; font-family: var(--mono); font-size: 12px; color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,.08); white-space: nowrap; z-index: 2; }
  .tt .row { display: flex; gap: 10px; justify-content: space-between; }
  .tt .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .foot { position: absolute; top: 9px; right: 16px; display: flex; gap: 14px; align-items: baseline; font-size: 12px; color: var(--ink-3); padding: 0; pointer-events: none; }
  .foot .ctr { font-family: var(--mono); }
  .bar { display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; padding:9px 14px; border:1px solid var(--rule); border-radius:6px; background:#f6f7f9; font-size:14px; color:var(--ink); }
  .group { display:flex; align-items:center; gap:8px; }
  .group label { font-size:13px; font-weight:700; color:var(--ink); letter-spacing:0; text-transform:none; }
  .val { font-family:var(--mono); font-size:14px; font-weight:700; color:var(--ma); min-width:5ch; }
  button, select { font:inherit; font-size:14px; color:var(--ink); background:#fff; border:1px solid #9a9a9a; border-radius:5px; padding:7px 13px; cursor:pointer; }
  button:hover, select:hover { border-color:var(--ink); }
  button.primary { background:var(--ma); color:#fff; border-color:var(--ma); min-width:88px; font-weight:700; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline:2px solid var(--ma); outline-offset:2px; }
  input[type=range] { accent-color:var(--ma); width:150px; height:30px; cursor:pointer; }
  .hint { margin-left:auto; color:var(--ink-2); font-size:12px; }
  .hint kbd { font-family:var(--mono); background:#fff; border:1px solid var(--rule); border-radius:3px; padding:0 5px; font-size:11px; }
  .grid line { stroke: var(--grid); stroke-width: 1; }
  .axis line, .axis path { stroke: var(--ink-2); stroke-width: 1; fill: none; }
  .axis text { font-family: var(--mono); font-size: 15px; fill: var(--ink-2); }
  .axis-title { font-family: var(--sans); font-size: 18px; fill: var(--ink-2); }
  .ptitle { font-family: var(--sans); font-size: 15px; font-weight: 700; fill: var(--ink); }
  .mono { font-family: var(--mono); font-size: 15px; fill: var(--ink); }
  .big { font-family: var(--mono); font-size: 22px; font-weight: 700; }
  .trace { fill: none; stroke-width: 1.6; stroke-linejoin: round; }
  .legend text { font-family: var(--sans); font-size: 15px; fill: var(--ink); }
  .crosshair { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 2 2; }
  @media (max-width: 720px) { .slide { padding: 18px 16px 12px; min-height: 0; } .hint { display: none; } }
  .hint { display:none !important; }
  button.tb { min-width:44px; padding:6px 10px; font-size:17px; line-height:1; }
  button.primary.tb { min-width:52px; }
</style>

<div class="stage">
  <section class="slide" id="slide" tabindex="0" aria-live="polite">
    <div class="head">
      <h1 id="title">Feature families</h1>
      <p id="subtitle"></p>
    </div>
    <div class="chart-wrap">
      <svg class="chart" id="chart" viewBox="0 0 1400 640" role="img" aria-label="Exercise feature spaces"></svg>
      <div class="tt" id="tt"></div>
    </div>
    <div class="foot">
      <span>CS328 &nbsp;·&nbsp; Case Studies in Activity Recognition</span>
      <span class="ctr" id="counter"></span>
    </div>
  </section>

  <div class="bar">
    <div class="group">
      <button id="prev" class="tb" title="Previous step (←)">⏮</button>
      <button id="play" class="primary tb" title="Play / pause (space)">▶</button>
      <button id="next" class="tb" title="Next step (→)">⏭</button>
      <button id="restart" class="tb" title="Restart this step (r)">↺</button>
      <button id="reset" title="Reset all dials to the step presets">Reset dials</button>
    </div>
    <div class="group">
      <label for="space">Feature space</label>
      <select id="space">
        <option value="T">time-domain (mean, std)</option>
        <option value="F">frequency-domain (dominant freq, energy)</option>
        <option value="D">DTW similarity (2-D MDS)</option>
      </select>
    </div>
    <div class="group">
      <label for="hl">Highlight class</label>
      <select id="hl">
        <option value="all">all three</option>
        <option value="lateral_raise">lateral raise</option>
        <option value="bicep_curl">bicep curl</option>
        <option value="crunch">crunch</option>
      </select>
    </div>
    <div class="group">
      <label for="speed">Speed</label>
      <select id="speed">
        <option value="0.25">very slow</option>
        <option value="0.5">slow</option>
        <option value="1" selected>normal</option>
        <option value="2.5">fast</option>
        <option value="0">instant</option>
      </select>
    </div>
    <span class="hint"><kbd>→</kbd> finish / next &nbsp; <kbd>←</kbd> back &nbsp; <kbd>space</kbd> play</span>
  </div>
</div>

  }

  // linear / log scales
  function axisX(g, sx, ticks, y0, y1, fmtf, yLab) {
    const grid = el('g', { class: 'grid' }, g), ax = el('g', { class: 'axis' }, g);
    ticks.forEach(v => { const x = sx(v); el('line', { x1: x, x2: x, y1: y0, y2: y1 }, grid); txt(x, y1 + 18, fmtf(v), { 'text-anchor': 'middle' }, ax); });
    return ax;
  }
  function axisY(g, sy, ticks, x0, x1, fmtf) {
    const grid = el('g', { class: 'grid' }, g), ax = el('g', { class: 'axis' }, g);
    ticks.forEach(v => { const y = sy(v); el('line', { x1: x0, x2: x1, y1: y, y2: y }, grid); txt(x0 - 8, y + 4, fmtf(v), { 'text-anchor': 'end' }, ax); });
    return ax;
  }

  // ------------------------------------------------------------ feature spaces
  const PL = 84, PR = 40, PT = 30, PB = 70;
  const plotW = W - PL - PR, plotH = H - PT - PB;
  const SPACES = {
    T: {
      name: 'time-domain', xLab: 'mean |ω| (rad/s)', yLab: 'std |ω| (rad/s)',
      x: s => s.mean, y: s => s.std,
      sx: v => PL + (v - 0.3) / (3.5 - 0.3) * plotW, sy: v => PT + plotH - (v - 0.25) / (1.85 - 0.25) * plotH,
      xt: [0.5, 1, 1.5, 2, 2.5, 3, 3.5], yt: [0.25, 0.5, 0.75, 1, 1.25, 1.5, 1.75], xf: v => fmt(v, 1), yf: v => fmt(v, 2),
    },
    F: {
      name: 'frequency-domain', xLab: 'dominant frequency (Hz)', yLab: 'band energy (0.2–3 Hz), log scale',
      x: s => s.dom_freq, y: s => s.energy,
      sx: v => PL + (v - 0.1) / (2.0 - 0.1) * plotW, sy: v => PT + plotH - (Math.log10(v) - 4) / (7.6 - 4) * plotH,
      xt: [0.25, 0.5, 0.75, 1, 1.25, 1.5, 1.75, 2], yt: [1e4, 1e5, 1e6, 1e7], xf: v => fmt(v, 2), yf: v => '10' + ['⁴','⁵','⁶','⁷'][Math.round(Math.log10(v)) - 4],
    },
    D: {
      name: 'DTW similarity', xLab: 'MDS dimension 1', yLab: 'MDS dimension 2',
      x: s => s.mds[0], y: s => s.mds[1],
      sx: v => PL + (v + 50) / 130 * plotW, sy: v => PT + plotH - (v + 40) / 95 * plotH,
      xt: [], yt: [], xf: v => '', yf: v => '',
    },
  };

  // ------------------------------------------------------------ state
  const dirty = {};
  let space = 'T', hl = 'all', speed = 1;
  let step = 0, prog = 0, playing = false, raf = 0, lastT = 0;
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const STEPS = [
    { id: 'pace', dur: 12,
      title: () => 'The same exercise performed at two paces', tag: () => `lateral raise · ${PACE.slow.spr} s/rep vs ${PACE.fast.spr} s/rep`,
      subtitle: () => 'Comparing the gyroscope traces of the same exercise performed at two paces.',
      presets: {} },
    { id: 'T', dur: 10, presets: { space: 'T' },
      title: () => 'Time-domain features: mean and std of |ω|', tag: () => '93 sequences · 35 / 25 / 33',
      subtitle: () => 'The sequences plotted by the mean and standard deviation of their gyroscope magnitude.' },
    { id: 'F', dur: 8, presets: { space: 'F' },
      title: () => 'Frequency-domain features: dominant frequency, band energy', tag: () => '93 sequences · 0.2–3 Hz band',
      subtitle: () => 'The same sequences plotted by dominant frequency and band energy.' },
    { id: 'D', dur: 8, presets: { space: 'D' },
      title: () => 'DTW similarity: 2-D MDS of the pairwise distances', tag: () => '93 × 93 DTW distances',
      subtitle: () => 'The same sequences placed so that distance on the map matches DTW distance.' },
    { id: 'cm', dur: 12, presets: {},
      title: () => 'Confusion matrices under each feature family', tag: () => 'leave-one-subject-out · random forest',
      subtitle: () => 'Filling the confusion matrix for each feature family in turn.' },
  ];

  function applyPresets(k) { const p = STEPS[k].presets; if (p.space !== undefined && !dirty.space) { space = p.space; $('space').value = space; } }

  // ------------------------------------------------------------ drawing
  let G = {};
  function drawPace(p) {
    chart.innerHTML = '';
    const rows = [{ k: 'slow', y0: PT, name: 'A: slow set', color: '#2a78d6' }, { k: 'fast', y0: PT + 300, name: 'B: fast set', color: '#eb6834' }];
    const ph = 230, tMax = 50, yMax = 6;
    const sx = t => PL + t / tMax * plotW;
    const tNow = tMax * p;
    rows.forEach(rw => {
      const d = PACE[rw.k];
      const g = el('g', {}, chart);
      const sy = v => rw.y0 + ph - v / yMax * ph;
      axisY(g, sy, [0, 2, 4, 6], PL, W - PR, v => v);
      const ax = axisX(g, sx, [0, 10, 20, 30, 40, 50], rw.y0, rw.y0 + ph, v => v);
      el('path', { d: `M${PL},${rw.y0}V${rw.y0 + ph}H${W - PR}` }, ax);
      txt(W - PR, rw.y0 + ph + 40, 'time (s)', { class: 'axis-title', 'text-anchor': 'end' }, g);
      txt(PL - 62, rw.y0 + ph / 2, 'rad/s', { class: 'axis-title', transform: `rotate(-90 ${PL - 62} ${rw.y0 + ph / 2})`, 'text-anchor': 'middle' }, g);
      txt(PL, rw.y0 - 10, `${rw.name}: ${d.spr} s per repetition, ${d.reps} reps in ${d.dur} s`, { class: 'ptitle' }, g);
      // trace up to tNow
      const n = Math.min(d.x.length, Math.floor(tNow * d.fs) + 1);
      let path = '';
      for (let i = 0; i < n; i++) path += (i ? 'L' : 'M') + sx(i / d.fs).toFixed(1) + ',' + sy(Math.min(d.x[i], yMax)).toFixed(1);
      if (path) el('path', { class: 'trace', d: path, stroke: rw.color }, g);
      if (p < 1 && tNow <= d.x.length / d.fs) el('line', { x1: sx(tNow), x2: sx(tNow), y1: rw.y0, y2: rw.y0 + ph, class: 'crosshair' }, g);
      // repetition-length bar
      const y = rw.y0 + 14;
      el('line', { x1: sx(0), x2: sx(d.spr), y1: y, y2: y, stroke: rw.color, 'stroke-width': 3 }, g);
      el('line', { x1: sx(0), x2: sx(0), y1: y - 5, y2: y + 5, stroke: rw.color, 'stroke-width': 1.5 }, g);
      el('line', { x1: sx(d.spr), x2: sx(d.spr), y1: y - 5, y2: y + 5, stroke: rw.color, 'stroke-width': 1.5 }, g);
      txt(sx(d.spr) + 8, y + 4, `one repetition ≈ ${d.spr} s`, { class: 'mono', fill: rw.color }, g);
    });
    legend([{ c: '#2a78d6', n: `A: slow set, ${PACE.slow.spr} s per repetition` }, { c: '#eb6834', n: `B: fast set, ${PACE.fast.spr} s per repetition` }], W - PR - 300, PT + 4, chart);
  }

  function drawScatter(fromKey, toKey, p, appearFrac) {
    chart.innerHTML = '';
    const S = SPACES[toKey], F = SPACES[fromKey];
    const g = el('g', {}, chart);
    axisY(g, S.sy, S.yt, PL, W - PR, S.yf);
    const ax = axisX(g, S.sx, S.xt, PT, PT + plotH, S.xf);
    el('path', { d: `M${PL},${PT}V${PT + plotH}H${W - PR}` }, ax);
    txt(PL + plotW / 2, PT + plotH + 44, S.xLab, { class: 'axis-title', 'text-anchor': 'middle' }, g);
    txt(PL - 62, PT + plotH / 2, S.yLab, { class: 'axis-title', transform: `rotate(-90 ${PL - 62} ${PT + plotH / 2})`, 'text-anchor': 'middle' }, g);
    const pts = el('g', {}, chart);
    G.pts = [];
    const q = ease(p);
    SEQ.forEach((s, i) => {
      if (appearFrac !== null && APPEAR[i] / SEQ.length >= appearFrac) return;
      const x1 = S.sx(S.x(s)), y1 = S.sy(S.y(s));
      let x = x1, y = y1;
      if (fromKey !== toKey) { const x0 = F.sx(F.x(s)), y0 = F.sy(F.y(s)); x = x0 + (x1 - x0) * q; y = y0 + (y1 - y0) * q; }
      const dim = hl !== 'all' && s.cls !== hl;
      const m = marker(s.cls, x, y, 6.5, { opacity: dim ? 0.15 : 0.9 }, pts);
      G.pts.push({ x, y, i });
    });
    legend(CLASSES.map(c => ({ cls: c, n: `${CL[c].name} (${CL[c].n} sequences)` })), toKey === 'F' ? PL + 14 : W - PR - 224, PT + 10, chart);
    G.hit = el('rect', { x: PL, y: PT, width: plotW, height: plotH, fill: 'transparent' }, chart);
  }

  function blues(f) { // 0..1 -> light-to-dark blue (like matplotlib Blues)
    const a = [247, 251, 255], b = [8, 48, 107];
    const c = a.map((v, i) => Math.round(v + (b[i] - v) * Math.pow(f, 0.85)));
    return `rgb(${c[0]},${c[1]},${c[2]})`;
  }

  function drawCM(p) {
    chart.innerHTML = '';
    const names = CLASSES.map(c => CL[c].name);
    const pw = 252, cell = 84, gap = 42, x0 = (W - (4 * pw + 3 * gap)) / 2 + 40, y0 = 150;
    CM.forEach((cm, k) => {
      const t = Math.max(0, Math.min(1, (p * 4 - k)));
      const gx = x0 + k * (pw + gap);
      const g = el('g', {}, chart);
      txt(gx + 1.5 * cell, y0 - 44, cm.name, { class: 'ptitle', 'text-anchor': 'middle' }, g);
      txt(gx + 1.5 * cell, y0 - 27, cm.sub, { class: 'axis-title', 'text-anchor': 'middle' }, g);
      const accNow = Math.round(cm.acc * t);
      txt(gx + 1.5 * cell, y0 - 6, t > 0 ? `accuracy = ${accNow}%` : 'accuracy = —', { class: 'mono', 'text-anchor': 'middle', 'font-weight': 700, fill: t >= 1 ? 'var(--ink)' : 'var(--ink-2)' }, g);
      for (let i = 0; i < 3; i++) {
        const rowSum = cm.m[i].reduce((a, b) => a + b, 0);
        for (let j = 0; j < 3; j++) {
          const v = Math.round(cm.m[i][j] * t);
          const f = v / rowSum;
          el('rect', { x: gx + j * cell, y: y0 + i * cell, width: cell, height: cell, fill: t > 0 ? blues(f) : '#fbfcfe', stroke: '#fff' }, g);
          if (t > 0) txt(gx + j * cell + cell / 2, y0 + i * cell + cell / 2 + 6, v, { class: 'big', 'text-anchor': 'middle', fill: f > 0.5 ? '#fff' : 'var(--ink)', 'font-size': 20 }, g);
        }
      }
      el('rect', { x: gx, y: y0, width: 3 * cell, height: 3 * cell, fill: 'none', stroke: 'var(--ink-3)' }, g);
      names.forEach((n, i) => {
        txt(gx + i * cell + cell / 2, y0 + 3 * cell + 18, n, { class: 'axis-title', 'text-anchor': 'middle' }, g);
        if (k === 0) txt(gx - 8, y0 + i * cell + cell / 2 + 4, n, { class: 'axis-title', 'text-anchor': 'end' }, g);
      });
      txt(gx + 1.5 * cell, y0 + 3 * cell + 38, 'predicted', { class: 'axis-title', 'text-anchor': 'middle' }, g);
      if (k === 0) txt(gx - 112, y0 + 1.5 * cell, 'true exercise', { class: 'axis-title', 'text-anchor': 'middle', transform: `rotate(-90 ${gx - 112} ${y0 + 1.5 * cell})` }, g);
    });
    // colour key
    const kx = x0, ky = y0 + 3 * cell + 70;
    for (let i = 0; i < 40; i++) el('rect', { x: kx + i * 4, y: ky, width: 4, height: 12, fill: blues(i / 39) }, chart);
    txt(kx, ky + 28, '0', { class: 'axis', 'font-family': 'var(--mono)', 'font-size': 15, fill: 'var(--ink-2)' }, chart);
    txt(kx + 160, ky + 28, '1', { 'font-family': 'var(--mono)', 'font-size': 15, fill: 'var(--ink-2)', 'text-anchor': 'end' }, chart);
    txt(kx + 172, ky + 11, 'fraction of the true class', { class: 'axis-title' }, chart);
  }

  function render() {
    const d = STEPS[step];
    if (d.id === 'pace') drawPace(prog);
    else if (d.id === 'T') drawScatter(space, space, 1, prog);
    else if (d.id === 'F' || d.id === 'D') {
      const from = dirty.space ? (step > 1 ? prevSpace : space) : (d.id === 'F' ? 'T' : 'F');
      drawScatter(from, space, prog, null);
    }
    else drawCM(prog);
  }
  let prevSpace = 'T';

  // ------------------------------------------------------------ hover
  const tt = $('tt');
  chart.addEventListener('mousemove', evt => {
    if (!G.pts || !G.pts.length) return;
    const pt = chart.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY;
    const q = pt.matrixTransform(chart.getScreenCTM().inverse());
    let best = null, bd = 1e9;
    G.pts.forEach(o => { const dd = (o.x - q.x) ** 2 + (o.y - q.y) ** 2; if (dd < bd) { bd = dd; best = o; } });
    if (!best || bd > 14 * 14) { tt.style.display = 'none'; return; }
    const s = SEQ[best.i];
    tt.innerHTML = `<div class="row"><span><i class="sw" style="background:${CL[s.cls].color}"></i>${CL[s.cls].name}</span><span>subject ${s.subject}</span></div>` +
      `<div class="row"><span>mean |ω|</span><span>${fmt(s.mean)} rad/s</span></div><div class="row"><span>std |ω|</span><span>${fmt(s.std)} rad/s</span></div>` +
      `<div class="row"><span>dominant freq</span><span>${fmt(s.dom_freq)} Hz</span></div><div class="row"><span>band energy</span><span>${s.energy.toExponential(2)}</span></div>` +
      (s.spr ? `<div class="row"><span>pace</span><span>${fmt(s.spr, 2)} s/rep</span></div>` : '');
    tt.style.display = 'block';
    const wrap = chart.parentElement.getBoundingClientRect();
    const px = evt.clientX - wrap.left, py = evt.clientY - wrap.top;
    tt.style.left = (px + 16 + tt.offsetWidth > wrap.width ? px - tt.offsetWidth - 12 : px + 16) + 'px';
    tt.style.top = Math.max(0, py - 10) + 'px';
  });
  chart.addEventListener('mouseleave', () => { tt.style.display = 'none'; });

  // ------------------------------------------------------------ step machinery
  function enterStep(k, completed = false) {
    stopPlay();
    if (k !== step && STEPS[k].id !== 'pace' && STEPS[k].id !== 'cm') prevSpace = space;
    step = k;
    applyPresets(k);
    const d = STEPS[k];
    $('title').innerHTML = d.title() + `<span class="tag">${d.tag()}</span>`;
    $('subtitle').textContent = d.subtitle();
    $('counter').textContent = `${step + 1} / ${STEPS.length}`;
    try { history.replaceState(null, '', '#' + (step + 1)); } catch (_) {}
    prog = 0;
    if (completed || speed === 0 || reduceMotion) { prog = 1; render(); }
    else { render(); startPlay(); }
  }
  function tick(t) {
    if (!playing) return;
    const dt = Math.min(0.1, (t - lastT) / 1000); lastT = t;
    prog = Math.min(1, prog + dt * speed / STEPS[step].dur);
    render();
    if (prog >= 1) { stopPlay(); return; }
    raf = requestAnimationFrame(tick);
  }
  function startPlay() { if (prog >= 1) return; playing = true; lastT = performance.now(); $('play').textContent = '⏸'; raf = requestAnimationFrame(tick); }
  function stopPlay() { playing = false; cancelAnimationFrame(raf); $('play').textContent = '▶'; }
  function finish() { stopPlay(); prog = 1; render(); }
  function next() { if (prog < 1) { finish(); return; } if (step < STEPS.length - 1) enterStep(step + 1); }
  function prev() { if (step > 0) enterStep(step - 1, true); }
  function restart() { enterStep(step); }

  $('next').addEventListener('click', e => { e.stopPropagation(); next(); });
  $('prev').addEventListener('click', e => { e.stopPropagation(); prev(); });
  $('restart').addEventListener('click', e => { e.stopPropagation(); restart(); });
  $('play').addEventListener('click', e => { e.stopPropagation(); if (playing) stopPlay(); else if (prog >= 1) restart(); else startPlay(); });
  $('slide').addEventListener('click', () => next());
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
    else if (e.key === ' ') { e.preventDefault(); $('play').click(); }
    else if (e.key === 'r' || e.key === 'R') restart();
  });
  $('space').addEventListener('change', e => { dirty.space = true; prevSpace = space; space = e.target.value; render(); });
  $('hl').addEventListener('change', e => { dirty.hl = true; hl = e.target.value; render(); });
  $('speed').addEventListener('change', e => { speed = parseFloat(e.target.value); });
  $('reset').addEventListener('click', e => { e.stopPropagation(); for (const k in dirty) delete dirty[k]; hl = 'all'; $('hl').value = 'all'; enterStep(step); });

  const h = parseInt((location.hash || '').replace('#', ''), 10);
  enterStep(h >= 1 && h <= STEPS.length ? h - 1 : 0);
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exercise Classification, End to End</title>
</head>
<body>
<style>
  :root {
    color-scheme: light;
    --paper: #ffffff; --ink: #222222; --ink-2: #666666; --ink-3: #9a9a9a; --rule: #dcdcdc; --grid: #ececec; --ma: #2a78d6;
    --sans: "Helvetica Neue", Helvetica, -apple-system, Arial, sans-serif;
    --mono: Menlo, "SF Mono", Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  #app { height: 100vh; padding: 10px 14px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px; }
  .head { padding: 4px 16px 0; }
  h1 { margin: 0; font-size: clamp(24px, 2.4vw, 36px); font-weight: 700; letter-spacing: -0.01em; }
  .main { user-select: none; -webkit-user-select: none; min-height: 0; border: 1px solid var(--rule); border-radius: 6px; padding: 10px 16px; }
  .main svg { width: 100%; height: 100%; display: block; }
  svg text { font-family: var(--sans); }
  .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 18px; border: 1px solid var(--rule); border-radius: 6px; background: #f6f7f9; }
  button { font: inherit; font-size: 18px; color: var(--ink); background: #fff; border: 1px solid #9a9a9a; border-radius: 6px; padding: 9px 16px; cursor: pointer; }
  button:hover { border-color: var(--ink); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--ma); color: #fff; border-color: var(--ma); font-weight: 700; min-width: 120px; }
  .ctl { display: inline-flex; align-items: center; gap: 10px; margin-left: 10px; flex: 1; max-width: 640px; }
  .ctl .lbl { font-family: var(--mono); font-size: 17px; color: var(--ink-2); white-space: nowrap; }
  .ctl b { font-family: var(--mono); font-size: 18px; color: var(--ma); min-width: 3ch; }
  input[type=range] { flex: 1; accent-color: var(--ma); height: 26px; }
  .step { font-family: var(--mono); font-size: 17px; color: var(--ink-2); margin-left: auto; }
  .hide { display: none !important; }
</style>

<div id="app">
  <div class="head"><h1 id="title"></h1></div>
  <div class="main"><svg id="fig" viewBox="0 0 1600 760"></svg></div>
  <div class="bar">
    <button id="prev" title="Previous step (←)">⏮ step</button>
    <button id="next" title="Next step (→)">step ⏭</button>
    <button id="play" class="primary" title="Play again (space)">▶ Play</button>

    <span class="step" id="stepno"></span>
  </div>
</div>

<script>
(() => {
// ------------------------------------------------------------ shared by the chapter 7 pages (built by tools/ch7-pages/build.py)
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const el = (parent, tag, attrs, text) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; parent.appendChild(e); return e; };
const BLUE = '#2a78d6', DEEP = '#1d5fae', TINT = '#e8f1fd', GREY = '#9a9a9a', OK = '#1baf7a', BAD = '#d6453d';
const CLS = { W: { name: 'Walking', col: '#2a78d6' }, R: { name: 'Running', col: '#7a3fb0' } };
const clamp01 = v => Math.max(0, Math.min(1, v));
const ease = u => { u = clamp01(u); return u * u * (3 - 2 * u); };
// a rounded box with centred lines of text; kind is 'data' (grey), 'model' (white, blue edge), 'agg' (blue tint) or 'out' (blue tint, bold)
function box(g, cx, cy, w, h, lines, kind = 'model', o = {}) {
  const st = { data: ['#f6f7f9', GREY, '#222', 400], model: ['#fff', BLUE, '#222', 400], agg: [TINT, BLUE, DEEP, 700], out: [TINT, BLUE, DEEP, 700] }[kind];
  const b = el(g, 'g', { opacity: o.opacity == null ? 1 : o.opacity });
  el(b, 'rect', { x: cx - w / 2, y: cy - h / 2, width: w, height: h, rx: 12, fill: o.fill || st[0], stroke: o.stroke || st[1], 'stroke-width': kind === 'out' ? 3 : 2 });
  const fs = o.fs || 23, n = lines.length;
  lines.forEach((s, i) => el(b, 'text', { x: cx, y: cy + (o.dy || 0) + (i - (n - 1) / 2) * fs * 1.2 + fs * 0.36, 'text-anchor': 'middle', 'font-size': fs, 'font-weight': o.weight || st[3], fill: o.color || st[2] }, s));
  return b;
}
// an arrow from (x1,y1) to (x2,y2), drawn up to fraction u of its length
function arrow(g, x1, y1, x2, y2, u = 1, o = {}) {
  if (u <= 0) return;
  const x = x1 + (x2 - x1) * u, y = y1 + (y2 - y1) * u, a = Math.atan2(y2 - y1, x2 - x1), col = o.col || '#7a8ea8', w = o.w || 2.5;
  el(g, 'line', { x1, y1, x2: x - Math.cos(a) * 8, y2: y - Math.sin(a) * 8, stroke: col, 'stroke-width': w, 'stroke-dasharray': o.dash || 'none' });
  el(g, 'path', { d: `M${x},${y} L${x - Math.cos(a - 0.4) * 15},${y - Math.sin(a - 0.4) * 15} L${x - Math.cos(a + 0.4) * 15},${y - Math.sin(a + 0.4) * 15} Z`, fill: col });
}
// the small tree drawn in the book's figures: a root, two inner nodes, four leaves
function miniTree(g, cx, cy, s, col = BLUE, opacity = 1) {
  const t = el(g, 'g', { opacity });
  const P = { r: [0, -1], a: [-0.7, -0.3], b: [0.7, -0.3], l: [[-1, 0.4], [-0.4, 0.4], [0.4, 0.4], [1, 0.4]] }, X = p => cx + p[0] * s, Y = p => cy + p[1] * s;
  [[P.r, P.a], [P.r, P.b], [P.a, P.l[0]], [P.a, P.l[1]], [P.b, P.l[2]], [P.b, P.l[3]]].forEach(([p, q]) => el(t, 'line', { x1: X(p), y1: Y(p), x2: X(q), y2: Y(q), stroke: col, 'stroke-width': Math.max(1.5, s / 18) }));
  el(t, 'circle', { cx: X(P.r), cy: Y(P.r), r: s * 0.13, fill: col });
  [P.a, P.b].forEach(p => el(t, 'circle', { cx: X(p), cy: Y(p), r: s * 0.1, fill: col }));
  P.l.forEach(p => el(t, 'circle', { cx: X(p), cy: Y(p), r: s * 0.085, fill: col, 'fill-opacity': 0.75 }));
  return t;
}
// a numbered chip for one training window, coloured by its activity
function chip(g, x, y, id, c, o = {}) {
  const s = o.s || 1, w = 40 * s, h = 32 * s;
  const k = el(g, 'g', { opacity: o.opacity == null ? 1 : o.opacity });
  el(k, 'rect', { x: x - w / 2, y: y - h / 2, width: w, height: h, rx: 6 * s, fill: CLS[c].col, stroke: o.ring || 'none', 'stroke-width': o.ring ? 4 : 0 });
  el(k, 'text', { x, y: y + 7 * s, 'text-anchor': 'middle', 'font-size': 20 * s, 'font-weight': 700, fill: '#fff' }, id);
  return k;
}
// a seeded random generator, so a page shows the same draw every time it loads
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

// ------------------------------------------------------------ steps: each has a title, draw(g, t) and T, the length of its animation in seconds
// `ctl` lists the ids of the bar controls the step shows; Play runs the animation
let step = 0, t = 0, timer = null, STEPS = [];
const PACE = 2.5;   // animations play this many times slower than their step times, to match talking through them
function draw() {
  const S = STEPS[step], svg = $('fig'); svg.innerHTML = '';
  $('title').textContent = S.title; $('stepno').textContent = `step ${step + 1} of ${STEPS.length}`;
  $('prev').disabled = step === 0; $('next').disabled = step === STEPS.length - 1 && (!S.T || t >= S.T);
  $('play').classList.toggle('hide', !S.T); $('play').textContent = S.playLabel || '▶ Play';
  document.querySelectorAll('.ctl').forEach(c => c.classList.toggle('hide', !(S.ctl || []).includes(c.id)));
  S.draw(el(svg, 'g', {}), t);
}
function play() {
  const S = STEPS[step]; clearInterval(timer); t = 0; if (S.reset) S.reset();
  if (!S.T) { draw(); return; }
  const t0 = performance.now();
  timer = setInterval(() => { t = Math.min(S.T, (performance.now() - t0) / 1000 / PACE); if (t >= S.T) clearInterval(timer); draw(); }, 30);
  draw();
}
// a step opens at the start of its animation and waits for Play; Back shows it finished
function go(s, back = false) {
  clearInterval(timer); step = Math.max(0, Math.min(STEPS.length - 1, s)); history.replaceState(null, '', '#' + (step + 1));
  if (STEPS[step].enter) STEPS[step].enter();
  t = back ? STEPS[step].T || 0 : 0; draw();
}
function start() {
  // stepping forward first shows the end of the current step's animation, then moves on
  const fwd = () => { const S = STEPS[step]; if (S.T && t < S.T) { clearInterval(timer); t = S.T; draw(); } else go(step + 1); };
  $('prev').onclick = () => go(step - 1, true); $('next').onclick = fwd; $('play').onclick = () => play();
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight') fwd(); else if (e.key === 'ArrowLeft') go(step - 1, true);
    else if (e.key === ' ' && STEPS[step].T) { e.preventDefault(); play(); }
  });
  go((parseInt(location.hash.slice(1), 10) || 1) - 1);
}

// ------------------------------------------------------------ shared by the chapter 8 pipeline pages: the strip of stages across the top
// (the page defines STAGES, [name, what it produced]) and the band of code along the bottom
const TR = '#2a78d6', TE = '#56657a', RED = '#d6453d';
const label = (g, x, y, s, o = {}) => el(g, 'text', Object.assign({ x, y, 'text-anchor': 'middle', 'font-size': 24, fill: '#222' }, o), s);
const mono = (g, x, y, s, o = {}) => el(g, 'text', Object.assign({ x, y, 'xml:space': 'preserve', style: 'white-space: pre; font-family: var(--mono)', 'font-size': 22, fill: '#222' }, o), s);
const pct = v => `${(100 * v).toFixed(1)}%`;
// the pipeline strip: done stages show what they produced, the current one is lit, later ones are faint
// `cur` -1 with `upto` draws the stages plainly, the first `upto` of them, for the overview
function strip(g, cur, upto = 5) {
  const W = 276, gap = 36, X0 = 800 - (5 * W + 4 * gap) / 2, Y = 6, H = 84;
  STAGES.slice(0, upto).forEach(([n, res], i) => {
    const x = X0 + i * (W + gap), now = i === cur, done = cur > i;
    el(g, 'rect', { x, y: Y, width: W, height: H, rx: 10, fill: now ? TR : done ? '#eef4fc' : '#fafafa', stroke: now || done ? TR : '#dcdcdc', 'stroke-width': 2 });
    label(g, x + W / 2, Y + (done ? 34 : 52), `${i + 1}. ${n}`, { 'font-size': 22, 'font-weight': 700, fill: now ? '#fff' : done || cur < 0 ? DEEP : '#aaa' });
    if (done) label(g, x + W / 2, Y + 66, res, { 'font-size': 18, fill: '#444' });
    if (cur < 0) el(g, 'rect', { x, y: Y, width: W, height: H, rx: 10, fill: 'none', stroke: TR, 'stroke-width': 2 });
    if (i < 4 && i < upto - 1) arrow(g, x + W + 4, Y + H / 2, x + W + gap - 4, Y + H / 2, 1, { col: done || cur < 0 ? TR : '#c9c9c9' });
  });
}
// the code for the stage, in a band along the bottom
function code(g, lines) {
  if (!lines.length) return;
  const h = 26 + lines.length * 34;
  el(g, 'rect', { x: 20, y: 752 - h, width: 1560, height: h, rx: 8, fill: '#f6f7f9', stroke: '#dcdcdc' });
  lines.forEach((s, i) => mono(g, 44, 752 - h + 38 + i * 34, s, { fill: s.trim().startsWith('#') ? '#555' : '#222' }));
}

  if (o.hot) M.forEach((r, i) => r.forEach((v, j) => { if (o.hot(i, j)) el(g, 'rect', { x: X0 + j * cs, y: Y0 + i * cs, width: cs, height: cs, rx: 6, fill: 'none', stroke: RED, 'stroke-width': 4 }); }));

function legend3(g, x, y) {
  EXC.forEach(([, n, c], i) => { el(g, 'circle', { cx: x + i * 210, cy: y - 7, r: 9, fill: c }); el(g, 'text', { x: x + 16 + i * 210, y, 'font-size': 21, fill: '#333' }, n); });
}

// ------------------------------------------------------------ 0: the pipeline and the data
function overview(g, t) {
  strip(g, -1, Math.min(5, Math.floor(t / 0.5) + 1));
  const k = el(g, 'g', { opacity: clamp01((t - 2.6) / 0.5) });
  label(k, 800, 200, 'a forearm IMU: gyroscope and accelerometer, three axes each, at 50 Hz', { 'font-size': 26, 'font-weight': 700 });
  EXC.forEach(([, n, c, cnt], i) => { const x = 330 + i * 470;
    el(k, 'rect', { x: x - 190, y: 260, width: 380, height: 170, rx: 14, fill: '#fafafa', stroke: c, 'stroke-width': 3 });
    label(k, x, 330, n, { 'font-size': 30, 'font-weight': 700, fill: c });
    label(k, x, 385, `${cnt} sets`, { 'font-size': 25, fill: '#444' }); });
  label(k, 800, 500, `${D.seqs.length} sets in all; at the end, all 39 exercises`, { 'font-size': 24, fill: '#444' });
  code(el(g, 'g', { opacity: clamp01((t - 3) / 0.5) }), ['# every result is scored on people the model was not trained on (leave one person out)']);
}

// ------------------------------------------------------------ 1: the same exercise at two paces
function raw(g, t) {
  strip(g, 0);
  const pxs = 1300 / 50, X0 = 180;
  [['slow', 210], ['fast', 430]].forEach(([k, y], r) => {
    const P = D.pace[k], n = P.x.length, mx = Math.max(...P.x), W = P.dur * pxs, H = 160, u = clamp01((t - 0.9 * r) / 1.2), m = Math.floor(n * u);
    const sx = i => X0 + i / (n - 1) * W, sy = v => y + H - v / mx * H;
    el(g, 'text', { x: X0 - 20, y: y + H / 2 - 6, 'text-anchor': 'end', 'font-size': 23, 'font-weight': 700, fill: COL.lateral_raise }, `${k}`);
    el(g, 'text', { x: X0 - 20, y: y + H / 2 + 24, 'text-anchor': 'end', 'font-size': 19, fill: '#444' }, `${P.spr.toFixed(1)} s per rep`);
    el(g, 'line', { x1: X0, x2: X0 + W, y1: y + H, y2: y + H, stroke: '#c9c9c9', 'stroke-width': 1.5 });
    if (m > 1) el(g, 'path', { d: P.x.slice(0, m).map((v, i) => (i ? 'L' : 'M') + sx(i).toFixed(1) + ',' + sy(v).toFixed(1)).join(''), fill: 'none', stroke: COL.lateral_raise, 'stroke-width': 2 });
    el(g, 'text', { x: X0 + W + 14, y: y + H, 'font-size': 18, fill: '#666' }, `${Math.round(P.dur)} s, ${P.reps} reps`);
  });
  label(g, 800, 175, 'lateral raise, gyroscope magnitude, at two paces', { 'font-size': 24, 'font-weight': 700 });
  if (t >= 2.4) label(g, 800, 665, 'the same gesture at very different speeds', { 'font-size': 25, 'font-weight': 700, opacity: clamp01((t - 2.4) / 0.4) });
  code(g, ['mag = np.linalg.norm(gyro, axis=1)   # angular-velocity magnitude, one number per sample']);
}

// ------------------------------------------------------------ 2: the 93 sets in the three feature spaces
function scatter(g, X0, Y0, W, H, xy, title, xl, yl) {
  const P = D.seqs.map(xy), xs = P.map(p => p[0]), ys = P.map(p => p[1]);
  const [a, b] = [Math.min(...xs), Math.max(...xs)], [c, d] = [Math.min(...ys), Math.max(...ys)], pa = (b - a) * 0.06, pc = (d - c) * 0.06;
  const sx = v => X0 + (v - a + pa) / (b - a + 2 * pa) * W, sy = v => Y0 + H - (v - c + pc) / (d - c + 2 * pc) * H;
  el(g, 'rect', { x: X0, y: Y0, width: W, height: H, fill: 'none', stroke: '#c9c9c9', 'stroke-width': 1.5 });
  D.seqs.forEach((q, i) => el(g, 'circle', { cx: sx(P[i][0]), cy: sy(P[i][1]), r: 6.5, fill: COL[q.c], 'fill-opacity': 0.8, stroke: '#fff', 'stroke-width': 1 }));
  label(g, X0 + W / 2, Y0 - 16, title, { 'font-size': 23, 'font-weight': 700 });
  label(g, X0 + W / 2, Y0 + H + 28, xl, { 'font-size': 18, fill: '#555' });
  el(g, 'text', { x: X0 - 12, y: Y0 + H / 2, 'text-anchor': 'middle', 'font-size': 18, fill: '#555', transform: `rotate(-90 ${X0 - 12} ${Y0 + H / 2})` }, yl);
}
function features(g, t) {
  strip(g, 1);
  const S = [[q => [q.mean, q.std], 'T: time-domain', 'mean', 'std'], [q => [q.f, Math.log10(q.e)], 'F: frequency-domain', 'dominant frequency', 'band energy (log)'],
    [q => q.mds, 'DTW: shape, any pace', 'map of DTW distances', '']];
  S.forEach(([xy, ti, xl, yl], i) => { const k = el(g, 'g', { opacity: clamp01((t - 0.8 * i) / 0.5) }); scatter(k, 70 + i * 520, 180, 440, 330, xy, ti, xl, yl); });
  legend3(el(g, 'g', { opacity: clamp01((t - 2.2) / 0.4) }), 500, 590);
  code(g, ['T = [mag.mean(), mag.std()]', 'F = [dominant_freq(mag, 0.2, 3), band_energy(mag, 0.2, 3)]',
           'D = [dtw(mag, other) for other in all_sets]   # one distance to every other set']);
}

// ------------------------------------------------------------ 3: a random forest on each family, left-one-person-out
function classify(g, t) {
  strip(g, 2);
  const cs = 70;
  FAMS.forEach(([k, n, acc, M], i) => {
    const X0 = 175 + i * 375, u = clamp01((t - 0.5 * i) / 0.4), q = el(g, 'g', { opacity: u });
    label(q, X0 + 1.5 * cs, 150, k, { 'font-size': 26, 'font-weight': 700, fill: i === 2 ? RED : '#222' });
    label(q, X0 + 1.5 * cs, 178, n, { 'font-size': 18, fill: '#555' });
    mat(q, M, NAMES3, X0, 230, cs, { fs: 22, labels: i === 0, cols: false, ls: 17 });
    label(q, X0 + 1.5 * cs, 480, `${acc}%`, { 'font-size': 38, 'font-weight': 700, fill: i === 2 ? RED : '#222' });
  });
  if (t >= 2.3) label(g, 800, 560, 'DTW handles the change in pace; stacking all three adds about a point', { 'font-size': 24, 'font-weight': 700, opacity: clamp01((t - 2.3) / 0.4) });
  code(g, ['cross_val_score(RandomForestClassifier(), X, y, groups=people, cv=LeaveOneGroupOut())']);
}

// ------------------------------------------------------------ 4: adding the accelerometer
function sensors(g, t) {
  strip(g, 3);
  const X0 = 260, Y1 = 590, H = 350, gw = 300, bw = 70, sy = v => Y1 - v / 100 * H;
  [0, 25, 50, 75, 100].forEach(v => { el(g, 'line', { x1: X0 - 20, x2: X0 + 4 * gw, y1: sy(v), y2: sy(v), stroke: '#ececec', 'stroke-width': 1.5 });
    el(g, 'text', { x: X0 - 30, y: sy(v) + 7, 'text-anchor': 'end', 'font-size': 18, style: 'font-family: var(--mono)', fill: '#666' }, `${v}%`); });
  FAMS.forEach(([k], f) => label(g, X0 + f * gw + 1.5 * bw + 10, Y1 + 34, k, { 'font-size': 22, 'font-weight': 700 }));
  STREAMS.forEach(([n, c, v], s) => {
    const u = clamp01((t - 0.6 * s) / 0.5);
    v.forEach((a, f) => { const x = X0 + f * gw + s * (bw + 10), h = (Y1 - sy(a)) * u;
      el(g, 'rect', { x, y: Y1 - h, width: bw, height: h, fill: c, opacity: 0.85 });
      if (u >= 1) label(g, x + bw / 2, Y1 - h - 8, a, { 'font-size': 18, 'font-weight': 700, fill: '#333' }); });
    el(g, 'rect', { x: 420 + s * 300, y: 180 - 18, width: 22, height: 22, rx: 4, fill: c, opacity: u });
    el(g, 'text', { x: 452 + s * 300, y: 180, 'font-size': 20, fill: '#333', opacity: u }, n);
  });
  code(g, ['X = np.hstack([features(gyro_mag), features(accel_mag)])   # both sensors']);
}

// ------------------------------------------------------------ 5: per-axis direction
function direction(g, t) {
  strip(g, 3);
  const cs = 100;
  DIR.forEach(([n, acc, M], i) => {
    const X0 = 290 + i * 640, q = el(g, 'g', { opacity: clamp01((t - 0.8 * i) / 0.5) });
    label(q, X0 + 1.5 * cs, 150, n, { 'font-size': 24, 'font-weight': 700 });
    mat(q, M, NAMES3, X0, 200, cs, { fs: 28, ls: 18, hot: (r, c) => (r === 0 && c === 2) || (r === 2 && c === 0) });
    label(q, X0 + 1.5 * cs, 560, `${acc}%`, { 'font-size': 40, 'font-weight': 700, fill: i ? RED : '#222' });
  });
  if (t >= 1.8) label(g, 800, 625, 'the magnitude loses which way the arm moves: outward (lateral raise) or with the trunk (crunch)', { 'font-size': 23, 'font-weight': 700, opacity: clamp01((t - 1.8) / 0.4) });
  code(g, ['D = [dtw_3axis(xyz, other_xyz) for other_xyz in all_sets]   # x, y, z of both sensors, not the magnitude']);
}

// ------------------------------------------------------------ 6: all 39 exercises, one dimension at a time
function scale(g, t) {
  strip(g, 4);
  const X0 = 520, W = 900, Y0 = 170, rh = 90, P = D.progression;
  P.forEach(([n, v], i) => { const u = clamp01((t - 0.5 * i) / 0.5), y = Y0 + i * rh;
    el(g, 'text', { x: X0 - 20, y: y + 40, 'text-anchor': 'end', 'font-size': 23, fill: '#222', 'font-weight': i === P.length - 1 ? 700 : 400, opacity: u }, n);
    el(g, 'rect', { x: X0, y: y + 10, width: W * v / 100 * u, height: 50, rx: 5, fill: TR, opacity: 0.4 + 0.15 * i });
    if (u >= 1) el(g, 'text', { x: X0 + W * v / 100 + 12, y: y + 44, 'font-size': 25, 'font-weight': 700, fill: '#222' }, `${v}%`); });
  const cx = X0 + W * 0.026;
  el(g, 'line', { x1: cx, x2: cx, y1: Y0, y2: Y0 + P.length * rh, stroke: RED, 'stroke-width': 2, 'stroke-dasharray': '6 5' });
  el(g, 'text', { x: cx + 8, y: Y0 + P.length * rh + 26, 'font-size': 19, fill: RED }, 'chance: 2.6%');
  code(g, ['cross_val_score(rf, X39, y39, groups=people, cv=GroupKFold(5))   # 39 exercises, 1,284 sets']);
}

// ------------------------------------------------------------ 7: what is still confused: pairs that move the wrist the same way
function pairs(g, t) {
  strip(g, 4);
  const M = D.pairs_cm, cs = 42, X0 = 460, Y0 = 130;
  mat(g, M, PAIRS, X0, Y0, cs, { fs: 16, ls: 17, cols: false });
  for (let p = 0; p < 6; p++) { if (t <= 0.3 * p) break;
    el(g, 'rect', { x: X0 + 2 * p * cs - 1, y: Y0 + 2 * p * cs - 1, width: 2 * cs + 2, height: 2 * cs + 2, rx: 6, fill: 'none', stroke: RED, 'stroke-width': 3.5 }); }
  const k = el(g, 'g', { opacity: clamp01((t - 2) / 0.5) });
  ['each red block is a pair that', 'moves the forearm almost the same way;', 'no wrist feature can tell them apart'].forEach((s, i) =>
    el(k, 'text', { x: 1030, y: 300 + i * 36, 'font-size': 24, 'font-weight': i ? 400 : 700, fill: i ? '#333' : RED }, s));
  code(g, ['confusion_matrix(y39, cross_val_predict(rf, X39, y39, groups=people, cv=GroupKFold(5)))']);
}

// ------------------------------------------------------------ 8: the whole pipeline as code
function summary(g, t) {
  strip(g, 5);
  const L = [[1, 'mag = np.linalg.norm(gyro, axis=1)'], [2, 'X = np.hstack([T(mag), F(mag), DTW(mag)])   # time, frequency, shape'],
    [3, 'cross_val_score(RandomForestClassifier(), X, y, groups=people, cv=LeaveOneGroupOut())'],
    [4, 'X = np.hstack([T(both), F(both), DTW_3axis(both)])   # both sensors, per-axis direction'],
    [5, 'cross_val_score(rf, X39, y39, groups=people, cv=GroupKFold(5))   # all 39 exercises']];
  el(g, 'rect', { x: 60, y: 170, width: 1480, height: 400, rx: 10, fill: '#f6f7f9', stroke: '#dcdcdc' });
  L.forEach(([n, s], i) => { const y = 250 + i * 72, k = el(g, 'g', { opacity: clamp01((t - 0.25 * i) / 0.4) });
    el(k, 'circle', { cx: 110, cy: y - 8, r: 20, fill: TR }); label(k, 110, y, n, { 'font-size': 21, 'font-weight': 700, fill: '#fff' });
    mono(k, 160, y, s, { 'font-size': 23 }); });
}

STEPS = [
  { title: 'What does the exercise pipeline look like?', T: 3.4, draw: overview },
  { title: 'What does the raw data look like?', T: 2.8, draw: raw },
  { title: 'Which features separate the exercises?', T: 2.6, draw: features },
  { title: 'How well does each feature family classify?', T: 2.7, draw: classify },
  { title: 'Does a second sensor help?', T: 1.9, draw: sensors },
  { title: 'Does direction help?', T: 2.2, draw: direction },
  { title: 'What happens with all 39 exercises?', T: 2.2, draw: scale },
  { title: 'Which exercises does it still confuse?', T: 2.5, draw: pairs },
  { title: 'What does the whole pipeline look like in code?', T: 1.6, draw: summary },
];
start();

})();
</script>

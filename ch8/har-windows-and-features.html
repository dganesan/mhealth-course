<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Activity Windows and Their Features</title>
</head>
<body>
<style>
  :root {
    color-scheme: light;
    --paper: #ffffff; --ink: #222222; --ink-2: #666666; --ink-3: #9a9a9a;
    --rule: #dcdcdc; --grid: #ececec; --raw: #8f8f8f; --raw-dot: #8c8c8c; --clean: #444444;
    --ma: #2a78d6; --med: #1baf7a; --wm: #4a3aa7; --ewma: #eb6834;
    --sans: "Helvetica Neue", Helvetica, -apple-system, Arial, sans-serif;
    --mono: Menlo, "SF Mono", Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.4; padding-block: 10px 10px; padding-inline: 14px; -webkit-font-smoothing: antialiased; }
  .stage { max-width: 1880px; margin: 0 auto; display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 10px; height: calc(100vh - 20px); }
  .slide { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 16px 30px 8px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 6px; min-height: 0; position: relative; outline: none; cursor: pointer; user-select: none; }
  .slide:focus-visible { box-shadow: 0 0 0 3px rgba(42,120,214,.35); }
  .head h1 { margin: 0; font-size: clamp(24px, 2.4vw, 36px); font-weight: 700; letter-spacing: -0.01em; line-height: 1.15; }
  .head h1 .tag { display: inline-block; font-family: var(--mono); font-weight: 400; font-size: 0.6em; color: var(--ink-2); margin-left: 10px; vertical-align: middle; background: #f4f4f4; padding: 2px 8px; border-radius: 4px; white-space: nowrap; }
  .head p { margin: 6px 0 0; color: #444; font-size: clamp(18px, 1.7vw, 24px); max-width: none; }
  .head p:empty { display: none; }
  .chart-wrap { position: relative; min-height: 0; height: 100%; display: flex; justify-content: center; align-items: center; }
  svg.chart { display: block; height: 100%; width: auto; max-width: 100%; max-height: 100%; overflow: visible; }
  .tt { position: absolute; pointer-events: none; display: none; background: #fff; border: 1px solid var(--rule); border-radius: 4px; padding: 6px 9px; font-family: var(--mono); font-size: 15px; color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,.08); white-space: nowrap; z-index: 2; }
  .tt .row { display: flex; gap: 10px; justify-content: space-between; }
  .foot { position: absolute; top: 9px; right: 16px; display: flex; gap: 14px; align-items: baseline; font-size: 14px; color: var(--ink-3); padding: 0; pointer-events: none; }
  .foot .ctr { font-family: var(--mono); }
  .bar { display:flex; flex-direction:column; gap:12px; padding:12px 24px;
         border:1px solid var(--rule); border-radius:6px; background:#f6f7f9; font-size:19px; color:var(--ink); }
  .bar .row { display:flex; justify-content:flex-start; align-items:center; gap:16px 32px; flex-wrap:wrap; }
  .bar .row.dials .group { flex:1 1 0; }
  .bar .row.dials input[type=range] { flex:1 1 auto; width:auto; }
  .group { display:flex; align-items:center; gap:10px; }
  .group label { font-size:18px; font-weight:700; color:var(--ink); letter-spacing:0; text-transform:none; white-space:nowrap; }
  .val { font-family:var(--mono); font-size:19px; font-weight:700; color:var(--ma); min-width:5ch; white-space:nowrap; }
  button, select { font:inherit; font-size:18px; color:var(--ink); background:#fff; border:1px solid #9a9a9a; border-radius:6px; padding:9px 16px; cursor:pointer; }
  button:hover, select:hover { border-color:var(--ink); }
  button.primary { background:var(--ma); color:#fff; border-color:var(--ma); min-width:88px; font-weight:700; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline:2px solid var(--ma); outline-offset:2px; }
  input[type=range] { -webkit-appearance:none; appearance:none; accent-color:var(--ma); width:260px; height:36px; background:transparent; cursor:pointer; }
  input[type=range]::-webkit-slider-runnable-track { height:8px; border-radius:4px; background:#c9d1dc; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:26px; height:26px; border-radius:50%; background:var(--ma); border:3px solid #fff; box-shadow:0 0 0 1.5px var(--ma); margin-top:-9px; }
  input[type=range]::-moz-range-track { height:8px; border-radius:4px; background:#c9d1dc; }
  input[type=range]::-moz-range-thumb { width:26px; height:26px; border-radius:50%; background:var(--ma); border:3px solid #fff; }
  .hint { margin-left:auto; color:var(--ink-2); font-size:12px; }
  .hint kbd { font-family:var(--mono); background:#fff; border:1px solid var(--rule); border-radius:3px; padding:0 5px; font-size:11px; }
  .grid line { stroke: var(--grid); stroke-width: 1.3; }
  .axis line, .axis path { stroke: var(--ink-2); stroke-width: 1.3; fill: none; }
  .axis text { font-family: var(--mono); font-size: 20px; fill: var(--ink-2); }
  .axis-title { font-family: var(--sans); font-size: 22px; fill: var(--ink-2); }
  .ptitle { font-family: var(--sans); font-size: 20px; font-weight: 700; fill: var(--ink); }
  .mono { font-family: var(--mono); font-size: 20px; fill: var(--ink); }
  .big { font-family: var(--mono); font-weight: 700; }
  .trace { fill: none; stroke-width: 2.3; stroke-linejoin: round; }
  .legend text { font-family: var(--sans); font-size: 20px; fill: var(--ink); }
  .crosshair { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 2 2; }
  @media (max-width: 720px) { .slide { padding: 18px 16px 12px; min-height: 0; } .hint { display: none; } }
  .hint { display:none !important; }
  button.tb { min-width:54px; padding:9px 12px; font-size:22px; line-height:1; }
  button.primary.tb { min-width:64px; }
</style>

<div class="stage">
  <section class="slide" id="slide" tabindex="0" aria-live="polite">
    <div class="head">
      <h1 id="title">Activity windows</h1>
      <p id="subtitle"></p>
    </div>
    <div class="chart-wrap">
      <svg class="chart" id="chart" viewBox="0 0 1400 640" role="img" aria-label="Activity windows and features"></svg>
      <div class="tt" id="tt"></div>
    </div>
    <div class="foot">
      <span>CS328 &nbsp;·&nbsp; Case Studies in Activity Recognition</span>
      <span class="ctr" id="counter"></span>
    </div>
  </section>

  <div class="bar">
   <div class="row">
    <div class="group">
      <button id="prev" class="tb" title="Previous step (←)">⏮</button>
      <button id="play" class="primary tb" title="Play / pause (space)">▶</button>
      <button id="next" class="tb" title="Next step (→)">⏭</button>
      <button id="restart" class="tb" title="Restart this step (r)">↺</button>
      <button id="reset" title="Reset all dials to the step presets">Reset dials</button>
    </div>
    <div class="group">
      <label for="act">Activity</label>
      <select id="act">
        <option value="1">walking</option>
        <option value="2">walking upstairs</option>
        <option value="3">walking downstairs</option>
        <option value="4">sitting</option>
        <option value="5">standing</option>
        <option value="6">laying</option>
      </select>
    </div>
    <div class="group">
      <label for="chan">Channel</label>
      <select id="chan">
        <option value="body_acc_x">body_acc_x</option>
        <option value="body_acc_y">body_acc_y</option>
        <option value="body_acc_z">body_acc_z</option>
        <option value="total_acc_x" selected>total_acc_x</option>
        <option value="total_acc_y">total_acc_y</option>
        <option value="total_acc_z">total_acc_z</option>
        <option value="body_gyro_x">body_gyro_x</option>
        <option value="body_gyro_y">body_gyro_y</option>
        <option value="body_gyro_z">body_gyro_z</option>
      </select>
    </div>
    <div class="group">
      <label for="speed">Speed</label>
      <select id="speed">
        <option value="0.25">very slow</option>
        <option value="0.5">slow</option>
        <option value="1" selected>normal</option>
        <option value="2.5">fast</option>
        <option value="0">instant</option>
      </select>
    </div>
   </div>
  </div>
</div>

      if (specP >= 1) { el('line', { x1: fx(df), x2: fx(df), y1: sy0 + 30, y2: fy(0), stroke: '#eb6834', 'stroke-width': 1.5, 'stroke-dasharray': '4 3' }, g2); txt(fx(df) + 6, sy0 + 44, `dominant ${df.toFixed(2)} Hz`, { class: 'mono', fill: '#eb6834', 'font-weight': 700 }, g2); }
    } else txt(sx0 + spw / 2, sy0 + sph / 2 + 50, 'FFT after the window is full', { class: 'axis-title', 'text-anchor': 'middle' }, g2);
    legend([{ c: '#2a78d6', n: 'FFT magnitude, 0–10 Hz', box: true }, { c: 'var(--raw)', n: 'FFT magnitude above 10 Hz', box: true }, { c: '#eb6834', n: 'dominant frequency', dash: true }], sx0 + spw - 226, sy0 + 100, chart);
    // feature readout row
    const ry = 508;
    const vals = [['mean', fmt(st.mean)], ['std', fmt(st.std)], ['min', fmt(st.min)], ['max', fmt(st.max)], ['dom_freq', specP >= 1 ? df.toFixed(2) + ' Hz' : '—'], ['energy', fmt(st.energy, 1)]];
    txt(x0, ry, `features of ${chan}   (n = ${nNow} of ${N} samples)`, { class: 'ptitle' }, chart);
    vals.forEach(([k, v], i) => {
      const bx = x0 + i * ((W - x0 - 40) / 6);
      el('rect', { x: bx, y: ry + 12, width: (W - x0 - 40) / 6 - 12, height: 62, rx: 4, fill: '#f6f7f9', stroke: 'var(--rule)' }, chart);
      txt(bx + 12, ry + 32, k, { class: 'axis-title' }, chart);
      txt(bx + 12, ry + 60, v, { class: 'big', 'font-size': 20, fill: (k === 'dom_freq' && specP < 1) ? 'var(--ink-3)' : '#2a78d6' }, chart);
    });
    txt(x0, ry + 100, 'energy = Σ x²    ·    dom_freq = argmax |FFT(x − mean)| over 0–10 Hz', { class: 'mono', fill: 'var(--ink-2)' }, chart);
  }

  function drawVector(p) {
    chart.innerHTML = '';
    const x0 = 250, y0 = 60, cw = (W - 250 - 60) / 6, ch = 46;
    const nCells = Math.round(p * 54);
    const g = el('g', {}, chart);
    FEATS.forEach((f, j) => txt(x0 + j * cw + cw / 2, y0 - 12, f, { class: 'ptitle', 'text-anchor': 'middle' }, g));
    txt(x0 - 12, y0 - 12, 'channel', { class: 'ptitle', 'text-anchor': 'end' }, g);
    CHANNELS.forEach((c, i) => {
      const fam = FAMILY[famOf(c)];
      txt(x0 - 12, y0 + i * ch + ch / 2 + 5, c, { class: 'mono', 'text-anchor': 'end', fill: fam.color, 'font-weight': c === chan ? 700 : 400 }, g);
      FEATS.forEach((f, j) => {
        const k = i * 6 + j;
        const filled = k < nCells;
        el('rect', { x: x0 + j * cw, y: y0 + i * ch, width: cw, height: ch, fill: filled ? fam.color : '#fff', opacity: filled ? 0.16 : 1, stroke: 'var(--rule)' }, g);
        if (filled) {
          const v = EXF[act][c][j];
          txt(x0 + j * cw + cw / 2, y0 + i * ch + ch / 2 + 5, f === 'energy' ? v.toFixed(1) : f === 'dom_freq' ? v.toFixed(2) : v.toFixed(3), { class: 'mono', 'text-anchor': 'middle' }, g);
        }
      });
    });
    if (nCells > 0 && nCells < 54) { const k = nCells - 1, i = Math.floor(k / 6), j = k % 6; el('rect', { x: x0 + j * cw, y: y0 + i * ch, width: cw, height: ch, fill: 'none', stroke: 'var(--ink)', 'stroke-width': 2 }, g); }
    el('rect', { x: x0, y: y0, width: 6 * cw, height: 9 * ch, fill: 'none', stroke: 'var(--ink-3)' }, g);
    txt(x0, y0 + 9 * ch + 30, `feature vector for this window: ${nCells} of 54 values   ·   index = 6 × channel + feature`, { class: 'mono', fill: 'var(--ink-2)' }, g);
    legend(Object.values(FAMILY).map(f => ({ c: f.color, n: f.name, box: true, op: 0.5 })), x0 + 6 * cw - 190, y0 + 9 * ch + 46, chart);
  }

  function drawImportance(p) {
    chart.innerHTML = '';
    const x0 = 310, y0 = 24, bw = W - x0 - 60, rowH = 36;
    const mx = 0.1;
    const g = el('g', {}, chart);
    const sx = v => x0 + v / mx * bw;
    const grid = el('g', { class: 'grid' }, g), ax = el('g', { class: 'axis' }, g);
    for (let v = 0; v <= mx + 1e-9; v += 0.02) { el('line', { x1: sx(v), x2: sx(v), y1: y0, y2: y0 + 15 * rowH }, grid); txt(sx(v), y0 + 15 * rowH + 18, v.toFixed(2), { 'text-anchor': 'middle' }, ax); }
    el('path', { d: `M${x0},${y0}V${y0 + 15 * rowH}H${x0 + bw}` }, ax);
    txt(x0 + bw / 2, y0 + 15 * rowH + 42, 'random-forest feature importance (mean impurity decrease)', { class: 'axis-title', 'text-anchor': 'middle' }, g);
    IMP.forEach(([name, v], i) => {
      const t = clamp01(p * 15 - i);
      const fam = FAMILY[famOf(name)];
      const y = y0 + i * rowH;
      txt(x0 - 10, y + rowH / 2 + 5, name, { class: 'mono', 'text-anchor': 'end', fill: t > 0 ? 'var(--ink)' : 'var(--ink-3)' }, g);
      txt(x0 - 268, y + rowH / 2 + 5, `${i + 1}.`, { class: 'axis-title', 'text-anchor': 'end' }, g);
      el('rect', { x: x0, y: y + 6, width: (sx(v) - x0) * t, height: rowH - 12, fill: fam.color, opacity: 0.9, rx: 2 }, g);
      if (t >= 1) txt(sx(v) + 8, y + rowH / 2 + 5, v.toFixed(3), { class: 'mono', fill: 'var(--ink-2)' }, g);
    });
    legend(Object.values(FAMILY).map(f => ({ c: f.color, n: f.name, box: true })), x0 + bw - 190, y0 + 15 * rowH - 130, chart);
  }

  function render() {
    const id = STEPS[step].id;
    if (id === 'traces') drawTraces(prog);
    else if (id === 'features') drawFeatures(prog);
    else if (id === 'vector') drawVector(prog);
    else drawImportance(prog);
  }

  // ------------------------------------------------------------ step machinery
  function enterStep(k, completed = false) {
    stopPlay(); step = k;
    const d = STEPS[k];
    $('title').innerHTML = d.title() + `<span class="tag">${d.tag()}</span>`;
    $('subtitle').textContent = d.subtitle();
    $('counter').textContent = `${step + 1} / ${STEPS.length}`;
    try { history.replaceState(null, '', '#' + (step + 1)); } catch (_) {}
    prog = 0;
    if (completed || speed === 0 || reduceMotion) { prog = 1; render(); }
    else { render(); startPlay(); }
  }
  function tick(t) {
    if (!playing) return;
    const dt = Math.max(0, Math.min(0.1, (t - lastT) / 1000)); lastT = t;
    prog = Math.min(1, prog + dt * speed / STEPS[step].dur);
    render();
    if (prog >= 1) { stopPlay(); return; }
    raf = requestAnimationFrame(tick);
  }
  function startPlay() { if (prog >= 1) return; playing = true; lastT = performance.now(); $('play').textContent = '⏸'; raf = requestAnimationFrame(tick); }
  function stopPlay() { playing = false; cancelAnimationFrame(raf); $('play').textContent = '▶'; }
  function finish() { stopPlay(); prog = 1; render(); }
  function next() { if (prog < 1) { finish(); return; } if (step < STEPS.length - 1) enterStep(step + 1); }
  function prev() { if (step > 0) enterStep(step - 1, true); }
  function restart() { enterStep(step); }
  function retitle() { const d = STEPS[step]; $('title').innerHTML = d.title() + `<span class="tag">${d.tag()}</span>`; }

  $('next').addEventListener('click', e => { e.stopPropagation(); next(); });
  $('prev').addEventListener('click', e => { e.stopPropagation(); prev(); });
  $('restart').addEventListener('click', e => { e.stopPropagation(); restart(); });
  $('play').addEventListener('click', e => { e.stopPropagation(); if (playing) stopPlay(); else if (prog >= 1) restart(); else startPlay(); });
  $('slide').addEventListener('click', () => next());
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
    else if (e.key === ' ') { e.preventDefault(); $('play').click(); }
    else if (e.key === 'r' || e.key === 'R') restart();
  });
  $('act').addEventListener('change', e => { dirty.act = true; act = e.target.value; retitle(); render(); });
  $('chan').addEventListener('change', e => { dirty.chan = true; chan = e.target.value; retitle(); render(); });
  $('speed').addEventListener('change', e => { speed = parseFloat(e.target.value); });
  $('reset').addEventListener('click', e => { e.stopPropagation(); for (const k in dirty) delete dirty[k]; act = '1'; $('act').value = '1'; chan = 'total_acc_x'; $('chan').value = 'total_acc_x'; enterStep(step); });

  const h = parseInt((location.hash || '').replace('#', ''), 10);
  enterStep(h >= 1 && h <= STEPS.length ? h - 1 : 0);
})();
</script>
</body>
</html>

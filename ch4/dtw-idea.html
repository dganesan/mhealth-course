<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Same Gesture, Two Speeds</title>
</head>
<body>
<style>
  :root {
    color-scheme: light;
    --paper: #ffffff; --ink: #222222; --ink-2: #666666; --ink-3: #9a9a9a; --rule: #dcdcdc; --grid: #ececec; --ma: #2a78d6;
    --sans: "Helvetica Neue", Helvetica, -apple-system, Arial, sans-serif;
    --mono: Menlo, "SF Mono", Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  .grid line { stroke: var(--grid); stroke-width: 1.3; }
  .axis line, .axis path { stroke: var(--ink-2); stroke-width: 1.3; fill: none; }
  .axis text { font-family: var(--mono); fill: var(--ink-2); }
  #app { height: 100vh; padding: 10px 14px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px; }
  .head { padding: 4px 16px 0; }
  h1 { margin: 0; font-size: clamp(24px, 2.4vw, 36px); font-weight: 700; letter-spacing: -0.01em; }
  .main { user-select: none; -webkit-user-select: none; min-height: 0; border: 1px solid var(--rule); border-radius: 6px; padding: 10px 16px; }
  .main svg { width: 100%; height: 100%; display: block; }
  .bar { display: flex; gap: 10px; align-items: center; padding: 10px 18px; border: 1px solid var(--rule); border-radius: 6px; background: #f6f7f9; }
  button { font: inherit; font-size: 18px; color: var(--ink); background: #fff; border: 1px solid #9a9a9a; border-radius: 6px; padding: 9px 16px; cursor: pointer; }
  button:hover { border-color: var(--ink); }
  button.primary { background: var(--ma); color: #fff; border-color: var(--ma); font-weight: 700; min-width: 120px; }
  .step { font-family: var(--mono); font-size: 17px; color: var(--ink-2); margin-left: auto; }
  .hide { display: none !important; }
</style>

<div id="app">
  <div class="head"><h1 id="title"></h1></div>
  <div class="main"><svg id="fig" viewBox="0 0 1600 760"></svg></div>
  <div class="bar">
    <button id="prev" title="Previous step (←)">⏮ step</button>
    <button id="next" title="Next step (→)">step ⏭</button>
    <button id="play" class="primary" title="Play (space)">▶ Play</button>
    <span class="step" id="stepno"></span>
  </div>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const svgNS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}, parent) => { const n = document.createElementNS(svgNS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; };
const txt = (parent, x, y, s, attrs = {}) => { const t = el('text', Object.assign({ x, y }, attrs), parent); t.textContent = s; return t; };

// ------------------------------------------------------------ one arm raise: the arm angle rises, holds at the top, comes back down
// The same gesture at two speeds. The slow one also lingers longer at the top, so a simple stretch of the time axis would not line them up.
const FS = 25, LEN = 3.2;
const ease = u => u <= 0 ? 0 : u >= 1 ? 1 : u * u * (3 - 2 * u);
const gesture = (t, T) => { const [r0, r1, f0, f1] = T; return 10 + 140 * (t < r1 ? ease((t - r0) / (r1 - r0)) : t < f0 ? 1 : 1 - ease((t - f0) / (f1 - f0))); };
const SLOW = { name: 'slow', col: '#2a78d6', T: [0.15, 1.05, 1.95, 2.85], end: 3.0 };
const FAST = { name: 'fast', col: '#eb6834', T: [0.10, 0.55, 0.75, 1.30], end: 1.4 };
[SLOW, FAST].forEach(G => { G.n = Math.round(G.end * FS) + 1; G.v = Array.from({ length: G.n }, (_, i) => gesture(i / FS, G.T)); });

// DTW on the two angle sequences: the cheapest way to pair every sample of one with a sample of the other, in order
function dtw(a, b) {
  const n = a.length, m = b.length, D = Array.from({ length: n }, () => new Array(m).fill(Infinity));
  for (let i = 0; i < n; i++) for (let j = 0; j < m; j++) {
    const c = Math.abs(a[i] - b[j]);
    D[i][j] = c + (i || j ? Math.min(i ? D[i - 1][j] : Infinity, j ? D[i][j - 1] : Infinity, i && j ? D[i - 1][j - 1] : Infinity) : 0);
  }
  const path = []; let i = n - 1, j = m - 1;
  while (i > 0 || j > 0) { path.push([i, j]); const opts = [i && j ? [D[i - 1][j - 1], i - 1, j - 1] : null, i ? [D[i - 1][j], i - 1, j] : null, j ? [D[i][j - 1], i, j - 1] : null].filter(Boolean); const b = opts.reduce((p, q) => q[0] < p[0] ? q : p); i = b[1]; j = b[2]; }
  path.push([0, 0]); path.reverse();
  return { cost: D[n - 1][m - 1], path };
}
const DTW = dtw(SLOW.v, FAST.v);
// sample by sample: sample i of one against sample i of the other; the fast one is at rest once it has finished
const naive = SLOW.v.map((v, i) => [i, Math.min(i, FAST.n - 1)]), naiveCost = naive.reduce((s, [i, j]) => s + Math.abs(SLOW.v[i] - FAST.v[j]), 0);

// ------------------------------------------------------------ stick figure (front view), right arm raised to the given angle, as in chapter 2
function figure(svg, cx, footY, s, arm, col) {
  const hipY = footY - 0.48 * s, shY = footY - 0.82 * s, L = 0.36 * s, a = arm * Math.PI / 180;
  const line = (p, q, c, w = 6) => el('line', { x1: p[0], y1: p[1], x2: q[0], y2: q[1], stroke: c, 'stroke-width': w, 'stroke-linecap': 'round' }, svg);
  const lSh = [cx - 0.09 * s, shY], rSh = [cx + 0.09 * s, shY], ink = '#9a9a9a';
  line([cx - 0.04 * s, hipY], [cx - 0.08 * s, footY], ink); line([cx + 0.04 * s, hipY], [cx + 0.08 * s, footY], ink);
  line([cx, shY], [cx, hipY], ink); line(lSh, rSh, ink);
  line(lSh, [lSh[0] - 0.02 * s, lSh[1] + L], ink);
  const hand = [rSh[0] + L * Math.sin(a), rSh[1] + L * Math.cos(a)];
  line(rSh, hand, col, 7);
  el('circle', { cx: (rSh[0] + hand[0]) / 2, cy: (rSh[1] + hand[1]) / 2, r: 9, fill: '#fff', stroke: col, 'stroke-width': 3 }, svg);
  el('circle', { cx, cy: footY - 0.94 * s, r: 0.075 * s, fill: '#fff', stroke: ink, 'stroke-width': 5 }, svg);
}

// ------------------------------------------------------------ a trace on the shared time axis
const X0 = 420, X1 = 1560, xs = t => X0 + t / LEN * (X1 - X0);
const ROWS = { slow: { y0: 70, y1: 300 }, fast: { y0: 450, y1: 680 } };
// part 'frame' draws the axes, 'line' the trace and its name (so pairing lines can go between the two); both by default
function trace(svg, G, upto, dot, part) {
  const R = ROWS[G.name], ys = v => R.y1 - v / 160 * (R.y1 - R.y0);
  if (part !== 'line') {
  const grid = el('g', { class: 'grid' }, svg), axis = el('g', { class: 'axis' }, svg);
  [0, 90, 150].forEach(v => { el('line', { x1: X0, x2: X1, y1: ys(v), y2: ys(v) }, grid); txt(axis, X0 - 10, ys(v) + 7, v + '°', { 'text-anchor': 'end', style: 'font-size:20px' }); });
  for (let t = 0; t <= 3; t++) txt(axis, xs(t), R.y1 + 28, t === 3 ? '3 s' : t, { 'text-anchor': 'middle', style: 'font-size:20px' });
  el('path', { d: `M${X0},${R.y0}V${R.y1}H${X1}` }, axis);
  }
  if (part === 'frame') return { ys };
  const n = upto == null ? G.n : Math.min(G.n, Math.floor(upto * FS) + 1);
  el('path', { d: G.v.slice(0, n).map((v, i) => (i ? 'L' : 'M') + xs(i / FS).toFixed(1) + ',' + ys(v).toFixed(1)).join(''), fill: 'none', stroke: G.col, 'stroke-width': 3.5 }, svg);
  if (dot && n > 0) el('circle', { cx: xs((n - 1) / FS), cy: ys(G.v[n - 1]), r: 8, fill: G.col }, svg);
  txt(svg, X0, R.y0 - 18, `${G.name}: arm angle`, { style: `font-size:24px;font-weight:700;fill:${G.col};stroke:#fff;stroke-width:7px;paint-order:stroke` });
  return { ys };
}
const pt = (G, i) => [xs(i / FS), ROWS[G.name].y1 - G.v[i] / 160 * (ROWS[G.name].y1 - ROWS[G.name].y0)];
// lines between paired samples of the slow and the fast gesture, every other pair so they stay readable
function pairs(svg, list, col) {
  list.forEach(([i, j], k) => { if (k % 2) return; const a = pt(SLOW, i), b = pt(FAST, j); el('line', { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: col, 'stroke-width': 1.6, 'stroke-opacity': .55 }, svg); });
}
function score(svg, label, v, col) {
  txt(svg, 30, 390, label, { style: 'font-size:22px;fill:var(--ink-2)' });
  txt(svg, 30, 440, `${Math.round(v).toLocaleString()}°`, { style: `font-family:var(--mono);font-size:44px;font-weight:700;fill:${col}` });
}

// ------------------------------------------------------------ steps
let step = 0, t = 0, timer = null;
const STEPS = [
  { title: 'Same gesture, two speeds: is it the same movement?', anim: true,
    draw() {
      const svg = $('fig');
      [SLOW, FAST].forEach(G => { const R = ROWS[G.name]; figure(svg, 190, R.y1 + 20, 250, gesture(Math.min(t, G.end), G.T), G.col); trace(svg, G, t, true); });
    } },
  { title: 'Can we compare them sample by sample?',
    draw() {
      const svg = $('fig'); trace(svg, SLOW, null, false, 'frame'); trace(svg, FAST, null, false, 'frame'); pairs(svg, naive, '#666'); trace(svg, SLOW, null, false, 'line'); trace(svg, FAST, null, false, 'line');
      score(svg, 'total difference', naiveCost, 'var(--ink)');
    } },
  { title: 'How does DTW match the two?',
    draw() {
      const svg = $('fig'); trace(svg, SLOW, null, false, 'frame'); trace(svg, FAST, null, false, 'frame'); pairs(svg, DTW.path, '#7a3fb0'); trace(svg, SLOW, null, false, 'line'); trace(svg, FAST, null, false, 'line');
      score(svg, 'total difference after DTW', DTW.cost, '#7a3fb0');
      txt(svg, 30, 490, `before: ${Math.round(naiveCost).toLocaleString()}°`, { style: 'font-size:20px;fill:var(--ink-2)' });
    } },
];
function draw() {
  const S = STEPS[step];
  $('title').textContent = S.title; $('stepno').textContent = `step ${step + 1} of ${STEPS.length}`;
  $('play').classList.toggle('hide', !S.anim); $('play').textContent = timer ? '❚❚ Pause' : '▶ Play';
  $('fig').innerHTML = ''; S.draw();
}
function stop() { clearInterval(timer); timer = null; }
function play() {
  if (timer) { stop(); draw(); return; }
  if (t >= LEN - 0.05) t = 0;
  timer = setInterval(() => { t = Math.min(LEN, t + 0.04); if (t >= LEN) stop(); draw(); }, 40);
  draw();
}
function go(s) { stop(); step = Math.max(0, Math.min(STEPS.length - 1, s)); t = STEPS[step].anim ? 0 : LEN; draw(); history.replaceState(null, '', '#' + (step + 1)); }
$('prev').onclick = () => go(step - 1); $('next').onclick = () => go(step + 1); $('play').onclick = play;
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') go(step + 1); else if (e.key === 'ArrowLeft') go(step - 1); else if (e.key === ' ' && STEPS[step].anim) { e.preventDefault(); play(); } });
go((parseInt(location.hash.slice(1), 10) || 1) - 1);
if (step === 0) { t = LEN; draw(); }
})();
</script>
</body>
</html>

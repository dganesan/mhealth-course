<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spot the Difference</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
</head>
<body>
<style>
  :root {
    color-scheme: light;
    --paper: #ffffff; --ink: #222222; --ink-2: #666666; --ink-3: #9a9a9a; --rule: #dcdcdc; --grid: #ececec; --ma: #2a78d6;
    --sans: "Helvetica Neue", Helvetica, -apple-system, Arial, sans-serif;
    --mono: Menlo, "SF Mono", Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  .hidden { display: none !important; }
  .grid line { stroke: var(--grid); stroke-width: 1.3; }
  .axis line, .axis path { stroke: var(--ink-2); stroke-width: 1.3; fill: none; }
  .axis text { font-family: var(--mono); fill: var(--ink-2); }

  /* ---------- projector ---------- */
  #proj { height: 100vh; padding: 10px 14px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px; }
  #proj .head { display: flex; align-items: baseline; gap: 14px; padding: 4px 16px 0; }
  #proj h1 { margin: 0; font-size: clamp(24px, 2.4vw, 36px); font-weight: 700; letter-spacing: -0.01em; }
  #proj .tag { font-family: var(--mono); font-size: clamp(15px, 1.4vw, 21px); color: var(--ink-2); background: #f4f4f4; padding: 2px 8px; border-radius: 4px; }
  #proj .main { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 18px; min-height: 0; border: 1px solid var(--rule); border-radius: 6px; padding: 14px 18px; }
  .plots { display: grid; grid-template-rows: 1fr 1fr; gap: 6px; min-height: 0; }
  .plots svg { width: 100%; height: 100%; display: block; }
  .side { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 12px; min-height: 0; }
  .join { display: flex; gap: 16px; align-items: center; background: #f6f8fb; border: 1px solid var(--rule); border-radius: 6px; padding: 10px 14px; }
  .join .qr svg { width: 150px; height: 150px; display: block; }
  .join .ask { font-size: 26px; font-weight: 700; line-height: 1.25; }
  .join .url { font-family: var(--mono); font-size: 14px; color: var(--ink-2); margin-top: 8px; word-break: break-all; }
  .join .count { font-family: var(--mono); font-size: 20px; color: var(--ma); font-weight: 700; margin-top: 8px; }
  .wall { overflow-y: auto; min-height: 0; padding-right: 6px; }
  .bucket { margin-bottom: 12px; }
  .bucket h3 { margin: 0 0 6px; font-size: 19px; color: var(--ink-2); font-weight: 700; }
  .bucket h3 b { color: var(--ink); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 20px; line-height: 1.25; background: #fff; border: 1.5px solid var(--rule); border-left: 5px solid var(--ma); border-radius: 5px; padding: 4px 9px; cursor: pointer; max-width: 100%; }
  .chip:hover { text-decoration: line-through; color: var(--ink-3); }
  .chip.new { animation: pop .5s ease-out; }
  @keyframes pop { from { background: #fff3bf; } to { background: #fff; } }
  .reveal { overflow-y: auto; min-height: 0; }
  .reveal table { border-collapse: collapse; width: 100%; font-size: 21px; }
  .reveal th, .reveal td { padding: 7px 10px; border-bottom: 1px solid var(--rule); text-align: right; }
  .reveal th:first-child, .reveal td:first-child { text-align: left; }
  .reveal td.v { font-family: var(--mono); }
  .reveal tr.top td { background: #e8f1fd; font-weight: 700; }
  .reveal p { font-size: 19px; color: var(--ink-2); margin: 10px 2px; }
  .bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 18px; border: 1px solid var(--rule); border-radius: 6px; background: #f6f7f9; }
  button { font: inherit; font-size: 18px; color: var(--ink); background: #fff; border: 1px solid #9a9a9a; border-radius: 6px; padding: 9px 16px; cursor: pointer; }
  button:hover { border-color: var(--ink); }
  select { font: inherit; font-size: 18px; padding: 8px 12px; border: 1px solid #9a9a9a; border-radius: 6px; background: #fff; }
  button.primary { background: var(--ma); color: #fff; border-color: var(--ma); font-weight: 700; }
  .bar .status { margin-left: auto; font-family: var(--mono); font-size: 15px; color: var(--ink-2); }

  /* ---------- phone ---------- */
  #phone { max-width: 560px; margin: 0 auto; padding: 16px; }
  #phone h1 { font-size: 22px; margin: 4px 0 2px; }
  #phone .sub { color: var(--ink-2); font-size: 15px; margin: 0 0 10px; }
  #phone .pp svg { width: 100%; height: 150px; display: block; margin-bottom: 4px; }
  #phone textarea { width: 100%; font: inherit; font-size: 18px; padding: 10px; border: 1.5px solid #9a9a9a; border-radius: 8px; min-height: 90px; resize: vertical; }
  #phone .row { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
  #phone button { font-size: 19px; padding: 10px 22px; }
  #phone .left { font-family: var(--mono); font-size: 14px; color: var(--ink-3); margin-left: auto; }
  #phone .msg { margin-top: 10px; font-size: 16px; min-height: 22px; }
  #phone .legend { font-size: 14px; color: var(--ink-2); margin: 2px 0 8px; }
  #phone .legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin: 0 4px 0 10px; }
</style>

<!-- projector view -->
<div id="proj" class="hidden">
  <div class="head"><h1 id="ptitle"></h1><span class="tag" id="ptag"></span></div>
  <div class="main">
    <div class="plots"><svg id="plotA" viewBox="0 0 700 250"></svg><svg id="plotB" viewBox="0 0 700 250"></svg></div>
    <div class="side">
      <div class="join" id="join">
        <div class="qr" id="qr"></div>

      </div>
      <div class="wall" id="wall"></div>
      <div class="reveal hidden" id="reveal"></div>
    </div>
  </div>
  <div class="bar">
    <button id="prev" title="Previous pair (←)">⏮ pair</button>
    <button id="next" title="Next pair (→)">pair ⏭</button>
    <button id="toggle" class="primary" title="Show the features (space)">Reveal the features</button>
    <select id="setsel" title="Which set of pairs"><option value="activities">activities</option><option value="exercises">exercises</option><option value="challenge">challenge</option></select>
    <span class="status" id="status"></span>
  </div>
</div>

<!-- phone view -->
<div id="phone" class="hidden">

  <div class="row"><button class="primary" id="fsend">Send</button><span class="left" id="fleft">140</span></div>
  <div class="msg" id="fmsg"></div>
</div>

  [0, 1, 2, 3, 4].forEach(s => { el('line', { x1: xs(s * FS), x2: xs(s * FS), y1: Y0, y2: B }, grid); txt(axis, xs(Math.min(s * FS, WN - 1)), B + 22, big && s === 4 ? '4 s' : s, { 'text-anchor': s === 4 ? 'end' : 'middle', style: `font-size:${fs}px` }); });
  el('path', { d: `M${X0},${Y0}V${Y1}H${X1}` }, axis);
  [0, 1, 2].forEach(k => el('path', { d: r.a[k].slice(0, WN).map((v, i) => (i ? 'L' : 'M') + xs(i).toFixed(1) + ',' + ys(v).toFixed(1)).join(''), fill: 'none', stroke: COL['xyz'[k]], 'stroke-width': big ? 2 : 2.4 }, svg));
  if (gyro) {
    el('path', { d: `M${X0},${G0}V${G1}H${X1}` }, axis);
    txt(axis, X0 - 8, gs(S.ghi) + 6, S.ghi, { 'text-anchor': 'end', style: `font-size:${fs}px` });
    el('path', { d: gyroMag(r, 0).map((v, i) => (i ? 'L' : 'M') + xs(i).toFixed(1) + ',' + gs(v).toFixed(1)).join(''), fill: 'none', stroke: COL.w, 'stroke-width': big ? 2 : 2.4 }, svg);
  }
  txt(svg, X0, Y0 - 10, label, { style: `font-family:var(--sans);font-size:${big ? 24 : 28}px;font-weight:700;fill:var(--ink)` });
  if (big) {
    let lx = X1 - (gyro ? 330 : 250);
    [['x', 'acc. x'], ['y', 'acc. y'], ['z', 'acc. z']].concat(gyro ? [['w', '|ω| rad/s']] : []).forEach(([k, n]) => { el('line', { x1: lx, x2: lx + 18, y1: Y0 - 16, y2: Y0 - 16, stroke: COL[k], 'stroke-width': 3 }, svg); txt(svg, lx + 24, Y0 - 10, n, { style: 'font-family:var(--sans);font-size:17px;fill:var(--ink-2)' }); lx += 84; });
    txt(svg, 14, (Y0 + Y1) / 2, 'm/s²', { transform: `rotate(-90 14 ${(Y0 + Y1) / 2})`, 'text-anchor': 'middle', style: 'font-family:var(--sans);font-size:17px;fill:var(--ink-2)' });
  }
}

// ------------------------------------------------------------ the features shown on reveal, over all 4-second windows of each activity
const mean = a => a.reduce((s, v) => s + v, 0) / a.length;
const sd = a => { const m = mean(a); return Math.sqrt(mean(a.map(v => (v - m) ** 2))); };
const accMag = (r, o) => r.a[0].slice(o, o + WN).map((v, j) => Math.hypot(v, r.a[1][o + j], r.a[2][o + j]));
const gyroMag = (r, o) => r.g[0].slice(o, o + WN).map((v, j) => Math.hypot(v, r.g[1][o + j], r.g[2][o + j]));
function domFreq(m) {                                                  // strongest component between 0.3 and 8 Hz; none if weaker than 0.3
  const n = m.length, mu = mean(m); let best = -1, bf = 0;
  for (let k = 1; k <= n / 2; k++) { const f = k * FS / n; if (f < 0.3 || f > 8) continue; let re = 0, im = 0; for (let j = 0; j < n; j++) { const ph = 2 * Math.PI * k * j / n; re += (m[j] - mu) * Math.cos(ph); im -= (m[j] - mu) * Math.sin(ph); } const a = 2 * Math.hypot(re, im) / n; if (a > best) { best = a; bf = f; } }
  return best >= 0.3 ? bf : 0;
}
const FEATS = [
  { n: 'mean of x', u: 'm/s²', f: (r, o) => mean(r.a[0].slice(o, o + WN)) },
  { n: 'mean of y', u: 'm/s²', f: (r, o) => mean(r.a[1].slice(o, o + WN)) },
  { n: 'mean of z', u: 'm/s²', f: (r, o) => mean(r.a[2].slice(o, o + WN)) },
  { n: 'standard deviation of |a|', u: 'm/s²', f: (r, o) => sd(accMag(r, o)) },
  { n: 'minimum of |a|', u: 'm/s²', f: (r, o) => Math.min(...accMag(r, o)) },
  { n: 'dominant frequency of |a|', u: 'Hz', f: (r, o) => domFreq(accMag(r, o)) },
  { n: 'mean of |ω|', u: 'rad/s', gyro: true, f: (r, o) => mean(gyroMag(r, o)) },
  { n: 'standard deviation of |ω|', u: 'rad/s', gyro: true, f: (r, o) => sd(gyroMag(r, o)) },
];
function featureTable(P) {
  const feats = FEATS.filter(F => !F.gyro || hasGyro(P));
  const per = key => { const r = REC[key], out = feats.map(() => []); for (let o = 0; o + WN <= r.a[0].length; o += HOP) feats.forEach((F, i) => out[i].push(F.f(r, o))); return out; };
  const A = per(P.a[0]), B = per(P.b[0]);
  // separation: gap between the two averages, in units of their combined window-to-window spread
  const rows = feats.map((F, i) => ({ F, a: mean(A[i]), b: mean(B[i]), sep: Math.abs(mean(A[i]) - mean(B[i])) / (sd(A[i]) + sd(B[i]) + 0.05) }));
  const order = rows.slice().sort((p, q) => q.sep - p.sep);
  return { rows, top: [order[0], order[1]] };
}

// ------------------------------------------------------------ backend: the Apps Script web app, or localStorage in test mode
const LS = { round: 'sd-round', answers: 'sd-answers' };
const today = () => new Date().toISOString().slice(0, 10);
const api = {
  async getRound() {
    if (!API) return JSON.parse(localStorage.getItem(LS.round) || '{"round":1}');
    return (await fetch(`${API}?action=round&t=${Date.now()}`)).json();
  },
  async setRound(round, key) {
    if (!API) { localStorage.setItem(LS.round, JSON.stringify({ round, session: today() })); return { ok: true }; }
    return (await fetch(`${API}?action=setRound&round=${round}&session=${today()}&key=${encodeURIComponent(key)}`)).json();
  },
  async submit(round, text) {
    if (!API) { const a = JSON.parse(localStorage.getItem(LS.answers) || '[]'); a.push({ t: Date.now(), round, text, session: today() }); localStorage.setItem(LS.answers, JSON.stringify(a)); return { ok: true }; }
    return (await fetch(`${API}?action=submit&round=${round}&text=${encodeURIComponent(text)}`)).json();
  },
  async list(round) {
    if (!API) return { answers: JSON.parse(localStorage.getItem(LS.answers) || '[]').filter(a => a.round === round && a.session === today()) };
    return (await fetch(`${API}?action=list&round=${round}&t=${Date.now()}`)).json();
  },
};

const isPhone = new URLSearchParams(location.search).has('phone');
if (isPhone) phone(); else projector();

// ------------------------------------------------------------ projector: the pair, the QR code, the live wall, the reveal
function projector() {
  $('proj').classList.remove('hidden');
  const key = (location.hash.match(/key=([^&]+)/) || [])[1] || '';
  let round = 1, revealed = false, seen = new Set(), hiddenTxt = new Set(), last = [];
  let set = ((location.hash.match(/set=(\w+)/) || [])[1] || 'activities');
  if (set === 'unusual') set = 'challenge';   // the old name still works
  if (!SETS.includes(set)) set = 'activities';
  const inSet = () => PAIRS.map((P, i) => i + 1).filter(i => PAIRS[i - 1].set === set);
  const phoneUrl = location.origin + location.pathname + '?phone&v=' + BUILD;
  $('purl').textContent = (location.origin + location.pathname + '?phone').replace(/^https?:\/\//, '');
  try { const q = qrcode(0, 'M'); q.addData(phoneUrl); q.make(); $('qr').innerHTML = q.createSvgTag({ cellSize: 5, margin: 2, scalable: true }); }
  catch (_) { $('qr').textContent = ''; }
  function show() {
    const P = PAIRS[round - 1], S = scaleOf(P), gy = hasGyro(P), ids = inSet();
    $('ptitle').textContent = `Spot the difference: ${P.a[1]} or ${P.b[1]}?`;
    $('ptag').textContent = `${set} · pair ${ids.indexOf(round) + 1} of ${ids.length} · ${placeOf(P)}`;
    plot($('plotA'), P.a[0], P.a[1], S, true, gy); plot($('plotB'), P.b[0], P.b[1], S, true, gy);
    $('setsel').value = set;
    $('wall').classList.toggle('hidden', revealed); $('reveal').classList.toggle('hidden', !revealed); $('join').classList.toggle('hidden', revealed);
    $('toggle').textContent = revealed ? 'Back to the answers' : 'Reveal the features';
    if (revealed) drawReveal(P); else drawWall();
  }
  const val = (v, F) => F.u === 'Hz' ? (v === 0 ? 'none' : fmt(v, 2)) : fmt(v, 1);
  function drawReveal(P) {
    const T = featureTable(P), top = new Set(T.top.map(r => r.F.n));
    $('reveal').innerHTML = `<table><tr><th>feature, averaged over 4-s windows</th><th>${P.a[1]}</th><th>${P.b[1]}</th></tr>` +
      T.rows.map(r => `<tr class="${top.has(r.F.n) ? 'top' : ''}"><td>${r.F.n} (${r.F.u})</td><td class="v">${val(r.a, r.F)}</td><td class="v">${val(r.b, r.F)}</td></tr>`).join('') +
      `</table><p>Highlighted: the two features whose values differ most between the two activities, relative to how much they vary from window to window.</p><p>${last.length} answers this round.</p>`;
  }
  function drawWall() {                                                 // the answers as they arrived, one card each; click a card to hide it
    const shown = last.filter(a => !hiddenTxt.has(a.t + a.text));
    $('wall').innerHTML = '';
    const chips = document.createElement('div'); chips.className = 'chips';
    shown.forEach(a => {
      const c = document.createElement('span'), id = a.t + a.text; c.className = 'chip' + (seen.has(id) ? '' : ' new');
      c.textContent = a.text; c.title = 'click to hide'; c.onclick = () => { hiddenTxt.add(id); drawWall(); }; chips.appendChild(c); seen.add(id);
    });
    $('wall').appendChild(chips);
    if (!last.length) $('wall').innerHTML = '<p style="font-size:20px;color:var(--ink-3)">Answers will appear here as they arrive.</p>';
    $('pcount').textContent = `${last.length} answer${last.length === 1 ? '' : 's'}`;
  }
  async function poll() {
    try { const r = await api.list(round); const a = (r.answers || []).sort((p, q) => p.t - q.t); const changed = a.length !== last.length; last = a; if (changed && !revealed) drawWall(); $('status').textContent = API ? 'live' : 'test mode (this browser only)'; }
    catch (e) { $('status').textContent = 'cannot reach the answer sheet'; }
  }
  async function go(r) {
    const ids = inSet(); round = ids.includes(r) ? r : ids[0]; revealed = false; last = []; show();
    try { const s = await api.setRound(round, key); if (s && s.ok === false) $('status').textContent = 'round not shared: check the #key in the URL'; } catch (_) {}
    poll();
  }
  const step = d => { const ids = inSet(), i = ids.indexOf(round) + d; if (i >= 0 && i < ids.length) go(ids[i]); };
  $('prev').onclick = () => step(-1); $('next').onclick = () => step(1);
  $('setsel').onchange = () => { set = $('setsel').value; go(inSet()[0]); $('setsel').blur(); };
  $('toggle').onclick = () => { revealed = !revealed; show(); };
  document.addEventListener('keydown', e => { if (e.target.tagName === 'SELECT') return; if (e.key === 'ArrowRight') step(1); else if (e.key === 'ArrowLeft') step(-1); else if (e.key === ' ') { e.preventDefault(); $('toggle').click(); } });
  { const n = parseInt((location.hash.match(/pair=(\d+)/) || [])[1] || '0', 10), ids = inSet(); go(ids[Math.max(0, Math.min(ids.length, n || 1) - 1)]); }
  setInterval(poll, 3000);
}

// ------------------------------------------------------------ phone: the same pair, a text box, send
function phone() {
  $('phone').classList.remove('hidden');
  if (!API) $('fmsg').textContent = 'Test mode: answers stay on this device.';
  let round = 0, busy = false;
  async function sync() {
    try { const r = await api.getRound(); if (r && r.error) throw new Error(r.error); const n = Math.max(1, Math.min(PAIRS.length, r.round || 1)); if (n !== round) { round = n; const P = PAIRS[n - 1], S = scaleOf(P), gy = hasGyro(P); $('ftitle').textContent = `${P.a[1]} or ${P.b[1]}?`; $('flegend').innerHTML = `${placeOf(P)}, 4 s<i style="background:${COL.x}"></i>x<i style="background:${COL.y}"></i>y<i style="background:${COL.z}"></i>z` + (gy ? `<i style="background:${COL.w}"></i>|ω|` : ''); plot($('fA'), P.a[0], P.a[1], S, false, gy); plot($('fB'), P.b[0], P.b[1], S, false, gy); $('fmsg').textContent = ''; } }
    catch (e) { $('fmsg').textContent = 'Cannot reach the class page (' + (e && e.message || e) + '). Check your connection.'; }
    return round;
  }
  $('ftext').addEventListener('input', () => { $('fleft').textContent = 140 - $('ftext').value.length; });
  $('fsend').onclick = async () => {
    const s = $('ftext').value.replace(/\s+/g, ' ').trim();
    if (!s) { $('fmsg').textContent = 'Type an answer first.'; return; }
    if (busy) return;
    busy = true; $('fsend').disabled = true; $('fmsg').textContent = 'Sending…';
    try {
      if (!round) await sync();                                         // the pair has not loaded yet: fetch it first
      if (!round) throw new Error('the current pair did not load');
      const r = await api.submit(round, s);
      $('fmsg').textContent = r.ok ? 'Sent. Add another idea if you have one.' : 'Not sent (' + (r.error || 'unknown') + '); try again.';
      if (r.ok) { $('ftext').value = ''; $('fleft').textContent = 140; }
    }
    catch (e) { $('fmsg').textContent = 'Not sent (' + (e && e.message || e) + '); check your connection.'; }
    setTimeout(() => { busy = false; $('fsend').disabled = false; }, 2500);       // a short pause between sends
  };
  sync(); setInterval(sync, 5000);
  window.addEventListener('storage', sync);
}
})();
</script>

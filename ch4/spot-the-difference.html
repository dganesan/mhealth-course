  .side { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 12px; min-height: 0; }
  .join { display: flex; gap: 16px; align-items: center; background: #f6f8fb; border: 1px solid var(--rule); border-radius: 6px; padding: 10px 14px; }

  .wall { overflow-y: auto; min-height: 0; padding-right: 6px; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 20px; line-height: 1.25; background: #fff; border: 1.5px solid var(--rule); border-left: 5px solid var(--ma); border-radius: 5px; padding: 4px 9px; cursor: pointer; max-width: 100%; }
  .chip:hover { text-decoration: line-through; color: var(--ink-3); }
  .chip.new { animation: pop .5s ease-out; }
  @keyframes pop { from { background: #fff3bf; } to { background: #fff; } }
  .reveal { overflow-y: auto; min-height: 0; }
  .reveal table { border-collapse: collapse; width: 100%; font-size: 21px; }
  .reveal th, .reveal td { padding: 7px 10px; border-bottom: 1px solid var(--rule); text-align: right; }
  .reveal th:first-child, .reveal td:first-child { text-align: left; }
  .reveal td.v { font-family: var(--mono); }
  .reveal tr.top td { background: #e8f1fd; font-weight: 700; }
  .reveal p { font-size: 19px; color: var(--ink-2); margin: 10px 2px; }
  .bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 18px; border: 1px solid var(--rule); border-radius: 6px; background: #f6f7f9; }
  button { font: inherit; font-size: 18px; color: var(--ink); background: #fff; border: 1px solid #9a9a9a; border-radius: 6px; padding: 9px 16px; cursor: pointer; }
  button:hover { border-color: var(--ink); }
  button.primary { background: var(--ma); color: #fff; border-color: var(--ma); font-weight: 700; }
  .bar .status { margin-left: auto; font-family: var(--mono); font-size: 15px; color: var(--ink-2); }

  /* ---------- phone ---------- */
  #phone { max-width: 560px; margin: 0 auto; padding: 16px; }
  #phone h1 { font-size: 22px; margin: 4px 0 2px; }
  #phone .sub { color: var(--ink-2); font-size: 15px; margin: 0 0 10px; }
  #phone .pp svg { width: 100%; height: 150px; display: block; margin-bottom: 4px; }

const COL = { x: '#2a78d6', y: '#eb6834', z: '#1baf7a' };
const NAME = { Sitting: 'sitting', Standing: 'standing', Walking: 'walking', Upstairs: 'walking upstairs', Downstairs: 'walking downstairs', Running: 'running' };
const ROUNDS = [['Sitting', 'Standing'], ['Standing', 'Walking'], ['Walking', 'Running'], ['Upstairs', 'Downstairs']];
const FS = 50, WN = 200, HOP = 50;                                   // 4-second windows, 1-second hop

// ------------------------------------------------------------ one 4-second window, three axes
function plot(svg, act, big) {
  svg.innerHTML = '';
  const t = TRACES[act], X0 = big ? 64 : 58, X1 = 690, Y0 = big ? 34 : 30, Y1 = 214, lo = -20, hi = 22;
  const xs = i => X0 + i / (WN - 1) * (X1 - X0), ys = v => Y1 - (v - lo) / (hi - lo) * (Y1 - Y0);
  const grid = el('g', { class: 'grid' }, svg), axis = el('g', { class: 'axis' }, svg), fs = big ? 18 : 22;
  [-20, -10, 0, 10, 20].forEach(v => { el('line', { x1: X0, x2: X1, y1: ys(v), y2: ys(v) }, grid); txt(axis, X0 - 8, ys(v) + 6, v, { 'text-anchor': 'end', style: `font-size:${fs}px` }); });
  [0, 1, 2, 3, 4].forEach(s => { el('line', { x1: xs(s * FS), x2: xs(s * FS), y1: Y0, y2: Y1 }, grid); txt(axis, xs(Math.min(s * FS, WN - 1)), Y1 + 22, big && s === 4 ? '4 s' : s, { 'text-anchor': s === 4 ? 'end' : 'middle', style: `font-size:${fs}px` }); });
  el('path', { d: `M${X0},${Y0}V${Y1}H${X1}` }, axis);
  ['x', 'y', 'z'].forEach(k => el('path', { d: t[k].slice(0, WN).map((v, i) => (i ? 'L' : 'M') + xs(i).toFixed(1) + ',' + ys(v).toFixed(1)).join(''), fill: 'none', stroke: COL[k], 'stroke-width': big ? 2 : 2.4 }, svg));
  txt(svg, X0, Y0 - 10, NAME[act], { style: `font-family:var(--sans);font-size:${big ? 24 : 28}px;font-weight:700;fill:var(--ink)` });
  if (big) {
    let lx = X1 - 250; ['x', 'y', 'z'].forEach(k => { el('line', { x1: lx, x2: lx + 18, y1: Y0 - 16, y2: Y0 - 16, stroke: COL[k], 'stroke-width': 3 }, svg); txt(svg, lx + 24, Y0 - 10, 'acc. ' + k, { style: 'font-family:var(--sans);font-size:17px;fill:var(--ink-2)' }); lx += 84; });
    txt(svg, 14, (Y0 + Y1) / 2, 'm/s²', { transform: `rotate(-90 14 ${(Y0 + Y1) / 2})`, 'text-anchor': 'middle', style: 'font-family:var(--sans);font-size:17px;fill:var(--ink-2)' });
  }
}

// ------------------------------------------------------------ the features shown on reveal, over all 4-second windows of each activity
const mean = a => a.reduce((s, v) => s + v, 0) / a.length;
const sd = a => { const m = mean(a); return Math.sqrt(mean(a.map(v => (v - m) ** 2))); };
function domFreq(m) {                                                  // strongest component between 0.3 and 8 Hz; none if weaker than 0.3 m/s²
  const n = m.length, mu = mean(m); let best = -1, bf = 0;
  for (let k = 1; k <= n / 2; k++) { const f = k * FS / n; if (f < 0.3 || f > 8) continue; let re = 0, im = 0; for (let j = 0; j < n; j++) { const ph = 2 * Math.PI * k * j / n; re += (m[j] - mu) * Math.cos(ph); im -= (m[j] - mu) * Math.sin(ph); } const a = 2 * Math.hypot(re, im) / n; if (a > best) { best = a; bf = f; } }
  return best >= 0.3 ? bf : 0;
}
const FEATS = [
  { n: 'mean of x', u: 'm/s²', f: (t, o) => mean(t.x.slice(o, o + WN)) },
  { n: 'mean of y', u: 'm/s²', f: (t, o) => mean(t.y.slice(o, o + WN)) },
  { n: 'mean of z', u: 'm/s²', f: (t, o) => mean(t.z.slice(o, o + WN)) },
  { n: 'spread of |a| (std)', u: 'm/s²', f: (t, o) => sd(mag(t, o)) },
  { n: 'dominant frequency', u: 'Hz', f: (t, o) => domFreq(mag(t, o)) },
  { n: 'lowest |a|', u: 'm/s²', f: (t, o) => Math.min(...mag(t, o)) },
];
const mag = (t, o) => t.x.slice(o, o + WN).map((v, j) => Math.hypot(v, t.y[o + j], t.z[o + j]));
function featureTable(a, b) {
  const per = act => { const t = TRACES[act], out = FEATS.map(() => []); for (let o = 0; o + WN <= t.x.length; o += HOP) FEATS.forEach((F, i) => out[i].push(F.f(t, o))); return out; };
  const A = per(a), B = per(b);
  // separation: gap between the two averages, in units of their combined window-to-window spread
  const rows = FEATS.map((F, i) => ({ F, a: mean(A[i]), b: mean(B[i]), sep: Math.abs(mean(A[i]) - mean(B[i])) / (sd(A[i]) + sd(B[i]) + 0.05) }));
  const order = rows.slice().sort((p, q) => q.sep - p.sep);
  return { rows, top: [order[0], order[1]] };
}

// ------------------------------------------------------------ backend: the Apps Script web app, or localStorage in test mode
const LS = { round: 'sd-round', answers: 'sd-answers' };
const today = () => new Date().toISOString().slice(0, 10);
const api = {
  async getRound() {
    if (!API) return JSON.parse(localStorage.getItem(LS.round) || '{"round":1}');
    return (await fetch(`${API}?action=round&t=${Date.now()}`)).json();
  },
  async setRound(round, key) {
    if (!API) { localStorage.setItem(LS.round, JSON.stringify({ round, session: today() })); return { ok: true }; }
    return (await fetch(`${API}?action=setRound&round=${round}&session=${today()}&key=${encodeURIComponent(key)}`)).json();
  },
  async submit(round, text) {
    if (!API) { const a = JSON.parse(localStorage.getItem(LS.answers) || '[]'); a.push({ t: Date.now(), round, text, session: today() }); localStorage.setItem(LS.answers, JSON.stringify(a)); return { ok: true }; }
    return (await fetch(`${API}?action=submit&round=${round}&text=${encodeURIComponent(text)}`)).json();
  },
  async list(round) {
    if (!API) return { answers: JSON.parse(localStorage.getItem(LS.answers) || '[]').filter(a => a.round === round && a.session === today()) };
    return (await fetch(`${API}?action=list&round=${round}&t=${Date.now()}`)).json();
  },
};

const isPhone = new URLSearchParams(location.search).has('phone');
if (isPhone) phone(); else projector();

// ------------------------------------------------------------ projector: the pair, the QR code, the live wall, the reveal
function projector() {
  $('proj').classList.remove('hidden');
  const key = (location.hash.match(/key=([^&]+)/) || [])[1] || '';
  let round = 1, revealed = false, seen = new Set(), hiddenTxt = new Set(), last = [];
  const phoneUrl = location.origin + location.pathname + '?phone&v=' + BUILD;
  $('purl').textContent = (location.origin + location.pathname + '?phone').replace(/^https?:\/\//, '');
  try { const q = qrcode(0, 'M'); q.addData(phoneUrl); q.make(); $('qr').innerHTML = q.createSvgTag({ cellSize: 5, margin: 2, scalable: true }); }
  catch (_) { $('qr').textContent = ''; }
  function show() {
    const [a, b] = ROUNDS[round - 1];
    $('ptitle').textContent = `Spot the difference: ${NAME[a]} or ${NAME[b]}?`;
    $('ptag').textContent = `pair ${round} of ${ROUNDS.length}`;
    plot($('plotA'), a, true); plot($('plotB'), b, true);
    $('wall').classList.toggle('hidden', revealed); $('reveal').classList.toggle('hidden', !revealed); $('join').classList.toggle('hidden', revealed);
    $('toggle').textContent = revealed ? 'Back to the answers' : 'Reveal the features';
    if (revealed) drawReveal(a, b); else drawWall();
  }
  const val = (v, F) => F.u === 'Hz' ? (v === 0 ? 'none' : fmt(v, 2)) : fmt(v, 1);
  function drawReveal(a, b) {
    const T = featureTable(a, b), top = new Set(T.top.map(r => r.F.n));
    $('reveal').innerHTML = `<table><tr><th>feature, averaged over 4-s windows</th><th>${NAME[a]}</th><th>${NAME[b]}</th></tr>` +
      T.rows.map(r => `<tr class="${top.has(r.F.n) ? 'top' : ''}"><td>${r.F.n} (${r.F.u})</td><td class="v">${val(r.a, r.F)}</td><td class="v">${val(r.b, r.F)}</td></tr>`).join('') +
      `</table><p>Highlighted: the two features whose values differ most between the two activities, relative to how much they vary from window to window.</p><p>${last.length} answers this round.</p>`;
  }
  function drawWall() {                                                 // the answers as they arrived, one card each; click a card to hide it
    const shown = last.filter(a => !hiddenTxt.has(a.t + a.text));
    $('wall').innerHTML = '';
    const chips = document.createElement('div'); chips.className = 'chips';
    shown.forEach(a => {
      const c = document.createElement('span'), id = a.t + a.text; c.className = 'chip' + (seen.has(id) ? '' : ' new');
      c.textContent = a.text; c.title = 'click to hide'; c.onclick = () => { hiddenTxt.add(id); drawWall(); }; chips.appendChild(c); seen.add(id);
    });
    $('wall').appendChild(chips);
    if (!last.length) $('wall').innerHTML = '<p style="font-size:20px;color:var(--ink-3)">Answers will appear here as they arrive.</p>';
    $('pcount').textContent = `${last.length} answer${last.length === 1 ? '' : 's'}`;
  }
  async function poll() {
    try { const r = await api.list(round); const a = (r.answers || []).sort((p, q) => p.t - q.t); const changed = a.length !== last.length; last = a; if (changed && !revealed) drawWall(); $('status').textContent = API ? 'live' : 'test mode (this browser only)'; }
    catch (e) { $('status').textContent = 'cannot reach the answer sheet'; }
  }
  async function go(r) {
    round = Math.max(1, Math.min(ROUNDS.length, r)); revealed = false; last = []; show();
    try { const s = await api.setRound(round, key); if (s && s.ok === false) $('status').textContent = 'round not shared: check the #key in the URL'; } catch (_) {}
    poll();
  }
  $('prev').onclick = () => go(round - 1); $('next').onclick = () => go(round + 1);
  $('toggle').onclick = () => { revealed = !revealed; show(); };
  document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') go(round + 1); else if (e.key === 'ArrowLeft') go(round - 1); else if (e.key === ' ') { e.preventDefault(); $('toggle').click(); } });
  go(parseInt((location.hash.match(/pair=(\d)/) || [])[1] || '1', 10));
  setInterval(poll, 3000);
}

// ------------------------------------------------------------ phone: the same pair, a text box, send
function phone() {
  $('phone').classList.remove('hidden');
  if (!API) $('fmsg').textContent = 'Test mode: answers stay on this device.';
  let round = 0, busy = false;
  async function sync() {
    try { const r = await api.getRound(); if (r && r.error) throw new Error(r.error); const n = Math.max(1, Math.min(ROUNDS.length, r.round || 1)); if (n !== round) { round = n; const [a, b] = ROUNDS[n - 1]; $('ftitle').textContent = `Pair ${n}: ${NAME[a]} or ${NAME[b]}?`; plot($('fA'), a, false); plot($('fB'), b, false); $('fmsg').textContent = ''; } }
    catch (e) { $('fmsg').textContent = 'Cannot reach the class page (' + (e && e.message || e) + '). Check your connection.'; }
    return round;
  }
  $('ftext').addEventListener('input', () => { $('fleft').textContent = 140 - $('ftext').value.length; });
  $('fsend').onclick = async () => {
    const s = $('ftext').value.replace(/\s+/g, ' ').trim();
    if (!s) { $('fmsg').textContent = 'Type an answer first.'; return; }
    if (busy) return;
    busy = true; $('fsend').disabled = true; $('fmsg').textContent = 'Sending…';
    try {
      if (!round) await sync();                                         // the pair has not loaded yet: fetch it first
      if (!round) throw new Error('the current pair did not load');
      const r = await api.submit(round, s);
      $('fmsg').textContent = r.ok ? 'Sent. Add another idea if you have one.' : 'Not sent (' + (r.error || 'unknown') + '); try again.';
      if (r.ok) { $('ftext').value = ''; $('fleft').textContent = 140; }
    }
    catch (e) { $('fmsg').textContent = 'Not sent (' + (e && e.message || e) + '); check your connection.'; }
    setTimeout(() => { busy = false; $('fsend').disabled = false; }, 2500);       // a short pause between sends
  };
  sync(); setInterval(sync, 5000);
  window.addEventListener('storage', sync);
}
})();
</script>
</body>
</html>

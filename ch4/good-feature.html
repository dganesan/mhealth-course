  geom = { X0, X1, lo, hi };
  const grid = el('g', { class: 'grid' }, svg), axis = el('g', { class: 'axis' }, svg);
  niceTicks(lo, hi, 8).forEach(v => { el('line', { x1: xs(v), x2: xs(v), y1: Y0, y2: Y1 }, grid); txt(axis, xs(v), Y1 + 30, String(+v.toFixed(3)), { 'text-anchor': 'middle', style: 'font-size:22px' }); });
  txt(svg, X0, Y1 + 72, `${FEATS[feat]} (m/s²), one value per window`, { style: 'font-size:22px;fill:var(--ink-2)' });
  // the two sides of the threshold
  const cx = xs(cut), names = side ? [P.a[1], P.b[1]] : [P.b[1], P.a[1]], cols = side ? [COL.A, COL.B] : [COL.B, COL.A];
  el('rect', { x: X0, y: Y0, width: Math.max(0, cx - X0), height: Y1 - Y0, fill: cols[0], 'fill-opacity': .06 }, svg);
  el('rect', { x: cx, y: Y0, width: Math.max(0, X1 - cx), height: Y1 - Y0, fill: cols[1], 'fill-opacity': .06 }, svg);
  txt(svg, cx - 12, Y0 - 16, `← called ${names[0]}`, { 'text-anchor': 'end', style: `font-size:21px;font-weight:700;fill:${cols[0]}` });
  txt(svg, cx + 12, Y0 - 16, `called ${names[1]} →`, { style: `font-size:21px;font-weight:700;fill:${cols[1]}` });
  [[va, P.a[1], COL.A, Y0], [vb, P.b[1], COL.B, Y0 + mid]].forEach(([v, name, col, top], r) => {
    const c = new Array(nb).fill(0); v.forEach(x => c[Math.max(0, Math.min(nb - 1, Math.floor((x - lo) / (hi - lo) * nb)))]++);
    const mx = Math.max(...c), h = mid - 44;
    c.forEach((n, i) => { if (!n) return; const x = X0 + i * bw, ctr = lo + (i + 0.5) / nb * (hi - lo), right = (ctr >= cut) === (r === 0 ? !side : side);
      el('rect', { x: x + 1, y: top + 40 + h - n / mx * h, width: bw - 2, height: n / mx * h, fill: col, 'fill-opacity': right ? .9 : .35 }, svg); });
    el('line', { x1: X0, x2: X1, y1: top + 40 + h, y2: top + 40 + h, stroke: 'var(--ink-3)' }, svg);
    txt(svg, X0 + 6, top + 32, name, { style: `font-size:24px;font-weight:700;fill:${col};stroke:#fff;stroke-width:7px;paint-order:stroke` });
  });
  el('line', { x1: cx, x2: cx, y1: Y0 - 4, y2: Y1, stroke: 'var(--ink)', 'stroke-width': 3.5, 'stroke-dasharray': '10 6' }, svg);
  el('rect', { x: cx - 16, y: Y1 - 34, width: 32, height: 34, rx: 6, fill: 'var(--ink)', style: 'cursor:ew-resize', 'data-drag': '1' }, svg);
  el('rect', { x: cx - 24, y: Y0, width: 48, height: Y1 - Y0, fill: 'transparent', style: 'cursor:ew-resize', 'data-drag': '1' }, svg);
  // the readout: the share of windows on the correct side, and once 8 people are shown, the one-person score beside it
  const s = scoreAt(va, vb, cut, side), one = best(oneA, oneB).acc, many = best(manyA, manyB).acc, pc = a => Math.round(100 * a) + '%';
  const compare = step >= 2, col = compare ? holdCol(one - many) : '#9a9a9a';
  $('side').innerHTML = `<div class="card" style="border-left-color:${col};background:${compare ? TINT[col] : '#f4f5f7'}">
      <div class="lab">windows on the correct side</div><div class="big">${pc(s.acc)}</div>
      ${compare ? `<div class="lab" style="margin-top:10px">best threshold, one person → 8 people</div><div class="big">${`<small>${pc(one)} → </small>`}${pc(many)}</div><div class="lvl" style="color:${col}">${LEVEL[col]}</div>` : ''}</div>
    <div class="counts"><span style="color:${COL.A};font-weight:700">${P.a[1]}</span>: <b>${s.okA} of ${va.length}</b> on its side<br><span style="color:${COL.B};font-weight:700">${P.b[1]}</span>: <b>${s.okB} of ${vb.length}</b> on its side</div>
    <div class="scale">100% means the feature always tells them apart. 50% is a coin flip.</div>`;
}
function go(i) { step = Math.max(0, Math.min(STEPS.length - 1, i)); const S = STEPS[step]; feat = S.feat; pop = S.pop; reset(S.start); draw(); location.hash = step + 1; }
$('prev').onclick = () => go(step - 1); $('next').onclick = () => go(step + 1);
$('best').onclick = () => { reset('best'); draw(); };
let dragging = false;
const toVal = e => { const svg = $('fig'), p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; const q = p.matrixTransform(svg.getScreenCTM().inverse()); return geom.lo + (Math.max(geom.X0, Math.min(geom.X1, q.x)) - geom.X0) / (geom.X1 - geom.X0) * (geom.hi - geom.lo); };
$('fig').addEventListener('pointerdown', e => { dragging = true; $('fig').setPointerCapture(e.pointerId); cut = toVal(e); draw(); });
$('fig').addEventListener('pointermove', e => { if (dragging) { cut = toVal(e); draw(); } });
$('fig').addEventListener('pointerup', () => { dragging = false; });
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') go(step + 1); else if (e.key === 'ArrowLeft') go(step - 1); else if (e.key === ' ') { e.preventDefault(); $('best').click(); } });
go((parseInt(location.hash.slice(1), 10) || 1) - 1);
})();
</script>

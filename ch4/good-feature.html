function niceTicks(lo, hi, n) {
  const span = hi - lo, mag = Math.pow(10, Math.floor(Math.log10(span / n)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => span / s <= n) || mag * 10;

// windows on the correct side of a threshold; the side for each activity is the one that does best for this feature
function scoreAt(va, vb, c, aBelow) { const okA = va.filter(v => aBelow ? v < c : v >= c).length, okB = vb.filter(v => aBelow ? v >= c : v < c).length; return { okA, okB, acc: (okA + okB) / (va.length + vb.length) }; }
function best(va, vb) {
  const all = [...new Set(va.concat(vb))].sort((p, q) => p - q); let b = { acc: 0, c: all[0], aBelow: true };
  for (let i = 0; i <= all.length; i++) {
    const c = i === 0 ? all[0] - 1e-6 : i === all.length ? all[all.length - 1] + 1e-6 : (all[i - 1] + all[i]) / 2;
    [true, false].forEach(aBelow => { const s = scoreAt(va, vb, c, aBelow); if (s.acc > b.acc + 1e-9) b = { acc: s.acc, c, aBelow }; });
  }
  return b;
}

  { title: 'Which feature still works for 8 people?', pair: 'rope', feat: 'min', pop: 'many', start: 'best' },
];
let step = 0, feat, pop, cut, side;
const cur = () => { const S = STEPS[step], P = PAIRS[S.pair], A = DATA.feats[P.a[0]], B = DATA.feats[P.b[0]]; return { S, P, va: A[pop][feat], vb: B[pop][feat], oneA: A.one[feat], oneB: B.one[feat], manyA: A.many[feat], manyB: B.many[feat] }; };
// a threshold is chosen on one person ('best', or 'q': a poor starting place to drag from), and stays put when 8 people are shown;
// 'now' is the best threshold for whatever is shown
function reset(start) {
  const { va, vb, oneA, oneB } = cur(), b = start === 'now' ? best(va, vb) : best(oneA, oneB); side = b.aBelow;
  if (start === 'q') { const s = oneA.concat(oneB).sort((p, q) => p - q); cut = s[Math.floor(s.length * 0.15)]; } else cut = b.c;
}
let geom = null;
function draw() {
  const { S, P, va, vb, oneA, oneB, manyA, manyB } = cur(), svg = $('fig');
  $('title').textContent = S.title;
  $('stepno').textContent = `step ${step + 1} of ${STEPS.length}`;
  $('feat').innerHTML = P.feats.map(k => `<button data-f="${k}" class="${k === feat ? 'on' : ''}">${FEATS[k]}</button>`).join('');
  [...$('feat').children].forEach(b => b.onclick = () => { feat = b.dataset.f; reset('best'); draw(); });
  [...$('pop').children].forEach(b => { b.classList.toggle('on', b.dataset.p === pop); b.onclick = () => { pop = b.dataset.p; draw(); }; });
  // histograms on an axis shared by one person and 8 people, so switching does not move the bars around
  svg.innerHTML = '';
  const ref = oneA.concat(oneB, manyA, manyB);
  let lo = Math.min(...ref), hi = Math.max(...ref); const pad = (hi - lo) * 0.05; lo -= pad; hi += pad;
  const X0 = 40, X1 = 1080, Y0 = 70, Y1 = 610, mid = (Y1 - Y0) / 2, nb = 36, bw = (X1 - X0) / nb, xs = v => X0 + (v - lo) / (hi - lo) * (X1 - X0);
  geom = { X0, X1, Y0, Y1, lo, hi };
  const grid = el('g', { class: 'grid' }, svg), axis = el('g', { class: 'axis' }, svg);
  niceTicks(lo, hi, 8).forEach(v => { el('line', { x1: xs(v), x2: xs(v), y1: Y0, y2: Y1 }, grid); txt(axis, xs(v), Y1 + 30, String(+v.toFixed(3)), { 'text-anchor': 'middle', style: 'font-size:22px' }); });
  txt(svg, X0, Y1 + 72, `${FEATS[feat]} (m/s²), one value per window`, { style: 'font-size:22px;fill:var(--ink-2)' });
  // the two sides of the threshold
  // each side of the line is called whichever activity makes more windows correct, for the windows now shown
  side = scoreAt(va, vb, cut, true).acc >= scoreAt(va, vb, cut, false).acc;
  const cx = xs(cut), names = side ? [P.a[1], P.b[1]] : [P.b[1], P.a[1]], cols = side ? [COL.A, COL.B] : [COL.B, COL.A];
  el('rect', { x: X0, y: Y0, width: Math.max(0, cx - X0), height: Y1 - Y0, fill: cols[0], 'fill-opacity': .06 }, svg);
  el('rect', { x: cx, y: Y0, width: Math.max(0, X1 - cx), height: Y1 - Y0, fill: cols[1], 'fill-opacity': .06 }, svg);
  // the two side labels, kept inside the plot when the line is near an edge (about 11 units per character at this size)
  const lw = `← called ${names[0]}`.length * 11, rw = `called ${names[1]} →`.length * 11;
  const lx = Math.max(X0 + lw, cx - 12), rx = Math.min(X1 - rw, cx + 12), clash = rx < lx + 20;
  txt(svg, lx, Y0 - (clash ? 44 : 16), `← called ${names[0]}`, { 'text-anchor': 'end', style: `font-size:21px;font-weight:700;fill:${cols[0]}` });
  txt(svg, rx, Y0 - 16, `called ${names[1]} →`, { style: `font-size:21px;font-weight:700;fill:${cols[1]}` });
  [[va, P.a[1], COL.A, Y0], [vb, P.b[1], COL.B, Y0 + mid]].forEach(([v, name, col, top], r) => {
    const c = new Array(nb).fill(0); v.forEach(x => c[Math.max(0, Math.min(nb - 1, Math.floor((x - lo) / (hi - lo) * nb)))]++);
    const mx = Math.max(...c), h = mid - 44;
    c.forEach((n, i) => { if (!n) return; const x = X0 + i * bw, ctr = lo + (i + 0.5) / nb * (hi - lo), right = (ctr >= cut) === (r === 0 ? !side : side);
      el('rect', { x: x + 1, y: top + 40 + h - n / mx * h, width: bw - 2, height: n / mx * h, fill: col, 'fill-opacity': right ? .9 : .35 }, svg); });
    el('line', { x1: X0, x2: X1, y1: top + 40 + h, y2: top + 40 + h, stroke: 'var(--ink-3)' }, svg);
    txt(svg, X0 + 6, top + 32, name, { style: `font-size:24px;font-weight:700;fill:${col};stroke:#fff;stroke-width:7px;paint-order:stroke` });
  });
  el('line', { x1: cx, x2: cx, y1: Y0 - 4, y2: Y1, stroke: 'var(--ink)', 'stroke-width': 3.5, 'stroke-dasharray': '10 6' }, svg);
  el('rect', { x: cx - 16, y: Y1 - 34, width: 32, height: 34, rx: 6, fill: 'var(--ink)', style: 'cursor:ew-resize', 'data-drag': '1' }, svg);
  el('rect', { x: cx - 24, y: Y0, width: 48, height: Y1 - Y0, fill: 'transparent', style: 'cursor:ew-resize', 'data-drag': '1' }, svg);
  // the readout: one number, the share of windows on the correct side of the line, for whoever is shown
  const s = scoreAt(va, vb, cut, side);
  $('side').innerHTML = `<div class="feat"><span>feature</span>${FEATS[feat]}</div><div class="feat"><span>windows from</span>${pop === 'one' ? 'one person' : '8 people'}</div><div class="card"><div class="lab">windows on the correct side</div><div class="big">${Math.round(100 * s.acc)}%</div></div>
    <div class="scale">100% means the feature always tells them apart. 50% is a coin flip.</div>`;
}
function go(i) { step = Math.max(0, Math.min(STEPS.length - 1, i)); const S = STEPS[step]; feat = S.feat; pop = S.pop; if (S.start !== 'keep' || cut == null) reset(S.start === 'keep' ? 'best' : S.start); draw(); history.replaceState(null, '', '#' + (step + 1)); }   // replaceState: no history entry per step, so Back leaves the page
$('prev').onclick = () => go(step - 1); $('next').onclick = () => go(step + 1);
$('best').onclick = () => { reset('now'); draw(); };
let dragging = false;
const toVal = e => { const svg = $('fig'), p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; const q = p.matrixTransform(svg.getScreenCTM().inverse()); return geom.lo + (Math.max(geom.X0, Math.min(geom.X1, q.x)) - geom.X0) / (geom.X1 - geom.X0) * (geom.hi - geom.lo); };
// only a press inside the histograms moves the line; a press anywhere else on the page leaves it where it is
const inPlot = e => { const svg = $('fig'), p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; const q = p.matrixTransform(svg.getScreenCTM().inverse()); return q.x >= geom.X0 && q.x <= geom.X1 && q.y >= geom.Y0 - 10 && q.y <= geom.Y1 + 10; };
$('fig').addEventListener('pointerdown', e => { if (!inPlot(e)) return; e.preventDefault(); dragging = true; try { $('fig').setPointerCapture(e.pointerId); } catch (_) {} cut = toVal(e); draw(); });
$('fig').addEventListener('pointermove', e => { if (dragging) { cut = toVal(e); draw(); } });
$('fig').addEventListener('pointerup', () => { dragging = false; });
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') go(step + 1); else if (e.key === 'ArrowLeft') go(step - 1); else if (e.key === ' ') { e.preventDefault(); $('best').click(); } });
go((parseInt(location.hash.slice(1), 10) || 1) - 1);
})();
</script>

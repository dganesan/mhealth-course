<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Similarity-Based Features</title>
</head>
<body>
<style>
  :root {
    color-scheme: light;
    --paper: #ffffff; --ink: #222222; --ink-2: #666666; --ink-3: #9a9a9a; --rule: #dcdcdc; --grid: #ececec; --ma: #2a78d6;
    --sans: "Helvetica Neue", Helvetica, -apple-system, Arial, sans-serif;
    --mono: Menlo, "SF Mono", Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  .grid line { stroke: var(--grid); stroke-width: 1.3; }
  .axis line, .axis path { stroke: var(--ink-2); stroke-width: 1.3; fill: none; }
  .axis text { font-family: var(--mono); fill: var(--ink-2); }
  #app { height: 100vh; padding: 10px 14px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px; }
  .head { padding: 4px 16px 0; }
  h1 { margin: 0; font-size: clamp(24px, 2.4vw, 36px); font-weight: 700; letter-spacing: -0.01em; }
  .main { user-select: none; -webkit-user-select: none; min-height: 0; border: 1px solid var(--rule); border-radius: 6px; padding: 10px 16px; }
  .main svg { width: 100%; height: 100%; display: block; }
  .bar { display: flex; gap: 10px; align-items: center; padding: 10px 18px; border: 1px solid var(--rule); border-radius: 6px; background: #f6f7f9; }
  button { font: inherit; font-size: 18px; color: var(--ink); background: #fff; border: 1px solid #9a9a9a; border-radius: 6px; padding: 9px 16px; cursor: pointer; }
  button:hover { border-color: var(--ink); }
  button.on { background: #e8f1fd; border-color: var(--ma); font-weight: 700; }
  .seg { display: inline-flex; }
  .seg button { border-radius: 0; margin-left: -1px; }
  .seg button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
  .seg button:last-child { border-radius: 0 6px 6px 0; }
  .step { font-family: var(--mono); font-size: 17px; color: var(--ink-2); margin-left: auto; }
  .hide { display: none !important; }
</style>

<div id="app">
  <div class="head"><h1 id="title"></h1></div>
  <div class="main"><svg id="fig" viewBox="0 0 1600 760"></svg></div>
  <div class="bar">
    <button id="prev" title="Previous step (←)">⏮ step</button>
    <button id="next" title="Next step (→)">step ⏭</button>
    <span class="seg" id="match"><button data-m="same">sample by sample</button><button data-m="dtw">DTW</button></span>
    <span class="step" id="stepno"></span>
  </div>
</div>

<script>
(() => {
// Built by tools/dtw-data.py: the chapter's two rowing recordings (UCI Daily and Sports Activities, right-arm gyroscope
// magnitude, 25 Hz, three strokes each, subject p4 fast and p6 slow) and one recording each of four other activities by p4.
const DATA = {"fs":25,"rowA":[1.222,1.638,1.663,1.634,1.64,1.797,1.566,1.83,1.695,1.699,1.442,1.192,1.135,0.971,1.021,0.979,1.199,1.356,1.572,1.717,1.838,1.994,2.016,1.956,1.693,1.369,1.176,1.051,0.89,0.674,0.465,0.335,0.245,0.228,0.363,0.414,0.382,0.336,0.323,0.318,0.341,0.318,0.463,0.632,0.956,1.315,1.297,1.433,1.34,1.458,1.306,1.299,1.45,1.536,1.679,1.61,1.761,1.682,1.737,1.718,1.704,1.758,1.69,1.572,1.509,1.432,1.353,1.057,0.876,0.877,0.954,0.928,0.933,0.91,0.918,1.008,1.056,1.321,1.529,1.855,1.964,1.339],"rowB":[1.21,1.789,1.526,1.284,0.855,0.712,0.571,0.591,0.639,0.573,0.498,0.321,0.222,0.145,0.113,0.106,0.186,0.249,0.296,0.306,0.302,0.272,0.379,0.447,0.53,0.375,0.302,0.227,0.221,0.203,0.152,0.197,0.226,0.286,0.325,0.398,0.493,0.535,0.577,0.669,0.954,1.283,1.582,1.687,1.652,1.608,1.648,1.812,1.986,2.029,1.905,1.605,1.341,1.085,0.98,0.743,0.605,0.395,0.321,0.28,0.335,0.312,0.241,0.157,0.201,0.314,0.373,0.39,0.384,0.346,0.3,0.25,0.306,0.366,0.475,0.592,0.667,0.737,0.892,1.176,1.33,1.265,1.103,0.975,0.91,0.839,0.82,0.773,0.788,0.787,0.838,0.866,0.89,0.909,0.885,0.864,0.858,0.845,0.866,0.723,0.656,0.65,1.015,0.818],"templates":{"cross trainer":[1.076,1.593,1.493,1.22,0.924,0.593,0.519,0.604,0.958,1.259,1.421,1.342,0.987,0.649,0.785,1.407,2.176,2.499,2.322,1.708,1.114,0.97,1.431,2.185,2.775,2.915,2.548,1.721,1.095,0.956,1.308,1.613,1.73,1.678,1.485,1.127,0.74,0.631,0.738,1.037,1.319,1.762,2.085,2.164,1.535,1.052,1.01,1.758,2.206,2.198,1.642,1.207,1.084,1.467,2.095,2.611,2.63,2.196,1.393,0.923,0.941,1.314,1.57,1.746,1.833,1.866,1.767,1.491,1.311,0.972,1.194,1.273,1.633,1.567,1.419,1.0,0.753,1.021,1.528,2.031,2.117,1.878],"cycling":[0.045,0.069,0.065,0.07,0.08,0.092,0.105,0.109,0.095,0.08,0.065,0.067,0.109,1.367,1.437,2.213,0.988,0.924,0.126,0.087,0.115,0.128,0.149,0.117,0.074,0.06,0.059,0.093,0.11,0.106,0.107,0.087,0.095,0.088,0.151,0.207,0.253,0.274,0.235,0.21,0.164,0.143,0.103,0.08,0.103,0.145,0.173,0.153,0.107,0.064,0.061,0.094,0.131,0.133,0.109,0.074,0.076,0.087,0.089,0.084,0.131,0.49,0.501,0.692,0.366,0.355,0.112,0.071,0.091,0.133,0.172,0.156,0.099,0.051,0.058,0.093,0.122,0.119,0.128,0.119,0.095,0.045],"jumping":[1.337,1.875,1.577,1.069,0.806,0.827,0.936,1.809,2.684,2.499,2.169,2.008,2.054,1.648,0.988,0.971,0.814,1.29,2.334,2.959,2.805,2.381,1.825,1.523,0.714,0.45,0.509,1.182,2.183,2.477,1.995,1.767,1.894,1.683,0.987,0.622,0.678,0.714,0.97,1.675,2.046,1.754,1.438,1.053,1.037,0.484,0.402,0.276,0.736,1.191,1.926,1.986,2.034,1.905,1.828,1.443,0.937,0.736,0.72,0.827,1.654,2.329,2.284,1.724,1.483,1.32,0.837,0.392,0.42,0.751,1.165,1.6,1.411,1.461,1.629,2.432,2.045,1.553,0.795,0.755,0.829,1.392],"running on a treadmill":[1.314,1.626,1.058,1.103,1.715,2.629,3.314,4.149,4.593,4.469,3.514,2.335,1.403,1.429,2.152,3.42,4.636,4.602,3.875,2.268,1.494,1.057,1.098,1.585,2.622,3.436,4.326,4.394,4.044,3.033,2.011,1.359,1.384,2.201,3.902,5.17,5.151,3.855,2.452,1.779,1.492,1.493,1.99,2.842,3.838,4.495,4.698,4.218,3.272,2.189,1.239,1.406,2.236,3.961,4.99,4.936,3.759,2.344,1.573,1.252,1.363,1.876,2.857,3.672,4.193,4.397,3.977,3.017,1.577,1.052,1.607,2.805,4.667,5.415,5.182,3.498,2.213,1.502,1.144,1.254,1.78,2.886]}};

const $ = id => document.getElementById(id);
const svgNS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}, parent) => { const n = document.createElementNS(svgNS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; };
const txt = (parent, x, y, s, attrs = {}) => { const t = el('text', Object.assign({ x, y }, attrs), parent); t.textContent = s; return t; };
const COL = { A: '#eb6834', B: '#2a78d6', path: '#7a3fb0' };

// DTW: the cheapest in-order pairing of the samples of a and b; its total cost is the DTW distance
function dtw(a, b) {
  const n = a.length, m = b.length, D = Array.from({ length: n }, () => new Array(m).fill(Infinity));
  for (let i = 0; i < n; i++) for (let j = 0; j < m; j++) {
    const c = Math.abs(a[i] - b[j]);
    D[i][j] = c + (i || j ? Math.min(i ? D[i - 1][j] : Infinity, j ? D[i][j - 1] : Infinity, i && j ? D[i - 1][j - 1] : Infinity) : 0);
  }
  const path = []; let i = n - 1, j = m - 1;
  while (i > 0 || j > 0) { path.push([i, j]); const o = [i && j ? [D[i - 1][j - 1], i - 1, j - 1] : null, i ? [D[i - 1][j], i - 1, j] : null, j ? [D[i][j - 1], i, j - 1] : null].filter(Boolean); const b2 = o.reduce((p, q) => q[0] < p[0] ? q : p); i = b2[1]; j = b2[2]; }
  path.push([0, 0]); path.reverse();
  return { dist: D[n - 1][m - 1], path };
}
// sample by sample: sample i against sample i, as far as the shorter one goes
const sameIdx = (a, b) => { const n = Math.min(a.length, b.length), path = []; let d = 0; for (let i = 0; i < n; i++) { path.push([i, i]); d += Math.abs(a[i] - b[i]); } return { dist: d, path }; };

// two signals, one above the other, with lines between the samples that are paired
function pairPlot(svg, A, B, names, pairing, box, o = {}) {
  const { x0, x1, y0, y1 } = box, gap = 70, h = (y1 - y0 - gap) / 2, n = Math.max(A.length, B.length) - 1;
  const lo = Math.min(...A, ...B), hi = Math.max(...A, ...B), pad = (hi - lo) * 0.08 || 1;
  const xs = i => x0 + i / n * (x1 - x0), ysA = v => y0 + h - (v - lo + pad) / (hi - lo + 2 * pad) * h, ysB = v => y0 + h + gap + h - (v - lo + pad) / (hi - lo + 2 * pad) * h;
  const axis = el('g', { class: 'axis' }, svg);
  el('path', { d: `M${x0},${y0}V${y0 + h}H${x1}` }, axis); el('path', { d: `M${x0},${y0 + h + gap}V${y1}H${x1}` }, axis);
  if (o.seconds) for (let s = 0; s <= n / o.fs + 1e-9; s++) { txt(axis, xs(s * o.fs), y0 + h + 24, s, { 'text-anchor': 'middle', style: 'font-size:18px' }); txt(axis, xs(s * o.fs), y1 + 24, s === Math.floor(n / o.fs) ? s + ' s' : s, { 'text-anchor': 'middle', style: 'font-size:18px' }); }
  const every = o.every || 1;
  pairing.forEach(([i, j], k) => { if (k % every) return; el('line', { x1: xs(i), y1: ysA(A[i]), x2: xs(j), y2: ysB(B[j]), stroke: o.lineCol || COL.path, 'stroke-width': o.lw || 1.6, 'stroke-opacity': .6 }, svg); });
  el('path', { d: A.map((v, i) => (i ? 'L' : 'M') + xs(i).toFixed(1) + ',' + ysA(v).toFixed(1)).join(''), fill: 'none', stroke: COL.A, 'stroke-width': 3.5 }, svg);
  el('path', { d: B.map((v, i) => (i ? 'L' : 'M') + xs(i).toFixed(1) + ',' + ysB(v).toFixed(1)).join(''), fill: 'none', stroke: COL.B, 'stroke-width': 3.5 }, svg);
  if (o.dots) { A.forEach((v, i) => el('circle', { cx: xs(i), cy: ysA(v), r: 8, fill: COL.A }, svg)); B.forEach((v, i) => el('rect', { x: xs(i) - 8, y: ysB(v) - 8, width: 16, height: 16, fill: COL.B }, svg)); }
  const lab = (s, y, c) => txt(svg, x0 + 6, y, s, { style: `font-size:24px;font-weight:700;fill:${c};stroke:#fff;stroke-width:7px;paint-order:stroke` });
  lab(names[0], y0 + 6, COL.A); lab(names[1], y0 + h + gap + 6, COL.B);
}
// the warping path on the grid of (sample of A, sample of B); the dotted line is equal speed
function pathGrid(svg, nA, nB, path, box, o = {}) {
  const { x0, y0, s } = box, cw = s / Math.max(nA, nB), W = nB * cw, H = nA * cw, X = j => x0 + (j + 0.5) * cw, Y = i => y0 + H - (i + 0.5) * cw;
  el('rect', { x: x0, y: y0, width: W, height: H, fill: '#f6f7f9', stroke: 'var(--ink-3)' }, svg);
  if (o.cells) for (let i = 0; i < nA; i++) for (let j = 0; j < nB; j++) el('rect', { x: x0 + j * cw, y: y0 + H - (i + 1) * cw, width: cw, height: cw, fill: 'none', stroke: '#dde1e7' }, svg);
  el('line', { x1: X(0), y1: Y(0), x2: X(nB - 1), y2: Y(nA - 1), stroke: 'var(--ink-3)', 'stroke-width': 2, 'stroke-dasharray': '4 6' }, svg);
  el('path', { d: path.map(([i, j], k) => (k ? 'L' : 'M') + X(j).toFixed(1) + ',' + Y(i).toFixed(1)).join(''), fill: 'none', stroke: COL.path, 'stroke-width': o.cells ? 4 : 3 }, svg);
  if (o.cells) path.forEach(([i, j]) => el('circle', { cx: X(j), cy: Y(i), r: 7, fill: COL.path }, svg));
  txt(svg, x0 + W / 2, y0 + H + 34, o.bName, { 'text-anchor': 'middle', style: `font-size:20px;fill:${COL.B}` });
  txt(svg, x0 - 14, y0 + H / 2, o.aName, { 'text-anchor': 'middle', transform: `rotate(-90 ${x0 - 14} ${y0 + H / 2})`, style: `font-size:20px;fill:${COL.A}` });
}
function score(svg, x, y, label, v, col, d = 0) {
  txt(svg, x, y, label, { style: 'font-size:22px;fill:var(--ink-2)' });
  txt(svg, x, y + 54, v.toFixed(d), { style: `font-family:var(--mono);font-size:52px;font-weight:700;fill:${col}` });
}

// ------------------------------------------------------------ steps
const toyA = [0, 2, 4, 2, 0], toyB = [0, 2, 4, 4, 4, 2, 0];
let step = 0, mode = 'dtw';
const STEPS = [
  { title: 'How does DTW match a sharp pulse to a flat-topped one?', modes: false,
    draw() {
      const svg = $('fig'), R = dtw(toyA, toyB);
      pairPlot(svg, toyA, toyB, ['A: sharp pulse', 'B: flat-topped pulse'], R.path, { x0: 80, x1: 900, y0: 70, y1: 640 }, { dots: true, lw: 2.5 });
      pathGrid(svg, toyA.length, toyB.length, R.path, { x0: 1080, y0: 80, s: 420 }, { cells: true, aName: 'sample of A', bName: 'sample of B' });
      score(svg, 1080, 640, 'DTW distance', R.dist, COL.path);
    } },
  { title: 'Can DTW line up two people rowing at different speeds?', modes: true,
    draw() {
      const svg = $('fig'), A = DATA.rowA, B = DATA.rowB, R = mode === 'dtw' ? dtw(A, B) : sameIdx(A, B);
      pairPlot(svg, A, B, ['rower 1: three strokes, fast', 'rower 2: three strokes, slow'], R.path, { x0: 80, x1: 1060, y0: 70, y1: 640 }, { seconds: true, fs: DATA.fs, every: 2, lineCol: mode === 'dtw' ? COL.path : '#666' });
      pathGrid(svg, A.length, B.length, R.path, { x0: 1180, y0: 80, s: 360 }, { aName: 'rower 1', bName: 'rower 2' });
      score(svg, 1180, 560, mode === 'dtw' ? 'DTW distance' : 'sample-by-sample distance', R.dist, mode === 'dtw' ? COL.path : 'var(--ink)');
      txt(svg, 1180, 660, 'gyro magnitude, right wrist', { style: 'font-size:18px;fill:var(--ink-2)' });
    } },
  { title: 'What does the DTW distance tell us?', modes: false,
    draw() {
      // a new recording compared with a template of each activity; the DTW distance to each template is one feature
      const svg = $('fig'), Q = DATA.rowB, T = Object.assign({ rowing: DATA.rowA }, DATA.templates);
      const rows = Object.entries(T).map(([n, v]) => ({ n, v, d: dtw(Q, v).dist })).sort((p, q) => p.d - q.d), dmax = Math.max(...rows.map(r => r.d));
      const mini = (v, x0, x1, y0, y1, col) => { const lo = Math.min(...v), hi = Math.max(...v); el('path', { d: v.map((u, i) => (i ? 'L' : 'M') + (x0 + i / (v.length - 1) * (x1 - x0)).toFixed(1) + ',' + (y1 - (u - lo) / (hi - lo || 1) * (y1 - y0)).toFixed(1)).join(''), fill: 'none', stroke: col, 'stroke-width': 2.6 }, svg); };
      txt(svg, 80, 60, 'a new recording', { style: 'font-size:24px;font-weight:700;fill:' + COL.B });
      el('rect', { x: 70, y: 80, width: 420, height: 200, fill: '#f6f7f9', rx: 6 }, svg); mini(Q, 90, 470, 100, 260, COL.B);
      txt(svg, 80, 330, 'Which activity is it?', { style: 'font-size:22px;fill:var(--ink-2)' });
      txt(svg, 600, 60, 'template', { style: 'font-size:22px;font-weight:700;fill:var(--ink-2)' });
      txt(svg, 1080, 60, 'DTW distance to the new recording', { style: 'font-size:22px;font-weight:700;fill:var(--ink-2)' });
      rows.forEach((r, k) => {
        const y = 90 + k * 128, best = k === 0;
        el('rect', { x: 590, y, width: 460, height: 104, fill: best ? '#efe7f8' : '#f6f7f9', rx: 6, stroke: best ? COL.path : 'none', 'stroke-width': 3 }, svg);
        mini(r.v, 610, 1030, y + 34, y + 96, best ? COL.path : 'var(--ink-3)');
        txt(svg, 606, y + 26, r.n, { style: `font-size:21px;font-weight:700;fill:${best ? COL.path : 'var(--ink)'}` });
        el('rect', { x: 1080, y: y + 30, width: Math.max(4, r.d / dmax * 380), height: 44, rx: 4, fill: best ? COL.path : '#b9c3d0' }, svg);
        txt(svg, 1080 + Math.max(4, r.d / dmax * 380) + 12, y + 62, r.d.toFixed(1), { style: `font-family:var(--mono);font-size:24px;font-weight:700;fill:${best ? COL.path : 'var(--ink)'}` });
      });
      txt(svg, 80, 400, 'smallest distance:', { style: 'font-size:22px;fill:var(--ink-2)' });
      txt(svg, 80, 446, rows[0].n, { style: `font-size:40px;font-weight:700;fill:${COL.path}` });
    } },
];
function draw() {
  const S = STEPS[step];
  $('title').textContent = S.title; $('stepno').textContent = `step ${step + 1} of ${STEPS.length}`;
  $('match').classList.toggle('hide', !S.modes);
  [...$('match').children].forEach(b => b.classList.toggle('on', b.dataset.m === mode));
  $('fig').innerHTML = ''; S.draw();
}
function go(s) { step = Math.max(0, Math.min(STEPS.length - 1, s)); if (STEPS[step].modes) mode = 'same'; draw(); history.replaceState(null, '', '#' + (step + 1)); }
$('prev').onclick = () => go(step - 1); $('next').onclick = () => go(step + 1);
[...$('match').children].forEach(b => b.onclick = () => { mode = b.dataset.m; draw(); });
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') go(step + 1); else if (e.key === 'ArrowLeft') go(step - 1); else if (e.key === ' ' && STEPS[step].modes) { e.preventDefault(); mode = mode === 'dtw' ? 'same' : 'dtw'; draw(); } });
go((parseInt(location.hash.slice(1), 10) || 1) - 1);
})();
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frequency-Domain Features</title>
</head>
<body>
<style>
  :root {
    color-scheme: light;
    --paper: #ffffff;
    --ink: #222222;
    --ink-2: #666666;
    --ink-3: #9a9a9a;
    --rule: #dcdcdc;
    --grid: #ececec;
    --raw: #b4b4b4;
    --clean: #444444;
    --window: rgba(34, 34, 34, 0.06);
    --window-edge: #222222;
    --ma: #2a78d6;
    --sans: "Helvetica Neue", Helvetica, -apple-system, Arial, sans-serif;
    --mono: Menlo, "SF Mono", Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.4; padding-block: 18px 28px; padding-inline: 16px; -webkit-font-smoothing: antialiased; }
  .stage { max-width: 1200px; margin: 0 auto; display: grid; gap: 14px; }
  .slide { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 26px 34px 16px; display: grid; grid-template-rows: auto 1fr auto; gap: 10px; min-height: 560px; position: relative; outline: none; cursor: pointer; user-select: none; }
  .slide:focus-visible { box-shadow: 0 0 0 3px rgba(42,120,214,.35); }
  .head h1 { margin: 0; font-size: clamp(22px, 2.6vw, 30px); font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; line-height: 1.15; }
  .head h1 .tag { display: inline-block; font-family: var(--mono); font-weight: 400; font-size: 0.6em; color: var(--ink-2); margin-left: 10px; vertical-align: middle; background: #f4f4f4; padding: 2px 8px; border-radius: 4px; }
  .head p { margin: 6px 0 0; color: #444; font-size: clamp(15px, 1.6vw, 18px); max-width: none; }
  .chart-wrap { position: relative; min-height: 0; }
  svg.chart { display: block; width: 100%; height: auto; overflow: visible; }
  .tt { position: absolute; pointer-events: none; display: none; background: #fff; border: 1px solid var(--rule); border-radius: 4px; padding: 6px 9px; font-family: var(--mono); font-size: 12px; color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,.08); white-space: nowrap; z-index: 2; }
  .tt .row { display: flex; gap: 10px; justify-content: space-between; }
  .foot { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--ink-3); padding-top: 4px; }
  .foot .ctr { font-family: var(--mono); }
  .bar { display:flex; flex-wrap:wrap; gap:12px 24px; align-items:center; padding:14px 18px; border:1px solid var(--rule); border-radius:6px; background:#f6f7f9; font-size:14px; color:var(--ink); }
  .group { display:flex; align-items:center; gap:8px; }
  .group label { font-size:13px; font-weight:700; color:var(--ink); }
  .val { font-family:var(--mono); font-size:14px; font-weight:700; color:var(--ma); min-width:5ch; }
  button, select { font:inherit; font-size:14px; color:var(--ink); background:#fff; border:1px solid #9a9a9a; border-radius:5px; padding:7px 13px; cursor:pointer; }
  button:hover, select:hover { border-color:var(--ink); }
  button.primary { background:var(--ma); color:#fff; border-color:var(--ma); min-width:88px; font-weight:700; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline:2px solid var(--ma); outline-offset:2px; }
  input[type=range] { accent-color:var(--ma); width:200px; height:30px; cursor:pointer; }
  .hint { margin-left:auto; color:var(--ink-2); font-size:12px; }
  .hint kbd { font-family:var(--mono); background:#fff; border:1px solid var(--rule); border-radius:3px; padding:0 5px; font-size:11px; }
  .grid line { stroke: var(--grid); stroke-width: 1; }
  .axis line, .axis path { stroke: var(--ink-2); stroke-width: 1; fill: none; }
  .axis text { font-family: var(--mono); font-size: 12px; fill: var(--ink-2); }
  .axis-title { font-family: var(--sans); font-size: 12px; fill: var(--ink-2); }
  .sig-line { fill: none; stroke: var(--clean); stroke-width: 1.1; stroke-linejoin: round; }
  .spec-line { fill: none; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
  .win-rect { fill: var(--window); stroke: var(--window-edge); stroke-width: 1; stroke-dasharray: 3 3; }
  .dlabel { font-family: var(--mono); font-size: 13px; font-weight: 700; }
  .big { font-family: var(--mono); font-size: 16px; font-weight: 700; }
  .plabel { font-family: var(--sans); font-size: 13px; fill: var(--ink-2); }
  .formula { font-family: var(--mono); font-size: 12px; fill: var(--ink-2); }
  .crosshair { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 2 2; }
  @media (max-width: 720px) { .slide { padding: 18px 16px 12px; min-height: 0; } .hint { display: none; } }
</style>

<div class="stage">
  <section class="slide" id="slide" tabindex="0" aria-live="polite">
    <div class="head">
      <h1 id="title"></h1>
      <p id="subtitle"></p>
    </div>
    <div class="chart-wrap">

      <button id="next" title="Next (→)">Next ›</button>

        <option value="6" selected>normal</option>

    </div>
    <span class="hint"><kbd>→</kbd> finish / next &nbsp; <kbd>←</kbd> back &nbsp; <kbd>space</kbd> play</span>

</div>

  const svgNS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs = {}, parent) => { const n = document.createElementNS(svgNS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; };
  const txt = (parent, x, y, s, attrs = {}) => { const t = el('text', Object.assign({ x, y }, attrs), parent); t.textContent = s; return t; };
  const fmt = (v, d = 2) => v.toFixed(d);

  // ------------------------------------------------------------ spectrum
  // |X(f)| = 2·|DFT(x − mean)| / N at f = k·FS/N, as compute_fft_mag in the chapter script.
  function spectrum(start) {
    const N = Math.round(wl * FS), s0 = Math.round(start * FS);
    let m = 0; for (let i = 0; i < N; i++) m += MAG[s0 + i]; m /= N;
    const bins = [];
    for (let k = 0; k <= N / 2; k++) {
      let re = 0, im = 0;
      for (let n = 0; n < N; n++) { const x = MAG[s0 + n] - m, a = -2 * Math.PI * k * n / N; re += x * Math.cos(a); im += x * Math.sin(a); }
      const f = k * FS / N; if (f > F_MAX + 1e-9) break;
      bins.push({ f, mag: 2 * Math.sqrt(re * re + im * im) / N });
    }
    let peak = null;
    bins.forEach(b => { if (b.f >= F_LO && b.f <= F_HI && (!peak || b.mag > peak.mag)) peak = b; });
    const dom = peak && peak.mag >= PEAK_MIN ? peak.f : 0;
    let energy = 0; bins.forEach(b => { if (b.f >= E_LO && b.f <= E_HI) energy += b.mag * b.mag; });
    return { bins, peak, dom, energy, start, N };
  }
  function sweepStarts() { const r = []; for (let s = 0; s + wl <= TOTAL_S + 1e-9; s += STEP_S) r.push(s); return r; }

  // ------------------------------------------------------------ state
  const $ = id => document.getElementById(id);
  const chart = $('chart'), tt = $('tt');
  let wl = 5, start = 8, speed = 6;
  const dirty = { win: false, start: false };
  let step = 0, cursor = -1, playing = false, raf = 0, lastT = 0, acc = 0;
  let spec = null, sweep = [], total = 0;
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function prepare() {
    const d = STEPS[step];
    // y-scale of the spectrum panel: fixed per window length over the whole sweep so it never jumps
    const starts = sweepStarts();
    sweep = d.mode === 'track' ? starts.map(s => spectrum(s)) : [];
    let mx = 0; (d.mode === 'track' ? sweep : starts.map(s => spectrum(s))).forEach(sp => sp.bins.forEach(b => { if (b.mag > mx) mx = b.mag; }));
    sMax = Math.max(2, Math.ceil(mx * 1.1));
    if (d.mode === 'one') { spec = spectrum(start); total = spec.bins.length; }
    else total = sweep.length;
  }

  // ------------------------------------------------------------ drawing
  let G = {};
  function drawStatic() {
    chart.innerHTML = '';
    G.base = el('g', {}, chart);
    G.dyn = el('g', {}, chart);
    G.legend = el('g', {}, chart);
    G.hover = el('g', {}, chart);
    const g = G.base;
    // --- trace panel
    SEGS.forEach((s, k) => {
      el('rect', { x: xT(k * SEG_S), y: TT, width: xT(SEG_S) - xT(0), height: TB - TT, fill: s.c, opacity: 0.09 }, g);
      txt(g, xT(k * SEG_S + SEG_S / 2), TT + 15, s.n, { class: 'plabel', 'text-anchor': 'middle', fill: s.c, 'font-weight': 700 });
    });
    let grid = el('g', { class: 'grid' }, g), axis = el('g', { class: 'axis' }, g);
    for (let v = 0; v <= 35; v += 10) { el('line', { x1: PL, x2: W - PR, y1: yM(v), y2: yM(v) }, grid); txt(axis, PL - 8, yM(v) + 4, v, { 'text-anchor': 'end' }); }
    for (let t = 0; t <= TOTAL_S; t += 4) { el('line', { x1: xT(t), x2: xT(t), y1: TT, y2: TB }, grid); }
    el('path', { d: `M${PL},${TT}V${TB}H${W - PR}` }, axis);
    txt(g, PL - 30, TT - 10, '‖a‖ (m/s²)', { class: 'axis-title' });
    let p = ''; for (let i = 0; i < MAG.length; i++) p += (i ? 'L' : 'M') + xT(i / FS).toFixed(1) + ',' + yM(MAG[i]).toFixed(1);
    el('path', { class: 'sig-line', d: p }, g);
    // --- dominant frequency panel (shares the time axis)
    grid = el('g', { class: 'grid' }, g); axis = el('g', { class: 'axis' }, g);
    for (let f = 0; f <= 4; f += 1) { el('line', { x1: PL, x2: W - PR, y1: yD(f), y2: yD(f) }, grid); txt(axis, PL - 8, yD(f) + 4, f, { 'text-anchor': 'end' }); }
    for (let t = 0; t <= TOTAL_S; t += 4) { el('line', { x1: xT(t), x2: xT(t), y1: DT, y2: DB }, grid); txt(axis, xT(t), DB + 16, t, { 'text-anchor': 'middle' }); }
    el('path', { d: `M${PL},${DT}V${DB}H${W - PR}` }, axis);
    txt(g, PL - 30, DT - 10, 'dominant frequency (Hz)', { class: 'axis-title' });
    txt(g, W - PR, DB + 32, 'time (s)', { class: 'axis-title', 'text-anchor': 'end' });
    // --- spectrum panel
    grid = el('g', { class: 'grid' }, g); axis = el('g', { class: 'axis' }, g);
    el('rect', { x: xF(E_LO), y: ST, width: xF(E_HI) - xF(E_LO), height: SB - ST, fill: '#2a78d6', opacity: .07 }, g);
    const st = sMax > 12 ? 5 : sMax > 6 ? 2 : 1;
    for (let v = 0; v <= sMax; v += st) { el('line', { x1: PL, x2: W - PR, y1: yS(v), y2: yS(v) }, grid); txt(axis, PL - 8, yS(v) + 4, v, { 'text-anchor': 'end' }); }
    for (let f = 0; f <= F_MAX; f += 1) { el('line', { x1: xF(f), x2: xF(f), y1: ST, y2: SB }, grid); txt(axis, xF(f), SB + 16, f, { 'text-anchor': 'middle' }); }
    el('path', { d: `M${PL},${ST}V${SB}H${W - PR}` }, axis);
    txt(g, PL - 30, ST - 10, '|X(f)| of the window', { class: 'axis-title' });
    txt(g, W - PR, SB + 32, 'frequency (Hz)', { class: 'axis-title', 'text-anchor': 'end' });
    el('line', { x1: PL, x2: W - PR, y1: yS(PEAK_MIN), y2: yS(PEAK_MIN), stroke: 'var(--ink-3)', 'stroke-dasharray': '4 3' }, g);
    txt(g, xF(F_MAX) - 6, yS(PEAK_MIN) - 5, `peak threshold ${PEAK_MIN}`, { class: 'formula', 'text-anchor': 'end' });
    txt(g, xF(E_LO) + 6, ST + 36, `energy band ${E_LO}–${E_HI} Hz`, { class: 'formula' });
    txt(g, PL + 10, ST + 18, `dominant f = argmax |X(f)| over ${F_LO}–${F_HI} Hz (DC excluded)   ·   energy = Σ |X(f)|² over ${E_LO}–${E_HI} Hz   ·   Δf = 1/w = ${fmt(1 / wl, 2)} Hz`, { class: 'formula' });
  }
  function segAt(t) { return SEGS[Math.min(2, Math.floor(t / SEG_S))]; }
  function drawLegend() {
    G.legend.innerHTML = '';
    legendRow(G.legend, W - PR, TT - 26, [{ c: 'var(--clean)', n: '‖a‖ (50 Hz)', line: true }, { c: 'var(--ink)', n: 'window', dash: true }]);
    legendRow(G.legend, W - PR, DT - 26, [{ c: 'var(--ma)', n: 'dominant frequency per window', dot: true }]);
    legendRow(G.legend, W - PR, ST - 26, [{ c: 'var(--ink)', n: '|X(f)| at each bin', line: true }, { c: 'var(--ink)', n: 'dominant peak', ring: true }, { c: '#2a78d6', n: 'energy band', band: true }]);
  }
  function legendRow(parent, xr, y, items) {
    const padX = 10, gap = 16, h = 24;
    const widths = items.map(it => 26 + it.n.length * 7.2);
    const wdt = widths.reduce((a, b) => a + b, 0) + gap * (items.length - 1) + 2 * padX;
    const x = xr - wdt;
    el('rect', { x, y, width: wdt, height: h, rx: 4, fill: '#fff', 'fill-opacity': .9, stroke: 'var(--rule)' }, parent);
    let cx = x + padX; const yy = y + h / 2;
    items.forEach((it, j) => {
      if (it.dot) el('circle', { cx: cx + 9, cy: yy, r: 4, fill: it.c }, parent);
      else if (it.ring) el('circle', { cx: cx + 9, cy: yy, r: 5, fill: 'none', stroke: it.c, 'stroke-width': 2 }, parent);
      else if (it.band) el('rect', { x: cx, y: yy - 6, width: 18, height: 12, fill: it.c, opacity: .15 }, parent);
      else el('line', { x1: cx, x2: cx + 18, y1: yy, y2: yy, stroke: it.c, 'stroke-width': it.dash ? 1.2 : 2.2, 'stroke-dasharray': it.dash ? '3 3' : 'none' }, parent);
      txt(parent, cx + 26, yy + 4, it.n, { class: 'axis-title', fill: 'var(--ink)' });
      cx += widths[j] + gap;
    });
  }

  function drawWindow(sp, color) {
    const x0 = xT(sp.start), x1 = xT(sp.start + wl);
    el('rect', { class: 'win-rect', x: x0, y: TT + 2, width: x1 - x0, height: TB - TT - 4, rx: 2 }, G.dyn);
    const right = (x0 + x1) / 2 > W - 300;
    txt(G.dyn, right ? x0 - 8 : x1 + 8, TB - 12, `window ${fmt(sp.start, 1)}–${fmt(sp.start + wl, 1)} s · N = ${sp.N}`, { class: 'dlabel', fill: color, 'text-anchor': right ? 'end' : 'start' });
  }
  function drawSpectrum(sp, upto, color, showResult) {
    const b = sp.bins;
    let p = ''; for (let k = 0; k <= upto; k++) p += (k ? 'L' : 'M') + xF(b[k].f).toFixed(1) + ',' + yS(b[k].mag).toFixed(1);
    if (upto >= 0) el('path', { class: 'spec-line', d: p, stroke: color }, G.dyn);
    for (let k = 0; k <= upto; k++) el('circle', { cx: xF(b[k].f), cy: yS(b[k].mag), r: 3, fill: color, stroke: '#fff', 'stroke-width': 1 }, G.dyn);
    if (upto >= 0 && upto < b.length - 1) {
      el('circle', { cx: xF(b[upto].f), cy: yS(b[upto].mag), r: 6, fill: 'none', stroke: color, 'stroke-width': 1.5 }, G.dyn);
      txt(G.dyn, xF(b[upto].f) + 10, yS(b[upto].mag) - 10, `f = ${fmt(b[upto].f)} Hz · |X| = ${fmt(b[upto].mag)}`, { class: 'dlabel', fill: color });
    }
    if (!showResult) return;
    if (sp.dom > 0) {
      el('circle', { cx: xF(sp.peak.f), cy: yS(sp.peak.mag), r: 9, fill: 'none', stroke: 'var(--ink)', 'stroke-width': 2 }, G.dyn);
      txt(G.dyn, xF(sp.peak.f) + 14, yS(sp.peak.mag) + 5, `dominant ${fmt(sp.peak.f)} Hz`, { class: 'dlabel', fill: 'var(--ink)' });
    }
    const rx = W - PR - 10, ry = ST + 48;
    txt(G.dyn, rx, ry, sp.dom > 0 ? `dominant frequency = ${fmt(sp.dom)} Hz` : `dominant frequency: none (peak < ${PEAK_MIN}) → 0 Hz`, { class: 'big', fill: color, 'text-anchor': 'end' });
    txt(G.dyn, rx, ry + 22, `energy ${E_LO}–${E_HI} Hz = ${fmt(sp.energy, 1)}`, { class: 'big', fill: color, 'text-anchor': 'end' });
  }
  function drawDomPoint(sp, color) {
    const tc = sp.start + wl / 2;
    el('line', { x1: xT(tc), x2: xT(tc), y1: DT, y2: yD(sp.dom), stroke: color, 'stroke-dasharray': '2 3', opacity: .6 }, G.dyn);
    el('circle', { cx: xT(tc), cy: yD(sp.dom), r: 5.5, fill: 'var(--ma)', stroke: '#fff', 'stroke-width': 1.5 }, G.dyn);
    txt(G.dyn, xT(tc) + 10, yD(sp.dom) - 10, `${fmt(sp.dom)} Hz`, { class: 'dlabel', fill: 'var(--ma)' });
  }

  function render() {
    G.dyn.innerHTML = '';
    const d = STEPS[step];
    if (d.mode === 'one') {
      const color = segAt(start + wl / 2).c;
      drawWindow(spec, color);
      const done = cursor >= total - 1;
      drawSpectrum(spec, cursor, color, done);
      if (done) drawDomPoint(spec, color);
    } else {
      if (cursor < 0) return;
      const sp = sweep[cursor], color = segAt(sp.start + wl / 2).c;
      drawWindow(sp, color);
      drawSpectrum(sp, sp.bins.length - 1, color, true);
      let p = ''; for (let k = 0; k <= cursor; k++) p += (k ? 'L' : 'M') + xT(sweep[k].start + wl / 2).toFixed(1) + ',' + yD(sweep[k].dom).toFixed(1);
      el('path', { d: p, fill: 'none', stroke: 'var(--ma)', 'stroke-width': 1.6 }, G.dyn);
      for (let k = 0; k < cursor; k++) el('circle', { cx: xT(sweep[k].start + wl / 2), cy: yD(sweep[k].dom), r: 3.5, fill: 'var(--ma)' }, G.dyn);
      drawDomPoint(sp, color);
      // the start dial follows the sweep (not marked dirty)
      $('start').value = sp.start; $('startVal').textContent = fmt(sp.start, 1) + ' s';
    }
  }

  // ------------------------------------------------------------ hover
  function hover(evt) {
    const pt = chart.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY;
    const p = pt.matrixTransform(chart.getScreenCTM().inverse());
    G.hover.innerHTML = '';
    let html = '';
    if (p.y >= TT && p.y <= TB) {
      const i = Math.max(0, Math.min(MAG.length - 1, Math.round((p.x - PL) / (W - PL - PR) * MAG.length)));
      el('line', { class: 'crosshair', x1: xT(i / FS), x2: xT(i / FS), y1: TT, y2: TB }, G.hover);
      el('circle', { cx: xT(i / FS), cy: yM(MAG[i]), r: 4, fill: 'var(--ink-2)', stroke: '#fff', 'stroke-width': 1.5 }, G.hover);
      html = `<div class="row"><span>t</span><b>${fmt(i / FS)} s</b></div><div class="row"><span>${segAt(i / FS).n}</span></div><div class="row"><span>‖a‖</span><span>${fmt(MAG[i])}</span></div>`;
    } else if (p.y >= ST && p.y <= SB) {
      const sp = STEPS[step].mode === 'one' ? spec : sweep[Math.max(0, cursor)];
      if (!sp) { unhover(); return; }
      const f = (p.x - PL) / (W - PL - PR) * F_MAX;
      let best = 0; sp.bins.forEach((b, k) => { if (Math.abs(b.f - f) < Math.abs(sp.bins[best].f - f)) best = k; });
      const b = sp.bins[best];
      el('line', { class: 'crosshair', x1: xF(b.f), x2: xF(b.f), y1: ST, y2: SB }, G.hover);
      html = `<div class="row"><span>f</span><b>${fmt(b.f)} Hz</b></div><div class="row"><span>|X(f)|</span><span>${fmt(b.mag)}</span></div>`;
    } else { unhover(); return; }
    tt.innerHTML = html; tt.style.display = 'block';
    const wrap = chart.parentElement.getBoundingClientRect();
    const px = evt.clientX - wrap.left, py = evt.clientY - wrap.top;
    tt.style.left = (px + 16 + tt.offsetWidth > wrap.width ? px - tt.offsetWidth - 12 : px + 16) + 'px';
    tt.style.top = Math.max(0, py - 10) + 'px';
  }
  function unhover() { tt.style.display = 'none'; G.hover.innerHTML = ''; }

  // ------------------------------------------------------------ step control
  function clampStart() { start = Math.min(start, TOTAL_S - wl); $('start').max = TOTAL_S - wl; $('start').value = start; $('startVal').textContent = fmt(start, 1) + ' s'; }
  function applyPresets() {
    const p = STEPS[step].preset;
    if (!dirty.win) { wl = p.win; $('win').value = wl; $('winVal').textContent = wl + ' s'; }
    if (!dirty.start) start = p.start;
    clampStart();
  }
  function tag() { return `w = ${wl} s (N = ${wl * FS}) · Δf = ${fmt(1 / wl, 2)} Hz` + (STEPS[step].mode === 'track' ? ` · step = ${STEP_S} s` : ''); }
  function enterStep(k, completed = false) {
    step = k;
    applyPresets();
    const d = STEPS[step];
    prepare();
    drawStatic();
    $('title').innerHTML = d.title + `<span class="tag">${tag()}</span>`;
    $('subtitle').textContent = d.subtitle;
    $('counter').textContent = `${step + 1} / ${STEPS.length}`;
    try { history.replaceState(null, '', '#' + (step + 1)); } catch (_) {}
    stopPlay();
    cursor = -1;
    drawLegend();
    if (completed || speed === 0 || reduceMotion) finish();
    else { render(); startPlay(); }
  }
  function redraw(seekTo) {
    const frac = total ? Math.max(0, cursor) / total : 0;
    const wasDone = cursorDone();
    prepare(); drawStatic(); drawLegend();
    $('title').innerHTML = STEPS[step].title + `<span class="tag">${tag()}</span>`;
    if (seekTo !== undefined) cursor = seekTo;
    else cursor = wasDone ? total - 1 : Math.min(total - 1, Math.round(frac * total));
    render();
  }
  function cursorDone() { return cursor >= total - 1; }
  function finish() { cursor = total - 1; stopPlay(); render(); }
  function rate() { return speed * (STEPS[step].mode === 'one' ? 2.5 : 1); }
  function tick(t) {
    if (!playing) return;
    const dt = Math.min(0.1, (t - lastT) / 1000); lastT = t;
    acc += dt * rate();
    while (acc >= 1 && cursor < total - 1) { cursor++; acc -= 1; }
    render();
    if (cursor >= total - 1) { finish(); return; }
    raf = requestAnimationFrame(tick);
  }
  function startPlay() {
    if (cursorDone()) return;
    playing = true; lastT = performance.now(); acc = 0;
    $('play').textContent = 'Pause';
    raf = requestAnimationFrame(tick);
  }
  function stopPlay() { playing = false; cancelAnimationFrame(raf); $('play').textContent = 'Play'; }
  function next() { if (!cursorDone()) { finish(); return; } if (step < STEPS.length - 1) enterStep(step + 1); }
  function prev() { if (step > 0) enterStep(step - 1, true); }
  function restart() { enterStep(step); }

  // ------------------------------------------------------------ wiring
  $('next').addEventListener('click', e => { e.stopPropagation(); next(); });
  $('prev').addEventListener('click', e => { e.stopPropagation(); prev(); });
  $('restart').addEventListener('click', e => { e.stopPropagation(); restart(); });
  $('play').addEventListener('click', e => { e.stopPropagation(); if (playing) stopPlay(); else if (cursorDone()) restart(); else startPlay(); });
  $('slide').addEventListener('click', () => next());
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
    else if (e.key === ' ') { e.preventDefault(); $('play').click(); }
    else if (e.key === 'r' || e.key === 'R') restart();
  });
  $('win').addEventListener('input', e => { dirty.win = true; wl = parseInt(e.target.value, 10); $('winVal').textContent = wl + ' s'; clampStart(); redraw(); });
  $('start').addEventListener('input', e => {
    const v = parseFloat(e.target.value);
    if (STEPS[step].mode === 'track') { stopPlay(); redraw(Math.min(total - 1, Math.round(v / STEP_S))); return; }
    dirty.start = true; start = v; $('startVal').textContent = fmt(start, 1) + ' s';
    redraw(total - 1);
  });
  $('speed').addEventListener('change', e => { speed = parseFloat(e.target.value); });
  $('reset').addEventListener('click', e => { e.stopPropagation(); dirty.win = false; dirty.start = false; enterStep(step); });
  chart.addEventListener('mousemove', hover);
  chart.addEventListener('mouseleave', unhover);

  const h = parseInt((location.hash || '').replace('#', ''), 10);
  enterStep(h >= 1 && h <= STEPS.length ? h - 1 : 0);
})();
</script>
</body>
</html>

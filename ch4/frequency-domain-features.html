<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frequency-Domain Features</title>
</head>
<body>
<style>
  :root {
    color-scheme: light;
    --paper: #ffffff; --ink: #222222; --ink-2: #666666; --ink-3: #9a9a9a; --rule: #dcdcdc; --grid: #ececec; --ma: #2a78d6;
    --sans: "Helvetica Neue", Helvetica, -apple-system, Arial, sans-serif;
    --mono: Menlo, "SF Mono", Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  .grid line { stroke: var(--grid); stroke-width: 1.3; }
  .axis line, .axis path { stroke: var(--ink-2); stroke-width: 1.3; fill: none; }
  .axis text { font-family: var(--mono); fill: var(--ink-2); }
  #app { height: 100vh; padding: 10px 14px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px; }
  .head { padding: 4px 16px 0; }
  h1 { margin: 0; font-size: clamp(24px, 2.4vw, 36px); font-weight: 700; letter-spacing: -0.01em; }
  .main { min-height: 0; border: 1px solid var(--rule); border-radius: 6px; padding: 10px 16px; }
  .main svg { width: 100%; height: 100%; display: block; touch-action: none; }
  .bar { display: flex; gap: 12px; align-items: center; padding: 10px 18px; border: 1px solid var(--rule); border-radius: 6px; background: #f6f7f9; }
  button { font: inherit; font-size: 18px; color: var(--ink); background: #fff; border: 1px solid #9a9a9a; border-radius: 6px; padding: 9px 16px; cursor: pointer; }
  button:hover { border-color: var(--ink); }
  button.primary { background: var(--ma); color: #fff; border-color: var(--ma); font-weight: 700; min-width: 120px; }
  .lbl { font-size: 18px; color: var(--ink-2); }
  input[type=range] { flex: 1; -webkit-appearance: none; appearance: none; height: 8px; border-radius: 4px; background: #d6dbe3; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%; background: var(--ma); border: 3px solid #fff; box-shadow: 0 0 0 1px var(--ma); cursor: pointer; }
  input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--ma); border: 3px solid #fff; cursor: pointer; }
</style>

<div id="app">
  <div class="head"><h1>What can the FFT of each window tell us?</h1></div>
  <div class="main"><svg id="fig" viewBox="0 0 1600 760"></svg></div>
  <div class="bar">
    <button id="prev" title="Previous window (←)">⏮</button>
    <button id="play" class="primary" title="Play or pause (space)">▶ Play</button>
    <button id="next" title="Next window (→)">⏭</button>
    <span class="lbl">window</span><input type="range" id="pos" min="0" value="0">
  </div>
</div>

  const P0 = 490, P1 = 720, PX0 = X0, PX1 = 1000, amax = Math.max(1, ...S.out.filter(p => p.f > 0).map(p => p.a)) * 1.15   /* scaled to this window, but never below 1 so sitting stays flat */, xf = f => PX0 + f / F_MAX * (PX1 - PX0), ya = a => P1 - a / amax * (P1 - P0);
  grid = el('g', { class: 'grid' }, svg); axis = el('g', { class: 'axis' }, svg);
  for (let f = 0; f <= F_MAX; f++) { el('line', { x1: xf(f), x2: xf(f), y1: P0, y2: P1 }, grid); txt(axis, xf(f), P1 + 28, f === F_MAX ? f + ' Hz' : f, { 'text-anchor': f === F_MAX ? 'end' : 'middle', style: 'font-size:20px' }); }
  el('path', { d: `M${PX0},${P0}V${P1}H${PX1}` }, axis);
  txt(svg, PX0 + 10, P0 - 14, 'FFT of this window', { style: 'font-size:22px;font-weight:700' });
  // the FFT magnitude at each frequency bin, drawn as a line through the bins, with the energy band shaded
  el('rect', { x: xf(E_LO), y: P0, width: xf(E_HI) - xf(E_LO), height: P1 - P0, fill: '#d63384', 'fill-opacity': .06 }, svg);
  txt(svg, xf(E_HI) - 8, P0 + 22, `${E_LO}–${E_HI} Hz band`, { 'text-anchor': 'end', style: 'font-size:18px;fill:#b0306e' });
  const sp = S.out.filter(p => p.f <= F_MAX);
  el('path', { d: sp.map((p, i) => (i ? 'L' : 'M') + xf(p.f).toFixed(1) + ',' + ya(p.a).toFixed(1)).join(''), fill: 'none', stroke: '#d63384', 'stroke-width': 3 }, svg);
  sp.forEach(p => el('circle', { cx: xf(p.f), cy: ya(p.a), r: 4.5, fill: '#d63384' }, svg));
  if (S.dom) {
    el('circle', { cx: xf(S.pk.f), cy: ya(S.pk.a), r: 14, fill: 'none', stroke: 'var(--ink)', 'stroke-width': 3 }, svg);
    txt(svg, xf(S.pk.f) + 22, ya(S.pk.a) + 2, `peak at ${S.pk.f.toFixed(1)} Hz`, { style: 'font-size:20px;font-weight:700' });
  }
  txt(svg, 22, (P0 + P1) / 2, '|FFT|', { transform: `rotate(-90 22 ${(P0 + P1) / 2})`, 'text-anchor': 'middle', style: 'font-size:20px;fill:var(--ink-2)' });
  // ---- the feature value
  // the frequency-domain features of this window, from the same FFT (power = magnitude squared, the 0 Hz bin left out)
  const bins = S.out.filter(p => p.f > 0), pw = bins.map(p => p.a * p.a), tot = pw.reduce((a, b) => a + b, 0) || 1e-9;
  const band = bins.reduce((a, p, i) => a + (p.f >= E_LO && p.f <= E_HI ? pw[i] : 0), 0);
  const cen = bins.reduce((a, p, i) => a + p.f * pw[i], 0) / tot, spr = Math.sqrt(bins.reduce((a, p, i) => a + (p.f - cen) ** 2 * pw[i], 0) / tot);
  const ent = -pw.reduce((a, v) => a + (v > 0 ? v / tot * Math.log2(v / tot) : 0), 0);
  const ROWS = [['dominant frequency', S.dom ? S.dom.toFixed(1) + ' Hz' : 'none'], ['peak magnitude', S.pk.a.toFixed(2)], [`energy ${E_LO}–${E_HI} Hz`, band.toFixed(1)], ['total energy', tot.toFixed(1)],
    [`share in ${E_LO}–${E_HI} Hz`, Math.round(100 * band / tot) + '%'], ['spectral centroid', cen.toFixed(2) + ' Hz'], ['spectral spread', spr.toFixed(2) + ' Hz'], ['spectral entropy', ent.toFixed(2) + ' bits']];
  ROWS.forEach(([n, v], i) => { const y = P0 + 2 + i * 31; txt(svg, 1080, y, n, { style: `font-size:21px;${i ? '' : 'font-weight:700'}` }); txt(svg, 1560, y, v, { 'text-anchor': 'end', style: `font-family:var(--mono);font-size:21px;font-weight:700;${i ? '' : 'fill:var(--ma)'}` }); });
  $('pos').max = starts.length - 1; $('pos').value = pos;
  $('play').textContent = timer ? '❚❚ Pause' : pos >= starts.length - 1 ? '↺ Again' : '▶ Play';
}
function stop() { clearInterval(timer); timer = null; }
function play() {
  if (timer) { stop(); draw(); return; }
  if (pos >= starts.length - 1) pos = 0;
  timer = setInterval(() => { if (pos >= starts.length - 1) { stop(); draw(); return; } pos++; draw(); }, 500);
  draw();
}
const go = p => { stop(); pos = Math.max(0, Math.min(starts.length - 1, p)); draw(); };
$('prev').onclick = () => go(pos - 1); $('next').onclick = () => go(pos + 1); $('play').onclick = play;
$('pos').oninput = e => go(+e.target.value);
let dragging = false;
const toPos = e => { const svg = $('fig'), p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; const q = p.matrixTransform(svg.getScreenCTM().inverse()); const t = (q.x - 110) / (1560 - 110) * LEN - WN / FS / 2; return Math.round(t * FS / HOP); };
$('fig').addEventListener('pointerdown', e => { if (!e.target.dataset.drag) return; dragging = true; $('fig').setPointerCapture(e.pointerId); });
$('fig').addEventListener('pointermove', e => { if (dragging) go(toPos(e)); });
$('fig').addEventListener('pointerup', () => { dragging = false; });
document.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; if (e.key === 'ArrowRight') go(pos + 1); else if (e.key === 'ArrowLeft') go(pos - 1); else if (e.key === ' ') { e.preventDefault(); play(); } });
draw();
})();
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time-Domain Features</title>
</head>
<body>
<style>
  :root {
    color-scheme: light;
    --paper: #ffffff;
    --ink: #222222;
    --ink-2: #666666;
    --ink-3: #9a9a9a;
    --rule: #dcdcdc;
    --grid: #ececec;
    --raw: #8f8f8f;
    --clean: #444444;
    --window: rgba(34, 34, 34, 0.06);
    --window-edge: #222222;
    --ma: #2a78d6;
    --sans: "Helvetica Neue", Helvetica, -apple-system, Arial, sans-serif;
    --mono: Menlo, "SF Mono", Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.4; padding-block: 10px 10px; padding-inline: 14px; -webkit-font-smoothing: antialiased; }
  .stage { max-width: 1880px; margin: 0 auto; display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 10px; height: calc(100vh - 20px); }
  .slide { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 16px 30px 8px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 6px; min-height: 0; position: relative; outline: none; cursor: pointer; user-select: none; }
  .slide:focus-visible { box-shadow: 0 0 0 3px rgba(42,120,214,.35); }
  .head h1 { margin: 0; font-size: clamp(24px, 2.4vw, 36px); font-weight: 700; letter-spacing: -0.01em; line-height: 1.15; }
  .head h1 .tag { display: inline-block; font-family: var(--mono); font-weight: 400; font-size: 0.6em; color: var(--ink-2); margin-left: 10px; vertical-align: middle; background: #f4f4f4; padding: 2px 8px; border-radius: 4px; white-space: nowrap; }
  .head p { margin: 6px 0 0; color: #444; font-size: clamp(18px, 1.7vw, 24px); max-width: none; }
  .head p:empty { display: none; }
  .head h1 .tag:empty { display: none; }
  .chart-wrap { position: relative; min-height: 0; height: 100%; display: flex; justify-content: center; align-items: center; }
  svg.chart { display: block; height: 100%; width: auto; max-width: 100%; max-height: 100%; overflow: visible; }
  .tt { position: absolute; pointer-events: none; display: none; background: #fff; border: 1px solid var(--rule); border-radius: 4px; padding: 6px 9px; font-family: var(--mono); font-size: 15px; color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,.08); white-space: nowrap; z-index: 2; }
  .tt .row { display: flex; gap: 10px; justify-content: space-between; }
  .tt .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .foot { position: absolute; top: 9px; right: 16px; display: flex; gap: 14px; align-items: baseline; font-size: 14px; color: var(--ink-3); padding: 0; pointer-events: none; }
  .foot .ctr { font-family: var(--mono); }
  .bar { display:flex; flex-direction:column; gap:12px; padding:12px 24px;
         border:1px solid var(--rule); border-radius:6px; background:#f6f7f9; font-size:19px; color:var(--ink); }
  .bar .row { display:flex; justify-content:flex-start; align-items:center; gap:16px 32px; flex-wrap:wrap; }
  .bar .row.dials .group { flex:1 1 0; }
  .bar .row.dials input[type=range] { flex:1 1 auto; width:auto; }
  .group { display:flex; align-items:center; gap:10px; }
  .group label { font-size:18px; font-weight:700; color:var(--ink); letter-spacing:0; text-transform:none; white-space:nowrap; }
  .val { font-family:var(--mono); font-size:19px; font-weight:700; color:var(--ma); min-width:5ch; white-space:nowrap; }
  button, select { font:inherit; font-size:18px; color:var(--ink); background:#fff; border:1px solid #9a9a9a; border-radius:6px; padding:9px 16px; cursor:pointer; }
  button:hover, select:hover { border-color:var(--ink); }
  button.primary { background:var(--ma); color:#fff; border-color:var(--ma); min-width:88px; font-weight:700; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline:2px solid var(--ma); outline-offset:2px; }
  input[type=range] { -webkit-appearance:none; appearance:none; accent-color:var(--ma); width:260px; height:36px; background:transparent; cursor:pointer; }
  input[type=range]::-webkit-slider-runnable-track { height:8px; border-radius:4px; background:#c9d1dc; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:26px; height:26px; border-radius:50%; background:var(--ma); border:3px solid #fff; box-shadow:0 0 0 1.5px var(--ma); margin-top:-9px; }
  input[type=range]::-moz-range-track { height:8px; border-radius:4px; background:#c9d1dc; }
  input[type=range]::-moz-range-thumb { width:26px; height:26px; border-radius:50%; background:var(--ma); border:3px solid #fff; }
  .hint { margin-left:auto; color:var(--ink-2); font-size:12px; }
  .hint kbd { font-family:var(--mono); background:#fff; border:1px solid var(--rule); border-radius:3px; padding:0 5px; font-size:11px; }
  .grid line { stroke: var(--grid); stroke-width: 1.3; }
  .axis line, .axis path { stroke: var(--ink-2); stroke-width: 1.3; fill: none; }
  .axis text { font-family: var(--mono); font-size: 20px; fill: var(--ink-2); }
  .axis-title { font-family: var(--sans); font-size: 22px; fill: var(--ink-2); }
  .sig-line { fill: none; stroke: var(--clean); stroke-width: 1.6; stroke-linejoin: round; }
  .win-rect { fill: var(--window); stroke: var(--window-edge); stroke-width: 1; stroke-dasharray: 3 3; }
  .dlabel { font-family: var(--mono); font-size: 17px; font-weight: 700; }
  .plabel { font-family: var(--sans); font-size: 20px; fill: var(--ink-2); }
  .formula { font-family: var(--mono); font-size: 20px; fill: var(--ink-2); }
  .crosshair { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 2 2; }
  @media (max-width: 720px) { .slide { padding: 18px 16px 12px; min-height: 0; } .hint { display: none; } }
  .hint { display:none !important; }
  button.tb { min-width:54px; padding:9px 12px; font-size:22px; line-height:1; }
  button.primary.tb { min-width:64px; }
</style>

<div class="stage">
  <section class="slide" id="slide" tabindex="0" aria-live="polite">
    <div class="head">
      <h1 id="title"></h1>
      <p id="subtitle"></p>
    </div>
    <div class="chart-wrap">
      <svg class="chart" id="chart" viewBox="0 0 1400 640" role="img" aria-label="Sliding window and per-window features"></svg>
      <div class="tt" id="tt"></div>
    </div>
    <div class="foot">

   <div class="row">
    <div class="group">
      <button id="prev" class="tb" title="Previous step (←)">⏮</button>
      <button id="play" class="primary tb" title="Play / pause (space)">▶</button>
      <button id="next" class="tb" title="Next step (→)">⏭</button>
      <button id="restart" class="tb" title="Restart this step (r)">↺</button>
      <button id="reset" title="Reset all dials to the step presets">Reset dials</button>
    </div>
    <div class="group">
      <label for="feat">Spread feature</label>
      <select id="feat">

      </select>
    </div>
    <div class="group">

        <option value="3">slow</option>
        <option value="6" selected>normal</option>
        <option value="14">fast</option>
        <option value="0">instant</option>
      </select>
    </div>
   </div>
   <div class="row dials">
    <div class="group">

      <input type="range" id="win" min="1" max="4" step="1" value="2">

    </div>
   </div>
  </div>
</div>

      title: 'Six activities in the (mean, spread) plane',
      subtitle: '' },
  ];
  const PRESET = { win: 2, feat: 'std' };

  // ------------------------------------------------------------ layout
  const W = 1400, H = 640, PL = 80, PR = 24;
  const TT = 24, TB = 222;            // trace panel
  const FT = 302, FB = 596;           // feature panel (steps 1-4)
  const FT6 = 24;                     // feature panel top on the six-class step
  const xT = t => PL + (t / (2 * SEG_S)) * (W - PL - PR);
  const svgNS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs = {}, parent) => { const n = document.createElementNS(svgNS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; };
  const txt = (parent, x, y, s, attrs = {}) => { const t = el('text', Object.assign({ x, y }, attrs), parent); t.textContent = s; return t; };
  const fmt = (v, d = 2) => v.toFixed(d);
  function niceStep(range, maxTicks) { const cands = [0.25, 0.5, 1, 2, 5, 10, 20, 50]; for (const c of cands) if (range / c <= maxTicks) return c; return 100; }

  // ------------------------------------------------------------ state
  const $ = id => document.getElementById(id);
  const chart = $('chart'), tt = $('tt');
  let wl = 2, feat = 'std', speed = 6;
  const dirty = { win: false, feat: false };
  let step = 0, cursor = -1, playing = false, raf = 0, lastT = 0, acc = 0;
  let wins = [], trace = null, yLo = 0, yHi = 1, yF = v => v, xF = v => v, drawnPts = 0, total = 0;
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ------------------------------------------------------------ features
  function windowsFor(act, off) {
    const ws = Math.round(wl * FS), st = Math.round(STEP_S * FS), x = AY[act], res = [];
    for (let s = 0; s + ws <= x.length; s += st) {
      let m = 0; for (let i = s; i < s + ws; i++) m += x[i]; m /= ws;
      let v = 0; for (let i = s; i < s + ws; i++) v += (x[i] - m) * (x[i] - m); v /= ws;
      res.push({ act, s: s + off, ws, mean: m, std: Math.sqrt(v), var: v });
    }
    return res;
  }
  function prepare() {
    const d = STEPS[step];
    if (d.pair) {
      trace = AY[d.pair[0]].concat(AY[d.pair[1]]);
      wins = windowsFor(d.pair[0], 0).concat(windowsFor(d.pair[1], AY[d.pair[0]].length));
      total = wins.length;
      const lo = Math.min(...trace), hi = Math.max(...trace), pad = 0.12 * (hi - lo);
      yLo = Math.floor(lo - pad); yHi = Math.ceil(hi + pad);
    } else {
      trace = null; wins = [];
      const S = SCATTER[Math.round(wl * FS)];
      total = ACTS.reduce((n, a) => n + S[a].length, 0);
    }
  }
  const spreadOf = w => feat === 'std' ? w.std : w.var;
  const spreadName = () => feat === 'std' ? 'standard deviation' : 'variance';
  const spreadUnit = () => feat === 'std' ? 'm/s²' : 'm²/s⁴';
  const spreadMax = () => feat === 'std' ? 10 : 90;

  // ------------------------------------------------------------ drawing
  let G = {};
  function drawStatic() {
    chart.innerHTML = '';
    const d = STEPS[step];
    G.trace = el('g', {}, chart);
    G.panel = el('g', {}, chart);
    G.pts = el('g', {}, chart);
    G.win = el('g', {}, chart);
    G.legend = el('g', {}, chart);
    G.hover = el('g', {}, chart);
    if (d.pair) drawTracePanel(d);
    drawFeaturePanel(d);
    G.hit = el('rect', { x: PL, y: TT, width: W - PL - PR, height: d.pair ? TB - TT : 0, fill: 'transparent' }, chart);
    drawnPts = 0;
  }
  function drawTracePanel(d) {
    const g = G.trace;
    const yS = v => TB - ((v - yLo) / (yHi - yLo)) * (TB - TT);
    G.yT = yS;
    // activity shading + labels
    d.pair.forEach((a, k) => {
      el('rect', { x: xT(k * SEG_S), y: TT, width: xT(SEG_S) - xT(0), height: TB - TT, fill: COL[a], opacity: 0.09 }, g);
      txt(g, xT(k * SEG_S + SEG_S / 2), TT + 15, a, { class: 'plabel', 'text-anchor': 'middle', fill: COL[a], 'font-weight': 700 });
    });
    const grid = el('g', { class: 'grid' }, g), axis = el('g', { class: 'axis' }, g);
    const st = niceStep(yHi - yLo, 6);
    for (let v = Math.ceil(yLo / st) * st; v <= yHi + 1e-9; v += st) {
      el('line', { x1: PL, x2: W - PR, y1: yS(v), y2: yS(v) }, grid);
      txt(axis, PL - 8, yS(v) + 4, fmt(v, st < 1 ? 1 : 0), { 'text-anchor': 'end' });
    }
    for (let t = 0; t <= 2 * SEG_S; t += 5) {
      el('line', { x1: xT(t), x2: xT(t), y1: TT, y2: TB }, grid);
      txt(axis, xT(t), TB + 16, t, { 'text-anchor': 'middle' });
    }
    el('path', { d: `M${PL},${TT}V${TB}H${W - PR}` }, axis);
    txt(g, W - PR, TB + 32, 'time (s)', { class: 'axis-title', 'text-anchor': 'end' });
    txt(g, 0, 0, 'aᵧ (m/s²)', { class: 'axis-title', 'text-anchor': 'middle', transform: `translate(${PL - 60}, ${(TT + TB) / 2}) rotate(-90)` });
    let p = ''; for (let i = 0; i < trace.length; i++) p += (i ? 'L' : 'M') + xT(i / FS).toFixed(1) + ',' + yS(trace[i]).toFixed(1);
    el('path', { class: 'sig-line', d: p }, g);
  }
  function drawFeaturePanel(d) {
    const g = G.panel;
    const top = d.pair ? FT : FT6;
    const grid = el('g', { class: 'grid' }, g), axis = el('g', { class: 'axis' }, g);
    if (d.panel === 'hist') {
      xF = v => PL + ((v - 4.5) / 6) * (W - PL - PR);
      const maxC = Math.max(8, ...histCounts(wins.length - 1).max);
      G.hMax = maxC;
      yF = c => FB - (c / maxC) * (FB - top);
      for (let v = 5; v <= 10.5; v += 1) { el('line', { x1: xF(v), x2: xF(v), y1: top, y2: FB }, grid); txt(axis, xF(v), FB + 16, v, { 'text-anchor': 'middle' }); }
      const st = niceStep(maxC, 6);
      for (let c = 0; c <= maxC; c += st) { el('line', { x1: PL, x2: W - PR, y1: yF(c), y2: yF(c) }, grid); txt(axis, PL - 8, yF(c) + 4, c, { 'text-anchor': 'end' }); }
      el('path', { d: `M${PL},${top}V${FB}H${W - PR}` }, axis);
      txt(g, W - PR, FB + 32, 'mean of aᵧ per window (m/s²)', { class: 'axis-title', 'text-anchor': 'end' });
      txt(g, 0, 0, 'number of windows', { class: 'axis-title', 'text-anchor': 'middle', transform: `translate(${PL - 60}, ${(top + FB) / 2}) rotate(-90)` });
      txt(g, W - PR - 6, top + 16, 'mean = (1/n) Σ xᵢ', { class: 'formula', 'text-anchor': 'end' });
    } else {
      xF = v => PL + ((v - 4.5) / 5.5) * (W - PL - PR);
      const mx = spreadMax();
      yF = v => FB - (v / mx) * (FB - top);
      for (let v = 5; v <= 10; v += 1) { el('line', { x1: xF(v), x2: xF(v), y1: top, y2: FB }, grid); txt(axis, xF(v), FB + 16, v, { 'text-anchor': 'middle' }); }
      const st = feat === 'std' ? 2 : 20;
      for (let v = 0; v <= mx; v += st) { el('line', { x1: PL, x2: W - PR, y1: yF(v), y2: yF(v) }, grid); txt(axis, PL - 8, yF(v) + 4, v, { 'text-anchor': 'end' }); }
      el('path', { d: `M${PL},${top}V${FB}H${W - PR}` }, axis);
      txt(g, W - PR, FB + 32, 'mean of aᵧ (m/s²)', { class: 'axis-title', 'text-anchor': 'end' });
      txt(g, 0, 0, `${spreadName()} of aᵧ (${spreadUnit()})`, { class: 'axis-title', 'text-anchor': 'middle', transform: `translate(${PL - 60}, ${(top + FB) / 2}) rotate(-90)` });
      const f = feat === 'std' ? 'std = √( (1/n) Σ (xᵢ − mean)² )' : 'var = (1/n) Σ (xᵢ − mean)²';
      txt(g, W - PR - 6, top + 16, 'mean = (1/n) Σ xᵢ', { class: 'formula', 'text-anchor': 'end' });
      txt(g, W - PR - 6, top + 42, f, { class: 'formula', 'text-anchor': 'end' });
    }
  }
  function histCounts(upto) {
    const nb = 40, counts = {}, max = [];
    for (let k = 0; k <= upto && k < wins.length; k++) {
      const w = wins[k]; const b = Math.floor((w.mean - 4.5) / 6 * nb);
      if (b < 0 || b >= nb) continue;
      (counts[w.act] = counts[w.act] || new Array(nb).fill(0))[b]++;
    }
    for (const a in counts) max.push(Math.max(...counts[a]));
    return { counts, max, nb };
  }
  function drawLegend() {
    G.legend.innerHTML = '';
    const d = STEPS[step];
    const classes = d.pair || ACTS;
    legendRow(G.legend, W - PR, (d.pair ? FT : FT6) - 30, classes.map(a => ({ c: COL[a], n: a, dot: true })));
    if (d.pair) {
      const it = [{ c: 'var(--clean)', n: 'aᵧ (50 Hz)', line: true }, { c: 'var(--ink)', n: 'window mean', line: true }];
      if (d.panel === 'scatter') it.push({ c: 'var(--ink-3)', n: 'mean ± std', band: true });
      legendRow(G.legend, W - PR, TT - 30, it);
    }
  }
  // one-row legend, right edge at xr, on a white rounded rect
  function legendRow(parent, xr, y, items) {
    const padX = 10, gap = 16, h = 28;
    const widths = items.map(it => 26 + it.n.length * 12);
    const wdt = widths.reduce((a, b) => a + b, 0) + gap * (items.length - 1) + 2 * padX;
    const x = xr - wdt;
    el('rect', { x, y, width: wdt, height: h, rx: 4, fill: '#fff', 'fill-opacity': .9, stroke: 'var(--rule)' }, parent);
    let cx = x + padX; const yy = y + h / 2;
    items.forEach((it, j) => {
      if (it.dot) el('circle', { cx: cx + 9, cy: yy, r: 4.5, fill: it.c, 'fill-opacity': .8, stroke: '#222', 'stroke-width': .5 }, parent);
      else if (it.band) el('rect', { x: cx, y: yy - 6, width: 18, height: 12, fill: it.c, opacity: .3 }, parent);
      else el('line', { x1: cx, x2: cx + 18, y1: yy, y2: yy, stroke: it.c, 'stroke-width': 2.2 }, parent);
      txt(parent, cx + 26, yy + 4, it.n, { class: 'axis-title', fill: 'var(--ink)' });
      cx += widths[j] + gap;
    });
  }

  function render() {
    const d = STEPS[step];
    G.win.innerHTML = '';
    if (d.panel === 'scatter6') { renderScatter6(); return; }
    if (cursor < 0) { G.pts.innerHTML = ''; return; }
    const w = wins[cursor], c = COL[w.act];
    // window on the trace
    const x0 = xT(w.s / FS), x1 = xT((w.s + w.ws) / FS);
    el('rect', { class: 'win-rect', x: x0, y: TT + 2, width: x1 - x0, height: TB - TT - 4, rx: 2 }, G.win);
    if (d.panel === 'scatter') el('rect', { x: x0, y: G.yT(w.mean + w.std), width: x1 - x0, height: G.yT(w.mean - w.std) - G.yT(w.mean + w.std), fill: c, opacity: .22 }, G.win);
    el('line', { x1: x0, x2: x1, y1: G.yT(w.mean), y2: G.yT(w.mean), stroke: c, 'stroke-width': 2.5 }, G.win);
    const lx = (x0 + x1) / 2, right = lx > W - 260;
    const label = d.panel === 'hist' ? `mean ${fmt(w.mean)}` : `mean ${fmt(w.mean)} · ${feat} ${fmt(spreadOf(w))}`;
    txt(G.win, right ? x0 - 8 : x1 + 8, TT + 40, label, { class: 'dlabel', fill: c, 'text-anchor': right ? 'end' : 'start' });
    // feature panel
    G.pts.innerHTML = '';
    if (d.panel === 'hist') {
      const { counts, nb } = histCounts(cursor);
      const bw = (xF(4.5 + 6 / nb) - xF(4.5));
      for (const a of d.pair) {
        if (!counts[a]) continue;
        counts[a].forEach((n, b) => { if (!n) return; el('rect', { x: xF(4.5 + b * 6 / nb) + 0.5, y: yF(n), width: bw - 1, height: yF(0) - yF(n), fill: COL[a], opacity: .55, stroke: '#333', 'stroke-width': .6 }, G.pts); });
      }
      // marker for the current window's mean
      el('line', { x1: xF(w.mean), x2: xF(w.mean), y1: FT, y2: FB, stroke: c, 'stroke-width': 1.5, 'stroke-dasharray': '4 3' }, G.pts);
      el('path', { d: `M${xF(w.mean) - 6},${FT - 2}L${xF(w.mean) + 6},${FT - 2}L${xF(w.mean)},${FT + 8}Z`, fill: c }, G.pts);
    } else {
      for (let k = 0; k <= cursor; k++) {
        const q = wins[k];
        el('circle', { cx: xF(q.mean), cy: yF(spreadOf(q)), r: 4.5, fill: COL[q.act], 'fill-opacity': .75, stroke: '#222', 'stroke-width': .5 }, G.pts);
      }
      el('circle', { cx: xF(w.mean), cy: yF(spreadOf(w)), r: 9, fill: 'none', stroke: c, 'stroke-width': 2 }, G.pts);
    }
  }
  function renderScatter6() {
    const S = SCATTER[Math.round(wl * FS)];
    const n = cursor + 1;
    if (n < drawnPts) { G.pts.innerHTML = ''; drawnPts = 0; }
    let idx = 0;
    for (const a of ACTS) {
      for (const p of S[a]) {
        if (idx >= n) return;
        if (idx >= drawnPts) { el('circle', { cx: xF(p[0]), cy: yF(feat === 'std' ? p[1] : p[1] * p[1]), r: 4.5, fill: COL[a], 'fill-opacity': .75, stroke: '#222', 'stroke-width': .5 }, G.pts); drawnPts = idx + 1; }
        idx++;
      }
    }
  }

  // ------------------------------------------------------------ hover
  function hover(evt) {
    if (!trace) return;
    const pt = chart.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY;
    const p = pt.matrixTransform(chart.getScreenCTM().inverse());
    if (p.y > TB || p.y < TT) { unhover(); return; }
    const i = Math.max(0, Math.min(trace.length - 1, Math.round((p.x - PL) / (W - PL - PR) * trace.length)));
    const act = STEPS[step].pair[i < AY.Sitting.length ? 0 : 1];
    G.hover.innerHTML = '';
    el('line', { class: 'crosshair', x1: xT(i / FS), x2: xT(i / FS), y1: TT, y2: TB }, G.hover);
    el('circle', { cx: xT(i / FS), cy: G.yT(trace[i]), r: 4, fill: 'var(--ink-2)', stroke: '#fff', 'stroke-width': 1.5 }, G.hover);
    tt.innerHTML = `<div class="row"><span>t</span><b>${(i / FS).toFixed(2)} s</b></div><div class="row"><span><i class="sw" style="background:${COL[act]}"></i>${act}</span></div><div class="row"><span>aᵧ</span><span>${fmt(trace[i])}</span></div>`;
    tt.style.display = 'block';
    const wrap = chart.parentElement.getBoundingClientRect();
    const px = evt.clientX - wrap.left, py = evt.clientY - wrap.top;
    tt.style.left = (px + 16 + tt.offsetWidth > wrap.width ? px - tt.offsetWidth - 12 : px + 16) + 'px';
    tt.style.top = Math.max(0, py - 10) + 'px';
  }
  function unhover() { tt.style.display = 'none'; G.hover.innerHTML = ''; }

  // ------------------------------------------------------------ step control
  function applyPresets() {
    if (!dirty.win) { wl = PRESET.win; $('win').value = wl; $('winVal').textContent = wl + ' s'; }
    if (!dirty.feat) { feat = PRESET.feat; $('feat').value = feat; }
  }
  function tag() {
    const d = STEPS[step];
    const base = `w = ${wl} s (${wl * FS} samples)`;
    return d.panel === 'scatter6' ? base : `${base} · step = ${STEP_S} s`;
  }
  function enterStep(k, completed = false) {
    step = k;
    applyPresets();
    const d = STEPS[step];
    prepare();
    drawStatic();
    $('title').innerHTML = d.title + `<span class="tag">${tag()}</span>`;
    $('subtitle').textContent = d.subtitle;
    $('counter').textContent = `${step + 1} / ${STEPS.length}`;
    try { history.replaceState(null, '', '#' + (step + 1)); } catch (_) {}
    stopPlay();
    cursor = -1;
    drawLegend();
    if (completed || speed === 0 || reduceMotion) finish();
    else { render(); startPlay(); }
  }
  function redraw() {
    // a dial moved: recompute from live values, keep progress fraction
    const frac = total ? Math.max(0, cursor) / total : 0;
    const wasDone = cursorDone();
    prepare(); drawStatic(); drawLegend();
    $('title').innerHTML = STEPS[step].title + `<span class="tag">${tag()}</span>`;
    cursor = wasDone ? total - 1 : Math.min(total - 1, Math.round(frac * total));
    render();
  }
  function cursorDone() { return cursor >= total - 1; }
  function finish() { cursor = total - 1; stopPlay(); render(); }
  function rate() { return speed * (STEPS[step].panel === 'scatter6' ? 25 : 1); }
  function tick(t) {
    if (!playing) return;
    const dt = Math.max(0, Math.min(0.1, (t - lastT) / 1000)); lastT = t;
    acc += dt * rate();
    while (acc >= 1 && cursor < total - 1) { cursor++; acc -= 1; }
    render();
    if (cursor >= total - 1) { finish(); return; }
    raf = requestAnimationFrame(tick);
  }
  function startPlay() {
    if (cursorDone()) return;
    playing = true; lastT = performance.now(); acc = 0;
    $('play').textContent = '⏸';
    raf = requestAnimationFrame(tick);
  }
  function stopPlay() { playing = false; cancelAnimationFrame(raf); $('play').textContent = '▶'; }
  function next() { if (!cursorDone()) { finish(); return; } if (step < STEPS.length - 1) enterStep(step + 1); }
  function prev() { if (step > 0) enterStep(step - 1, true); }
  function restart() { enterStep(step); }

  // ------------------------------------------------------------ wiring
  $('next').addEventListener('click', e => { e.stopPropagation(); next(); });
  $('prev').addEventListener('click', e => { e.stopPropagation(); prev(); });
  $('restart').addEventListener('click', e => { e.stopPropagation(); restart(); });
  $('play').addEventListener('click', e => { e.stopPropagation(); if (playing) stopPlay(); else if (cursorDone()) restart(); else startPlay(); });
  $('slide').addEventListener('click', () => next());
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
    else if (e.key === ' ') { e.preventDefault(); $('play').click(); }
    else if (e.key === 'r' || e.key === 'R') restart();
  });
  $('win').addEventListener('input', e => { dirty.win = true; wl = parseInt(e.target.value, 10); $('winVal').textContent = wl + ' s'; redraw(); });
  $('feat').addEventListener('change', e => { dirty.feat = true; feat = e.target.value; redraw(); });
  $('speed').addEventListener('change', e => { speed = parseFloat(e.target.value); });
  $('reset').addEventListener('click', e => { e.stopPropagation(); dirty.win = false; dirty.feat = false; enterStep(step); });
  chart.addEventListener('mousemove', hover);
  chart.addEventListener('mouseleave', unhover);

  const h = parseInt((location.hash || '').replace('#', ''), 10);
  enterStep(h >= 1 && h <= STEPS.length ? h - 1 : 0);
})();
</script>
</body>
</html>

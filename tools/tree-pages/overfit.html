__HEAD__
<div id="app">
  <div class="head"><h1 id="title"></h1></div>
  <div class="main"><svg id="fig" viewBox="0 0 1600 760"></svg></div>
  <div class="bar">
    <button id="prev" title="Previous step (←)">⏮ step</button>
    <button id="next" title="Next step (→)">step ⏭</button>
    <span class="step" id="stepno"></span>
  </div>
</div>
<script>
(() => {
__COMMON__

// ------------------------------------------------------------ the polynomial picture: twelve noisy points from a smooth curve, fitted at three degrees
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
const PTS = (() => { const r = rng(7), g = () => { let u = 0; for (let i = 0; i < 6; i++) u += r(); return (u - 3) / Math.sqrt(0.5); };
  return Array.from({ length: 12 }, (_, i) => { const x = (i + 0.2 + 0.6 * r()) / 12; return [x, Math.sin(2 * Math.PI * x) + 0.28 * g()]; }); })();
// least squares through the normal equations, on x rescaled to [−1, 1] so that degree 9 stays well conditioned
function polyfit(pts, d) {
  const A = Array.from({ length: d + 1 }, () => new Array(d + 2).fill(0));
  pts.forEach(([x, y]) => { const t = 2 * x - 1, p = Array.from({ length: d + 1 }, (_, k) => t ** k); for (let i = 0; i <= d; i++) { for (let j = 0; j <= d; j++) A[i][j] += p[i] * p[j]; A[i][d + 1] += p[i] * y; } });
  for (let c = 0; c <= d; c++) { let m = c; for (let r = c + 1; r <= d; r++) if (Math.abs(A[r][c]) > Math.abs(A[m][c])) m = r; [A[c], A[m]] = [A[m], A[c]];
    for (let r = 0; r <= d; r++) if (r !== c) { const f = A[r][c] / A[c][c]; for (let k = c; k <= d + 1; k++) A[r][k] -= f * A[c][k]; } }
  const w = A.map((row, i) => row[d + 1] / row[i]);
  return x => { const t = 2 * x - 1; return w.reduce((s, c, k) => s + c * t ** k, 0); };
}
function polyPanel(g, X0, deg, name) {
  const W = 470, Y0 = 90, H = 520, sx = x => X0 + x * W, sy = y => Y0 + H / 2 - y / 2.2 * (H / 2), f = polyfit(PTS, deg);
  el(g, 'rect', { x: X0, y: Y0, width: W, height: H, fill: 'none', stroke: '#666', 'stroke-width': 1.5 });
  const cp = el(g, 'clipPath', { id: 'c' + deg }); el(cp, 'rect', { x: X0, y: Y0, width: W, height: H });
  let d = ''; for (let i = 0; i <= 300; i++) { const x = i / 300; d += (i ? 'L' : 'M') + sx(x).toFixed(1) + ' ' + sy(f(x)).toFixed(1); }
  el(g, 'path', { d, fill: 'none', stroke: '#2a78d6', 'stroke-width': 4, 'clip-path': `url(#c${deg})` });
  PTS.forEach(([x, y]) => el(g, 'circle', { cx: sx(x), cy: sy(y), r: 9, fill: '#222', stroke: '#fff', 'stroke-width': 2 }));
  el(g, 'text', { x: X0 + W / 2, y: Y0 - 44, 'text-anchor': 'middle', 'font-size': 28, 'font-weight': 700, fill: '#222' }, name);
  el(g, 'text', { x: X0 + W / 2, y: Y0 - 12, 'text-anchor': 'middle', 'font-size': 21, fill: '#666' }, `polynomial of degree ${deg}`);
}

// ------------------------------------------------------------ steps
const NONE = growTree(TRAIN), D4 = growTree(TRAIN, { maxDepth: 4 }), D3 = growTree(TRAIN, { maxDepth: 3 });
const CURVE = Array.from({ length: 15 }, (_, i) => { const t = growTree(TRAIN, { maxDepth: i + 1 }); return { d: i + 1, tr: acc(t, TRAIN), te: acc(t, TEST) }; });
const code = [
  ['from sklearn.tree import DecisionTreeClassifier', 0], ['', 0],
  ['dt = DecisionTreeClassifier(', 0], ["    criterion='gini',", 0], ['    max_depth=5,', 1], ['    min_samples_split=20,', 2], ['    min_samples_leaf=10', 3], [')', 0],
  ['dt.fit(X_train, y_train)', 0], ['predictions = dt.predict(X_test)', 0]];
const PARAMS = [
  ['max_depth', 'the most levels of questions from the root to a leaf'],
  ['min_samples_split', 'the fewest windows a node must hold before it may be split'],
  ['min_samples_leaf', 'the fewest windows that every leaf must hold']];
const STEPS = [
  { title: 'What does training a decision tree look like in code?', draw(g) {
      el(g, 'rect', { x: 20, y: 40, width: 880, height: 560, rx: 10, fill: '#f6f7f9', stroke: '#dcdcdc' });
      code.forEach(([s, k], i) => el(g, 'text', { x: 50, y: 100 + i * 50, 'xml:space': 'preserve', style: 'white-space: pre', 'font-size': 27, 'font-family': 'Menlo, monospace', fill: k ? '#1d5fae' : '#222', 'font-weight': k ? 700 : 400 }, s));
      PARAMS.forEach(([n, s], i) => { const y = 120 + i * 170;
        el(g, 'text', { x: 950, y, 'font-size': 28, 'font-family': 'Menlo, monospace', 'font-weight': 700, fill: '#1d5fae' }, n);
        el(g, 'text', { x: 950, y: y + 44, 'font-size': 25, fill: '#222' }, s); });
    } },
  { title: 'What does overfitting look like?', draw(g) {
      polyPanel(g, 40, 1, 'Underfitting'); polyPanel(g, 565, 3, 'About right'); polyPanel(g, 1090, 9, 'Overfitting');
    } },
  { title: 'How does a decision tree overfit?', draw(g) {
      legend(g, 300, 30);
      [[NONE, 'No limit'], [D4, 'max_depth = 4'], [D3, 'max_depth = 3']].forEach(([t, name], i) => {
        const X0 = 90 + i * 515, X1 = X0 + 420;
        el(g, 'text', { x: (X0 + X1) / 2, y: 92, 'text-anchor': 'middle', 'font-size': 26, 'font-weight': 700, fill: '#222', 'font-family': i ? 'Menlo, monospace' : 'inherit' }, name);
        el(g, 'text', { x: (X0 + X1) / 2, y: 122, 'text-anchor': 'middle', 'font-size': 19, fill: '#666' }, `${leavesOf(t).length} leaves · depth ${depthOf(t)}`);
        plane(g, t, X0, 140, X1, 640, { s: 0.85, r: 5 });
      });
    } },
  { title: 'How do training and test accuracy change as the tree grows?', draw(g) {
      const X0 = 140, X1 = 1500, Y0 = 70, Y1 = 640, sx = d => X0 + (d - 1) / 14 * (X1 - X0), sy = a => Y1 - (a - 0.5) / 0.5 * (Y1 - Y0);
      for (let a = 0.5; a <= 1.0001; a += 0.1) { el(g, 'line', { x1: X0, x2: X1, y1: sy(a), y2: sy(a), stroke: '#ececec', 'stroke-width': 1.5 }); el(g, 'text', { x: X0 - 14, y: sy(a) + 7, 'text-anchor': 'end', 'font-size': 20, ...mono }, a.toFixed(1)); }
      CURVE.forEach(c => el(g, 'text', { x: sx(c.d), y: Y1 + 30, 'text-anchor': 'middle', 'font-size': 20, ...mono }, c.d));
      el(g, 'text', { x: (X0 + X1) / 2, y: Y1 + 66, 'text-anchor': 'middle', 'font-size': 22, fill: '#444', 'font-family': 'Menlo, monospace' }, 'max_depth');
      el(g, 'text', { x: X0 - 80, y: (Y0 + Y1) / 2, 'text-anchor': 'middle', 'font-size': 22, fill: '#444', transform: `rotate(-90 ${X0 - 80} ${(Y0 + Y1) / 2})` }, 'accuracy');
      el(g, 'rect', { x: X0, y: Y0, width: X1 - X0, height: Y1 - Y0, fill: 'none', stroke: '#666', 'stroke-width': 1.5 });
      [['tr', '#222', 'training windows'], ['te', '#c0392b', 'test windows']].forEach(([k, col, name], j) => {
        el(g, 'path', { d: CURVE.map((c, i) => (i ? 'L' : 'M') + sx(c.d) + ' ' + sy(c[k])).join(''), fill: 'none', stroke: col, 'stroke-width': 4 });
        CURVE.forEach(c => el(g, 'circle', { cx: sx(c.d), cy: sy(c[k]), r: 7, fill: col, stroke: '#fff', 'stroke-width': 2 }));
        el(g, 'line', { x1: X1 - 330, x2: X1 - 290, y1: Y0 + 40 + j * 40, y2: Y0 + 40 + j * 40, stroke: col, 'stroke-width': 4 });
        el(g, 'text', { x: X1 - 280, y: Y0 + 47 + j * 40, 'font-size': 22, fill: '#222' }, name);
      });
      const best = CURVE.reduce((b, c) => c.te > b.te ? c : b);
      el(g, 'line', { x1: sx(best.d), x2: sx(best.d), y1: Y0, y2: Y1, stroke: '#c0392b', 'stroke-width': 2, 'stroke-dasharray': '7 6' });
      el(g, 'text', { x: sx(best.d) + 12, y: Y0 + 30, 'font-size': 22, 'font-weight': 700, fill: '#c0392b' }, `best on test: max_depth = ${best.d}, ${best.te.toFixed(2)}`);
    } },
];

let step = Math.max(0, Math.min(STEPS.length - 1, (parseInt(location.hash.slice(1), 10) || 1) - 1));
function draw() {
  const S = STEPS[step], svg = $('fig'); svg.innerHTML = '';
  $('title').textContent = S.title; $('stepno').textContent = `step ${step + 1} of ${STEPS.length}`;
  $('prev').disabled = step === 0; $('next').disabled = step === STEPS.length - 1;
  S.draw(el(svg, 'g', {}));
}
function go(s) { step = Math.max(0, Math.min(STEPS.length - 1, s)); draw(); history.replaceState(null, '', '#' + (step + 1)); }
$('prev').onclick = () => go(step - 1); $('next').onclick = () => go(step + 1);
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') go(step + 1); else if (e.key === 'ArrowLeft') go(step - 1); });
draw();
})();
</script>
</body>
</html>

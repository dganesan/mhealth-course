<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Building the Tree with Entropy</title>
</head>
<body>
<style>
  :root {
    color-scheme: light;
    --paper: #ffffff; --ink: #222222; --ink-2: #666666; --ink-3: #9a9a9a; --rule: #dcdcdc; --grid: #ececec; --ma: #2a78d6;
    --sans: "Helvetica Neue", Helvetica, -apple-system, Arial, sans-serif;
    --mono: Menlo, "SF Mono", Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  #app { height: 100vh; padding: 10px 14px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px; }
  .head { padding: 4px 16px 0; }
  h1 { margin: 0; font-size: clamp(24px, 2.4vw, 36px); font-weight: 700; letter-spacing: -0.01em; }
  .main { user-select: none; -webkit-user-select: none; min-height: 0; border: 1px solid var(--rule); border-radius: 6px; padding: 10px 16px; }
  .main svg { width: 100%; height: 100%; display: block; }
  svg text { font-family: var(--sans); }
  .bar { display: flex; gap: 10px; align-items: center; padding: 10px 18px; border: 1px solid var(--rule); border-radius: 6px; background: #f6f7f9; }
  button { font: inherit; font-size: 18px; color: var(--ink); background: #fff; border: 1px solid #9a9a9a; border-radius: 6px; padding: 9px 16px; cursor: pointer; }
  button:hover { border-color: var(--ink); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--ma); color: #fff; border-color: var(--ma); font-weight: 700; }
  .hide { display: none !important; }
  .step { font-family: var(--mono); font-size: 17px; color: var(--ink-2); margin-left: auto; }
</style>

<div id="app">
  <div class="head"><h1 id="title"></h1></div>
  <div class="main"><svg id="fig" viewBox="0 0 1600 760"></svg></div>
  <div class="bar">
    <button id="prev" title="Previous step (←)">⏮ step</button>
    <button id="next" title="Next step (→)">step ⏭</button>
    <button id="show" class="primary" title="Show the next number (space)"></button>
    <span class="step" id="stepno"></span>
  </div>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
function el(parent, tag, attrs, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  parent.appendChild(e); return e;
}

// ------------------------------------------------------------ the 16 patients of the Build the Tree game (ch5/build-a-tree.html)
// age (0 <40, 1 40–55, 2 >55), family history (0 no, 1 yes), exercise (0 rarely, 1 regularly), risk (0 low, 1 high)
const PATIENTS = [[1,1,1,0,1],[2,0,0,0,0],[3,2,0,1,0],[4,1,1,1,0],[5,2,1,0,1],[6,0,1,1,0],[7,1,0,1,0],[8,2,0,0,1],
                  [9,1,1,1,1],[10,0,1,0,1],[11,2,1,1,1],[12,1,0,1,0],[13,1,1,0,1],[14,2,0,0,1],[15,1,1,1,0],[16,2,1,0,1]]
  .map(([id, age, fh, ex, risk]) => ({ id, age, fh, ex, risk }));
const pt = id => PATIENTS[id - 1];
const ALL = PATIENTS.map(p => p.id);
const ATTR = {
  fh:  { name: 'Family history', q: 'Family history?', vals: ['No', 'Yes'], group: ['with no family history', 'with a family history'] },
  age: { name: 'Age', q: 'Age?', vals: ['<40', '40–55', '>55'], group: ['under 40', 'aged 40 to 55', 'over 55'] },
  ex:  { name: 'Exercise', q: 'Exercise?', vals: ['Rarely', 'Regularly'], group: ['who exercise rarely', 'who exercise regularly'] },
};
const ORDER = ['fh', 'age', 'ex'];
const COL = { 0: '#1baf7a', 1: '#d6453d' };

// ------------------------------------------------------------ entropy and information gain, rounded to three places at each stage so the written arithmetic adds up
const r3 = v => Math.round(v * 1000) / 1000, f3 = v => v.toFixed(3);
const hi = ids => ids.filter(i => pt(i).risk).length;
const H = ids => { const n = ids.length, a = hi(ids); return r3([a, n - a].reduce((s, c) => c ? s - c / n * Math.log2(c / n) : s, 0)); };
const split = (ids, a) => ATTR[a].vals.map((_, v) => ids.filter(i => pt(i)[a] === v));
const weighted = (ids, a) => r3(split(ids, a).filter(g => g.length).reduce((s, g) => s + g.length / ids.length * H(g), 0));
const gain = (ids, a) => r3(H(ids) - weighted(ids, a));
const pure = ids => new Set(ids.map(i => pt(i).risk)).size < 2;
const isLeaf = n => n.leaf !== undefined;
const depthOf = n => n.path.split('/').length - 1;
function grow(ids, attrs, path, choose) {
  const node = { ids, path };
  if (pure(ids) || !attrs.length) { node.leaf = pure(ids) ? pt(ids[0]).risk : 'mixed'; return node; }
  const a = choose(node, attrs); if (!a) return node;
  node.attr = a; node.attrs = attrs;
  node.kids = split(ids, a).map((g, v) => ({ v, node: g.length ? grow(g, attrs.filter(x => x !== a), path + a + v + '/', choose) : null })).filter(k => k.node);
  return node;
}
const best = (ids, attrs) => attrs.reduce((b, a) => (gain(ids, a) > gain(ids, b) ? a : b));
const treeTo = depth => grow(ALL, ORDER, '', (n, attrs) => depthOf(n) < depth ? best(n.ids, attrs) : null);
const TREE = treeTo(9);
const find = (n, path) => n.path === path ? n : (n.kids || []).map(k => find(k.node, path)).find(Boolean);
// how a group is described: the answers on the way down to it
const describe = path => { const seg = path.split('/').filter(Boolean).map(s => [s.replace(/\d$/, ''), +s.slice(-1)]);
  return ['age', 'ex', 'fh'].map(a => seg.find(q => q[0] === a)).filter(Boolean).map(([a, v]) => ATTR[a].group[v]).join(' '); };   // age first reads naturally: under 40 who exercise rarely
const tally = ids => `${hi(ids)} High, ${ids.length - hi(ids)} Low`;
const terms = ids => { const n = ids.length, a = hi(ids); return [a, n - a].filter(c => c).map((c, i) => `${i ? '− ' : '−'}(${c}/${n}) log₂(${c}/${n})`); };
const working = ids => { const n = ids.length, a = hi(ids); return [a, n - a].filter(c => c).map((c, i) => `${i ? ' − ' : '−'}(${c}/${n}) log₂(${c}/${n})`).join(''); };

function chips(g, ids, x, y, w, s) {
  const cw = 44 * s, ch = 34 * s, gap = 6 * s, per = Math.max(1, Math.floor((w + gap) / (cw + gap)));
  const n = Math.min(per, ids.length), x0 = x + (w - (n * cw + (n - 1) * gap)) / 2;
  ids.forEach((id, i) => {
    const cx = x0 + (i % per) * (cw + gap), cy = y + Math.floor(i / per) * (ch + gap);
    el(g, 'rect', { x: cx, y: cy, width: cw, height: ch, rx: 6 * s, fill: COL[pt(id).risk] });
    el(g, 'text', { x: cx + cw / 2, y: cy + ch / 2 + 7.5 * s, 'text-anchor': 'middle', 'font-size': 21 * s, 'font-weight': 700, fill: '#fff' }, id);
  });
}
function drawTree(g, tree, x, y, w, h, s, cur) {
  const kids = n => n.kids || [];
  const leaves = n => kids(n).length ? kids(n).reduce((t, k) => t + leaves(k.node), 0) : 1;
  const depth = n => kids(n).length ? 1 + Math.max(...kids(n).map(k => depth(k.node))) : 0;
  const nL = leaves(tree), D = depth(tree), slot = w / nL, lvl = D ? Math.min((h - 120 * s) / D, 170 * s) : 0;
  const edges = el(g, 'g', {}), labels = el(g, 'g', {}), nodes = el(g, 'g', {});
  function place(n, d, first) {
    const ks = kids(n); let cx;
    if (!ks.length) cx = x + (first + 0.5) * slot;
    else { let f = first; const xs = ks.map(k => { const r = place(k.node, d + 1, f); f += leaves(k.node); return r; }); cx = (xs[0] + xs[xs.length - 1]) / 2;
      ks.forEach((k, i) => { const cy = y + d * lvl, ky = y + (d + 1) * lvl;
        el(edges, 'line', { x1: cx, y1: cy + 24 * s, x2: xs[i], y2: ky - 4 * s, stroke: '#9a9a9a', 'stroke-width': 2 * s });
        // the answer beside its edge: left of a left edge, right of a right edge, so neighbouring labels do not collide
        const lab = ATTR[n.attr].vals[k.v], dx = xs[i] - cx, lx = cx + 0.4 * dx, ly = cy + 0.4 * (ky - cy), side = Math.abs(dx) < 40 * s ? 0 : Math.sign(dx);
        if (!side) { const lw = lab.length * 11 * s + 10 * s; el(labels, 'rect', { x: lx - lw / 2, y: ly - 10 * s, width: lw, height: 26 * s, fill: '#fff' }); }
        el(labels, 'text', { x: lx + side * 6 * s, y: ly + 8 * s, 'text-anchor': side < 0 ? 'end' : side > 0 ? 'start' : 'middle', 'font-size': 19 * s, fill: '#444' }, lab); }); }
    const cy = y + d * lvl;
    if (ks.length) {                                                     // a question
      const bw = 186 * s;
      el(nodes, 'rect', { x: cx - bw / 2, y: cy - 24 * s, width: bw, height: 48 * s, rx: 24 * s, fill: '#e8f1fd', stroke: '#2a78d6', 'stroke-width': 2 * s });
      el(nodes, 'text', { x: cx, y: cy + 8 * s, 'text-anchor': 'middle', 'font-size': 23 * s, 'font-weight': 700, fill: '#1d5fae' }, ATTR[n.attr].q);
    } else {                                                             // a leaf, or a group still waiting for its question
      const open = !isLeaf(n), here = open && [].concat(cur).includes(n.path), bw = Math.min(slot - 10 * s, 160 * s);
      const cs = 0.9 * s, per = Math.max(1, Math.floor((bw - 10 * s + 6 * cs) / (50 * cs))), rows = Math.ceil(n.ids.length / per);
      const bh = 52 * s + rows * 40 * cs, tp = cy - 4 * s;
      const fill = open ? '#fff' : n.leaf === 'mixed' ? '#fdf3cf' : n.leaf ? '#fbe3e1' : '#ddf3ea';
      const stroke = open ? (here ? '#2a78d6' : '#9a9a9a') : n.leaf === 'mixed' ? '#f2c230' : COL[n.leaf];
      el(nodes, 'rect', { x: cx - bw / 2, y: tp, width: bw, height: bh, rx: 8 * s, fill, stroke, 'stroke-width': (here ? 5 : 2) * s, 'stroke-dasharray': open && !here ? 8 * s + ' ' + 6 * s : 'none' });
      el(nodes, 'text', { x: cx, y: tp + 30 * s, 'text-anchor': 'middle', 'font-size': 23 * s, 'font-weight': 700, fill: open ? '#666' : n.leaf === 'mixed' ? '#8a6d00' : COL[n.leaf] },
        open || n.leaf === 'mixed' ? '?' : n.leaf ? 'High' : 'Low');
      chips(nodes, n.ids, cx - bw / 2 + 5 * s, tp + 42 * s, bw - 10 * s, cs);
    }
    return cx;
  }
  place(tree, 0, 0);
}


// ------------------------------------------------------------ layout: a small tree on the left showing where we are, the working to its right
const X0 = 370, XB = 1090, XC = 1345;   // start of the boxes, end of the boxes, centre of the arithmetic column
const Q = '?';
// the patients as a table, as in the Build the Tree game
function table(g, ids, x, y, w, rh) {
  const cols = [['ID', 0.07], ['Age', 0.24], ['Family history', 0.46], ['Exercise', 0.7], ['Risk', 0.9]];
  cols.forEach(([h, f]) => el(g, 'text', { x: x + f * w, y: y + rh * 0.65, 'text-anchor': 'middle', 'font-size': 23, 'font-weight': 700, fill: '#666' }, h));
  el(g, 'line', { x1: x, x2: x + w, y1: y + rh, y2: y + rh, stroke: '#9a9a9a', 'stroke-width': 1.5 });
  ids.forEach((id, i) => {
    const p = pt(id), yy = y + rh * (i + 1);
    if (i % 2) el(g, 'rect', { x, y: yy, width: w, height: rh, fill: '#f6f7f9' });
    [id, ATTR.age.vals[p.age], ATTR.fh.vals[p.fh], ATTR.ex.vals[p.ex]].forEach((c, k) => el(g, 'text', { x: x + cols[k][1] * w, y: yy + rh * 0.68, 'text-anchor': 'middle', 'font-size': 23, fill: '#222', 'font-weight': k ? 400 : 700 }, c));
    el(g, 'text', { x: x + cols[4][1] * w, y: yy + rh * 0.68, 'text-anchor': 'middle', 'font-size': 23, 'font-weight': 700, fill: COL[p.risk] }, p.risk ? 'High' : 'Low');
  });
}
function mini(g, tree, cur) {
  drawTree(g, tree, 0, 40, 340, 680, 0.5, cur);
  el(g, 'line', { x1: 350, x2: 350, y1: 0, y2: 760, stroke: '#dcdcdc', 'stroke-width': 2 });
}

// one candidate question at a group: its branches, each branch's entropy, the weighted average and the gain.
// show: 0 nothing worked out yet, 1 the branch entropies, 2 also the weighted entropy and the gain
function candidate(g, ids, a, y, h, opts) {
  const show = opts.show, parts = split(ids, a), n = parts.length, gap = 14, bw = (XB - X0 - gap * (n - 1)) / n, bh = Math.min(h - 112, 170);
  y += (h - 112 - bh) / 2; h = bh + 112;   // short boxes, centred in the row, when a row has room to spare
  parts.forEach((p, v) => {
    const bx = X0 + v * (bw + gap);
    el(g, 'text', { x: bx + bw / 2, y: y + 24, 'text-anchor': 'middle', 'font-size': 22, fill: '#666', 'font-weight': 700 }, ATTR[a].vals[v]);
    el(g, 'rect', { x: bx, y: y + 34, width: bw, height: bh, rx: 8, fill: '#fafafa', stroke: '#dcdcdc', 'stroke-width': 1.5 });
    chips(g, p, bx + 10, y + 44, bw - 20, 1.05);
    // the branch's entropy worked out, one term per line
    const t = terms(p), last = t.length - 1, at = j => ({ x: bx + bw / 2, y: y + 34 + bh + 26 + j * 26, 'text-anchor': 'middle', 'font-size': 17, 'font-style': 'italic', fill: '#222' });
    if (!p.length) el(g, 'text', { ...at(0), fill: '#666', 'font-style': 'normal' }, 'empty');
    else if (show < 1) el(g, 'text', { ...at(0), 'font-size': 22 }, `H = ${Q}`);
    else t.forEach((s, j) => el(g, 'text', at(j), (j ? '' : 'H = ') + s + (j === last ? ` = ${f3(H(p))}` : '')));
  });
  // the question and its arithmetic, to the right
  const N = ids.length, hv = p => show >= 1 ? f3(H(p)) : Q, sum = parts.filter(p => p.length).map(p => `(${p.length}/${N})(${hv(p)})`).join(' + ');
  const top = y + h / 2 - 56;
  el(g, 'text', { x: XC, y: top - 6, 'text-anchor': 'middle', 'font-size': 27, 'font-weight': 700, fill: '#222' }, ATTR[a].q);
  el(g, 'text', { x: XC, y: top + 32, 'text-anchor': 'middle', 'font-size': 20, fill: '#444' }, sum);
  el(g, 'text', { x: XC, y: top + 66, 'text-anchor': 'middle', 'font-size': 23, fill: '#222' }, `weighted entropy = ${show >= 2 ? f3(weighted(ids, a)) : Q}`);
  el(g, 'text', { x: XC, y: top + 106, 'text-anchor': 'middle', 'font-size': 27, 'font-weight': 700, fill: opts.best ? '#c0392b' : '#222' }, show >= 2 ? `gain = ${f3(H(ids))} − ${f3(weighted(ids, a))} = ${f3(gain(ids, a))}` : `gain = ${Q}`);
  if (opts.best && show >= 2) { el(g, 'rect', { x: XC - 38, y: top + 122, width: 76, height: 28, rx: 5, fill: '#222' }); el(g, 'text', { x: XC, y: top + 143, 'text-anchor': 'middle', 'font-size': 17, 'font-weight': 700, fill: '#fff' }, 'BEST'); }
}
// the group being split, with its own entropy, as one line across the top
function header(g, ids, path, y, showH, below) {
  const who = path ? 'Patients ' + describe(path) : 'All 16 patients';
  el(g, 'text', { x: X0, y, 'font-size': 24, 'font-weight': 700, fill: '#222' }, `${who}: ${tally(ids)}`);
  el(g, 'text', { x: 1590, y: below ? y + 34 : y, 'text-anchor': 'end', 'font-size': 23, 'font-style': 'italic', fill: '#222' }, showH ? `H = ${working(ids)} = ${f3(H(ids))}` : `H = ${Q}`);
}
// a node's candidates up to row `upto`; that row is worked out to level `r`, the rows before it in full
function node(g, path, upto, r) {
  const N = find(TREE, path), cands = N.attrs, h = (760 - 56) / cands.length, done = upto >= cands.length && r >= 2;
  mini(g, treeTo(depthOf(N)), path);
  header(g, N.ids, path, 30, path === '' || upto > 1 || r >= 1);   // the root's entropy was worked out on the first step
  cands.slice(0, upto).forEach((a, i) => {
    candidate(g, N.ids, a, 56 + i * h, h, { best: done && a === N.attr, show: i < upto - 1 ? 2 : r });
    if (i < upto - 1) el(g, 'line', { x1: X0, x2: 1590, y1: 56 + (i + 1) * h, y2: 56 + (i + 1) * h, stroke: '#ececec', 'stroke-width': 1.5 });
  });
}

// ------------------------------------------------------------ steps; a step with `phases` keeps its numbers hidden until revealed, one press at a time
const ROWS = (path, title) => find(TREE, path).attrs.map((_, i) => ({ title, phases: 2, draw: (g, r) => node(g, path, i + 1, r) }));
const mixed = depth => { const out = []; (function f(n) { if (depthOf(n) === depth && !isLeaf(n)) out.push(n); (n.kids || []).forEach(k => f(k.node)); })(TREE); return out; };
const STEPS = [
  { title: 'How mixed are the 16 patients?', phases: 1, draw(g, r) {
      table(g, ALL, 0, 0, 780, 42);
      el(g, 'text', { x: 1210, y: 300, 'text-anchor': 'middle', 'font-size': 32, 'font-weight': 700, fill: '#222' }, tally(ALL));
      if (r < 1) el(g, 'text', { x: 1210, y: 400, 'text-anchor': 'middle', 'font-size': 40, 'font-style': 'italic', fill: '#222' }, `H = ${Q}`);
      else { el(g, 'text', { x: 1210, y: 390, 'text-anchor': 'middle', 'font-size': 29, 'font-style': 'italic', fill: '#222' }, `H = ${working(ALL)}`);
             el(g, 'text', { x: 1210, y: 450, 'text-anchor': 'middle', 'font-size': 36, 'font-weight': 700, 'font-style': 'italic', fill: '#222' }, `= ${f3(H(ALL))}`); }
    } },
  ...ROWS('', 'Which question gives the most information gain at the root?'),
  { title: 'What does the tree look like after the first question?', draw: g => drawTree(g, treeTo(1), 300, 60, 1000, 640, 1.2, null) },
  ...TREE.kids.flatMap(k => ROWS(k.node.path, `Which question next, for patients ${describe(k.node.path)}?`)),
  { title: 'What does the tree look like after the second level?', draw: g => drawTree(g, treeTo(2), 100, 50, 1400, 680, 1.15, null) },
  // groups still mixed below the second level have one question left; its gain is worked out the same way
  { title: 'What about the groups that are still mixed?', phases: 2, draw(g, r) {
      const ns = mixed(2), h = 760 / ns.length;
      mini(g, treeTo(2), ns.map(n => n.path));
      ns.forEach((n, i) => {
        const y = i * h;
        header(g, n.ids, n.path, y + 28, r >= 1, true);   // long group names: the entropy goes on the line below
        candidate(g, n.ids, n.attr, y + 60, h - 66, { best: false, show: r });
        if (i < ns.length - 1) el(g, 'line', { x1: X0, x2: 1590, y1: y + h, y2: y + h, stroke: '#ececec', 'stroke-width': 1.5 });
      });
    } },
  { title: 'What does the finished tree look like?', draw: g => drawTree(g, TREE, 0, 50, 1600, 690, 1.3, null) },
];

let step = Math.max(0, Math.min(STEPS.length - 1, (parseInt(location.hash.slice(1), 10) || 1) - 1)), reveal = 0;
const phases = () => STEPS[step].phases || 0;
function draw() {
  const S = STEPS[step], svg = $('fig'); svg.innerHTML = '';
  $('title').textContent = S.title; $('stepno').textContent = `step ${step + 1} of ${STEPS.length}`;
  $('prev').disabled = step === 0 && reveal === 0; $('next').disabled = step === STEPS.length - 1 && reveal >= phases();
  $('show').classList.toggle('hide', reveal >= phases());
  $('show').textContent = reveal === 0 ? 'Show the entropy' : 'Show the gain';
  S.draw(el(svg, 'g', {}), reveal);
}
function go(s, r) { step = Math.max(0, Math.min(STEPS.length - 1, s)); reveal = r === 'all' ? phases() : 0; draw(); history.replaceState(null, '', '#' + (step + 1)); }
// forward reveals the next hidden number first, then moves on; back returns to the previous step with everything shown
const fwd = () => { if (reveal < phases()) { reveal++; draw(); } else if (step < STEPS.length - 1) go(step + 1); };
const back = () => { if (reveal > 0) { reveal = 0; draw(); } else if (step > 0) go(step - 1, 'all'); };
$('prev').onclick = back; $('next').onclick = fwd; $('show').onclick = fwd;
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); fwd(); } else if (e.key === 'ArrowLeft') back(); });
draw();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walking the Cardiac Risk Tree</title>
</head>
<body>
<style>
  :root {
    color-scheme: light;
    --paper: #ffffff; --ink: #222222; --ink-2: #666666; --ink-3: #9a9a9a; --rule: #dcdcdc; --grid: #ececec; --ma: #2a78d6;
    --sans: "Helvetica Neue", Helvetica, -apple-system, Arial, sans-serif;
    --mono: Menlo, "SF Mono", Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  #app { height: 100vh; padding: 10px 14px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px; }
  .head { padding: 4px 16px 0; }
  h1 { margin: 0; font-size: clamp(24px, 2.4vw, 36px); font-weight: 700; letter-spacing: -0.01em; }
  .main { user-select: none; -webkit-user-select: none; min-height: 0; border: 1px solid var(--rule); border-radius: 6px; padding: 10px 16px; }
  .main svg { width: 100%; height: 100%; display: block; }
  svg text { font-family: var(--sans); }
  .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 18px; border: 1px solid var(--rule); border-radius: 6px; background: #f6f7f9; }
  button, select { font: inherit; font-size: 18px; color: var(--ink); background: #fff; border: 1px solid #9a9a9a; border-radius: 6px; padding: 9px 16px; cursor: pointer; }
  select { padding: 8px 10px; }
  button:hover, select:hover { border-color: var(--ink); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--ma); color: #fff; border-color: var(--ma); font-weight: 700; min-width: 120px; }
  .pick { display: inline-flex; align-items: center; gap: 6px; font-size: 17px; color: var(--ink-2); margin-left: 8px; }
  .step { font-family: var(--mono); font-size: 17px; color: var(--ink-2); margin-left: auto; }
  .hide { display: none !important; }
</style>

<div id="app">
  <div class="head"><h1 id="title"></h1></div>
  <div class="main"><svg id="fig" viewBox="0 0 1600 760"></svg></div>
  <div class="bar">
    <button id="prev" title="Previous step (←)">⏮ step</button>
    <button id="next" title="Next step (→)">step ⏭</button>
    <button id="play" class="primary" title="Walk the tree again (space)">▶ Walk</button>
    <span class="pick" id="picks">
      Age <select id="age"><option value="<40">under 40</option><option value="40–55">40–55</option><option value=">55">over 55</option></select>
      Family history <select id="fh"><option value="Yes">yes</option><option value="No">no</option></select>
      Exercise <select id="ex"><option value="Regularly">regularly</option><option value="Rarely">rarely</option></select>
    </span>
    <span class="step" id="stepno"></span>
  </div>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const el = (parent, tag, attrs, text) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; parent.appendChild(e); return e; };

// ------------------------------------------------------------ the chapter's 15 training patients and the chapter's tree
const P = [
  [1,'<40','No','Regularly','Low'], [2,'<40','No','Rarely','Low'], [3,'<40','No','Rarely','Low'],
  [4,'<40','Yes','Regularly','Low'], [5,'<40','Yes','Rarely','High'], [6,'40–55','No','Regularly','Low'],
  [7,'40–55','No','Rarely','High'], [8,'40–55','Yes','Regularly','High'], [9,'40–55','Yes','Rarely','High'],
  [10,'>55','No','Regularly','Low'], [11,'>55','Yes','Regularly','High'], [12,'>55','Yes','Rarely','High'],
  [13,'>55','No','Rarely','High'], [14,'<40','Yes','Regularly','High'], [15,'40–55','Yes','Regularly','Low']];
const ATTR = { age: { q: 'Age?', name: 'Age', col: 1 }, fh: { q: 'Family history?', name: 'Family history', col: 2 }, ex: { q: 'Exercise?', name: 'Exercise', col: 3 } };
const SHOW = { '<40': 'under 40', '40–55': '40–55', '>55': 'over 55', Yes: 'yes', No: 'no', Regularly: 'regularly', Rarely: 'rarely' };
const COL = { Low: '#1baf7a', High: '#d6453d', tie: '#c9a400' }, FILL = { Low: '#ddf3ea', High: '#fbe3e1', tie: '#fdf3cf' };
const leaf = () => ({});
const T = { a: 'fh', kids: [
  ['Yes', { a: 'ex', kids: [['Regularly', { a: 'age', kids: [['<40', leaf()], ['40–55', leaf()], ['>55', leaf()]] }], ['Rarely', leaf()]] }],
  ['No', { a: 'ex', kids: [['Regularly', leaf()], ['Rarely', { a: 'age', kids: [['<40', leaf()], ['40–55', leaf()], ['>55', leaf()]] }]] }]] };
// each leaf predicts the majority of the training patients that reach it; a tie stays a tie
(function label(n, set) {
  if (!n.kids) { const lo = set.filter(p => p[4] === 'Low').length, hi = set.length - lo; n.lo = lo; n.hi = hi; n.label = lo > hi ? 'Low' : hi > lo ? 'High' : 'tie'; return; }
  n.kids.forEach(([v, k]) => label(k, set.filter(p => p[ATTR[n.a].col] === v)));
})(T, P);

// ------------------------------------------------------------ layout: the tree on the right, the patient on the left
const TX = 500, TW = 1080, TY = 70, LVL = 190, QW = 196, QH = 50, LW = 124, LH = 62;
const leaves = n => n.kids ? n.kids.reduce((s, [, k]) => s + leaves(k), 0) : 1;
(function place(n, d, first) {
  n.y = TY + d * LVL;
  if (!n.kids) { n.x = TX + (first + 0.5) * TW / leaves(T); return; }
  let f = first; n.kids.forEach(([, k]) => { place(k, d + 1, f); f += leaves(k); });
  n.x = (n.kids[0][1].x + n.kids[n.kids.length - 1][1].x) / 2;
})(T, 0, 0);
const top = n => n.y - (n.kids ? QH : LH) / 2, bot = n => n.y + (n.kids ? QH : LH) / 2;

// the path a patient takes: each question asked, with the answer, then the leaf
function walk(pt) { const out = []; let n = T; while (n.kids) { const v = pt[n.a], k = n.kids.find(([u]) => u === v)[1]; out.push({ n, v, k }); n = k; } return { steps: out, leaf: n }; }

function drawTree(g, path, upto) {
  const on = new Set(path ? path.steps.slice(0, Math.ceil(upto)).map(s => s.k) : []); if (path) on.add(T);
  const edges = el(g, 'g', {}), labels = el(g, 'g', {}), nodes = el(g, 'g', {});
  (function draw(n) {
    if (n.kids) n.kids.forEach(([v, k]) => {
      const lit = on.has(k) && on.has(n);
      el(edges, 'line', { x1: n.x, y1: bot(n), x2: k.x, y2: top(k), stroke: lit ? '#2a78d6' : '#b4b4b4', 'stroke-width': lit ? 6 : 2.5, 'stroke-linecap': 'round' });
      // the answer beside its edge, left of a left edge and right of a right edge
      const dx = k.x - n.x, side = Math.abs(dx) < 30 ? 0 : Math.sign(dx), lx = n.x + 0.42 * dx, ly = bot(n) + 0.42 * (top(k) - bot(n));
      if (!side) el(labels, 'rect', { x: lx - 50, y: ly - 14, width: 100, height: 28, fill: '#fff' });
      el(labels, 'text', { x: lx + side * 8, y: ly + 7, 'text-anchor': side < 0 ? 'end' : side > 0 ? 'start' : 'middle', 'font-size': 20, fill: lit ? '#1d5fae' : '#555', 'font-weight': lit ? 700 : 400 }, v);
      draw(k);
    });
    const lit = on.has(n);
    if (n.kids) {
      el(nodes, 'rect', { x: n.x - QW / 2, y: top(n), width: QW, height: QH, rx: QH / 2, fill: '#e8f1fd', stroke: '#2a78d6', 'stroke-width': lit ? 5 : 2 });
      el(nodes, 'text', { x: n.x, y: n.y + 8, 'text-anchor': 'middle', 'font-size': 23, 'font-weight': 700, fill: '#1d5fae' }, ATTR[n.a].q);
    } else {
      el(nodes, 'rect', { x: n.x - LW / 2, y: top(n), width: LW, height: LH, rx: 8, fill: FILL[n.label], stroke: lit ? '#222' : COL[n.label], 'stroke-width': lit ? 5 : 2.5 });
      el(nodes, 'text', { x: n.x, y: n.y + (n.label === 'tie' ? -2 : 8), 'text-anchor': 'middle', 'font-size': 23, 'font-weight': 700, fill: n.label === 'tie' ? '#8a6d00' : COL[n.label] }, n.label === 'tie' ? 'Tie' : n.label);
      if (n.label === 'tie') el(nodes, 'text', { x: n.x, y: n.y + 22, 'text-anchor': 'middle', 'font-size': 16, fill: '#8a6d00' }, `${n.lo} Low, ${n.hi} High`);
    }
  })(T);
  // the patient, travelling down the path
  if (path && upto < path.steps.length) {
    const i = Math.floor(upto), f = upto - i, s = path.steps[i], x = s.n.x + (s.k.x - s.n.x) * f, y = bot(s.n) + (top(s.k) - bot(s.n)) * f;
    el(g, 'circle', { cx: x, cy: y, r: 15, fill: '#fff', stroke: '#222', 'stroke-width': 4 });
    el(g, 'circle', { cx: x, cy: y, r: 5, fill: '#222' });
  }
}
// the new patient's card: a row per feature, numbered in the order the tree asks; the prediction once the walk reaches a leaf
function card(g, pt, path, upto) {
  const X = 20, Y = 40, W = 420;
  el(g, 'text', { x: X, y: Y, 'font-size': 26, 'font-weight': 700, fill: '#222' }, 'New patient');
  const asked = path.steps.slice(0, Math.min(path.steps.length, Math.floor(upto) + 1)).map(s => s.n.a), cur = upto < path.steps.length ? path.steps[Math.floor(upto)].n.a : null;
  ['age', 'fh', 'ex'].forEach((a, r) => {
    const y = Y + 30 + r * 92, k = asked.indexOf(a), now = a === cur;
    el(g, 'rect', { x: X, y, width: W, height: 76, rx: 10, fill: k >= 0 ? '#e8f1fd' : '#f6f7f9', stroke: now ? '#2a78d6' : k >= 0 ? '#9cc0ec' : '#e2e2e2', 'stroke-width': now ? 4 : 2 });
    el(g, 'text', { x: X + 64, y: y + 32, 'font-size': 20, fill: '#666' }, ATTR[a].name);
    el(g, 'text', { x: X + 64, y: y + 62, 'font-size': 27, 'font-weight': 700, fill: '#222' }, SHOW[pt[a]]);
    if (k >= 0) { el(g, 'circle', { cx: X + 32, cy: y + 38, r: 18, fill: '#2a78d6' }); el(g, 'text', { x: X + 32, y: y + 45, 'text-anchor': 'middle', 'font-size': 20, 'font-weight': 700, fill: '#fff' }, k + 1); }
    else el(g, 'text', { x: X + 32, y: y + 45, 'text-anchor': 'middle', 'font-size': 18, fill: '#9a9a9a' }, '–');
  });
  const L = path.leaf, done = upto >= path.steps.length, y = Y + 330;
  el(g, 'text', { x: X, y, 'font-size': 22, fill: '#666' }, 'Prediction');
  el(g, 'rect', { x: X, y: y + 16, width: W, height: 110, rx: 12, fill: done ? FILL[L.label] : '#fff', stroke: done ? COL[L.label] : '#c9c9c9', 'stroke-width': 3, 'stroke-dasharray': done ? 'none' : '9 7' });
  el(g, 'text', { x: X + W / 2, y: y + 84, 'text-anchor': 'middle', 'font-size': 38, 'font-weight': 700, fill: done ? (L.label === 'tie' ? '#8a6d00' : COL[L.label]) : '#9a9a9a' },
    !done ? '?' : L.label === 'tie' ? 'Tie' : `${L.label} risk`);
  if (done) el(g, 'text', { x: X, y: y + 166, 'font-size': 21, fill: '#444' },
    `${path.steps.length} question${path.steps.length === 1 ? '' : 's'}, then ${L.label === 'tie' ? `a leaf with ${L.lo} Low and ${L.hi} High` : 'the leaf’s majority'}`);
}

// ------------------------------------------------------------ steps
const STEPS = [
  { title: 'What does the cardiac risk tree look like?' },
  { title: 'What does the tree predict for a new patient?', pt: { age: '40–55', fh: 'No', ex: 'Regularly' } },
  { title: 'What about a second patient?', pt: { age: '>55', fh: 'Yes', ex: 'Rarely' } },
  { title: 'What happens at a mixed leaf?', pt: { age: '<40', fh: 'Yes', ex: 'Regularly' } },
];
let step = 0, pt = null, upto = 0, timer = null;
function draw() {
  const S = STEPS[step], svg = $('fig'); svg.innerHTML = '';
  $('title').textContent = S.title; $('stepno').textContent = `step ${step + 1} of ${STEPS.length}`;
  $('prev').disabled = step === 0; $('next').disabled = step === STEPS.length - 1;
  $('play').classList.toggle('hide', !S.pt); $('picks').classList.toggle('hide', !S.pt);
  const g = el(svg, 'g', {});
  if (!S.pt) { drawTree(g, null, 0); return; }
  const path = walk(pt);
  card(g, pt, path, upto); drawTree(g, path, upto);
}
// one edge a second; the patient pauses briefly at each question
function play() {
  clearInterval(timer); upto = 0; const n = walk(pt).steps.length;
  timer = setInterval(() => { upto = Math.min(n, upto + 0.025); if (upto >= n) clearInterval(timer); draw(); }, 25);
  draw();
}
function go(s) {
  clearInterval(timer); step = Math.max(0, Math.min(STEPS.length - 1, s)); const S = STEPS[step];
  history.replaceState(null, '', '#' + (step + 1));
  if (S.pt) { pt = { ...S.pt }; ['age', 'fh', 'ex'].forEach(a => $(a).value = pt[a]); play(); } else draw();
}
$('prev').onclick = () => go(step - 1); $('next').onclick = () => go(step + 1); $('play').onclick = () => play();
['age', 'fh', 'ex'].forEach(a => $(a).addEventListener('change', () => { pt[a] = $(a).value; play(); }));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowRight') go(step + 1); else if (e.key === 'ArrowLeft') go(step - 1);
  else if (e.key === ' ' && STEPS[step].pt) { e.preventDefault(); play(); }
});
go((parseInt(location.hash.slice(1), 10) || 1) - 1);
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choosing the Root by Entropy (live)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
</head>
<body>
<style>
  :root {
    color-scheme: light;
    --paper: #ffffff; --ink: #222222; --ink-2: #666666; --ink-3: #9a9a9a; --rule: #dcdcdc; --ma: #2a78d6;
    --low: #1baf7a; --high: #d6453d; --mixed: #f2c230;
    --sans: "Helvetica Neue", Helvetica, -apple-system, Arial, sans-serif;
    --mono: Menlo, "SF Mono", Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  .hidden { display: none !important; }

  /* ---------- projector ---------- */
  #proj { height: 100vh; padding: 10px 14px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px; }
  #proj .head { padding: 4px 16px 0; }
  #proj h1 { margin: 0; font-size: clamp(24px, 2.4vw, 36px); font-weight: 700; letter-spacing: -0.01em; }
  #proj .main { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 18px; min-height: 0; border: 1px solid var(--rule); border-radius: 6px; padding: 14px 18px; user-select: none; -webkit-user-select: none; }
  
  #left { width: 100%; height: 100%; display: block; min-height: 0; }
  .side { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 12px; min-height: 0; }
  .join { display: flex; gap: 16px; align-items: center; background: #f6f8fb; border: 1px solid var(--rule); border-radius: 6px; padding: 10px 14px; }
  .join .qr svg { width: 150px; height: 150px; display: block; }
  .join .ask { font-size: 26px; font-weight: 700; line-height: 1.25; }
  .join .url { font-family: var(--mono); font-size: 14px; color: var(--ink-2); margin-top: 8px; word-break: break-all; }
  .join .count { font-family: var(--mono); font-size: 20px; color: var(--ma); font-weight: 700; margin-top: 8px; }
  .wall { overflow-y: auto; min-height: 0; padding-right: 6px; }
  .votes { margin: 4px 0 12px; }
  .vrow { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr) 44px; align-items: center; gap: 12px; font-size: 24px; margin: 12px 0; }
  .vtrack { position: relative; background: #f1f3f6; border-radius: 4px; height: 44px; overflow: hidden; }
  .vbar { display: block; height: 100%; background: var(--ma); border-radius: 4px; transition: width .4s; }
  .votes.res .vbar { opacity: .3; }
  .vacc { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-family: var(--mono); font-weight: 700; font-size: 26px; white-space: nowrap; }
  .vbest { font-family: var(--sans); font-size: 15px; font-weight: 700; color: #fff; background: var(--ink); border-radius: 4px; padding: 2px 8px; margin-left: 10px; vertical-align: 3px; }
  .vn { font-family: var(--mono); font-weight: 700; text-align: right; }
  .vlab small { display: block; font-size: 16px; color: var(--ink-2); margin-top: 2px; }
  .vrow.best .vlab { font-weight: 700; }
  .vrow.best .vtrack { box-shadow: 0 0 0 3px var(--ink); }
  .vnote { font-size: 20px; margin: 10px 2px; }
  .bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 18px; border: 1px solid var(--rule); border-radius: 6px; background: #f6f7f9; }
  button { font: inherit; font-size: 18px; color: var(--ink); background: #fff; border: 1px solid #9a9a9a; border-radius: 6px; padding: 9px 16px; cursor: pointer; }
  button:hover { border-color: var(--ink); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--ma); color: #fff; border-color: var(--ma); font-weight: 700; }
  .bar .status { margin-left: auto; font-family: var(--mono); font-size: 15px; color: var(--ink-2); }
  svg text { font-family: var(--sans); }
  .halo { paint-order: stroke; stroke: #fff; stroke-width: 6px; stroke-linejoin: round; }

  /* ---------- phone ---------- */
  #phone { max-width: 560px; margin: 0 auto; padding: 16px; }
  #phone h1 { font-size: 23px; margin: 6px 0 4px; }
  #phone .sub { color: var(--ink-2); font-size: 15px; margin: 0 0 12px; }
  #phone .vgrid { display: grid; gap: 10px; margin: 6px 0 14px; }
  #phone .vgrid h2 { font-size: 17px; margin: 10px 0 0; color: var(--ink-2); }
  #phone .vbtn { font-size: 20px; font-weight: 700; padding: 14px 14px; text-align: left; border: 1.5px solid #9a9a9a; border-radius: 8px; background: #fff; }
  #phone .vbtn.on { background: #e8f1fd; border-color: var(--ma); box-shadow: 0 0 0 2px var(--ma); }
  #phone button.primary { font-size: 19px; padding: 10px 22px; }
  #phone .msg { margin-top: 10px; font-size: 16px; min-height: 22px; }
  .side.hidden + * {}
  #proj .main:has(.side.hidden) { grid-template-columns: minmax(0, 1fr); }
  .join { flex-direction: column; align-items: flex-start; }
  .join .qr svg { width: 260px; height: 260px; }
  .join .ask { font-size: 24px; }
  #phone .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  #phone .chips span { color: #fff; font-weight: 700; font-size: 17px; padding: 5px 9px; border-radius: 6px; min-width: 34px; text-align: center; }
  #phone .big { font-size: 20px; font-weight: 700; margin: 6px 0 12px; }
  #phone .num { font-size: 24px; font-style: italic; display: flex; align-items: center; gap: 10px; }
  #phone .num input { font: inherit; font-style: normal; font-size: 24px; width: 160px; padding: 8px 10px; border: 1.5px solid #9a9a9a; border-radius: 8px; }
  #phone .vbtn.mono { font-family: var(--mono); font-size: 15px; font-weight: 400; }
</style>

<!-- projector view -->
<div id="proj" class="hidden">
  <div class="head"><h1 id="ptitle"></h1></div>
  <div class="main" id="main">
    <svg id="left" viewBox="0 0 1280 760" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="side" id="side">
      <div class="join">

      </div>
    </div>

<!-- phone view -->
<div id="phone" class="hidden">
  <h1 id="ftitle"></h1>
  <p class="sub">CS328 · Choose or type your answer, then send.</p>
  <div class="vgrid" id="vgrid"></div>
  <button class="primary hidden" id="vsend">Send</button>

<script>
(() => {
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
function el(parent, tag, attrs, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  parent.appendChild(e); return e;
}

// ------------------------------------------------------------ the 16 patients of the Build the Tree game (ch5/build-a-tree.html)
// age (0 <40, 1 40–55, 2 >55), family history (0 no, 1 yes), exercise (0 rarely, 1 regularly), risk (0 low, 1 high)
const PATIENTS = [[1,1,1,0,1],[2,0,0,0,0],[3,2,0,1,0],[4,1,1,1,0],[5,2,1,0,1],[6,0,1,1,0],[7,1,0,1,0],[8,2,0,0,1],
                  [9,1,1,1,1],[10,0,1,0,1],[11,2,1,1,1],[12,1,0,1,0],[13,1,1,0,1],[14,2,0,0,1],[15,1,1,1,0],[16,2,1,0,1]]
  .map(([id, age, fh, ex, risk]) => ({ id, age, fh, ex, risk }));
const pt = id => PATIENTS[id - 1];
const ALL = PATIENTS.map(p => p.id);
const ATTR = {
  fh:  { name: 'Family history', q: 'Family history?', vals: ['No', 'Yes'], group: ['with no family history', 'with a family history'] },
  age: { name: 'Age', q: 'Age?', vals: ['<40', '40–55', '>55'], group: ['under 40', 'aged 40 to 55', 'over 55'] },
  ex:  { name: 'Exercise', q: 'Exercise?', vals: ['Rarely', 'Regularly'], group: ['who exercise rarely', 'who exercise regularly'] },
};
const ORDER = ['fh', 'age', 'ex'];
const COL = { 0: '#1baf7a', 1: '#d6453d' };

// ------------------------------------------------------------ entropy and information gain, rounded to three places at each stage so the written arithmetic adds up
const r3 = v => Math.round(v * 1000) / 1000, f3 = v => v.toFixed(3);
const hi = ids => ids.filter(i => pt(i).risk).length;
const H = ids => { const n = ids.length, a = hi(ids); return r3([a, n - a].reduce((s, c) => c ? s - c / n * Math.log2(c / n) : s, 0)); };
const split = (ids, a) => ATTR[a].vals.map((_, v) => ids.filter(i => pt(i)[a] === v));
const weighted = (ids, a) => r3(split(ids, a).filter(g => g.length).reduce((s, g) => s + g.length / ids.length * H(g), 0));
const gain = (ids, a) => r3(H(ids) - weighted(ids, a));
const pure = ids => new Set(ids.map(i => pt(i).risk)).size < 2;
const isLeaf = n => n.leaf !== undefined;
const depthOf = n => n.path.split('/').length - 1;
function grow(ids, attrs, path, choose) {
  const node = { ids, path };
  if (pure(ids) || !attrs.length) { node.leaf = pure(ids) ? pt(ids[0]).risk : 'mixed'; return node; }
  const a = choose(node, attrs); if (!a) return node;
  node.attr = a; node.attrs = attrs;
  node.kids = split(ids, a).map((g, v) => ({ v, node: g.length ? grow(g, attrs.filter(x => x !== a), path + a + v + '/', choose) : null })).filter(k => k.node);
  return node;
}
const best = (ids, attrs) => attrs.reduce((b, a) => (gain(ids, a) > gain(ids, b) ? a : b));
const treeTo = depth => grow(ALL, ORDER, '', (n, attrs) => depthOf(n) < depth ? best(n.ids, attrs) : null);
const TREE = treeTo(9);
const find = (n, path) => n.path === path ? n : (n.kids || []).map(k => find(k.node, path)).find(Boolean);
// how a group is described: the answers on the way down to it
const describe = path => { const seg = path.split('/').filter(Boolean).map(s => [s.replace(/\d$/, ''), +s.slice(-1)]);
  return ['age', 'ex', 'fh'].map(a => seg.find(q => q[0] === a)).filter(Boolean).map(([a, v]) => ATTR[a].group[v]).join(' '); };   // age first reads naturally: under 40 who exercise rarely
const tally = ids => `${hi(ids)} High, ${ids.length - hi(ids)} Low`;
const terms = ids => { const n = ids.length, a = hi(ids); return [a, n - a].filter(c => c).map((c, i) => `${i ? '− ' : '−'}(${c}/${n}) log₂(${c}/${n})`); };
const working = ids => { const n = ids.length, a = hi(ids); return [a, n - a].filter(c => c).map((c, i) => `${i ? ' − ' : '−'}(${c}/${n}) log₂(${c}/${n})`).join(''); };

function chips(g, ids, x, y, w, s) {
  const cw = 44 * s, ch = 34 * s, gap = 6 * s, per = Math.max(1, Math.floor((w + gap) / (cw + gap)));
  const n = Math.min(per, ids.length), x0 = x + (w - (n * cw + (n - 1) * gap)) / 2;
  ids.forEach((id, i) => {
    const cx = x0 + (i % per) * (cw + gap), cy = y + Math.floor(i / per) * (ch + gap);
    el(g, 'rect', { x: cx, y: cy, width: cw, height: ch, rx: 6 * s, fill: COL[pt(id).risk] });
    el(g, 'text', { x: cx + cw / 2, y: cy + ch / 2 + 7.5 * s, 'text-anchor': 'middle', 'font-size': 21 * s, 'font-weight': 700, fill: '#fff' }, id);
  });
}
function drawTree(g, tree, x, y, w, h, s, cur) {
  const kids = n => n.kids || [];
  const leaves = n => kids(n).length ? kids(n).reduce((t, k) => t + leaves(k.node), 0) : 1;
  const depth = n => kids(n).length ? 1 + Math.max(...kids(n).map(k => depth(k.node))) : 0;
  const nL = leaves(tree), D = depth(tree), slot = w / nL, lvl = D ? Math.min((h - 120 * s) / D, 170 * s) : 0;
  const edges = el(g, 'g', {}), labels = el(g, 'g', {}), nodes = el(g, 'g', {});
  function place(n, d, first) {
    const ks = kids(n); let cx;
    if (!ks.length) cx = x + (first + 0.5) * slot;
    else { let f = first; const xs = ks.map(k => { const r = place(k.node, d + 1, f); f += leaves(k.node); return r; }); cx = (xs[0] + xs[xs.length - 1]) / 2;
      ks.forEach((k, i) => { const cy = y + d * lvl, ky = y + (d + 1) * lvl;
        el(edges, 'line', { x1: cx, y1: cy + 24 * s, x2: xs[i], y2: ky - 4 * s, stroke: '#9a9a9a', 'stroke-width': 2 * s });
        // the answer beside its edge: left of a left edge, right of a right edge, so neighbouring labels do not collide
        const lab = ATTR[n.attr].vals[k.v], dx = xs[i] - cx, lx = cx + 0.4 * dx, ly = cy + 0.4 * (ky - cy), side = Math.abs(dx) < 40 * s ? 0 : Math.sign(dx);
        if (!side) { const lw = lab.length * 11 * s + 10 * s; el(labels, 'rect', { x: lx - lw / 2, y: ly - 10 * s, width: lw, height: 26 * s, fill: '#fff' }); }
        el(labels, 'text', { x: lx + side * 6 * s, y: ly + 8 * s, 'text-anchor': side < 0 ? 'end' : side > 0 ? 'start' : 'middle', 'font-size': 19 * s, fill: '#444' }, lab); }); }
    const cy = y + d * lvl;
    if (ks.length) {                                                     // a question
      const bw = 186 * s;
      el(nodes, 'rect', { x: cx - bw / 2, y: cy - 24 * s, width: bw, height: 48 * s, rx: 24 * s, fill: '#e8f1fd', stroke: '#2a78d6', 'stroke-width': 2 * s });
      el(nodes, 'text', { x: cx, y: cy + 8 * s, 'text-anchor': 'middle', 'font-size': 23 * s, 'font-weight': 700, fill: '#1d5fae' }, ATTR[n.attr].q);
    } else {                                                             // a leaf, or a group still waiting for its question
      const open = !isLeaf(n), here = open && [].concat(cur).includes(n.path), bw = Math.min(slot - 10 * s, 160 * s);
      const cs = 0.9 * s, per = Math.max(1, Math.floor((bw - 10 * s + 6 * cs) / (50 * cs))), rows = Math.ceil(n.ids.length / per);
      const bh = 52 * s + rows * 40 * cs, tp = cy - 4 * s;
      const fill = open ? '#fff' : n.leaf === 'mixed' ? '#fdf3cf' : n.leaf ? '#fbe3e1' : '#ddf3ea';
      const stroke = open ? (here ? '#2a78d6' : '#9a9a9a') : n.leaf === 'mixed' ? '#f2c230' : COL[n.leaf];
      el(nodes, 'rect', { x: cx - bw / 2, y: tp, width: bw, height: bh, rx: 8 * s, fill, stroke, 'stroke-width': (here ? 5 : 2) * s, 'stroke-dasharray': open && !here ? 8 * s + ' ' + 6 * s : 'none' });
      el(nodes, 'text', { x: cx, y: tp + 30 * s, 'text-anchor': 'middle', 'font-size': 23 * s, 'font-weight': 700, fill: open ? '#666' : n.leaf === 'mixed' ? '#8a6d00' : COL[n.leaf] },
        open || n.leaf === 'mixed' ? '?' : n.leaf ? 'High' : 'Low');
      chips(nodes, n.ids, cx - bw / 2 + 5 * s, tp + 42 * s, bw - 10 * s, cs);
    }
    return cx;
  }
  place(tree, 0, 0);
}


// ------------------------------------------------------------ layout: a small tree on the left showing where we are, the working to its right
const X0 = 370, XB = 1090, XC = 1345;   // start of the boxes, end of the boxes, centre of the arithmetic column
const Q = '?';
// the patients as a table, as in the Build the Tree game
function table(g, ids, x, y, w, rh) {
  const cols = [['ID', 0.07], ['Age', 0.24], ['Family history', 0.46], ['Exercise', 0.7], ['Risk', 0.9]];
  cols.forEach(([h, f]) => el(g, 'text', { x: x + f * w, y: y + rh * 0.65, 'text-anchor': 'middle', 'font-size': 23, 'font-weight': 700, fill: '#666' }, h));
  el(g, 'line', { x1: x, x2: x + w, y1: y + rh, y2: y + rh, stroke: '#9a9a9a', 'stroke-width': 1.5 });
  ids.forEach((id, i) => {
    const p = pt(id), yy = y + rh * (i + 1);
    if (i % 2) el(g, 'rect', { x, y: yy, width: w, height: rh, fill: '#f6f7f9' });
    [id, ATTR.age.vals[p.age], ATTR.fh.vals[p.fh], ATTR.ex.vals[p.ex]].forEach((c, k) => el(g, 'text', { x: x + cols[k][1] * w, y: yy + rh * 0.68, 'text-anchor': 'middle', 'font-size': 23, fill: '#222', 'font-weight': k ? 400 : 700 }, c));
    el(g, 'text', { x: x + cols[4][1] * w, y: yy + rh * 0.68, 'text-anchor': 'middle', 'font-size': 23, 'font-weight': 700, fill: COL[p.risk] }, p.risk ? 'High' : 'Low');
  });
}

// the same web app as ch4/spot-the-difference.html; this game uses its rounds 17 to 19, with its answers tagged "ent:". Add ?test or #test for a local test (this browser only).
const TEST = /(^|[?&#])test\b/.test(location.search + location.hash);
const API = TEST ? '' : 'https://script.google.com/macros/s/AKfycbwl9bZajvzRGBFQHL9rMPdHwL7kuF76KvjF3JYfCNU7UIzaei5437aBAuwjlYRwin8SLA/exec';
const BUILD = '2026-10-21a';

// ------------------------------------------------------------ backend: the Apps Script web app, or localStorage in test mode
const LS = { round: 'el-round', answers: 'el-answers' };   // test mode keeps its own answers
const today = () => new Date().toISOString().slice(0, 10);
// the session the votes belong to: today's date, or after a reset a fresh id, so earlier votes no longer count (the sheet keeps them)
const session = () => { try { const s = JSON.parse(localStorage.getItem('bt-session') || 'null'); if (s && s.day === today()) return s.id; } catch (_) {} return today(); };
const newSession = () => { const id = 'r' + Date.now().toString(36); try { localStorage.setItem('bt-session', JSON.stringify({ day: today(), id })); } catch (_) {} return id; };
// the web app can take several seconds to reply; give up after 15 s so a phone never waits forever
const getJSON = async url => { const c = new AbortController(), t = setTimeout(() => c.abort(), 15000);
  try { return await (await fetch(url, { signal: c.signal })).json(); } catch (e) { throw e.name === 'AbortError' ? new Error('no reply in 15 s') : e; } finally { clearTimeout(t); } };
const api = {
  async getRound() {
    if (!API) return JSON.parse(localStorage.getItem(LS.round) || '{"round":17}');
    return getJSON(`${API}?action=round&t=${Date.now()}`);
  },
  async setRound(round, key) {
    if (!API) { localStorage.setItem(LS.round, JSON.stringify({ round, session: today() })); return { ok: true }; }
    return getJSON(`${API}?action=setRound&round=${round}&session=${session()}&key=${encodeURIComponent(key)}`);
  },
  async submit(round, text) {
    if (!API) { const a = JSON.parse(localStorage.getItem(LS.answers) || '[]'); a.push({ t: Date.now(), round, text, session: today() }); localStorage.setItem(LS.answers, JSON.stringify(a)); return { ok: true }; }
    return getJSON(`${API}?action=submit&round=${round}&text=${encodeURIComponent(text)}`);
  },
  async list(round) {
    if (!API) return { answers: JSON.parse(localStorage.getItem(LS.answers) || '[]').filter(a => a.round === round && a.session === today()) };
    return getJSON(`${API}?action=list&round=${round}&t=${Date.now()}`);
  },
};

// ------------------------------------------------------------ the live game: three rounds at the root, all answers tagged "ent:" so they never mix with other games
// round 17: every phone works out the entropy of one branch, "ent:h.<attr><value>=<number>"
// round 18: the right weighted sum for each question, "ent:w.fh=<k>,age=<k>,ex=<k>" (k: 0 right, 1 plain average, 2 weights swapped, 3 counts as weights)
// round 19: the question with the most information gain, "ent:g=<attr>"
const R = { h: 17, w: 18, g: 19 };
// each task has its own QR code (?phone&task=h, w or g): the phone goes straight to that task, with no key and no following the projector
const TASK = { h: R.h, w: R.w, g: R.g };
// Reset votes is kept on the projector: answers sent before the last reset are ignored, so no key is needed
const RESET = 'el-reset';
const since = () => { try { return +localStorage.getItem(RESET) || 0; } catch (_) { return 0; } };
const BRANCHES = ORDER.flatMap(a => split(ALL, a).map((ids, v) => ({ key: a + v, a, v, ids })));
const ORDER_OPT = { fh: [2, 0, 3, 1], age: [1, 3, 0, 2], ex: [3, 1, 2, 0] };   // the A to D order of the four sums, fixed so phone and projector agree
const LETTER = ['A', 'B', 'C', 'D'];
const frac = k => ({ 2: '½', 3: '⅓' })[k];
function sums(a) {
  const parts = split(ALL, a), N = ALL.length, n = parts.map(p => p.length), h = parts.map(p => f3(H(p)));
  return [
    parts.map((_, i) => `(${n[i]}/${N})(${h[i]})`).join(' + '),
    parts.map((_, i) => `${frac(parts.length)}(${h[i]})`).join(' + '),
    parts.map((_, i) => `(${n[n.length - 1 - i]}/${N})(${h[i]})`).join(' + '),
    parts.map((_, i) => `${n[i]}(${h[i]})`).join(' + ')];
}
// each device's latest answer in a round, among the answers of this game
function latest(answers) {
  const by = {};
  (answers || []).forEach(x => { const m = x.text.match(/^ent:([^;]*)(?:;d=(\w+))?/); if (m) by[m[2] || x.t] = m[1]; });
  return Object.values(by);
}
const median = xs => { const s = xs.slice().sort((p, q) => p - q), m = s.length >> 1; return s.length ? (s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2) : null; };

// ------------------------------------------------------------ projector
function projector() {
  $('proj').classList.remove('hidden');
  let step = Math.max(0, parseInt((location.hash.match(/step=(\d+)/) || [])[1] || '1', 10) - 1), shown = 0;
  const ans = { 17: [], 18: [], 19: [] }, page = location.origin + location.pathname;
  // round 17: the class's answers for each branch; round 18: votes per question and option; round 19: votes per question
  const hAns = () => { const out = {}; latest(ans[17]).forEach(s => { const m = s.match(/^h\.(\w+?\d)=([-\d.]+)$/); if (m && isFinite(+m[2])) (out[m[1]] = out[m[1]] || []).push(+m[2]); }); return out; };
  const wAns = () => { const out = {}; ORDER.forEach(a => out[a] = [0, 0, 0, 0]); let n = 0;
    latest(ans[18]).forEach(s => { const m = s.match(/^w\.(.*)$/); if (!m) return; n++; m[1].split(',').forEach(p => { const [a, k] = p.split('='); if (out[a] && out[a][+k] != null) out[a][+k]++; }); }); return { out, n }; };
  const gAns = () => { const out = { fh: 0, age: 0, ex: 0 }; let n = 0; latest(ans[19]).forEach(s => { const m = s.match(/^g=(\w+)$/); if (m && out[m[1]] != null) { out[m[1]]++; n++; } }); return { out, n }; };

  const STEPS = [
    { title: 'How mixed are the 16 patients?', reveal: true, draw(g, r) {
        table(g, ALL, 0, 0, 760, 42);
        el(g, 'text', { x: 1150, y: 300, 'text-anchor': 'middle', 'font-size': 32, 'font-weight': 700, fill: '#222' }, tally(ALL));
        if (!r) el(g, 'text', { x: 1150, y: 400, 'text-anchor': 'middle', 'font-size': 40, 'font-style': 'italic', fill: '#222' }, `H = ${Q}`);
        else { el(g, 'text', { x: 1150, y: 390, 'text-anchor': 'middle', 'font-size': 29, 'font-style': 'italic', fill: '#222' }, `H = ${working(ALL)}`);
               el(g, 'text', { x: 1150, y: 450, 'text-anchor': 'middle', 'font-size': 36, 'font-weight': 700, 'font-style': 'italic', fill: '#222' }, `= ${f3(H(ALL))}`); }
      } },
    { title: 'What is the entropy of your group?', round: R.h, task: 'h', reveal: true, ask: 'Work out the entropy of the group on your phone.', draw: (g, r) => branches(g, r) },
    { title: 'Which weighted sum is right for each question?', round: R.w, task: 'w', reveal: true, ask: 'Pick the right weighted sum for each question.', draw: (g, r) => weightedVote(g, r) },
    { title: 'Which question gives the most information gain?', round: R.g, task: 'g', reveal: true, ask: 'Which question would you ask first?', draw: (g, r) => gainVote(g, r) },
    { title: 'What does the tree look like after the first question?', draw: g => drawTree(g, treeTo(1), 150, 60, 1000, 640, 1.2, null) },
  ];

  // every branch of every question, with the class's answers under it: their spread, their median, then the true value
  function branches(g, r) {
    const A = hAns(), rowH = 245, X = 20, W = 1240;
    ORDER.forEach((a, row) => {
      const y = 10 + row * rowH, parts = split(ALL, a), gap = 18, bw = (W - 200 - gap * (parts.length - 1)) / parts.length;
      el(g, 'text', { x: X, y: y + 110, 'font-size': 27, 'font-weight': 700, fill: '#222' }, ATTR[a].q);
      parts.forEach((p, v) => {
        const bx = X + 200 + v * (bw + gap), xs = A[a + v] || [], md = median(xs);
        el(g, 'text', { x: bx + bw / 2, y: y + 20, 'text-anchor': 'middle', 'font-size': 20, fill: '#666', 'font-weight': 700 }, ATTR[a].vals[v]);
        el(g, 'rect', { x: bx, y: y + 30, width: bw, height: 96, rx: 8, fill: '#fafafa', stroke: '#dcdcdc', 'stroke-width': 1.5 });
        chips(g, p, bx + 8, y + 38, bw - 16, 0.85);
        // the answers along a line from 0 to 1; values outside sit at the ends
        const L = bx + 20, Rr = bx + bw - 20, ax = v2 => L + Math.max(0, Math.min(1, v2)) * (Rr - L), ly = y + 170;
        el(g, 'line', { x1: L, x2: Rr, y1: ly, y2: ly, stroke: '#9a9a9a', 'stroke-width': 1.5 });
        [0, 0.5, 1].forEach(t => el(g, 'text', { x: ax(t), y: ly + 22, 'text-anchor': 'middle', 'font-size': 15, fill: '#888', 'font-family': 'Menlo, monospace' }, t));
        xs.forEach((v2, i) => el(g, 'circle', { cx: ax(v2), cy: ly - 8 - (i % 3) * 8, r: 5, fill: '#2a78d6', 'fill-opacity': 0.55 }));
        el(g, 'text', { x: bx + bw / 2, y: y + 146, 'text-anchor': 'middle', 'font-size': 18, fill: '#444' }, `${xs.length} answer${xs.length === 1 ? '' : 's'}${md != null && r ? ` · class: ${md.toFixed(3)}` : ''}`);
        el(g, 'text', { x: bx + bw / 2, y: y + 222, 'text-anchor': 'middle', 'font-size': 23, 'font-style': 'italic', 'font-weight': r ? 700 : 400, fill: '#222' }, `H = ${r ? f3(H(p)) : Q}`);
        if (r) el(g, 'line', { x1: ax(H(p)), x2: ax(H(p)), y1: ly - 34, y2: ly + 6, stroke: '#c0392b', 'stroke-width': 3 });
      });
      if (row < 2) el(g, 'line', { x1: X, x2: X + W, y1: y + rowH - 6, y2: y + rowH - 6, stroke: '#ececec', 'stroke-width': 1.5 });
    });
  }
  // the four sums for each question, A to D, with the votes for each; the right one marked once revealed
  function weightedVote(g, r) {
    const { out } = wAns(), rowH = 245, X = 20;
    ORDER.forEach((a, row) => {
      const y = 10 + row * rowH, S = sums(a), cnt = out[a], mx = Math.max(1, ...cnt);
      el(g, 'text', { x: X, y: y + 30, 'font-size': 27, 'font-weight': 700, fill: '#222' }, ATTR[a].q);
      el(g, 'text', { x: X, y: y + 62, 'font-size': 19, fill: '#666' }, split(ALL, a).map((p, v) => `${ATTR[a].vals[v]}: ${p.length} patients, H = ${f3(H(p))}`).join('   ·   '));
      ORDER_OPT[a].forEach((k, j) => {
        const yy = y + 80 + j * 40, ok = r && k === 0;
        el(g, 'text', { x: X + 10, y: yy + 26, 'font-size': 22, 'font-weight': 700, fill: ok ? '#c0392b' : '#222' }, LETTER[j]);
        el(g, 'text', { x: X + 46, y: yy + 26, 'font-size': 22, 'font-family': 'Menlo, monospace', fill: ok ? '#c0392b' : '#222', 'font-weight': ok ? 700 : 400 }, S[k]);
        el(g, 'rect', { x: 900, y: yy + 6, width: 300, height: 28, rx: 4, fill: '#f1f3f6' });
        el(g, 'rect', { x: 900, y: yy + 6, width: 300 * cnt[k] / mx, height: 28, rx: 4, fill: ok ? '#c0392b' : '#2a78d6', opacity: r && !ok ? 0.35 : 1 });
        el(g, 'text', { x: 1215, y: yy + 28, 'font-size': 21, 'font-weight': 700, 'font-family': 'Menlo, monospace', fill: '#222' }, cnt[k]);
      });
      if (row < 2) el(g, 'line', { x1: X, x2: 1260, y1: y + rowH - 6, y2: y + rowH - 6, stroke: '#ececec', 'stroke-width': 1.5 });
    });
  }
  // the three questions with their weighted sums written out, the class's votes, then the gains and the best
  function gainVote(g, r) {
    const { out } = gAns(), mx = Math.max(1, ...Object.values(out)), rowH = 245, X = 20, bestA = best(ALL, ORDER);
    ORDER.forEach((a, row) => {
      const y = 10 + row * rowH, cy = y + 110, on = r && a === bestA;
      el(g, 'text', { x: X, y: cy - 40, 'font-size': 27, 'font-weight': 700, fill: '#222' }, ATTR[a].q);
      el(g, 'text', { x: X, y: cy, 'font-size': 21, 'font-family': 'Menlo, monospace', fill: '#444' }, sums(a)[0]);
      el(g, 'text', { x: X, y: cy + 38, 'font-size': 23, fill: '#222' }, `weighted entropy = ${r ? f3(weighted(ALL, a)) : Q}`);
      el(g, 'text', { x: X, y: cy + 78, 'font-size': 26, 'font-weight': 700, fill: on ? '#c0392b' : '#222' }, r ? `gain = ${f3(H(ALL))} − ${f3(weighted(ALL, a))} = ${f3(gain(ALL, a))}` : `gain = ${Q}`);
      el(g, 'rect', { x: 860, y: cy - 22, width: 340, height: 44, rx: 5, fill: '#f1f3f6', stroke: on ? '#222' : 'none', 'stroke-width': 3 });
      el(g, 'rect', { x: 860, y: cy - 22, width: 340 * out[a] / mx, height: 44, rx: 5, fill: '#2a78d6' });
      el(g, 'text', { x: 1215, y: cy + 9, 'font-size': 24, 'font-weight': 700, 'font-family': 'Menlo, monospace', fill: '#222' }, out[a]);
      if (on) { el(g, 'rect', { x: 860, y: cy + 34, width: 76, height: 28, rx: 5, fill: '#222' }); el(g, 'text', { x: 898, y: cy + 55, 'text-anchor': 'middle', 'font-size': 17, 'font-weight': 700, fill: '#fff' }, 'BEST'); }
      if (row < 2) el(g, 'line', { x1: X, x2: 1260, y1: y + rowH - 6, y2: y + rowH - 6, stroke: '#ececec', 'stroke-width': 1.5 });
    });
  }

  function qr(task) {
    const url = page + '?phone&task=' + task + (TEST ? '&test' : '') + '&v=' + BUILD;
    try { const c = qrcode(0, 'M'); c.addData(url); c.make(); $('qr').innerHTML = c.createSvgTag({ cellSize: 5, margin: 2, scalable: true }); } catch (_) { $('qr').textContent = ''; }
  }
  function show() {
    const S = STEPS[step];
    $('ptitle').textContent = S.title;
    $('side').classList.toggle('hidden', !S.round);
    $('prev').disabled = step === 0 && shown === 0;
    const last = step === STEPS.length - 1;
    $('next').textContent = S.reveal && !shown ? (S.round ? 'Show the answers' : 'Show H') : last ? '' : 'Next';
    $('next').classList.toggle('hidden', last && (!S.reveal || shown));
    if (S.round) {
      $('ask').textContent = S.ask;
      const n = S.round === R.h ? latest(ans[17]).length : S.round === R.w ? wAns().n : gAns().n;
      $('pcount').textContent = `${n} answer${n === 1 ? '' : 's'}`;
      qr(S.task);
    }
    const svg = $('left'); svg.innerHTML = ''; S.draw(el(svg, 'g', {}), shown);
    history.replaceState(null, '', '#step=' + (step + 1) + (TEST ? '&test' : ''));
  }
  async function poll() {
    try {
      let changed = false;
      await Promise.all([17, 18, 19].map(async r => { const a = ((await api.list(r)).answers || []).filter(x => x.t > since()).sort((p, o) => p.t - o.t); if (a.length !== ans[r].length) changed = true; ans[r] = a; }));
      if (changed) show();
      $('status').textContent = API ? 'live' : 'test mode (this browser only)';
    } catch (e) { $('status').textContent = 'cannot reach the answer sheet'; }
  }
  const fwd = () => { const S = STEPS[step]; if (S.reveal && !shown) { shown = 1; show(); } else if (step < STEPS.length - 1) { step++; shown = 0; show(); } };
  const back = () => { if (shown) { shown = 0; show(); } else if (step > 0) { step--; shown = STEPS[step].reveal ? 1 : 0; show(); } };
  $('next').onclick = fwd; $('prev').onclick = back;
  $('reset').onclick = async () => {
    if (!confirm('Clear all the answers and start again?')) return;
    try { localStorage.setItem(RESET, String(Date.now())); } catch (_) {}
    if (!API) localStorage.removeItem(LS.answers);
    Object.keys(ans).forEach(r => ans[r] = []); show(); poll();
  };
  document.addEventListener('keydown', e => { if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); fwd(); } else if (e.key === 'ArrowLeft') back(); });
  show();
  (async function loop() { await poll(); setTimeout(loop, 3000); })();
}

// ------------------------------------------------------------ phone: the task its QR code names
function phone() {
  $('phone').classList.remove('hidden');
  let round = 0, busy = false, dev = '', picked = {};
  try { dev = localStorage.getItem('sd-dev') || ''; if (!dev) { dev = Math.random().toString(36).slice(2, 10); localStorage.setItem('sd-dev', dev); } } catch (_) { dev = Math.random().toString(36).slice(2, 10); }
  // the branch this phone works out: fixed by the device, so a reload keeps the same group
  const mine = BRANCHES[[...dev].reduce((s, c) => (s * 31 + c.charCodeAt(0)) >>> 0, 7) % BRANCHES.length];
  $('ftitle').textContent = 'Loading the question…';
  const chipRow = ids => `<div class="chips">${ids.map(i => `<span style="background:${COL[pt(i).risk]}">${i}</span>`).join('')}</div>`;
  function draw() {
    const G = $('vgrid'); G.innerHTML = ''; $('vsend').classList.toggle('hidden', !round);
    if (round === R.h) {
      $('ftitle').textContent = 'What is the entropy of your group?';
      G.innerHTML = `<h2>${ATTR[mine.a].name}: ${ATTR[mine.a].vals[mine.v]}</h2>${chipRow(mine.ids)}<p class="big">${tally(mine.ids)}</p>
        <label class="num">H = <input id="hval" type="number" inputmode="decimal" step="0.001" min="0" max="1" placeholder="0.000"></label>`;
    } else if (round === R.w) {
      $('ftitle').textContent = 'Which weighted sum is right?';
      ORDER.forEach(a => {
        const h = document.createElement('h2'); h.textContent = ATTR[a].q + '  ' + split(ALL, a).map((p, v) => `${ATTR[a].vals[v]}: ${p.length}, H = ${f3(H(p))}`).join(' · '); G.appendChild(h);
        const S = sums(a);
        ORDER_OPT[a].forEach((k, j) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'vbtn mono' + (picked[a] === k ? ' on' : ''); b.textContent = `${LETTER[j]}  ${S[k]}`; b.onclick = () => { picked[a] = k; draw(); }; G.appendChild(b); });
      });
    } else if (round === R.g) {
      $('ftitle').textContent = 'Which question gives the most information gain?';
      ORDER.forEach(a => { const b = document.createElement('button'); b.type = 'button'; b.className = 'vbtn' + (picked.g === a ? ' on' : ''); b.textContent = ATTR[a].name; b.onclick = () => { picked.g = a; draw(); }; G.appendChild(b); });
    } else $('ftitle').textContent = 'Waiting for the next question…';
  }
  const task = new URLSearchParams(location.search).get('task');
  if (TASK[task]) { round = TASK[task]; $('vmsg').textContent = API ? '' : 'Test mode: answers stay on this device.'; draw(); }
  else $('ftitle').textContent = 'Scan the code on the screen to open the question.';
  $('vsend').onclick = async () => {
    let text;
    if (round === R.h) { const v = parseFloat(($('hval') || {}).value); if (!isFinite(v)) { $('vmsg').textContent = 'Type your value of H first.'; return; } text = `h.${mine.key}=${v}`; }
    else if (round === R.w) { if (ORDER.some(a => picked[a] == null)) { $('vmsg').textContent = 'Pick one sum for each question first.'; return; } text = 'w.' + ORDER.map(a => `${a}=${picked[a]}`).join(','); }
    else if (round === R.g) { if (!picked.g) { $('vmsg').textContent = 'Tap one first.'; return; } text = 'g=' + picked.g; }
    else return;
    if (busy) return;
    busy = true; $('vsend').disabled = true; $('vmsg').textContent = 'Sending…';
    try { const r = await api.submit(round, 'ent:' + text + ';d=' + dev); $('vmsg').textContent = r.ok ? 'Sent. To change it, edit and send again.' : 'Not sent (' + (r.error || 'unknown') + '); try again.'; }
    catch (e) { $('vmsg').textContent = 'Not sent (' + (e && e.message || e) + '); try again.'; }
    busy = false; $('vsend').disabled = false;
  };
}

if (new URLSearchParams(location.search).has('phone')) phone(); else projector();
})();
</script>

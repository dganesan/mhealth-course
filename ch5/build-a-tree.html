<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build the Tree</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
</head>
<body>
<style>
  :root {
    color-scheme: light;
    --paper: #ffffff; --ink: #222222; --ink-2: #666666; --ink-3: #9a9a9a; --rule: #dcdcdc; --ma: #2a78d6;
    --low: #1baf7a; --high: #d6453d; --mixed: #f2c230;
    --sans: "Helvetica Neue", Helvetica, -apple-system, Arial, sans-serif;
    --mono: Menlo, "SF Mono", Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  .hidden { display: none !important; }

  /* ---------- projector ---------- */
  #proj { height: 100vh; padding: 10px 14px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px; }
  #proj .head { padding: 4px 16px 0; }
  #proj h1 { margin: 0; font-size: clamp(24px, 2.4vw, 36px); font-weight: 700; letter-spacing: -0.01em; }
  #proj .main { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 18px; min-height: 0; border: 1px solid var(--rule); border-radius: 6px; padding: 14px 18px; user-select: none; -webkit-user-select: none; }
  #proj .main.full { grid-template-columns: minmax(0, 1fr); }
  #left { width: 100%; height: 100%; display: block; min-height: 0; }
  .side { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 12px; min-height: 0; }
  .join { display: flex; gap: 16px; align-items: center; background: #f6f8fb; border: 1px solid var(--rule); border-radius: 6px; padding: 10px 14px; }
  .join .qr svg { width: 150px; height: 150px; display: block; }
  .join .ask { font-size: 26px; font-weight: 700; line-height: 1.25; }
  .join .url { font-family: var(--mono); font-size: 14px; color: var(--ink-2); margin-top: 8px; word-break: break-all; }
  .join .count { font-family: var(--mono); font-size: 20px; color: var(--ma); font-weight: 700; margin-top: 8px; }
  .wall { overflow-y: auto; min-height: 0; padding-right: 6px; }
  .votes { margin: 4px 0 12px; }
  .vrow { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr) 44px; align-items: center; gap: 12px; font-size: 24px; margin: 12px 0; }
  .vtrack { position: relative; background: #f1f3f6; border-radius: 4px; height: 44px; overflow: hidden; }
  .vbar { display: block; height: 100%; background: var(--ma); border-radius: 4px; transition: width .4s; }
  .votes.res .vbar { opacity: .3; }
  .vacc { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-family: var(--mono); font-weight: 700; font-size: 26px; white-space: nowrap; }
  .vbest { font-family: var(--sans); font-size: 15px; font-weight: 700; color: #fff; background: var(--ink); border-radius: 4px; padding: 2px 8px; margin-left: 10px; vertical-align: 3px; }
  .vn { font-family: var(--mono); font-weight: 700; text-align: right; }
  .vlab small { display: block; font-size: 16px; color: var(--ink-2); margin-top: 2px; }
  .vrow.best .vlab { font-weight: 700; }
  .vrow.best .vtrack { box-shadow: 0 0 0 3px var(--ink); }
  .vnote { font-size: 20px; margin: 10px 2px; }
  .bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 18px; border: 1px solid var(--rule); border-radius: 6px; background: #f6f7f9; }
  button { font: inherit; font-size: 18px; color: var(--ink); background: #fff; border: 1px solid #9a9a9a; border-radius: 6px; padding: 9px 16px; cursor: pointer; }
  button:hover { border-color: var(--ink); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--ma); color: #fff; border-color: var(--ma); font-weight: 700; }
  .bar .status { margin-left: auto; font-family: var(--mono); font-size: 15px; color: var(--ink-2); }
  svg text { font-family: var(--sans); }
  .halo { paint-order: stroke; stroke: #fff; stroke-width: 6px; stroke-linejoin: round; }

  /* ---------- phone ---------- */
  #phone { max-width: 560px; margin: 0 auto; padding: 16px; }
  #phone h1 { font-size: 23px; margin: 6px 0 4px; }
  #phone .sub { color: var(--ink-2); font-size: 15px; margin: 0 0 12px; }
  #phone .vgrid { display: grid; gap: 10px; margin: 6px 0 14px; }
  #phone .vgrid h2 { font-size: 17px; margin: 10px 0 0; color: var(--ink-2); }
  #phone .vbtn { font-size: 20px; font-weight: 700; padding: 14px 14px; text-align: left; border: 1.5px solid #9a9a9a; border-radius: 8px; background: #fff; }
  #phone .vbtn.on { background: #e8f1fd; border-color: var(--ma); box-shadow: 0 0 0 2px var(--ma); }
  #phone button.primary { font-size: 19px; padding: 10px 22px; }
  #phone .msg { margin-top: 10px; font-size: 16px; min-height: 22px; }
</style>

<!-- projector view -->
<div id="proj" class="hidden">
  <div class="head"><h1 id="ptitle"></h1></div>
  <div class="main" id="main">
    <svg id="left" viewBox="0 0 1000 860" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="side" id="side">
      <div class="join">
        <div class="qr" id="qr"></div>
        <div><div class="ask" id="ask"></div><div class="count" id="pcount"></div></div>
      </div>
      <div class="wall" id="wall"></div>
    </div>
  </div>
  <div class="bar">
    <button id="prev" title="Previous (←)">◀</button>
    <button id="next" class="primary" title="Next (space or →)"></button>
    <span class="status" id="status"></span>
  </div>
</div>

<!-- phone view -->
<div id="phone" class="hidden">
  <h1 id="ftitle"></h1>
  <p class="sub">CS328 · Tap your choice, then send.</p>
  <div class="vgrid" id="vgrid"></div>
  <button class="primary" id="vsend">Send vote</button>
  <div class="msg" id="vmsg"></div>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);
// the same web app as ch4/spot-the-difference.html; this game uses its rounds 17 to 19. Add ?test or #test for a local test (this browser only).
const TEST = /(^|[?&#])test\b/.test(location.search + location.hash);
const API = TEST ? '' : 'https://script.google.com/macros/s/AKfycbwl9bZajvzRGBFQHL9rMPdHwL7kuF76KvjF3JYfCNU7UIzaei5437aBAuwjlYRwin8SLA/exec';
const BUILD = '2026-10-19a';
const ROUND = { guess: 17, root: 17, next: 19 };

// ------------------------------------------------------------ the 16 patients: age (0 <40, 1 40–55, 2 >55), family history (0 no, 1 yes), exercise (0 rarely, 1 regularly), risk (0 low, 1 high)
const PATIENTS = [[1,1,1,0,1],[2,0,0,0,0],[3,2,0,1,0],[4,1,1,1,0],[5,2,1,0,1],[6,0,1,1,0],[7,1,0,1,0],[8,2,0,0,1],
                  [9,1,1,1,1],[10,0,1,0,1],[11,2,1,1,1],[12,1,0,1,0],[13,1,1,0,1],[14,2,0,0,1],[15,1,1,1,0],[16,2,1,0,1]]
  .map(([id, age, fh, ex, risk]) => ({ id, age, fh, ex, risk }));
const pt = id => PATIENTS[id - 1];
const ALL = PATIENTS.map(p => p.id);
const ATTR = {
  fh:  { name: 'Family history', q: 'Family history?', vals: ['No', 'Yes'], group: ['patients with no family history', 'patients with a family history'] },
  age: { name: 'Age', q: 'Age?', vals: ['<40', '40–55', '>55'], group: ['patients under 40', 'patients aged 40 to 55', 'patients over 55'] },
  ex:  { name: 'Exercise', q: 'Exercise?', vals: ['Rarely', 'Regularly'], group: ['patients who exercise rarely', 'patients who exercise regularly'] },
};
const ORDER = ['fh', 'age', 'ex'];
const COL = { 0: '#1baf7a', 1: '#d6453d' };

// ------------------------------------------------------------ trees: the algorithm's (by information gain, never shown) and the class's (by vote)
const H = ids => { const n = ids.length; if (!n) return 0; const p = ids.filter(i => pt(i).risk).length / n; return p === 0 || p === 1 ? 0 : -p * Math.log2(p) - (1 - p) * Math.log2(1 - p); };
const split = (ids, a) => ATTR[a].vals.map((_, v) => ids.filter(i => pt(i)[a] === v));
const gain = (ids, a) => H(ids) - split(ids, a).reduce((s, g) => s + g.length / ids.length * H(g), 0);
const pure = ids => new Set(ids.map(i => pt(i).risk)).size < 2;
const isLeaf = n => n.leaf !== undefined;
// choose(node, attrs) gives the question at a node, or null to leave it open
function grow(ids, attrs, path, choose) {
  const node = { ids, path };
  if (pure(ids) || !attrs.length) { node.leaf = pure(ids) ? pt(ids[0]).risk : 'mixed'; return node; }
  const a = choose(node, attrs); if (!a) return node;
  node.attr = a;
  node.kids = split(ids, a).map((g, v) => ({ v, node: g.length ? grow(g, attrs.filter(x => x !== a), path + a + v + '/', choose) : null })).filter(k => k.node);
  return node;
}
const ALGO = grow(ALL, ORDER, '', (n, attrs) => attrs.reduce((b, a) => (gain(n.ids, a) > gain(n.ids, b) + 1e-9 ? a : b)));
const depthOf = n => n.path.split('/').length - 1;
// the groups after the class's first question that still mix low and high risk: the second level the class votes on
const groupsUnder = root => split(ALL, root).map((ids, v) => ({ key: root + v, root, v, ids, opts: ORDER.filter(a => a !== root), title: ATTR[root].group[v] })).filter(g => g.ids.length && !pure(g.ids));

// ------------------------------------------------------------ backend: the Apps Script web app, or localStorage in test mode
const LS = { round: 'bt-round', answers: 'bt-answers' };
const today = () => new Date().toISOString().slice(0, 10);
const api = {
  async getRound() {
    if (!API) return JSON.parse(localStorage.getItem(LS.round) || '{"round":17}');
    return (await fetch(`${API}?action=round&t=${Date.now()}`)).json();
  },
  async setRound(round, key) {
    if (!API) { localStorage.setItem(LS.round, JSON.stringify({ round, session: today() })); return { ok: true }; }
    return (await fetch(`${API}?action=setRound&round=${round}&session=${today()}&key=${encodeURIComponent(key)}`)).json();
  },
  async submit(round, text) {
    if (!API) { const a = JSON.parse(localStorage.getItem(LS.answers) || '[]'); a.push({ t: Date.now(), round, text, session: today() }); localStorage.setItem(LS.answers, JSON.stringify(a)); return { ok: true }; }
    return (await fetch(`${API}?action=submit&round=${round}&text=${encodeURIComponent(text)}`)).json();
  },
  async list(round) {
    if (!API) return { answers: JSON.parse(localStorage.getItem(LS.answers) || '[]').filter(a => a.round === round && a.session === today()) };
    return (await fetch(`${API}?action=list&round=${round}&t=${Date.now()}`)).json();
  },
};
// votes are answers of the form "vote:<group>.<choice>,...;d=<device>" (the group is empty for the first question); each device's latest vote counts, or its earliest with `first`
function tally(answers, first) {
  const byDev = {};
  answers.forEach(a => { const m = a.text.match(/^vote:([\w.,]*)(?:;d=(\w+))?/); if (m && !(first && byDev[m[2] || a.t])) byDev[m[2] || a.t] = m[1].split(',').filter(Boolean); });
  const n = {};
  Object.values(byDev).forEach(picks => picks.forEach(p => { const [g, c] = p.includes('.') ? p.split('.') : ['', p]; (n[g] = n[g] || {})[c] = (n[g][c] || 0) + 1; }));
  return { n, voters: Object.keys(byDev).length };
}
const top = (counts, opts) => { let b = null; opts.forEach(o => { if ((counts || {})[o] > ((counts || {})[b] || 0)) b = o; }); return b; };

// ------------------------------------------------------------ drawing helpers (SVG)
const NS = 'http://www.w3.org/2000/svg';
function el(parent, tag, attrs, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  parent.appendChild(e); return e;
}
// patient IDs as coloured chips, wrapped to rows inside a box of width w
function chips(g, ids, x, y, w, s) {
  const cw = 44 * s, ch = 34 * s, gap = 6 * s, per = Math.max(1, Math.floor((w + gap) / (cw + gap)));
  const n = Math.min(per, ids.length), x0 = x + (w - (n * cw + (n - 1) * gap)) / 2;
  ids.forEach((id, i) => {
    const cx = x0 + (i % per) * (cw + gap), cy = y + Math.floor(i / per) * (ch + gap);
    el(g, 'rect', { x: cx, y: cy, width: cw, height: ch, rx: 6 * s, fill: COL[pt(id).risk] });
    el(g, 'text', { x: cx + cw / 2, y: cy + ch / 2 + 7.5 * s, 'text-anchor': 'middle', 'font-size': 21 * s, 'font-weight': 700, fill: '#fff' }, id);
  });
}
// the patients as a table
function table(g, ids, x, y, w, rh) {
  const cols = [['ID', 0.06], ['Age', 0.22], ['Family history', 0.42], ['Exercise', 0.66], ['Risk', 0.87]];
  cols.forEach(([h, f]) => el(g, 'text', { x: x + f * w, y: y + rh * 0.65, 'text-anchor': 'middle', 'font-size': 24, 'font-weight': 700, fill: '#666' }, h));
  el(g, 'line', { x1: x, x2: x + w, y1: y + rh, y2: y + rh, stroke: '#9a9a9a', 'stroke-width': 1.5 });
  ids.forEach((id, i) => {
    const p = pt(id), yy = y + rh * (i + 1);
    if (i % 2) el(g, 'rect', { x, y: yy, width: w, height: rh, fill: '#f6f7f9' });
    const cells = [id, ATTR.age.vals[p.age], ATTR.fh.vals[p.fh], ATTR.ex.vals[p.ex]];
    cells.forEach((c, k) => el(g, 'text', { x: x + cols[k][1] * w, y: yy + rh * 0.68, 'text-anchor': 'middle', 'font-size': 25, fill: '#222', 'font-weight': k ? 400 : 700 }, c));
    el(g, 'text', { x: x + cols[4][1] * w, y: yy + rh * 0.68, 'text-anchor': 'middle', 'font-size': 25, 'font-weight': 700, fill: COL[p.risk] }, p.risk ? 'High' : 'Low');
  });
}
// each candidate question, with the patients each answer sends down each branch (as in the book's figure)
function splits(g, ids, opts, x, y, w, h) {
  const rh = h / opts.length, lw = 210;
  opts.forEach((a, r) => {
    const yy = y + r * rh, parts = split(ids, a), n = parts.length, gap = 14, bw = (w - lw - gap * (n - 1)) / n;
    el(g, 'text', { x: x, y: yy + rh / 2 + 8, 'font-size': 27, fill: '#222' }, ATTR[a].q);
    parts.forEach((p, v) => {
      const bx = x + lw + v * (bw + gap);
      el(g, 'text', { x: bx + bw / 2, y: yy + 34, 'text-anchor': 'middle', 'font-size': 23, fill: '#666', 'font-weight': 700 }, ATTR[a].vals[v]);
      el(g, 'rect', { x: bx, y: yy + 46, width: bw, height: rh - 62, rx: 8, fill: '#fafafa', stroke: '#dcdcdc', 'stroke-width': 1.5 });
      chips(g, p, bx + 10, yy + 60, bw - 20, 1.25);
    });
    if (r) el(g, 'line', { x1: x, x2: x + w, y1: yy, y2: yy, stroke: '#ececec', 'stroke-width': 1.5 });
  });
}
// a tree; a node without a question yet is a dashed box, and the one in `cur` is outlined in blue
function drawTree(g, tree, x, y, w, h, s, cur) {
  const kids = n => n.kids || [];
  const leaves = n => kids(n).length ? kids(n).reduce((t, k) => t + leaves(k.node), 0) : 1;
  const depth = n => kids(n).length ? 1 + Math.max(...kids(n).map(k => depth(k.node))) : 0;
  const nL = leaves(tree), D = depth(tree), slot = w / nL, lvl = D ? Math.min((h - 120 * s) / D, 170 * s) : 0;
  const edges = el(g, 'g', {}), labels = el(g, 'g', {}), nodes = el(g, 'g', {});
  function place(n, d, first) {
    const ks = kids(n); let cx;
    if (!ks.length) cx = x + (first + 0.5) * slot;
    else { let f = first; const xs = ks.map(k => { const r = place(k.node, d + 1, f); f += leaves(k.node); return r; }); cx = (xs[0] + xs[xs.length - 1]) / 2;
      ks.forEach((k, i) => { const cy = y + d * lvl, ky = y + (d + 1) * lvl;
        el(edges, 'line', { x1: cx, y1: cy + 24 * s, x2: xs[i], y2: ky - 4 * s, stroke: '#9a9a9a', 'stroke-width': 2 * s });
        // the answer beside its edge: left of a left edge, right of a right edge, so neighbouring labels do not collide
        const lab = ATTR[n.attr].vals[k.v], dx = xs[i] - cx, lx = cx + 0.4 * dx, ly = cy + 0.4 * (ky - cy), side = Math.abs(dx) < 40 * s ? 0 : Math.sign(dx);
        if (!side) { const lw = lab.length * 11 * s + 10 * s; el(labels, 'rect', { x: lx - lw / 2, y: ly - 10 * s, width: lw, height: 26 * s, fill: '#fff' }); }
        el(labels, 'text', { x: lx + side * 6 * s, y: ly + 8 * s, 'text-anchor': side < 0 ? 'end' : side > 0 ? 'start' : 'middle', 'font-size': 19 * s, fill: '#444' }, lab); }); }
    const cy = y + d * lvl;
    if (ks.length) {                                                     // a question
      const bw = 186 * s;
      el(nodes, 'rect', { x: cx - bw / 2, y: cy - 24 * s, width: bw, height: 48 * s, rx: 24 * s, fill: '#e8f1fd', stroke: '#2a78d6', 'stroke-width': 2 * s });
      el(nodes, 'text', { x: cx, y: cy + 8 * s, 'text-anchor': 'middle', 'font-size': 23 * s, 'font-weight': 700, fill: '#1d5fae' }, ATTR[n.attr].q);
    } else {                                                             // a leaf, or a group still waiting for its question
      const open = !isLeaf(n), here = open && n.path === cur, bw = Math.min(slot - 10 * s, 160 * s);
      const cs = 0.9 * s, per = Math.max(1, Math.floor((bw - 10 * s + 6 * cs) / (50 * cs))), rows = Math.ceil(n.ids.length / per);
      const bh = 52 * s + rows * 40 * cs, tp = cy - 4 * s;
      const fill = open ? '#fff' : n.leaf === 'mixed' ? '#fdf3cf' : n.leaf ? '#fbe3e1' : '#ddf3ea';
      const stroke = open ? (here ? '#2a78d6' : '#9a9a9a') : n.leaf === 'mixed' ? '#f2c230' : COL[n.leaf];
      el(nodes, 'rect', { x: cx - bw / 2, y: tp, width: bw, height: bh, rx: 8 * s, fill, stroke, 'stroke-width': (here ? 5 : 2) * s, 'stroke-dasharray': open && !here ? 8 * s + ' ' + 6 * s : 'none' });
      el(nodes, 'text', { x: cx, y: tp + 30 * s, 'text-anchor': 'middle', 'font-size': 23 * s, 'font-weight': 700, fill: open ? '#666' : n.leaf === 'mixed' ? '#8a6d00' : COL[n.leaf] },
        open || n.leaf === 'mixed' ? '?' : n.leaf ? 'High' : 'Low');
      chips(nodes, n.ids, cx - bw / 2 + 5 * s, tp + 42 * s, bw - 10 * s, cs);
    }
    return cx;
  }
  place(tree, 0, 0);
}

// an empty tree: the first question, a second question under each answer, and the predictions at the bottom
function skeleton(g, x, y, w, h) {
  const box = (cx, cy, label, pill) => {
    const bw = pill ? 230 : 180, bh = pill ? 56 : 70;
    el(g, 'rect', { x: cx - bw / 2, y: cy - bh / 2, width: bw, height: bh, rx: pill ? 28 : 8, fill: '#fff', stroke: '#9a9a9a', 'stroke-width': 2.5, 'stroke-dasharray': '9 7' });
    el(g, 'text', { x: cx, y: cy + 9, 'text-anchor': 'middle', 'font-size': 25, 'font-weight': 700, fill: '#666' }, label);
  };
  const line = (x1, y1, x2, y2) => el(g, 'line', { x1, y1, x2, y2, stroke: '#c4c4c4', 'stroke-width': 2.5 });
  const y0 = y + 40, y1 = y + h * 0.42, y2 = y + h * 0.84, mid = [x + w * 0.25, x + w * 0.75], leaf = [0.09, 0.37, 0.63, 0.91].map(f => x + f * w);
  mid.forEach((mx, k) => { line(x + w / 2, y0 + 28, mx, y1 - 28); [0, 1].forEach(j => line(mx, y1 + 28, leaf[2 * k + j], y2 - 35)); });
  box(x + w / 2, y0, '1st question?', true);
  mid.forEach(mx => box(mx, y1, '2nd question?', true));
  leaf.forEach(lx => box(lx, y2, 'High or Low?', false));
}

// ------------------------------------------------------------ projector: guess the first question; see the splits and vote again; vote on the second level; compare with the algorithm
function projector() {
  $('proj').classList.remove('hidden');
  const key = (location.hash.match(/key=([^&]+)/) || [])[1] || '';
  let step = Math.max(0, parseInt((location.hash.match(/step=(\d+)/) || [])[1] || '1', 10) - 1);
  let shared = 0;
  const ans = { 17: [], 19: [] }, page = location.origin + location.pathname;
  // the class's first question: its latest votes, which it may change after seeing the splits (with no votes at all, the algorithm's, so the page still runs)
  const classRoot = () => top(tally(ans[17]).n[''], ORDER) || ALGO.attr;
  const classTree = withPicks => grow(ALL, ORDER, '', (n, attrs) => {
    const d = depthOf(n);
    if (d === 0) return classRoot();
    if (d === 1) { if (!withPicks) return null; const g = n.path.replace('/', ''); return top(tally(ans[19]).n[g], attrs); }
    return attrs.length === 1 ? attrs[0] : null;                         // one question left: no choice to make
  });
  function steps() {
    const gs = groupsUnder(classRoot());
    return [{ k: 'intro' }, { k: 'guess', round: 17 }, { k: 'root', round: 17 }, ...gs.map((g, i) => ({ k: 'next', round: 19, g, last: i === gs.length - 1 })), { k: 'compare' }];
  }
  function qrFor(S) {
    const qs = '?phone&q=' + (S.round - 16) + (S.k === 'next' ? '&root=' + S.g.root : '');
    const url = page + qs + (TEST ? '&test' : '') + '&v=' + BUILD;
    try { const c = qrcode(0, 'M'); c.addData(url); c.make(); $('qr').innerHTML = c.createSvgTag({ cellSize: 5, margin: 2, scalable: true }); }
    catch (_) { $('qr').textContent = ''; }
  }
  function drawSide(S) {
    if (S.k === 'compare' || S.k === 'intro') return;
    const opts = S.k === 'next' ? S.g.opts : ORDER, T = tally(ans[S.round]), counts = T.n[S.k === 'next' ? S.g.key : ''] || {};
    const before = S.k === 'root' ? tally(ans[17], true).n[''] || {} : null, mx = Math.max(1, ...opts.map(o => counts[o] || 0));
    $('wall').innerHTML = '<div class="votes">' + opts.map(o => `<div class="vrow"><span class="vlab">${ATTR[o].name}${before ? `<small>first guess ${before[o] || 0}</small>` : ''}</span>
      <span class="vtrack"><span class="vbar" style="width:${100 * (counts[o] || 0) / mx}%"></span></span><span class="vn">${counts[o] || 0}</span></div>`).join('') + '</div>';
    $('pcount').textContent = `${T.voters} vote${T.voters === 1 ? '' : 's'}`;
    $('ask').innerHTML = S.k === 'guess' ? 'Which question would you ask first?<br>Vote on your phone.'
      : S.k === 'root' ? 'Which question would you ask first?<br>Change your vote on your phone if you wish.'
      : 'Which question would you ask next?<br>Vote for each group on your phone.';
  }
  function drawLeft(S) {
    const svg = $('left'), wide = S.k === 'compare' || S.k === 'intro';
    svg.setAttribute('viewBox', wide ? '0 0 1600 860' : '0 0 1000 860'); svg.innerHTML = '';
    const g = el(svg, 'g', {});
    if (S.k === 'intro') { table(g, ALL, 0, 0, 760, 48); skeleton(g, 860, 60, 740, 760); }
    else if (S.k === 'guess') table(g, ALL, 0, 0, 1000, 48);
    else if (S.k === 'root') splits(g, ALL, ORDER, 0, 0, 1000, 860);
    else if (S.k === 'next') { drawTree(g, classTree(false), 0, 30, 1000, 330, 0.8, S.g.key + '/'); splits(g, S.g.ids, S.g.opts, 0, 380, 1000, 480); }
    else {                                                               // the class's tree beside the algorithm's
      [[classTree(true), 'Your tree', 0], [ALGO, 'The decision tree algorithm', 820]].forEach(([t, name, x0]) => {
        el(g, 'text', { x: x0 + 390, y: 34, 'text-anchor': 'middle', 'font-size': 30, 'font-weight': 700, fill: '#222' }, name);
        drawTree(g, t, x0, 130, 780, 730, 0.9, null);
      });
      el(g, 'line', { x1: 800, x2: 800, y1: 10, y2: 850, stroke: '#dcdcdc', 'stroke-width': 2 });
    }
  }
  function show() {
    const ST = steps(), i = Math.min(step, ST.length - 1);   // the number of steps follows the class's first question, so keep the step asked for
    const S = ST[i];
    $('ptitle').textContent = S.k === 'intro' ? 'What questions should the tree ask?' : S.k === 'guess' ? 'Which question should we ask first?' : S.k === 'root' ? 'How does each question split the patients?'
      : S.k === 'next' ? `Which question next, for ${S.g.title}?` : 'How does your tree compare with the algorithm’s?';
    const wide = S.k === 'compare' || S.k === 'intro';
    $('main').classList.toggle('full', wide); $('side').classList.toggle('hidden', wide);
    $('prev').disabled = i === 0; $('next').classList.toggle('hidden', i === ST.length - 1);
    $('next').textContent = S.k === 'intro' ? 'Start' : S.k === 'guess' ? 'Show the splits' : S.k === 'root' ? 'Next level' : S.k === 'next' ? (S.last ? 'Compare with the algorithm' : 'Next group') : '';
    history.replaceState(null, '', '#step=' + (i + 1) + (key ? '&key=' + key : '') + (TEST ? '&test' : ''));
    if (S.round) { qrFor(S); if (S.round !== shared) { shared = S.round; share(S.round); } }
    drawLeft(S); drawSide(S);
  }
  async function share(round) {
    try { const s = await api.setRound(round, key); if (s && s.ok === false) $('status').textContent = 'round not shared: check the #key in the URL'; } catch (_) {}
    poll();
  }
  // all three rounds, since later steps depend on earlier votes
  async function poll() {
    try {
      let changed = false;
      await Promise.all([17, 19].map(async r => { const a = ((await api.list(r)).answers || []).sort((p, o) => p.t - o.t); if (a.length !== ans[r].length) changed = true; ans[r] = a; }));
      if (changed) show();
      $('status').textContent = API ? 'live' : 'test mode (this browser only)';
    }
    catch (e) { $('status').textContent = 'cannot reach the answer sheet'; }
  }
  const go = d => { const n = steps().length, s = Math.min(step, n - 1) + d; if (s >= 0 && s < n) { step = s; show(); } };
  $('prev').onclick = () => go(-1); $('next').onclick = () => go(1);
  document.addEventListener('keydown', e => { if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); go(1); } else if (e.key === 'ArrowLeft') go(-1); });
  show(); poll();
  setInterval(poll, 3000);
}

// ------------------------------------------------------------ phone: the question (or one per group), a button per answer, send
function phone() {
  $('phone').classList.remove('hidden');
  if (!API) $('vmsg').textContent = 'Test mode: votes stay on this device.';
  const sp = new URLSearchParams(location.search), qn = Math.max(1, Math.min(3, parseInt(sp.get('q'), 10) || 1));
  const root = ATTR[sp.get('root')] ? sp.get('root') : 'ex', round = 16 + qn;
  const groups = qn === 3 ? groupsUnder(root) : [{ key: '', opts: ORDER }];
  const picked = {};
  let busy = false, dev = '';
  try { dev = localStorage.getItem('sd-dev') || ''; if (!dev) { dev = Math.random().toString(36).slice(2, 10); localStorage.setItem('sd-dev', dev); } } catch (_) { dev = Math.random().toString(36).slice(2, 10); }
  $('ftitle').textContent = qn === 3 ? 'Which question would you ask next?' : 'Which question would you ask first?';
  function draw() {
    $('vgrid').innerHTML = '';
    groups.forEach(g => {
      if (g.title) { const h = document.createElement('h2'); h.textContent = 'For ' + g.title; $('vgrid').appendChild(h); }
      g.opts.forEach(o => {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'vbtn' + (picked[g.key] === o ? ' on' : ''); b.textContent = ATTR[o].name;
        b.onclick = () => { picked[g.key] = o; draw(); }; $('vgrid').appendChild(b);
      });
    });
  }
  draw();
  $('vsend').onclick = async () => {
    const picks = groups.filter(g => picked[g.key]).map(g => (g.key ? g.key + '.' : '') + picked[g.key]);
    if (picks.length < groups.length) { $('vmsg').textContent = groups.length > 1 ? 'Pick one question for each group first.' : 'Tap one first.'; return; }
    if (busy) return;
    busy = true; $('vsend').disabled = true; $('vmsg').textContent = 'Sending…';
    try {
      const r = await api.submit(round, 'vote:' + picks.join(',') + ';d=' + dev);
      $('vmsg').textContent = r.ok ? 'Vote sent. To change it, tap again and resend.' : 'Not sent (' + (r.error || 'unknown') + '); try again.';
    }
    catch (e) { $('vmsg').textContent = 'Not sent (' + (e && e.message || e) + '); check your connection.'; }
    setTimeout(() => { busy = false; $('vsend').disabled = false; }, 2500);
  };
}

if (new URLSearchParams(location.search).has('phone')) phone(); else projector();
})();
</script>

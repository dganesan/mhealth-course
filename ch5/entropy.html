<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entropy and Information Gain</title>
</head>
<body>
<style>
  :root {
    color-scheme: light;
    --paper: #ffffff; --ink: #222222; --ink-2: #666666; --ink-3: #9a9a9a; --rule: #dcdcdc; --grid: #ececec; --ma: #2a78d6;
    --sans: "Helvetica Neue", Helvetica, -apple-system, Arial, sans-serif;
    --mono: Menlo, "SF Mono", Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  #app { height: 100vh; padding: 10px 14px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px; }
  .head { padding: 4px 16px 0; }
  h1 { margin: 0; font-size: clamp(24px, 2.4vw, 36px); font-weight: 700; letter-spacing: -0.01em; }
  .main { user-select: none; -webkit-user-select: none; min-height: 0; border: 1px solid var(--rule); border-radius: 6px; padding: 10px 16px; }
  .main svg { width: 100%; height: 100%; display: block; }
  svg text { font-family: var(--sans); }
  .bar { display: flex; gap: 10px; align-items: center; padding: 10px 18px; border: 1px solid var(--rule); border-radius: 6px; background: #f6f7f9; }
  button { font: inherit; font-size: 18px; color: var(--ink); background: #fff; border: 1px solid #9a9a9a; border-radius: 6px; padding: 9px 16px; cursor: pointer; }
  button:hover { border-color: var(--ink); }
  button:disabled { opacity: .45; cursor: default; }
  .ctl { display: flex; align-items: center; gap: 12px; flex: 1; font-size: 18px; margin-left: 14px; }
  .ctl input[type=range] { flex: 1; max-width: 520px; -webkit-appearance: none; appearance: none; height: 8px; border-radius: 4px; background: #d9dde3; }
  .ctl input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%; background: var(--ma); cursor: pointer; }
  .ctl input[type=range]::-moz-range-thumb { width: 26px; height: 26px; border: 0; border-radius: 50%; background: var(--ma); cursor: pointer; }
  .step { font-family: var(--mono); font-size: 17px; color: var(--ink-2); margin-left: auto; }
  .hide { display: none !important; }
</style>

<div id="app">
  <div class="head"><h1 id="title"></h1></div>
  <div class="main"><svg id="fig" viewBox="0 0 1600 760"></svg></div>
  <div class="bar">
    <button id="prev" title="Previous step (←)">⏮ step</button>
    <button id="next" title="Next step (→)">step ⏭</button>
    <span class="ctl" id="ctl"><span>low risk (+)</span><input type="range" id="k" min="0" max="20" step="1" value="12"><span id="kval"></span></span>
    <span class="step" id="stepno"></span>
  </div>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const svgNS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}, parent) => { const n = document.createElementNS(svgNS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; };
const txt = (parent, x, y, s, attrs = {}) => { const t = el('text', Object.assign({ x, y }, attrs), parent); t.textContent = s; return t; };
const PLUS = '#2a78d6', DOT = '#d6453d', MED = '#e0a100';

// ------------------------------------------------------------ entropy of a group with a plus signs and b dots
const H = (a, b) => { const n = a + b; return [a, b].reduce((s, c) => c ? s - c / n * Math.log2(c / n) : s, 0); };
const f3 = v => v.toFixed(3), f2 = v => v.toFixed(2);
// the calculation written out, leaving out a class with no members (0 · log₂ 0 counts as 0)
const working = (a, b) => { const n = a + b; return [a, b].filter(c => c).map((c, i) => `${i ? ' − ' : '−'}(${c}/${n}) log₂(${c}/${n})`).join(''); };

// ------------------------------------------------------------ fixed scattered positions inside an ellipse, so a group looks the same every time it is drawn
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function scatter(n, seed, minD) {
  const r = rng(seed), pts = [];
  for (let tries = 0; pts.length < n && tries < 20000; tries++) {
    const a = r() * 2 * Math.PI, d = Math.sqrt(r()) * 0.86, p = [d * Math.cos(a), d * Math.sin(a)];
    if (pts.every(q => Math.hypot(p[0] - q[0], p[1] - q[1]) > minD)) pts.push(p);
  }
  return pts;
}
// a group: an ellipse with `a` plus signs and `b` dots, mixed by a fixed shuffle
// one symbol: 0 a plus sign (low risk), 1 a dot (high risk), 2 a triangle (medium risk)
function sym(svg, k, x, y, sz) {
  if (k === 0) { el('line', { x1: x - sz, x2: x + sz, y1: y, y2: y, stroke: PLUS, 'stroke-width': sz * 0.42, 'stroke-linecap': 'round' }, svg); el('line', { x1: x, x2: x, y1: y - sz, y2: y + sz, stroke: PLUS, 'stroke-width': sz * 0.42, 'stroke-linecap': 'round' }, svg); }
  else if (k === 1) el('circle', { cx: x, cy: y, r: sz * 0.62, fill: DOT }, svg);
  else el('path', { d: `M${x} ${y - sz * 0.8} L${x + sz * 0.8} ${y + sz * 0.6} L${x - sz * 0.8} ${y + sz * 0.6} Z`, fill: MED }, svg);
}
function legend(svg, three) {
  const items = [[0, 'low risk'], [1, 'high risk']].concat(three ? [[2, 'medium risk']] : []);
  items.forEach(([k, s], i) => { const x = 1590 - (items.length - i) * 175; sym(svg, k, x + 12, 22, 11); txt(svg, x + 32, 30, s, { 'font-size': 21, fill: '#444' }); });
}
// a group: an ellipse with `a` plus signs, `b` dots and `m` triangles, mixed by a fixed shuffle
function group(svg, cx, cy, rx, ry, a, b, seed, sz, m = 0) {
  el('ellipse', { cx, cy, rx, ry, fill: 'none', stroke: '#444', 'stroke-width': 2.5 }, svg);
  const n = a + b + m, pts = scatter(n, seed, Math.min(0.32, 1.25 / Math.sqrt(n))), r = rng(seed + 7);
  const kind = Array.from({ length: n }, (_, i) => i < a ? 0 : i < a + b ? 1 : 2);
  for (let i = n - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [kind[i], kind[j]] = [kind[j], kind[i]]; }
  pts.forEach(([u, v], i) => sym(svg, kind[i], cx + u * rx, cy + v * ry, sz));
}
const counts = (a, b, m) => `${a} +,  ${b} •` + (m != null ? `,  ${m} ▲` : '');
// entropy and its working for any number of classes
const Hn = cs => { const n = cs.reduce((s, c) => s + c, 0); return cs.reduce((s, c) => c ? s - c / n * Math.log2(c / n) : s, 0); };
const termsN = cs => { const n = cs.reduce((s, c) => s + c, 0); return cs.filter(c => c).map((c, i) => `${i ? '− ' : '−'}(${c}/${n}) log₂(${c}/${n})`); };

// ------------------------------------------------------------ the binary entropy curve: entropy against the share of plus signs
function curve(svg, X, Y, W, Hh, marks) {
  const sx = p => X + p * W, sy = h => Y + Hh - h * Hh;
  for (let i = 0; i <= 4; i++) { const v = i / 4; el('line', { x1: X, x2: X + W, y1: sy(v), y2: sy(v), stroke: '#ececec', 'stroke-width': 1.5 }, svg); txt(svg, X - 14, sy(v) + 7, v.toFixed(2).replace(/0$/, ''), { 'text-anchor': 'end', 'font-size': 20, fill: '#666', 'font-family': 'Menlo, monospace' }); }
  for (let i = 0; i <= 4; i++) { const v = i / 4; txt(svg, sx(v), Y + Hh + 30, v.toFixed(2).replace(/0$/, ''), { 'text-anchor': 'middle', 'font-size': 20, fill: '#666', 'font-family': 'Menlo, monospace' }); }
  el('line', { x1: X, x2: X + W, y1: Y + Hh, y2: Y + Hh, stroke: '#666', 'stroke-width': 1.5 }, svg);
  el('line', { x1: X, x2: X, y1: Y, y2: Y + Hh, stroke: '#666', 'stroke-width': 1.5 }, svg);
  txt(svg, X + W / 2, Y + Hh + 64, 'share of low risk (+) in the group', { 'text-anchor': 'middle', 'font-size': 22, fill: '#444' });
  txt(svg, X - 70, Y + Hh / 2, 'entropy', { 'text-anchor': 'middle', 'font-size': 22, fill: '#444', transform: `rotate(-90 ${X - 70} ${Y + Hh / 2})` });
  let d = ''; for (let i = 0; i <= 200; i++) { const p = i / 200; d += (i ? 'L' : 'M') + sx(p).toFixed(1) + ' ' + sy(H(p, 1 - p)).toFixed(1); }
  el('path', { d, fill: 'none', stroke: '#444', 'stroke-width': 3.5 }, svg);
  marks.forEach(m => {
    const x = sx(m.p), y = sy(H(m.p, 1 - m.p));
    if (m.guide) { el('line', { x1: x, x2: x, y1: y, y2: Y + Hh, stroke: m.col, 'stroke-width': 2, 'stroke-dasharray': '6 5' }, svg); el('line', { x1: X, x2: x, y1: y, y2: y, stroke: m.col, 'stroke-width': 2, 'stroke-dasharray': '6 5' }, svg); }
    el('circle', { cx: x, cy: y, r: m.r || 11, fill: m.col, stroke: '#fff', 'stroke-width': 3 }, svg);
    if (m.label) txt(svg, x + (m.dx || 0), y + (m.dy || -22), m.label, { 'text-anchor': 'middle', 'font-size': 21, 'font-weight': 700, fill: m.col, stroke: '#fff', 'stroke-width': 6, 'paint-order': 'stroke' });
  });
  return { X, Y, W, Hh };
}

// ------------------------------------------------------------ the book's worked example: 30 points split into 17 and 13
const PARENT = [14, 16], KIDS = [[13, 4], [1, 12]];
// rounded to three places before they are combined, as in the book's figure
const HP = +H(...PARENT).toFixed(3), HK = KIDS.map(k => +H(...k).toFixed(3)), WAVG = KIDS.reduce((s, k, i) => s + (k[0] + k[1]) / 30 * HK[i], 0);
function example(svg, stage) {
  const P = { cx: 300, cy: 280, rx: 250, ry: 200 }, C = [{ cx: 940, cy: 150, rx: 190, ry: 125 }, { cx: 940, cy: 430, rx: 170, ry: 110 }];
  group(svg, P.cx, P.cy, P.rx, P.ry, ...PARENT, 11, 15);
  txt(svg, P.cx, P.cy + P.ry + 46, `H(S) = ${f3(HP)}`, { 'text-anchor': 'middle', 'font-size': 30, 'font-style': 'italic', fill: '#222' });
  txt(svg, P.cx, P.cy + P.ry + 84, `n = 30   (${counts(...PARENT)})`, { 'text-anchor': 'middle', 'font-size': 25, fill: '#444' });
  if (stage >= 1) KIDS.forEach((k, i) => {
    const c = C[i];
    const ax = P.cx + P.rx * 0.92, ay = P.cy + (i ? 60 : -60), bx = c.cx - c.rx - 12, by = c.cy;
    el('line', { x1: ax, y1: ay, x2: bx, y2: by, stroke: '#666', 'stroke-width': 2.5, 'marker-end': 'url(#arrow)' }, svg);
    group(svg, c.cx, c.cy, c.rx, c.ry, ...k, 21 + i * 10, 14);
    txt(svg, c.cx + c.rx + 30, c.cy - 8, `H = ${f3(HK[i])}`, { 'font-size': 30, 'font-style': 'italic', fill: '#222' });
    txt(svg, c.cx + c.rx + 30, c.cy + 30, `n = ${k[0] + k[1]}   (${counts(...k)})`, { 'font-size': 25, fill: '#444' });
  });
  // the calculation for this step, under the figure
  const lines = stage === 0 ? [[`H(S) = ${working(...PARENT)} = ${f3(HP)}`, '#222']]
    : stage === 1 ? KIDS.map((k, i) => [`H(${i ? 'lower' : 'upper'}) = ${working(...k)} = ${f3(HK[i])}`, '#222'])
    : [[`Weighted child entropy = (17/30)(${f3(HK[0])}) + (13/30)(${f3(HK[1])}) = ${f3(WAVG)}`, '#222'], [`Information gain = ${f3(HP)} − ${f3(WAVG)} = ${f3(HP - WAVG)}`, '#c0392b']];
  lines.forEach(([s, col], i) => txt(svg, 800, 650 + i * 50, s, { 'text-anchor': 'middle', 'font-size': 30, fill: col, 'font-weight': i === 1 && stage === 2 ? 700 : 400 }));
}

// ------------------------------------------------------------ steps
const EXAMPLES = [[10, 0], [9, 1], [7, 3], [5, 5], [3, 7]];
const STEPS = [
  { title: 'How do we measure how mixed a group is?', ctl: true, draw(svg) {
      const k = +$('k').value, a = k, b = 20 - k, h = H(a, b);
      group(svg, 290, 330, 250, 230, a, b, 5, 16);
      txt(svg, 290, 610, counts(a, b), { 'text-anchor': 'middle', 'font-size': 28, fill: '#444' });
      txt(svg, 640, 70, 'H(S) = − Σ pᵢ log₂ pᵢ', { 'font-size': 34, 'font-style': 'italic', fill: '#222' });
      txt(svg, 640, 122, `H = ${working(a, b)} = ${f2(h)}`, { 'font-size': 27, fill: '#222' });
      const C = curve(svg, 760, 180, 760, 420, [{ p: a / 20, col: '#2a78d6', guide: true, label: f2(h), r: 13 }]);
      // dragging along the curve sets the share of plus signs
      const hit = el('rect', { x: C.X - 20, y: C.Y - 20, width: C.W + 40, height: C.Hh + 40, fill: 'transparent', style: 'cursor: ew-resize' }, svg);
      const set = e => { const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const u = pt.matrixTransform(svg.getScreenCTM().inverse()); $('k').value = Math.round(Math.max(0, Math.min(1, (u.x - C.X) / C.W)) * 20); draw(); };
      hit.addEventListener('pointerdown', e => { e.preventDefault(); set(e); const mv = ev => set(ev), up = () => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up); }; addEventListener('pointermove', mv); addEventListener('pointerup', up); });
    } },
  { title: 'How does entropy rank these groups?', draw(svg) {
      const col = ['#1baf7a', '#58a55c', '#e0a100', '#d6453d', '#e0a100'];
      EXAMPLES.forEach(([a, b], i) => {
        const cx = 160 + i * 320;
        group(svg, cx, 175, 130, 115, a, b, 40 + i, 13);
        txt(svg, cx, 322, counts(a, b), { 'text-anchor': 'middle', 'font-size': 24, fill: '#444' });
        txt(svg, cx, 360, `H = ${f2(H(a, b))}`, { 'text-anchor': 'middle', 'font-size': 28, 'font-weight': 700, 'font-style': 'italic', fill: col[i] });
      });
      curve(svg, 520, 410, 640, 250, EXAMPLES.map(([a, b], i) => ({ p: a / 10, col: col[i], label: counts(a, b).replace(/ +/g, ' '), dy: i === 4 ? 34 : -22, dx: i === 0 ? -40 : 0 })));
    } },
  { title: 'What is the entropy of this group?', draw: svg => example(svg, 0) },
  { title: 'What is the entropy of each group after the split?', draw: svg => example(svg, 1) },
  { title: 'How much does the split reduce entropy?', draw: svg => example(svg, 2) },
  // the same formula with a third class: one more term, and the most mixed group now reaches log₂ 3
  { title: 'What if there are three classes?', three: true, draw(svg) {
      txt(svg, 0, 30, 'H(S) = − Σ pᵢ log₂ pᵢ', { 'font-size': 30, 'font-style': 'italic', fill: '#222' });
      THREE.forEach((cs, i) => {
        const cx = 160 + i * 320, h = Hn(cs), t = termsN(cs);
        group(svg, cx, 200, 130, 115, cs[0], cs[1], 70 + i, 13, cs[2]);
        txt(svg, cx, 352, counts(...cs), { 'text-anchor': 'middle', 'font-size': 24, fill: '#444' });
        t.forEach((s, j) => txt(svg, cx, 400 + j * 32, (j ? '' : 'H = ') + s, { 'text-anchor': 'middle', 'font-size': 19, 'font-style': 'italic', fill: '#222' }));
        txt(svg, cx, 400 + t.length * 32 + 6, `= ${f3(h)}`, { 'text-anchor': 'middle', 'font-size': 26, 'font-weight': 700, 'font-style': 'italic', fill: '#222' });
        // the entropy as a bar on a shared scale up to log₂ 3
        const bx = cx - 120, by = 560, bw = 240;
        el('rect', { x: bx, y: by, width: bw, height: 30, rx: 4, fill: '#f1f3f6' }, svg);
        el('rect', { x: bx, y: by, width: bw * h / Math.log2(3), height: 30, rx: 4, fill: '#2a78d6' }, svg);
      });
    } },
];
const THREE = [[12, 0, 0], [10, 1, 1], [6, 6, 0], [6, 3, 3], [4, 4, 4]];

let step = Math.max(0, Math.min(STEPS.length - 1, (parseInt(location.hash.slice(1), 10) || 1) - 1));
function draw() {
  const S = STEPS[step], svg = $('fig');
  svg.innerHTML = '<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#666"/></marker></defs>';
  $('title').textContent = S.title; $('stepno').textContent = `step ${step + 1} of ${STEPS.length}`;
  $('ctl').classList.toggle('hide', !S.ctl); $('kval').textContent = `${$('k').value} of 20`;
  $('prev').disabled = step === 0; $('next').disabled = step === STEPS.length - 1;
  S.draw(svg); legend(svg, !!S.three);
}
function go(s) { step = Math.max(0, Math.min(STEPS.length - 1, s)); draw(); history.replaceState(null, '', '#' + (step + 1)); }
$('prev').onclick = () => go(step - 1); $('next').onclick = () => go(step + 1);
$('k').addEventListener('input', draw);
document.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; if (e.key === 'ArrowRight') go(step + 1); else if (e.key === 'ArrowLeft') go(step - 1); });
draw();
})();
</script>
</body>
</html>

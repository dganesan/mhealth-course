<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Limiting the Tree</title>
</head>
<body>
<style>
  :root {
    color-scheme: light;
    --paper: #ffffff; --ink: #222222; --ink-2: #666666; --ink-3: #9a9a9a; --rule: #dcdcdc; --grid: #ececec; --ma: #2a78d6;
    --sans: "Helvetica Neue", Helvetica, -apple-system, Arial, sans-serif;
    --mono: Menlo, "SF Mono", Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  #app { height: 100vh; padding: 10px 14px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px; }
  .head { padding: 4px 16px 0; }
  h1 { margin: 0; font-size: clamp(24px, 2.4vw, 36px); font-weight: 700; letter-spacing: -0.01em; }
  .main { user-select: none; -webkit-user-select: none; min-height: 0; border: 1px solid var(--rule); border-radius: 6px; padding: 10px 16px; }
  .main svg { width: 100%; height: 100%; display: block; }
  svg { font-family: var(--sans); }   /* inherited, so a font-family attribute on a text element still wins */
  .bar { display: flex; gap: 10px; align-items: center; padding: 10px 18px; border: 1px solid var(--rule); border-radius: 6px; background: #f6f7f9; flex-wrap: wrap; }
  button { font: inherit; font-size: 18px; color: var(--ink); background: #fff; border: 1px solid #9a9a9a; border-radius: 6px; padding: 9px 16px; cursor: pointer; }
  button:hover { border-color: var(--ink); }
  button:disabled { opacity: .45; cursor: default; }
  .ctl { display: flex; align-items: center; gap: 10px; margin-left: 16px; }
  .ctl .lbl { font-family: var(--mono); font-size: 18px; color: var(--ink); }
  .ctl b { font-family: var(--mono); font-size: 19px; min-width: 48px; color: var(--ma); }
  .ctl input[type=range] { width: 230px; -webkit-appearance: none; appearance: none; height: 8px; border-radius: 4px; background: #d9dde3; }
  .ctl input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%; background: var(--ma); cursor: pointer; }
  .ctl input[type=range]::-moz-range-thumb { width: 26px; height: 26px; border: 0; border-radius: 50%; background: var(--ma); cursor: pointer; }
  .step { font-family: var(--mono); font-size: 17px; color: var(--ink-2); margin-left: auto; }
  .hide { display: none !important; }
</style>

<div id="app">
  <div class="head"><h1 id="title"></h1></div>
  <div class="main"><svg id="fig" viewBox="0 0 1600 760"></svg></div>
  <div class="bar">
    <button id="prev" title="Previous step (←)">⏮ step</button>
    <button id="next" title="Next step (→)">step ⏭</button>
    <span class="ctl" id="c-depth"><span class="lbl">max_depth</span><input type="range" id="depth" min="1" max="15" step="1"><b id="v-depth"></b></span>

    <span class="step" id="stepno"></span>
  </div>
</div>

    dots(g, cx - 320, 320, 260, 100, a, 21 + k);
    dots(g, cx + 60, 320, rw, bad ? 46 : 100, b, 31 + k, bad ? { stroke: '#c0392b', dash: '8 6' } : {});
    if (bad) { const x = cx + 100, y = 343; el(g, 'path', { d: `M${x - 26} ${y - 26} L${x + 26} ${y + 26} M${x + 26} ${y - 26} L${x - 26} ${y + 26}`, stroke: '#c0392b', 'stroke-width': 6, 'stroke-linecap': 'round' }); }
    label(g, cx, 480, `leaves of ${a} and ${b}`, { 'font-weight': 700 });
    label(g, cx, 516, ok ? 'both have at least 5, so the split is allowed' : 'a leaf of 1 is fewer than 5, so the split is not allowed', { fill: bad ? '#c0392b' : '#444' });
  });
  el(g, 'line', { x1: 780, x2: 780, y1: 100, y2: 620, stroke: '#ececec', 'stroke-width': 2 });
}

// ------------------------------------------------------------ the dataset: decision regions on the left, the tree on the right, for the current settings
let P = { depth: 15, split: 2, leaf: 1 };
function viz(g) {
  const t = growTree(TRAIN, params(P));
  legend(g, 120, 30, false);
  el(g, 'text', { x: 1590, y: 30, 'text-anchor': 'end', 'font-size': 22, fill: '#222' }, statLine(t, true));
  plane(g, t, 120, 70, 700, 640);
  treeDiagram(g, t, 760, 100, 830, 620);
}

// ------------------------------------------------------------ steps; `ctl` lists the sliders shown, `start` the settings a step opens with
const NOLIMIT = { depth: 15, split: 2, leaf: 1 };
const STEPS = [
  { title: 'How does max_depth limit the tree?', draw: depthDiagram },
  { title: 'What does max_depth do to the decision regions?', ctl: ['depth'], start: { ...NOLIMIT, depth: 3 }, draw: viz },
  { title: 'How does min_samples_split limit the tree?', draw: splitDiagram },
  { title: 'What does min_samples_split do to the decision regions?', ctl: ['split'], start: { ...NOLIMIT, split: 20 }, draw: viz },
  { title: 'How does min_samples_leaf limit the tree?', draw: leafDiagram },
  { title: 'What does min_samples_leaf do to the decision regions?', ctl: ['leaf'], start: { ...NOLIMIT, leaf: 10 }, draw: viz },
  { title: 'What happens when we use all three together?', ctl: ['depth', 'split', 'leaf'], start: { depth: 5, split: 20, leaf: 10 }, draw: viz },
];
const show = k => k === 'depth' && P.depth >= 15 ? 'None' : P[k];
['depth', 'split', 'leaf'].forEach(k => $(k).addEventListener('input', () => { P[k] = +$(k).value; draw(); }));

let step = Math.max(0, Math.min(STEPS.length - 1, (parseInt(location.hash.slice(1), 10) || 1) - 1));
function draw() {
  const S = STEPS[step], svg = $('fig'); svg.innerHTML = '';
  $('title').textContent = S.title; $('stepno').textContent = `step ${step + 1} of ${STEPS.length}`;
  $('prev').disabled = step === 0; $('next').disabled = step === STEPS.length - 1;
  ['depth', 'split', 'leaf'].forEach(k => { $('c-' + k).classList.toggle('hide', !(S.ctl || []).includes(k)); $(k).value = P[k]; $('v-' + k).textContent = show(k); });
  S.draw(el(svg, 'g', {}));
}
function go(s) { step = Math.max(0, Math.min(STEPS.length - 1, s)); if (STEPS[step].start) P = { ...STEPS[step].start }; draw(); history.replaceState(null, '', '#' + (step + 1)); }
$('prev').onclick = () => go(step - 1); $('next').onclick = () => go(step + 1);
document.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; if (e.key === 'ArrowRight') go(step + 1); else if (e.key === 'ArrowLeft') go(step - 1); });
go(step);
})();
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Threshold Search on Numerical Features</title>
</head>
<body>
<style>
  :root {
    color-scheme: light;
    --paper: #ffffff; --ink: #222222; --ink-2: #666666; --ink-3: #9a9a9a;
    --rule: #dcdcdc; --grid: #ececec; --raw: #8f8f8f; --raw-dot: #8c8c8c; --clean: #444444;
    --ma: #2a78d6; --med: #1baf7a; --wm: #4a3aa7; --ewma: #eb6834;
    --sans: "Helvetica Neue", Helvetica, -apple-system, Arial, sans-serif;
    --mono: Menlo, "SF Mono", Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.4; padding-block: 10px 10px; padding-inline: 14px; -webkit-font-smoothing: antialiased; }
  .stage { max-width: 1880px; margin: 0 auto; display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 10px; height: calc(100vh - 20px); }
  .slide { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 16px 30px 8px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 6px; min-height: 0; position: relative; outline: none; cursor: pointer; user-select: none; }
  .slide:focus-visible { box-shadow: 0 0 0 3px rgba(42,120,214,.35); }
  .head h1 { margin: 0; font-size: clamp(24px, 2.4vw, 36px); font-weight: 700; letter-spacing: -0.01em; line-height: 1.15; }
  .head h1 .tag { display: inline-block; font-family: var(--mono); font-weight: 400; font-size: 0.6em; color: var(--ink-2); margin-left: 10px; vertical-align: middle; background: #f4f4f4; padding: 2px 8px; border-radius: 4px; white-space: nowrap; }
  .head p { margin: 6px 0 0; color: #444; font-size: clamp(18px, 1.7vw, 24px); max-width: none; }
  .head p:empty { display: none; }
  .head h1 .tag:empty { display: none; }
  .code { margin: 8px 0 0; font-family: var(--mono); font-size: clamp(15px, 1.4vw, 21px); color: var(--ink); background: #f4f6f9; border: 1px solid var(--rule); border-radius: 5px; padding: 6px 12px; white-space: pre; overflow-x: auto; }
  .code[hidden] { display: none; }
  .code .p { color: var(--ma); font-weight: 700; }
  .chart-wrap { position: relative; min-height: 0; height: 100%; display: flex; justify-content: center; align-items: center; }
  svg.chart { display: block; height: 100%; width: auto; max-width: 100%; max-height: 100%; overflow: visible; }
  .tt { position: absolute; pointer-events: none; display: none; background: #fff; border: 1px solid var(--rule); border-radius: 4px; padding: 6px 9px; font-family: var(--mono); font-size: 15px; color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,.08); white-space: nowrap; z-index: 2; }
  .tt .row { display: flex; gap: 10px; justify-content: space-between; }
  .tt .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .foot { position: absolute; top: 9px; right: 16px; display: flex; gap: 14px; align-items: baseline; font-size: 14px; color: var(--ink-3); padding: 0; pointer-events: none; }
  .foot .ctr { font-family: var(--mono); }
  .bar { display:flex; flex-direction:column; gap:12px; padding:12px 24px;
         border:1px solid var(--rule); border-radius:6px; background:#f6f7f9; font-size:19px; color:var(--ink); }
  .bar .row { display:flex; justify-content:flex-start; align-items:center; gap:16px 32px; flex-wrap:wrap; }
  .bar .row.dials .group { flex:1 1 0; }
  .bar .row.dials input[type=range] { flex:1 1 auto; width:auto; }
  .group { display:flex; align-items:center; gap:10px; }
  .group label { font-size:18px; font-weight:700; color:var(--ink); letter-spacing:0; text-transform:none; white-space:nowrap; }
  .val { font-family:var(--mono); font-size:19px; font-weight:700; color:var(--ma); min-width:5ch; white-space:nowrap; }
  button, select { font:inherit; font-size:18px; color:var(--ink); background:#fff; border:1px solid #9a9a9a; border-radius:6px; padding:9px 16px; cursor:pointer; }
  button:hover, select:hover { border-color:var(--ink); }
  button.primary { background:var(--ma); color:#fff; border-color:var(--ma); min-width:88px; font-weight:700; }
  button:focus-visible, select:focus-visible { outline:2px solid var(--ma); outline-offset:2px; }
  input[type=range] { -webkit-appearance:none; appearance:none; accent-color:var(--ma); width:260px; height:36px; background:transparent; cursor:pointer; }
  input[type=range]::-webkit-slider-runnable-track { height:8px; border-radius:4px; background:#c9d1dc; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:26px; height:26px; border-radius:50%; background:var(--ma); border:3px solid #fff; box-shadow:0 0 0 1.5px var(--ma); margin-top:-9px; }
  input[type=range]::-moz-range-track { height:8px; border-radius:4px; background:#c9d1dc; }
  input[type=range]::-moz-range-thumb { width:26px; height:26px; border-radius:50%; background:var(--ma); border:3px solid #fff; }
  .hint { margin-left:auto; color:var(--ink-2); font-size:12px; }
  .hint kbd { font-family:var(--mono); background:#fff; border:1px solid var(--rule); border-radius:3px; padding:0 5px; font-size:11px; }
  svg text { white-space: pre; }
  .grid line { stroke: var(--grid); stroke-width: 1.3; }
  .axis line, .axis path { stroke: var(--ink-2); stroke-width: 1.3; fill: none; }
  .axis text { font-family: var(--mono); font-size: 20px; fill: var(--ink-2); }
  .axis-title { font-family: var(--sans); font-size: 22px; fill: var(--ink-2); }
  .box { fill: #fafafa; stroke: var(--ink-3); stroke-width: 1; }
  .box.win { stroke: var(--ma); stroke-width: 2; fill: #eef4fc; }
  .pid { font-family: var(--mono); font-size: 20px; font-weight: 700; fill: #fff; text-anchor: middle; pointer-events: none; }
  .lab { font-family: var(--sans); font-size: 20px; fill: var(--ink); }
  .lab.b { font-weight: 700; }
  .lab.sub { fill: var(--ink-2); font-size: 20px; }
  .num { font-family: var(--mono); font-size: 20px; fill: var(--ink); }
  .formula { font-family: var(--mono); font-size: 22px; fill: var(--ink); }
  .formula.hi { fill: var(--ma); font-weight: 700; }
  .q { font-family: var(--sans); font-size: 20px; font-weight: 700; fill: var(--ma); text-anchor: middle; }
  .branch { stroke: var(--ink-3); stroke-width: 1.2; fill: none; }
  .curve { fill: none; stroke: var(--ink); stroke-width: 2; }
  .ptitle { font-family: var(--sans); font-size: 20px; font-weight: 700; fill: var(--ink); }
  @media (max-width: 720px) { .slide { padding: 18px 16px 12px; min-height: 0; } .hint { display: none; } }
  .hint { display:none !important; }
  button.tb { min-width:54px; padding:9px 12px; font-size:22px; line-height:1; }
  button.primary.tb { min-width:64px; }
</style>

<div class="stage">
  <section class="slide" id="slide" tabindex="0" aria-live="polite">
    <div class="head">
      <h1 id="title">Twelve windows in the feature plane</h1>
      <p id="subtitle"></p>
      <pre class="code" id="code" hidden></pre>
    </div>
    <div class="chart-wrap">
      <svg class="chart" id="chart" viewBox="0 0 1276 580" role="img" aria-label="Feature plane with a moving threshold and the information gain at each threshold"></svg>
      <div class="tt" id="tt"></div>
    </div>
    <div class="foot">
      <span>CS328 &nbsp;·&nbsp; Decision Trees</span>
      <span class="ctr" id="counter"></span>
    </div>
  </section>

  <div class="bar">
   <div class="row">
    <div class="group">
      <button id="prev" class="tb" title="Previous step (←)">⏮</button>
      <button id="play" class="primary tb" title="Play / pause (space)">▶</button>
      <button id="next" class="tb" title="Next step (→)">⏭</button>
      <button id="restart" class="tb" title="Restart this step (r)">↺</button>
      <button id="reset" title="Reset all dials to defaults">Reset dials</button>
    </div>
    <div class="group">
      <label for="feat">Feature scanned</label>
      <select id="feat">
        <option value="std">std_mag</option>
        <option value="mean">mean_mag</option>
      </select>
    </div>
    <div class="group">
      <label for="cands">Candidate thresholds</label>
      <select id="cands">
        <option value="six">the chapter's six</option>
        <option value="mid">every midpoint between sorted values</option>
      </select>
    </div>
    <div class="group">
      <label for="root">Root split</label>
      <select id="root">
        <option value="std:2.5">std_mag ≤ 2.5</option>
        <option value="mean:11.75">mean_mag ≤ 11.75</option>
        <option value="std:4.9">std_mag ≤ 4.9</option>
      </select>
    </div>
    <div class="group">
      <label for="crit">Impurity</label>
      <select id="crit">
        <option value="entropy">entropy H</option>
        <option value="gini">Gini G</option>
      </select>
    </div>
    <div class="group">
      <label for="speed">Speed</label>
      <select id="speed">
        <option value="4">very slow</option>
        <option value="8">slow</option>
        <option value="16" selected>normal</option>
        <option value="32">fast</option>
        <option value="0">instant</option>
      </select>
    </div>
   </div>
  </div>
</div>

<script>
(() => {
  // ------------------------------------------------------------ data (chapter table: 12 windows)
  // [window, mean_mag, std_mag, class index]
  const D = [
    [1, 9.8, 2.0, 0], [2, 10.0, 1.9, 0], [3, 9.9, 2.2, 0], [4, 10.1, 2.1, 0],
    [5, 9.7, 3.5, 1], [6, 9.8, 3.0, 1], [7, 9.9, 3.2, 1], [8, 10.0, 2.8, 1],
    [9, 13.5, 6.4, 2], [10, 13.8, 6.7, 2], [11, 14.0, 6.5, 2], [12, 13.4, 6.3, 2]
  ];
  const CLS = ['Walking', 'Upstairs', 'Running'];
  const CCOL = ['#2a78d6', '#eb6834', '#1baf7a'];
  const FEAT = { mean: { name: 'mean_mag', col: 1, lo: 9, hi: 14.5, six: [9.85, 10.05, 11.75] }, std: { name: 'std_mag', col: 2, lo: 1, hi: 7.5, six: [2.05, 2.5, 4.9] } };

  // ------------------------------------------------------------ impurity
  let crit = 'entropy';
  const SYM = () => crit === 'entropy' ? 'H' : 'G';
  function imp(ct) { const n = ct.reduce((a, b) => a + b, 0); if (!n) return 0; let s = 0; ct.forEach(c => { if (!c) return; const p = c / n; s += crit === 'entropy' ? -p * Math.log2(p) : p * p; }); return crit === 'entropy' ? s : 1 - s; }
  const counts = set => CLS.map((_, k) => set.filter(d => d[3] === k).length);
  const f3 = v => v.toFixed(3);
  function splitAt(set, f, t) {
    const col = FEAT[f].col, L = set.filter(d => d[col] <= t), R = set.filter(d => d[col] > t);
    const cL = counts(L), cR = counts(R), hL = imp(cL), hR = imp(cR), h = imp(counts(set));
    const avg = (L.length * hL + R.length * hR) / set.length;
    return { L, R, cL, cR, hL, hR, h, avg, gain: h - avg };
  }
  let candMode = 'six';
  function candidates(set, f) {
    if (candMode === 'six') return FEAT[f].six.slice();
    const v = [...new Set(set.map(d => d[FEAT[f].col]))].sort((a, b) => a - b);
    const out = []; for (let i = 1; i < v.length; i++) out.push(Math.round(((v[i - 1] + v[i]) / 2) * 1000) / 1000);
    return out;
  }
  const PREF = ['std:2.5', 'mean:11.75'];   // the chapter's tie-breaks
  function bestSplit(set) {
    let best = null;
    ['std', 'mean'].forEach(f => candidates(set, f).forEach(t => {
      const s = splitAt(set, f, t); const key = `${f}:${t}`;
      if (!best || s.gain > best.gain + 1e-9 || (Math.abs(s.gain - best.gain) < 1e-9 && PREF.indexOf(key) >= 0 && PREF.indexOf(best.key) < 0)) best = Object.assign({ f, t, key }, s);
    }));
    return best;
  }
  function buildTree(set, forced) {
    const ct = counts(set), h = imp(ct);
    const node = { set, ct, h, n: set.length };
    if (h === 0 || set.length < 2) { node.leaf = true; node.cls = ct.indexOf(Math.max(...ct)); return node; }
    const s = forced ? Object.assign({ f: forced.f, t: forced.t, key: `${forced.f}:${forced.t}` }, splitAt(set, forced.f, forced.t)) : bestSplit(set);
    if (!s || s.gain <= 1e-9) { node.leaf = true; node.cls = ct.indexOf(Math.max(...ct)); return node; }
    node.split = s; node.kids = [buildTree(s.L), buildTree(s.R)];
    return node;
  }

  // ------------------------------------------------------------ state
  const $ = id => document.getElementById(id);
  const chart = $('chart');
  let feat = 'std', rootKey = 'std:2.5', speed = 16;
  const dirty = {};
  let steps = [], step = 0, cursor = 0, playing = false, raf = 0, lastT = 0;
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rootSplit = () => { const [f, t] = rootKey.split(':'); return { f, t: parseFloat(t) }; };

  function buildSteps() {
    const S = SYM(), h0 = imp(counts(D));
    const rs = rootSplit(), r = splitAt(D, rs.f, rs.t);
    const impure = r.hL > 0 ? { set: r.L, side: 'Yes', desc: `${FEAT[rs.f].name} ≤ ${rs.t}` } : { set: r.R, side: 'No', desc: `${FEAT[rs.f].name} > ${rs.t}` };
    const bestRec = bestSplit(impure.set);
    const tree = buildTree(D, rs);
    const codeLine = `dt = DecisionTreeClassifier(criterion=<b class="p">'${crit}'</b>)`;
    return [
      { kind: 'data', set: D, frames: 0, presets: {},
        title: 'Twelve windows in the feature plane', tag: `n = 12 · ${S}(S) = ${f3(h0)}`,
        subtitle: '' },
      { kind: 'scan', set: D, frames: 100, rate: 1, presets: { feat: 'std' }, code: codeLine,
        title: 'Scanning thresholds on one feature', tagFn: f => `${FEAT[f].name} · ${S}(S) = ${f3(h0)}`,
        subtitle: '' },
      { kind: 'scan', set: D, frames: 100, rate: 1, presets: { feat: 'mean' }, code: codeLine,
        title: 'Scanning thresholds on the other feature', tagFn: f => `${FEAT[f].name} · ${S}(S) = ${f3(h0)}`,
        subtitle: '' },
      { kind: 'scan', set: impure.set, frames: 100, rate: 1, presets: { feat: bestRec.f }, root: rs, impure, code: codeLine,
        title: 'Recursing on the impure branch', tagFn: f => `root ${FEAT[rs.f].name} ≤ ${rs.t} · ${impure.side} branch: ${FEAT[f].name}`,
        subtitle: '' },
      { kind: 'tree', set: D, frames: 2, rate: 0.03, presets: {}, tree, code: 'dt.fit(X_train, y_train)',
        title: 'Finished tree and its decision regions', tag: `root ${FEAT[rs.f].name} ≤ ${rs.t}`,
        subtitle: '' }
    ];
  }

  // ------------------------------------------------------------ layout
  const svgNS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs = {}, parent) => { const n = document.createElementNS(svgNS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; };
  const txt = (x, y, s, cls, attrs = {}, parent) => { const t = el('text', Object.assign({ x, y, class: cls }, attrs), parent); t.textContent = s; return t; };
  const W = 1276, PL = 76, PR = 36, GAP = 120;        // left pad (vertical y title), right pad, gap between panels
  const SX0 = PL, SX1 = PL + Math.round((W - PL - PR - GAP) * 0.555), SY0 = 40, SY1 = 440;      // scatter
  const GX0 = SX1 + GAP, GX1 = W - PR, GY0 = 40, GY1 = 440;    // gain panel / tree panel
  const xm = v => SX0 + (v - FEAT.mean.lo) / (FEAT.mean.hi - FEAT.mean.lo) * (SX1 - SX0);
  const ys = v => SY1 - (v - FEAT.std.lo) / (FEAT.std.hi - FEAT.std.lo) * (SY1 - SY0);
  let G = {};

  function drawStatic() {
    chart.innerHTML = '';
    G.regions = el('g', {}, chart);
    G.back = el('g', {}, chart);
    G.dyn = el('g', {}, chart);
    G.pts = el('g', {}, chart);
    G.right = el('g', {}, chart);
    G.legend = el('g', {}, chart);
    // scatter axes
    const g = el('g', { class: 'grid' }, G.back), a = el('g', { class: 'axis' }, G.back);
    for (let v = 9; v <= 14.5; v += 1) { el('line', { x1: xm(v), x2: xm(v), y1: SY0, y2: SY1 }, g); txt(xm(v), SY1 + 18, v.toFixed(0), '', { 'text-anchor': 'middle' }, a); }
    for (let v = 1; v <= 7.5; v += 1) { el('line', { x1: SX0, x2: SX1, y1: ys(v), y2: ys(v) }, g); txt(SX0 - 8, ys(v) + 4, v.toFixed(0), '', { 'text-anchor': 'end' }, a); }
    el('path', { d: `M${SX0},${SY0}V${SY1}H${SX1}` }, a);
    txt((SX0 + SX1) / 2, SY1 + 40, 'mean_mag  (mean of ‖a‖ in the window)', 'axis-title', { 'text-anchor': 'middle' }, G.back);
    txt(0, 0, 'std_mag  (std of ‖a‖ in the window)', 'axis-title', { 'text-anchor': 'middle', transform: `translate(${SX0 - 56}, ${(SY0 + SY1) / 2}) rotate(-90)` }, G.back);
    const d = steps[step];
    if (d.kind === 'data') {
      ['mean', 'std'].forEach(f => FEAT[f].six.forEach((t, ti) => {
        if (f === 'mean') el('line', { x1: xm(t), x2: xm(t), y1: SY0, y2: SY1, stroke: '#444', 'stroke-dasharray': '4 4', opacity: .6 }, G.back);
        else el('line', { x1: SX0, x2: SX1, y1: ys(t), y2: ys(t), stroke: '#444', 'stroke-dasharray': '4 4', opacity: .6 }, G.back);
        txt(f === 'mean' ? xm(t) + 4 : SX1 - 4, f === 'mean' ? SY0 + 14 + (ti % 2) * 22 : ys(t) - 4, `${FEAT[f].name} ≤ ${t}`, 'num', { fill: 'var(--ink-2)', 'text-anchor': f === 'mean' ? 'start' : 'end' }, G.back);
      }));
    }
    if (d.kind === 'scan') drawGainAxes(d);
    drawLegend();
  }
  function drawGainAxes(d) {
    const g = el('g', { class: 'grid' }, G.back), a = el('g', { class: 'axis' }, G.back);
    const F = FEAT[feat], hmax = Math.max(0.5, imp(counts(d.set)));
    G.gx = t => GX0 + (t - F.lo) / (F.hi - F.lo) * (GX1 - GX0);
    G.gy = v => GY1 - (v / hmax) * (GY1 - GY0);
    const step_ = F === FEAT.mean ? 1 : 1;
    for (let v = F.lo; v <= F.hi + 1e-9; v += step_) { el('line', { x1: G.gx(v), x2: G.gx(v), y1: GY0, y2: GY1 }, g); txt(G.gx(v), GY1 + 18, v.toFixed(0), '', { 'text-anchor': 'middle' }, a); }
    const ts = crit === 'entropy' ? 0.25 : 0.1; for (let v = 0; v <= hmax + 1e-9; v += ts) { el('line', { x1: GX0, x2: GX1, y1: G.gy(v), y2: G.gy(v) }, g); txt(GX0 - 8, G.gy(v) + 4, v.toFixed(2), '', { 'text-anchor': 'end' }, a); }
    el('path', { d: `M${GX0},${GY0}V${GY1}H${GX1}` }, a);
    txt((GX0 + GX1) / 2, GY1 + 40, `threshold t on ${F.name}`, 'axis-title', { 'text-anchor': 'middle' }, G.back);
    txt(0, 0, `information gain of "${F.name} ≤ t"`, 'axis-title', { 'text-anchor': 'middle', transform: `translate(${GX0 - 70}, ${(GY0 + GY1) / 2}) rotate(-90)` }, G.back);
    el('line', { x1: GX0, x2: GX1, y1: G.gy(hmax), y2: G.gy(hmax), stroke: 'var(--ink-3)', 'stroke-dasharray': '2 3' }, G.back);
    txt(GX1 - 4, G.gy(hmax) + 15, `${SYM()}(S) = ${f3(hmax)}  (largest possible gain)`, 'num', { 'font-size': 15, fill: 'var(--ink-2)', 'text-anchor': 'end' }, G.back);
  }
  function drawLegend() {
    G.legend.innerHTML = '';
    const d = steps[step];
    const rowH = 30, padX = 10, padY = 8;
    const items = CLS.map((c, k) => ({ c: CCOL[k], n: c }));
    if (d.kind === 'data') items.push({ c: '#444', n: 'candidate threshold', dash: true });
    if (d.kind === 'scan') { items.push({ c: 'var(--ink)', n: 'threshold line', line: true }); items.push({ c: '#444', n: 'on the "≤ t" side', ring: true }); }
    if (d.kind === 'tree') CLS.forEach((c, k) => items.push({ c: CCOL[k], n: `${c} region`, fillRect: true }));
    const wdt = 12 + Math.max(...items.map(i => i.n.length)) * 10.5 + 2 * padX + 22;
    const hgt = items.length * rowH + 2 * padY - 4, topLeft = d.kind === 'data';
    const x0 = topLeft ? SX0 + 8 : SX1 - wdt - 8, y0 = topLeft ? SY0 + (d.kind === 'data' ? 52 : 8) : SY1 - hgt - 8;
    el('rect', { x: x0, y: y0, width: wdt, height: hgt, rx: 4, fill: '#fff', 'fill-opacity': .9, stroke: 'var(--rule)' }, G.legend);
    items.forEach((it, j) => {
      const y = y0 + padY + j * rowH + 6;
      if (it.dash || it.line) el('line', { x1: x0 + padX, x2: x0 + padX + 18, y1: y, y2: y, stroke: it.c, 'stroke-width': it.line ? 2 : 1.5, 'stroke-dasharray': it.dash ? '4 4' : 'none' }, G.legend);
      else if (it.ring) el('circle', { cx: x0 + padX + 9, cy: y, r: 6, fill: 'none', stroke: it.c, 'stroke-width': 2 }, G.legend);
      else if (it.fillRect) el('rect', { x: x0 + padX, y: y - 7, width: 18, height: 14, fill: it.c, opacity: .22 }, G.legend);
      else el('circle', { cx: x0 + padX + 9, cy: y, r: 6, fill: it.c }, G.legend);
      txt(x0 + padX + 26, y + 4, it.n, 'axis-title', { fill: 'var(--ink)' }, G.legend);
    });
    if (d.kind === 'scan') {
      const it2 = [{ n: 'gain at every threshold t', line: true, c: 'var(--ink-3)' }, { n: 'candidate evaluated', dot: true, c: 'var(--ma)' }];
      const w2 = 36 + Math.max(...it2.map(i => i.n.length)) * 11 + 2 * padX, x1 = GX1 - w2 - 8, y1 = GY0 + 28;
      el('rect', { x: x1, y: y1, width: w2, height: it2.length * rowH + 2 * padY - 4, rx: 4, fill: '#fff', 'fill-opacity': .9, stroke: 'var(--rule)' }, G.legend);
      it2.forEach((it, j) => {
        const y = y1 + padY + j * rowH + 6;
        if (it.line) el('line', { x1: x1 + padX, x2: x1 + padX + 18, y1: y, y2: y, stroke: it.c, 'stroke-width': 2 }, G.legend);
        else el('circle', { cx: x1 + padX + 9, cy: y, r: 5.5, fill: it.c }, G.legend);
        txt(x1 + padX + 26, y + 4, it.n, 'axis-title', { fill: 'var(--ink)' }, G.legend);
      });
    }
  }
  function drawPoints(set, ringFn) {
    G.pts.innerHTML = '';
    const inSet = new Set(set.map(d => d[0]));
    D.forEach(d => {
      const x = xm(d[1]), y = ys(d[2]), active = inSet.has(d[0]);
      const g = el('g', { 'data-id': d[0] }, G.pts);
      if (active && ringFn && ringFn(d)) el('circle', { cx: x, cy: y, r: 11, fill: 'none', stroke: '#444', 'stroke-width': 2 }, g);
      el('circle', { cx: x, cy: y, r: 7, fill: CCOL[d[3]], stroke: '#fff', 'stroke-width': 1.5, opacity: active ? 1 : 0.22 }, g);
      txt(x + 10, y - 8, d[0], 'num', { 'font-size': 15, fill: active ? 'var(--ink-2)' : 'var(--ink-3)' }, g);
    });
  }

  // ------------------------------------------------------------ renderers
  function renderData(d) {
    G.dyn.innerHTML = ''; G.right.innerHTML = ''; G.regions.innerHTML = '';
    drawPoints(D);
    const ct = counts(D), h = imp(ct), S = SYM();
    txt(GX0, GY0 + 30, `S: ${ct[0]} Walking · ${ct[1]} Upstairs · ${ct[2]} Running`, 'lab b', {}, G.right);
    const f = crit === 'entropy' ? `H(S) = −3 · (4/12) log₂(4/12) = log₂ 3 = ${f3(h)}` : `G(S) = 1 − 3 · (4/12)² = ${f3(h)}`;
    txt(GX0, GY0 + 70, f, 'formula', { style: 'font-size:18px' }, G.right);
    txt(GX0, GY0 + 96, 'three equal classes: the maximum for 3 classes', 'lab sub', {}, G.right);
    txt(GX0, GY0 + 150, 'candidate splits (each of the form feature ≤ t):', 'lab b', {}, G.right);
    ['mean', 'std'].forEach((fk, i) => txt(GX0, GY0 + 178 + i * 26, `${FEAT[fk].name} ≤ ${FEAT[fk].six.join('  |  ')}`, 'num', { 'font-size': 15 }, G.right));
    txt(GX0, GY0 + 250, 'the general algorithm tries every midpoint', 'lab sub', {}, G.right);
    txt(GX0, GY0 + 270, 'between adjacent sorted values of each feature', 'lab sub', {}, G.right);
  }

  function renderScan(d, c) {
    G.dyn.innerHTML = ''; G.right.innerHTML = ''; G.regions.innerHTML = '';
    const F = FEAT[feat], t = F.lo + (Math.min(c, d.frames) / d.frames) * (F.hi - F.lo);
    // fixed root split (recursion step): shade the pure branch
    if (d.root) {
      const rs = d.root;
      if (rs.f === 'std') el('line', { x1: SX0, x2: SX1, y1: ys(rs.t), y2: ys(rs.t), stroke: '#444', 'stroke-width': 2 }, G.regions);
      else el('line', { x1: xm(rs.t), x2: xm(rs.t), y1: SY0, y2: SY1, stroke: '#444', 'stroke-width': 2 }, G.regions);
      const r = splitAt(D, rs.f, rs.t), pure = r.hL === 0 ? r.L : r.R, pk = pure[0][3];
      const rect = rs.f === 'std' ? (r.hL === 0 ? { x: SX0, y: ys(rs.t), w: SX1 - SX0, h: SY1 - ys(rs.t) } : { x: SX0, y: SY0, w: SX1 - SX0, h: ys(rs.t) - SY0 })
                                  : (r.hL === 0 ? { x: SX0, y: SY0, w: xm(rs.t) - SX0, h: SY1 - SY0 } : { x: xm(rs.t), y: SY0, w: SX1 - xm(rs.t), h: SY1 - SY0 });
      el('rect', { x: rect.x, y: rect.y, width: rect.w, height: rect.h, fill: CCOL[pk], opacity: .18 }, G.regions);
      txt(rect.x + 8, rect.y + rect.h - 8, `pure leaf: ${CLS[pk]} (n=${pure.length}), ${SYM()} = 0`, 'lab b', { fill: CCOL[pk] }, G.regions);
      txt(rs.f === 'std' ? xm(FEAT.mean.lo + 1.45) : xm(rs.t) + 6, rs.f === 'std' ? ys(rs.t) - 6 : SY0 + 38, `root: ${F === FEAT[rs.f] ? '' : ''}${FEAT[rs.f].name} ≤ ${rs.t}`, 'num', { style: 'font-size:16px', fill: '#444' }, G.regions);
    }
    // threshold line
    const ringFn = dd => dd[F.col] <= t;
    drawPoints(d.set, ringFn);
    if (feat === 'std') { el('line', { x1: SX0, x2: SX1, y1: ys(t), y2: ys(t), stroke: 'var(--ink)', 'stroke-width': 2 }, G.dyn); txt(SX0 + 8, ys(t) - 7, `${F.name} ≤ ${t.toFixed(2)}`, 'num', { 'font-size': 15, 'font-weight': 700 }, G.dyn); }
    else { el('line', { x1: xm(t), x2: xm(t), y1: SY0, y2: SY1, stroke: 'var(--ink)', 'stroke-width': 2 }, G.dyn); const flip = xm(t) > SX0 + (SX1 - SX0) * 0.6; txt(flip ? xm(t) - 6 : xm(t) + 6, SY0 + 16, `${F.name} ≤ ${t.toFixed(2)}`, 'num', { 'font-weight': 700, 'text-anchor': flip ? 'end' : 'start' }, G.dyn); }
    // live split numbers under the scatter
    const s = splitAt(d.set, feat, t), S = SYM();
    const cts = ct => `${ct[0]} W · ${ct[1]} U · ${ct[2]} R`;
    txt(SX0, 506, `≤ t :  ${cts(s.cL)}   ${S} = ${f3(s.hL)}      > t :  ${cts(s.cR)}   ${S} = ${f3(s.hR)}`, 'num', { 'font-size': 15 }, G.dyn);
    txt(SX0, 538, `gain = ${f3(s.h)} − (${s.L.length}/${d.set.length} × ${f3(s.hL)} + ${s.R.length}/${d.set.length} × ${f3(s.hR)}) = ${f3(s.gain)}`, 'formula', {}, G.dyn);
    // gain curve traced up to t
    let path = '', prev = null;
    const NG = 220;
    for (let i = 0; i <= NG; i++) {
      const tt_ = F.lo + (i / NG) * (F.hi - F.lo); if (tt_ > t + 1e-9) break;
      const gv = splitAt(d.set, feat, tt_).gain;
      path += (i ? 'L' : 'M') + G.gx(tt_).toFixed(1) + ',' + G.gy(gv).toFixed(1); prev = gv;
    }
    if (path) el('path', { d: path, fill: 'none', stroke: 'var(--ink-3)', 'stroke-width': 2 }, G.right);
    el('line', { x1: G.gx(t), x2: G.gx(t), y1: GY0, y2: GY1, stroke: 'var(--ink)', 'stroke-width': 1, 'stroke-dasharray': '3 3' }, G.right);
    el('circle', { cx: G.gx(t), cy: G.gy(s.gain), r: 5, fill: '#fff', stroke: 'var(--ink)', 'stroke-width': 2 }, G.right);
    const cands = candidates(d.set, feat);
    let best = null;
    cands.forEach((tc, ci) => {
      if (tc > t + 1e-9) { el('line', { x1: G.gx(tc), x2: G.gx(tc), y1: GY1 - 6, y2: GY1 + 6, stroke: 'var(--ma)', 'stroke-width': 1.5 }, G.right); return; }
      const gv = splitAt(d.set, feat, tc).gain;
      el('circle', { cx: G.gx(tc), cy: G.gy(gv), r: 6, fill: 'var(--ma)', stroke: '#fff', 'stroke-width': 1.5 }, G.right);
      txt(G.gx(tc), G.gy(gv) - 12 - (ci % 2) * 22, `${tc}: ${f3(gv)}`, 'num', { 'text-anchor': 'middle', fill: 'var(--ma)' }, G.right);
      if (!best || gv > best.g + 1e-9) best = { t: tc, g: gv };
    });
    if (c >= d.frames && best) {
      const ties = cands.filter(tc => Math.abs(splitAt(d.set, feat, tc).gain - best.g) < 1e-9);
      txt(SX0, 572, `best on ${F.name}: ${ties.map(v => `≤ ${v}`).join(', ')}  (gain ${f3(best.g)})`, 'formula hi', {}, G.right);
      if (ties.length > 1) txt(GX1, 572, `a tie: the algorithm picks one of these`, 'lab sub', { 'text-anchor': 'end' }, G.right);
    }
  }

  function renderTree(d, c) {
    G.dyn.innerHTML = ''; G.right.innerHTML = ''; G.regions.innerHTML = '';
    drawPoints(D);
    const shown = Math.min(d.frames, Math.floor(c + 1e-9));
    // regions: walk the tree to depth `shown`
    function region(node, box, depth) {
      if (node.leaf || depth >= shown) {
        const k = node.leaf ? node.cls : node.ct.indexOf(Math.max(...node.ct));
        const pure = node.h === 0;
        el('rect', { x: xm(box.x0), y: ys(box.y1), width: xm(box.x1) - xm(box.x0), height: ys(box.y0) - ys(box.y1), fill: pure ? CCOL[k] : '#8f8f8f', opacity: pure ? .18 : .12 }, G.regions);
        if (depth > 0) txt(xm(box.x0) + 8, box.y1 - box.y0 > 3 ? ys(box.y1) + 22 : ys(box.y0) - 8, pure ? `${CLS[k]} (n=${node.n})` : `mixed: ${node.ct.join(' · ')}`, 'lab b', { fill: pure ? CCOL[k] : 'var(--ink-2)', style: 'font-size:16px' }, G.regions);
        return;
      }
      const s = node.split;
      if (s.f === 'std') {
        el('line', { x1: xm(box.x0), x2: xm(box.x1), y1: ys(s.t), y2: ys(s.t), stroke: '#444', 'stroke-width': 2 }, G.dyn);
        region(node.kids[0], { x0: box.x0, x1: box.x1, y0: box.y0, y1: s.t }, depth + 1);
        region(node.kids[1], { x0: box.x0, x1: box.x1, y0: s.t, y1: box.y1 }, depth + 1);
      } else {
        el('line', { x1: xm(s.t), x2: xm(s.t), y1: ys(box.y0), y2: ys(box.y1), stroke: '#444', 'stroke-width': 2 }, G.dyn);
        region(node.kids[0], { x0: box.x0, x1: s.t, y0: box.y0, y1: box.y1 }, depth + 1);
        region(node.kids[1], { x0: s.t, x1: box.x1, y0: box.y0, y1: box.y1 }, depth + 1);
      }
    }
    region(d.tree, { x0: FEAT.mean.lo, x1: FEAT.mean.hi, y0: FEAT.std.lo, y1: FEAT.std.hi }, 0);
    // tree diagram: one column per leaf, each parent centred over its children (uses the whole right half: no gain panel on this step)
    const NH = 48, NHI = 68, TX0 = SX1 + 24, TX1 = GX1;
    const leafCount = (nd, depth) => (nd.leaf || depth >= shown) ? 1 : leafCount(nd.kids[0], depth + 1) + leafCount(nd.kids[1], depth + 1);
    const colW = (TX1 - TX0) / leafCount(d.tree, 0), NW = Math.min(230, colW - 10);
    let col = 0;
    function node(nd, y, depth) {
      if (nd.leaf || depth >= shown) {
        const x = TX0 + (col++ + 0.5) * colW;
        const kk = nd.leaf ? nd.cls : nd.ct.indexOf(Math.max(...nd.ct)), pure = nd.h === 0;
        el('rect', { x: x - NW / 2, y, width: NW, height: NH, rx: 6, fill: pure ? CCOL[kk] : '#fff', 'fill-opacity': pure ? .18 : 1, stroke: pure ? CCOL[kk] : 'var(--ink-3)', 'stroke-width': 1.5 }, G.right);
        txt(x, y + 20, pure ? `${CLS[kk]}` : 'not yet split', 'lab b', { 'text-anchor': 'middle', fill: pure ? CCOL[kk] : 'var(--ink-2)' }, G.right);
        txt(x, y + 40, `n = ${nd.n}  (${nd.ct.join(' · ')})`, 'num', { 'text-anchor': 'middle', style: 'font-size:15px' }, G.right);
        return x;
      }
      const cy = y + NHI + 50;
      const xl = node(nd.kids[0], cy, depth + 1), xr = node(nd.kids[1], cy, depth + 1), x = (xl + xr) / 2;
      el('rect', { x: x - NW / 2, y, width: NW, height: NHI, rx: 6, fill: '#fff', stroke: 'var(--ma)', 'stroke-width': 1.5 }, G.right);
      txt(x, y + 21, `${FEAT[nd.split.f].name} ≤ ${nd.split.t} ?`, 'q', { style: 'font-size:17px' }, G.right);
      txt(x, y + 41, `n = ${nd.n}  (${nd.ct.join(' · ')})`, 'num', { 'text-anchor': 'middle', style: 'font-size:15px' }, G.right);
      txt(x, y + 61, `gain ${f3(nd.split.gain)}`, 'num', { 'text-anchor': 'middle', style: 'font-size:15px' }, G.right);
      el('line', { class: 'branch', x1: x, y1: y + NHI, x2: xl, y2: cy }, G.right); el('line', { class: 'branch', x1: x, y1: y + NHI, x2: xr, y2: cy }, G.right);
      txt((x + xl) / 2 - 8, (y + NHI + cy) / 2 + 5, 'Yes', 'lab b', { 'text-anchor': 'end' }, G.right);
      txt((x + xr) / 2 + 8, (y + NHI + cy) / 2 + 5, 'No', 'lab b', {}, G.right);
      return x;
    }
    node(d.tree, GY0 + 10, 0);
  }

  function render() { const d = steps[step]; if (d.kind === 'data') renderData(d); else if (d.kind === 'scan') renderScan(d, cursor); else renderTree(d, cursor); }

  // ------------------------------------------------------------ hover
  const tt = $('tt');
  chart.addEventListener('mousemove', evt => {
    const g = evt.target.closest('[data-id]');
    if (!g) { tt.style.display = 'none'; return; }
    const d = D[parseInt(g.getAttribute('data-id'), 10) - 1];
    tt.innerHTML = `<div class="row"><b>window ${d[0]}</b></div><div class="row"><span>mean_mag</span><span>${d[1].toFixed(1)}</span></div><div class="row"><span>std_mag</span><span>${d[2].toFixed(1)}</span></div><div class="row"><span><i class="sw" style="background:${CCOL[d[3]]}"></i>activity</span><span>${CLS[d[3]]}</span></div>`;
    tt.style.display = 'block';
    const wrap = chart.parentElement.getBoundingClientRect();
    const x = evt.clientX - wrap.left, y = evt.clientY - wrap.top;
    tt.style.left = (x + 16 + tt.offsetWidth > wrap.width ? x - tt.offsetWidth - 12 : x + 16) + 'px';
    tt.style.top = Math.max(0, y - 10) + 'px';
  });
  chart.addEventListener('mouseleave', () => { tt.style.display = 'none'; });

  // ------------------------------------------------------------ step control
  function applyPresets(d) { if (d.presets.feat && !dirty.feat) { feat = d.presets.feat; $('feat').value = feat; } }
  function setHead() {
    const d = steps[step];
    $('title').innerHTML = d.title + `<span class="tag">${d.tagFn ? d.tagFn(feat) : d.tag}</span>`;
    $('subtitle').textContent = d.subtitle;
    const cd = d.code, cs = typeof cd === 'function' ? cd() : cd; $('code').hidden = !cs; $('code').innerHTML = cs || '';
    $('counter').textContent = `${step + 1} / ${steps.length}`;
  }
  function enterStep(k, completed = false) {
    steps = buildSteps();
    step = Math.max(0, Math.min(steps.length - 1, k));
    applyPresets(steps[step]);
    drawStatic(); setHead();
    try { history.replaceState(null, '', '#' + (step + 1)); } catch (_) {}
    stopPlay(); cursor = 0;
    if (completed || speed === 0 || reduceMotion || steps[step].frames === 0) finish();
    else { render(); startPlay(); }
  }
  function liveRedraw() { steps = buildSteps(); const d = steps[step]; cursor = Math.min(cursor, d.frames); drawStatic(); setHead(); render(); }
  const cursorDone = () => cursor >= steps[step].frames;
  function finish() { cursor = steps[step].frames; stopPlay(); render(); }
  function tick(t) {
    if (!playing) return;
    const dt = Math.max(0, Math.min(0.1, (t - lastT) / 1000)); lastT = t;
    cursor += dt * speed * (steps[step].rate || 1);
    if (cursorDone()) { finish(); return; }
    render(); raf = requestAnimationFrame(tick);
  }
  function startPlay() { if (cursorDone()) return; playing = true; lastT = performance.now(); $('play').textContent = '⏸'; raf = requestAnimationFrame(tick); }
  function stopPlay() { playing = false; cancelAnimationFrame(raf); $('play').textContent = '▶'; }
  function next() { if (!cursorDone()) { finish(); return; } if (step < steps.length - 1) enterStep(step + 1); }
  function prev() { if (step > 0) enterStep(step - 1, true); }
  function restart() { enterStep(step); }

  // ------------------------------------------------------------ wiring
  $('next').addEventListener('click', e => { e.stopPropagation(); next(); });
  $('prev').addEventListener('click', e => { e.stopPropagation(); prev(); });
  $('restart').addEventListener('click', e => { e.stopPropagation(); restart(); });
  $('play').addEventListener('click', e => { e.stopPropagation(); if (playing) stopPlay(); else if (cursorDone()) { if (steps[step].frames) restart(); else next(); } else startPlay(); });
  $('slide').addEventListener('click', () => next());
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'SELECT') return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
    else if (e.key === ' ') { e.preventDefault(); $('play').click(); }
    else if (e.key === 'r' || e.key === 'R') restart();
  });
  $('feat').addEventListener('change', e => { dirty.feat = true; feat = e.target.value; liveRedraw(); });
  $('cands').addEventListener('change', e => { dirty.cands = true; candMode = e.target.value; liveRedraw(); });
  $('root').addEventListener('change', e => { dirty.root = true; rootKey = e.target.value; liveRedraw(); });
  $('crit').addEventListener('change', e => { dirty.crit = true; crit = e.target.value; liveRedraw(); });
  $('speed').addEventListener('change', e => { speed = parseFloat(e.target.value); });
  $('reset').addEventListener('click', e => {
    e.stopPropagation();
    for (const k in dirty) delete dirty[k];
    feat = 'std'; candMode = 'six'; rootKey = 'std:2.5'; crit = 'entropy'; speed = 16;
    $('feat').value = 'std'; $('cands').value = 'six'; $('root').value = 'std:2.5'; $('crit').value = 'entropy'; $('speed').value = '16';
    enterStep(step);
  });

  const h = parseInt((location.hash || '').replace('#', ''), 10);
  enterStep(h >= 1 ? h - 1 : 0);
})();
</script>
</body>
</html>

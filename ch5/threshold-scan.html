<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Threshold Search on Numerical Features</title>
</head>
<body>
<style>
  :root {
    color-scheme: light;
    --paper: #ffffff; --ink: #222222; --ink-2: #666666; --ink-3: #9a9a9a; --rule: #dcdcdc; --grid: #ececec; --ma: #2a78d6;
    --sans: "Helvetica Neue", Helvetica, -apple-system, Arial, sans-serif;
    --mono: Menlo, "SF Mono", Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  #app { height: 100vh; padding: 10px 14px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px; }
  .head { padding: 4px 16px 0; }
  h1 { margin: 0; font-size: clamp(24px, 2.4vw, 36px); font-weight: 700; letter-spacing: -0.01em; }
  .main { user-select: none; -webkit-user-select: none; min-height: 0; border: 1px solid var(--rule); border-radius: 6px; padding: 10px 16px; }
  .main svg { width: 100%; height: 100%; display: block; }
  svg text { font-family: var(--sans); }
  .bar { display: flex; gap: 10px; align-items: center; padding: 10px 18px; border: 1px solid var(--rule); border-radius: 6px; background: #f6f7f9; }
  button { font: inherit; font-size: 18px; color: var(--ink); background: #fff; border: 1px solid #9a9a9a; border-radius: 6px; padding: 9px 16px; cursor: pointer; }
  button:hover { border-color: var(--ink); }
  button:disabled { opacity: .45; cursor: default; }
  button.on { background: #e8f1fd; border-color: var(--ma); font-weight: 700; }
  .ctl { display: flex; gap: 8px; align-items: center; margin-left: 18px; }
  .ctl .lbl { font-size: 18px; color: var(--ink-2); margin: 0 4px 0 14px; }
  .ctl b { font-family: var(--mono); font-size: 19px; min-width: 52px; }
  .ctl input[type=range] { width: 260px; -webkit-appearance: none; appearance: none; height: 8px; border-radius: 4px; background: #d9dde3; }
  .ctl input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%; background: var(--ma); cursor: pointer; }
  .ctl input[type=range]::-moz-range-thumb { width: 26px; height: 26px; border: 0; border-radius: 50%; background: var(--ma); cursor: pointer; }
  button.primary { background: var(--ma); color: #fff; border-color: var(--ma); font-weight: 700; margin-left: 14px; }
  .step { font-family: var(--mono); font-size: 17px; color: var(--ink-2); margin-left: auto; }
  .hide { display: none !important; }
</style>

<div id="app">
  <div class="head"><h1 id="title"></h1></div>
  <div class="main"><svg id="fig" viewBox="0 0 1600 760"></svg></div>
  <div class="bar">
    <button id="prev" title="Previous step (←)">⏮ step</button>
    <button id="next" title="Next step (→)">step ⏭</button>
    <span class="ctl" id="ctl"><span class="lbl">std dev ≤</span><input type="range" id="s-std" min="0" step="1"><b id="v-std"></b>
      <span class="lbl">mean ≤</span><input type="range" id="s-mean" min="0" step="1"><b id="v-mean"></b>
      <button id="best" class="primary">Best for each</button></span>
    <span class="step" id="stepno"></span>
  </div>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
function el(parent, tag, attrs, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  parent.appendChild(e); return e;
}

// ------------------------------------------------------------ the book's twelve windows (chapter 5): mean and std dev of accel magnitude (m/s²)
const W = [[9.8,2.0,0],[10.0,1.9,0],[9.9,2.2,0],[10.1,2.1,0],[9.7,3.5,1],[9.8,3.0,1],[9.9,3.2,1],[10.0,2.8,1],[13.5,6.4,2],[13.8,6.7,2],[14.0,6.5,2],[13.4,6.3,2]]
  .map(([mean, std, c], i) => ({ id: i + 1, mean, std, c }));
// six more windows that overlap the others, for the last step: a Walking window with a high std dev, two Upstairs windows with a low one,
// a slow Running window close to Upstairs, a Running window at moderate values, and an Upstairs window with a high std dev
const EXTRA = [[9.9,2.6,0],[9.8,2.3,1],[10.3,2.4,1],[10.6,3.4,2],[11.9,4.6,2],[10.8,5.1,1]].map(([mean, std, c], i) => ({ id: 13 + i, mean, std, c }));
const WALL = W.concat(EXTRA);
const ALL = W.map(w => w.id), ALL18 = WALL.map(w => w.id), win = id => WALL[id - 1];
const CLS = [{ name: 'Walking', col: '#2a78d6' }, { name: 'Upstairs', col: '#eb6834' }, { name: 'Running', col: '#7b4fc9' }];
const FEAT = { mean: { name: 'mean of accel magnitude', short: 'mean', lo: 9.4, hi: 14.3 }, std: { name: 'std dev of accel magnitude', short: 'std dev', lo: 1.6, hi: 7.0 } };

// ------------------------------------------------------------ entropy over three activities, rounded to three places at each stage so the written arithmetic adds up
const r3 = v => Math.round(v * 1000) / 1000, f3 = v => v.toFixed(3);
const cnt = ids => CLS.map((_, c) => ids.filter(i => win(i).c === c).length);
const H = ids => { const n = ids.length; return r3(cnt(ids).reduce((s, k) => k ? s - k / n * Math.log2(k / n) : s, 0)); };
const terms = ids => { const n = ids.length; return cnt(ids).filter(k => k).map((k, i) => `${i ? '− ' : '−'}(${k}/${n}) log₂(${k}/${n})`); };
const tally = ids => cnt(ids).map((k, c) => k ? `${k} ${CLS[c].name}` : '').filter(Boolean).join(', ');
const sides = (ids, f, t) => [ids.filter(i => win(i)[f] <= t), ids.filter(i => win(i)[f] > t)];
const weighted = (ids, f, t) => r3(sides(ids, f, t).reduce((s, g) => s + g.length / ids.length * H(g), 0));
const gain = (ids, f, t) => r3(H(ids) - weighted(ids, f, t));
// every midpoint between neighbouring distinct values is a candidate cut
const cuts = (ids, f) => { const v = [...new Set(ids.map(i => win(i)[f]))].sort((a, b) => a - b); return v.slice(1).map((x, i) => Math.round((x + v[i]) / 2 * 100) / 100); };
const fmt = t => (Math.round(t * 100) / 100).toString();

// ------------------------------------------------------------ drawing helpers
function chips(g, ids, x, y, w, s) {
  const cw = 44 * s, ch = 34 * s, gap = 6 * s, per = Math.max(1, Math.floor((w + gap) / (cw + gap)));
  const n = Math.min(per, ids.length), x0 = x + (w - (n * cw + (n - 1) * gap)) / 2;
  ids.forEach((id, i) => {
    const cx = x0 + (i % per) * (cw + gap), cy = y + Math.floor(i / per) * (ch + gap);
    el(g, 'rect', { x: cx, y: cy, width: cw, height: ch, rx: 6 * s, fill: CLS[win(id).c].col });
    el(g, 'text', { x: cx + cw / 2, y: cy + ch / 2 + 7.5 * s, 'text-anchor': 'middle', 'font-size': 21 * s, 'font-weight': 700, fill: '#fff' }, id);
  });
}
function legend(g, x, y) {
  CLS.forEach((c, i) => { el(g, 'rect', { x: x + i * 170, y: y - 16, width: 20, height: 20, rx: 4, fill: c.col }); el(g, 'text', { x: x + i * 170 + 28, y: y, 'font-size': 21, fill: '#444' }, c.name); });
}
const mono = { 'font-family': 'Menlo, monospace', fill: '#666' };

// the twelve windows in the feature plane, with optional cuts and shaded regions
function plane(g, X, Y, w, h, opts = {}) {
  const sx = v => X + (v - FEAT.mean.lo) / (FEAT.mean.hi - FEAT.mean.lo) * w, sy = v => Y + h - (v - FEAT.std.lo) / (FEAT.std.hi - FEAT.std.lo) * h;
  if (opts.regions) opts.regions.forEach(r => el(g, 'rect', { x: sx(r.x0), y: sy(r.y1), width: sx(r.x1) - sx(r.x0), height: sy(r.y0) - sy(r.y1), fill: CLS[r.c].col, opacity: 0.12 }));
  [10, 11, 12, 13, 14].forEach(v => { el(g, 'line', { x1: sx(v), x2: sx(v), y1: Y, y2: Y + h, stroke: '#ececec', 'stroke-width': 1.5 }); el(g, 'text', { x: sx(v), y: Y + h + 28, 'text-anchor': 'middle', 'font-size': 19, ...mono }, v); });
  [2, 3, 4, 5, 6, 7].forEach(v => { el(g, 'line', { x1: X, x2: X + w, y1: sy(v), y2: sy(v), stroke: '#ececec', 'stroke-width': 1.5 }); el(g, 'text', { x: X - 12, y: sy(v) + 7, 'text-anchor': 'end', 'font-size': 19, ...mono }, v); });
  el(g, 'rect', { x: X, y: Y, width: w, height: h, fill: 'none', stroke: '#666', 'stroke-width': 1.5 });
  el(g, 'text', { x: X + w / 2, y: Y + h + 62, 'text-anchor': 'middle', 'font-size': 22, fill: '#444' }, FEAT.mean.name + ' (m/s²)');
  el(g, 'text', { x: X - 58, y: Y + h / 2, 'text-anchor': 'middle', 'font-size': 22, fill: '#444', transform: `rotate(-90 ${X - 58} ${Y + h / 2})` }, FEAT.std.name);
  (opts.lines || []).forEach(L => {
    const p = L.f === 'mean' ? { x1: sx(L.t), x2: sx(L.t), y1: sy(L.lo ?? FEAT.std.lo), y2: sy(L.hi ?? FEAT.std.hi) } : { x1: sx(L.lo ?? FEAT.mean.lo), x2: sx(L.hi ?? FEAT.mean.hi), y1: sy(L.t), y2: sy(L.t) };
    el(g, 'line', { ...p, stroke: '#222', 'stroke-width': 3, 'stroke-dasharray': '10 7' });
    if (L.label) el(g, 'text', L.f === 'mean' ? { x: p.x1 + 8, y: p.y2 + 24, 'font-size': 20, 'font-weight': 700, fill: '#222', stroke: '#fff', 'stroke-width': 6, 'paint-order': 'stroke' } : { x: p.x2 - 8, y: p.y1 - 10, 'text-anchor': 'end', 'font-size': 20, 'font-weight': 700, fill: '#222', stroke: '#fff', 'stroke-width': 6, 'paint-order': 'stroke' }, L.label);
  });
  (opts.set || W).forEach(p => { const o = opts.only && !opts.only.includes(p.id) ? 0.25 : 1;
    if (opts.ring && opts.ring.includes(p.id)) el(g, 'circle', { cx: sx(p.mean), cy: sy(p.std), r: 21, fill: 'none', stroke: '#222', 'stroke-width': 2.5 });
    el(g, 'circle', { cx: sx(p.mean), cy: sy(p.std), r: 15, fill: CLS[p.c].col, stroke: '#fff', 'stroke-width': 2.5, opacity: o }); el(g, 'text', { x: sx(p.mean) + 20, y: sy(p.std) + 7, 'font-size': 18, fill: '#444', opacity: o }, p.id); });
}

// ------------------------------------------------------------ one candidate question: the windows on each side of the cut, each side's entropy, and the gain
// the cut on each feature; a tie for the best cut goes to the book's choice
let cut = { std: 2.5, mean: 9.85 }, shown = false, CAND = ALL;   // CAND: the windows whose midpoints are the candidate cuts
const PREFER = { std: 2.5, mean: 11.75 };
const bestCut = (ids, f) => { const cs = cuts(CAND, f), top = Math.max(...cs.map(c => gain(ids, f, c))), tied = cs.filter(c => gain(ids, f, c) === top); return tied.includes(PREFER[f]) ? PREFER[f] : tied[0]; };
function panel(g, ids, f, y, best, strip) {
  const t = cut[f], [L, R] = sides(ids, f, t), N = ids.length, bw = 262, bh = 112, x0 = 760;
  el(g, 'text', { x: x0, y: y + 30, 'font-size': 28, 'font-weight': 700, fill: '#222' }, `${FEAT[f].short} ≤ ${fmt(t)} ?`);
  [[L, 'yes'], [R, 'no']].forEach(([p, lab], k) => {
    const bx = x0 + k * (bw + 16), by = y + 64;
    el(g, 'text', { x: bx + bw / 2, y: by - 10, 'text-anchor': 'middle', 'font-size': 20, 'font-weight': 700, fill: '#666' }, lab);
    el(g, 'rect', { x: bx, y: by, width: bw, height: bh, rx: 8, fill: '#fafafa', stroke: '#dcdcdc', 'stroke-width': 1.5 });
    chips(g, p, bx + 8, by + 10, bw - 16, 0.9);
    el(g, 'text', { x: bx + bw / 2, y: by + bh + 30, 'text-anchor': 'middle', 'font-size': 23, 'font-style': 'italic', fill: '#222' }, p.length ? `H = ${f3(H(p))}` : 'empty');
  });
  const cx = 1450, gv = gain(ids, f, t);
  el(g, 'text', { x: cx, y: y + 100, 'text-anchor': 'middle', 'font-size': 20, fill: '#444' }, `(${L.length}/${N})(${f3(H(L))}) + (${R.length}/${N})(${f3(H(R))})`);
  el(g, 'text', { x: cx, y: y + 134, 'text-anchor': 'middle', 'font-size': 22, fill: '#222' }, `weighted = ${f3(weighted(ids, f, t))}`);
  el(g, 'text', { x: cx, y: y + 176, 'text-anchor': 'middle', 'font-size': 28, 'font-weight': 700, fill: best ? '#c0392b' : '#222' }, `gain = ${f3(gv)}`);
  // the gain of every candidate cut on this feature, the current one in black
  if (strip) {
    const cs = cuts(CAND, f), lo = cs[0], hi = cs[cs.length - 1], X0 = 770, X1 = 1290, by = y + 312, hh = 70, top = Math.max(...['std', 'mean'].flatMap(q => cuts(CAND, q).map(c => gain(ids, q, c))));   // one scale for both strips
    const sx = c => X0 + (c - lo) / (hi - lo) * (X1 - X0);
    el(g, 'line', { x1: X0 - 10, x2: X1 + 10, y1: by, y2: by, stroke: '#9a9a9a', 'stroke-width': 1.5 });
    cs.forEach(c => { const v = gain(ids, f, c), h = hh * v / top; el(g, 'rect', { x: sx(c) - 5, y: by - h, width: 10, height: h, rx: 2, fill: c === t ? '#222' : '#b9c3cf' }); });
    el(g, 'text', { x: X1 + 24, y: by - 4, 'font-size': 18, fill: '#666' }, 'gain at each cut');
  }
  if (best) { el(g, 'rect', { x: cx - 38, y: y + 192, width: 76, height: 28, rx: 5, fill: '#222' }); el(g, 'text', { x: cx, y: y + 213, 'text-anchor': 'middle', 'font-size': 17, 'font-weight': 700, fill: '#fff' }, 'BEST'); }
}
// a group to split: the feature plane on the left with both cuts drawn, one panel per feature on the right
function split2(g, ids, header, extra) {
  el(g, 'text', { x: 760, y: 28, 'font-size': 23, 'font-weight': 700, fill: '#222' }, `${header}: ${tally(ids)}`);
  el(g, 'text', { x: 1590, y: 28, 'text-anchor': 'end', 'font-size': 23, 'font-style': 'italic', fill: '#222' }, `H = ${f3(H(ids))}`);
  plane(g, 90, 20, 580, 600, { only: ids, set: extra && extra.set, ring: extra && extra.ring, regions: extra && extra.regions, lines: [...(extra ? extra.lines : []), { f: 'std', t: cut.std, label: `std dev ≤ ${fmt(cut.std)}` }, { f: 'mean', t: cut.mean, label: `mean ≤ ${fmt(cut.mean)}` }] });
  const gs = { std: gain(ids, 'std', cut.std), mean: gain(ids, 'mean', cut.mean) }, top = Math.max(gs.std, gs.mean);
  const st = extra && extra.strip;
  panel(g, ids, 'std', 60, shown && gs.std === top, st);
  el(g, 'line', { x1: 760, x2: 1590, y1: 405, y2: 405, stroke: '#ececec', 'stroke-width': 1.5 });
  panel(g, ids, 'mean', 420, shown && gs.mean === top, st);
  if (shown && gs.std === gs.mean) el(g, 'text', { x: 1175, y: 740, 'text-anchor': 'middle', 'font-size': 22, fill: '#444' }, 'A tie: either question gives the same gain.');
}

// ------------------------------------------------------------ the finished tree, as in the book's figure
function tree(g) {
  const box = (x, y, w, h, fill, stroke) => el(g, 'rect', { x: x - w / 2, y, width: w, height: h, rx: h > 60 ? 10 : h / 2, fill, stroke, 'stroke-width': 2.5 });
  const edge = (x1, y1, x2, y2, lab, side) => { el(g, 'line', { x1, y1, x2, y2, stroke: '#9a9a9a', 'stroke-width': 2.5 }); el(g, 'text', { x: x1 + 0.4 * (x2 - x1) + side * 10, y: y1 + 0.4 * (y2 - y1) + 6, 'text-anchor': side < 0 ? 'end' : 'start', 'font-size': 22, fill: '#444' }, lab); };
  const q = (x, y, s) => { box(x, y, 300, 56, '#e8f1fd', '#2a78d6'); el(g, 'text', { x, y: y + 37, 'text-anchor': 'middle', 'font-size': 25, 'font-weight': 700, fill: '#1d5fae' }, s); };
  const leaf = (x, y, c) => { box(x, y, 200, 110, CLS[c].col + '22', CLS[c].col); el(g, 'text', { x, y: y + 36, 'text-anchor': 'middle', 'font-size': 25, 'font-weight': 700, fill: CLS[c].col }, CLS[c].name); chips(g, ALL.filter(i => win(i).c === c), x - 95, y + 52, 190, 0.85); };
  edge(330, 116, 160, 300, 'Yes', -1); edge(330, 116, 480, 300, 'No', 1); q(330, 60, 'std dev ≤ 2.5?'); leaf(160, 300, 0);
  edge(480, 356, 340, 540, 'Yes', -1); edge(480, 356, 620, 540, 'No', 1); q(480, 300, 'mean ≤ 11.75?'); leaf(340, 540, 1); leaf(620, 540, 2);
  plane(g, 900, 40, 640, 560, { lines: [{ f: 'std', t: 2.5 }, { f: 'mean', t: 11.75, lo: 2.5 }],
    regions: [{ x0: FEAT.mean.lo, x1: FEAT.mean.hi, y0: FEAT.std.lo, y1: 2.5, c: 0 }, { x0: FEAT.mean.lo, x1: 11.75, y0: 2.5, y1: FEAT.std.hi, c: 1 }, { x0: 11.75, x1: FEAT.mean.hi, y0: 2.5, y1: FEAT.std.hi, c: 2 }] });
}

// ------------------------------------------------------------ steps
const RIGHT = ALL.filter(i => win(i).std > 2.5);
const STEPS = [
  { title: 'How mixed are the twelve windows?', draw(g) {
      const cols = [['window', 60], ['mean', 210], ['std dev', 350], ['activity', 500]];
      cols.forEach(([h, x]) => el(g, 'text', { x, y: 34, 'text-anchor': 'middle', 'font-size': 22, 'font-weight': 700, fill: '#666' }, h));
      el(g, 'line', { x1: 0, x2: 600, y1: 48, y2: 48, stroke: '#9a9a9a', 'stroke-width': 1.5 });
      W.forEach((p, i) => { const y = 48 + (i + 1) * 46;
        if (i % 2) el(g, 'rect', { x: 0, y: y - 46, width: 600, height: 46, fill: '#f6f7f9' });
        [[p.id, 60], [p.mean.toFixed(1), 210], [p.std.toFixed(1), 350]].forEach(([v, x], k) => el(g, 'text', { x, y: y - 14, 'text-anchor': 'middle', 'font-size': 23, 'font-weight': k ? 400 : 700, fill: '#222' }, v));
        el(g, 'text', { x: 500, y: y - 14, 'text-anchor': 'middle', 'font-size': 23, 'font-weight': 700, fill: CLS[p.c].col }, CLS[p.c].name); });
      el(g, 'text', { x: 300, y: 690, 'text-anchor': 'middle', 'font-size': 23, 'font-style': 'italic', fill: '#222' }, `H = ${terms(ALL).join(' ')}`);
      el(g, 'text', { x: 300, y: 724, 'text-anchor': 'middle', 'font-size': 23, 'font-style': 'italic', fill: '#222' }, `= ${f3(H(ALL))}`);
      plane(g, 820, 20, 720, 580);
    } },
  { title: 'Which feature, and where should we cut it?', sliders: true, ids: ALL, start: { std: 2.05, mean: 9.85 }, draw: g => split2(g, ALL, 'All 12 windows') },
  { title: 'Which question next, for the windows with std dev above 2.5?', sliders: true, ids: RIGHT, start: { std: 4.9, mean: 10.05 },
    draw: g => split2(g, RIGHT, 'Windows with std dev > 2.5', { lines: [{ f: 'std', t: 2.5 }], regions: [{ x0: FEAT.mean.lo, x1: FEAT.mean.hi, y0: FEAT.std.lo, y1: 2.5, c: 0 }] }) },
  { title: 'What does the finished tree look like?', draw: tree },
  { title: 'What if the activities overlap?', sliders: true, ids: ALL18, cand: ALL18, start: { std: 2.5, mean: 11.75 },
    draw: g => split2(g, ALL18, 'All 18 windows', { lines: [], set: WALL, ring: EXTRA.map(w => w.id), strip: true }) },
];

// the sliders step through the candidate cuts: every midpoint between neighbouring values over the windows in CAND
['std', 'mean'].forEach(f => { const s = $('s-' + f); s.addEventListener('input', () => { cut[f] = cuts(CAND, f)[+s.value]; shown = false; draw(); }); });
let step = Math.max(0, Math.min(STEPS.length - 1, (parseInt(location.hash.slice(1), 10) || 1) - 1));
function draw() {
  const S = STEPS[step], svg = $('fig'); svg.innerHTML = '';
  $('title').textContent = S.title; $('stepno').textContent = `step ${step + 1} of ${STEPS.length}`;
  $('prev').disabled = step === 0; $('next').disabled = step === STEPS.length - 1;
  $('ctl').classList.toggle('hide', !S.sliders);
  ['std', 'mean'].forEach(f => { const s = $('s-' + f); s.max = cuts(CAND, f).length - 1; s.value = cuts(CAND, f).indexOf(cut[f]); $('v-' + f).textContent = fmt(cut[f]); });
  S.draw(el(svg, 'g', {}));
}
function go(s) {
  step = Math.max(0, Math.min(STEPS.length - 1, s)); const S = STEPS[step]; CAND = S.cand || ALL;
  // each step opens on its own cuts, moved to the nearest candidate when the windows change
  if (S.start) { cut = {}; ['std', 'mean'].forEach(f => cut[f] = cuts(CAND, f).reduce((b, c) => Math.abs(c - S.start[f]) < Math.abs(b - S.start[f]) ? c : b)); shown = false; }
  draw(); history.replaceState(null, '', '#' + (step + 1)); }
$('best').onclick = () => { const ids = STEPS[step].ids; cut = { std: bestCut(ids, 'std'), mean: bestCut(ids, 'mean') }; shown = true; draw(); };
$('prev').onclick = () => go(step - 1); $('next').onclick = () => go(step + 1);
document.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; if (e.key === 'ArrowRight') go(step + 1); else if (e.key === 'ArrowLeft') go(step - 1); });
go(step);
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Repetition-Counting Pipeline</title>
</head>
<body>
<style>
  :root {
    color-scheme: light;
    --paper: #ffffff; --ink: #222222; --ink-2: #666666; --ink-3: #9a9a9a;
    --rule: #dcdcdc; --grid: #ececec; --raw: #b4b4b4; --raw-dot: #8c8c8c; --clean: #444444;
    --window: rgba(34, 34, 34, 0.06); --window-edge: #222222;
    --ma: #2a78d6; --med: #1baf7a; --wm: #4a3aa7; --ewma: #eb6834;
    --sans: "Helvetica Neue", Helvetica, -apple-system, Arial, sans-serif;
    --mono: Menlo, "SF Mono", Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.4; padding-block: 18px 28px; padding-inline: 16px; -webkit-font-smoothing: antialiased; }
  .stage { max-width: 1200px; margin: 0 auto; display: grid; gap: 14px; }
  .slide { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 26px 34px 16px; display: grid; grid-template-rows: auto 1fr auto; gap: 10px; min-height: 0; position: relative; outline: none; cursor: pointer; user-select: none; }
  .slide:focus-visible { box-shadow: 0 0 0 3px rgba(42,120,214,.35); }
  .head h1 { margin: 0; font-size: clamp(22px, 2.6vw, 30px); font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; line-height: 1.15; }
  .head h1 .tag { display: inline-block; font-family: var(--mono); font-weight: 400; font-size: 0.6em; color: var(--ink-2); margin-left: 10px; vertical-align: middle; background: #f4f4f4; padding: 2px 8px; border-radius: 4px; white-space: nowrap; }
  .head p { margin: 6px 0 0; color: #444; font-size: clamp(15px, 1.6vw, 18px); max-width: none; }
  .code { margin: 8px 0 0; font-family: var(--mono); font-size: clamp(13px, 1.35vw, 16px); color: var(--ink); background: #f4f6f9; border: 1px solid var(--rule); border-radius: 5px; padding: 6px 12px; white-space: pre; overflow-x: auto; }
  .code[hidden] { display: none; }
  .code .p { color: var(--ma); font-weight: 700; }
  .chart-wrap { position: relative; min-height: 0; }
  svg.chart { display: block; width: 100%; height: auto; max-height: calc(100vh - 360px); overflow: visible; }
  .tt { position: absolute; pointer-events: none; display: none; background: #fff; border: 1px solid var(--rule); border-radius: 4px; padding: 6px 9px; font-family: var(--mono); font-size: 12px; color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,.08); white-space: nowrap; z-index: 2; }
  .tt .row { display: flex; gap: 10px; justify-content: space-between; }
  .tt .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .foot { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--ink-3); padding-top: 4px; }
  .foot .ctr { font-family: var(--mono); }
  .bar { display:flex; flex-wrap:wrap; gap:12px 24px; align-items:center; padding:14px 18px; border:1px solid var(--rule); border-radius:6px; background:#f6f7f9; font-size:14px; color:var(--ink); }
  .group { display:flex; align-items:center; gap:8px; }
  .group label { font-size:13px; font-weight:700; color:var(--ink); letter-spacing:0; text-transform:none; }
  .val { font-family:var(--mono); font-size:14px; font-weight:700; color:var(--ma); min-width:5ch; }
  button, select { font:inherit; font-size:14px; color:var(--ink); background:#fff; border:1px solid #9a9a9a; border-radius:5px; padding:7px 13px; cursor:pointer; }
  button:hover, select:hover { border-color:var(--ink); }
  button.primary { background:var(--ma); color:#fff; border-color:var(--ma); min-width:88px; font-weight:700; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline:2px solid var(--ma); outline-offset:2px; }
  input[type=range] { accent-color:var(--ma); width:150px; height:30px; cursor:pointer; }
  .hint { margin-left:auto; color:var(--ink-2); font-size:12px; }
  .hint kbd { font-family:var(--mono); background:#fff; border:1px solid var(--rule); border-radius:3px; padding:0 5px; font-size:11px; }
  .grid line { stroke: var(--grid); stroke-width: 1; }
  .axis line, .axis path { stroke: var(--ink-2); stroke-width: 1; fill: none; }
  .axis text { font-family: var(--mono); font-size: 12px; fill: var(--ink-2); }
  .axis-title { font-family: var(--sans); font-size: 12px; fill: var(--ink-2); }
  .ptitle { font-family: var(--sans); font-size: 13px; font-weight: 700; fill: var(--ink); }
  .raw-line { fill: none; stroke: var(--raw); stroke-width: 1.5; }
  .out-line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .thin-line { fill: none; stroke-width: 1.4; stroke-linejoin: round; }
  .dash { stroke-dasharray: 5 4; }
  .win-rect { fill: var(--window); stroke: var(--window-edge); stroke-width: 1; stroke-dasharray: 3 3; }
  .dlabel { font-family: var(--sans); font-size: 13px; font-weight: 700; }
  .mono { font-family: var(--mono); }
  .big { font-family: var(--mono); font-size: 22px; font-weight: 700; }
  .badge { font-family: var(--mono); font-size: 15px; font-weight: 700; fill: var(--ink); }
  .kept { fill: none; stroke: var(--ewma); stroke-width: 2.2; }
  .cross { stroke: var(--raw-dot); stroke-width: 1.6; }
  .crosshair { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 2 2; }
  @media (max-width: 720px) { .slide { padding: 18px 16px 12px; min-height: 0; } .hint { display: none; } }
</style>

<div class="stage">
  <section class="slide" id="slide" tabindex="0" aria-live="polite">
    <div class="head">
      <h1 id="title"></h1>
      <p id="subtitle"></p>
      <pre class="code" id="code" hidden></pre>
    </div>
    <div class="chart-wrap">
      <svg class="chart" id="chart" viewBox="0 0 1200 640" role="img" aria-label="The Repetition-Counting Pipeline"></svg>
      <div class="tt" id="tt"></div>
    </div>
    <div class="foot">
      <span>CS328 &nbsp;·&nbsp; Counting: Steps and Repetitions</span>
      <span class="ctr" id="counter"></span>
    </div>
  </section>

  <div class="bar">
    <div class="group">
      <button id="prev" title="Previous (←)">‹ Prev</button>
      <button id="play" class="primary" title="Play / pause (space)">Play</button>
      <button id="next" title="Next (→)">Next ›</button>
      <button id="restart" title="Restart this step (r)">Restart</button>
      <button id="reset" title="Reset dials to this step's presets">Reset dials</button>
    </div>
    <div class="group">
      <label for="dist">distance</label>
      <input type="range" id="dist" min="0.1" max="1.5" step="0.05" value="1.3">
      <span class="val" id="distVal">1.30 s</span>
    </div>
    <div class="group">
      <label for="prom">prominence</label>
      <input type="range" id="prom" min="0.05" max="0.9" step="0.01" value="0.12">
      <span class="val" id="promVal">0.12</span>
    </div>

    <div class="group">
      <label for="speed">Speed</label>
      <select id="speed">
        <option value="0.25">very slow</option>
        <option value="0.5">slow</option>
        <option value="1" selected>normal</option>
        <option value="2.5">fast</option>
        <option value="0">instant</option>
      </select>
    </div>
    <span class="hint"><kbd>→</kbd> finish / next &nbsp; <kbd>←</kbd> back &nbsp; <kbd>space</kbd> play &nbsp; <kbd>r</kbd> restart</span>
  </div>
</div>

// SciPy-faithful scipy.signal.find_peaks subset: local maxima with plateau handling,
// height, distance, prominence (wlen = whole signal), width (rel_height 0.5).
function localMaxima(x) {
  const n = x.length, out = [];
  let i = 1;
  while (i < n - 1) {
    if (x[i - 1] < x[i]) {
      let ahead = i + 1;
      while (ahead < n - 1 && x[ahead] === x[i]) ahead++;
      if (x[ahead] < x[i]) { out.push(Math.floor((i + ahead - 1) / 2)); i = ahead; }
      else i = ahead;
    } else i++;
  }
  return out;
}
function prominences(x, peaks) {
  const n = x.length;
  return peaks.map(p => {
    let lm = x[p], lb = p, i = p;
    while (i >= 0 && x[i] <= x[p]) { if (x[i] < lm) { lm = x[i]; lb = i; } i--; }
    let rm = x[p], rb = p; i = p;
    while (i < n && x[i] <= x[p]) { if (x[i] < rm) { rm = x[i]; rb = i; } i++; }
    return { prom: x[p] - Math.max(lm, rm), lb, rb, lm, rm };
  });
}
function widths(x, peaks, pr, rel = 0.5) {
  return peaks.map((p, k) => {
    const h = x[p] - pr[k].prom * rel;
    let i = p; while (pr[k].lb < i && h < x[i]) i--;
    let lip = i; if (x[i] < h) lip += (h - x[i]) / (x[i + 1] - x[i]);
    i = p; while (i < pr[k].rb && h < x[i]) i++;
    let rip = i; if (x[i] < h) rip -= (h - x[i]) / (x[i - 1] - x[i]);
    return { width: rip - lip, h, lip, rip };
  });
}
function selectByDistance(peaks, priority, distance) {
  const n = peaks.length, keep = new Array(n).fill(true), killedBy = new Array(n).fill(-1);
  const order = priority.map((v, i) => i).sort((a, b) => priority[a] - priority[b]);
  const d = Math.ceil(distance);
  for (let j = n - 1; j >= 0; j--) {
    const i = order[j]; if (!keep[i]) continue;
    let k = i - 1; while (k >= 0 && peaks[i] - peaks[k] < d) { if (keep[k]) { keep[k] = false; killedBy[k] = i; } k--; }
    k = i + 1; while (k < n && peaks[k] - peaks[i] < d) { if (keep[k]) { keep[k] = false; killedBy[k] = i; } k++; }
  }
  return { keep, killedBy };
}
// Returns every local maximum annotated with which criteria it passes, plus the kept subset.
// opts: { height, distance (samples), prominence, width (samples) } -- undefined means inactive.
function findPeaks(x, opts = {}) {
  let peaks = localMaxima(x);
  const all = peaks.map(p => ({ i: p, v: x[p], pass: {} }));
  let alive = all.slice();
  if (opts.height != null) { alive.forEach(a => a.pass.height = a.v >= opts.height); alive = alive.filter(a => a.pass.height); }
  if (opts.distance != null) {
    const sel = selectByDistance(alive.map(a => a.i), alive.map(a => a.v), opts.distance);
    alive.forEach((a, k) => { a.pass.distance = sel.keep[k]; a.killedBy = sel.killedBy[k] >= 0 ? alive[sel.killedBy[k]].i : -1; });
    alive = alive.filter(a => a.pass.distance);
  }
  // prominence and width evaluated on the survivors (as scipy does), but also on every maximum for display
  const prAll = prominences(x, all.map(a => a.i)); const wAll = widths(x, all.map(a => a.i), prAll);
  all.forEach((a, k) => { a.prom = prAll[k].prom; a.lb = prAll[k].lb; a.rb = prAll[k].rb; a.base = Math.max(prAll[k].lm, prAll[k].rm); a.width = wAll[k].width; a.wh = wAll[k].h; a.lip = wAll[k].lip; a.rip = wAll[k].rip; });
  if (opts.prominence != null) { alive.forEach(a => a.pass.prominence = a.prom >= opts.prominence); alive = alive.filter(a => a.pass.prominence); }
  if (opts.width != null) { alive.forEach(a => a.pass.width = a.width >= opts.width); alive = alive.filter(a => a.pass.width); }

}

  return wdt;
}
function cross(parent, x, y, s = 5, attrs = {}) { const g = el('g', Object.assign({ class: 'cross' }, attrs), parent); el('line', { x1: x - s, x2: x + s, y1: y - s, y2: y + s }, g); el('line', { x1: x - s, x2: x + s, y1: y + s, y2: y - s }, g); return g; }
function badge(parent, x, y, s, color) { const g = el('g', {}, parent); const w = s.length * 9.4 + 18; el('rect', { x, y: y - 17, width: w, height: 24, rx: 4, fill: '#fff', 'fill-opacity': .9, stroke: 'var(--rule)' }, g); txt(g, x + 9, y, s, { class: 'badge', fill: color || 'var(--ink)' }); return g; }
function tipAt(evt, html) {
  tt.innerHTML = html; tt.style.display = 'block';
  const wrap = chart.parentElement.getBoundingClientRect();
  const px = evt.clientX - wrap.left, py = evt.clientY - wrap.top;
  tt.style.left = (px + 16 + tt.offsetWidth > wrap.width ? px - tt.offsetWidth - 12 : px + 16) + 'px';
  tt.style.top = Math.max(0, py - 10) + 'px';
}
function svgPoint(evt) { const pt = chart.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY; return pt.matrixTransform(chart.getScreenCTM().inverse()); }

// ------------------------------------------------------------ dials (persist unless the user touched them)
// defs: { id: { val: id of readout span, parse, fmt } }
const dials = {}, dirty = {};
function defDial(id, o) {
  dials[id] = o; dirty[id] = false;
  const inp = $(id);
  const ev = inp.tagName === 'SELECT' ? 'change' : 'input';
  inp.addEventListener(ev, e => { e.stopPropagation(); dirty[id] = true; showDial(id); onDial(id); });
  inp.addEventListener('click', e => e.stopPropagation());
  showDial(id);
}
function dial(id) { const v = $(id).value; return dials[id].parse ? dials[id].parse(v) : v; }
function showDial(id) { const o = dials[id]; if (o.val) $(o.val).textContent = o.fmt ? o.fmt(dial(id)) : $(id).value; }
function applyPresets(p, force = false) { for (const id in p || {}) if (force || !dirty[id]) { $(id).value = p[id]; showDial(id); } }

// ------------------------------------------------------------ step machine
let step = 0, progress = 0, playing = false, raf = 0, lastT = 0;
const speedMult = () => parseFloat($('speed').value);
function cur() { return STEPS[step]; }
let lastCode = null;
function updateHead() {
  const d = cur();
  $('title').innerHTML = d.title + (d.tag ? `<span class="tag">${d.tag()}</span>` : '');
  $('subtitle').textContent = d.subtitle;
  const code = typeof d.code === 'function' ? d.code() : (d.code || '');
  if (code !== lastCode) { lastCode = code; $('code').hidden = !code; $('code').innerHTML = code; }
  $('counter').textContent = `${step + 1} / ${STEPS.length}`;
}
function enterStep(k, completed = false) {
  step = clamp(k, 0, STEPS.length - 1); stopPlay();
  applyPresets(cur().presets);
  try { history.replaceState(null, '', '#' + (step + 1)); } catch (_) {}
  progress = 0; cur().setup();
  if (!cur().dur || completed || speedMult() === 0) { progress = 1; cur().draw(1); updateHead(); }
  else { cur().draw(0); updateHead(); startPlay(); }
}
function redraw() { cur().setup(); cur().draw(progress); updateHead(); }
function onDial() { redraw(); }
function tick(t) {
  if (!playing) return;
  const dt = Math.min(0.1, (t - lastT) / 1000); lastT = t;
  progress = Math.min(1, progress + dt * speedMult() / cur().dur);
  cur().draw(progress); updateHead();
  if (progress >= 1) { stopPlay(); return; }
  raf = requestAnimationFrame(tick);
}
function startPlay() { if (progress >= 1 || !cur().dur) return; playing = true; lastT = performance.now(); $('play').textContent = 'Pause'; raf = requestAnimationFrame(tick); }
function stopPlay() { playing = false; cancelAnimationFrame(raf); $('play').textContent = 'Play'; }
function finish() { stopPlay(); progress = 1; cur().draw(1); updateHead(); }
function next() { if (progress < 1) { finish(); return; } if (step < STEPS.length - 1) enterStep(step + 1); }
function prev() { if (step > 0) enterStep(step - 1, true); }
function restart() { enterStep(step); }
function wire() {
  $('next').addEventListener('click', e => { e.stopPropagation(); next(); });
  $('prev').addEventListener('click', e => { e.stopPropagation(); prev(); });
  $('restart').addEventListener('click', e => { e.stopPropagation(); restart(); });
  $('reset').addEventListener('click', e => { e.stopPropagation(); for (const id in dirty) dirty[id] = false; applyPresets(cur().presets, true); restart(); });
  $('play').addEventListener('click', e => { e.stopPropagation(); if (playing) stopPlay(); else if (progress >= 1) restart(); else startPlay(); });
  $('speed').addEventListener('click', e => e.stopPropagation());
  $('speed').addEventListener('change', e => { e.stopPropagation(); if (speedMult() === 0) finish(); });
  $('slide').addEventListener('click', () => next());
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
    else if (e.key === ' ') { e.preventDefault(); $('play').click(); }
    else if (e.key === 'r' || e.key === 'R') restart();
  });
  chart.addEventListener('mouseleave', () => { tt.style.display = 'none'; if (typeof unhover === 'function') unhover(); });
  const h = parseInt((location.hash || '').replace('#', ''), 10);
  enterStep(h >= 1 && h <= STEPS.length ? h - 1 : 0);
}

// ------------------------------------------------------------ data: RecoFit forearm IMU, 50 Hz. lat: 3 gyro axes + magnitudes; curl/squat: gyro and accelerometer magnitudes
const FS = 50;
const L = EX.lat, NL = L.gx.length, TL = Array.from({ length: NL }, (_, i) => i / FS);
const AX = [{ k: 'gx', n: 'x', c: C.blue }, { k: 'gy', n: 'y', c: C.green }, { k: 'gz', n: 'z', c: C.violet }];
const pct95 = arr => { const s = arr.slice().sort((a, b) => a - b); const q = 0.95 * (s.length - 1), lo = Math.floor(q); return s[lo] + (s[Math.min(lo + 1, s.length - 1)] - s[lo]) * (q - lo); };
const P95 = pct95(L.gm), NORM = L.gm.map(v => v / P95);
const SINGLE = { x: 70, y: 22, w: 1080, h: 540 }, TOP = { x: 70, y: 22, w: 1080, h: 238 }, BOT = { x: 70, y: 338, w: 1080, h: 240 };
defDial('dist', { val: 'distVal', parse: parseFloat, fmt: v => v.toFixed(2) + ' s' });
defDial('prom', { val: 'promVal', parse: parseFloat, fmt: v => v.toFixed(2) + ' × p95' });
const dSamp = () => Math.max(1, Math.floor(dial('dist') * FS));
function detect(arr) { const s = pct95(arr); return findPeaks(arr.map(v => v / s), { distance: dSamp(), prominence: dial('prom') }).kept; }
const dom = (arr, head = 0.3) => { const hi = Math.max(...arr); return [0, hi * (1 + head)]; };

let G = {};
const cursorLine = (P, t) => el('line', { x1: P.sx(t), x2: P.sx(t), y1: P.box.y, y2: P.box.y + P.box.h, stroke: 'var(--ink-2)', 'stroke-width': 1, 'stroke-dasharray': '3 3' }, P.top);
const rbadge = (P, s, c, dy = 26) => badge(P.top, P.box.x + P.box.w - (s.length * 9.4 + 18) - 12, P.box.y + dy, s, c);
function series(box, arr, upto, o) {
  const n = arr.length, T = Array.from({ length: n }, (_, i) => i / FS);
  const P = panel(chart, box, [0, o.tmax || n / FS], o.dom || dom(arr), { xlabel: 'time (seconds)', ylabel: o.ylabel, ylx: 50, ny: 4, yf: v => fmt(v, o.dec == null ? 1 : o.dec), title: o.title });
  el('path', { class: 'out-line', d: pathOf(T.map(P.sx), arr.map(P.sy), upto), stroke: o.color, 'stroke-width': 1.6 }, P.g);
  P.T = T; P.arr = arr; return P;
}
function axesPanel(box, upto, tmax) {
  let lo = Infinity, hi = -Infinity; AX.forEach(a => L[a.k].forEach(v => { lo = Math.min(lo, v); hi = Math.max(hi, v); }));
  const P = panel(chart, box, [0, tmax], [lo - 0.5, hi + 0.5 + 0.3 * (hi - lo)], { xlabel: 'time (seconds)', ylabel: 'angular velocity (rad/s)', ylx: 50, ny: 5, yf: v => fmt(v, 0) });
  AX.forEach(a => el('path', { class: 'out-line', d: pathOf(TL.map(P.sx), L[a.k].map(P.sy), upto), stroke: a.c, 'stroke-width': 1.5 }, P.g));
  legend(P.top, box.x + 10, box.y + 8, AX.map(a => ({ c: a.c, n: a.n + ' axis' })));
  P.T = TL; return P;
}
function sensorPair(ex, p) {
  const n = ex.gm.length, i = Math.round(p * (n - 1)), tmax = n / FS;
  G.P = series(TOP, ex.gm, n, { color: C.violet, ylabel: 'angular velocity |ω| (rad/s)', tmax, dec: 0, title: 'gyroscope' });
  G.Q = series(BOT, ex.am, n, { color: C.blue, ylabel: 'acceleration |a| (g)', tmax, dec: 1, title: 'accelerometer' });
  [[G.P, ex.gm, C.violet, 'gyroscope magnitude'], [G.Q, ex.am, C.blue, 'accelerometer magnitude']].forEach(([P, arr, c, name]) => {
    legend(P.top, P.box.x + 10, P.box.y + 8, [{ c, n: name }, { k: 'circle', n: 'detected repetitions' }]);
    const ks = detect(arr).filter(k => k <= i); ks.forEach(k => el('circle', { cx: P.sx(P.T[k]), cy: P.sy(arr[k]), r: 6.5, class: 'kept' }, P.top));
    cursorLine(P, P.T[i]); rbadge(P, `true ${ex.reps} · found ${ks.length}`, C.red);
    if (P === G.P) G.ng = ks.length; else G.na = ks.length;
  });
}
let live = { n: 0 };

const STEPS = [
  {
    title: 'Three gyroscope axes during lateral raises', dur: 8, tag: () => `forearm IMU · 50 Hz · 9 repetitions`,
    subtitle: 'The three gyroscope axes on the forearm during nine lateral raises.',
    setup() {}, draw(p) { chart.innerHTML = ''; const i = Math.max(1, Math.round(p * (NL - 1))); G.P = axesPanel(SINGLE, i + 1, NL / FS); cursorLine(G.P, TL[i]); }
  },
  {
    title: 'Magnitude of the angular velocity', dur: 10, tag: () => `|ω| = √(x² + y² + z²)`,
    subtitle: 'Combining the three axes into one orientation-independent magnitude.',
    code: `magnitude = np.sqrt(x**2 + y**2 + z**2)`,
    setup() {}, draw(p) {
      chart.innerHTML = ''; const i = Math.max(1, Math.round(p * (NL - 1)));
      G.P = axesPanel(TOP, NL, NL / FS);
      G.Q = series(BOT, L.gm, i + 1, { color: C.violet, ylabel: 'angular velocity |ω| (rad/s)', tmax: NL / FS, dec: 0 });
      legend(G.Q.top, BOT.x + 10, BOT.y + 8, [{ c: C.violet, n: 'magnitude |ω|' }]);
      cursorLine(G.P, TL[i]); cursorLine(G.Q, TL[i]);
      AX.forEach(a => el('circle', { cx: G.P.sx(TL[i]), cy: G.P.sy(L[a.k][i]), r: 4.5, fill: a.c, stroke: '#fff', 'stroke-width': 1.5 }, G.P.top));
      el('circle', { cx: G.Q.sx(TL[i]), cy: G.Q.sy(L.gm[i]), r: 5.5, fill: C.violet, stroke: '#fff', 'stroke-width': 2 }, G.Q.top);
      txt(G.Q.top, BOT.x + BOT.w - 12, BOT.y + 24, `√(${fmt(L.gx[i], 2)}² + ${fmt(L.gy[i], 2)}² + ${fmt(L.gz[i], 2)}²) = ${fmt(L.gm[i], 2)} rad/s`, { class: 'big', fill: C.violet, 'text-anchor': 'end', 'font-size': 18 });
    }
  },
  {
    title: 'Peak detection with distance and prominence', dur: 12, presets: { dist: 1.3, prom: 0.12 },
    tag: () => `${fmt(dial('dist'), 2)} s · ${fmt(dial('prom') * P95, 2)} rad/s → found ${live.n} · true 9`,
    subtitle: 'Counting repetitions as the peaks find_peaks accepts on the magnitude.',
    code: () => `peaks, _ = find_peaks(normalized, distance=int(<b class="p">${fmt(dial('dist'), 2)}</b> * 50), prominence=<b class="p">${fmt(dial('prom'), 2)}</b>)`,
    setup() {}, draw(p) {
      chart.innerHTML = ''; const i = Math.round(p * (NL - 1));
      G.P = series(SINGLE, L.gm, NL, { color: C.violet, ylabel: 'angular velocity |ω| (rad/s)', tmax: NL / FS, dec: 0 });
      legend(G.P.top, SINGLE.x + 10, SINGLE.y + 8, [{ c: C.violet, n: 'magnitude |ω|' }, { k: 'circle', n: 'detected repetitions' }]);
      const ks = detect(L.gm).filter(k => k <= i); ks.forEach(k => el('circle', { cx: G.P.sx(TL[k]), cy: G.P.sy(L.gm[k]), r: 7, class: 'kept' }, G.P.top));
      cursorLine(G.P, TL[i]); live.n = ks.length; rbadge(G.P, `found ${ks.length} · true 9`, C.red);
      G.Q = null;
    }
  },
  {
    title: 'Gyroscope against accelerometer: bicep curl', dur: 12, presets: { dist: 0.5, prom: 0.3 },
    tag: () => `distance = ${fmt(dial('dist'), 2)} s · prominence = ${fmt(dial('prom'), 2)}`,
    subtitle: 'Comparing gyroscope and accelerometer magnitudes during a bicep curl.',
    code: () => `peaks, _ = find_peaks(normalized, distance=int(<b class="p">${fmt(dial('dist'), 2)}</b> * 50), prominence=<b class="p">${fmt(dial('prom'), 2)}</b>)`,
    setup() {}, draw(p) { chart.innerHTML = ''; sensorPair(EX.curl, p); }
  },
  {
    title: 'Gyroscope against accelerometer: squat', dur: 12, presets: { dist: 0.5, prom: 0.3 },
    tag: () => `distance = ${fmt(dial('dist'), 2)} s · prominence = ${fmt(dial('prom'), 2)}`,
    subtitle: 'Comparing gyroscope and accelerometer magnitudes during a squat.',
    code: () => `peaks, _ = find_peaks(normalized, distance=int(<b class="p">${fmt(dial('dist'), 2)}</b> * 50), prominence=<b class="p">${fmt(dial('prom'), 2)}</b>)`,
    setup() {}, draw(p) { chart.innerHTML = ''; sensorPair(EX.squat, p); }
  }
];
chart.addEventListener('mousemove', evt => {
  const pt = svgPoint(evt); const P = (G.Q && pt.y >= BOT.y - 4) ? G.Q : G.P; if (!P) return;
  const i = clamp(Math.round((pt.x - P.box.x) / P.box.w * (P.xd[1] * FS)), 0, P.T.length - 1);
  let html = `<div class="row"><span>t</span><b>${fmt(P.T[i], 2)} s</b></div>`;
  if (P.arr) html += `<div class="row"><span>value</span><span>${fmt(P.arr[i], 3)}</span></div>`;
  else AX.forEach(a => html += `<div class="row"><span><i class="sw" style="background:${a.c}"></i>${a.n}</span><span>${fmt(L[a.k][i], 2)}</span></div>`);
  tipAt(evt, html);
});
wire();

})();
</script>
</body>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Same Exercise, Different People</title>
</head>
<body>
<style>
  :root {
    color-scheme: light;
    --paper: #ffffff; --ink: #222222; --ink-2: #666666; --ink-3: #9a9a9a;
    --rule: #dcdcdc; --grid: #ececec; --raw: #8f8f8f; --raw-dot: #8c8c8c; --clean: #444444;
    --window: rgba(34, 34, 34, 0.06); --window-edge: #222222;
    --ma: #2a78d6; --med: #1baf7a; --wm: #4a3aa7; --ewma: #eb6834;
    --sans: "Helvetica Neue", Helvetica, -apple-system, Arial, sans-serif;
    --mono: Menlo, "SF Mono", Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.4; padding-block: 10px 10px; padding-inline: 14px; -webkit-font-smoothing: antialiased; }
  .stage { max-width: 1880px; margin: 0 auto; display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 10px; height: calc(100vh - 20px); }
  .slide { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 16px 30px 8px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 6px; min-height: 0; position: relative; outline: none; cursor: pointer; user-select: none; }
  .slide:focus-visible { box-shadow: 0 0 0 3px rgba(42,120,214,.35); }
  .head h1 { margin: 0; font-size: clamp(24px, 2.4vw, 36px); font-weight: 700; letter-spacing: -0.01em; line-height: 1.15; }
  .head h1 .tag { display: inline-block; font-family: var(--mono); font-weight: 400; font-size: 0.6em; color: var(--ink-2); margin-left: 10px; vertical-align: middle; background: #f4f4f4; padding: 2px 8px; border-radius: 4px; white-space: nowrap; }
  .head p { margin: 6px 0 0; color: #444; font-size: clamp(18px, 1.7vw, 24px); max-width: none; }
  .head p:empty { display: none; }
  .head h1 .tag:empty { display: none; }
  .code { margin: 8px 0 0; font-family: var(--mono); font-size: clamp(15px, 1.4vw, 21px); color: var(--ink); background: #f4f6f9; border: 1px solid var(--rule); border-radius: 5px; padding: 6px 12px; white-space: pre; overflow-x: auto; }
  .code[hidden] { display: none; }
  .code .p { color: var(--ma); font-weight: 700; }
  .code .hl { background: #fff3bf; box-shadow: 0 0 0 2px #f0d478; border-radius: 4px; padding: 1px 2px; }
  .chart-wrap { position: relative; min-height: 0; height: 100%; display: flex; justify-content: center; align-items: center; }
  svg.chart { display: block; height: 100%; width: auto; max-width: 100%; max-height: 100%; overflow: visible; }
  .tt { position: absolute; pointer-events: none; display: none; background: #fff; border: 1px solid var(--rule); border-radius: 4px; padding: 6px 9px; font-family: var(--mono); font-size: 15px; color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,.08); white-space: nowrap; z-index: 2; }
  .tt .row { display: flex; gap: 10px; justify-content: space-between; }
  .tt .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .foot { position: absolute; top: 9px; right: 16px; display: flex; gap: 14px; align-items: baseline; font-size: 14px; color: var(--ink-3); padding: 0; pointer-events: none; }
  .foot .ctr { font-family: var(--mono); }
  .bar { display:flex; flex-direction:column; gap:12px; padding:12px 24px;
         border:1px solid var(--rule); border-radius:6px; background:#f6f7f9; font-size:19px; color:var(--ink); }
  .bar .row { display:flex; justify-content:flex-start; align-items:center; gap:16px 32px; flex-wrap:wrap; }
  .bar .row.dials .group { flex:1 1 0; }
  .bar .row.dials input[type=range] { flex:1 1 auto; width:auto; }
  .group { display:flex; align-items:center; gap:10px; }
  .group label { font-size:18px; font-weight:700; color:var(--ink); letter-spacing:0; text-transform:none; white-space:nowrap; }
  .val { font-family:var(--mono); font-size:19px; font-weight:700; color:var(--ma); min-width:5ch; white-space:nowrap; }
  button, select { font:inherit; font-size:18px; color:var(--ink); background:#fff; border:1px solid #9a9a9a; border-radius:6px; padding:9px 16px; cursor:pointer; }
  button:hover, select:hover { border-color:var(--ink); }
  button.primary { background:var(--ma); color:#fff; border-color:var(--ma); min-width:88px; font-weight:700; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline:2px solid var(--ma); outline-offset:2px; }
  input[type=range] { -webkit-appearance:none; appearance:none; accent-color:var(--ma); width:260px; height:36px; background:transparent; cursor:pointer; }
  input[type=range]::-webkit-slider-runnable-track { height:8px; border-radius:4px; background:#c9d1dc; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:26px; height:26px; border-radius:50%; background:var(--ma); border:3px solid #fff; box-shadow:0 0 0 1.5px var(--ma); margin-top:-9px; }
  input[type=range]::-moz-range-track { height:8px; border-radius:4px; background:#c9d1dc; }
  input[type=range]::-moz-range-thumb { width:26px; height:26px; border-radius:50%; background:var(--ma); border:3px solid #fff; }
  .hint { margin-left:auto; color:var(--ink-2); font-size:12px; }
  .hint kbd { font-family:var(--mono); background:#fff; border:1px solid var(--rule); border-radius:3px; padding:0 5px; font-size:11px; }
  .grid line { stroke: var(--grid); stroke-width: 1.3; }
  .axis line, .axis path { stroke: var(--ink-2); stroke-width: 1.3; fill: none; }
  .axis text { font-family: var(--mono); font-size: 20px; fill: var(--ink-2); }
  .axis-title { font-family: var(--sans); font-size: 22px; fill: var(--ink-2); }
  .ptitle { font-family: var(--sans); font-size: 20px; font-weight: 700; fill: var(--ink); }
  .raw-line { fill: none; stroke: var(--raw); stroke-width: 2.0; }
  .out-line { fill: none; stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; }
  .thin-line { fill: none; stroke-width: 1.8; stroke-linejoin: round; }
  .dash { stroke-dasharray: 5 4; }
  .win-rect { fill: var(--window); stroke: var(--window-edge); stroke-width: 1; stroke-dasharray: 3 3; }
  .dlabel { font-family: var(--sans); font-size: 17px; font-weight: 700; }
  .mono { font-family: var(--mono); }
  .big { font-family: var(--mono); font-size: 26px; font-weight: 700; }
  .badge { font-family: var(--mono); font-size: 20px; font-weight: 700; fill: var(--ink); }
  .kept { fill: none; stroke: var(--ewma); stroke-width: 2.9; }
  .cross { stroke: var(--raw-dot); stroke-width: 1.6; }
  .crosshair { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 2 2; }
  @media (max-width: 720px) { .slide { padding: 18px 16px 12px; min-height: 0; } .hint { display: none; } }
  .hint { display:none !important; }
  button.tb { min-width:54px; padding:9px 12px; font-size:22px; line-height:1; }
  button.primary.tb { min-width:64px; }
</style>

<div class="stage">
  <section class="slide" id="slide" tabindex="0" aria-live="polite">
    <div class="head">
      <h1 id="title"></h1>
      <p id="subtitle"></p>
      <pre class="code" id="code" hidden></pre>
    </div>
    <div class="chart-wrap">
      <svg class="chart" id="chart" viewBox="0 0 1400 640" role="img" aria-label="One Peak Spacing per Exercise"></svg>
      <div class="tt" id="tt"></div>
    </div>
    <div class="foot">
      <span>CS328 &nbsp;·&nbsp; Counting Steps &amp; Reps</span>
      <span class="ctr" id="counter"></span>
    </div>
  </section>

  <div class="bar">
   <div class="row">
    <div class="group">
      <button id="prev" class="tb" title="Previous step (←)">⏮</button>
      <button id="play" class="primary tb" title="Play / pause (space)">▶</button>
      <button id="next" class="tb" title="Next step (→)">⏭</button>
      <button id="restart" class="tb" title="Restart this step (r)">↺</button>
      <button id="reset" title="Reset dials to this step's presets">Reset dials</button>
    </div>
    <div class="group">
      <label for="speed">Speed</label>
      <select id="speed">
        <option value="0.25">very slow</option>
        <option value="0.5">slow</option>
        <option value="1" selected>normal</option>
        <option value="2.5">fast</option>
        <option value="0">instant</option>
      </select>
    </div>
   </div>
   <div class="row dials">
    <div class="group">
      <label for="dist">distance</label>
      <input type="range" id="dist" min="0.2" max="1.5" step="0.05" value="0.7">
      <span class="val" id="distVal">0.70 s</span>
    </div>
    <div class="group">
      <label for="prom">prominence</label>
      <input type="range" id="prom" min="0.05" max="0.9" step="0.01" value="0.12">
      <span class="val" id="promVal">0.12</span>
    </div>
   </div>
  </div>
</div>

// SciPy-faithful scipy.signal.find_peaks subset: local maxima with plateau handling,
// height, distance, prominence (wlen = whole signal), width (rel_height 0.5).
function localMaxima(x) {
  const n = x.length, out = [];
  let i = 1;
  while (i < n - 1) {
    if (x[i - 1] < x[i]) {
      let ahead = i + 1;
      while (ahead < n - 1 && x[ahead] === x[i]) ahead++;
      if (x[ahead] < x[i]) { out.push(Math.floor((i + ahead - 1) / 2)); i = ahead; }
      else i = ahead;
    } else i++;
  }
  return out;
}
function prominences(x, peaks) {
  const n = x.length;
  return peaks.map(p => {
    let lm = x[p], lb = p, i = p;
    while (i >= 0 && x[i] <= x[p]) { if (x[i] < lm) { lm = x[i]; lb = i; } i--; }
    let rm = x[p], rb = p; i = p;
    while (i < n && x[i] <= x[p]) { if (x[i] < rm) { rm = x[i]; rb = i; } i++; }
    return { prom: x[p] - Math.max(lm, rm), lb, rb, lm, rm };
  });
}
function widths(x, peaks, pr, rel = 0.5) {
  return peaks.map((p, k) => {
    const h = x[p] - pr[k].prom * rel;
    let i = p; while (pr[k].lb < i && h < x[i]) i--;
    let lip = i; if (x[i] < h) lip += (h - x[i]) / (x[i + 1] - x[i]);
    i = p; while (i < pr[k].rb && h < x[i]) i++;
    let rip = i; if (x[i] < h) rip -= (h - x[i]) / (x[i - 1] - x[i]);
    return { width: rip - lip, h, lip, rip };

}
function selectByDistance(peaks, priority, distance) {
  const n = peaks.length, keep = new Array(n).fill(true), killedBy = new Array(n).fill(-1);

}
// Returns every local maximum annotated with which criteria it passes, plus the kept subset.
// opts: { height, distance (samples), prominence, width (samples) } -- undefined means inactive.
function findPeaks(x, opts = {}) {
  let peaks = localMaxima(x);
  const all = peaks.map(p => ({ i: p, v: x[p], pass: {} }));
  let alive = all.slice();
  if (opts.height != null) { alive.forEach(a => a.pass.height = a.v >= opts.height); alive = alive.filter(a => a.pass.height); }
  if (opts.distance != null) {
    const sel = selectByDistance(alive.map(a => a.i), alive.map(a => a.v), opts.distance);
    alive.forEach((a, k) => { a.pass.distance = sel.keep[k]; a.killedBy = sel.killedBy[k] >= 0 ? alive[sel.killedBy[k]].i : -1; });

  const prAll = prominences(x, all.map(a => a.i)); const wAll = widths(x, all.map(a => a.i), prAll);
  all.forEach((a, k) => { a.prom = prAll[k].prom; a.lb = prAll[k].lb; a.rb = prAll[k].rb; a.base = Math.max(prAll[k].lm, prAll[k].rm); a.width = wAll[k].width; a.wh = wAll[k].h; a.lip = wAll[k].lip; a.rip = wAll[k].rip; });
  if (opts.prominence != null) { alive.forEach(a => a.pass.prominence = a.prom >= opts.prominence); alive = alive.filter(a => a.pass.prominence); }
  if (opts.width != null) { alive.forEach(a => a.pass.width = a.width >= opts.width); alive = alive.filter(a => a.pass.width); }

}

// ------------------------------------------------------------ shared helpers
const $ = id => document.getElementById(id);
const svgNS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}, parent) => { const n = document.createElementNS(svgNS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; };
const txt = (parent, x, y, s, attrs = {}) => { const t = el('text', Object.assign({ x, y }, attrs), parent); t.textContent = s; return t; };
const chart = $('chart'), tt = $('tt');
const C = { blue: '#2a78d6', green: '#1baf7a', violet: '#4a3aa7', red: '#eb6834', grey: '#8f8f8f', greyDot: '#8c8c8c', ink: '#222', ink2: '#666', ink3: '#9a9a9a' };
const fmt = (v, d = 2) => (Math.round(v * Math.pow(10, d)) / Math.pow(10, d)).toFixed(d);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function niceTicks(lo, hi, n = 6) {
  const span = hi - lo, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => span / s <= n) || mag * 10;
  const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(6)); return out;
}
// A panel: axes + grid + clip; returns scales and a content group.
function panel(parent, box, xd, yd, o = {}) {
  const { x, y, w, h } = box;
  const sx = v => x + (v - xd[0]) / (xd[1] - xd[0]) * w;
  const sy = v => y + h - (v - yd[0]) / (yd[1] - yd[0]) * h;
  const grid = el('g', { class: 'grid' }, parent), axis = el('g', { class: 'axis' }, parent);
  const xt = o.xt || niceTicks(xd[0], xd[1], o.nx || 8), yt = o.yt || niceTicks(yd[0], yd[1], o.ny || 5);
  xt.forEach(v => { el('line', { x1: sx(v), x2: sx(v), y1: y, y2: y + h }, grid); txt(axis, sx(v), y + h + 17, o.xf ? o.xf(v) : v, { 'text-anchor': 'middle' }); });
  yt.forEach(v => { el('line', { x1: x, x2: x + w, y1: sy(v), y2: sy(v) }, grid); txt(axis, x - 8, sy(v) + 4, o.yf ? o.yf(v) : v, { 'text-anchor': 'end' }); });
  el('path', { d: `M${x},${y}V${y + h}H${x + w}` }, axis);
  if (o.xlabel) txt(parent, x + w, y + h + 38, o.xlabel, { class: 'axis-title', 'text-anchor': 'end' });
  if (o.ylabel) { const t = txt(parent, 0, 0, o.ylabel, { class: 'axis-title', 'text-anchor': 'middle' }); t.setAttribute('transform', `translate(${x - (o.ylx || 62)},${y + h / 2}) rotate(-90)`); }
  if (o.title) txt(parent, x, y - 8, o.title, { class: 'ptitle' });
  const id = 'clip' + Math.random().toString(36).slice(2, 8);
  const cp = el('clipPath', { id }, parent); el('rect', { x, y: y - 2, width: w, height: h + 4 }, cp);
  const g = el('g', { 'clip-path': `url(#${id})` }, parent);
  const top = el('g', {}, parent);
  return { sx, sy, g, top, box, xd, yd };
}
function pathOf(xs, ys, upto) { let d = ''; const n = upto == null ? xs.length : upto; for (let i = 0; i < n; i++) d += (i ? 'L' : 'M') + xs[i].toFixed(1) + ',' + ys[i].toFixed(1); return d; }
function legend(parent, x, y, items) {
  const rowH = 30, padX = 10, padY = 8;
  const wdt = Math.max(...items.map(i => i.n.length)) * 12.5 + 2 * padX + 34;
  x = Math.min(x, W - wdt - 6);
  el('rect', { x, y, width: wdt, height: items.length * rowH + 2 * padY - 4, rx: 4, fill: '#fff', 'fill-opacity': .9, stroke: 'var(--rule)' }, parent);
  items.forEach((it, j) => {
    const cy = y + padY + j * rowH + 6, cx = x + padX + 9;
    if (it.k === 'cross') { el('line', { x1: cx - 5, x2: cx + 5, y1: cy - 5, y2: cy + 5, class: 'cross' }, parent); el('line', { x1: cx - 5, x2: cx + 5, y1: cy + 5, y2: cy - 5, class: 'cross' }, parent); }
    else if (it.k === 'circle') el('circle', { cx, cy, r: 5.5, class: 'kept', stroke: it.c || C.red }, parent);
    else if (it.k === 'rect') el('rect', { x: x + padX, y: cy - 6, width: 18, height: 12, class: 'win-rect' }, parent);
    else if (it.k === 'dot') el('circle', { cx, cy, r: 4.5, fill: it.c }, parent);
    else el('line', { x1: x + padX, x2: x + padX + 18, y1: cy, y2: cy, stroke: it.c, 'stroke-width': it.k === 'dash' ? 1.5 : 2.5, 'stroke-dasharray': it.k === 'dash' ? '5 4' : 'none' }, parent);
    txt(parent, x + padX + 26, cy + 4, it.n, { class: 'axis-title', fill: 'var(--ink)' });
  });
  return wdt;
}
function legendInline(parent, x, y, items) {
  const padX = 10, h = 36, spans = items.map(it => 26 + it.n.length * 11 + 16);
  const wdt = 2 * padX + spans.reduce((a, b) => a + b, 0) - 16;
  x = Math.min(x, W - wdt - 6);
  el('rect', { x, y, width: wdt, height: h, rx: 4, fill: '#fff', 'fill-opacity': .9, stroke: 'var(--rule)' }, parent);
  const cy = y + h / 2; let px = x + padX;
  items.forEach((it, j) => {
    const cx = px + 9;
    if (it.k === 'circle') el('circle', { cx, cy, r: 5.5, class: 'kept', stroke: it.c || C.red }, parent);
    else el('line', { x1: px, x2: px + 18, y1: cy, y2: cy, stroke: it.c, 'stroke-width': 2.5 }, parent);
    txt(parent, px + 26, cy + 7, it.n, { class: 'axis-title', fill: 'var(--ink)' });
    px += spans[j];
  });
  return wdt;
}
function cross(parent, x, y, s = 5, attrs = {}) { const g = el('g', Object.assign({ class: 'cross' }, attrs), parent); el('line', { x1: x - s, x2: x + s, y1: y - s, y2: y + s }, g); el('line', { x1: x - s, x2: x + s, y1: y + s, y2: y - s }, g); return g; }
const badgeW = s => s.length * 12.4 + 20;
function badge(parent, x, y, s, color) { const g = el('g', {}, parent); const w = badgeW(s); el('rect', { x, y: y - 20, width: w, height: 28, rx: 4, fill: '#fff', 'fill-opacity': .9, stroke: 'var(--rule)' }, g); txt(g, x + 9, y, s, { class: 'badge', fill: color || 'var(--ink)' }); return g; }
function tipAt(evt, html) {
  tt.innerHTML = html; tt.style.display = 'block';
  const wrap = chart.parentElement.getBoundingClientRect();
  const px = evt.clientX - wrap.left, py = evt.clientY - wrap.top;
  tt.style.left = (px + 16 + tt.offsetWidth > wrap.width ? px - tt.offsetWidth - 12 : px + 16) + 'px';
  tt.style.top = Math.max(0, py - 10) + 'px';
}
function svgPoint(evt) { const pt = chart.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY; return pt.matrixTransform(chart.getScreenCTM().inverse()); }

// ------------------------------------------------------------ dials (persist unless the user touched them)
// defs: { id: { val: id of readout span, parse, fmt } }
const dials = {}, dirty = {};
function defDial(id, o) {
  dials[id] = o; dirty[id] = false;
  const inp = $(id);
  const ev = inp.tagName === 'SELECT' ? 'change' : 'input';
  inp.addEventListener(ev, e => { e.stopPropagation(); dirty[id] = true; showDial(id); onDial(id); });
  inp.addEventListener('click', e => e.stopPropagation());
  showDial(id);
}
function dial(id) { const v = $(id).value; return dials[id].parse ? dials[id].parse(v) : v; }
function showDial(id) { const o = dials[id]; if (o.val) $(o.val).textContent = o.fmt ? o.fmt(dial(id)) : $(id).value; }
function applyPresets(p, force = false) { for (const id in p || {}) if (force || !dirty[id]) { $(id).value = p[id]; showDial(id); } }

// ------------------------------------------------------------ step machine
let step = 0, progress = 0, playing = false, raf = 0, lastT = 0;
const speedMult = () => parseFloat($('speed').value);
function cur() { return STEPS[step]; }
let lastCode = null;
function updateHead() {
  const d = cur();
  $('title').innerHTML = d.title + (d.tag ? `<span class="tag">${d.tag()}</span>` : '');
  $('subtitle').textContent = d.subtitle;
  const code = typeof d.code === 'function' ? d.code() : (d.code || '');
  if (code !== lastCode) { lastCode = code; $('code').hidden = !code; $('code').innerHTML = code; }
  $('counter').textContent = `${step + 1} / ${STEPS.length}`;
}
function enterStep(k, completed = false) {
  step = clamp(k, 0, STEPS.length - 1); stopPlay();
  applyPresets(cur().presets);
  try { history.replaceState(null, '', '#' + (step + 1)); } catch (_) {}
  progress = 0; cur().setup();
  if (!cur().dur || completed || speedMult() === 0) { progress = 1; cur().draw(1); updateHead(); }
  else { cur().draw(0); updateHead(); startPlay(); }
}
function redraw() { cur().setup(); cur().draw(progress); updateHead(); }
function onDial() { redraw(); }
function tick(t) {
  if (!playing) return;
  const dt = Math.max(0, Math.min(0.1, (t - lastT) / 1000)); lastT = t;
  progress = Math.min(1, progress + dt * speedMult() / cur().dur);
  cur().draw(progress); updateHead();
  if (progress >= 1) { stopPlay(); return; }
  raf = requestAnimationFrame(tick);
}
function startPlay() { if (progress >= 1 || !cur().dur) return; playing = true; lastT = performance.now(); $('play').textContent = '⏸'; raf = requestAnimationFrame(tick); }
function stopPlay() { playing = false; cancelAnimationFrame(raf); $('play').textContent = '▶'; }
function finish() { stopPlay(); progress = 1; cur().draw(1); updateHead(); }
function next() { if (progress < 1) { finish(); return; } if (step < STEPS.length - 1) enterStep(step + 1); }
function prev() { if (step > 0) enterStep(step - 1, true); }
function restart() { enterStep(step); }
function wire() {
  $('next').addEventListener('click', e => { e.stopPropagation(); next(); });
  $('prev').addEventListener('click', e => { e.stopPropagation(); prev(); });
  $('restart').addEventListener('click', e => { e.stopPropagation(); restart(); });
  $('reset').addEventListener('click', e => { e.stopPropagation(); for (const id in dirty) dirty[id] = false; applyPresets(cur().presets, true); restart(); });
  $('play').addEventListener('click', e => { e.stopPropagation(); if (playing) stopPlay(); else if (progress >= 1) restart(); else startPlay(); });
  $('speed').addEventListener('click', e => e.stopPropagation());
  $('speed').addEventListener('change', e => { e.stopPropagation(); if (speedMult() === 0) finish(); });
  $('slide').addEventListener('click', () => next());
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
    else if (e.key === ' ') { e.preventDefault(); $('play').click(); }
    else if (e.key === 'r' || e.key === 'R') restart();
  });
  chart.addEventListener('mouseleave', () => { tt.style.display = 'none'; if (typeof unhover === 'function') unhover(); });
  const h = parseInt((location.hash || '').replace('#', ''), 10);
  enterStep(h >= 1 && h <= STEPS.length ? h - 1 : 0);
}

// ------------------------------------------------------------ data: RecoFit gyroscope magnitudes, 50 Hz. lat: lateral raise (9 reps), jj: jumping jacks (25 reps), ind: three participants' lateral raises
const FS = 50;
const pct95 = arr => { const s = arr.slice().sort((a, b) => a - b); const q = 0.95 * (s.length - 1), lo = Math.floor(q); return s[lo] + (s[Math.min(lo + 1, s.length - 1)] - s[lo]) * (q - lo); };
const W = 1400, H = 640, PL = 84, PR = 36, PW = W - PL - PR;
const SINGLE = { x: PL, y: 22, w: PW, h: 540 }, TOP = { x: PL, y: 22, w: PW, h: 238 }, BOT = { x: PL, y: 338, w: PW, h: 240 };
const CGAP = 30, CW = (PW - 2 * CGAP) / 3;
const COLS = [0, 1, 2].map(k => ({ x: PL + k * (CW + CGAP), y: 40, w: CW, h: 500 }));
defDial('dist', { val: 'distVal', parse: parseFloat, fmt: v => v.toFixed(2) + ' s' });
defDial('prom', { val: 'promVal', parse: parseFloat, fmt: v => v.toFixed(2) });
const cache = {};
function detect(set, dSec, prom) {
  const key = set.name + '|' + dSec.toFixed(2) + '|' + prom;
  if (!cache[key]) { const s = pct95(set.g); cache[key] = findPeaks(set.g.map(v => v / s), { distance: Math.max(1, Math.floor(dSec * FS)), prominence: prom }).kept; }
  return cache[key];
}
RF.ind.forEach((s, k) => s.name = `Participant ${k + 1}`);
RF.lat.name = 'Lateral raise'; RF.jj.name = 'Jumping jacks';

let G = {}, live = { d: 0.7, a: 0, b: 0 };
const cursorLine = (P, t) => el('line', { x1: P.sx(t), x2: P.sx(t), y1: P.box.y, y2: P.box.y + P.box.h, stroke: 'var(--ink-2)', 'stroke-width': 1, 'stroke-dasharray': '3 3' }, P.top);
const rbadge = (P, s, c, dy = 26) => badge(P.top, P.box.x + P.box.w - badgeW(s) - 12, P.box.y + dy, s, c);
function setPanel(box, set, p, dSec, prom, o = {}) {
  const n = set.g.length, T = Array.from({ length: n }, (_, i) => i / FS), i = Math.round(p * (n - 1));
  const P = panel(chart, box, [0, n / FS], [0, Math.max(...set.g) * 1.32], { xlabel: 'time (seconds)', ylabel: o.ylabel === undefined ? 'angular velocity |ω| (rad/s)' : o.ylabel, ylx: 62, ny: 4, nx: o.nx || 8, yf: v => fmt(v, 0), title: o.title });
  el('path', { class: 'out-line', d: pathOf(T.map(P.sx), set.g.map(P.sy)), stroke: C.violet, 'stroke-width': 1.4 }, P.g);
  const ks = detect(set, dSec, prom).filter(k => k <= i);
  ks.forEach(k => el('circle', { cx: P.sx(T[k]), cy: P.sy(set.g[k]), r: 6.5, class: 'kept' }, P.top));
  cursorLine(P, T[i]);
  if (!o.noLegend) (o.legendCol ? legend : legendInline)(P.top, box.x + 10, box.y + 8, [{ c: C.violet, n: 'gyroscope magnitude' }, { k: 'circle', n: 'detected repetitions' }]);
  rbadge(P, `true ${set.reps} · found ${ks.length}`, C.red, o.badgeY || 26);
  P.T = T; P.set = set; P.n = ks.length; return P;
}

const STEPS = [
  {
    title: 'Same detector on three participants', dur: 14, presets: { dist: 0.2, prom: 0.71 },
    tag: () => `lateral raise · 3 participants`,
    subtitle: '',
    code: () => `peaks, _ = find_peaks(normalized, <span class="hl">distance=int(<b class="p">${fmt(dial('dist'), 2)}</b> * 50)</span>, <span class="hl">prominence=<b class="p">${fmt(dial('prom'), 2)}</b></span>)`,
    setup() {}, draw(p) {
      chart.innerHTML = '';
      const longest = Math.max(...RF.ind.map(s => s.g.length));
      G.cols = RF.ind.map((s, k) => setPanel(COLS[k], s, Math.min(1, p * longest / s.g.length), dial('dist'), dial('prom'), { title: s.name, ylabel: k === 0 ? undefined : null, nx: 5, noLegend: k > 0, legendCol: true, badgeY: k === 0 ? 100 : 26 }));
      G.P = G.cols[0]; G.Q = null;
    }
  },
];
chart.addEventListener('mousemove', evt => {
  const pt = svgPoint(evt); let P = G.P; if (!P) return;
  if (G.cols) P = G.cols.find(c => pt.x >= c.box.x && pt.x <= c.box.x + c.box.w) || G.cols[0];
  else if (G.Q && pt.y >= BOT.y - 4) P = G.Q;
  const i = clamp(Math.round((pt.x - P.box.x) / P.box.w * (P.set.g.length - 1)), 0, P.set.g.length - 1);
  tipAt(evt, `<div class="row"><span>${P.set.name}</span></div><div class="row"><span>t</span><b>${fmt(P.T[i], 2)} s</b></div><div class="row"><span><i class="sw" style="background:${C.violet}"></i>|ω|</span><span>${fmt(P.set.g[i], 2)} rad/s</span></div>`);
});
wire();

})();
</script>

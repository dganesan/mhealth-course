<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Activity Signals by Sensor and Placement</title>
</head>
<body>
<style>
  :root {
    color-scheme: light;
    --paper: #ffffff; --ink: #222222; --ink-2: #666666; --ink-3: #9a9a9a;
    --rule: #dcdcdc; --grid: #ececec; --raw: #8f8f8f; --raw-dot: #8c8c8c; --clean: #444444;
    --window: rgba(34, 34, 34, 0.06); --window-edge: #222222;
    --ma: #2a78d6; --med: #1baf7a; --wm: #4a3aa7; --ewma: #eb6834;
    --sans: "Helvetica Neue", Helvetica, -apple-system, Arial, sans-serif;
    --mono: Menlo, "SF Mono", Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.4; padding-block: 10px 10px; padding-inline: 14px; -webkit-font-smoothing: antialiased; }
  .stage { max-width: 1880px; margin: 0 auto; display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 10px; height: calc(100vh - 20px); }
  .slide { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 16px 30px 8px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 6px; min-height: 0; position: relative; outline: none; cursor: pointer; user-select: none; }
  .slide:focus-visible { box-shadow: 0 0 0 3px rgba(42,120,214,.35); }
  .head h1 { margin: 0; font-size: clamp(20px, 2.2vw, 28px); font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; line-height: 1.15; }
  .head h1 .tag { display: inline-block; font-family: var(--mono); font-weight: 400; font-size: 0.6em; color: var(--ink-2); margin-left: 10px; vertical-align: middle; background: #f4f4f4; padding: 2px 8px; border-radius: 4px; white-space: nowrap; }
  .head p { margin: 6px 0 0; color: #444; font-size: clamp(15px, 1.6vw, 18px); max-width: none; }
  .code { margin: 8px 0 0; font-family: var(--mono); font-size: clamp(13px, 1.35vw, 16px); color: var(--ink); background: #f4f6f9; border: 1px solid var(--rule); border-radius: 5px; padding: 6px 12px; white-space: pre; overflow-x: auto; }
  .code[hidden] { display: none; }
  .code .p { color: var(--ma); font-weight: 700; }
  .chart-wrap { position: relative; min-height: 0; height: 100%; display: flex; justify-content: center; align-items: center; }
  svg.chart { display: block; height: 100%; width: auto; max-width: 100%; max-height: 100%; overflow: visible; }
  .tt { position: absolute; pointer-events: none; display: none; background: #fff; border: 1px solid var(--rule); border-radius: 4px; padding: 6px 9px; font-family: var(--mono); font-size: 12px; color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,.08); white-space: nowrap; z-index: 2; }
  .tt .row { display: flex; gap: 10px; justify-content: space-between; }
  .tt .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .foot { position: absolute; top: 9px; right: 16px; display: flex; gap: 14px; align-items: baseline; font-size: 12px; color: var(--ink-3); padding: 0; pointer-events: none; }
  .foot .ctr { font-family: var(--mono); }
  .bar { display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; padding:9px 14px; border:1px solid var(--rule); border-radius:6px; background:#f6f7f9; font-size:14px; color:var(--ink); }
  .group { display:flex; align-items:center; gap:8px; }
  .group[hidden] { display:none; }
  .group label { font-size:13px; font-weight:700; color:var(--ink); letter-spacing:0; text-transform:none; }
  .val { font-family:var(--mono); font-size:14px; font-weight:700; color:var(--ma); min-width:5ch; }
  button, select { font:inherit; font-size:14px; color:var(--ink); background:#fff; border:1px solid #9a9a9a; border-radius:5px; padding:7px 13px; cursor:pointer; }
  button:hover, select:hover { border-color:var(--ink); }
  button.primary { background:var(--ma); color:#fff; border-color:var(--ma); min-width:88px; font-weight:700; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline:2px solid var(--ma); outline-offset:2px; }
  input[type=range] { accent-color:var(--ma); width:150px; height:30px; cursor:pointer; }
  .hint { margin-left:auto; color:var(--ink-2); font-size:12px; }
  .hint kbd { font-family:var(--mono); background:#fff; border:1px solid var(--rule); border-radius:3px; padding:0 5px; font-size:11px; }
  .grid line { stroke: var(--grid); stroke-width: 1; }
  .axis line, .axis path { stroke: var(--ink-2); stroke-width: 1; fill: none; }
  .axis text { font-family: var(--mono); font-size: 15px; fill: var(--ink-2); }
  .axis-title { font-family: var(--sans); font-size: 18px; fill: var(--ink-2); }
  .ptitle { font-family: var(--sans); font-size: 15px; font-weight: 700; fill: var(--ink); }
  .raw-line { fill: none; stroke: var(--raw); stroke-width: 1.5; }
  .out-line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .thin-line { fill: none; stroke-width: 1.4; stroke-linejoin: round; }
  .dash { stroke-dasharray: 5 4; }
  .win-rect { fill: var(--window); stroke: var(--window-edge); stroke-width: 1; stroke-dasharray: 3 3; }
  .dlabel { font-family: var(--sans); font-size: 13px; font-weight: 700; }
  .mono { font-family: var(--mono); }
  .big { font-family: var(--mono); font-size: 22px; font-weight: 700; }
  .badge { font-family: var(--mono); font-size: 15px; font-weight: 700; fill: var(--ink); }
  .kept { fill: none; stroke: var(--ewma); stroke-width: 2.2; }
  .cross { stroke: var(--raw-dot); stroke-width: 1.6; }
  .crosshair { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 2 2; }
  @media (max-width: 720px) { .slide { padding: 18px 16px 12px; min-height: 0; } .hint { display: none; } }
  .hint { display:none !important; }
  .group[hidden] { display:none; }
  button.tb { min-width:44px; padding:6px 10px; font-size:17px; line-height:1; }
  button.primary.tb { min-width:52px; }
</style>
<div class="stage">
  <section class="slide" id="slide" tabindex="0" aria-live="polite">
    <div class="head">
      <h1 id="title"></h1>
      <p id="subtitle"></p>
      <pre class="code" id="code" hidden></pre>
    </div>
    <div class="chart-wrap">
      <svg class="chart" id="chart" viewBox="0 0 1400 640" role="img" aria-label="Activity signal by sensor and placement"></svg>
      <div class="tt" id="tt"></div>
    </div>
    <div class="foot">
      <span>CS328 &nbsp;·&nbsp; Counting: Steps and Repetitions</span>
      <span class="ctr" id="counter"></span>
    </div>
  </section>

  <div class="bar">
    <div class="group">
      <button id="prev" class="tb" title="Previous step (←)">⏮</button>
      <button id="play" class="primary tb" title="Play / pause (space)">▶</button>
      <button id="next" class="tb" title="Next step (→)">⏭</button>
      <button id="restart" class="tb" title="Restart this step (r)">↺</button>
      <button id="reset" title="Reset dials to this step's presets">Reset dials</button>
    </div>
    <div class="group">
      <label for="act">Activity</label>
      <select id="act">
        <option value="walk" selected>walking on flat ground</option>
        <option value="up">walking upstairs</option>
        <option value="down">walking downstairs</option>
        <option value="run">running</option>
        <option value="stand">standing</option>
        <option value="sit">sitting</option>
        <option value="lie">lying down</option>
        <option value="cycle">cycling</option>
        <option value="row">rowing</option>
        <option value="swim">swimming</option>
      </select>
    </div>
    <div class="group">
      <label for="place">Sensor</label>
      <select id="place">
        <option value="pocket" selected>phone in pocket</option>
        <option value="wrist">watch on wrist</option>
        <option value="ear">earbud</option>
      </select>
    </div>
    <div class="group">
      <label for="speed">Speed</label>
      <select id="speed">
        <option value="0.25">very slow</option>
        <option value="0.5">slow</option>
        <option value="1" selected>normal</option>
        <option value="2.5">fast</option>
        <option value="0">instant</option>
      </select>
    </div>
  </div>
</div>


<script>
(() => {
// Kinematic activity model (side view). Each activity gives the pose as a function of time: hip
// position, trunk pitch, head pitch, and for each leg and arm either joint angles or a target point
// (a foot on the ground or a pedal, a hand on a handle) solved by two-link inverse kinematics.
// The figure stays in place while the ground, the stairs or the water move past it.
// Sensor readings: accelerometer = second difference of the sensor point's path plus gravity;
// gyroscope = angular rate of the segment the sensor is attached to.
(function (global) {
  const D = Math.PI / 180, TAU = 2 * Math.PI;
  const L = { thigh: 0.44, shank: 0.43, ankleH: 0.07, foot: 0.19, heel: 0.04, trunk: 0.50, neck: 0.20, uarm: 0.30, farm: 0.26 };
  const STAND_Y = L.ankleH + L.thigh + L.shank;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const frac = v => v - Math.floor(v);
  const lerp = (a, b, u) => a + (b - a) * u;
  const S5 = u => { u = clamp(u, 0, 1); return u * u * u * (u * (6 * u - 15) + 10); };
  const hermite = (p0, p1, m0, m1, u) => { const u2 = u * u, u3 = u2 * u; return (2 * u3 - 3 * u2 + 1) * p0 + (u3 - 2 * u2 + u) * m0 + (-2 * u3 + 3 * u2) * p1 + (u3 - u2) * m1; };
  // two-link inverse kinematics: the angle of the first link (deg, from straight down, + forward) and the
  // flexion of the middle joint that put the end of the chain on the target. bend = +1 puts the middle
  // joint ahead of the root-to-target line (a knee), -1 behind it (an elbow).
  function ik2(root, target, l1, l2, bend) {
    const dx = target.x - root.x, dy = target.y - root.y;
    const d = clamp(Math.hypot(dx, dy), 0.05, l1 + l2 - 0.002);
    const theta = Math.atan2(dx, -dy);
    const K = Math.acos(clamp((l1 * l1 + l2 * l2 - d * d) / (2 * l1 * l2), -1, 1));
    const alpha = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1));
    return { a1: (theta + bend * alpha) / D, flex: (Math.PI - K) / D };
  }

  // ---- gait on a moving ground: a foot in stance moves back with the ground, then swings forward
  function gaitFoot(G, ph) {
    const Tsw = (1 - G.stance) * G.T, Tst = G.stance * G.T;
    const vx = (G.lift.x - G.land.x) / Tst, vy = (G.lift.y - G.land.y) / Tst;
    const floor = Math.min(G.land.y, G.lift.y) - L.ankleH;
    if (ph < G.stance) { const u = ph / G.stance; return { x: lerp(G.land.x, G.lift.x, u), y: lerp(G.land.y, G.lift.y, u), on: true, floor }; }
    const u = (ph - G.stance) / (1 - G.stance);
    return { x: hermite(G.lift.x, G.land.x, vx * Tsw, vx * Tsw, u), y: hermite(G.lift.y, G.land.y, vy * Tsw, vy * Tsw, u) + G.clear * Math.sin(Math.PI * u), on: false, floor };
  }
  function gait(t, G) {
    const phi = frac(t / G.T), c = Math.cos(2 * TAU * (phi - G.stance / 2));   // +1 at mid-stance of either leg
    const hip = { x: G.sway * Math.sin(2 * TAU * (phi - G.stance / 2)), y: G.hipY + G.bob * c };
    const swing = Math.cos(TAU * phi);   // +1 just as the near foot lands in front
    return { hip, tau: G.tau + (G.tauSwing || 0) * c, pitch: 0,
      legs: [{ ankle: gaitFoot(G, phi) }, { ankle: gaitFoot(G, frac(phi + 0.5)) }],
      arms: [{ ua: -G.arm * swing, elbow: G.elbow }, { ua: G.arm * swing, elbow: G.elbow }] };
  }
  const q = 0.28, r = 0.17;   // stair run and rise
  const WALK = { T: 1.1, stance: 0.6, land: { x: 0.33, y: L.ankleH }, lift: { x: -0.33, y: L.ankleH }, clear: 0.07, hipY: 0.895, bob: 0.025, sway: 0.012, tau: 3, arm: 18, elbow: 25 };
  const RUN = { T: 0.72, stance: 0.35, land: { x: 0.26, y: L.ankleH }, lift: { x: -0.34, y: L.ankleH }, clear: 0.20, hipY: 0.86, bob: -0.045, sway: 0.02, tau: 9, arm: 32, elbow: 90 };
  const UP = { T: 1.4, stance: 0.65, land: { x: 0.65 * q, y: 0.65 * r + L.ankleH }, lift: { x: -0.65 * q, y: -0.65 * r + L.ankleH }, clear: 0.10, hipY: 0.80, bob: 0.015, sway: 0, tau: 10, arm: 10, elbow: 30, stairs: 1 };
  const DOWN = { T: 1.3, stance: 0.65, land: { x: 0.12, y: -0.65 * r + L.ankleH }, lift: { x: 0.12 - 1.3 * q, y: 0.65 * r + L.ankleH }, clear: 0.12, hipY: 0.76, bob: 0.02, sway: 0, tau: 2, arm: 10, elbow: 30, stairs: -1 };
  const BIKE = { bb: { x: 0.12, y: 0.30 }, crank: 0.17, f: 1.3, hip: { x: 0, y: 1.02 }, tau: 38, bar: { x: 0.62, y: 1.0 }, wheel: 0.34, rear: -0.45, front: 0.62 };
  const ROW = { T: 2.3, drive: 0.42, ankle: { x: 0.55, y: 0.24 }, hipY: 0.46, hipCatch: 0.10, hipFinish: -0.28, fly: { x: 1.05, y: 0.58 }, flyR: 0.24 };
  const SWIM = { f: 0.7, kick: 2.6, water: 0.55 };

  const ACT = {
    walk: { name: 'Walking on flat ground', rate: '1.8 steps/s', gait: WALK, ground: 'belt', mark: 'foot strike', every: WALK.T / 2, span: [-0.7, 0.7], pose: t => gait(t, WALK) },
    up: { name: 'Walking upstairs', rate: '1.4 steps/s', gait: UP, ground: 'stairs', mark: 'foot strike', every: UP.T / 2, span: [-0.9, 0.9], pose: t => gait(t, UP) },
    down: { name: 'Walking downstairs', rate: '1.5 steps/s', gait: DOWN, ground: 'stairs', mark: 'foot strike', every: DOWN.T / 2, span: [-0.9, 0.9], pose: t => gait(t, DOWN) },
    run: { name: 'Running', rate: '2.8 steps/s', gait: RUN, ground: 'belt', mark: 'foot strike', every: RUN.T / 2, span: [-0.7, 0.7], pose: t => gait(t, RUN) },
    stand: { name: 'Standing', rate: 'still', ground: 'floor', span: [-0.5, 0.5], pose(t) {
      const s = Math.sin(TAU * 0.3 * t);
      return { hip: { x: 0.004 * s, y: STAND_Y - 0.003 }, tau: 2 + 0.8 * s, pitch: 0, legs: [{ thigh: 0, knee: 0 }, { thigh: 0, knee: 0 }], arms: [{ ua: -3, elbow: 8 }, { ua: -3, elbow: 8 }] }; } },
    sit: { name: 'Sitting', rate: 'still', ground: 'chair', span: [-0.5, 0.6], pose(t) {
      const s = Math.sin(TAU * 0.25 * t);
      return { hip: { x: 0, y: 0.50 }, tau: 4 + 0.6 * s, pitch: 2, legs: [{ thigh: 90, knee: 90 }, { thigh: 90, knee: 90 }], arms: [{ ua: 30, elbow: 10 }, { ua: 30, elbow: 10 }] }; } },
    lie: { name: 'Lying down', rate: 'still', ground: 'mat', span: [-0.95, 0.95], pose(t) {
      return { hip: { x: 0, y: 0.10 }, tau: -90, pitch: 0, legs: [{ thigh: 90, knee: 0, sole: 90 }, { thigh: 90, knee: 0, sole: 90 }], arms: [{ ua: 90, elbow: 0 }, { ua: 90, elbow: 0 }] }; } },
    cycle: { name: 'Cycling', rate: '78 rpm', ground: 'bike', mark: 'one pedal turn', every: 1 / BIKE.f, span: [-0.75, 1.1], pose(t) {
      const th = TAU * BIKE.f * t, ped = a => ({ x: BIKE.bb.x - BIKE.crank * Math.sin(a), y: BIKE.bb.y - BIKE.crank * Math.cos(a) + 0.05 });   // bottom, back, top, front: the pedals turn forward
      return { hip: BIKE.hip, tau: BIKE.tau, pitch: -30, legs: [{ ankle: ped(th), sole: 0 }, { ankle: ped(th + Math.PI), sole: 0 }], arms: [{ wrist: BIKE.bar }, { wrist: BIKE.bar }], crank: th }; } },
    row: { name: 'Rowing', rate: '26 strokes/min', ground: 'rower', mark: 'start of a stroke', every: ROW.T, span: [-0.65, 1.3], scale: 195, pose(t) {
      const phi = frac(t / ROW.T), drive = phi < ROW.drive;
      const s = drive ? S5(phi / ROW.drive) : 1 - S5((phi - ROW.drive) / (1 - ROW.drive));              // 0 at the catch, 1 at the finish
      const sa = drive ? S5((phi / ROW.drive - 0.3) / 0.7) : 1 - S5((phi - ROW.drive) / (1 - ROW.drive) / 0.7);   // the arms follow the legs
      const hip = { x: lerp(ROW.hipCatch, ROW.hipFinish, s), y: ROW.hipY }, tau = lerp(22, -14, s);
      const sh = { x: hip.x + L.trunk * Math.sin(tau * D), y: hip.y + L.trunk * Math.cos(tau * D) };
      const wrist = { x: sh.x + lerp(0.50, 0.12, sa), y: sh.y + lerp(-0.22, -0.14, sa) };
      return { hip, tau, pitch: -tau * 0.6, legs: [{ ankle: ROW.ankle, sole: 50 }, { ankle: ROW.ankle, sole: 50 }], arms: [{ wrist }, { wrist }], handle: wrist }; } },
    swim: { name: 'Swimming', rate: '42 strokes/min', ground: 'water', mark: 'hand enters the water', every: 1 / SWIM.f, span: [-0.95, 0.95], pose(t) {
      const ph = frac(SWIM.f * t), st = TAU * ph, k = TAU * SWIM.kick * t;
      const turn = 360 * (ph - 0.10 * Math.sin(st));   // the hand moves fastest while it pulls under the body
      const arm = a => { a = frac(a / 360) * 360; return { ua: a, elbow: 15 + 30 * Math.max(0, -Math.cos(a * D)) }; };
      return { hip: { x: 0, y: 0.46 + 0.015 * Math.sin(st) }, tau: 90 + 2 * Math.sin(st), pitch: -8,
        legs: [{ thigh: -90 + 6 * Math.sin(k), knee: 10, sole: 190 }, { thigh: -90 - 6 * Math.sin(k), knee: 10, sole: 190 }],
        arms: [arm(90 - turn), arm(270 - turn)] }; } },
  };

  // joint positions for a pose
  function joints(p) {
    const tau = p.tau * D, hip = p.hip;
    const sh = { x: hip.x + L.trunk * Math.sin(tau), y: hip.y + L.trunk * Math.cos(tau) };
    const nk = (p.tau + p.pitch) * D;
    const head = { x: sh.x + L.neck * Math.sin(nk), y: sh.y + L.neck * Math.cos(nk) };
    const legs = p.legs.map(lg => {
      let thigh = lg.thigh, knee = lg.knee;
      if (lg.ankle) { const s = ik2(hip, lg.ankle, L.thigh, L.shank, 1); thigh = s.a1; knee = s.flex; }
      const th = thigh * D, shk = (thigh - knee) * D;
      const kneeP = { x: hip.x + L.thigh * Math.sin(th), y: hip.y - L.thigh * Math.cos(th) };
      const ankle = { x: kneeP.x + L.shank * Math.sin(shk), y: kneeP.y - L.shank * Math.cos(shk) };
      // sole angle from horizontal: flat when the foot is on the ground, else fixed to the shank, unless given
      const on = lg.ankle ? lg.ankle.on : false;
      const sole = lg.sole != null ? lg.sole * D : (on || lg.thigh != null) ? 0 : 0.5 * shk;
      let fang = sole - Math.asin(L.ankleH / L.foot);
      // a swinging foot turns with the shin but its toe never dips below the ground it left
      if (lg.ankle && !on && lg.ankle.floor != null) fang = Math.max(fang, Math.asin(clamp((lg.ankle.floor - ankle.y) / L.foot, -1, 1)));
      const toe = { x: ankle.x + L.foot * Math.cos(fang), y: ankle.y + L.foot * Math.sin(fang) };
      const heel = { x: ankle.x - L.heel * Math.cos(fang) + L.ankleH * Math.sin(fang), y: ankle.y - L.heel * Math.sin(fang) - L.ankleH * Math.cos(fang) };
      return { thigh, knee, kneeP, ankle, toe, heel, on };
    });
    const arms = p.arms.map(ar => {
      let ua = ar.ua, elbow = ar.elbow;
      if (ar.wrist) { const s = ik2(sh, ar.wrist, L.uarm, L.farm, -1); ua = s.a1; elbow = s.flex; }
      const fa = ua + elbow;
      const elbowP = { x: sh.x + L.uarm * Math.sin(ua * D), y: sh.y - L.uarm * Math.cos(ua * D) };
      const wrist = { x: elbowP.x + L.farm * Math.sin(fa * D), y: elbowP.y - L.farm * Math.cos(fa * D) };
      return { ua, fa, elbowP, wrist };
    });
    const th = legs[0].thigh * D;
    const pocket = { x: hip.x + 0.42 * L.thigh * Math.sin(th) + 0.045 * Math.cos(th), y: hip.y - 0.42 * L.thigh * Math.cos(th) + 0.045 * Math.sin(th) };
    const headAng = p.tau + p.pitch;
    const headC = { x: head.x + 0.085 * Math.sin(nk), y: head.y + 0.085 * Math.cos(nk) };
    return { hip, sh, head, headC, headAng, tau: p.tau, legs, arms, pocket, crank: p.crank, handle: p.handle };
  }

  function simulate(opt) {
    const A = ACT[opt.activity], fsi = opt.fsi || 200, dur = opt.dur || 10.5;
    let s = (opt.seed || 328) >>> 0; const rnd = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
    const gauss = () => { const u = 1 - rnd(), w = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * w); };
    const dt = 1 / fsi, N = Math.round(dur * fsi), frames = [];
    for (let n = 0; n < N; n++) { const J = joints(A.pose(n * dt)); J.t = n * dt; frames.push(J); }
    const g = 9.81, noise = opt.noise == null ? 0.25 : opt.noise, SIG = 4, KW = 12, KER = [];
    for (let k = -KW; k <= KW; k++) KER.push(Math.exp(-0.5 * k * k / (SIG * SIG)));
    const KS = KER.reduce((a, b) => a + b, 0);
    const smoothed = arr => { const o = new Float64Array(N); for (let n = 0; n < N; n++) { let v = 0; for (let k = -KW; k <= KW; k++) v += KER[k + KW] * arr[Math.min(N - 1, Math.max(0, n + k))]; o[n] = v / KS; } return o; };

  lie: { pocket: STILL, wrist: STILL, ear: STILL },
  cycle: { pocket: 'The thigh pumps up and down with the pedals, so both sensors show every pedal turn.',
           wrist: 'The hands rest on the handlebar, so the watch on the wrist sees only noise.',
           ear: 'The head stays still, so the earbud sees only noise.' },
  row: { pocket: 'The thigh folds and unfolds with each stroke, so the gyroscope shows every stroke.',
         wrist: 'The arms reach and pull with each stroke, so the gyroscope shows every stroke clearly.',
         ear: 'The trunk rocks with each stroke, so the earbud sees a gentle wave on both sensors.' },
  swim: { pocket: 'The legs kick fast but not far, so the phone sees a quick, small ripple.',
          wrist: 'The arm circles with each stroke, so both sensors show every stroke strongly.',
          ear: 'The head stays in line with the body, so the earbud sees almost nothing.' },
};
const caption = () => CAP[dial('act')][dial('place')];
const tag = () => `${FS} Hz · ${SIM.act.rate}`;
const STEPS = [
  { title: 'Walking on flat ground', dur: 8, presets: { act: 'walk', place: 'pocket' }, tag, subtitle: caption, setup() {}, draw: drawAll },
  { title: 'Walking upstairs', dur: 8, presets: { act: 'up', place: 'pocket' }, tag, subtitle: caption, setup() {}, draw: drawAll },
  { title: 'Walking downstairs', dur: 8, presets: { act: 'down', place: 'pocket' }, tag, subtitle: caption, setup() {}, draw: drawAll },
  { title: 'Running', dur: 8, presets: { act: 'run', place: 'pocket' }, tag, subtitle: caption, setup() {}, draw: drawAll },
  { title: 'Standing, sitting and lying down', dur: 8, presets: { act: 'stand', place: 'pocket' }, tag, subtitle: caption, setup() {}, draw: drawAll },
  { title: 'Cycling', dur: 8, presets: { act: 'cycle', place: 'pocket' }, tag, subtitle: caption, setup() {}, draw: drawAll },
  { title: 'Rowing', dur: 8, presets: { act: 'row', place: 'wrist' }, tag, subtitle: caption, setup() {}, draw: drawAll },
  { title: 'Swimming', dur: 8, presets: { act: 'swim', place: 'wrist' }, tag, subtitle: caption, setup() {}, draw: drawAll },
];

// ------------------------------------------------------------ hover
chart.addEventListener('mousemove', evt => {
  const q = svgPoint(evt), P = PANELS.find(P => q.x >= P.box.x && q.x <= P.box.x + P.box.w && q.y >= P.box.y && q.y <= P.box.y + P.box.h);
  if (!P) { tt.style.display = 'none'; return; }
  const tq = clamp((q.x - P.box.x) / P.box.w * WIN, 0, WIN);
  if (tq > progress * WIN) { tt.style.display = 'none'; return; }
  const i = Math.min(D.ts.length - 1, Math.round(tq * FS));
  tipAt(evt, `<div class="row"><span>t</span><b>${fmt(tq, 2)} s</b></div><div class="row"><span>accel. magnitude</span><span>${fmt(D.acc[i], 2)} m/s²</span></div><div class="row"><span>angular rate</span><span>${fmt(D.gyr[i], 0)} °/s</span></div>`);
});

// ------------------------------------------------------------ step machine
let step = 0, progress = 0, playing = false, raf = 0, lastT = 0;
const speedMult = () => parseFloat($('speed').value);
function cur() { return STEPS[step]; }
let lastCode = null;
function updateHead() {
  const d = cur();
  $('title').innerHTML = d.title + (d.tag ? `<span class="tag">${d.tag()}</span>` : '');
  $('subtitle').textContent = typeof d.subtitle === 'function' ? d.subtitle() : d.subtitle;
  const code = typeof d.code === 'function' ? d.code() : (d.code || '');
  if (code !== lastCode) { lastCode = code; $('code').hidden = !code; $('code').innerHTML = code; }
  $('counter').textContent = `${step + 1} / ${STEPS.length}`;
  const use = d.dials || Object.keys(dials); for (const id in dials) $(id).closest('.group').hidden = !use.includes(id);
}
function enterStep(k, completed = false) {
  step = clamp(k, 0, STEPS.length - 1); stopPlay();
  applyPresets(cur().presets);
  try { history.replaceState(null, '', '#' + (step + 1)); } catch (_) {}
  progress = 0; rebuild(); cur().setup();
  if (!cur().dur || completed || speedMult() === 0) { progress = 1; cur().draw(1); updateHead(); }
  else { cur().draw(0); updateHead(); startPlay(); }
}
function redraw() { rebuild(); cur().setup(); cur().draw(progress); updateHead(); }
function onDial() { redraw(); }
function tick(t) {
  if (!playing) return;
  const dt = Math.max(0, Math.min(0.1, (t - lastT) / 1000)); lastT = t;
  progress = Math.min(1, progress + dt * speedMult() / cur().dur);
  cur().draw(progress); updateHead();
  if (progress >= 1) { stopPlay(); return; }
  raf = requestAnimationFrame(tick);
}
function startPlay() { if (progress >= 1 || !cur().dur) return; playing = true; lastT = performance.now(); $('play').textContent = '⏸'; raf = requestAnimationFrame(tick); }
function stopPlay() { playing = false; cancelAnimationFrame(raf); $('play').textContent = '▶'; }
function finish() { stopPlay(); progress = 1; cur().draw(1); updateHead(); }
function next() { if (progress < 1) { finish(); return; } if (step < STEPS.length - 1) enterStep(step + 1); }
function prev() { if (step > 0) enterStep(step - 1, true); }
function restart() { enterStep(step); }
function wire() {
  $('next').addEventListener('click', e => { e.stopPropagation(); next(); });
  $('prev').addEventListener('click', e => { e.stopPropagation(); prev(); });
  $('restart').addEventListener('click', e => { e.stopPropagation(); restart(); });
  $('reset').addEventListener('click', e => { e.stopPropagation(); for (const id in dirty) dirty[id] = false; applyPresets({ act: 'walk', place: 'pocket' }, true); applyPresets(cur().presets, true); restart(); });
  $('play').addEventListener('click', e => { e.stopPropagation(); if (playing) stopPlay(); else if (progress >= 1) restart(); else startPlay(); });
  $('speed').addEventListener('click', e => e.stopPropagation());
  $('speed').addEventListener('change', e => { e.stopPropagation(); if (speedMult() === 0) finish(); });
  $('slide').addEventListener('click', () => next());
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
    else if (e.key === ' ') { e.preventDefault(); $('play').click(); }
    else if (e.key === 'r' || e.key === 'R') restart();
  });
  chart.addEventListener('mouseleave', () => { tt.style.display = 'none'; });
  const h = parseInt((location.hash || '').replace('#', ''), 10);
  enterStep(h >= 1 && h <= STEPS.length ? h - 1 : 0);
}
defDial('act', {});
defDial('place', {});
wire();

})();
</script>

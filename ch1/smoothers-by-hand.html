<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smoothing Filters: A Worked Example</title>
</head>
<body>
<style>
  :root {
    color-scheme: light;
    --paper: #ffffff; --ink: #222222; --ink-2: #666666; --ink-3: #9a9a9a;
    --rule: #dcdcdc; --grid: #ececec; --raw: #8f8f8f; --raw-dot: #8c8c8c;
    --window: rgba(34,34,34,0.06); --window-edge: #222222;
    --ma: #2a78d6; --med: #1baf7a; --wm: #4a3aa7; --ewma: #eb6834;
    --sans: "Helvetica Neue", Helvetica, -apple-system, Arial, sans-serif;
    --mono: Menlo, "SF Mono", Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.4; padding-block: 10px 10px; padding-inline: 14px; -webkit-font-smoothing: antialiased; }
  .stage { max-width: 1880px; margin: 0 auto; display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 10px; height: calc(100vh - 20px); }
  .slide { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 16px 30px 8px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 6px; min-height: 0; position: relative; outline: none; cursor: pointer; user-select: none; }
  .slide:focus-visible { box-shadow: 0 0 0 3px rgba(42,120,214,.35); }
  .head h1 { margin: 0; font-size: clamp(24px, 2.4vw, 36px); font-weight: 700; letter-spacing: -0.01em; line-height: 1.15; }
  .head h1 .tag { display: inline-block; font-family: var(--mono); font-weight: 400; font-size: 0.6em; color: var(--ink-2); margin-left: 10px; vertical-align: middle; background: #f4f4f4; padding: 2px 8px; border-radius: 4px; white-space: nowrap; }
  .head p { margin: 6px 0 0; color: #444; font-size: clamp(18px, 1.7vw, 24px); max-width: none; }
  .head p:empty { display: none; }
  .code { margin: 8px 0 0; font-family: var(--mono); font-size: clamp(15px, 1.4vw, 21px); color: var(--ink); background: #f4f6f9; border: 1px solid var(--rule); border-radius: 5px; padding: 6px 12px; white-space: pre; overflow-x: auto; }
  .code[hidden] { display: none; }
  .code .p { color: var(--ma); font-weight: 700; }
  .code .k { color: var(--ink-2); }
  .chart-wrap { position: relative; min-height: 0; height: 100%; display: flex; justify-content: center; align-items: center; }
  svg.chart { display: block; height: 100%; width: auto; max-width: 100%; max-height: 100%; overflow: visible; }
  .foot { position: absolute; top: 9px; right: 16px; display: flex; gap: 14px; align-items: baseline; font-size: 14px; color: var(--ink-3); padding: 0; pointer-events: none; }
  .foot .ctr { font-family: var(--mono); }
  .bar { display:flex; flex-direction:column; gap:12px; padding:12px 24px;
         border:1px solid var(--rule); border-radius:6px; background:#f6f7f9; font-size:19px; color:var(--ink); }
  .bar .row { display:flex; justify-content:flex-start; align-items:center; gap:16px 32px; flex-wrap:wrap; }
  .bar .row.dials .group { flex:1 1 0; }
  .bar .row.dials input[type=range] { flex:1 1 auto; width:auto; }
  .group { display:flex; align-items:center; gap:10px; }
  .group label { font-size:18px; font-weight:700; color:var(--ink); letter-spacing:0; text-transform:none; white-space:nowrap; }
  .val { font-family:var(--mono); font-size:19px; font-weight:700; color:var(--ma); min-width:5ch; white-space:nowrap; }
  button, select, input[type=text] { font:inherit; font-size:18px; color:var(--ink); background:#fff; border:1px solid #9a9a9a; border-radius:6px; padding:9px 16px; cursor:pointer; }
  input[type=text] { font-family:var(--mono); cursor:text; flex:1 1 auto; width:auto; min-width:0; padding:7px 12px; font-size:18px; }
  .bar .row .group:has(#seq) { flex:1 1 100%; }
  .bar .row .group:has(#preset) { flex:1 1 auto; }
  .bar .row .group:has(#preset) select { flex:1 1 auto; }
  .bar .hint { display:none; }
  button:hover, select:hover { border-color:var(--ink); }
  button.primary { background:var(--ma); color:#fff; border-color:var(--ma); min-width:88px; font-weight:700; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline:2px solid var(--ma); outline-offset:2px; }
  button:disabled { opacity:.4; cursor:default; }
  input[type=range] { -webkit-appearance:none; appearance:none; accent-color:var(--ma); width:260px; height:36px; background:transparent; cursor:pointer; }
  input[type=range]::-webkit-slider-runnable-track { height:8px; border-radius:4px; background:#c9d1dc; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:26px; height:26px; border-radius:50%; background:var(--ma); border:3px solid #fff; box-shadow:0 0 0 1.5px var(--ma); margin-top:-9px; }
  input[type=range]::-moz-range-track { height:8px; border-radius:4px; background:#c9d1dc; }
  input[type=range]::-moz-range-thumb { width:26px; height:26px; border-radius:50%; background:var(--ma); border:3px solid #fff; }
  .hint { margin-left:auto; color:var(--ink-2); font-size:12px; }
  .hint kbd { font-family:var(--mono); background:#fff; border:1px solid var(--rule); border-radius:3px; padding:0 5px; font-size:11px; }

  .axis line, .axis path { stroke: var(--ink-2); stroke-width: 1.3; fill: none; }
  .axis text, .num { font-family: var(--mono); font-size: 22px; fill: var(--ink-2); }
  .lane-label { font-family: var(--sans); font-size: 24px; font-weight: 700; }
  .lane-sub { font-family: var(--mono); font-size: 22px; fill: var(--ink-3); }
  .grid line { stroke: var(--grid); }
  .in-line { fill: none; stroke: var(--raw); stroke-width: 2.0; }
  .in-dot { fill: var(--raw-dot); }
  .in-num { font-family: var(--mono); font-size: 22px; fill: var(--ink); font-weight: 700; }
  .win-rect { fill: var(--window); stroke: var(--window-edge); stroke-width: 1; stroke-dasharray: 3 3; }
  .out-line { fill: none; stroke-width: 2.6; stroke-linejoin: round; }
  .out-dot { stroke: #fff; stroke-width: 2.0; }
  .out-num { font-family: var(--mono); font-size: 22px; font-weight: 700; }
  .ghost { fill: none; stroke: var(--raw); stroke-width: 1; opacity: .6; }
  .work { font-family: var(--mono); font-size: 22px; fill: var(--ink); }
  .work-hi { font-weight: 700; font-size: 1.15em; }
  .work-dim { fill: var(--ink-3); }
  .cursor-line { stroke: var(--ink-3); stroke-width: 1.3; stroke-dasharray: 2 3; }
  .callout text { font-family: var(--sans); font-size: 22px; fill: var(--ink-2); }
  .callout line { stroke: var(--ink-3); stroke-width: 1.3; stroke-dasharray: 2 3; }
  .lane-bg { fill: #fafafa; }
  .lane-active { fill: #f2f6fc; }

  @media (max-width: 720px) { .slide { padding: 18px 16px 12px; min-height: 0; } .notes { grid-template-columns: 1fr; gap: 10px; } .hint { display: none; } }
</style>

<div class="stage">
  <section class="slide" id="slide" tabindex="0" aria-live="polite">
    <div class="head">
      <h1 id="title"></h1>
      <p id="subtitle"></p>
      <pre class="code" id="code" hidden></pre>
    </div>
    <div class="chart-wrap">
      <svg class="chart" id="chart" viewBox="0 0 1560 640" role="img" aria-label="Input sequence and four filter outputs computed by hand"></svg>
    </div>
    <div class="foot">
      <span>CS328 &nbsp;·&nbsp; Sensor Data Smoothing and Filtering</span>
      <span class="ctr" id="counter"></span>
    </div>
  </section>

  <div class="bar">
   <div class="row">
    <div class="group">
      <button id="prev" class="tb" title="Previous step (←)">⏮</button>
      <button id="play" class="primary tb" title="Play / pause (space)">▶</button>
      <button id="one" title="Advance one sample (.)">+1 sample</button>
      <button id="next" class="tb" title="Next step (→)">⏭</button>
      <button id="restart" class="tb" title="Restart this step (r)">↺</button>
      <button id="reset" title="Reset all dials to defaults">Reset dials</button>
    </div>
    <div class="group">
      <label for="win">Window w</label>
      <select id="win"><option value="3" selected>3</option><option value="5">5</option></select>
    </div>
    <div class="group">
      <label for="alpha">EWMA α</label>
      <select id="alpha"><option value="0.5">0.5</option><option value="0.33">0.33</option><option value="0.2" selected>0.2</option></select>
    </div>
    <div class="group">
      <label for="speed">Speed</label>
      <select id="speed"><option value="0.8">very slow</option><option value="1.6" selected>slow</option><option value="3.5">normal</option><option value="8">fast</option><option value="0">instant</option></select>
    </div>
    <div class="group">
      <label for="preset">Scenario</label>
      <select id="preset">
        <option value="2, 4, 6, 8, 10, 8, 6, 4, 2, 20, 2, 4, 6, 8, 10" selected>ramp, peak and one glitch</option>
        <option value="4, 4, 4, 4, 4, 4, 4, 20, 4, 4, 4, 4, 4, 4, 4">single glitch: median deletes it, mean spreads it</option>
        <option value="2, 2, 2, 2, 2, 2, 2, 10, 10, 10, 10, 10, 10, 10, 10">step edge: median keeps it sharp, EWMA lags</option>
        <option value="2, 3, 4, 6, 9, 12, 9, 6, 4, 3, 2, 2, 2, 2, 2">smooth peak: mean and median both trim it</option>
        <option value="5, 7, 4, 6, 5, 8, 3, 6, 5, 7, 4, 6, 5, 7, 4">jitter around 5: every filter smooths it</option>
        <option value="2, 20, 2, 20, 2, 20, 2, 20, 2, 20, 2, 20, 2, 20, 2">alternating spikes: median gives up</option>
        <option value="3, 5, 100, 6, 4">review question: 3, 5, 100, 6, 4</option>
        <option value="custom">custom (edit the sequence below)</option>
      </select>
    </div>
    <div class="group">
      <label for="seq">Sequence</label>
      <input type="text" id="seq" value="2, 4, 6, 8, 10, 8, 6, 4, 2, 20, 2, 4, 6, 8, 10" spellcheck="false">
    </div>
   </div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const svgNS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs = {}, parent) => { const n = document.createElementNS(svgNS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; };
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------------- data & filters
  let X = [];
  let w = 3, alphaMode = '0.2', speed = 1.6;
  const alphaVal = () => parseFloat(alphaMode);
  const M = () => (w - 1) / 2;
  const idxWin = i => { const lo = Math.max(0, i - M()), hi = Math.min(X.length - 1, i + M()); const a = []; for (let k = lo; k <= hi; k++) a.push(k); return a; };
  const triW = k => M() + 1 - Math.abs(k);
  const fmt = v => Number.isInteger(v) ? String(v) : (Math.round(v * 100) / 100).toFixed(2).replace(/\.?0+$/, '');
  const fmt1 = v => Number.isInteger(v) ? String(v) : (Math.round(v * 10) / 10).toFixed(1);

  const F = {
    ma: {
      name: 'moving average', color: 'var(--ma)',
      calc(i, out) { const idx = idxWin(i); const s = idx.reduce((a, k) => a + X[k], 0); return { v: s / idx.length, work: `(${idx.map(k => fmt(X[k])).join(' + ')}) / ${idx.length} = ${fmt1(s / idx.length)}` }; }
    },
    med: {
      name: 'median', color: 'var(--med)',
      calc(i) { const idx = idxWin(i); const sorted = idx.map(k => X[k]).sort((a, b) => a - b); const n = sorted.length; const v = n % 2 ? sorted[(n - 1) / 2] : (sorted[n / 2 - 1] + sorted[n / 2]) / 2; return { v, work: `[${idx.map(k => fmt(X[k])).join(', ')}] sorted [${sorted.map(fmt).join(', ')}] = ${fmt1(v)}`, pickIdx: idx.slice().sort((a, b) => X[a] - X[b])[Math.floor((n - 1) / 2)] }; }
    },
    wm: {
      name: 'weighted mean', color: 'var(--wm)',
      calc(i) { const idx = idxWin(i); const wts = idx.map(k => triW(k - i)); const sw = wts.reduce((a, b) => a + b, 0); const s = idx.reduce((a, k, j) => a + wts[j] * X[k], 0); return { v: s / sw, work: `(${idx.map((k, j) => `${wts[j]}·${fmt(X[k])}`).join(' + ')}) / ${sw} = ${fmt1(s / sw)}`, wts }; }
    },
    ewma: {
      name: 'EWMA', color: 'var(--ewma)',
      calc(i, out) { const a = alphaVal(); if (i === 0) return { v: X[0], work: `s₀ = x₀ = ${fmt(X[0])}` }; const prev = out[i - 1]; const v = a * X[i] + (1 - a) * prev; return { v, work: `${fmt(a)}·${fmt(X[i])} + ${fmt(1 - a)}·${fmt1(prev)} = ${fmt1(v)}` }; }
    }
  };
  const ORDER = ['ma', 'med', 'ewma'];
  let OUT = {};
  function computeAll() { OUT = {}; ORDER.forEach(k => { const arr = []; for (let i = 0; i < X.length; i++) arr.push(F[k].calc(i, arr).v); OUT[k] = arr; }); }

  // ---------------- steps
  const P = v => `<b class="p">${v}</b>`;
  function stepDefs() {
    const a = alphaVal(), aT = fmt(a);
    const wts = Array.from({ length: w }, (_, j) => triW(j - M()));
    return [
      { id: 'raw', lanes: [], title: 'Input sequence', tag: `${X.length} samples`,
        subtitle: '' },
      { id: 'ma', lanes: ['ma'], title: 'Moving average', tag: `w = ${w}`,
        subtitle: '',
        code: `ma  = data.rolling(window=${P(w)}, center=${P('True')}).mean()` },
      { id: 'med', lanes: ['med'], title: 'Median filter', tag: `w = ${w}`,
        subtitle: '',
        code: `med = data.rolling(window=${P(w)}, center=${P('True')}).median()` },
      { id: 'ewma', lanes: ['ewma'], title: 'Exponentially weighted moving average', tag: `α = ${aT}`,
        subtitle: '',
        code: `ema = data.ewm(alpha=${P(aT)}, adjust=${P('False')}).mean()` }
    ];
  }

  // ---------------- layout
  const W = 1560, H = 640;
  const PL = 190, PR = 40, PT = 26;
  const TOP_H = 166, LANE_H = 124, LANE_GAP = 10;
  const plotW = W - PL - PR;
  const xs = i => PL + (i + 0.5) * (plotW / X.length);
  let yLo = 0, yHi = 20;
  const yTop = (v, y0, h) => y0 + h - ((v - yLo) / (yHi - yLo)) * h;

  const chart = $('chart');
  let steps, step = 0, cursor = -1, playing = false, raf = 0, lastT = 0, acc = 0;
  let G = {};

  function drawStatic() {
    chart.innerHTML = '';
    const lo = Math.min(...X), hi = Math.max(...X); const pad = Math.max(1, 0.12 * (hi - lo || 1));
    yLo = Math.floor(lo - pad); yHi = Math.ceil(hi + pad);
    // top input panel
    const g = el('g', {}, chart);
    const axis = el('g', { class: 'axis' }, g);
    el('path', { d: `M${PL},${PT}V${PT + TOP_H}H${PL + plotW}` }, axis);
    el('text', { x: PL - 10, y: PT + 12, 'text-anchor': 'end', class: 'lane-label', fill: 'var(--ink)' }, g).textContent = 'input xᵢ';
    for (let i = 0; i < X.length; i++) el('text', { x: xs(i), y: PT + TOP_H + 16, 'text-anchor': 'middle' }, axis).textContent = i;
    el('text', { x: PL + plotW + 8, y: PT + TOP_H + 16, class: 'num' }, g).textContent = 'i';
    let d = ''; X.forEach((v, i) => d += (i ? 'L' : 'M') + xs(i) + ',' + yTop(v, PT, TOP_H - 22));
    el('path', { class: 'in-line', d }, g);
    G.inDots = el('g', {}, g);
    X.forEach((v, i) => {
      el('circle', { class: 'in-dot', cx: xs(i), cy: yTop(v, PT, TOP_H - 22), r: 4, 'data-i': i }, G.inDots);
      el('text', { class: 'in-num', x: xs(i), y: yTop(v, PT, TOP_H - 22) - 10, 'text-anchor': 'middle' }, G.inDots).textContent = fmt(v);
    });
    G.win = el('g', {}, g);
    // lanes
    G.lanes = {};
    ORDER.forEach((k, j) => {
      const y0 = PT + TOP_H + 34 + j * (LANE_H + LANE_GAP);
      const lg = el('g', {}, chart);
      const bg = el('rect', { class: 'lane-bg', x: PL - 4, y: y0 - 4, width: plotW + 8, height: LANE_H + 8, rx: 4 }, lg);
      el('line', { x1: PL, x2: PL + plotW, y1: y0 + LANE_H - 26, y2: y0 + LANE_H - 26, stroke: 'var(--rule)' }, lg);
      el('text', { x: PL - 10, y: y0 + 18, 'text-anchor': 'end', class: 'lane-label', fill: F[k].color }, lg).textContent = F[k].name;
      const sub = el('text', { x: PL - 10, y: y0 + 38, 'text-anchor': 'end', class: 'lane-sub' }, lg);
      sub.textContent = k === 'ewma' ? `α = ${fmt(alphaVal())}` : `w = ${w}`;
      let gd = ''; X.forEach((v, i) => gd += (i ? 'L' : 'M') + xs(i) + ',' + yTop(v, y0, LANE_H - 42));
      const ghost = el('path', { class: 'ghost', d: gd }, lg);
      const outG = el('g', {}, lg);
      const workG = el('g', {}, lg);
      G.lanes[k] = { y0, g: lg, bg, ghost, outG, workG, sub };
    });
    G.callouts = el('g', { class: 'callout' }, chart);
  }

  function drawLane(k, upto, active) {
    const L = G.lanes[k]; L.outG.innerHTML = ''; L.workG.innerHTML = '';
    L.bg.setAttribute('class', active ? 'lane-active' : 'lane-bg');
    const y = v => yTop(v, L.y0, LANE_H - 42);
    if (upto < 0) { L.ghost.style.opacity = .35; return; }
    L.ghost.style.opacity = .6;
    let d = ''; for (let i = 0; i <= upto; i++) d += (i ? 'L' : 'M') + xs(i) + ',' + y(OUT[k][i]);
    el('path', { class: 'out-line', d, stroke: F[k].color }, L.outG);
    for (let i = 0; i <= upto; i++) {
      el('circle', { class: 'out-dot', cx: xs(i), cy: y(OUT[k][i]), r: i === upto && active ? 5 : 3.5, fill: F[k].color }, L.outG);
      el('text', { class: 'out-num', x: xs(i), y: y(OUT[k][i]) - 9, 'text-anchor': 'middle', fill: F[k].color }, L.outG).textContent = fmt1(OUT[k][i]);
    }
    // worksheet text at right: one line, expression then the result in the lane colour
    if (active) {
      const res = F[k].calc(upto, OUT[k]);
      const parts = res.work.split(' = ');
      const expr = parts.slice(0, -1).join(' = ');
      const t = el('text', { class: 'work', x: PL + plotW - 6, y: L.y0 + LANE_H - 6, 'text-anchor': 'end' }, L.workG);
      const e = el('tspan', {}, t); e.textContent = parts.length > 1 ? expr + ' = ' : expr;
      if (parts.length > 1) { const r = el('tspan', { class: 'work-hi', fill: F[k].color }, t); r.textContent = parts[parts.length - 1]; }
      // shrink to fit the column if the expression is long
      const maxW = plotW - 40; const est = (t.textContent.length) * 13.4;
      if (est > maxW) t.setAttribute('font-size', Math.max(16, 22 * maxW / est));
    }
  }
  function wrapText(s, n) { const words = s.split(' '); const out = []; let cur = ''; words.forEach(wd => { if ((cur + ' ' + wd).trim().length > n && cur) { out.push(cur); cur = wd; } else cur = (cur + ' ' + wd).trim(); }); if (cur) out.push(cur); return out; }

  function drawWindow(lanes, i) {
    G.win.innerHTML = '';
    // reset input dot emphasis
    [...G.inDots.querySelectorAll('circle')].forEach(c => { c.setAttribute('r', 4); c.setAttribute('fill', 'var(--raw-dot)'); c.style.opacity = 1; });
    if (i < 0 || !lanes.length) return;
    const k = lanes.length === 1 ? lanes[0] : null;
    const yb = PT + 4, hb = TOP_H - 8;
    if (!k || k !== 'ewma') {
      const idx = idxWin(i); const cell = plotW / X.length;
      el('rect', { class: 'win-rect', x: xs(idx[0]) - cell / 2 + 2, y: yb, width: (idx.length) * cell - 4, height: hb, rx: 3 }, G.win);
      const col = k ? F[k].color : 'var(--ink)';
      idx.forEach(j => { const c = G.inDots.querySelector(`circle[data-i="${j}"]`); c.setAttribute('fill', col); c.setAttribute('r', 5); });
      if (k === 'wm') { const wts = idx.map(j => triW(j - i)); idx.forEach((j, n) => { G.inDots.querySelector(`circle[data-i="${j}"]`).style.opacity = 0.35 + 0.65 * wts[n] / (M() + 1); }); }
      if (k === 'med') { const pick = F.med.calc(i).pickIdx; el('circle', { cx: xs(pick), cy: yTop(X[pick], PT, TOP_H - 22), r: 9, fill: 'none', stroke: F.med.color, 'stroke-width': 2 }, G.win); }
    }
    if (!k || k === 'ewma') {
      const a = alphaVal();
      for (let b = 0; b <= 12 && i - b >= 0; b++) { const wt = Math.pow(1 - a, b); if (wt < 0.05) break; const c = G.inDots.querySelector(`circle[data-i="${i - b}"]`); if (k) { c.setAttribute('fill', F.ewma.color); c.style.opacity = 0.2 + 0.8 * wt; c.setAttribute('r', 5); } }
    }
    el('line', { class: 'cursor-line', x1: xs(i), x2: xs(i), y1: PT, y2: H - 10 }, G.win);
  }

  function drawCallouts() {
    G.callouts.innerHTML = '';
    if (steps[step].id !== 'all' || X.length < 8) return;
    // find peak, glitch (largest jump), and a ramp point
    let peak = 0; X.forEach((v, i) => { if (i > 0 && i < X.length - 1 && v > X[peak] && Math.abs(v - X[i - 1]) < Math.abs(X[i - 1] - X[i - 2] || 1) * 2.5) peak = i; });
    let glitch = -1, best = 0; X.forEach((v, i) => { if (i > 0 && i < X.length - 1) { const j = Math.min(Math.abs(v - X[i - 1]), Math.abs(v - X[i + 1])); if (j > best) { best = j; glitch = i; } } });
    const mk = (i, label) => { if (i < 0) return; const g = el('g', {}, G.callouts); el('line', { x1: xs(i), x2: xs(i), y1: PT - 14, y2: H - 10 }, g); el('text', { x: xs(i) + 5, y: PT - 4 }, g).textContent = label; };
    if (best > (Math.max(...X) - Math.min(...X)) * 0.3) mk(glitch, 'glitch'); else glitch = -1;
    if (peak !== glitch) mk(peak, 'peak');
    // "read down a column" table in the right-hand column
    const cols = [[peak, 'peak'], [glitch, 'glitch']].filter(c => c[0] >= 0);
    let y = PT + 6;
    const x0 = PL + plotW - 300;
    cols.forEach(([i, label]) => {
      const g = el('g', {}, G.callouts);
      el('text', { x: x0, y: y + 8, class: 'num' }, g).textContent = `${label}  ·  i = ${i}  ·  xᵢ = ${fmt(X[i])}`;
      ORDER.forEach((k, j) => {
        const yy = y + 30 + j * 20;
        el('circle', { cx: x0 + 5, cy: yy - 4, r: 4, fill: F[k].color }, g);
        el('text', { x: x0 + 16, y: yy, class: 'work' }, g).textContent = F[k].name;
        el('text', { x: x0 + 280, y: yy, class: 'work work-hi', 'text-anchor': 'end', fill: F[k].color }, g).textContent = fmt1(OUT[k][i]);
      });
      y += 30 + ORDER.length * 20 + 26;
    });
  }

  // ---------------- step control
  function enterStep(k, completed = false) {
    step = k; const d = steps[step];
    $('title').innerHTML = d.title + (d.tag ? `<span class="tag">${d.tag}</span>` : '');
    $('subtitle').textContent = d.subtitle;
    $('code').hidden = !d.code; $('code').innerHTML = d.code || '';
    $('counter').textContent = `${step + 1} / ${steps.length}`;
    try { history.replaceState(null, '', '#' + (step + 1)); } catch (_) {}
    $('prev').disabled = step === 0;
    stopPlay(); cursor = -1;
    render();
    if (completed || !d.lanes.length || speed === 0 || reduceMotion) finish(); else startPlay();
  }
  function laneUpto(k) {
    const d = steps[step];
    if (d.lanes.includes(k)) return cursor;
    const idx = ORDER.indexOf(k), cur = ORDER.indexOf(d.lanes[0]);
    return d.id === 'all' ? cursor : (idx < cur ? X.length - 1 : -1); // earlier lanes stay filled
  }
  function render() {
    const d = steps[step];
    ORDER.forEach(k => drawLane(k, laneUpto(k), d.lanes.includes(k) && cursor >= 0 && cursor < X.length));
    drawWindow(d.lanes, cursor);
    drawCallouts();
  }
  const done = () => !steps[step].lanes.length || cursor >= X.length - 1;
  function finish() { cursor = X.length - 1; stopPlay(); render(); ORDER.forEach(k => { if (steps[step].lanes.includes(k)) drawLane(k, X.length - 1, false); }); G.win.innerHTML = ''; [...G.inDots.querySelectorAll('circle')].forEach(c => { c.setAttribute('r', 4); c.setAttribute('fill', 'var(--raw-dot)'); c.style.opacity = 1; }); }
  function tick(t) {
    if (!playing) return;
    const dt = Math.max(0, Math.min(0.1, (t - lastT) / 1000)); lastT = t; acc += dt * speed;
    while (acc >= 1 && cursor < X.length - 1) { cursor++; acc -= 1; render(); }
    if (cursor >= X.length - 1) { render(); stopPlay(); return; }
    raf = requestAnimationFrame(tick);
  }
  function startPlay() { if (done()) return; playing = true; lastT = performance.now(); acc = 0.999; $('play').textContent = '⏸'; raf = requestAnimationFrame(tick); }
  function stopPlay() { playing = false; cancelAnimationFrame(raf); $('play').textContent = '▶'; }
  function oneSample() { if (!steps[step].lanes.length) { next(); return; } stopPlay(); if (cursor < X.length - 1) { cursor++; render(); } }
  function next() { if (!done()) { finish(); return; } if (step < steps.length - 1) enterStep(step + 1); }
  function prev() { if (step > 0) enterStep(step - 1, true); }

  function rebuild(keepStep = true) {
    computeAll(); steps = stepDefs(); drawStatic();
    if (!keepStep) step = 0;
    enterStep(Math.min(step, steps.length - 1), true);
  }
  function parseSeq(s) { const v = s.split(/[,\s]+/).map(Number).filter(n => Number.isFinite(n)); return v.length >= 3 ? v.slice(0, 24) : null; }

  // ---------------- wiring
  $('next').addEventListener('click', e => { e.stopPropagation(); next(); });
  $('prev').addEventListener('click', e => { e.stopPropagation(); prev(); });
  $('one').addEventListener('click', e => { e.stopPropagation(); oneSample(); });
  $('restart').addEventListener('click', e => { e.stopPropagation(); enterStep(step); });
  $('play').addEventListener('click', e => { e.stopPropagation(); if (playing) stopPlay(); else if (done()) { if (steps[step].lanes.length) enterStep(step); else next(); } else startPlay(); });
  $('slide').addEventListener('click', e => { if (e.target.closest('.notes')) return; next(); });
  document.addEventListener('keydown', e => {
    if (['SELECT', 'INPUT'].includes(e.target.tagName)) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
    else if (e.key === ' ') { e.preventDefault(); $('play').click(); }
    else if (e.key === '.') oneSample();
    else if (e.key === 'r' || e.key === 'R') enterStep(step);
  });
  $('win').addEventListener('change', e => { w = parseInt(e.target.value, 10); rebuild(); });
  $('reset').addEventListener('click', e => { e.stopPropagation(); w = 3; alphaMode = '0.2'; speed = 1.6; $('win').value = '3'; $('alpha').value = '0.2'; $('speed').value = '1.6'; $('seq').value = '2, 4, 6, 8, 10, 8, 6, 4, 2, 20, 2, 4, 6, 8, 10'; $('preset').value = $('seq').value; X = parseSeq($('seq').value); rebuild(); });
  $('alpha').addEventListener('change', e => { alphaMode = e.target.value; rebuild(); });
  $('speed').addEventListener('change', e => { speed = parseFloat(e.target.value); });
  $('seq').addEventListener('change', e => { const v = parseSeq(e.target.value); if (v) { X = v; $('preset').value = 'custom'; rebuild(); } });
  $('preset').addEventListener('change', e => { if (e.target.value === 'custom') { $('seq').focus(); return; } $('seq').value = e.target.value; X = parseSeq(e.target.value); rebuild(); });

  X = parseSeq($('seq').value);
  const h = parseInt((location.hash || '').replace('#', ''), 10);
  if (h >= 1 && h <= 5) step = h - 1;
  rebuild(true);
})();
</script>

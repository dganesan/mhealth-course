<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Denoising an ECG recording</title>
</head>
<body>
<style>
  :root {
    color-scheme: light;
    --paper: #ffffff;
    --ink: #222222;
    --ink-2: #666666;
    --ink-3: #9a9a9a;
    --rule: #dcdcdc;
    --grid: #ececec;
    --raw: #8f8f8f;
    --raw-dot: #8c8c8c;
    --clean: #444444;
    --ma: #2a78d6;
    --sig: #2a78d6;
    --noise: #eb6834;
    --hp: #1baf7a;
    --notch: #4a3aa7;
    --lp: #c2338f;
    --sans: "Helvetica Neue", Helvetica, -apple-system, Arial, sans-serif;
    --mono: Menlo, "SF Mono", Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--sans); font-size: 15px; line-height: 1.4;
    padding-block: 10px 10px; padding-inline: 14px; -webkit-font-smoothing: antialiased;
  }
  .stage { max-width: 1880px; margin: 0 auto; display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 10px; height: calc(100vh - 20px); }
  .slide {
    background: var(--paper); border: 1px solid var(--rule); border-radius: 6px;
    padding: 16px 30px 8px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 6px;
    min-height: 0; position: relative; outline: none; cursor: pointer; user-select: none;
  }
  .slide:focus-visible { box-shadow: 0 0 0 3px rgba(42,120,214,.35); }
  .head h1 { margin: 0; font-size: clamp(24px, 2.4vw, 36px); font-weight: 700; letter-spacing: -0.01em; line-height: 1.15; }
  .head h1 .tag { display: inline-block; font-family: var(--mono); font-weight: 400; font-size: 0.6em; color: var(--ink-2); margin-left: 10px; vertical-align: middle; background: #f4f4f4; padding: 2px 8px; border-radius: 4px; white-space: nowrap; }
  .head p { margin: 6px 0 0; color: #444; font-size: clamp(18px, 1.7vw, 24px); max-width: none; }
  .head p:empty { display: none; }
  .code { margin: 8px 0 0; font-family: var(--mono); font-size: clamp(15px, 1.4vw, 21px); color: var(--ink); background: #f4f6f9; border: 1px solid var(--rule); border-radius: 5px; padding: 6px 12px; white-space: pre; overflow-x: auto; }
  .code[hidden] { display: none; }
  .code .p { color: var(--ma); font-weight: 700; }
  .code .k { color: var(--ink-2); }

  .chart-wrap { position: relative; min-height: 0; height: 100%; display: flex; justify-content: center; align-items: center; }
  svg.chart { display: block; height: 100%; width: auto; max-width: 100%; max-height: 100%; overflow: visible; }
  .tt {
    position: absolute; pointer-events: none; display: none; background: #fff; border: 1px solid var(--rule); border-radius: 4px;
    padding: 6px 9px; font-family: var(--mono); font-size: 12px; color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,.08); white-space: nowrap; z-index: 2;
  }
  .tt .row { display: flex; gap: 12px; justify-content: space-between; }
  .tt .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

  .foot { position: absolute; top: 9px; right: 16px; display: flex; gap: 14px; align-items: baseline; font-size: 14px; color: var(--ink-3); padding: 0; pointer-events: none; }
  .foot .ctr { font-family: var(--mono); }

  .bar { display:flex; flex-direction:column; gap:12px; padding:12px 24px;
         border:1px solid var(--rule); border-radius:6px; background:#f6f7f9; font-size:19px; color:var(--ink); }
  .bar .row { display:flex; justify-content:flex-start; align-items:center; gap:16px 32px; flex-wrap:wrap; }
  .bar .row.dials .group { flex:1 1 0; }
  .bar .row.dials input[type=range] { flex:1 1 auto; width:auto; }
  .group { display:flex; align-items:center; gap:10px; }
  .group label { font-size:18px; font-weight:700; color:var(--ink); letter-spacing:0; text-transform:none; white-space:nowrap; }
  .val { font-family:var(--mono); font-size:19px; font-weight:700; color:var(--ma); min-width:5ch; white-space:nowrap; }
  button, select { font:inherit; font-size:18px; color:var(--ink); background:#fff; border:1px solid #9a9a9a;
                   border-radius:6px; padding:9px 16px; cursor:pointer; }
  button:hover, select:hover { border-color:var(--ink); }
  button.primary { background:var(--ma); color:#fff; border-color:var(--ma); min-width:88px; font-weight:700; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline:2px solid var(--ma); outline-offset:2px; }
  input[type=range] { -webkit-appearance:none; appearance:none; accent-color:var(--ma); width:260px; height:36px; background:transparent; cursor:pointer; }
  input[type=range]::-webkit-slider-runnable-track { height:8px; border-radius:4px; background:#c9d1dc; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:26px; height:26px; border-radius:50%; background:var(--ma); border:3px solid #fff; box-shadow:0 0 0 1.5px var(--ma); margin-top:-9px; }
  input[type=range]::-moz-range-track { height:8px; border-radius:4px; background:#c9d1dc; }
  input[type=range]::-moz-range-thumb { width:26px; height:26px; border-radius:50%; background:var(--ma); border:3px solid #fff; }
  input[type=range].narrow { width: 260px; }
  .hint { margin-left:auto; color:var(--ink-2); font-size:12px; }
  .hint kbd { font-family: var(--mono); background: #fff; border: 1px solid var(--rule); border-radius: 3px; padding: 0 5px; font-size: 11px; }

  .grid line { stroke: var(--grid); stroke-width: 1; }
  .axis line, .axis path { stroke: var(--ink-2); stroke-width: 1; fill: none; }
  .axis text { font-family: var(--mono); font-size: 20px; fill: var(--ink-2); }
  .ptitle { font-family: var(--sans); font-size: 21px; fill: var(--ink); font-weight: 700; }
  .axis-title { font-family: var(--sans); font-size: 22px; fill: var(--ink-2); }
  .raw-line { fill: none; stroke: var(--raw); stroke-width: 2; }
  .raw-line.faint { stroke-width: 1.6; opacity: .55; }
  .out-line { fill: none; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
  .out-line.faint { stroke-width: 1.8; opacity: .45; }
  .spec-line { fill: none; stroke: var(--sig); stroke-width: 2; stroke-linejoin: round; }
  .spec-line.faint { stroke: var(--raw); stroke-width: 1.6; opacity: .6; }
  .gain-line { fill: none; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
  .band { fill: url(#hatch); }
  .band-edge { stroke: #555; stroke-width: 1; stroke-dasharray: 3 3; }
  .band-label { font-family: var(--sans); font-size: 20px; font-weight: 700; fill: var(--noise); paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
  .band-label.sig { fill: var(--sig); }
  .band-label.muted { fill: var(--ink-2); font-weight: 400; }
  .bracket { stroke: var(--sig); stroke-width: 2; fill: none; }
  .dot { stroke: #fff; stroke-width: 1.4; }
  .peak { fill: var(--ma); stroke: #fff; stroke-width: 2; }
  .legend rect.bg { fill: #fff; fill-opacity: .9; stroke: var(--rule); }
  .legend text { font-family: var(--sans); font-size: 24px; fill: var(--ink); }
  .legend line { stroke-width: 4; }
  .stages rect.bg { fill: #fff; fill-opacity: .9; stroke: var(--rule); }
  .stages text { font-family: var(--mono); font-size: 20px; fill: var(--ink); }
  .stages text.off { fill: var(--ink-3); }
  .stages line { stroke-width: 4; }
  .anno { font-family: var(--mono); font-size: 19px; fill: var(--ink); }
  .anno.muted { fill: var(--ink-3); }
  .crosshair { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 2 2; }

  @media (max-width: 720px) {
    .slide { padding: 18px 16px 12px; min-height: 0; }
    .hint { display: none; }
    input[type=range], input[type=range].narrow { width: 120px; }
  }
  .hint { display:none !important; }
  button.tb { min-width:54px; padding:9px 12px; font-size:22px; line-height:1; }
  button.primary.tb { min-width:64px; }
</style>

<div class="stage">
  <section class="slide" id="slide" tabindex="0" aria-live="polite">
    <div class="head">
      <h1 id="title"></h1>
      <p id="subtitle"></p>
      <pre class="code" id="code" hidden></pre>
    </div>
    <div class="chart-wrap">
      <svg class="chart" id="chart" viewBox="0 0 1584 740" role="img" aria-label="ECG time trace, its spectrum, the filter gains and the filtered ECG"></svg>
      <div class="tt" id="tt"></div>
    </div>
    <div class="foot">
      <span>CS328 &nbsp;·&nbsp; Sensor Data Smoothing and Filtering</span>
      <span class="ctr" id="counter"></span>
    </div>
  </section>

  <div class="bar">
   <div class="row">
    <div class="group">
      <button id="prev" class="tb" title="Previous step (←)">⏮</button>
      <button id="play" class="primary tb" title="Play / pause (space)">▶</button>
      <button id="next" class="tb" title="Next step (→)">⏭</button>
      <button id="restart" class="tb" title="Restart this step (r)">↺</button>
      <button id="reset" title="Clear your dial changes and use the presets">Reset dials</button>
    </div>
    <div class="group">
      <label for="speed">Speed</label>
      <select id="speed">
        <option value="4">very slow</option>
        <option value="2">slow</option>
        <option value="1" selected>normal</option>
        <option value="0.4">fast</option>
        <option value="0">instant</option>
      </select>
    </div>
   </div>
   <div class="row dials">
    <div class="group">
      <label for="hp">High-pass cutoff</label>
      <input type="range" id="hp" class="narrow" min="0.1" max="2" step="0.1" value="0.5">
      <span class="val" id="hpval">0.5 Hz</span>
    </div>
    <div class="group">
      <label for="nc">Notch centre</label>
      <input type="range" id="nc" class="narrow" min="45" max="65" step="1" value="50">
      <span class="val" id="ncval">50 Hz</span>
    </div>
    <div class="group">
      <label for="lp">Low-pass cutoff</label>
      <input type="range" id="lp" class="narrow" min="20" max="150" step="5" value="40">
      <span class="val" id="lpval">40 Hz</span>
    </div>
   </div>
  </div>
</div>

<script>
// Butterworth IIR design + filtering, mirroring scipy.signal.butter / lfilter / filtfilt.
// Design path: analog Butterworth prototype (zpk) -> lp2lp / lp2hp / lp2bp / lp2bs -> bilinear -> SOS.
// Usage:
//   const sos = butter(4, 100, 1000, 'lowpass');            // cutoff Hz, fs Hz
//   const sos = butter(4, [58, 62], 1000, 'bandstop');
//   const y = sosfilt(sos, x);                              // causal (lfilter)
//   const y = sosfiltfilt(sos, x);                          // zero-phase (filtfilt)
//   const mag = sosFreqz(sos, fHz, fs);                     // |H| at one frequency
(function (global) {
  // ---- minimal complex arithmetic
  const C = (re, im = 0) => ({ re, im });
  const cadd = (a, b) => C(a.re + b.re, a.im + b.im);
  const csub = (a, b) => C(a.re - b.re, a.im - b.im);
  const cmul = (a, b) => C(a.re * b.re - a.im * b.im, a.re * b.im + a.im * b.re);
  const cdiv = (a, b) => { const d = b.re * b.re + b.im * b.im; return C((a.re * b.re + a.im * b.im) / d, (a.im * b.re - a.re * b.im) / d); };
  const csqrt = a => { const r = Math.hypot(a.re, a.im); const re = Math.sqrt(Math.max(0, (r + a.re) / 2)); const im = Math.sign(a.im || 1) * Math.sqrt(Math.max(0, (r - a.re) / 2)); return C(re, im); };
  const cscale = (a, s) => C(a.re * s, a.im * s);

  function buttap(N) { // analog prototype poles, unit cutoff
    const p = [];
    for (let k = 1; k <= N; k++) { const th = Math.PI * (2 * k - 1) / (2 * N); p.push(C(-Math.sin(th), Math.cos(th))); }
    return { z: [], p, k: 1 };
  }
  function lp2lp(zpk, wo) { return { z: zpk.z.map(v => cscale(v, wo)), p: zpk.p.map(v => cscale(v, wo)), k: zpk.k * Math.pow(wo, zpk.p.length - zpk.z.length) }; }
  function lp2hp(zpk, wo) {
    const z = zpk.z.map(v => cdiv(C(wo), v)), p = zpk.p.map(v => cdiv(C(wo), v));
    const deg = zpk.p.length - zpk.z.length;
    for (let i = 0; i < deg; i++) z.push(C(0));
    let num = C(1), den = C(1);
    zpk.z.forEach(v => { num = cmul(num, cscale(v, -1)); });
    zpk.p.forEach(v => { den = cmul(den, cscale(v, -1)); });
    const kk = cdiv(num, den);
    return { z, p, k: zpk.k * kk.re };
  }
  function lp2bp(zpk, wo, bw) {
    const deg = zpk.p.length - zpk.z.length;
    const tr = v => { const s = cscale(v, bw / 2); const r = csqrt(csub(cmul(s, s), C(wo * wo))); return [cadd(s, r), csub(s, r)]; };
    const z = [], p = [];
    zpk.z.forEach(v => z.push(...tr(v)));
    zpk.p.forEach(v => p.push(...tr(v)));
    for (let i = 0; i < deg; i++) z.push(C(0));
    return { z, p, k: zpk.k * Math.pow(bw, deg) };
  }
  function lp2bs(zpk, wo, bw) {
    const deg = zpk.p.length - zpk.z.length;
    const tr = v => { const s = cdiv(C(bw / 2), v); const r = csqrt(csub(cmul(s, s), C(wo * wo))); return [cadd(s, r), csub(s, r)]; };
    const z = [], p = [];
    zpk.z.forEach(v => z.push(...tr(v)));
    zpk.p.forEach(v => p.push(...tr(v)));
    for (let i = 0; i < deg; i++) { z.push(C(0, wo)); z.push(C(0, -wo)); }
    let num = C(1), den = C(1);
    zpk.z.forEach(v => { num = cmul(num, cscale(v, -1)); });
    zpk.p.forEach(v => { den = cmul(den, cscale(v, -1)); });
    const kk = cdiv(num, den);
    return { z, p, k: zpk.k * kk.re };
  }
  function bilinear(zpk, fs) {
    const fs2 = 2 * fs;
    const deg = zpk.p.length - zpk.z.length;
    const tr = v => cdiv(cadd(C(fs2), v), csub(C(fs2), v));
    const z = zpk.z.map(tr), p = zpk.p.map(tr);
    for (let i = 0; i < deg; i++) z.push(C(-1));
    let num = C(1), den = C(1);
    zpk.z.forEach(v => { num = cmul(num, csub(C(fs2), v)); });
    zpk.p.forEach(v => { den = cmul(den, csub(C(fs2), v)); });
    const kk = cdiv(num, den);
    return { z, p, k: zpk.k * kk.re };
  }
  // pair conjugates -> second-order sections [b0,b1,b2,a0,a1,a2]
  function zpk2sos(zpk) {
    const pairUp = arr => {
      const rest = arr.slice(); const pairs = [];
      while (rest.length) {
        const a = rest.shift();
        if (Math.abs(a.im) < 1e-9) { // real: pair with the nearest real
          let j = rest.findIndex(v => Math.abs(v.im) < 1e-9);
          if (j >= 0) { pairs.push([a, rest.splice(j, 1)[0]]); } else pairs.push([a]);
        } else {
          let j = rest.findIndex(v => Math.abs(v.re - a.re) < 1e-7 && Math.abs(v.im + a.im) < 1e-7);
          if (j >= 0) { pairs.push([a, rest.splice(j, 1)[0]]); } else pairs.push([a, C(a.re, -a.im)]);
        }
      }
      return pairs;
    };
    const poly = pr => { // (x - r1)(x - r2) -> real coefficients [1, c1, c2]
      if (pr.length === 1) return [1, -pr[0].re, 0];
      const s = cadd(pr[0], pr[1]), m = cmul(pr[0], pr[1]);
      return [1, -s.re, m.re];
    };
    // sort poles by closeness to the unit circle so each section pairs zeros nearby (stability of cascade)
    const P = zpk.p.slice().sort((a, b) => Math.hypot(b.re, b.im) - Math.hypot(a.re, a.im));
    const Z = zpk.z.slice();
    const pp = pairUp(P);
    const sos = [];
    pp.forEach((pair, idx) => {
      // choose the zero(s) nearest this pole pair
      const zs = [];
      for (let n = 0; n < pair.length && Z.length; n++) {
        let best = 0, bd = Infinity;
        Z.forEach((v, j) => { const d = Math.hypot(v.re - pair[0].re, Math.abs(v.im) - Math.abs(pair[0].im)); if (d < bd) { bd = d; best = j; } });
        const zz = Z.splice(best, 1)[0];
        zs.push(zz);
        if (Math.abs(zz.im) > 1e-9) { // also remove its conjugate
          const cj = Z.findIndex(v => Math.abs(v.re - zz.re) < 1e-7 && Math.abs(v.im + zz.im) < 1e-7);
          if (cj >= 0) { zs.push(Z.splice(cj, 1)[0]); n++; }
        }
      }
      const b = zs.length ? poly(zs) : [1, 0, 0];
      const a = poly(pair);
      const g = idx === 0 ? zpk.k : 1;
      sos.push([b[0] * g, b[1] * g, b[2] * g, a[0], a[1], a[2]]);
    });
    return sos;
  }

  function butter(N, cutoffHz, fs, btype = 'lowpass') {
    const warp = f => 2 * fs * Math.tan(Math.PI * f / fs);
    let zpk = buttap(N);
    if (btype === 'lowpass') zpk = lp2lp(zpk, warp(cutoffHz));
    else if (btype === 'highpass') zpk = lp2hp(zpk, warp(cutoffHz));
    else {
      const w1 = warp(cutoffHz[0]), w2 = warp(cutoffHz[1]);
      const bw = w2 - w1, wo = Math.sqrt(w1 * w2);
      zpk = btype === 'bandpass' ? lp2bp(zpk, wo, bw) : lp2bs(zpk, wo, bw);
    }
    return zpk2sos(bilinear(zpk, fs));
  }

  function sosfilt(sos, x, zi) { // direct form II transposed, per section
    let y = Float64Array.from(x);
    const st = zi || sos.map(() => [0, 0]);
    sos.forEach(([b0, b1, b2, a0, a1, a2], s) => {
      const z = st[s]; const out = new Float64Array(y.length);
      for (let n = 0; n < y.length; n++) {
        const xn = y[n];
        const yn = b0 * xn + z[0];
        z[0] = b1 * xn - a1 * yn + z[1];
        z[1] = b2 * xn - a2 * yn;
        out[n] = yn;
      }
      y = out;
    });
    return y;
  }
  // steady-state initial conditions for a step of amplitude 1 (like scipy sosfilt_zi)
  function sosfiltZi(sos) {
    let scale = 1;
    return sos.map(([b0, b1, b2, a0, a1, a2]) => {
      // solve for zi such that output is constant for constant input (scale)
      const g = (b0 + b1 + b2) / (1 + a1 + a2); // dc gain of this section
      const z0 = scale * ((b1 - a1 * b0) + (b2 - a2 * b0)) / (1 + a1 + a2) * 1; // approx via steady state
      // exact: z1 = scale*(b2 - a2*b0)... use the standard linear solve
      // Steady state: y = g*scale; z0 = y - b0*scale; z1 = z0 - (b1*scale - a1*y)
      const y = g * scale;
      const zz0 = y - b0 * scale;
      const zz1 = zz0 - (b1 * scale - a1 * y);
      scale = y;
      return [zz0, zz1];
    });
  }
  function sosfiltfilt(sos, x) {
    const n = x.length;
    const pad = Math.min(n - 1, 3 * 3 * sos.length); // ~ 3 * (order) samples (scipy: 3*max(len(a),len(b)))
    // odd extension
    const ext = new Float64Array(n + 2 * pad);
    for (let i = 0; i < pad; i++) ext[i] = 2 * x[0] - x[pad - i];
    for (let i = 0; i < n; i++) ext[pad + i] = x[i];
    for (let i = 0; i < pad; i++) ext[pad + n + i] = 2 * x[n - 1] - x[n - 2 - i];
    const zi = sosfiltZi(sos);
    let y = sosfilt(sos, ext, zi.map(z => [z[0] * ext[0], z[1] * ext[0]]));
    y.reverse();
    y = sosfilt(sos, y, zi.map(z => [z[0] * y[0], z[1] * y[0]]));
    y.reverse();
    return y.slice(pad, pad + n);
  }
  function sosFreqz(sos, fHz, fs) { // magnitude response at a frequency (Hz)
    const w = 2 * Math.PI * fHz / fs;
    const e1 = C(Math.cos(-w), Math.sin(-w)), e2 = C(Math.cos(-2 * w), Math.sin(-2 * w));
    let H = C(1);
    sos.forEach(([b0, b1, b2, a0, a1, a2]) => {
      const num = cadd(C(b0), cadd(cscale(e1, b1), cscale(e2, b2)));
      const den = cadd(C(a0), cadd(cscale(e1, a1), cscale(e2, a2)));
      H = cmul(H, cdiv(num, den));
    });
    return Math.hypot(H.re, H.im);
  }
  function sosPhase(sos, fHz, fs) {
    const w = 2 * Math.PI * fHz / fs;
    const e1 = C(Math.cos(-w), Math.sin(-w)), e2 = C(Math.cos(-2 * w), Math.sin(-2 * w));
    let H = C(1);
    sos.forEach(([b0, b1, b2, a0, a1, a2]) => {
      const num = cadd(C(b0), cadd(cscale(e1, b1), cscale(e2, b2)));
      const den = cadd(C(a0), cadd(cscale(e1, a1), cscale(e2, a2)));
      H = cmul(H, cdiv(num, den));
    });
    return Math.atan2(H.im, H.re);
  }

  // ---- real FFT magnitude (radix-2, zero-padded), returns {f, mag} one-sided, mag scaled 2/N
  function rfftMag(x, fs) {

  const TIME_FULL = { y0: 40, y1: 690 }, TIME_TOP = { y0: 40, y1: 312 }, SPEC = { y0: 398, y1: 690 };
  const YLO = -100, YHI = 500, SPEC_MAX = 15;
  const svgNS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs = {}, parent) => { const n = document.createElementNS(svgNS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; };
  const timeP = () => (step === 0 ? TIME_FULL : TIME_TOP);
  const tx = i => X0 + (i / (N - 1)) * (X1 - X0);
  const ty = v => { const Pn = timeP(); return Pn.y1 - ((v - YLO) / (YHI - YLO)) * (Pn.y1 - Pn.y0); };
  const fx = f => X0 + (f / FMAX) * (X1 - X0);
  const fy = m => SPEC.y1 - (Math.min(m, SPEC_MAX) / SPEC_MAX) * (SPEC.y1 - SPEC.y0);
  const gy = g => SPEC.y1 - g * (SPEC.y1 - SPEC.y0);
  const fmt1 = v => v.toFixed(1);

  // noise bands on the spectrum (Hz)
  const BANDS = [
    { lo: 0, hi: 0.5, label: 'baseline drift, below 0.5 Hz' },
    { lo: 48, hi: 52, label: '50 Hz powerline noise' },
    { lo: 60, hi: FMAX, label: 'high-frequency noise, above 60 Hz (small)' },
  ];
  const bands = () => BANDS;

  // ------------------------------------------------------------ state
  const $ = id => document.getElementById(id);
  const chart = $('chart');
  let step = 0, progress = 0, playing = false, raf = 0, lastT = 0;
  let mult = parseFloat($('speed').value);
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let G = {};

  // ------------------------------------------------------------ static frame
  function drawFrame() {
    chart.innerHTML = '';
    const defs = el('defs', {}, chart);
    const pat = el('pattern', { id: 'hatch', width: 8, height: 8, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' }, defs);
    el('rect', { width: 8, height: 8, fill: 'rgba(235,104,52,0.10)' }, pat);
    el('line', { x1: 0, y1: 0, x2: 0, y2: 8, stroke: 'rgba(235,104,52,0.45)', 'stroke-width': 1.2 }, pat);

    // time panel
    const T = timeP();
    const grid = el('g', { class: 'grid' }, chart), axis = el('g', { class: 'axis' }, chart);
    el('text', { x: X0, y: T.y0 - 12, class: 'ptitle' }, chart).textContent = 'time domain';
    for (let v = YLO; v <= YHI; v += 100) {
      el('line', { x1: X0, x2: X1, y1: ty(v), y2: ty(v) }, grid);
      el('text', { x: X0 - 8, y: ty(v) + 6, 'text-anchor': 'end' }, axis).textContent = v;
    }
    for (let s = 0; s <= DUR; s += 1) {
      const x = tx(s * FS);
      el('line', { x1: x, x2: x, y1: T.y0, y2: T.y1 }, grid);
      el('text', { x, y: T.y1 + 22, 'text-anchor': 'middle' }, axis).textContent = s;
    }
    el('path', { d: `M${X0},${T.y0}V${T.y1}H${X1}` }, axis);
    el('text', { x: X1, y: T.y1 + 46, class: 'axis-title', 'text-anchor': 'end' }, chart).textContent = 'time (s)';
    el('text', { class: 'axis-title', 'text-anchor': 'middle', transform: `translate(${X0 - 62}, ${(T.y0 + T.y1) / 2}) rotate(-90)` }, chart).textContent = 'ADC counts';

    // spectrum panel (from step 2 on)
    if (step >= 1) {
      const S = SPEC;
      el('text', { x: X0, y: S.y0 - 12, class: 'ptitle' }, chart).textContent = 'frequency domain (FFT)';
      for (let v = 0; v <= SPEC_MAX; v += 5) {
        el('line', { x1: X0, x2: X1, y1: fy(v), y2: fy(v) }, grid);
        el('text', { x: X0 - 8, y: fy(v) + 6, 'text-anchor': 'end' }, axis).textContent = v;
      }
      for (let f = 0; f <= FMAX; f += 10) {
        el('line', { x1: fx(f), x2: fx(f), y1: S.y0, y2: S.y1 }, grid);
        el('text', { x: fx(f), y: S.y1 + 22, 'text-anchor': 'middle' }, axis).textContent = f;
      }
      el('path', { d: `M${X0},${S.y0}V${S.y1}H${X1}` }, axis);
      el('text', { x: X1, y: S.y1 + 46, class: 'axis-title', 'text-anchor': 'end' }, chart).textContent = 'frequency (Hz)';
      el('text', { class: 'axis-title', 'text-anchor': 'middle', transform: `translate(${X0 - 62}, ${(S.y0 + S.y1) / 2}) rotate(-90)` }, chart).textContent = '|X(f)|';
      if (step === 2) { // gain axis on the right for |H(f)|
        const ga = el('g', { class: 'axis' }, chart);
        el('path', { d: `M${X1},${S.y0}V${S.y1}` }, ga);
        [0, 0.5, 1].forEach(g => { el('line', { x1: X1, x2: X1 + 6, y1: gy(g), y2: gy(g) }, ga); el('text', { x: X1 + 10, y: gy(g) + 6 }, ga).textContent = g; });
        el('text', { class: 'axis-title', 'text-anchor': 'middle', transform: `translate(${X1 + 72}, ${(S.y0 + S.y1) / 2}) rotate(-90)` }, chart).textContent = 'gain |H(f)|';
      }
    }
    G.bands = el('g', {}, chart);
    G.spec = el('g', {}, chart);
    G.gains = el('g', {}, chart);
    G.labels = el('g', {}, chart);
    G.time = el('g', {}, chart);
    G.anno = el('g', {}, chart);
    G.stages = el('g', { class: 'stages' }, chart);
    G.legTime = el('g', { class: 'legend' }, chart);
    G.legSpec = el('g', { class: 'legend' }, chart);
    G.hover = el('g', {}, chart);
    el('rect', { x: X0, y: T.y0, width: X1 - X0, height: T.y1 - T.y0, fill: 'transparent', 'data-panel': 'time' }, chart);
    if (step >= 1) el('rect', { x: X0, y: SPEC.y0, width: X1 - X0, height: SPEC.y1 - SPEC.y0, fill: 'transparent', 'data-panel': 'spec' }, chart);
  }

  // conventional legend at the top right of a panel, drawn at step entry
  function drawLegend(g, y0, items) {
    g.innerHTML = '';
    const rowH = 34, wBox = Math.max(...items.map(i => i.name.length)) * 11.8 + 68, hBox = 14 + items.length * rowH;
    const x = X1 - wBox - 12, y = y0 + 10;
    el('rect', { class: 'bg', x, y, width: wBox, height: hBox, rx: 4 }, g);
    items.forEach((it, i) => {
      const cy = y + 21 + i * rowH;
      if (it.kind === 'hatch') el('rect', { x: x + 10, y: cy - 8, width: 16, height: 14, fill: 'url(#hatch)', stroke: 'var(--noise)', 'stroke-width': .6 }, g);
      else if (it.kind === 'dot') el('circle', { class: 'peak', cx: x + 18, cy: cy - 1, r: 6 }, g);
      else { const ln = el('line', { x1: x + 10, x2: x + 26, y1: cy - 1, y2: cy - 1, stroke: it.color }, g); if (it.faint) ln.setAttribute('opacity', '.6'); }
      el('text', { x: x + 38, y: cy + 8 }, g).textContent = it.name;
    });
    return hBox + 10;
  }
  // legend as one row on the panel-title row, right-aligned to xRight
  function drawLegendRow(g, xRight, y, items) {
    g.innerHTML = '';
    const gap = 30, sw = 18;
    const widths = items.map(it => sw + 10 + it.name.length * 11.8);
    let x = xRight - widths.reduce((a, b) => a + b, 0) - gap * (items.length - 1);
    items.forEach((it, i) => {
      if (it.kind === 'dot') el('circle', { class: 'peak', cx: x + sw / 2, cy: y - 8, r: 6 }, g);
      else { const ln = el('line', { x1: x, x2: x + sw, y1: y - 8, y2: y - 8, stroke: it.color }, g); if (it.faint) ln.setAttribute('opacity', '.6'); }
      el('text', { x: x + sw + 10, y }, g).textContent = it.name;
      x += widths[i] + gap;
    });
  }
  function refreshLegends() {
    const T = timeP();
    const timeItems = step < STAGE ? [{ name: 'raw ECG', color: 'var(--raw)' }]
      : step === STAGE ? [{ name: 'raw ECG', color: 'var(--raw)', faint: true }, { name: 'after this stage', color: STAGES[phaseOf(progress)].color }]
      : [{ name: 'raw ECG', color: 'var(--raw)', faint: true }, { name: 'filtered ECG', color: 'var(--ma)' }, { name: 'R peaks (find_peaks)', kind: 'dot' }];
    drawLegendRow(G.legTime, step === STAGE ? X1 - 360 : step === RESULT ? X1 - 230 : X1, T.y0 - 12, timeItems);
    G.legSpec.innerHTML = ''; G.legH = 0;
    if (step === 1 || step === 2) G.legH = drawLegend(G.legSpec, SPEC.y0, [{ name: 'spectrum of the raw ECG', color: 'var(--sig)' }, { name: 'noise bands', kind: 'hatch' }]);
    if (step === STAGE) G.legH = drawLegend(G.legSpec, SPEC.y0, [{ name: 'raw ECG', color: 'var(--raw)', faint: true }, { name: 'after this stage', color: 'var(--sig)' }, { name: 'noise bands', kind: 'hatch' }]);
    if (step === RESULT) G.legH = drawLegend(G.legSpec, SPEC.y0, [{ name: 'raw ECG', color: 'var(--raw)', faint: true }, { name: 'filtered ECG', color: 'var(--sig)' }, { name: 'noise bands', kind: 'hatch' }]);
  }
  // stage list (Menlo) under the spectrum legend; entries light up as their gain is drawn
  function drawStages(lit) {
    G.stages.innerHTML = '';
    if (step < 2) return;
    const rowH = 30, wBox = 300, hBox = 14 + STAGES.length * rowH;
    const x = X1 - wBox - 12, y = SPEC.y0 + 10 + G.legH + 6;
    el('rect', { class: 'bg', x, y, width: wBox, height: hBox, rx: 4 }, G.stages);
    STAGES.forEach((s, i) => {
      const on = i < lit, cy = y + 20 + i * rowH;
      el('line', { x1: x + 10, x2: x + 30, y1: cy - 1, y2: cy - 1, stroke: on ? s.color : 'var(--rule)' }, G.stages);
      el('text', { x: x + 42, y: cy + 6, class: on ? '' : 'off' }, G.stages).textContent = `${i + 1}  ${s.name.padEnd(9)} ${s.cut()}`;
    });
  }

  // ------------------------------------------------------------ dynamic drawing
  function timePath(arr, upto) {
    let d = ''; const n = Math.min(N, upto);
    for (let i = 0; i < n; i++) d += (i ? 'L' : 'M') + tx(i).toFixed(1) + ',' + ty(arr[i]).toFixed(1);
    return d;
  }
  function specPath(sp, kUp) {
    let d = ''; const n = Math.min(KMAX, kUp);
    for (let k = 0; k <= n; k++) d += (k ? 'L' : 'M') + fx(sp.f[k]).toFixed(1) + ',' + fy(sp.mag[k]).toFixed(1);
    return d;
  }
  function gainPath(g, cUp) {
    let d = ''; const n = Math.min(COLS, cUp);
    for (let c = 0; c <= n; c++) d += (c ? 'L' : 'M') + (X0 + c / COLS * (X1 - X0)).toFixed(1) + ',' + gy(g[c]).toFixed(1);
    return d;
  }
  // hatched noise bands, each appearing once the sweep frequency reaches its low edge; labels optional
  function drawBands(sweepHz, withLabels) {
    G.bands.innerHTML = ''; G.labels.innerHTML = '';
    bands().forEach((b, i) => {
      if (sweepHz < b.lo) return;
      const hi = Math.min(b.hi, sweepHz);
      el('rect', { class: 'band', x: fx(b.lo), y: SPEC.y0, width: Math.max(2, fx(hi) - fx(b.lo)), height: SPEC.y1 - SPEC.y0 }, G.bands);
      if (b.lo > 0) el('line', { class: 'band-edge', x1: fx(b.lo), x2: fx(b.lo), y1: SPEC.y0, y2: SPEC.y1 }, G.bands);
      if (b.hi < FMAX && sweepHz >= b.hi) el('line', { class: 'band-edge', x1: fx(b.hi), x2: fx(b.hi), y1: SPEC.y0, y2: SPEC.y1 }, G.bands);
      if (!withLabels) return;
      if (i === 0) el('text', { class: 'band-label', x: fx(b.hi) + 10, y: SPEC.y0 + 80 }, G.labels).textContent = b.label;
      else if (i === 1) { // beside the line, at its half height
        const k = Math.round(50 / SPEC_RAW.binHz); let m = 0; for (let j = k - 8; j <= k + 8; j++) m = Math.max(m, SPEC_RAW.mag[j]);
        el('text', { class: 'band-label', x: fx(b.hi) + 48, y: fy(m) - 6 }, G.labels).textContent = b.label;
      }
      else el('text', { class: 'band-label muted', x: fx(b.lo) + 10, y: SPEC.y1 - 64 }, G.labels).textContent = b.label;
    });
    if (withLabels && sweepHz >= 40) { // the signal band: a bracket along the top with its label under it
      const y = SPEC.y0 + 18;
      el('path', { class: 'bracket', d: `M${fx(0.5)},${y + 8}V${y}H${fx(40)}V${y + 8}` }, G.labels);
      el('text', { class: 'band-label sig', x: fx(20), y: y + 28, 'text-anchor': 'middle' }, G.labels).textContent = 'ECG, 0.5–40 Hz';
    }
  }

  function render() {
    const d = STEPS[step], p = progress;
    G.time.innerHTML = ''; G.spec.innerHTML = ''; G.gains.innerHTML = ''; G.anno.innerHTML = '';
    if (step === 0) {
      const n = Math.max(2, Math.round(p * N));
      el('path', { class: 'raw-line', d: timePath(X, n) }, G.time);
      if (n < N) el('circle', { class: 'dot', cx: tx(n - 1), cy: ty(X[n - 1]), r: 5, fill: 'var(--raw-dot)' }, G.time);
    }
    else if (step === 1) {
      el('path', { class: 'raw-line', d: timePath(X, N) }, G.time);
      const kUp = Math.round(p * KMAX);
      drawBands(p * FMAX, true);
      el('path', { class: 'spec-line', d: specPath(SPEC_RAW, kUp) }, G.spec);
      if (kUp < KMAX) el('line', { class: 'crosshair', x1: fx(p * FMAX), x2: fx(p * FMAX), y1: SPEC.y0, y2: SPEC.y1 }, G.spec);
    }
    else if (step === 2) {
      el('path', { class: 'raw-line', d: timePath(X, N) }, G.time);
      drawBands(FMAX, true);
      el('path', { class: 'spec-line', d: specPath(SPEC_RAW, KMAX) }, G.spec);
      const ph = phaseOf(p), frac = p >= 1 ? 1 : p * 3 - ph;
      STAGES.forEach((s, i) => {
        if (i > ph) return;
        const cUp = i < ph ? COLS : Math.round(frac * COLS);
        if (cUp > 0) el('path', { class: 'gain-line', d: gainPath(F.gains[i], cUp), stroke: s.color }, G.gains);
      });
      drawStages(ph + 1);
    }
    else if (step === STAGE) {
      const ph = phaseOf(p), frac = p >= 1 ? 1 : p * 3 - ph, n = Math.max(2, Math.round(frac * N));
      const T = timeP();
      el('path', { class: 'raw-line faint', d: timePath(X, N) }, G.time);
      if (ph > 0) el('path', { class: 'out-line faint', d: timePath(F.stageY[ph - 1], N), stroke: STAGES[ph - 1].color }, G.time);
      el('path', { class: 'out-line', d: timePath(F.stageY[ph], n), stroke: STAGES[ph].color }, G.time);
      if (n < N) el('circle', { class: 'dot', cx: tx(n - 1), cy: ty(F.stageY[ph][n - 1]), r: 5.5, fill: STAGES[ph].color }, G.time);
      const t = el('text', { x: X1, y: T.y0 - 12, class: 'anno', 'text-anchor': 'end', fill: STAGES[ph].color, 'font-weight': '700' }, G.anno);
      t.textContent = `removes ${['baseline drift', '50 Hz powerline noise', 'high-frequency noise'][ph]}`;
      if (ph !== G.lastPhase) { G.lastPhase = ph; refreshLegends(); }
      drawBands(FMAX, false);
      el('path', { class: 'spec-line faint', d: specPath(SPEC_RAW, KMAX) }, G.spec);
      el('path', { class: 'spec-line', d: specPath(F.stageSpec[ph], KMAX) }, G.spec);
      drawStages(ph + 1);
    }
    else {
      const n = Math.max(2, Math.round(p * N));
      el('path', { class: 'raw-line faint', d: timePath(X, N) }, G.time);
      el('path', { class: 'out-line', d: timePath(F.y, n), stroke: 'var(--ma)' }, G.time);
      if (n < N) el('circle', { class: 'dot', cx: tx(n - 1), cy: ty(F.y[n - 1]), r: 5.5, fill: 'var(--ma)' }, G.time);
      const found = F.peaks.filter(i => i < n);
      found.forEach(i => el('circle', { class: 'peak', cx: tx(i), cy: ty(F.y[i]), r: 7 }, G.time));
      const T = timeP();
      const t = el('text', { x: X1, y: T.y0 - 12, class: 'anno', 'text-anchor': 'end', fill: 'var(--ma)', 'font-weight': '700' }, G.anno);
      t.textContent = `beats found: ${found.length}`;
      drawBands(FMAX, false);
      el('path', { class: 'spec-line faint', d: specPath(SPEC_RAW, KMAX) }, G.spec);
      el('path', { class: 'spec-line', d: specPath(F.spec, Math.round(p * KMAX)) }, G.spec);
      drawStages(STAGES.length);
    }
    $('title').innerHTML = (typeof d.title === 'function' ? d.title() : d.title) + `<span class="tag">${d.tag()}</span>`;
    $('subtitle').textContent = d.subtitle;
    const code = typeof d.code === 'function' ? d.code() : d.code;
    $('code').hidden = !code; $('code').innerHTML = code || '';
  }

  // ------------------------------------------------------------ dials
  function setDials() {
    $('hp').value = hp; $('hpval').textContent = `${fmtHP()} Hz`;
    $('nc').value = nc; $('ncval').textContent = `${nc} Hz`;
    $('lp').value = lp; $('lpval').textContent = `${lp} Hz`;
  }
  function dialChanged() { setDials(); recompute(); refreshLegends(); render(); }

  // ------------------------------------------------------------ step control
  function enterStep(k, completed = false) {
    step = Math.max(0, Math.min(STEPS.length - 1, k));
    stopPlay();
    if (!dirty.hp) hp = PRESET.hp;
    if (!dirty.nc) nc = PRESET.nc;
    if (!dirty.lp) lp = PRESET.lp;
    setDials(); recompute();
    progress = 0;
    drawFrame(); refreshLegends();
    $('counter').textContent = `${step + 1} / ${STEPS.length}`;
    $('prev').disabled = step === 0;
    try { history.replaceState(null, '', '#' + (step + 1)); } catch (_) {}
    if (completed || mult === 0 || reduceMotion) finish(); else { render(); startPlay(); }
  }
  const isDone = () => progress >= 1;
  function finish() { stopPlay(); progress = 1; render(); }
  function tick(t) {
    if (!playing) return;
    const dt = Math.max(0, Math.min(0.1, (t - lastT) / 1000)); lastT = t;
    progress = Math.min(1, progress + dt / (STEPS[step].base * mult));
    render();
    if (isDone()) { finish(); return; }
    raf = requestAnimationFrame(tick);
  }
  function startPlay() { if (isDone()) return; playing = true; lastT = performance.now(); $('play').textContent = '⏸'; raf = requestAnimationFrame(tick); }
  function stopPlay() { playing = false; cancelAnimationFrame(raf); $('play').textContent = '▶'; }
  function next() { if (!isDone()) { finish(); return; } if (step < STEPS.length - 1) enterStep(step + 1); }
  function prev() { if (step > 0) enterStep(step - 1, true); }
  function restart() { enterStep(step); }

  // ------------------------------------------------------------ hover
  const tt = $('tt');
  function hover(evt) {
    const panel = evt.target.getAttribute && evt.target.getAttribute('data-panel');
    if (!panel) { unhover(); return; }
    const pt = chart.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY;
    const q = pt.matrixTransform(chart.getScreenCTM().inverse());
    G.hover.innerHTML = '';
    let html = '';
    if (panel === 'time') {
      const T = timeP();
      const i = Math.max(0, Math.min(N - 1, Math.round((q.x - X0) / (X1 - X0) * (N - 1))));
      el('line', { class: 'crosshair', x1: tx(i), x2: tx(i), y1: T.y0, y2: T.y1 }, G.hover);
      html = `<div class="row"><span>t</span><b>${(i / FS).toFixed(3)} s</b></div>` +
        `<div class="row"><span><i class="sw" style="background:var(--raw)"></i>raw</span><span>${X[i]}</span></div>`;
      if (step === STAGE) html += `<div class="row"><span><i class="sw" style="background:${STAGES[phaseOf(progress)].color}"></i>after stage ${phaseOf(progress) + 1}</span><span>${fmt1(F.stageY[phaseOf(progress)][i])}</span></div>`;
      if (step === RESULT) html += `<div class="row"><span><i class="sw" style="background:var(--ma)"></i>filtered</span><span>${fmt1(F.y[i])}</span></div>`;
    } else {
      const f = Math.max(0, Math.min(FMAX, (q.x - X0) / (X1 - X0) * FMAX));
      const k = Math.max(0, Math.min(KMAX, Math.round(f / SPEC_RAW.binHz)));
      el('line', { class: 'crosshair', x1: fx(f), x2: fx(f), y1: SPEC.y0, y2: SPEC.y1 }, G.hover);
      html = `<div class="row"><span>f</span><b>${f.toFixed(1)} Hz</b></div>` +
        `<div class="row"><span><i class="sw" style="background:${step >= STAGE ? 'var(--raw)' : 'var(--sig)'}"></i>|X(f)| raw</span><span>${SPEC_RAW.mag[k].toFixed(2)}</span></div>`;
      if (step === STAGE) html += `<div class="row"><span><i class="sw" style="background:var(--sig)"></i>|X(f)| after stage ${phaseOf(progress) + 1}</span><span>${F.stageSpec[phaseOf(progress)].mag[k].toFixed(2)}</span></div>`;
      if (step === RESULT) html += `<div class="row"><span><i class="sw" style="background:var(--sig)"></i>|X(f)| filtered</span><span>${F.spec.mag[k].toFixed(2)}</span></div>`;
      if (step === 2) STAGES.forEach((s, i) => { html += `<div class="row"><span><i class="sw" style="background:${s.color}"></i>|H| ${s.name}</span><span>${F.gains[i][Math.round(f / FMAX * COLS)].toFixed(3)}</span></div>`; });
    }
    tt.innerHTML = html; tt.style.display = 'block';
    const wrap = chart.parentElement.getBoundingClientRect();
    const cx = evt.clientX - wrap.left, cy = evt.clientY - wrap.top;
    tt.style.left = (cx + 16 + tt.offsetWidth > wrap.width ? cx - tt.offsetWidth - 12 : cx + 16) + 'px';
    tt.style.top = Math.max(0, cy - 10) + 'px';
  }
  function unhover() { tt.style.display = 'none'; if (G.hover) G.hover.innerHTML = ''; }

  // ------------------------------------------------------------ wiring
  $('next').addEventListener('click', e => { e.stopPropagation(); next(); });
  $('prev').addEventListener('click', e => { e.stopPropagation(); prev(); });
  $('restart').addEventListener('click', e => { e.stopPropagation(); restart(); });
  $('reset').addEventListener('click', e => { e.stopPropagation(); dirty.hp = dirty.nc = dirty.lp = false; enterStep(step); });
  $('play').addEventListener('click', e => { e.stopPropagation(); if (playing) stopPlay(); else if (isDone()) restart(); else startPlay(); });
  $('slide').addEventListener('click', () => next());
  document.addEventListener('keydown', e => {
    if (['SELECT', 'INPUT'].includes(e.target.tagName)) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
    else if (e.key === ' ') { e.preventDefault(); $('play').click(); }
    else if (e.key === 'r' || e.key === 'R') restart();
  });
  // sliders: recompute the pipeline and redraw at the current progress; no replay
  $('hp').addEventListener('input', e => { dirty.hp = true; hp = parseFloat(e.target.value); dialChanged(); });
  $('nc').addEventListener('input', e => { dirty.nc = true; nc = parseInt(e.target.value, 10); dialChanged(); });
  $('lp').addEventListener('input', e => { dirty.lp = true; lp = parseInt(e.target.value, 10); dialChanged(); });
  $('speed').addEventListener('change', e => { mult = parseFloat(e.target.value); });
  chart.addEventListener('mousemove', hover);
  chart.addEventListener('mouseleave', unhover);

  const h = parseInt((location.hash || '').replace('#', ''), 10);
  enterStep(h >= 1 && h <= STEPS.length ? h - 1 : 0);
})();
</script>

</body>
</html>

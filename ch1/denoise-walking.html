<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Denoising a walking accelerometer signal</title>
</head>
<body>
<style>
  :root {
    color-scheme: light;
    --paper: #ffffff;
    --ink: #222222;
    --ink-2: #666666;
    --ink-3: #9a9a9a;
    --rule: #dcdcdc;
    --grid: #ececec;
    --raw: #8f8f8f;
    --raw-dot: #8c8c8c;
    --clean: #444444;
    --ma: #2a78d6;
    --sig: #2a78d6;
    --noise: #eb6834;
    --stage: #1baf7a;
    --sans: "Helvetica Neue", Helvetica, -apple-system, Arial, sans-serif;
    --mono: Menlo, "SF Mono", Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--sans); font-size: 15px; line-height: 1.4;
    padding-block: 10px 10px; padding-inline: 14px; -webkit-font-smoothing: antialiased;
  }
  .stage { max-width: 1880px; margin: 0 auto; display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 10px; height: calc(100vh - 20px); }
  .slide {
    background: var(--paper); border: 1px solid var(--rule); border-radius: 6px;
    padding: 16px 30px 8px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 6px;
    min-height: 0; position: relative; outline: none; cursor: pointer; user-select: none;
  }
  .slide:focus-visible { box-shadow: 0 0 0 3px rgba(42,120,214,.35); }
  .head h1 { margin: 0; font-size: clamp(24px, 2.4vw, 36px); font-weight: 700; letter-spacing: -0.01em; line-height: 1.15; }
  .head h1 .tag { display: inline-block; font-family: var(--mono); font-weight: 400; font-size: 0.6em; color: var(--ink-2); margin-left: 10px; vertical-align: middle; background: #f4f4f4; padding: 2px 8px; border-radius: 4px; white-space: nowrap; }
  .head p { margin: 6px 0 0; color: #444; font-size: clamp(18px, 1.7vw, 24px); max-width: none; }
  .head p:empty { display: none; }
  .head h1 .tag:empty { display: none; }
  .code { margin: 8px 0 0; font-family: var(--mono); font-size: clamp(15px, 1.4vw, 21px); color: var(--ink); background: #f4f6f9; border: 1px solid var(--rule); border-radius: 5px; padding: 6px 12px; white-space: pre; overflow-x: auto; }
  .code[hidden] { display: none; }
  .code .p { color: var(--ma); font-weight: 700; }
  .code .k { color: var(--ink-2); }

  .chart-wrap { position: relative; min-height: 0; height: 100%; display: flex; justify-content: center; align-items: center; }
  svg.chart { display: block; height: 100%; width: auto; max-width: 100%; max-height: 100%; overflow: visible; }
  .tt {
    position: absolute; pointer-events: none; display: none; background: #fff; border: 1px solid var(--rule); border-radius: 4px;
    padding: 6px 9px; font-family: var(--mono); font-size: 12px; color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,.08); white-space: nowrap; z-index: 2;
  }
  .tt .row { display: flex; gap: 12px; justify-content: space-between; }
  .tt .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

  .foot { position: absolute; top: 9px; right: 16px; display: flex; gap: 14px; align-items: baseline; font-size: 14px; color: var(--ink-3); padding: 0; pointer-events: none; }
  .foot .ctr { font-family: var(--mono); }

  .bar { display:flex; flex-direction:column; gap:12px; padding:12px 24px;
         border:1px solid var(--rule); border-radius:6px; background:#f6f7f9; font-size:19px; color:var(--ink); }
  .bar .row { display:flex; justify-content:flex-start; align-items:center; gap:16px 32px; flex-wrap:wrap; }
  .bar .row.dials .group { flex:1 1 0; }
  .bar .row.dials input[type=range] { flex:1 1 auto; width:auto; }
  .group { display:flex; align-items:center; gap:10px; }
  .group label { font-size:18px; font-weight:700; color:var(--ink); letter-spacing:0; text-transform:none; white-space:nowrap; }
  .val { font-family:var(--mono); font-size:19px; font-weight:700; color:var(--ma); min-width:5ch; white-space:nowrap; }
  button, select { font:inherit; font-size:18px; color:var(--ink); background:#fff; border:1px solid #9a9a9a;
                   border-radius:6px; padding:9px 16px; cursor:pointer; }
  button:hover, select:hover { border-color:var(--ink); }
  button.primary { background:var(--ma); color:#fff; border-color:var(--ma); min-width:88px; font-weight:700; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline:2px solid var(--ma); outline-offset:2px; }
  input[type=range] { -webkit-appearance:none; appearance:none; accent-color:var(--ma); width:260px; height:36px; background:transparent; cursor:pointer; }
  input[type=range]::-webkit-slider-runnable-track { height:8px; border-radius:4px; background:#c9d1dc; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:26px; height:26px; border-radius:50%; background:var(--ma); border:3px solid #fff; box-shadow:0 0 0 1.5px var(--ma); margin-top:-9px; }
  input[type=range]::-moz-range-track { height:8px; border-radius:4px; background:#c9d1dc; }
  input[type=range]::-moz-range-thumb { width:26px; height:26px; border-radius:50%; background:var(--ma); border:3px solid #fff; }
  input[type=range].narrow { width: 260px; }
  .hint { margin-left:auto; color:var(--ink-2); font-size:12px; }
  .hint kbd { font-family: var(--mono); background: #fff; border: 1px solid var(--rule); border-radius: 3px; padding: 0 5px; font-size: 11px; }

  .grid line { stroke: var(--grid); stroke-width: 1; }
  .axis line, .axis path { stroke: var(--ink-2); stroke-width: 1; fill: none; }
  .axis text { font-family: var(--mono); font-size: 20px; fill: var(--ink-2); }
  .axis.stage line, .axis.stage path { stroke: var(--stage); }
  .axis.stage text { fill: var(--stage); }
  .ptitle { font-family: var(--sans); font-size: 21px; fill: var(--ink); font-weight: 700; }
  .axis-title { font-family: var(--sans); font-size: 22px; fill: var(--ink-2); }
  .raw-line { fill: none; stroke: var(--raw); stroke-width: 2; stroke-linejoin: round; }
  .raw-line.faint { opacity: .45; }
  .out-line { fill: none; stroke: var(--ma); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
  .spec-line { fill: none; stroke: var(--sig); stroke-width: 2; stroke-linejoin: round; }
  .spec-line.faint { stroke: var(--raw); opacity: .55; }
  .spec-noise { fill: none; stroke: var(--noise); stroke-width: 2; stroke-linejoin: round; }
  .resp-line { fill: none; stroke: var(--stage); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
  .resp-line.faint { stroke-width: 2; opacity: .6; stroke-dasharray: 7 5; }
  .band { fill: url(#hatch); }
  .band.signal { fill: rgba(42,120,214,.09); }
  .band-edge { stroke: #555; stroke-width: 1; stroke-dasharray: 3 3; }
  .band-label { font-family: var(--sans); font-size: 20px; font-weight: 700; fill: var(--noise); }
  .band-label.signal { fill: var(--sig); }
  .dot { stroke: #fff; stroke-width: 1.4; }
  .legend rect.bg { fill: #fff; fill-opacity: .9; stroke: var(--rule); }
  .legend text { font-family: var(--sans); font-size: 24px; fill: var(--ink); }
  .legend line { stroke-width: 4; }
  .anno { font-family: var(--mono); font-size: 19px; fill: var(--ink); }
  .anno.muted { fill: var(--ink-3); }
  .anno.stage { fill: var(--stage); font-weight: 700; }
  .anno.readout { fill: var(--ma); font-weight: 700; }
  .crosshair { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 2 2; }

  @media (max-width: 720px) {
    .slide { padding: 18px 16px 12px; min-height: 0; }
    .hint { display: none; }
    input[type=range], input[type=range].narrow { width: 120px; }
  }
  .hint { display:none !important; }
  button.tb { min-width:54px; padding:9px 12px; font-size:22px; line-height:1; }
  button.primary.tb { min-width:64px; }
</style>

<div class="stage">
  <section class="slide" id="slide" tabindex="0" aria-live="polite">
    <div class="head">
      <h1 id="title"></h1>
      <p id="subtitle"></p>
      <pre class="code" id="code" hidden></pre>
    </div>
    <div class="chart-wrap">
      <svg class="chart" id="chart" viewBox="0 0 1584 720" role="img" aria-label="Acceleration magnitude of a walk, its spectrum, the band-pass filter and the filtered result"></svg>
      <div class="tt" id="tt"></div>
    </div>
    <div class="foot">
      <span>CS328 &nbsp;·&nbsp; Sensor Data Smoothing &amp; Filtering</span>
      <span class="ctr" id="counter"></span>
    </div>
  </section>

  <div class="bar">
   <div class="row">
    <div class="group">
      <button id="prev" class="tb" title="Previous step (←)">⏮</button>
      <button id="play" class="primary tb" title="Play / pause (space)">▶</button>
      <button id="next" class="tb" title="Next step (→)">⏭</button>
      <button id="restart" class="tb" title="Restart this step (r)">↺</button>
      <button id="reset" title="Clear your dial changes and use the presets">Reset dials</button>
    </div>
    <div class="group">
      <label for="speed">Speed</label>
      <select id="speed">
        <option value="0.25">very slow</option>
        <option value="0.5">slow</option>
        <option value="1" selected>normal</option>
        <option value="2.5">fast</option>
        <option value="0">instant</option>
      </select>
    </div>
   </div>
   <div class="row dials">
    <div class="group">
      <label for="lo">Low edge</label>
      <input type="range" id="lo" class="narrow" min="0.1" max="1" step="0.05" value="0.5">
      <span class="val" id="loval">0.50 Hz</span>
    </div>
    <div class="group">
      <label for="hi">High edge</label>
      <input type="range" id="hi" class="narrow" min="2" max="10" step="0.5" value="4">
      <span class="val" id="hival">4.0 Hz</span>
    </div>
   </div>
  </div>
</div>

<script>
// Butterworth IIR design + filtering, mirroring scipy.signal.butter / lfilter / filtfilt.
// Design path: analog Butterworth prototype (zpk) -> lp2lp / lp2hp / lp2bp / lp2bs -> bilinear -> SOS.
// Usage:
//   const sos = butter(4, 100, 1000, 'lowpass');            // cutoff Hz, fs Hz
//   const sos = butter(4, [58, 62], 1000, 'bandstop');
//   const y = sosfilt(sos, x);                              // causal (lfilter)
//   const y = sosfiltfilt(sos, x);                          // zero-phase (filtfilt)
//   const mag = sosFreqz(sos, fHz, fs);                     // |H| at one frequency
(function (global) {
  // ---- minimal complex arithmetic
  const C = (re, im = 0) => ({ re, im });
  const cadd = (a, b) => C(a.re + b.re, a.im + b.im);
  const csub = (a, b) => C(a.re - b.re, a.im - b.im);
  const cmul = (a, b) => C(a.re * b.re - a.im * b.im, a.re * b.im + a.im * b.re);
  const cdiv = (a, b) => { const d = b.re * b.re + b.im * b.im; return C((a.re * b.re + a.im * b.im) / d, (a.im * b.re - a.re * b.im) / d); };
  const csqrt = a => { const r = Math.hypot(a.re, a.im); const re = Math.sqrt(Math.max(0, (r + a.re) / 2)); const im = Math.sign(a.im || 1) * Math.sqrt(Math.max(0, (r - a.re) / 2)); return C(re, im); };
  const cscale = (a, s) => C(a.re * s, a.im * s);

  function buttap(N) { // analog prototype poles, unit cutoff
    const p = [];
    for (let k = 1; k <= N; k++) { const th = Math.PI * (2 * k - 1) / (2 * N); p.push(C(-Math.sin(th), Math.cos(th))); }
    return { z: [], p, k: 1 };
  }
  function lp2lp(zpk, wo) { return { z: zpk.z.map(v => cscale(v, wo)), p: zpk.p.map(v => cscale(v, wo)), k: zpk.k * Math.pow(wo, zpk.p.length - zpk.z.length) }; }
  function lp2hp(zpk, wo) {
    const z = zpk.z.map(v => cdiv(C(wo), v)), p = zpk.p.map(v => cdiv(C(wo), v));
    const deg = zpk.p.length - zpk.z.length;
    for (let i = 0; i < deg; i++) z.push(C(0));
    let num = C(1), den = C(1);
    zpk.z.forEach(v => { num = cmul(num, cscale(v, -1)); });
    zpk.p.forEach(v => { den = cmul(den, cscale(v, -1)); });
    const kk = cdiv(num, den);
    return { z, p, k: zpk.k * kk.re };
  }
  function lp2bp(zpk, wo, bw) {
    const deg = zpk.p.length - zpk.z.length;
    const tr = v => { const s = cscale(v, bw / 2); const r = csqrt(csub(cmul(s, s), C(wo * wo))); return [cadd(s, r), csub(s, r)]; };
    const z = [], p = [];
    zpk.z.forEach(v => z.push(...tr(v)));
    zpk.p.forEach(v => p.push(...tr(v)));
    for (let i = 0; i < deg; i++) z.push(C(0));
    return { z, p, k: zpk.k * Math.pow(bw, deg) };
  }
  function lp2bs(zpk, wo, bw) {
    const deg = zpk.p.length - zpk.z.length;
    const tr = v => { const s = cdiv(C(bw / 2), v); const r = csqrt(csub(cmul(s, s), C(wo * wo))); return [cadd(s, r), csub(s, r)]; };
    const z = [], p = [];
    zpk.z.forEach(v => z.push(...tr(v)));
    zpk.p.forEach(v => p.push(...tr(v)));
    for (let i = 0; i < deg; i++) { z.push(C(0, wo)); z.push(C(0, -wo)); }
    let num = C(1), den = C(1);
    zpk.z.forEach(v => { num = cmul(num, cscale(v, -1)); });
    zpk.p.forEach(v => { den = cmul(den, cscale(v, -1)); });
    const kk = cdiv(num, den);
    return { z, p, k: zpk.k * kk.re };
  }
  function bilinear(zpk, fs) {
    const fs2 = 2 * fs;
    const deg = zpk.p.length - zpk.z.length;
    const tr = v => cdiv(cadd(C(fs2), v), csub(C(fs2), v));
    const z = zpk.z.map(tr), p = zpk.p.map(tr);
    for (let i = 0; i < deg; i++) z.push(C(-1));
    let num = C(1), den = C(1);
    zpk.z.forEach(v => { num = cmul(num, csub(C(fs2), v)); });
    zpk.p.forEach(v => { den = cmul(den, csub(C(fs2), v)); });
    const kk = cdiv(num, den);
    return { z, p, k: zpk.k * kk.re };
  }
  // pair conjugates -> second-order sections [b0,b1,b2,a0,a1,a2]
  function zpk2sos(zpk) {
    const pairUp = arr => {
      const rest = arr.slice(); const pairs = [];
      while (rest.length) {
        const a = rest.shift();
        if (Math.abs(a.im) < 1e-9) { // real: pair with the nearest real
          let j = rest.findIndex(v => Math.abs(v.im) < 1e-9);
          if (j >= 0) { pairs.push([a, rest.splice(j, 1)[0]]); } else pairs.push([a]);
        } else {
          let j = rest.findIndex(v => Math.abs(v.re - a.re) < 1e-7 && Math.abs(v.im + a.im) < 1e-7);
          if (j >= 0) { pairs.push([a, rest.splice(j, 1)[0]]); } else pairs.push([a, C(a.re, -a.im)]);
        }
      }
      return pairs;
    };
    const poly = pr => { // (x - r1)(x - r2) -> real coefficients [1, c1, c2]
      if (pr.length === 1) return [1, -pr[0].re, 0];
      const s = cadd(pr[0], pr[1]), m = cmul(pr[0], pr[1]);
      return [1, -s.re, m.re];
    };
    // sort poles by closeness to the unit circle so each section pairs zeros nearby (stability of cascade)
    const P = zpk.p.slice().sort((a, b) => Math.hypot(b.re, b.im) - Math.hypot(a.re, a.im));
    const Z = zpk.z.slice();
    const pp = pairUp(P);
    const sos = [];
    pp.forEach((pair, idx) => {
      // choose the zero(s) nearest this pole pair
      const zs = [];
      for (let n = 0; n < pair.length && Z.length; n++) {
        let best = 0, bd = Infinity;
        Z.forEach((v, j) => { const d = Math.hypot(v.re - pair[0].re, Math.abs(v.im) - Math.abs(pair[0].im)); if (d < bd) { bd = d; best = j; } });
        const zz = Z.splice(best, 1)[0];
        zs.push(zz);
        if (Math.abs(zz.im) > 1e-9) { // also remove its conjugate
          const cj = Z.findIndex(v => Math.abs(v.re - zz.re) < 1e-7 && Math.abs(v.im + zz.im) < 1e-7);
          if (cj >= 0) { zs.push(Z.splice(cj, 1)[0]); n++; }
        }
      }
      const b = zs.length ? poly(zs) : [1, 0, 0];
      const a = poly(pair);
      const g = idx === 0 ? zpk.k : 1;
      sos.push([b[0] * g, b[1] * g, b[2] * g, a[0], a[1], a[2]]);
    });
    return sos;
  }

  function butter(N, cutoffHz, fs, btype = 'lowpass') {
    const warp = f => 2 * fs * Math.tan(Math.PI * f / fs);
    let zpk = buttap(N);
    if (btype === 'lowpass') zpk = lp2lp(zpk, warp(cutoffHz));
    else if (btype === 'highpass') zpk = lp2hp(zpk, warp(cutoffHz));
    else {
      const w1 = warp(cutoffHz[0]), w2 = warp(cutoffHz[1]);
      const bw = w2 - w1, wo = Math.sqrt(w1 * w2);
      zpk = btype === 'bandpass' ? lp2bp(zpk, wo, bw) : lp2bs(zpk, wo, bw);
    }
    return zpk2sos(bilinear(zpk, fs));
  }

  function sosfilt(sos, x, zi) { // direct form II transposed, per section
    let y = Float64Array.from(x);
    const st = zi || sos.map(() => [0, 0]);
    sos.forEach(([b0, b1, b2, a0, a1, a2], s) => {
      const z = st[s]; const out = new Float64Array(y.length);
      for (let n = 0; n < y.length; n++) {
        const xn = y[n];
        const yn = b0 * xn + z[0];
        z[0] = b1 * xn - a1 * yn + z[1];
        z[1] = b2 * xn - a2 * yn;
        out[n] = yn;
      }
      y = out;
    });
    return y;
  }
  // steady-state initial conditions for a step of amplitude 1 (like scipy sosfilt_zi)
  function sosfiltZi(sos) {
    let scale = 1;
    return sos.map(([b0, b1, b2, a0, a1, a2]) => {
      // solve for zi such that output is constant for constant input (scale)
      const g = (b0 + b1 + b2) / (1 + a1 + a2); // dc gain of this section
      const z0 = scale * ((b1 - a1 * b0) + (b2 - a2 * b0)) / (1 + a1 + a2) * 1; // approx via steady state
      // exact: z1 = scale*(b2 - a2*b0)... use the standard linear solve
      // Steady state: y = g*scale; z0 = y - b0*scale; z1 = z0 - (b1*scale - a1*y)
      const y = g * scale;
      const zz0 = y - b0 * scale;
      const zz1 = zz0 - (b1 * scale - a1 * y);
      scale = y;
      return [zz0, zz1];
    });
  }
  function sosfiltfilt(sos, x) {
    const n = x.length;
    const pad = Math.min(n - 1, 3 * 3 * sos.length); // ~ 3 * (order) samples (scipy: 3*max(len(a),len(b)))
    // odd extension
    const ext = new Float64Array(n + 2 * pad);
    for (let i = 0; i < pad; i++) ext[i] = 2 * x[0] - x[pad - i];
    for (let i = 0; i < n; i++) ext[pad + i] = x[i];
    for (let i = 0; i < pad; i++) ext[pad + n + i] = 2 * x[n - 1] - x[n - 2 - i];
    const zi = sosfiltZi(sos);
    let y = sosfilt(sos, ext, zi.map(z => [z[0] * ext[0], z[1] * ext[0]]));
    y.reverse();
    y = sosfilt(sos, y, zi.map(z => [z[0] * y[0], z[1] * y[0]]));
    y.reverse();
    return y.slice(pad, pad + n);
  }
  function sosFreqz(sos, fHz, fs) { // magnitude response at a frequency (Hz)
    const w = 2 * Math.PI * fHz / fs;
    const e1 = C(Math.cos(-w), Math.sin(-w)), e2 = C(Math.cos(-2 * w), Math.sin(-2 * w));
    let H = C(1);
    sos.forEach(([b0, b1, b2, a0, a1, a2]) => {
      const num = cadd(C(b0), cadd(cscale(e1, b1), cscale(e2, b2)));
      const den = cadd(C(a0), cadd(cscale(e1, a1), cscale(e2, a2)));
      H = cmul(H, cdiv(num, den));
    });
    return Math.hypot(H.re, H.im);
  }
  function sosPhase(sos, fHz, fs) {
    const w = 2 * Math.PI * fHz / fs;
    const e1 = C(Math.cos(-w), Math.sin(-w)), e2 = C(Math.cos(-2 * w), Math.sin(-2 * w));
    let H = C(1);
    sos.forEach(([b0, b1, b2, a0, a1, a2]) => {
      const num = cadd(C(b0), cadd(cscale(e1, b1), cscale(e2, b2)));
      const den = cadd(C(a0), cadd(cscale(e1, a1), cscale(e2, a2)));
      H = cmul(H, cdiv(num, den));
    });
    return Math.atan2(H.im, H.re);
  }

  // ---- real FFT magnitude (radix-2, zero-padded), returns {f, mag} one-sided, mag scaled 2/N
  function rfftMag(x, fs) {
    let N = 1; while (N < x.length) N <<= 1;
    const re = new Float64Array(N), im = new Float64Array(N);
    for (let i = 0; i < x.length; i++) re[i] = x[i];
    for (let i = 1, j = 0; i < N; i++) { // bit reversal
      let bit = N >> 1; for (; j & bit; bit >>= 1) j ^= bit; j ^= bit;

<script>
(() => {
  const B = window.Butter;
  // ------------------------------------------------------------ signal: |a| = sqrt(x^2 + y^2 + z^2) of a real walk
  const FS = window.ACCEL.fs, N = window.ACCEL.x.length, DUR = N / FS;
  const MAG = new Float64Array(N);
  for (let i = 0; i < N; i++) { const { x, y, z } = window.ACCEL; MAG[i] = Math.sqrt(x[i] * x[i] + y[i] * y[i] + z[i] * z[i]); }

  // ------------------------------------------------------------ spectrum (Hann window, linear magnitude)
  const FMAX = 25, SPEC_MAX = 3;
  function spectrum(x) {
    const w = new Float64Array(N);
    for (let i = 0; i < N; i++) w[i] = x[i] * (0.5 - 0.5 * Math.cos(2 * Math.PI * i / (N - 1)));
    const { f, mag } = B.rfftMag(w, FS);
    let K = 0; while (K < f.length && f[K] <= FMAX) K++;
    return { f: f.slice(0, K), mag: mag.slice(0, K) };
  }
  const SPEC_RAW = spectrum(MAG);

  // ------------------------------------------------------------ pipeline: one band-pass stage (zero-phase, filtfilt)
  let lo = 0.5, hi = 4;
  const PRESET = { lo: 0.5, hi: 4 };
  const dirty = { lo: false, hi: false };
  let sos = null, OUT = null, SPEC_OUT = null, PEAKS = [];
  // find_peaks(distance, prominence) as in scipy: local maxima, prominence test, then the distance rule (highest peaks win)
  function findPeaks(y, distance, prominence) {
    const n = y.length, cand = [];
    for (let i = 1; i < n - 1; i++) if (y[i] > y[i - 1] && y[i] >= y[i + 1]) cand.push(i);
    const prom = cand.map(i => {
      let l = i, lm = y[i]; while (l > 0 && y[l - 1] <= y[i]) { l--; lm = Math.min(lm, y[l]); }
      let r = i, rm = y[i]; while (r < n - 1 && y[r + 1] <= y[i]) { r++; rm = Math.min(rm, y[r]); }
      return y[i] - Math.max(lm, rm);
    });
    const keep = cand.filter((_, k) => prom[k] >= prominence);
    const order = keep.slice().sort((a, b) => y[b] - y[a]);
    const alive = new Set(keep);
    order.forEach(i => { if (!alive.has(i)) return; keep.forEach(j => { if (j !== i && Math.abs(j - i) < distance) alive.delete(j); }); });
    return keep.filter(i => alive.has(i));
  }
  const DIST = Math.round(0.3 * FS), PROM = 2; // 0.3 s between steps, 2 m/s^2 prominence
  function recompute() {
    sos = B.butter(4, [lo, hi], FS, 'bandpass');
    OUT = B.sosfiltfilt(sos, MAG);
    SPEC_OUT = spectrum(OUT);
    PEAKS = findPeaks(OUT, DIST, PROM);
  }
  recompute();

  // ------------------------------------------------------------ layout
  const W = 1584, H = 720;
  const X0 = 84, X1 = W - 100;
  const TOP = { x0: X0, x1: X1, y0: 42, y1: 300, title: 28 };
  const BOT = { x0: X0, x1: X1, y0: 406, y1: 664, title: 392 };
  const svgNS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs = {}, parent) => { const n = document.createElementNS(svgNS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; };
  let YLO = 0, YHI = 35;
  const tx = i => TOP.x0 + (i / (N - 1)) * (TOP.x1 - TOP.x0);
  const ty = v => TOP.y1 - ((v - YLO) / (YHI - YLO)) * (TOP.y1 - TOP.y0);
  const fx = f => BOT.x0 + (f / FMAX) * (BOT.x1 - BOT.x0);
  const fy = m => BOT.y1 - (Math.min(m, SPEC_MAX) / SPEC_MAX) * (BOT.y1 - BOT.y0);
  const hy = g => BOT.y1 - Math.min(g, 1.02) * (BOT.y1 - BOT.y0);
  const fmtLo = v => v.toFixed(2), fmtHi = v => v.toFixed(1);
  const bandText = () => `${fmtLo(lo)}–${fmtHi(hi)} Hz`;

  // the spectrum's features (fixed by the recording, not by the dials)
  const BANDS = [
    { lo: 0, hi: 0.5, kind: 'noise', label: 'gravity: 0 Hz, off the scale', lx: () => fx(0.5) + 8, ly: () => BOT.y0 + 24 },
    { lo: 1, hi: 5, kind: 'signal', label: 'walking: 2.3 Hz and its harmonics', lx: () => fx(2.34) + 14, ly: () => BOT.y0 + 52 },
    { lo: 5, hi: FMAX, kind: 'noise', label: 'jitter: a broad floor above 5 Hz', lx: () => fx(5) + 10, ly: () => BOT.y1 - 70 },
  ];

  // ------------------------------------------------------------ steps
  const $ = id => document.getElementById(id);
  const chart = $('chart');
  const P = v => `<b class="p">${v}</b>`;
  const butterCall = () => `b, a = butter(4, [${P(fmtLo(lo))}, ${P(fmtHi(hi))}], btype='bandpass', fs=${FS})`;
  const STEPS = [
    { id: 'raw', base: 4, title: 'Raw walking accelerometer magnitude', tag: () => '',
      subtitle: '' },
    { id: 'spec', base: 3.5, title: 'Spectrum of the walking magnitude', tag: () => '',
      subtitle: '' },
    { id: 'design', base: 3, title: 'Designing the band-pass from the spectrum', tag: () => `band-pass ${bandText()} · order 4`,
      subtitle: '',
      code: () => butterCall() },
    { id: 'result', base: 4, title: 'Filtered walking magnitude', tag: () => `band-pass ${bandText()} · order 4`,
      subtitle: '',
      code: () => butterCall() + `;  y = filtfilt(b, a, mag)` },
  ];
  const txt = v => typeof v === 'function' ? v() : v;

  // ------------------------------------------------------------ static frame
  let G = {};
  function drawFrame() {
    chart.innerHTML = '';
    const defs = el('defs', {}, chart);
    const pat = el('pattern', { id: 'hatch', width: 8, height: 8, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' }, defs);
    el('rect', { width: 8, height: 8, fill: 'rgba(235,104,52,0.10)' }, pat);
    el('line', { x1: 0, y1: 0, x2: 0, y2: 8, stroke: 'rgba(235,104,52,0.45)', 'stroke-width': 1.2 }, pat);

    // time panel
    YLO = step === 3 ? -15 : 0; YHI = 35;
    TOP.y1 = step === 0 ? BOT.y1 : 300;   // step 1 shows only the time panel, full height
    {
      const P = TOP, grid = el('g', { class: 'grid' }, chart), axis = el('g', { class: 'axis' }, chart);
      el('text', { x: P.x0, y: P.title, class: 'ptitle' }, chart).textContent = 'time domain';
      const dv = step === 0 ? 5 : 10;
      for (let v = YLO + (YLO < 0 ? 5 : 0); v <= YHI; v += dv) {
        el('line', { x1: P.x0, x2: P.x1, y1: ty(v), y2: ty(v) }, grid);
        el('text', { x: P.x0 - 8, y: ty(v) + 4, 'text-anchor': 'end' }, axis).textContent = v;
      }
      for (let s = 0; s <= DUR; s += 5) {
        const i = s * FS;
        el('line', { x1: tx(i), x2: tx(i), y1: P.y0, y2: P.y1 }, grid);
        el('text', { x: tx(i), y: P.y1 + 22, 'text-anchor': 'middle' }, axis).textContent = s;
      }
      el('path', { d: `M${P.x0},${P.y0}V${P.y1}H${P.x1}` }, axis);
      el('text', { x: P.x1, y: P.y1 + 44, class: 'axis-title', 'text-anchor': 'end' }, chart).textContent = 'time (s)';
      el('text', { class: 'axis-title', 'text-anchor': 'middle', transform: `translate(${P.x0 - 56}, ${(P.y0 + P.y1) / 2}) rotate(-90)` }, chart).textContent = '|a| (m/s²)';
    }
    // spectrum panel (from step 2 on)
    if (step >= 1) {
      const P = BOT, grid = el('g', { class: 'grid' }, chart), axis = el('g', { class: 'axis' }, chart);
      el('text', { x: P.x0, y: P.title, class: 'ptitle' }, chart).textContent = 'frequency domain (FFT)';
      for (let v = 0; v <= SPEC_MAX; v += 1) {
        el('line', { x1: P.x0, x2: P.x1, y1: fy(v), y2: fy(v) }, grid);
        el('text', { x: P.x0 - 8, y: fy(v) + 4, 'text-anchor': 'end' }, axis).textContent = v;
      }
      for (let f = 0; f <= FMAX; f += 5) {
        el('line', { x1: fx(f), x2: fx(f), y1: P.y0, y2: P.y1 }, grid);
        el('text', { x: fx(f), y: P.y1 + 22, 'text-anchor': 'middle' }, axis).textContent = f;
      }
      el('path', { d: `M${P.x0},${P.y0}V${P.y1}H${P.x1}` }, axis);
      el('text', { x: P.x1, y: P.y1 + 44, class: 'axis-title', 'text-anchor': 'end' }, chart).textContent = 'frequency (Hz)';
      el('text', { class: 'axis-title', 'text-anchor': 'middle', transform: `translate(${P.x0 - 56}, ${(P.y0 + P.y1) / 2}) rotate(-90)` }, chart).textContent = '|X(f)|';
      if (step >= 2) { // right-hand axis for the filter gain, in the stage colour
        const ax = el('g', { class: 'axis stage' }, chart);
        el('path', { d: `M${P.x1},${P.y0}V${P.y1}` }, ax);
        [0, 0.5, 1].forEach(g => {
          el('line', { x1: P.x1, x2: P.x1 + 6, y1: hy(g), y2: hy(g) }, ax);
          el('text', { x: P.x1 + 10, y: hy(g) + 6, 'text-anchor': 'start' }, ax).textContent = g;
        });
        el('text', { class: 'axis-title', 'text-anchor': 'middle', fill: 'var(--stage)', transform: `translate(${P.x1 + 78}, ${(P.y0 + P.y1) / 2}) rotate(90)` }, chart).textContent = '|H(f)|';
      }
    }
    G.band = el('g', {}, chart);
    G.spec = el('g', {}, chart);
    G.resp = el('g', {}, chart);
    G.time = el('g', {}, chart);
    G.labels = el('g', {}, chart);
    G.legTop = el('g', { class: 'legend' }, chart);
    G.legBot = el('g', { class: 'legend' }, chart);
    G.anno = el('g', {}, chart);
    G.hover = el('g', {}, chart);
    el('rect', { x: TOP.x0, y: TOP.y0, width: TOP.x1 - TOP.x0, height: TOP.y1 - TOP.y0, fill: 'transparent', 'data-panel': 'time' }, chart);
    if (step >= 1) el('rect', { x: BOT.x0, y: BOT.y0, width: BOT.x1 - BOT.x0, height: BOT.y1 - BOT.y0, fill: 'transparent', 'data-panel': 'spec' }, chart);
  }

  // ------------------------------------------------------------ legends (drawn at step entry, static for the step)
  const swatch = (g, it, x, cy) => {
    if (it.kind === 'hatch') el('rect', { x, y: cy - 8, width: 18, height: 14, fill: 'url(#hatch)', stroke: 'rgba(235,104,52,.6)', 'stroke-width': .8 }, g);
    else if (it.kind === 'fill') el('rect', { x, y: cy - 8, width: 18, height: 14, fill: it.color, stroke: 'var(--sig)', 'stroke-width': .6, 'stroke-opacity': .5 }, g);
    else if (it.kind === 'dot') el('circle', { class: 'dot', cx: x + 9, cy: cy - 1, r: 5.5, fill: it.color }, g);
    else { const ln = el('line', { x1: x, x2: x + 18, y1: cy - 1, y2: cy - 1, stroke: it.color }, g); if (it.dashed) { ln.setAttribute('stroke-dasharray', '5 3'); ln.setAttribute('stroke-width', '2.5'); } if (it.faint) ln.setAttribute('opacity', '.55'); }
  };
  // vertical legend box at the top right of a panel
  function drawLegend(g, P, items) {
    g.innerHTML = '';
    const rowH = 34, wBox = Math.max(...items.map(i => i.name.length)) * 11.8 + 70, hBox = 14 + items.length * rowH;
    const x = P.x1 - wBox - 12, y = P.y0 + 10;
    el('rect', { class: 'bg', x, y, width: wBox, height: hBox, rx: 4 }, g);
    items.forEach((it, i) => { const cy = y + 21 + i * rowH; swatch(g, it, x + 10, cy); el('text', { x: x + 40, y: cy + 8 }, g).textContent = it.name; });
  }
  // one-row legend box on the panel-title row, right-aligned (keeps the plot area clear)
  function drawLegendRow(g, P, items) {
    g.innerHTML = '';
    const widths = items.map(it => 18 + 12 + it.name.length * 11.8), gap = 26;
    const wBox = widths.reduce((a, b) => a + b, 0) + gap * (items.length - 1) + 24, hBox = 34;
    const x = P.x1 - wBox, y = P.title - 25;
    el('rect', { class: 'bg', x, y, width: wBox, height: hBox, rx: 4 }, g);
    let cx = x + 12; const cy = y + 21;
    items.forEach((it, i) => { swatch(g, it, cx, cy); el('text', { x: cx + 30, y: cy + 8 }, g).textContent = it.name; cx += widths[i] + gap; });
  }
  function refreshLegends() {
    const timeItems = step < 3 ? [{ name: 'raw |a|', color: 'var(--raw)' }]
      : [{ name: 'raw |a|', color: 'var(--raw)', faint: true }, { name: 'band-passed', color: 'var(--ma)' }, { name: 'step found', color: 'var(--ma)', kind: 'dot' }];
    drawLegendRow(G.legTop, TOP, timeItems);
    if (step === 1) drawLegend(G.legBot, BOT, [{ name: 'spectrum of |a|', color: 'var(--sig)' }, { name: 'noise bands', kind: 'hatch' }, { name: 'walking band', kind: 'fill', color: 'rgba(42,120,214,.12)' }]);
    else if (step === 2) drawLegend(G.legBot, BOT, [{ name: 'spectrum of |a|', color: 'var(--sig)' }, { name: 'noise bands', kind: 'hatch' }, { name: 'walking band', kind: 'fill', color: 'rgba(42,120,214,.12)' }, { name: '|H(f)| of the band-pass', color: 'var(--stage)' }]);
    else if (step === 3) drawLegend(G.legBot, BOT, [{ name: 'spectrum of raw |a|', color: 'var(--raw)', faint: true }, { name: 'spectrum after band-pass', color: 'var(--sig)' }, { name: '|H(f)| of the band-pass', color: 'var(--stage)', dashed: true }, { name: 'noise bands', kind: 'hatch' }]);
    else G.legBot.innerHTML = '';
  }

  // ------------------------------------------------------------ drawing helpers
  function timePath(arr, upto, cls) {
    let d = ''; const n = Math.min(upto, N);
    for (let i = 0; i < n; i++) d += (i ? 'L' : 'M') + tx(i).toFixed(1) + ',' + ty(arr[i]).toFixed(1);
    if (n > 1) el('path', { class: cls, d }, G.time);
  }
  function specPath(sp, fUpto, cls, lo = 0, hi = FMAX) {
    let d = ''; const f = sp.f, m = sp.mag;
    for (let k = 0; k < f.length; k++) {
      if (f[k] < lo || f[k] > Math.min(hi, fUpto)) continue;
      d += (d ? 'L' : 'M') + fx(f[k]).toFixed(1) + ',' + fy(m[k]).toFixed(1);
    }
    if (d) el('path', { class: cls, d }, G.spec);
  }
  function respPath(fUpto, cls) {
    let d = ''; const cols = Math.round(BOT.x1 - BOT.x0);
    for (let c = 0; c <= cols; c++) {
      const f = (c / cols) * FMAX; if (f > fUpto) break;
      d += (d ? 'L' : 'M') + (BOT.x0 + c).toFixed(1) + ',' + hy(B.sosFreqz(sos, Math.max(f, 0.005), FS)).toFixed(1);
    }
    if (d) el('path', { class: cls, d }, G.resp);
  }
  function drawBands(fUpto, withLabels) {
    G.band.innerHTML = ''; G.labels.innerHTML = '';
    BANDS.forEach(b => {
      if (b.lo > fUpto) return;
      const hiF = Math.min(b.hi, fUpto);
      el('rect', { class: 'band' + (b.kind === 'signal' ? ' signal' : ''), x: fx(b.lo), y: BOT.y0, width: Math.max(0, fx(hiF) - fx(b.lo)), height: BOT.y1 - BOT.y0 }, G.band);
      if (b.lo > 0) el('line', { class: 'band-edge', x1: fx(b.lo), x2: fx(b.lo), y1: BOT.y0, y2: BOT.y1 }, G.band);
      if (b.hi < FMAX && b.hi <= fUpto && b.kind === 'noise') el('line', { class: 'band-edge', x1: fx(b.hi), x2: fx(b.hi), y1: BOT.y0, y2: BOT.y1 }, G.band);
      if (withLabels && b.lo + 0.3 <= fUpto) el('text', { class: 'band-label' + (b.kind === 'signal' ? ' signal' : ''), x: b.lx(), y: b.ly() }, G.labels).textContent = b.label;
    });
  }
  // spectrum in blue, repainted orange-red inside the noise bands
  function drawSpectrum(sp, fUpto, faint) {
    specPath(sp, fUpto, 'spec-line' + (faint ? ' faint' : ''));
    if (!faint) BANDS.filter(b => b.kind === 'noise').forEach(b => specPath(sp, fUpto, 'spec-noise', b.lo, b.hi));
  }
  function stageList() {
    const t = el('text', { x: BOT.x1, y: BOT.title, class: 'anno stage', 'text-anchor': 'end' }, G.anno);
    t.textContent = `stage 1 of 1: band-pass ${bandText()}, order 4, filtfilt`;
  }
  function readout(nFound, done) {
    const t = el('text', { x: TOP.x0 + 160, y: TOP.title, class: 'anno readout' }, G.anno);
    t.textContent = `find_peaks(distance=${DIST}, prominence=${PROM}) → steps found: ${nFound}${done ? ` in ${DUR} s` : ''}`;
  }

  // ------------------------------------------------------------ render at progress p (0..1) from the live dials
  let step = 0, p = 0, playing = false, raf = 0, lastT = 0, speedMult = 1;
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function render() {
    const d = STEPS[step];
    G.time.innerHTML = ''; G.spec.innerHTML = ''; G.resp.innerHTML = ''; G.anno.innerHTML = '';
    if (d.id === 'raw') {
      const n = Math.max(2, Math.floor(p * N));
      timePath(MAG, n, 'raw-line');
      if (n < N) el('circle', { class: 'dot', cx: tx(n - 1), cy: ty(MAG[n - 1]), r: 4.5, fill: 'var(--raw-dot)' }, G.time);
    } else if (d.id === 'spec') {
      timePath(MAG, N, 'raw-line');
      const fUpto = p * FMAX;
      drawBands(fUpto, true);
      drawSpectrum(SPEC_RAW, fUpto, false);
    } else if (d.id === 'design') {
      timePath(MAG, N, 'raw-line');
      drawBands(FMAX, false);
      drawSpectrum(SPEC_RAW, FMAX, false);
      respPath(p * FMAX, 'resp-line');
      stageList();
    } else {
      const n = Math.max(2, Math.floor(p * N));
      timePath(MAG, N, 'raw-line faint');
      timePath(OUT, n, 'out-line');
      const found = PEAKS.filter(i => i < n);
      found.forEach(i => el('circle', { class: 'dot', cx: tx(i), cy: ty(OUT[i]), r: 5.5, fill: 'var(--ma)' }, G.time));
      if (n < N) el('circle', { class: 'dot', cx: tx(n - 1), cy: ty(OUT[n - 1]), r: 5, fill: 'var(--ma)' }, G.time);
      drawBands(FMAX, false);
      drawSpectrum(SPEC_RAW, FMAX, true);
      drawSpectrum(SPEC_OUT, p * FMAX, false);
      respPath(FMAX, 'resp-line faint');
      stageList();
      readout(found.length, n >= N);
    }
    renderHead();
  }
  function renderHead() {
    const d = STEPS[step];
    $('title').innerHTML = txt(d.title) + `<span class="tag">${txt(d.tag)}</span>`;
    $('subtitle').textContent = txt(d.subtitle);
    const code = txt(d.code);
    $('code').hidden = !code; $('code').innerHTML = code || '';
  }

  // ------------------------------------------------------------ dials
  function setDials() {
    $('lo').value = lo; $('loval').textContent = `${fmtLo(lo)} Hz`;
    $('hi').value = hi; $('hival').textContent = `${fmtHi(hi)} Hz`;
  }
  function dialChanged() { setDials(); recompute(); refreshLegends(); render(); }

  // ------------------------------------------------------------ step control
  function enterStep(k, completed = false) {
    step = Math.max(0, Math.min(STEPS.length - 1, k));
    stopPlay();
    if (!dirty.lo) lo = PRESET.lo;
    if (!dirty.hi) hi = PRESET.hi;
    setDials(); recompute();
    p = 0;
    drawFrame(); refreshLegends();
    $('counter').textContent = `${step + 1} / ${STEPS.length}`;
    try { history.replaceState(null, '', '#' + (step + 1)); } catch (_) {}
    if (completed || speedMult === 0 || reduceMotion) finish(); else { render(); startPlay(); }
  }
  const isDone = () => p >= 1;
  function finish() { stopPlay(); p = 1; render(); }
  function tick(t) {
    if (!playing) return;
    const dt = Math.max(0, Math.min(0.1, (t - lastT) / 1000)); lastT = t;
    p = Math.min(1, p + dt * speedMult / STEPS[step].base);
    render();
    if (isDone()) { finish(); return; }
    raf = requestAnimationFrame(tick);
  }
  function startPlay() { if (isDone()) return; playing = true; lastT = performance.now(); $('play').textContent = '⏸'; raf = requestAnimationFrame(tick); }
  function stopPlay() { playing = false; cancelAnimationFrame(raf); $('play').textContent = '▶'; }
  function next() { if (!isDone()) { finish(); return; } if (step < STEPS.length - 1) enterStep(step + 1); }
  function prev() { if (step > 0) enterStep(step - 1, true); }
  function restart() { enterStep(step); }

  // ------------------------------------------------------------ hover
  const tt = $('tt');
  const fmt2 = v => v.toFixed(2);
  function hover(evt) {
    const panel = evt.target.getAttribute && evt.target.getAttribute('data-panel');
    if (!panel) { unhover(); return; }
    const pt = chart.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY;
    const q = pt.matrixTransform(chart.getScreenCTM().inverse());
    G.hover.innerHTML = '';
    let html = '';
    if (panel === 'time') {
      const i = Math.max(0, Math.min(N - 1, Math.round((q.x - TOP.x0) / (TOP.x1 - TOP.x0) * (N - 1))));
      el('line', { class: 'crosshair', x1: tx(i), x2: tx(i), y1: TOP.y0, y2: TOP.y1 }, G.hover);
      html = `<div class="row"><span>t</span><b>${(i / FS).toFixed(2)} s</b></div><div class="row"><span><i class="sw" style="background:#8f8f8f"></i>raw |a|</span><span>${fmt2(MAG[i])}</span></div>`;
      if (step === 3) html += `<div class="row"><span><i class="sw" style="background:#2a78d6"></i>band-passed</span><span>${fmt2(OUT[i])}</span></div>`;
    } else {
      const f = Math.max(0, Math.min(FMAX, (q.x - BOT.x0) / (BOT.x1 - BOT.x0) * FMAX));
      const sp = step === 3 ? SPEC_OUT : SPEC_RAW;
      let k = Math.round(f / sp.f[1]); k = Math.max(0, Math.min(sp.f.length - 1, k));
      el('line', { class: 'crosshair', x1: fx(sp.f[k]), x2: fx(sp.f[k]), y1: BOT.y0, y2: BOT.y1 }, G.hover);
      html = `<div class="row"><span>f</span><b>${sp.f[k].toFixed(2)} Hz</b></div><div class="row"><span><i class="sw" style="background:#2a78d6"></i>|X(f)|</span><span>${fmt2(sp.mag[k])}</span></div>`;
      if (step >= 2) html += `<div class="row"><span><i class="sw" style="background:#1baf7a"></i>|H(f)|</span><span>${fmt2(B.sosFreqz(sos, Math.max(sp.f[k], 0.005), FS))}</span></div>`;
    }
    tt.innerHTML = html; tt.style.display = 'block';
    const wrap = chart.parentElement.getBoundingClientRect();
    const cx = evt.clientX - wrap.left, cy = evt.clientY - wrap.top;
    tt.style.left = (cx + 16 + tt.offsetWidth > wrap.width ? cx - tt.offsetWidth - 12 : cx + 16) + 'px';
    tt.style.top = Math.max(0, cy - 10) + 'px';
  }
  function unhover() { tt.style.display = 'none'; if (G.hover) G.hover.innerHTML = ''; }

  // ------------------------------------------------------------ wiring
  $('next').addEventListener('click', e => { e.stopPropagation(); next(); });
  $('prev').addEventListener('click', e => { e.stopPropagation(); prev(); });
  $('restart').addEventListener('click', e => { e.stopPropagation(); restart(); });
  $('reset').addEventListener('click', e => { e.stopPropagation(); dirty.lo = dirty.hi = false; enterStep(step); });
  $('play').addEventListener('click', e => { e.stopPropagation(); if (playing) stopPlay(); else if (isDone()) restart(); else startPlay(); });
  $('slide').addEventListener('click', () => next());
  document.addEventListener('keydown', e => {
    if (['SELECT', 'INPUT'].includes(e.target.tagName)) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
    else if (e.key === ' ') { e.preventDefault(); $('play').click(); }
    else if (e.key === 'r' || e.key === 'R') restart();
  });
  // sliders: recompute the pipeline and redraw at the current progress; no replay
  $('lo').addEventListener('input', e => { dirty.lo = true; lo = Math.min(parseFloat(e.target.value), hi - 0.5); dialChanged(); });
  $('hi').addEventListener('input', e => { dirty.hi = true; hi = Math.max(parseFloat(e.target.value), lo + 0.5); dialChanged(); });
  $('speed').addEventListener('change', e => { speedMult = parseFloat(e.target.value); });
  chart.addEventListener('mousemove', hover);
  chart.addEventListener('mouseleave', unhover);

  const h = parseInt((location.hash || '').replace('#', ''), 10);
  enterStep(h >= 1 && h <= STEPS.length ? h - 1 : 0);
})();
</script>

</body>
</html>

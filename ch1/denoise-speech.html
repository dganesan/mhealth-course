<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Denoising a Speech Recording</title>
</head>
<body>
<style>
  :root {
    color-scheme: light;
    --paper: #ffffff;
    --ink: #222222;
    --ink-2: #666666;
    --ink-3: #9a9a9a;
    --rule: #dcdcdc;
    --grid: #ececec;
    --raw: #8f8f8f;
    --raw-dot: #8c8c8c;
    --clean: #444444;
    --ma: #2a78d6;
    --notch: #1baf7a;
    --noise: #eb6834;
    --hp: #1baf7a;
    --lp: #4a3aa7;
    --sans: "Helvetica Neue", Helvetica, -apple-system, Arial, sans-serif;
    --mono: Menlo, "SF Mono", Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--sans); font-size: 15px; line-height: 1.4;
    padding-block: 10px 10px; padding-inline: 14px; -webkit-font-smoothing: antialiased;
  }
  .stage { max-width: 1880px; margin: 0 auto; display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 10px; height: calc(100vh - 20px); }
  .slide {
    background: var(--paper); border: 1px solid var(--rule); border-radius: 6px;
    padding: 16px 30px 8px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 6px;
    min-height: 0; position: relative; outline: none; cursor: pointer; user-select: none;
  }
  .slide:focus-visible { box-shadow: 0 0 0 3px rgba(42,120,214,.35); }
  .head h1 { margin: 0; font-size: clamp(24px, 2.4vw, 36px); font-weight: 700; letter-spacing: -0.01em; line-height: 1.15; }
  .head h1 .tag { display: inline-block; font-family: var(--mono); font-weight: 400; font-size: 0.6em; color: var(--ink-2); margin-left: 10px; vertical-align: middle; background: #f4f4f4; padding: 2px 8px; border-radius: 4px; white-space: nowrap; }
  .head p { margin: 6px 0 0; color: #444; font-size: clamp(18px, 1.7vw, 24px); max-width: none; }
  .head p:empty { display: none; }
  .head h1 .tag:empty { display: none; }
  .code { margin: 8px 0 0; font-family: var(--mono); font-size: clamp(15px, 1.4vw, 21px); color: var(--ink); background: #f4f6f9; border: 1px solid var(--rule); border-radius: 5px; padding: 6px 12px; white-space: pre; overflow-x: auto; }
  .code[hidden] { display: none; }
  .code .p { color: var(--ma); font-weight: 700; }
  .code .k { color: var(--ink-2); }

  .chart-wrap { position: relative; min-height: 0; height: 100%; display: flex; justify-content: center; align-items: center; }
  svg.chart { display: block; height: 100%; width: auto; max-width: 100%; max-height: 100%; overflow: visible; }
  .tt {
    position: absolute; pointer-events: none; display: none; background: #fff; border: 1px solid var(--rule); border-radius: 4px;
    padding: 6px 9px; font-family: var(--mono); font-size: 12px; color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,.08); white-space: nowrap; z-index: 2;
  }
  .tt .row { display: flex; gap: 12px; justify-content: space-between; }
  .tt .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

  .foot { position: absolute; top: 9px; right: 16px; display: flex; gap: 14px; align-items: baseline; font-size: 14px; color: var(--ink-3); padding: 0; pointer-events: none; }
  .foot .ctr { font-family: var(--mono); }

  .bar { display:flex; flex-direction:column; gap:12px; padding:12px 24px;
         border:1px solid var(--rule); border-radius:6px; background:#f6f7f9; font-size:19px; color:var(--ink); }
  .bar .row { display:flex; justify-content:flex-start; align-items:center; gap:16px 32px; flex-wrap:wrap; }
  .bar .row.dials .group { flex:1 1 0; }
  .bar .row.dials input[type=range] { flex:1 1 auto; width:auto; }
  .group { display:flex; align-items:center; gap:10px; }
  .group label { font-size:18px; font-weight:700; color:var(--ink); letter-spacing:0; text-transform:none; white-space:nowrap; }
  .val { font-family:var(--mono); font-size:19px; font-weight:700; color:var(--ma); min-width:5ch; white-space:nowrap; }
  button, select { font:inherit; font-size:18px; color:var(--ink); background:#fff; border:1px solid #9a9a9a;
                   border-radius:6px; padding:9px 16px; cursor:pointer; }
  button:hover, select:hover { border-color:var(--ink); }
  button.primary { background:var(--ma); color:#fff; border-color:var(--ma); min-width:88px; font-weight:700; }
  button.on { background:#eef4fc; border-color:var(--ma); color:var(--ma); font-weight:700; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline:2px solid var(--ma); outline-offset:2px; }
  input[type=range] { -webkit-appearance:none; appearance:none; accent-color:var(--ma); width:260px; height:36px; background:transparent; cursor:pointer; }
  input[type=range]::-webkit-slider-runnable-track { height:8px; border-radius:4px; background:#c9d1dc; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:26px; height:26px; border-radius:50%; background:var(--ma); border:3px solid #fff; box-shadow:0 0 0 1.5px var(--ma); margin-top:-9px; }
  input[type=range]::-moz-range-track { height:8px; border-radius:4px; background:#c9d1dc; }
  input[type=range]::-moz-range-thumb { width:26px; height:26px; border-radius:50%; background:var(--ma); border:3px solid #fff; }
  input[type=range].narrow { width: 260px; }
  .hint { margin-left:auto; color:var(--ink-2); font-size:12px; }
  .hint kbd { font-family: var(--mono); background: #fff; border: 1px solid var(--rule); border-radius: 3px; padding: 0 5px; font-size: 11px; }

  .grid line { stroke: var(--grid); stroke-width: 1; }
  .axis line, .axis path { stroke: var(--ink-2); stroke-width: 1; fill: none; }
  .axis text { font-family: var(--mono); font-size: 20px; fill: var(--ink-2); }
  .ptitle { font-family: var(--sans); font-size: 21px; fill: var(--ink); font-weight: 700; }
  .axis-title { font-family: var(--sans); font-size: 22px; fill: var(--ink-2); }
  .raw-line { fill: none; stroke: var(--raw); stroke-width: 2; }
  .clean-line { fill: none; stroke: var(--clean); stroke-width: 2; stroke-dasharray: 6 5; opacity: .8; }
  .out-line { fill: none; stroke-width: 3.4; stroke-linejoin: round; stroke-linecap: round; }
  .dot { stroke: #fff; stroke-width: 1.4; }
  .legend rect.bg { fill: #fff; fill-opacity: .9; stroke: var(--rule); }
  .legend text { font-family: var(--sans); font-size: 24px; fill: var(--ink); }
  .legend line { stroke-width: 4; }
  .anno { font-family: var(--mono); font-size: 19px; fill: var(--ink); }
  .anno.muted { fill: var(--ink-3); }
  .crosshair { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 2 2; }
  .lg text { font-family: var(--sans); font-size: 22px; fill: var(--ink); }
  .wave { stroke-width: 1; stroke-linejoin: round; }
  .spec-line { fill: none; stroke-width: 1.5; stroke-linejoin: round; }
  .resp { fill: none; stroke-width: 2.8; stroke-linejoin: round; stroke-linecap: round; }
  .band { fill: url(#hatch); }
  .band-edge { stroke: #555; stroke-width: 1; stroke-dasharray: 3 3; }
  .band-label { font-family: var(--sans); font-size: 20px; font-weight: 700; fill: var(--noise); paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
  .band-label.sig { fill: var(--ma); }
  .bracket { stroke: var(--ma); stroke-width: 2; fill: none; }
  .stage-text { font-family: var(--mono); font-size: 20px; font-weight: 700; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
  .cursor-line { stroke: var(--ink); stroke-width: 2.2; }

  @media (max-width: 720px) {
    .slide { padding: 18px 16px 12px; min-height: 0; }
    .hint { display: none; }
    input[type=range], input[type=range].narrow { width: 120px; }
  }
  .hint { display:none !important; }
  button.tb { min-width:54px; padding:9px 12px; font-size:22px; line-height:1; }
  button.primary.tb { min-width:64px; }
</style>

<div class="stage">
  <section class="slide" id="slide" tabindex="0" aria-live="polite">
    <div class="head">
      <h1 id="title"></h1>
      <p id="subtitle"></p>
      <pre class="code" id="code" hidden></pre>
    </div>
    <div class="chart-wrap">
      <svg class="chart" id="chart" viewBox="0 0 1584 730" role="img" aria-label="Speech recording with added noise: time trace, spectrum, filter responses and the filtered result"></svg>
      <div class="tt" id="tt"></div>
    </div>
    <div class="foot">
      <span>CS328 &nbsp;·&nbsp; Sensor Data Smoothing and Filtering</span>
      <span class="ctr" id="counter"></span>
    </div>
  </section>

  <div class="bar">
   <div class="row">
    <div class="group">
      <button id="prev" class="tb" title="Previous step (←)">⏮</button>
      <button id="play" class="primary tb" title="Play / pause (space)">▶</button>
      <button id="next" class="tb" title="Next step (→)">⏭</button>
      <button id="restart" class="tb" title="Restart this step (r)">↺</button>
      <button id="reset" title="Clear your dial changes and use the presets">Reset dials</button>
    </div>
    <div class="group">
      <label for="speed">Speed</label>
      <select id="speed">
        <option value="4">very slow</option>
        <option value="2">slow</option>
        <option value="1" selected>normal</option>
        <option value="0.5">fast</option>
        <option value="0">instant</option>
      </select>
    </div>
    <div class="group">
      <button id="playNoisy" title="Listen to the noisy recording">▶ Play noisy</button>
      <button id="playFilt" title="Listen to the filtered recording (current dial values)">▶ Play filtered</button>
    </div>
   </div>
   <div class="row dials">
    <div class="group">
      <label for="hp">High-pass cutoff</label>
      <input type="range" id="hp" class="narrow" min="50" max="500" step="10" value="200">
      <span class="val" id="hpval">200 Hz</span>
    </div>
    <div class="group">
      <label for="lp">Low-pass cutoff</label>
      <input type="range" id="lp" class="narrow" min="1000" max="7000" step="100" value="3400">
      <span class="val" id="lpval">3400 Hz</span>
    </div>
   </div>
  </div>
</div>

<script>
// Butterworth IIR design + filtering, mirroring scipy.signal.butter / lfilter / filtfilt.
// Design path: analog Butterworth prototype (zpk) -> lp2lp / lp2hp / lp2bp / lp2bs -> bilinear -> SOS.
// Usage:
//   const sos = butter(4, 100, 1000, 'lowpass');            // cutoff Hz, fs Hz
//   const sos = butter(4, [58, 62], 1000, 'bandstop');
//   const y = sosfilt(sos, x);                              // causal (lfilter)
//   const y = sosfiltfilt(sos, x);                          // zero-phase (filtfilt)
//   const mag = sosFreqz(sos, fHz, fs);                     // |H| at one frequency
(function (global) {
  // ---- minimal complex arithmetic
  const C = (re, im = 0) => ({ re, im });
  const cadd = (a, b) => C(a.re + b.re, a.im + b.im);
  const csub = (a, b) => C(a.re - b.re, a.im - b.im);
  const cmul = (a, b) => C(a.re * b.re - a.im * b.im, a.re * b.im + a.im * b.re);
  const cdiv = (a, b) => { const d = b.re * b.re + b.im * b.im; return C((a.re * b.re + a.im * b.im) / d, (a.im * b.re - a.re * b.im) / d); };
  const csqrt = a => { const r = Math.hypot(a.re, a.im); const re = Math.sqrt(Math.max(0, (r + a.re) / 2)); const im = Math.sign(a.im || 1) * Math.sqrt(Math.max(0, (r - a.re) / 2)); return C(re, im); };
  const cscale = (a, s) => C(a.re * s, a.im * s);

  function buttap(N) { // analog prototype poles, unit cutoff
    const p = [];
    for (let k = 1; k <= N; k++) { const th = Math.PI * (2 * k - 1) / (2 * N); p.push(C(-Math.sin(th), Math.cos(th))); }
    return { z: [], p, k: 1 };
  }
  function lp2lp(zpk, wo) { return { z: zpk.z.map(v => cscale(v, wo)), p: zpk.p.map(v => cscale(v, wo)), k: zpk.k * Math.pow(wo, zpk.p.length - zpk.z.length) }; }
  function lp2hp(zpk, wo) {
    const z = zpk.z.map(v => cdiv(C(wo), v)), p = zpk.p.map(v => cdiv(C(wo), v));
    const deg = zpk.p.length - zpk.z.length;
    for (let i = 0; i < deg; i++) z.push(C(0));
    let num = C(1), den = C(1);
    zpk.z.forEach(v => { num = cmul(num, cscale(v, -1)); });
    zpk.p.forEach(v => { den = cmul(den, cscale(v, -1)); });
    const kk = cdiv(num, den);
    return { z, p, k: zpk.k * kk.re };
  }
  function lp2bp(zpk, wo, bw) {
    const deg = zpk.p.length - zpk.z.length;
    const tr = v => { const s = cscale(v, bw / 2); const r = csqrt(csub(cmul(s, s), C(wo * wo))); return [cadd(s, r), csub(s, r)]; };
    const z = [], p = [];
    zpk.z.forEach(v => z.push(...tr(v)));
    zpk.p.forEach(v => p.push(...tr(v)));
    for (let i = 0; i < deg; i++) z.push(C(0));
    return { z, p, k: zpk.k * Math.pow(bw, deg) };
  }
  function lp2bs(zpk, wo, bw) {
    const deg = zpk.p.length - zpk.z.length;
    const tr = v => { const s = cdiv(C(bw / 2), v); const r = csqrt(csub(cmul(s, s), C(wo * wo))); return [cadd(s, r), csub(s, r)]; };
    const z = [], p = [];
    zpk.z.forEach(v => z.push(...tr(v)));
    zpk.p.forEach(v => p.push(...tr(v)));
    for (let i = 0; i < deg; i++) { z.push(C(0, wo)); z.push(C(0, -wo)); }
    let num = C(1), den = C(1);
    zpk.z.forEach(v => { num = cmul(num, cscale(v, -1)); });
    zpk.p.forEach(v => { den = cmul(den, cscale(v, -1)); });
    const kk = cdiv(num, den);
    return { z, p, k: zpk.k * kk.re };
  }
  function bilinear(zpk, fs) {
    const fs2 = 2 * fs;
    const deg = zpk.p.length - zpk.z.length;
    const tr = v => cdiv(cadd(C(fs2), v), csub(C(fs2), v));
    const z = zpk.z.map(tr), p = zpk.p.map(tr);
    for (let i = 0; i < deg; i++) z.push(C(-1));
    let num = C(1), den = C(1);
    zpk.z.forEach(v => { num = cmul(num, csub(C(fs2), v)); });
    zpk.p.forEach(v => { den = cmul(den, csub(C(fs2), v)); });
    const kk = cdiv(num, den);
    return { z, p, k: zpk.k * kk.re };
  }
  // pair conjugates -> second-order sections [b0,b1,b2,a0,a1,a2]
  function zpk2sos(zpk) {
    const pairUp = arr => {
      const rest = arr.slice(); const pairs = [];
      while (rest.length) {
        const a = rest.shift();
        if (Math.abs(a.im) < 1e-9) { // real: pair with the nearest real
          let j = rest.findIndex(v => Math.abs(v.im) < 1e-9);
          if (j >= 0) { pairs.push([a, rest.splice(j, 1)[0]]); } else pairs.push([a]);
        } else {
          let j = rest.findIndex(v => Math.abs(v.re - a.re) < 1e-7 && Math.abs(v.im + a.im) < 1e-7);
          if (j >= 0) { pairs.push([a, rest.splice(j, 1)[0]]); } else pairs.push([a, C(a.re, -a.im)]);
        }
      }
      return pairs;
    };
    const poly = pr => { // (x - r1)(x - r2) -> real coefficients [1, c1, c2]
      if (pr.length === 1) return [1, -pr[0].re, 0];
      const s = cadd(pr[0], pr[1]), m = cmul(pr[0], pr[1]);
      return [1, -s.re, m.re];
    };
    // sort poles by closeness to the unit circle so each section pairs zeros nearby (stability of cascade)
    const P = zpk.p.slice().sort((a, b) => Math.hypot(b.re, b.im) - Math.hypot(a.re, a.im));
    const Z = zpk.z.slice();
    const pp = pairUp(P);
    const sos = [];
    pp.forEach((pair, idx) => {
      // choose the zero(s) nearest this pole pair
      const zs = [];
      for (let n = 0; n < pair.length && Z.length; n++) {
        let best = 0, bd = Infinity;
        Z.forEach((v, j) => { const d = Math.hypot(v.re - pair[0].re, Math.abs(v.im) - Math.abs(pair[0].im)); if (d < bd) { bd = d; best = j; } });
        const zz = Z.splice(best, 1)[0];
        zs.push(zz);
        if (Math.abs(zz.im) > 1e-9) { // also remove its conjugate
          const cj = Z.findIndex(v => Math.abs(v.re - zz.re) < 1e-7 && Math.abs(v.im + zz.im) < 1e-7);
          if (cj >= 0) { zs.push(Z.splice(cj, 1)[0]); n++; }
        }
      }
      const b = zs.length ? poly(zs) : [1, 0, 0];
      const a = poly(pair);
      const g = idx === 0 ? zpk.k : 1;
      sos.push([b[0] * g, b[1] * g, b[2] * g, a[0], a[1], a[2]]);
    });
    return sos;
  }

  function butter(N, cutoffHz, fs, btype = 'lowpass') {
    const warp = f => 2 * fs * Math.tan(Math.PI * f / fs);
    let zpk = buttap(N);
    if (btype === 'lowpass') zpk = lp2lp(zpk, warp(cutoffHz));
    else if (btype === 'highpass') zpk = lp2hp(zpk, warp(cutoffHz));
    else {
      const w1 = warp(cutoffHz[0]), w2 = warp(cutoffHz[1]);
      const bw = w2 - w1, wo = Math.sqrt(w1 * w2);
      zpk = btype === 'bandpass' ? lp2bp(zpk, wo, bw) : lp2bs(zpk, wo, bw);
    }
    return zpk2sos(bilinear(zpk, fs));
  }

  function sosfilt(sos, x, zi) { // direct form II transposed, per section
    let y = Float64Array.from(x);
    const st = zi || sos.map(() => [0, 0]);
    sos.forEach(([b0, b1, b2, a0, a1, a2], s) => {
      const z = st[s]; const out = new Float64Array(y.length);
      for (let n = 0; n < y.length; n++) {
        const xn = y[n];
        const yn = b0 * xn + z[0];
        z[0] = b1 * xn - a1 * yn + z[1];
        z[1] = b2 * xn - a2 * yn;
        out[n] = yn;
      }
      y = out;
    });
    return y;
  }
  // steady-state initial conditions for a step of amplitude 1 (like scipy sosfilt_zi)
  function sosfiltZi(sos) {
    let scale = 1;
    return sos.map(([b0, b1, b2, a0, a1, a2]) => {
      // solve for zi such that output is constant for constant input (scale)
      const g = (b0 + b1 + b2) / (1 + a1 + a2); // dc gain of this section
      const z0 = scale * ((b1 - a1 * b0) + (b2 - a2 * b0)) / (1 + a1 + a2) * 1; // approx via steady state
      // exact: z1 = scale*(b2 - a2*b0)... use the standard linear solve
      // Steady state: y = g*scale; z0 = y - b0*scale; z1 = z0 - (b1*scale - a1*y)
      const y = g * scale;
      const zz0 = y - b0 * scale;
      const zz1 = zz0 - (b1 * scale - a1 * y);
      scale = y;
      return [zz0, zz1];
    });
  }
  function sosfiltfilt(sos, x) {
    const n = x.length;
    const pad = Math.min(n - 1, 3 * 3 * sos.length); // ~ 3 * (order) samples (scipy: 3*max(len(a),len(b)))
    // odd extension
    const ext = new Float64Array(n + 2 * pad);
    for (let i = 0; i < pad; i++) ext[i] = 2 * x[0] - x[pad - i];
    for (let i = 0; i < n; i++) ext[pad + i] = x[i];
    for (let i = 0; i < pad; i++) ext[pad + n + i] = 2 * x[n - 1] - x[n - 2 - i];
    const zi = sosfiltZi(sos);
    let y = sosfilt(sos, ext, zi.map(z => [z[0] * ext[0], z[1] * ext[0]]));
    y.reverse();
    y = sosfilt(sos, y, zi.map(z => [z[0] * y[0], z[1] * y[0]]));
    y.reverse();
    return y.slice(pad, pad + n);
  }
  function sosFreqz(sos, fHz, fs) { // magnitude response at a frequency (Hz)
    const w = 2 * Math.PI * fHz / fs;
    const e1 = C(Math.cos(-w), Math.sin(-w)), e2 = C(Math.cos(-2 * w), Math.sin(-2 * w));
    let H = C(1);
    sos.forEach(([b0, b1, b2, a0, a1, a2]) => {
      const num = cadd(C(b0), cadd(cscale(e1, b1), cscale(e2, b2)));
      const den = cadd(C(a0), cadd(cscale(e1, a1), cscale(e2, a2)));
      H = cmul(H, cdiv(num, den));
    });
    return Math.hypot(H.re, H.im);
  }
  function sosPhase(sos, fHz, fs) {
    const w = 2 * Math.PI * fHz / fs;
    const e1 = C(Math.cos(-w), Math.sin(-w)), e2 = C(Math.cos(-2 * w), Math.sin(-2 * w));
    let H = C(1);
    sos.forEach(([b0, b1, b2, a0, a1, a2]) => {
      const num = cadd(C(b0), cadd(cscale(e1, b1), cscale(e2, b2)));
      const den = cadd(C(a0), cadd(cscale(e1, a1), cscale(e2, a2)));
      H = cmul(H, cdiv(num, den));
    });
    return Math.atan2(H.im, H.re);
  }

  // ---- real FFT magnitude (radix-2, zero-padded), returns {f, mag} one-sided, mag scaled 2/N
  function rfftMag(x, fs) {
    let N = 1; while (N < x.length) N <<= 1;
    const re = new Float64Array(N), im = new Float64Array(N);

// Pure signal code for the page (no DOM): decoding, the added noise, envelopes, spectra, the filter chain
// and the playback samples. Exposed as SpeechDSP so it can be exercised outside the browser.
(function (global) {
  const B = global.Butter;
  function decode(b64) { // base64 -> signed 8-bit -> /127 -> Float32Array, mean removed (the 8-bit clip has a DC offset)
    const s = atob(b64), n = s.length, out = new Float32Array(n);
    let mean = 0;
    for (let i = 0; i < n; i++) { let v = s.charCodeAt(i); if (v > 127) v -= 256; out[i] = v / 127; mean += out[i]; }
    mean /= n;
    for (let i = 0; i < n; i++) out[i] -= mean;
    return out;
  }
  function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
  function gauss(r) { const u = 1 - r(), v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
  // added noise: low rumble (white noise low-passed at 120 Hz, rms 0.08, like a fan or handling noise) + hiss (white, sigma 0.03, high-passed at 4 kHz)
  function addNoise(clean, fs) {
    const n = clean.length, r = rng(328);
    const white = new Float64Array(n); for (let i = 0; i < n; i++) white[i] = gauss(r);
    const hiss = B.sosfiltfilt(B.butter(4, 4000, fs, 'highpass'), white);
    const white2 = new Float64Array(n); for (let i = 0; i < n; i++) white2[i] = gauss(r);
    const rumble = B.sosfiltfilt(B.butter(4, 120, fs, 'lowpass'), white2);
    let rr = 0; for (let i = 0; i < n; i++) rr += rumble[i] * rumble[i]; rr = Math.sqrt(rr / n);
    const noise = new Float64Array(n), noisy = new Float64Array(n);
    for (let i = 0; i < n; i++) {
      noise[i] = 0.08 * rumble[i] / rr + 0.03 * hiss[i];
      noisy[i] = clean[i] + noise[i];
    }
    return { noise, noisy };
  }
  // min/max per pixel column for drawing the full waveform
  function envelope(x, cols) {
    const n = x.length, mn = new Float32Array(cols), mx = new Float32Array(cols);
    for (let c = 0; c < cols; c++) {
      const a = Math.floor(c * n / cols), b = Math.max(a + 1, Math.floor((c + 1) * n / cols));
      let lo = Infinity, hi = -Infinity;
      for (let i = a; i < b && i < n; i++) { if (x[i] < lo) lo = x[i]; if (x[i] > hi) hi = x[i]; }
      mn[c] = lo; mx[c] = hi;
    }
    return { mn, mx };
  }
  // Hann-windowed |X(f)| in dB (amplitude 1 sinusoid = 0 dB)
  function specDb(x, fs) {
    const n = x.length, w = new Float64Array(n);
    for (let i = 0; i < n; i++) w[i] = x[i] * (0.5 - 0.5 * Math.cos(2 * Math.PI * i / (n - 1)));
    const { f, mag } = B.rfftMag(w, fs);
    const db = new Float64Array(f.length);
    for (let k = 0; k < f.length; k++) db[k] = 20 * Math.log10(2 * mag[k] + 1e-12);
    return { f, db, binHz: f[1] };
  }

</script>
<script>
(() => {
  const B = window.Butter, D = window.SpeechDSP;
  const FS = window.SPEECH.fs, DUR = 3;
  const clean = D.decode(window.SPEECH.b64);
  const N = clean.length;
  const { noise, noisy } = D.addNoise(clean, FS);

  // ------------------------------------------------------------ layout
  const W = 1584, H = 730;
  const X0 = 84, X1 = W - 80, COLS = X1 - X0;
  const T = { y0: 44, y1: 318 }, S = { y0: 414, y1: 682 };
  const YR = 1.25, FMAX = 8000, DBLO = -95, DBHI = 5;
  const svgNS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs = {}, parent) => { const n = document.createElementNS(svgNS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; };
  const ty = v => (T.y0 + T.y1) / 2 - (v / YR) * (T.y1 - T.y0) / 2;
  const fx = f => X0 + (f / FMAX) * COLS;
  const sy = db => S.y1 - ((Math.max(DBLO, Math.min(DBHI, db)) - DBLO) / (DBHI - DBLO)) * (S.y1 - S.y0);

  // ------------------------------------------------------------ signals
  const envNoisy = D.envelope(noisy, COLS);
  const specNoisy = D.specDb(noisy, FS);
  const pNoise = D.power(noise), snrIn = D.snrDb(clean, noisy);
  const PRESET = { hp: 200, lp: 3400 };
  let hp = PRESET.hp, lp = PRESET.lp;
  const dirty = { hp: false, lp: false };
  let cur = null; // filtered result for the current dial values
  function recompute() {
    if (cur && cur.hp === hp && cur.lp === lp) return;
    const c = D.chain(noisy, hp, lp, FS);
    const nf = D.chain(noise, hp, lp, FS).y;
    cur = { hp, lp, sosHP: c.sosHP, sosLP: c.sosLP, y: c.y, env: D.envelope(c.y, COLS), spec: D.specDb(c.y, FS),
            snrOut: D.snrDb(clean, c.y), noiseLeft: 100 * D.power(nf) / pNoise };
  }

  // ------------------------------------------------------------ steps
  const P = v => `<b class="p">${v}</b>`;
  const tag = () => `HP ${hp} Hz · LP ${lp} Hz`;
  const STEPS = [
    { id: 'raw', dur: 3, title: 'Speech recording with added noise', tag: () => '',
      subtitle: '' },
    { id: 'spec', dur: 3, title: 'Spectrum of the noisy recording', tag: () => '',
      subtitle: '' },
    { id: 'design', dur: 4, title: 'Designing the filters from the spectrum', tag,
      subtitle: '',
      code: () => p < 0.5 ? `b_hp, a_hp = butter(4, ${P(hp)}, btype='highpass', fs=${FS})`
                          : `b_lp, a_lp = butter(4, ${P(lp)}, btype='lowpass', fs=${FS})` },
    { id: 'result', dur: 3, title: 'Filtered recording', tag,
      subtitle: '',
      code: () => `y = filtfilt(b_lp, a_lp, filtfilt(b_hp, a_hp, x))    <span class="k"># high-pass ${P(hp)} Hz, then low-pass ${P(lp)} Hz</span>` },
  ];
  const txt = v => typeof v === 'function' ? v() : v;

  // ------------------------------------------------------------ static frame
  const $ = id => document.getElementById(id);
  const chart = $('chart');
  let G = {};
  function drawFrame(withSpec) {
    chart.innerHTML = '';
    const defs = el('defs', {}, chart);
    const pat = el('pattern', { id: 'hatch', width: 8, height: 8, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' }, defs);
    el('rect', { width: 8, height: 8, fill: 'rgba(235,104,52,0.10)' }, pat);
    el('line', { x1: 0, y1: 0, x2: 0, y2: 8, stroke: 'rgba(235,104,52,0.45)', 'stroke-width': 1.2 }, pat);
    const grid = el('g', { class: 'grid' }, chart), axis = el('g', { class: 'axis' }, chart);
    // time panel
    el('text', { x: X0, y: T.y0 - 12, class: 'ptitle' }, chart).textContent = 'time domain';
    [-1, -0.5, 0, 0.5, 1].forEach(v => {
      el('line', { x1: X0, x2: X1, y1: ty(v), y2: ty(v) }, grid);
      el('text', { x: X0 - 8, y: ty(v) + 4, 'text-anchor': 'end' }, axis).textContent = v;
    });
    for (let s = 0; s <= DUR + 1e-9; s += 0.5) {
      const x = X0 + (s / DUR) * COLS;
      el('line', { x1: x, x2: x, y1: T.y0, y2: T.y1 }, grid);
      el('text', { x, y: T.y1 + 18, 'text-anchor': 'middle' }, axis).textContent = s.toFixed(1);
    }
    el('path', { d: `M${X0},${T.y0}V${T.y1}H${X1}` }, axis);
    el('text', { x: X1, y: T.y1 + 40, class: 'axis-title', 'text-anchor': 'end' }, chart).textContent = 'time (s)';
    el('text', { class: 'axis-title', 'text-anchor': 'middle', transform: `translate(${X0 - 58}, ${(T.y0 + T.y1) / 2}) rotate(-90)` }, chart).textContent = 'amplitude';
    // spectrum panel (absent on the first step)
    if (withSpec) {
      el('text', { x: X0, y: S.y0 - 12, class: 'ptitle' }, chart).textContent = 'frequency domain (FFT)';
      for (let db = -80; db <= 0; db += 20) {
        el('line', { x1: X0, x2: X1, y1: sy(db), y2: sy(db) }, grid);
        el('text', { x: X0 - 8, y: sy(db) + 4, 'text-anchor': 'end' }, axis).textContent = db;
      }
      for (let f = 0; f <= FMAX; f += 1000) {
        el('line', { x1: fx(f), x2: fx(f), y1: S.y0, y2: S.y1 }, grid);
        el('text', { x: fx(f), y: S.y1 + 18, 'text-anchor': 'middle' }, axis).textContent = f / 1000;
      }
      el('path', { d: `M${X0},${S.y0}V${S.y1}H${X1}` }, axis);
      el('text', { x: X1, y: S.y1 + 40, class: 'axis-title', 'text-anchor': 'end' }, chart).textContent = 'frequency (kHz)';
      el('text', { class: 'axis-title', 'text-anchor': 'middle', transform: `translate(${X0 - 58}, ${(S.y0 + S.y1) / 2}) rotate(-90)` }, chart).textContent = 'magnitude (dB)';
    }
    G.specBands = el('g', {}, chart);
    G.specLines = el('g', {}, chart);
    G.specLabels = el('g', {}, chart);
    G.stage = el('g', {}, chart);
    G.timeLines = el('g', {}, chart);
    G.cursor = el('g', {}, chart);
    G.legT = el('g', { class: 'lg' }, chart);
    G.legS = el('g', { class: 'lg' }, chart);
    G.readout = el('g', {}, chart);
    G.hover = el('g', {}, chart);
    el('rect', { x: X0, y: T.y0, width: COLS, height: T.y1 - T.y0, fill: 'transparent', 'data-panel': 'time' }, chart);
    if (withSpec) el('rect', { x: X0, y: S.y0, width: COLS, height: S.y1 - S.y0, fill: 'transparent', 'data-panel': 'spec' }, chart);
  }

  // ------------------------------------------------------------ drawing helpers
  // waveform as a min/max envelope polygon, up to `upto` pixel columns
  function drawWave(env, upto, color, opacity) {
    if (upto < 1) return;
    let d = '';
    for (let c = 0; c < upto; c++) d += (c ? 'L' : 'M') + (X0 + c) + ',' + ty(env.mx[c]).toFixed(1);
    for (let c = upto - 1; c >= 0; c--) d += 'L' + (X0 + c) + ',' + ty(env.mn[c]).toFixed(1);
    el('path', { class: 'wave', d: d + 'Z', fill: color, stroke: color, opacity }, G.timeLines);
  }
  // per-column max of a dB spectrum, columns c0..c1 (inclusive)
  function specPath(spec, c0, c1) {
    let d = '';
    for (let c = c0; c <= c1 && c <= COLS; c++) {
      const fA = (c / COLS) * FMAX, fB = ((c + 1) / COLS) * FMAX;
      const kA = Math.floor(fA / spec.binHz), kB = Math.max(kA + 1, Math.floor(fB / spec.binHz));
      let m = -Infinity; for (let k = kA; k < kB && k < spec.db.length; k++) m = Math.max(m, spec.db[k]);
      d += (d ? 'L' : 'M') + (X0 + c).toFixed(1) + ',' + sy(m).toFixed(1);
    }
    return d;
  }
  function respPath(sos, lim) {
    let d = '';
    for (let c = 0; c <= lim && c <= COLS; c++) {
      const f = Math.max(0.5, (c / COLS) * FMAX);
      const db = 20 * Math.log10(B.sosFreqz(sos, f, FS) + 1e-12);
      d += (d ? 'L' : 'M') + (X0 + c).toFixed(1) + ',' + sy(db).toFixed(1);
    }
    return d;
  }
  const BANDS = [
    { lo: 0, hi: 200, lines: ['low rumble', 'below 200 Hz'], x: fx(200) + 8, y: S.y0 + 44 },
    { lo: 4000, hi: FMAX, lines: ['hiss above 4 kHz'], x: fx(4000) + 10, y: S.y0 + 130 },
  ];
  const SPEECH = { lo: 300, hi: 3400 };
  // noise bands (hatched) and the speech band bracket, revealed up to frequency `upF`
  function drawBands(upF) {
    BANDS.forEach(b => {
      if (upF <= b.lo) return;
      const hi = Math.min(b.hi, upF);
      el('rect', { class: 'band', x: fx(b.lo), y: S.y0, width: fx(hi) - fx(b.lo), height: S.y1 - S.y0 }, G.specBands);
      if (b.lo > 0) el('line', { class: 'band-edge', x1: fx(b.lo), x2: fx(b.lo), y1: S.y0, y2: S.y1 }, G.specBands);
      if (b.hi < FMAX && upF >= b.hi) el('line', { class: 'band-edge', x1: fx(b.hi), x2: fx(b.hi), y1: S.y0, y2: S.y1 }, G.specBands);
      if (upF >= b.hi) b.lines.forEach((s, i) => { el('text', { class: 'band-label', x: b.x, y: b.y + 24 * i }, G.specLabels).textContent = s; });
    });
    if (upF > SPEECH.lo) {
      const a = fx(SPEECH.lo), bx = fx(Math.min(SPEECH.hi, upF)), y = S.y0 + 20;
      el('path', { class: 'bracket', d: `M${a},${y + 8}V${y}H${bx}` + (upF >= SPEECH.hi ? `V${y + 8}` : '') }, G.specLabels);
      if (upF >= SPEECH.hi) el('text', { class: 'band-label sig', x: fx(SPEECH.hi) - 8, y: S.y0 + 46, 'text-anchor': 'end' }, G.specLabels).textContent = 'speech band 300–3400 Hz';
    }
  }
  // the spectrum trace up to column `lim`; the parts inside noise bands repainted orange-red
  function drawSpectrum(spec, lim, color, width, opacity, paintBands) {
    el('path', { class: 'spec-line', d: specPath(spec, 0, lim), stroke: color, 'stroke-width': width, opacity }, G.specLines);
    if (!paintBands) return;
    BANDS.forEach(b => {
      const c0 = Math.floor(b.lo / FMAX * COLS), c1 = Math.min(lim, Math.ceil(b.hi / FMAX * COLS));
      if (c1 > c0) el('path', { class: 'spec-line', d: specPath(spec, c0, c1), stroke: 'var(--noise)', 'stroke-width': width + 0.3 }, G.specLines);
    });
  }
  function stageList(n) {
    const rows = [[`1  high-pass ${hp} Hz`, 'var(--hp)'], [`2  low-pass ${lp} Hz`, 'var(--lp)']];
    for (let i = 0; i < n; i++) el('text', { class: 'stage-text', x: X1 - 10, y: S.y0 + 32 + 28 * i, 'text-anchor': 'end', fill: rows[i][1] }, G.stage).textContent = rows[i][0];
  }
  // legend as one row on the panel-title line: swatch + name
  function legendRow(group, x0, y, items) {
    let x = x0; const sw = 22;
    items.forEach(it => {
      if (it.box) el('rect', { x, y: y - 12, width: sw, height: 14, fill: 'rgba(235,104,52,0.18)', stroke: 'var(--noise)', 'stroke-width': .8 }, group);
      else el('line', { x1: x, x2: x + sw, y1: y - 6, y2: y - 6, stroke: it.color, 'stroke-width': it.dash ? 2.5 : 4, 'stroke-dasharray': it.dash ? '6 4' : 'none' }, group);
      const t = el('text', { x: x + sw + 8, y }, group); t.textContent = it.label;
      const tw = (t.getComputedTextLength && t.getComputedTextLength()) || it.label.length * 11;
      x += sw + 8 + tw + 26;
    });
  }
  function readout() {
    const t = el('text', { x: X1, y: T.y0 - 12, class: 'anno', 'text-anchor': 'end', fill: 'var(--ma)', 'font-weight': '700' }, G.readout);
    t.textContent = `SNR ${snrIn.toFixed(1)} dB → ${cur.snrOut.toFixed(1)} dB · noise power left ${cur.noiseLeft < 1 ? cur.noiseLeft.toFixed(2) : cur.noiseLeft.toFixed(1)} %`;
  }

  // ------------------------------------------------------------ state
  let step = 0, p = 0, playing = false, raf = 0, lastT = 0, mult = 1, codePhase = -1;
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function render() {
    const d = STEPS[step];
    ['specBands', 'specLines', 'specLabels', 'stage', 'timeLines', 'legT', 'legS', 'readout'].forEach(k => { G[k].innerHTML = ''; });
    const lim = Math.floor(p * COLS);
    // time panel
    if (d.id === 'raw') drawWave(envNoisy, Math.max(1, lim), 'var(--clean)', 1);
    else if (d.id !== 'result') drawWave(envNoisy, COLS, 'var(--clean)', 1);
    else { drawWave(envNoisy, COLS, 'var(--raw)', .5); drawWave(cur.env, Math.max(1, lim), 'var(--ma)', 1); }
    legendRow(G.legT, X0 + 160, T.y0 - 12, d.id !== 'result' ? [{ label: 'noisy recording', color: 'var(--clean)' }]
      : [{ label: 'noisy recording', color: 'var(--raw)' }, { label: `filtered`, color: 'var(--ma)' }]);
    if (d.id === 'result' && p >= 1) readout();
    // spectrum panel
    if (d.id === 'spec') {
      drawBands(p * FMAX);
      drawSpectrum(specNoisy, lim, 'var(--clean)', 1.5, 1, true);
      legendRow(G.legS, X0 + 290, S.y0 - 12, [{ label: 'noisy recording', color: 'var(--clean)' }, { label: 'noise bands', box: true }]);
    } else if (d.id === 'design') {
      drawBands(FMAX);
      drawSpectrum(specNoisy, COLS, 'var(--clean)', 1.5, 1, true);
      const rHP = Math.min(1, p / 0.5), rLP = Math.max(0, (p - 0.5) / 0.5);
      if (rHP > 0) el('path', { class: 'resp', d: respPath(cur.sosHP, Math.floor(rHP * COLS)), stroke: 'var(--hp)', 'stroke-dasharray': '10 6' }, G.specLines);
      if (rLP > 0) el('path', { class: 'resp', d: respPath(cur.sosLP, Math.floor(rLP * COLS)), stroke: 'var(--lp)' }, G.specLines);
      stageList(rLP > 0 ? 2 : rHP > 0 ? 1 : 0);
      legendRow(G.legS, X0 + 290, S.y0 - 12, [{ label: 'noisy recording', color: 'var(--clean)' }, { label: 'noise bands', box: true },
        { label: 'high-pass |H(f)| (dashed)', color: 'var(--hp)', dash: true }, { label: 'low-pass |H(f)|', color: 'var(--lp)' }]);
      const phase = p < 0.5 ? 0 : 1; if (phase !== codePhase) { codePhase = phase; renderHead(); }
    } else if (d.id === 'result') {
      drawSpectrum(specNoisy, COLS, 'var(--raw)', 1.2, .55, false);
      drawSpectrum(cur.spec, lim, 'var(--ma)', 1.6, 1, false);
      stageList(2);
      legendRow(G.legS, X0 + 290, S.y0 - 12, [{ label: 'noisy recording', color: 'var(--raw)' }, { label: 'filtered', color: 'var(--ma)' }]);
    }
  }
  function renderHead() {
    const d = STEPS[step];
    $('title').innerHTML = txt(d.title) + `<span class="tag">${txt(d.tag)}</span>`;
    $('subtitle').textContent = txt(d.subtitle);
    const code = txt(d.code);
    $('code').hidden = !code; $('code').innerHTML = code || '';
  }

  // ------------------------------------------------------------ dials
  function setDials() {
    $('hp').value = hp; $('hpval').textContent = `${hp} Hz`;
    $('lp').value = lp; $('lpval').textContent = `${lp} Hz`;
  }
  function dialChanged() { setDials(); recompute(); renderHead(); render(); }

  // ------------------------------------------------------------ step control
  function enterStep(k, completed = false) {
    step = Math.max(0, Math.min(STEPS.length - 1, k));
    stopPlay();
    if (!dirty.hp) hp = PRESET.hp;
    if (!dirty.lp) lp = PRESET.lp;
    setDials(); recompute();
    p = 0; codePhase = -1;
    drawFrame(step >= 1);
    renderHead();
    $('counter').textContent = `${step + 1} / ${STEPS.length}`;
    try { history.replaceState(null, '', '#' + (step + 1)); } catch (_) {}
    if (completed || mult === 0 || reduceMotion) finish(); else { render(); startPlay(); }
  }
  const done = () => p >= 1;
  function finish() { stopPlay(); p = 1; render(); }
  function tick(now) {
    if (!playing) return;
    const dt = Math.max(0, Math.min(0.1, (now - lastT) / 1000)); lastT = now;
    p = Math.min(1, p + dt / (STEPS[step].dur * mult));
    render();
    if (p >= 1) { finish(); return; }
    raf = requestAnimationFrame(tick);
  }
  function startPlay() { if (done()) return; playing = true; lastT = performance.now(); $('play').textContent = '⏸'; raf = requestAnimationFrame(tick); }
  function stopPlay() { playing = false; cancelAnimationFrame(raf); $('play').textContent = '▶'; }
  function next() { if (!done()) { finish(); return; } if (step < STEPS.length - 1) enterStep(step + 1); }
  function prev() { if (step > 0) enterStep(step - 1, true); }
  function restart() { enterStep(step); }

  // ------------------------------------------------------------ playback (Web Audio)
  let actx = null, srcNode = null, playingKey = null, playStart = 0, cursorRaf = 0;
  function makeBuffer(ctx, x) {
    const buf = ctx.createBuffer(1, x.length, FS);
    buf.getChannelData(0).set(D.playbackSamples(x));
    return buf;
  }
  function updatePlayButtons() {
    $('playNoisy').textContent = playingKey === 'noisy' ? '■ Stop' : '▶ Play noisy';
    $('playFilt').textContent = playingKey === 'filt' ? '■ Stop' : '▶ Play filtered';
    $('playNoisy').classList.toggle('on', playingKey === 'noisy');
    $('playFilt').classList.toggle('on', playingKey === 'filt');
  }
  function drawCursor(t) {
    G.cursor.innerHTML = '';
    if (t == null || t < 0 || t > DUR) return;
    const x = X0 + (t / DUR) * COLS;
    el('line', { class: 'cursor-line', x1: x, x2: x, y1: T.y0, y2: T.y1 }, G.cursor);
  }
  function cursorTick() {
    if (!srcNode || !actx) { drawCursor(null); return; }
    drawCursor(actx.currentTime - playStart);
    cursorRaf = requestAnimationFrame(cursorTick);
  }
  function stopAudio() {
    if (srcNode) { const s = srcNode; srcNode = null; playingKey = null; try { s.stop(); } catch (_) {} }
    playingKey = null; cancelAnimationFrame(cursorRaf); drawCursor(null); updatePlayButtons();
  }
  function toggleAudio(key) {
    if (playingKey === key) { stopAudio(); return; }
    stopAudio();
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    recompute();
    const src = actx.createBufferSource();
    src.buffer = makeBuffer(actx, key === 'noisy' ? noisy : cur.y);
    src.connect(actx.destination);
    src.onended = () => { if (srcNode === src) { srcNode = null; playingKey = null; cancelAnimationFrame(cursorRaf); drawCursor(null); updatePlayButtons(); } };
    srcNode = src; playingKey = key; playStart = actx.currentTime;
    src.start();
    updatePlayButtons();
    cancelAnimationFrame(cursorRaf); cursorRaf = requestAnimationFrame(cursorTick);
  }

  // ------------------------------------------------------------ hover
  const tt = $('tt');
  const fmt3 = v => (Math.round(v * 1000) / 1000).toFixed(3);
  function hover(evt) {
    const panel = evt.target.getAttribute && evt.target.getAttribute('data-panel');
    if (!panel) { unhover(); return; }
    const pt = chart.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY;
    const q = pt.matrixTransform(chart.getScreenCTM().inverse());
    G.hover.innerHTML = '';
    const d = STEPS[step];
    let html = '';
    if (panel === 'time') {
      const i = Math.max(0, Math.min(N - 1, Math.round((q.x - X0) / COLS * (N - 1))));
      el('line', { class: 'crosshair', x1: q.x, x2: q.x, y1: T.y0, y2: T.y1 }, G.hover);
      html = `<div class="row"><span>t</span><b>${(i / FS).toFixed(3)} s</b></div><div class="row"><span><i class="sw" style="background:#444"></i>noisy</span><span>${fmt3(noisy[i])}</span></div>`;
      if (d.id === 'result') html += `<div class="row"><span><i class="sw" style="background:#2a78d6"></i>filtered</span><span>${fmt3(cur.y[i])}</span></div>`;
    } else {
      const f = Math.max(0, Math.min(FMAX, (q.x - X0) / COLS * FMAX));
      const spec = d.id === 'result' ? cur.spec : specNoisy, k = Math.round(f / spec.binHz);
      el('line', { class: 'crosshair', x1: q.x, x2: q.x, y1: S.y0, y2: S.y1 }, G.hover);
      html = `<div class="row"><span>f</span><b>${f.toFixed(0)} Hz</b></div><div class="row"><span>${d.id === 'result' ? 'filtered' : 'noisy'}</span><span>${Math.max(DBLO, spec.db[k]).toFixed(1)} dB</span></div>`;
      if (d.id === 'design') html += `<div class="row"><span><i class="sw" style="background:#1baf7a"></i>|H| high-pass</span><span>${(20 * Math.log10(B.sosFreqz(cur.sosHP, Math.max(0.5, f), FS) + 1e-12)).toFixed(1)} dB</span></div>` +
        `<div class="row"><span><i class="sw" style="background:#4a3aa7"></i>|H| low-pass</span><span>${(20 * Math.log10(B.sosFreqz(cur.sosLP, Math.max(0.5, f), FS) + 1e-12)).toFixed(1)} dB</span></div>`;
    }
    tt.innerHTML = html; tt.style.display = 'block';
    const wrap = chart.parentElement.getBoundingClientRect();
    const cx = evt.clientX - wrap.left, cy = evt.clientY - wrap.top;
    tt.style.left = (cx + 16 + tt.offsetWidth > wrap.width ? cx - tt.offsetWidth - 12 : cx + 16) + 'px';
    tt.style.top = Math.max(0, cy - 10) + 'px';
  }
  function unhover() { tt.style.display = 'none'; if (G.hover) G.hover.innerHTML = ''; }

  // ------------------------------------------------------------ wiring
  $('next').addEventListener('click', e => { e.stopPropagation(); next(); });
  $('prev').addEventListener('click', e => { e.stopPropagation(); prev(); });
  $('restart').addEventListener('click', e => { e.stopPropagation(); restart(); });
  $('reset').addEventListener('click', e => { e.stopPropagation(); dirty.hp = dirty.lp = false; enterStep(step); });
  $('play').addEventListener('click', e => { e.stopPropagation(); if (playing) stopPlay(); else if (done()) restart(); else startPlay(); });
  $('playNoisy').addEventListener('click', e => { e.stopPropagation(); toggleAudio('noisy'); });
  $('playFilt').addEventListener('click', e => { e.stopPropagation(); toggleAudio('filt'); });
  $('slide').addEventListener('click', () => next());
  document.addEventListener('keydown', e => {
    if (['SELECT', 'INPUT'].includes(e.target.tagName)) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
    else if (e.key === ' ') { e.preventDefault(); $('play').click(); }
    else if (e.key === 'r' || e.key === 'R') restart();
  });
  // sliders: recompute the chain and redraw at the current progress; no replay
  $('hp').addEventListener('input', e => { dirty.hp = true; hp = parseInt(e.target.value, 10); dialChanged(); });
  $('lp').addEventListener('input', e => { dirty.lp = true; lp = parseInt(e.target.value, 10); dialChanged(); });
  $('speed').addEventListener('change', e => { mult = parseFloat(e.target.value); if (mult === 0) finish(); });
  chart.addEventListener('mousemove', hover);
  chart.addEventListener('mouseleave', unhover);

  mult = parseFloat($('speed').value);
  const h = parseInt((location.hash || '').replace('#', ''), 10);
  enterStep(h >= 1 && h <= STEPS.length ? h - 1 : 0);
})();
</script>

</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aliasing and Nyquist</title>
</head>
<body>
<style>
  :root {
    color-scheme: light;
    --paper: #ffffff;
    --ink: #222222;
    --ink-2: #666666;
    --ink-3: #9a9a9a;
    --rule: #dcdcdc;
    --grid: #ececec;
    --raw: #b4b4b4;
    --raw-dot: #8c8c8c;
    --clean: #444444;
    --blue: #2a78d6;
    --ma: #2a78d6;
    --green: #1baf7a;
    --violet: #4a3aa7;
    --red: #eb6834;
    --sans: "Helvetica Neue", Helvetica, -apple-system, Arial, sans-serif;
    --mono: Menlo, "SF Mono", Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--sans); font-size: 15px; line-height: 1.4;
    padding-block: 10px 10px; padding-inline: 14px; -webkit-font-smoothing: antialiased;
  }
  .stage { max-width: 1880px; margin: 0 auto; display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 10px; height: calc(100vh - 20px); }
  .slide {
    background: var(--paper); border: 1px solid var(--rule); border-radius: 6px;
    padding: 16px 30px 8px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 6px;
    position: relative; outline: none; cursor: pointer; user-select: none;
  }
  .slide:focus-visible { box-shadow: 0 0 0 3px rgba(42,120,214,.35); }
  .head h1 { margin: 0; font-size: clamp(20px, 2.2vw, 28px); font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; line-height: 1.15; }
  .head h1 .tag {
    display: inline-block; font-family: var(--mono); font-weight: 400; font-size: 0.6em; color: var(--ink-2);
    margin-left: 10px; vertical-align: middle; background: #f4f4f4; padding: 2px 8px; border-radius: 4px;
  }
  .head h1 .tag .bad { color: var(--red); }
  .head h1 .tag .good { color: var(--green); }
  .head p { margin: 6px 0 0; color: #444; font-size: clamp(15px, 1.6vw, 18px); max-width: none; }

  .chart-wrap { position: relative; min-height: 0; height: 100%; display: flex; justify-content: center; align-items: center; }
  svg.chart { display: block; height: 100%; width: auto; max-width: 100%; max-height: 100%; overflow: visible; }
  .tt {
    position: absolute; pointer-events: none; display: none; background: #fff; border: 1px solid var(--rule);
    border-radius: 4px; padding: 6px 9px; font-family: var(--mono); font-size: 12px; color: var(--ink);
    box-shadow: 0 2px 8px rgba(0,0,0,.08); white-space: nowrap; z-index: 2;
  }
  .tt .row { display: flex; gap: 10px; justify-content: space-between; }
  .tt .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

  .foot { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--ink-3); padding-top: 6px; border-top: 1px solid var(--rule); }
  .foot .ctr { font-family: var(--mono); }

  /* ---------- control bar ---------- */
  .bar { display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; padding:9px 14px;
         border:1px solid var(--rule); border-radius:6px; background:#f6f7f9; font-size:14px; color:var(--ink); }
  .group { display:flex; align-items:center; gap:8px; }
  .group label { font-size:13px; font-weight:700; color:var(--ink); letter-spacing:0; text-transform:none; }
  .val { font-family:var(--mono); font-size:14px; font-weight:700; color:var(--ma); min-width:5ch; }
  button, select { font:inherit; font-size:14px; color:var(--ink); background:#fff; border:1px solid #9a9a9a;
                   border-radius:5px; padding:7px 13px; cursor:pointer; }
  button:hover, select:hover { border-color:var(--ink); }
  button.primary { background:var(--ma); color:#fff; border-color:var(--ma); min-width:88px; font-weight:700; }
  button:disabled { opacity:.45; cursor:default; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline:2px solid var(--ma); outline-offset:2px; }
  input[type=range] { accent-color:var(--ma); width:150px; height:30px; cursor:pointer; }
  input[type=checkbox] { accent-color:var(--ma); width:18px; height:18px; }
  .hint { margin-left:auto; color:var(--ink-2); font-size:12px; }
  .hint kbd { font-family: var(--mono); background: #fff; border: 1px solid var(--rule); border-radius: 3px; padding: 0 5px; font-size: 11px; }

  /* ---------- svg parts ---------- */
  .grid line { stroke: var(--grid); stroke-width: 1; }
  .axis line, .axis path { stroke: var(--ink-2); stroke-width: 1; fill: none; }
  .axis text { font-family: var(--mono); font-size: 12px; fill: var(--ink-2); }
  .axis-title { font-family: var(--sans); font-size: 12px; fill: var(--ink-2); }
  .true-line { fill: none; stroke: var(--blue); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
  .true-line.faded { stroke: var(--raw); stroke-width: 1.5; }
  .alias-line { fill: none; stroke: var(--red); stroke-width: 2.4; stroke-dasharray: 7 5; stroke-linejoin: round; stroke-linecap: round; }
  .alias-line.ok { stroke: var(--green); }
  .stem { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 2 3; opacity: .7; }
  .sdot { fill: var(--ink); stroke: #fff; stroke-width: 1.5; }
  .dlabel { font-family: var(--sans); font-size: 13px; font-weight: 700; paint-order: stroke; stroke: #fff; stroke-width: 3px; stroke-linejoin: round; }
  .slabel { font-family: var(--sans); font-size: 12px; fill: var(--ink-3); }
  .formula { font-family: var(--mono); font-size: 14px; fill: var(--ink); }
  .legend-box { fill: #fff; fill-opacity: .9; stroke: var(--rule); }
  .legend-text { font-family: var(--sans); font-size: 13px; fill: var(--ink); }
  .verdict { font-family: var(--sans); font-size: 17px; font-weight: 700; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
  .formula .dim { fill: var(--ink-3); }
  .crosshair { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 2 2; }

  @media (max-width: 720px) {
    .slide { padding: 18px 16px 12px; }
    .hint { display: none; }
    input[type=range] { width: 130px; }
  }
  .hint { display:none !important; }
  button.tb { min-width:44px; padding:6px 10px; font-size:17px; line-height:1; }
  button.primary.tb { min-width:52px; }
</style>

<div class="stage">
  <section class="slide" id="slide" tabindex="0" aria-live="polite">
    <div class="head">
      <h1 id="title">A continuous 7 kHz tone</h1>
      <p id="subtitle"></p>
    </div>
    <div class="chart-wrap">
      <svg class="chart" id="chart" viewBox="0 0 1200 560" role="img" aria-label="A tone, its samples, and the sinusoid fitted through the samples"></svg>
      <div class="tt" id="tt"></div>
    </div>
    <div class="foot">
      <span>CS328 &nbsp;·&nbsp; Sensor Data Smoothing and Filtering</span>
      <span class="ctr" id="counter"></span>
    </div>
  </section>

  <div class="bar">
    <div class="group">
      <button id="prev" class="tb" title="Previous step (←)">⏮</button>
      <button id="play" class="primary tb" title="Play / pause (space)">▶</button>
      <button id="next" class="tb" title="Next step (→)">⏭</button>
      <button id="restart" class="tb" title="Restart this step (r)">↺</button>
      <button id="reset" title="Clear your dial changes and restart the step">Reset dials</button>
    </div>
    <div class="group">
      <label for="fslider">Tone f</label>
      <input type="range" id="fslider" min="1000" max="15000" step="100" value="7000">
      <span class="val" id="fval">7.0 kHz</span>
    </div>
    <div class="group">
      <label for="fsslider">Sample rate</label>
      <input type="range" id="fsslider" min="4000" max="30000" step="100" value="10000">
      <span class="val" id="fsval">10.0 kHz</span>
    </div>
    <div class="group">
      <label for="aaf">Anti-alias filter</label>
      <input type="checkbox" id="aaf">
      <span class="val" id="aafval">off</span>
    </div>
    <div class="group">
      <label for="speed">Speed</label>
      <select id="speed">
        <option value="0.25">very slow</option>
        <option value="0.5">slow</option>
        <option value="1" selected>normal</option>
        <option value="2.2">fast</option>
        <option value="0">instant</option>
      </select>
    </div>
    <span class="hint"><kbd>→</kbd> finish / next &nbsp; <kbd>←</kbd> back &nbsp; <kbd>space</kbd> play &nbsp; <kbd>r</kbd> restart</span>
  </div>
</div>

<script>
(() => {
  // ------------------------------------------------------------ constants
  const T_MS = 1.0;                 // visible time span, ms
  const FINE = 100000;              // continuous-time grid, Hz
  const NFINE = Math.round(T_MS / 1000 * FINE) + 1;
  const F_WANT = 2000, A_INT = 0.7; // step 6: wanted 2 kHz tone + 0.7 × interfering tone (= tone slider)
  const FS_MIN = 4000, FS_MAX = 30000, F_MIN = 1000, F_MAX = 15000;

  const $ = id => document.getElementById(id);
  const chart = $('chart');
  const svgNS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs = {}, parent) => { const n = document.createElementNS(svgNS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; };
  const kHz = v => (v / 1000).toFixed(1) + ' kHz';

  // ------------------------------------------------------------ layout
  const W = 1200, H = 560;
  const PL = 56, PR = 170, PT = 24;
  const PLOT_H = 450; const plotBottom = PT + PLOT_H;          // 474
  const FORMULA_Y = 540;
  const xs = tms => PL + (tms / T_MS) * (W - PL - PR);
  const yLo = -1.75, yHi = 1.75;
  const ys = v => plotBottom - ((v - yLo) / (yHi - yLo)) * PLOT_H;

  // ------------------------------------------------------------ math
  const fold = (fq, fsv) => fq - Math.round(fq / fsv) * fsv;     // signed alias frequency
  const foldAbs = (fq, fsv) => Math.abs(fold(fq, fsv));
  const tone = (fq, t) => Math.sin(2 * Math.PI * fq * t);
  const sig6 = (t, filt) => tone(F_WANT, t) + (filt && f > fs / 2 ? 0 : A_INT * tone(f, t));
  const alias6 = (t, filt) => tone(fold(F_WANT, fs), t) + (filt && f > fs / 2 ? 0 : A_INT * tone(fold(f, fs), t));

  // ------------------------------------------------------------ state
  let f = 7000, fs = 10000, aaf = false;
  const dirty = { f: false, fs: false, aaf: false };
  let step = 0, p = 0, playing = false, raf = 0, lastT = 0, speedMul = 1;
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const wagonEnd = () => Math.max(F_MIN + 100, Math.min(F_MAX, Math.round(0.9 * fs / 100) * 100));

  // ------------------------------------------------------------ steps
  // preset: values a step applies to controls the user has NOT touched. sweep: which control Play animates.
  const steps = [
    {
      id: 'tone', dur: 3.0, preset: { f: 7000, fs: 10000 },
      title: () => `A continuous ${kHz(f)} tone`,
      tag: () => `f = ${kHz(f)}  ·  ${(f / 1000).toFixed(1)} cycles per ms`,
      subtitle: () => `How a continuous tone looks before it is sampled.`,
      formula: () => [`x(t) = sin(2π · f · t)`, `f = ${f} Hz,  period = ${(1000 / f).toFixed(3)} ms`]
    },
    {
      id: 'sample', dur: 3.5, preset: { f: 7000, fs: 10000 },
      title: () => `Sampling the tone at ${kHz(fs)}`,
      tag: () => `fs = ${kHz(fs)}  ·  one sample every ${(1000 / fs).toFixed(3)} ms`,
      subtitle: () => `How sampling records only the dots, not the curve between them.`,
      formula: () => [`x[n] = x(n / fs)`, `fs / f = ${(fs / f).toFixed(2)} samples per cycle`]
    },
    {
      id: 'alias', dur: 3.0, preset: { f: 7000, fs: 10000 },
      title: () => foldAbs(f, fs) === f ? `The samples determine the ${kHz(f)} tone` : `The same samples fit a ${kHz(foldAbs(f, fs))} tone`,
      tag: () => aliasTag(),
      subtitle: () => foldAbs(f, fs) === f
        ? `How the samples determine the original tone when sampling is fast enough.`
        : `How the same samples also fit a slower tone.`,
      formula: () => [`f_alias = | f − round(f / fs) · fs |`, `= | ${f} − ${Math.round(f / fs)} · ${fs} | = ${foldAbs(f, fs)} Hz`]
    },
    {
      id: 'nyquist', dur: 9.0, preset: { f: 7000, fs: FS_MIN }, sweep: 'fs',
      title: () => 'Sampling rate and the Nyquist criterion',
      tag: () => aliasTag(),
      subtitle: () => `How the sampling rate affects which tone fits the samples.`,
      formula: () => [`f_N = fs / 2 = ${kHz(fs / 2)}`, `no aliasing  ⇔  fs > 2f = ${kHz(2 * f)}`]
    },
    {
      id: 'wagon', dur: 9.0, preset: { f: F_MIN, fs: 10000 }, sweep: 'f',
      title: () => 'Apparent frequency as the tone passes Nyquist',
      tag: () => aliasTag(),
      subtitle: () => `How the apparent frequency changes as the tone rises past Nyquist.`,
      formula: () => [`apparent(f) = | f − round(f / fs) · fs |`, `f = ${kHz(f)}  →  apparent ${kHz(foldAbs(f, fs))}`]
    },
    {
      id: 'aaf', dur: 3.5, preset: { f: 7000, fs: 10000, aaf: false },
      title: () => 'Low-pass filtering before sampling',
      tag: () => `2.0 kHz + ${kHz(f)}  ·  fs = ${kHz(fs)}  ·  low-pass at f_N ${aaf ? '<span class="good">on</span>' : '<span class="bad">off</span>'}`,
      subtitle: () => `Comparing what is recorded with and without an analog low-pass before sampling.`,
      formula: () => aaf
        ? [`analog low-pass at f_N = ${kHz(fs / 2)} removes ${kHz(f)} before the ADC`, `recorded: 2.0 kHz only`]
        : [`${kHz(f)} is above f_N = ${kHz(fs / 2)}  →  recorded at ${kHz(foldAbs(f, fs))}`, `indistinguishable from a real ${kHz(foldAbs(f, fs))} tone`]
    }
  ];
  function aliasTag() {
    const fa = foldAbs(f, fs), ok = fa === f;
    return `f = ${kHz(f)}  ·  fs = ${kHz(fs)}  ·  f_N = ${kHz(fs / 2)}  ·  apparent <span class="${ok ? 'good' : 'bad'}">${kHz(fa)}${ok ? ' (correct)' : ' (alias)'}</span>`;
  }

  // ------------------------------------------------------------ static drawing
  let G = {};
  function drawStatic() {
    chart.innerHTML = '';
    const grid = el('g', { class: 'grid' }, chart);
    const axis = el('g', { class: 'axis' }, chart);
    [-1, 0, 1].forEach(v => {
      el('line', { x1: PL, x2: W - PR, y1: ys(v), y2: ys(v) }, grid);
      el('text', { x: PL - 10, y: ys(v) + 4, 'text-anchor': 'end' }, axis).textContent = v;
    });
    for (let t = 0; t <= T_MS + 1e-9; t += 0.1) {
      el('line', { x1: xs(t), x2: xs(t), y1: PT, y2: plotBottom }, grid);
      el('text', { x: xs(t), y: plotBottom + 18, 'text-anchor': 'middle' }, axis).textContent = t.toFixed(1);
    }
    el('path', { d: `M${PL},${PT}V${plotBottom}H${W - PR}` }, axis);
    el('text', { x: W - PR + 26, y: plotBottom + 18, class: 'axis-title' }, chart).textContent = 'time (ms)';
    el('text', { x: PL - 10, y: PT - 6, class: 'axis-title', 'text-anchor': 'end' }, chart).textContent = 'amplitude';

    G.curves = el('g', {}, chart);
    G.samples = el('g', {}, chart);
    G.labels = el('g', {}, chart);
    G.legend = el('g', {}, chart);
    G.formula = el('g', {}, chart);
    G.hover = el('g', {}, chart);
    el('rect', { x: PL, y: PT, width: W - PL - PR, height: PLOT_H, fill: 'transparent' }, chart);
  }

  const pathOf = (fn, frac) => {
    const n = Math.max(2, Math.round(NFINE * frac));
    let d = '';
    for (let i = 0; i < n; i++) { const tms = (i / (NFINE - 1)) * T_MS; d += (i ? 'L' : 'M') + xs(tms).toFixed(1) + ',' + ys(fn(tms / 1000)).toFixed(1); }
    return d;
  };

  // ------------------------------------------------------------ dynamic drawing
  function drawSamples(fn, count) {
    G.samples.innerHTML = '';
    const total = Math.floor(T_MS / 1000 * fs + 1e-9) + 1;
    const n = Math.min(total, count);
    for (let k = 0; k < n; k++) {
      const t = k / fs; const tms = t * 1000; if (tms > T_MS + 1e-9) break;
      const v = fn(t);
      el('line', { class: 'stem', x1: xs(tms), x2: xs(tms), y1: ys(0), y2: ys(v) }, G.samples);
      el('circle', { class: 'sdot', cx: xs(tms), cy: ys(v), r: fs > 20000 ? 3.2 : 4.2 }, G.samples);
    }
    return { drawn: n, total };
  }
  function endLabels(list) {
    G.labels.innerHTML = '';
    const L = list.slice().sort((a, b) => a.y - b.y);
    for (let j = 1; j < L.length; j++) if (L[j].y - L[j - 1].y < 16) L[j].y = L[j - 1].y + 16;
    L.forEach(o => { const t = el('text', { x: W - PR + 10, y: o.y + 4, class: 'dlabel', fill: o.color }, G.labels); t.textContent = o.text; });
  }
  function corner(text) {
    const c = el('text', { x: W - PR - 8, y: PT + 44, class: 'dlabel', fill: 'var(--ink-2)', 'text-anchor': 'end' }, G.labels); c.textContent = text;
  }
  // conventional legend, drawn on every render so it is present from the first frame and never grows
  function drawLegend(items) {
    G.legend.innerHTML = '';
    if (items.length < 2) return;
    const rowH = 20, padX = 12, padY = 9, sw = 18, gap = 8;
    const textW = Math.max(...items.map(o => o.text.length)) * 6.8;
    const bw = padX * 2 + sw + gap + textW, bh = padY * 2 + items.length * rowH - 6;
    const x0 = PL + 10, y0 = PT + 8;
    el('rect', { class: 'legend-box', x: x0, y: y0, width: bw, height: bh, rx: 4 }, G.legend);
    items.forEach((o, i) => {
      const cy = y0 + padY + i * rowH + 6;
      if (o.type === 'dot') el('circle', { cx: x0 + padX + sw / 2, cy, r: 4, fill: o.color, stroke: '#fff', 'stroke-width': 1.5 }, G.legend);
      else el('line', { x1: x0 + padX, x2: x0 + padX + sw, y1: cy, y2: cy, stroke: o.color, 'stroke-width': 3, 'stroke-dasharray': o.type === 'dash' ? '6 4' : 'none', 'stroke-linecap': 'round' }, G.legend);
      const t = el('text', { x: x0 + padX + sw + gap, y: cy + 4.5, class: 'legend-text' }, G.legend); t.textContent = o.text;
    });
  }
  function verdict(ok) {
    const t = el('text', { x: W - PR - 8, y: PT + 22, class: 'verdict', fill: ok ? 'var(--green)' : 'var(--red)', 'text-anchor': 'end' }, G.labels);
    t.textContent = ok ? 'samples identify the tone' : 'same samples, two different tones';
  }
  function drawFormula(lines) {
    G.formula.innerHTML = '';
    const t = el('text', { x: PL, y: FORMULA_Y, class: 'formula' }, G.formula);
    t.textContent = lines[0];
    if (lines[1]) { const t2 = el('text', { x: PL + Math.max(360, lines[0].length * 8.6 + 40), y: FORMULA_Y, class: 'formula dim' }, G.formula); t2.textContent = lines[1]; }
  }


  function render() {
    const d = steps[step];
    G.curves.innerHTML = ''; G.samples.innerHTML = ''; G.labels.innerHTML = '';
    const fa = fold(f, fs), ok = foldAbs(f, fs) === f;
    const yEnd = fn => ys(fn(T_MS / 1000));
    const fitColor = ok ? 'var(--green)' : 'var(--red)';
    const legend = [];
    if (d.id === 'sample') legend.push({ type: 'line', color: 'var(--blue)', text: `${kHz(f)} tone` }, { type: 'dot', color: 'var(--ink)', text: 'samples' });
    else if (d.id === 'alias' || d.id === 'nyquist' || d.id === 'wagon') legend.push(
      { type: 'line', color: ok ? 'var(--blue)' : 'var(--raw)', text: `${kHz(f)} tone (true)` },
      { type: 'dot', color: 'var(--ink)', text: 'samples' },
      { type: 'dash', color: fitColor, text: ok ? 'fitted tone (matches)' : `fitted tone (${kHz(foldAbs(f, fs))})` });
    else if (d.id === 'aaf') {
      const removed = aaf && f > fs / 2;
      legend.push({ type: 'line', color: 'var(--raw)', text: `input: 2 kHz + ${kHz(f)}` });
      if (removed) legend.push({ type: 'line', color: 'var(--blue)', text: 'after analog low-pass' });
      legend.push({ type: 'dot', color: 'var(--ink)', text: 'samples' }, { type: 'dash', color: (removed || ok) ? 'var(--green)' : 'var(--red)', text: 'fitted (recorded) signal' });
    }
    drawLegend(legend);
    if (d.id === 'tone') {
      el('path', { class: 'true-line', d: pathOf(t => tone(f, t), Math.max(0.002, p)) }, G.curves);
      if (p >= 1) endLabels([{ y: yEnd(t => tone(f, t)), text: `${kHz(f)} tone`, color: 'var(--blue)' }]);
    } else if (d.id === 'sample') {
      el('path', { class: 'true-line', d: pathOf(t => tone(f, t), 1) }, G.curves);
      const total = Math.floor(T_MS / 1000 * fs + 1e-9) + 1;
      const info = drawSamples(t => tone(f, t), Math.floor(p * total + 1e-9));
      endLabels([{ y: yEnd(t => tone(f, t)), text: `${kHz(f)} tone`, color: 'var(--blue)' }]);
      corner(`${info.drawn} / ${info.total} samples`);
    } else if (d.id === 'alias') {
      el('path', { class: 'true-line' + (ok ? '' : ' faded'), d: pathOf(t => tone(f, t), 1) }, G.curves);
      drawSamples(t => tone(f, t), 9999);
      el('path', { class: 'alias-line' + (ok ? ' ok' : ''), d: pathOf(t => tone(fa, t), Math.max(0.002, p)) }, G.curves);
      const L = [{ y: yEnd(t => tone(f, t)), text: `${kHz(f)} (true)`, color: ok ? 'var(--blue)' : 'var(--raw-dot)' }];
      if (p >= 1) L.push({ y: yEnd(t => tone(fa, t)) + 0.01, text: ok ? `${kHz(f)} fit` : `${kHz(Math.abs(fa))} fit`, color: ok ? 'var(--green)' : 'var(--red)' });
      endLabels(L);
      if (p >= 1) verdict(ok);
    } else if (d.id === 'nyquist' || d.id === 'wagon') {
      el('path', { class: 'true-line' + (ok ? '' : ' faded'), d: pathOf(t => tone(f, t), 1) }, G.curves);
      drawSamples(t => tone(f, t), 9999);
      el('path', { class: 'alias-line' + (ok ? ' ok' : ''), d: pathOf(t => tone(fa, t), 1) }, G.curves);
      endLabels([
        { y: yEnd(t => tone(f, t)), text: `${kHz(f)} (true)`, color: ok ? 'var(--blue)' : 'var(--raw-dot)' },
        { y: yEnd(t => tone(fa, t)) + 0.01, text: ok ? `${kHz(f)} fit` : `${kHz(Math.abs(fa))} fit`, color: ok ? 'var(--green)' : 'var(--red)' }
      ]);
      corner(`${(fs / f).toFixed(2)} samples per cycle`);
      verdict(ok);
    } else if (d.id === 'aaf') {
      const removed = aaf && f > fs / 2;
      el('path', { class: 'true-line faded', d: pathOf(t => sig6(t, false), 1), opacity: removed ? 0.5 : 1 }, G.curves);
      if (removed) el('path', { class: 'true-line', d: pathOf(t => sig6(t, true), 1) }, G.curves);
      drawSamples(t => sig6(t, aaf), 9999);
      const recOk = removed || ok;
      el('path', { class: 'alias-line' + (recOk ? ' ok' : ''), d: pathOf(t => alias6(t, aaf), Math.max(0.002, p)) }, G.curves);
      const L = [{ y: yEnd(t => sig6(t, false)), text: removed ? `2 + ${kHz(f)} before filter` : `2 + ${kHz(f)} (true)`, color: 'var(--raw-dot)' }];
      if (removed) L.push({ y: yEnd(t => sig6(t, true)), text: 'after low-pass: 2 kHz', color: 'var(--blue)' });
      if (p >= 1) L.push({ y: yEnd(t => alias6(t, aaf)), text: removed ? 'recorded: 2 kHz only' : (ok ? `recorded: 2 + ${kHz(f)}` : `recorded: 2 + ${kHz(foldAbs(f, fs))} alias`), color: recOk ? 'var(--green)' : 'var(--red)' });
      endLabels(L);
    }
    drawFormula(d.formula());
    $('title').innerHTML = d.title() + `<span class="tag">${d.tag()}</span>`;
    $('subtitle').textContent = d.subtitle();
  }

  // ------------------------------------------------------------ hover
  const tt = $('tt');
  function hover(evt) {
    const d = steps[step];
    const pt = chart.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY;
    const q = pt.matrixTransform(chart.getScreenCTM().inverse());
    if (q.y > plotBottom + 30 || q.y < PT || q.x < PL || q.x > W - PR) { unhover(); return; }
    const tms = Math.max(0, Math.min(T_MS, (q.x - PL) / (W - PL - PR) * T_MS));
    const t = tms / 1000;
    G.hover.innerHTML = '';
    el('line', { class: 'crosshair', x1: xs(tms), x2: xs(tms), y1: PT, y2: plotBottom }, G.hover);
    let rows = `<div class="row"><span>t</span><b>${tms.toFixed(3)} ms</b></div>`;
    if (d.id === 'aaf') {
      rows += `<div class="row"><span><i class="sw" style="background:var(--raw-dot)"></i>true signal</span><span>${sig6(t, false).toFixed(2)}</span></div>`;
      rows += `<div class="row"><span><i class="sw" style="background:${aaf ? 'var(--green)' : 'var(--red)'}"></i>reconstructed</span><span>${alias6(t, aaf).toFixed(2)}</span></div>`;
    } else {
      rows += `<div class="row"><span><i class="sw" style="background:var(--blue)"></i>${kHz(f)} tone</span><span>${tone(f, t).toFixed(2)}</span></div>`;
      if (d.id !== 'tone' && d.id !== 'sample') rows += `<div class="row"><span><i class="sw" style="background:var(--red)"></i>${kHz(foldAbs(f, fs))} fit</span><span>${tone(fold(f, fs), t).toFixed(2)}</span></div>`;
      const n = Math.round(t * fs); if (d.id !== 'tone' && Math.abs(n / fs - t) < 0.5 / fs) rows += `<div class="row"><span>nearest sample n</span><span>${n}</span></div>`;
    }
    tt.innerHTML = rows; tt.style.display = 'block';
    const wrap = chart.parentElement.getBoundingClientRect();
    const px = evt.clientX - wrap.left, py = evt.clientY - wrap.top;
    tt.style.left = (px + 16 + tt.offsetWidth > wrap.width ? px - tt.offsetWidth - 12 : px + 16) + 'px';
    tt.style.top = Math.max(0, py - 10) + 'px';
  }
  function unhover() { tt.style.display = 'none'; G.hover.innerHTML = ''; }

  // ------------------------------------------------------------ controls <-> state
  function syncControls() {
    $('fslider').value = f; $('fsslider').value = fs;
    $('fval').textContent = kHz(f); $('fsval').textContent = kHz(fs);
    $('aaf').checked = aaf; $('aafval').textContent = aaf ? 'on' : 'off';
  }
  // sweep steps: progress p <-> the swept control
  function sweepRange() {
    const d = steps[step];
    if (d.sweep === 'fs') return [FS_MIN, FS_MAX];
    if (d.sweep === 'f') return [F_MIN, wagonEnd()];
    return null;
  }
  function applyProgress() {
    const d = steps[step], r = sweepRange();
    if (!r) return;
    const v = Math.round((r[0] + p * (r[1] - r[0])) / 100) * 100;
    if (d.sweep === 'fs') fs = v; else f = v;
  }
  function progressFromControls() {
    const d = steps[step], r = sweepRange();
    if (!r) return;
    const v = d.sweep === 'fs' ? fs : f;
    p = Math.max(0, Math.min(1, (v - r[0]) / (r[1] - r[0])));
  }
  function applyPresets() {
    const pr = steps[step].preset || {};
    if ('f' in pr && !dirty.f) f = pr.f;
    if ('fs' in pr && !dirty.fs) fs = pr.fs;
    if ('aaf' in pr && !dirty.aaf) aaf = pr.aaf;
  }

  // ------------------------------------------------------------ step control
  function enterStep(k, completed = false) {
    step = k;
    $('counter').textContent = `${step + 1} / ${steps.length}`;
    $('prev').disabled = step === 0;
    try { history.replaceState(null, '', '#' + (step + 1)); } catch (_) {}
    stopPlay();
    applyPresets();
    p = 0;
    if (sweepRange()) progressFromControls();       // a dirty swept dial starts the sweep where the user left it
    if (completed || speedMul === 0 || reduceMotion) { p = 1; applyProgress(); }
    syncControls(); render();
    if (p < 1) startPlay();
  }
  function done() { return p >= 1; }
  function finish() { p = 1; stopPlay(); applyProgress(); syncControls(); render(); }
  function tick(t) {
    if (!playing) return;
    const dt = Math.min(0.1, (t - lastT) / 1000); lastT = t;
    p = Math.min(1, p + dt * speedMul / steps[step].dur);
    applyProgress(); syncControls(); render();
    if (p >= 1) { stopPlay(); return; }
    raf = requestAnimationFrame(tick);
  }
  function startPlay() { if (done()) return; playing = true; lastT = performance.now(); $('play').textContent = '⏸'; raf = requestAnimationFrame(tick); }
  function stopPlay() { playing = false; cancelAnimationFrame(raf); $('play').textContent = '▶'; }
  function next() { if (!done()) { finish(); return; } if (step < steps.length - 1) enterStep(step + 1); }
  function prev() { if (step > 0) enterStep(step - 1, true); }
  function restart() {                              // replay from the current dial values
    stopPlay(); p = 0;
    if (sweepRange()) { const r = sweepRange(); if (steps[step].sweep === 'fs') fs = r[0]; else f = r[0]; }
    syncControls(); render();
    if (speedMul === 0 || reduceMotion) finish(); else startPlay();
  }
  function resetDials() { dirty.f = dirty.fs = dirty.aaf = false; f = 7000; fs = 10000; aaf = false; enterStep(step); }

  // ------------------------------------------------------------ wiring
  $('next').addEventListener('click', e => { e.stopPropagation(); next(); });
  $('prev').addEventListener('click', e => { e.stopPropagation(); prev(); });
  $('restart').addEventListener('click', e => { e.stopPropagation(); restart(); });
  $('reset').addEventListener('click', e => { e.stopPropagation(); resetDials(); });
  $('play').addEventListener('click', e => {
    e.stopPropagation();
    if (playing) stopPlay();
    else if (done()) restart();
    else startPlay();
  });
  $('slide').addEventListener('click', () => next());
  document.addEventListener('keydown', e => {
    if (['SELECT', 'INPUT'].includes(e.target.tagName)) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
    else if (e.key === ' ') { e.preventDefault(); $('play').click(); }
    else if (e.key === 'r' || e.key === 'R') restart();
  });
  function onDial(which, value) {
    stopPlay();
    dirty[which] = true;
    if (which === 'f') f = value; else if (which === 'fs') fs = value; else aaf = value;
    const d = steps[step];
    if (d.sweep === which) progressFromControls();   // dragging the swept dial scrubs the sweep
    else if (d.sweep) { /* other dial changed mid-sweep: keep p, sweep continues from here */ }
    else p = 1;                                       // progressive-drawing steps: show the completed picture
    syncControls(); render();
  }
  $('fslider').addEventListener('input', e => onDial('f', parseInt(e.target.value, 10)));
  $('fsslider').addEventListener('input', e => onDial('fs', parseInt(e.target.value, 10)));
  $('aaf').addEventListener('change', e => onDial('aaf', e.target.checked));
  $('speed').addEventListener('change', e => { speedMul = parseFloat(e.target.value); if (speedMul === 0) finish(); });
  chart.addEventListener('mousemove', hover);
  chart.addEventListener('mouseleave', unhover);

  drawStatic();
  const h = parseInt((location.hash || '').replace('#', ''), 10);
  enterStep(h >= 1 && h <= steps.length ? h - 1 : 0);
})();
</script>

</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Building a Signal from Sinusoids</title>
</head>
<body>
<style>
  :root {
    color-scheme: light;
    --paper: #ffffff; --ink: #222222; --ink-2: #666666; --ink-3: #9a9a9a; --rule: #dcdcdc; --grid: #ececec;
    --raw: #8f8f8f; --ma: #2a78d6; --med: #1baf7a; --wm: #4a3aa7; --ewma: #eb6834;
    --c0: #2a78d6; --c1: #1baf7a; --c2: #eb6834; --c3: #4a3aa7; --c4: #c9a400;
    --c5: #d6408f; --c6: #0f8b8d; --c7: #8c5a2b; --c8: #6b7280; --c9: #e0322b;
    --sans: "Helvetica Neue", Helvetica, -apple-system, Arial, sans-serif;
    --mono: Menlo, "SF Mono", Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.4; padding-block: 10px 10px; padding-inline: 14px; -webkit-font-smoothing: antialiased; }
  .stage { max-width: 1880px; margin: 0 auto; display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 10px; height: calc(100vh - 20px); }
  .slide { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 16px 30px 8px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 6px; min-height: 0; position: relative; outline: none; cursor: pointer; user-select: none; }
  .slide:focus-visible { box-shadow: 0 0 0 3px rgba(42,120,214,.35); }
  .head h1 { margin: 0; font-size: clamp(24px, 2.4vw, 36px); font-weight: 700; letter-spacing: -0.01em; line-height: 1.15; }
  .head h1 .tag { display: inline-block; font-family: var(--mono); font-weight: 400; font-size: 0.6em; color: var(--ink-2); margin-left: 10px; vertical-align: middle; background: #f4f4f4; padding: 2px 8px; border-radius: 4px; white-space: nowrap; }
  .head p { margin: 6px 0 0; color: #444; font-size: clamp(18px, 1.7vw, 24px); max-width: none; }
  .head p:empty { display: none; }
  .head h1 .tag:empty { display: none; }
  .chart-wrap { position: relative; min-height: 0; height: 100%; display: flex; justify-content: center; align-items: center; }
  svg.chart { display: block; height: 100%; width: auto; max-width: 100%; max-height: 100%; overflow: visible; }
  .foot { position: absolute; top: 9px; right: 16px; display: flex; gap: 14px; align-items: baseline; font-size: 14px; color: var(--ink-3); padding: 0; pointer-events: none; }
  .foot .ctr { font-family: var(--mono); }
  .bar { display:flex; flex-direction:column; gap:12px; padding:12px 24px;
         border:1px solid var(--rule); border-radius:6px; background:#f6f7f9; font-size:19px; color:var(--ink); }
  .bar .row { display:flex; justify-content:flex-start; align-items:center; gap:16px 32px; flex-wrap:wrap; }
  .bar .row.dials .group { flex:1 1 0; }
  .bar .row.dials input[type=range] { flex:1 1 auto; width:auto; }
  .group { display:flex; align-items:center; gap:10px; }
  .group label { font-size:18px; font-weight:700; color:var(--ink); letter-spacing:0; text-transform:none; white-space:nowrap; }
  .val { font-family:var(--mono); font-size:19px; font-weight:700; color:var(--ma); min-width:5ch; white-space:nowrap; }
  button, select { font:inherit; font-size:18px; color:var(--ink); background:#fff; border:1px solid #9a9a9a; border-radius:6px; padding:9px 16px; cursor:pointer; }
  button:hover, select:hover { border-color:var(--ink); }
  button.primary { background:var(--ma); color:#fff; border-color:var(--ma); min-width:88px; font-weight:700; }
  button:focus-visible, select:focus-visible { outline:2px solid var(--ma); outline-offset:2px; }
  input[type=range] { -webkit-appearance:none; appearance:none; accent-color:var(--ma); width:260px; height:36px; background:transparent; cursor:pointer; }
  input[type=range]::-webkit-slider-runnable-track { height:8px; border-radius:4px; background:#c9d1dc; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:26px; height:26px; border-radius:50%; background:var(--ma); border:3px solid #fff; box-shadow:0 0 0 1.5px var(--ma); margin-top:-9px; }
  input[type=range]::-moz-range-track { height:8px; border-radius:4px; background:#c9d1dc; }
  input[type=range]::-moz-range-thumb { width:26px; height:26px; border-radius:50%; background:var(--ma); border:3px solid #fff; }
  button.tb { min-width:54px; padding:9px 12px; font-size:22px; line-height:1; }
  button.primary.tb { min-width:64px; }
  .grid line { stroke: var(--grid); stroke-width: 1.3; }
  .axis line, .axis path { stroke: var(--ink-2); stroke-width: 1.3; fill: none; }
  .axis text { font-family: var(--mono); font-size: 20px; fill: var(--ink-2); }
  .axis-title { font-family: var(--sans); font-size: 22px; fill: var(--ink-2); }
  .lane-lab { font-family: var(--mono); font-size: 20px; font-weight: 700; }
  .lane-sub { font-family: var(--sans); font-size: 20px; fill: var(--ink-2); }
  .plus { font-family: var(--sans); font-weight: 700; fill: #c8c8c8; }
  .plus.on { fill: var(--ink); }
  .lane-hi { fill: #eef4fc; }
  .trace { fill: none; stroke-width: 3.1; stroke-linejoin: round; stroke-linecap: round; }
  .faint { fill: none; stroke: var(--raw); stroke-width: 1.4; opacity: .55; }
  .stem { stroke-width: 4; stroke-linecap: round; }
  .rec { fill: none; stroke: #9a9a9a; stroke-width: 2; stroke-dasharray: 6 4; }
  .rec-stem { stroke: #c4c4c4; stroke-width: 2; }
  .stem-lab { font-family: var(--sans); font-size: 20px; font-weight: 700; }
  .fit { font-family: var(--mono); font-size: 26px; font-weight: 700; fill: var(--ink); }
  .ptitle { font-family: var(--sans); font-size: 20px; font-weight: 700; fill: var(--ink); }
  .tt { position: absolute; pointer-events: none; display: none; background: #fff; border: 1px solid var(--rule); border-radius: 4px; padding: 6px 9px; font-family: var(--mono); font-size: 15px; color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,.08); white-space: nowrap; z-index: 2; }
  @media (prefers-reduced-motion: reduce) { .fade { transition: none !important; } }
</style>

<div class="stage">
  <section class="slide" id="slide" tabindex="0" aria-live="polite">
    <div class="head">
      <h1 id="title"></h1>
      <p id="subtitle"></p>
    </div>
    <div class="chart-wrap">
      <svg class="chart" id="chart" viewBox="0 0 1320 600" role="img" aria-label="Sinusoids stacked above their sum, and the spectrum of the sum"></svg>
      <div class="tt" id="tt"></div>
    </div>
    <div class="foot">
      <span>CS328 &nbsp;·&nbsp; Sensor Data Smoothing &amp; Filtering</span>
      <span class="ctr" id="counter"></span>
    </div>
  </section>

  <div class="bar">
   <div class="row">
    <div class="group">
      <button id="prev" class="tb" title="Previous step (←)">⏮</button>
      <button id="play" class="primary tb" title="Play / pause (space)">▶</button>
      <button id="next" class="tb" title="Next step (→)">⏭</button>
      <button id="restart" class="tb" title="Restart this step (r)">↺</button>
      <button id="reset" title="Reset dials to this step's presets">Reset dials</button>
    </div>
    <div class="group">
      <label for="example">Example</label>
      <select id="example">
        <option value="walk" selected>real walking</option>
        <option value="random">random</option>
      </select>
      <button id="shuffle" title="Draw a new random set of sinusoids">New random</button>
    </div>
    <div class="group">
      <label for="speed">Speed</label>
      <select id="speed">
        <option value="0.25">very slow</option>
        <option value="0.5">slow</option>
        <option value="1" selected>normal</option>
        <option value="2">fast</option>
        <option value="0">instant</option>
      </select>
    </div>
   </div>
   <div class="row dials">
    <div class="group">
      <label for="k">Sinusoids</label>
      <input type="range" id="k" min="2" max="10" step="1" value="4">
      <span class="val" id="kVal">4</span>
    </div>
   </div>
  </div>
</div>

<script>
(() => {
'use strict';
const svgNS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const el = (tag, attrs = {}, parent) => { const n = document.createElementNS(svgNS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; };
const txt = (parent, x, y, s, attrs = {}) => { const t = el('text', Object.assign({ x, y }, attrs), parent); t.textContent = s; return t; };
const fmt = (v, d = 2) => (Math.round(v * Math.pow(10, d)) / Math.pow(10, d)).toFixed(d);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const chart = $('chart');
const COL = Array.from({ length: 10 }, (_, k) => `var(--c${k})`);

// ------------------------------------------------------------ signal
const FS = 100, DUR = 4.24, N = Math.round(FS * DUR), T = Array.from({ length: N }, (_, i) => i / FS);
let seed = 7;
function rng() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
// A real walking recording: acceleration magnitude, phone in a pocket, 50 Hz
// (CS328-Notebooks/data/inPocket-Steps/accelerometer.csv, 4.24 s = exactly five strides, starting 9 s into the walk).
const REC_FS = 50;
const REC = [18.90,20.45,19.36,13.75,11.92,11.16,6.92,5.94,7.36,9.27,9.81,8.55,8.22,9.49,14.40,20.10,16.73,16.51,20.81,19.90,20.08,21.11,16.71,9.05,6.90,4.78,4.71,4.69,4.54,5.29,4.49,4.57,5.67,8.49,6.55,7.73,13.61,14.66,16.75,16.64,25.70,28.12,19.86,18.50,18.50,12.59,11.20,10.28,7.83,6.01,6.66,9.43,9.58,8.32,9.75,9.44,13.27,20.97,19.87,19.55,23.05,23.32,19.95,20.52,13.46,7.24,6.47,7.93,7.07,7.01,5.39,5.16,5.38,5.39,9.16,8.87,7.04,12.32,12.06,11.26,16.65,20.65,24.52,22.83,19.36,17.36,15.89,13.32,11.76,10.65,10.14,7.65,6.55,6.80,6.41,7.60,8.23,9.62,11.25,12.68,15.72,18.76,21.78,20.09,20.20,21.00,17.51,10.88,9.34,7.26,7.60,6.13,5.02,5.08,5.47,5.04,6.08,6.87,8.31,6.40,10.85,11.23,10.67,17.40,20.30,29.45,23.70,20.10,21.16,19.13,15.78,11.07,6.44,6.02,5.95,8.82,9.94,8.46,8.99,9.43,12.85,15.83,18.88,20.49,20.66,19.92,19.52,20.99,20.51,12.22,8.04,7.06,6.13,5.31,4.53,4.63,5.85,5.41,5.57,6.19,5.33,6.77,8.44,9.82,8.33,14.10,14.99,25.22,25.99,19.43,22.29,19.82,16.15,17.20,12.05,8.37,6.97,7.51,8.11,7.60,8.64,8.55,9.18,11.87,18.52,20.47,21.90,20.56,19.58,19.69,18.53,11.58,7.97,8.15,8.54,6.21,3.38,3.25,4.45,5.77,4.80,5.79,5.60,5.37,7.59,10.46,11.16,17.02,14.14,27.11,28.29,19.33];
const RN = REC.length, REC_MEAN = REC.reduce((a, b) => a + b, 0) / RN;
// its Fourier series: one sinusoid per frequency k / 4.24 s, largest first; all of them together rebuild the recording exactly
const REC_SPEC = (() => {
  const out = [];
  for (let k = 1; k < RN / 2; k++) {
    let re = 0, im = 0;
    for (let n = 0; n < RN; n++) { const a = 2 * Math.PI * k * n / RN; re += REC[n] * Math.cos(a); im -= REC[n] * Math.sin(a); }
    out.push({ f: k * REC_FS / RN, A: 2 * Math.hypot(re, im) / RN, ph: Math.atan2(im, re) });
  }
  return out;
})();
const STRIDE = REC_FS / RN * 5;                               // five strides in the window
function walkComponents(K) {
  const named = f => Math.abs(f - STRIDE) < 1e-6 ? ' stride' : Math.abs(f - 2 * STRIDE) < 1e-6 ? ' step' : '';
  const top = REC_SPEC.slice().sort((a, b) => b.A - a.A).slice(0, K - 1)
    .map(c => Object.assign({}, c, { name: `${fmt(c.f, 2)} Hz`, tag: named(c.f).trim() }));
  return [{ f: 0, A: REC_MEAN, ph: 0, name: 'mean (0 Hz)' }, ...top];
}
// share of the recording's variation that a sum of sinusoids reproduces, at the recording's own sample times
function varianceExplained(ys) {
  let se = 0, st = 0;
  for (let n = 0; n < RN; n++) { const v = ys[2 * n]; se += (REC[n] - v) ** 2; st += (REC[n] - REC_MEAN) ** 2; }
  return 1 - se / st;
}
const isWalk = () => dial('example') === 'walk';
function randomComponents(K) {
  const out = [];
  const fHi = Math.max(6, 1.4 * K);                        // wider band when there are many sinusoids
  for (let k = 0; k < K; k++) {
    let f = 0;
    for (let tries = 0; tries < 50; tries++) {                // keep the stems apart on the spectrum
      f = Math.round((0.5 + rng() * (fHi - 0.5)) * 10) / 10;
      if (out.every(c => Math.abs(c.f - f) >= 0.5)) break;
    }
    out.push({ f, A: Math.round((0.4 + rng() * 1.4) * 10) / 10, ph: rng() * 2 * Math.PI });
  }
  return out.sort((a, b) => a.f - b.f);
}
let COMP = [], SUM = [];
function build() {
  const K = dial('k');
  COMP = dial('example') === 'walk' ? walkComponents(K) : randomComponents(K);
  COMP.forEach(c => { c.y = T.map(t => c.A * Math.cos(2 * Math.PI * c.f * t + c.ph)); });
  SUM = T.map((_, i) => COMP.reduce((s, c) => s + c.y[i], 0));
  // more lanes need a taller chart and a wider spectrum axis
  H = K <= 5 ? 600 : 600 + (K - 5) * 40;
  chart.setAttribute('viewBox', `0 0 ${W} ${H}`);
  FMAX = Math.max(8, Math.ceil(Math.max(...COMP.map(c => c.f)) / 2) * 2 + 2);
}
const partialSum = m => T.map((_, i) => COMP.slice(0, m).reduce((s, c) => s + c.y[i], 0));

// ------------------------------------------------------------ dials (persist unless the user touched them)
const dials = {}, dirty = {};
function defDial(id, o) {
  dials[id] = o; dirty[id] = false;
  const inp = $(id), ev = inp.tagName === 'SELECT' ? 'change' : 'input';
  inp.addEventListener(ev, e => { e.stopPropagation(); dirty[id] = true; showDial(id); onDial(id); });
  inp.addEventListener('click', e => e.stopPropagation());
  showDial(id);
}
function dial(id) { const v = $(id).value; return dials[id].parse ? dials[id].parse(v) : v; }
function showDial(id) { const o = dials[id]; if (o.val) $(o.val).textContent = o.fmt ? o.fmt(dial(id)) : $(id).value; }
function applyPresets(p, force = false) { for (const id in p || {}) if (force || !dirty[id]) { $(id).value = p[id]; showDial(id); } }
defDial('k', { val: 'kVal', parse: parseInt });
defDial('example', {});

// ------------------------------------------------------------ layout
const W = 1320; let H = 600;
const LX = 210, LW = 680;                 // stacked lanes (left)
const SX = 985, SW = 300;                 // spectrum (right)
let FMAX = 8;
function laneBoxes(K) {
  const top = 14, gap = 12, sumH = 150, bottom = 30;
  const laneH = (H - top - bottom - sumH - gap * K) / K;
  const lanes = [];
  for (let k = 0; k < K; k++) lanes.push({ x: LX, y: top + k * (laneH + gap), w: LW, h: laneH });
  return { lanes, sum: { x: LX, y: top + K * (laneH + gap), w: LW, h: sumH } };
}
const xs = t => LX + t / DUR * LW;
function yScale(box, lo, hi) { return v => box.y + box.h - (v - lo) / (hi - lo) * box.h; }
function pathOf(ys, sy, upto) { let d = ''; const n = upto == null ? N : upto; for (let i = 0; i < n; i++) d += (i ? 'L' : 'M') + xs(T[i]).toFixed(1) + ',' + sy(ys[i]).toFixed(1); return d; }

function drawLane(box, comp, k, upto, opts = {}) {
  const g = el('g', {}, chart);
  if (opts.hi) el('rect', { x: box.x - 4, y: box.y - 4, width: box.w + 8, height: box.h + 8, rx: 4, class: 'lane-hi' }, g);
  const amp = Math.max(0.5, comp.A * 1.15);
  const lo = comp.f === 0 ? comp.A - amp : -amp, hi = comp.f === 0 ? comp.A + amp : amp;
  const sy = yScale(box, lo, hi);
  el('line', { x1: box.x, x2: box.x + box.w, y1: sy(comp.f === 0 ? comp.A : 0), y2: sy(comp.f === 0 ? comp.A : 0), class: 'grid' }, el('g', { class: 'grid' }, g));
  el('path', { d: `M${box.x},${box.y}V${box.y + box.h}`, class: 'axis' }, el('g', { class: 'axis' }, g));
  const lab = comp.name || `${fmt(comp.f, 1)} Hz`;
  txt(g, box.x - 12, box.y + box.h / 2 - 4, lab, { class: 'lane-lab', fill: COL[k], 'text-anchor': 'end' });
  txt(g, box.x - 12, box.y + box.h / 2 + 15, `A = ${fmt(comp.A, comp.A < 0.1 ? 2 : 1)}`, { class: 'lane-sub', 'text-anchor': 'end' });
  if (opts.faint) el('path', { d: pathOf(comp.y, sy), class: 'faint' }, g);
  el('path', { d: pathOf(comp.y, sy, upto), class: 'trace', stroke: COL[k], opacity: opts.dim ? .25 : 1, 'stroke-width': opts.hi ? 3.2 : 2.4 }, g);
  return g;
}
function drawSum(box, ys, upto, opts = {}) {
  const g = el('g', {}, chart);
  const lo = Math.min(...SUM, ...(opts.rec ? REC : [])), hi = Math.max(...SUM, ...(opts.rec ? REC : [])), pad = 0.1 * (hi - lo || 1);
  const sy = yScale(box, lo - pad, hi + pad);
  const gr = el('g', { class: 'grid' }, g);
  const ticks = niceTicks(lo - pad, hi + pad, 4);
  const ax = el('g', { class: 'axis' }, g);
  ticks.forEach(v => { el('line', { x1: box.x, x2: box.x + box.w, y1: sy(v), y2: sy(v) }, gr); txt(ax, box.x - 10, sy(v) + 5, fmt(v, 1), { 'text-anchor': 'end' }); });
  el('path', { d: `M${box.x},${box.y}V${box.y + box.h}H${box.x + box.w}` }, ax);
  for (let t = 0; t <= Math.floor(DUR); t++) { el('line', { x1: xs(t), x2: xs(t), y1: box.y, y2: box.y + box.h }, gr); txt(ax, xs(t), box.y + box.h + 20, t, { 'text-anchor': 'middle' }); }
  txt(g, xs(Math.floor(DUR) - 0.5), box.y + box.h + 22, 'time (s)', { class: 'axis-title', 'text-anchor': 'middle' });
  txt(g, box.x - 66, box.y + box.h / 2 - 4, opts.label || 'sum', { class: 'lane-lab', fill: 'var(--ink)', 'text-anchor': 'end' });
  if (opts.sub) {
    const sp = opts.sub.indexOf(' ');
    const lines = opts.sub.length > 14 && sp > 0 ? [opts.sub.slice(0, sp), opts.sub.slice(sp + 1)] : [opts.sub];
    lines.forEach((ln, j) => txt(g, box.x - 66, box.y + box.h / 2 + 15 + j * 22, ln, { class: 'lane-sub', 'text-anchor': 'end', fill: opts.color || 'var(--ink-2)', 'font-weight': opts.color ? 700 : 400 }));
  }
  const cid = 'clip' + Math.random().toString(36).slice(2, 8);
  el('rect', { x: box.x, y: box.y - 2, width: box.w, height: box.h + 4 }, el('clipPath', { id: cid }, g));
  const cg = el('g', { 'clip-path': `url(#${cid})` }, g);
  if (opts.rec) { let d = ''; for (let n = 0; n < RN; n++) d += (n ? 'L' : 'M') + xs(n / REC_FS).toFixed(1) + ',' + sy(REC[n]).toFixed(1); el('path', { d, class: 'rec' }, cg); }
  if (opts.prev) el('path', { d: pathOf(opts.prev, sy), class: 'faint' }, cg);
  el('path', { d: pathOf(ys, sy, upto), class: 'trace', stroke: opts.color || 'var(--ink)', 'stroke-width': 3 }, cg);
  return g;
}
function drawPlus(boxAbove, boxBelow, k, on, sign = '+', color) {
  const y = (boxAbove.y + boxAbove.h + boxBelow.y) / 2 + 16;
  const t = txt(chart, LX - 150, y, sign, { class: 'plus' + (on ? ' on' : ''), 'text-anchor': 'middle', 'font-size': Math.min(60, Math.round(boxAbove.h * 0.85)) });
  if (color) t.setAttribute('fill', color);
}
function drawSpectrum(m, opts = {}) {
  const box = { x: SX, y: 60, w: SW, h: 400 };
  const g = el('g', {}, chart);
  const amax = Math.max(1, ...COMP.map(c => c.A)) * 1.15;
  const sy = yScale(box, 0, amax), sx = f => box.x + f / FMAX * box.w;
  const gr = el('g', { class: 'grid' }, g), ax = el('g', { class: 'axis' }, g);
  niceTicks(0, amax, 4).forEach(v => { el('line', { x1: box.x, x2: box.x + box.w, y1: sy(v), y2: sy(v) }, gr); txt(ax, box.x - 10, sy(v) + 5, fmt(v, 1), { 'text-anchor': 'end' }); });
  for (let f = 0; f <= FMAX; f += FMAX > 12 ? 4 : 2) { el('line', { x1: sx(f), x2: sx(f), y1: box.y, y2: box.y + box.h }, gr); txt(ax, sx(f), box.y + box.h + 20, f, { 'text-anchor': 'middle' }); }
  el('path', { d: `M${box.x},${box.y}V${box.y + box.h}H${box.x + box.w}` }, ax);
  txt(g, box.x + box.w / 2, box.y + box.h + 44, 'frequency (Hz)', { class: 'axis-title', 'text-anchor': 'middle' });
  const yt = txt(g, 0, 0, 'amplitude', { class: 'axis-title', 'text-anchor': 'middle' }); yt.setAttribute('transform', `translate(${box.x - 70},${box.y + box.h / 2}) rotate(-90)`);
  txt(g, box.x, box.y - 22, isWalk() ? 'spectrum: recording (grey) and sum' : 'spectrum of the sum', { class: 'ptitle' });
  if (isWalk() && opts.fit != null) {
    txt(g, box.x + box.w / 2, box.y + box.h + 96, 'sum vs recording', { class: 'ptitle', 'text-anchor': 'middle' });
    txt(g, box.x + box.w / 2, box.y + box.h + 130, `${Math.round(100 * opts.fit)}% of the variation`, { class: 'fit', 'text-anchor': 'middle' });
  }
  if (isWalk()) REC_SPEC.forEach(c => { if (c.f <= FMAX) el('line', { x1: sx(c.f), x2: sx(c.f), y1: sy(0), y2: sy(c.A), class: 'rec-stem' }, g); });
  COMP.forEach((c, k) => {
    const on = k < m;
    el('line', { x1: sx(c.f), x2: sx(c.f), y1: sy(0), y2: sy(on ? c.A : 0), class: 'stem', stroke: COL[k] }, g);
    if (on) { el('circle', { cx: sx(c.f), cy: sy(c.A), r: 6, fill: COL[k], stroke: '#fff', 'stroke-width': 1.5 }, g); if (c.tag) txt(g, sx(c.f) + 10, sy(c.A) + 6, c.tag, { class: 'stem-lab', fill: COL[k] }); }
    else el('circle', { cx: sx(c.f), cy: sy(0), r: 4, fill: 'none', stroke: COL[k], 'stroke-width': 1.5, opacity: .6 }, g);
  });
  return g;
}
function niceTicks(lo, hi, n = 5) {
  const span = hi - lo, raw = span / n, p = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * p).find(s => span / s <= n + 1) || p * 10;
  const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(Math.round(v * 1000) / 1000); return out;
}

// ------------------------------------------------------------ steps
let G = {};
const STEPS = [
  {
    title: 'Pure sinusoids', get dur() { return 1.5 * COMP.length; },
    tag: () => `${COMP.length} sinusoids · ` + (COMP.length <= 5 ? COMP.map(c => fmt(c.f, 1) + ' Hz').join(' · ') : `${fmt(COMP[0].f, 1)}–${fmt(COMP[COMP.length - 1].f, 1)} Hz`),
    subtitle: '',
    presets: {},
    setup() {}, draw(p) {
      chart.innerHTML = '';
      const { lanes, sum } = laneBoxes(COMP.length);
      const per = 1 / COMP.length;
      COMP.forEach((c, k) => { const q = clamp((p - k * per) / per, 0, 1); drawLane(lanes[k], c, k, Math.max(2, Math.round(q * N)), { faint: true }); });
      for (let k = 0; k + 1 < lanes.length; k++) drawPlus(lanes[k], lanes[k + 1], k, false);
      drawPlus(lanes[lanes.length - 1], sum, 0, false, '=');
      drawSum(sum, SUM, 0, { label: 'sum', sub: 'not added yet' });
      drawSpectrum(0);
    }
  },
  {
    title: 'Adding the sinusoids one at a time', get dur() { return 2.5 * COMP.length; },
    tag: () => `${COMP.length} sinusoids → one signal`,
    subtitle: '',
    presets: {},
    setup() {}, draw(p) {
      chart.innerHTML = '';
      const K = COMP.length, { lanes, sum } = laneBoxes(K);
      const per = 1 / K, m = clamp(Math.floor(p * K), 0, K), q = clamp((p - m * per) / per, 0, 1);
      const done = m >= K;
      COMP.forEach((c, k) => drawLane(lanes[k], c, k, N, { dim: k > m, hi: !done && k === m }));
      for (let k = 0; k + 1 < lanes.length; k++) drawPlus(lanes[k], lanes[k + 1], k, k + 1 <= m, '+', !done && k + 1 === m ? COL[m] : null);
      drawPlus(lanes[K - 1], sum, 0, m >= K, '=', !done && m === 0 ? COL[0] : null);
      const ys = done ? SUM : partialSum(m + 1), prev = done || m === 0 ? null : partialSum(m);
      drawSum(sum, ys, done ? N : Math.max(2, Math.round(q * N)), { label: done ? 'sum' : `sum of ${m + 1}`, sub: done ? `${K} sinusoids` : `adding ${COMP[m].name || fmt(COMP[m].f, 1) + ' Hz'}`, prev, color: done ? null : COL[m], rec: isWalk() });
      const shown = done ? K : m + (q >= 1 ? 1 : 0);
      drawSpectrum(shown, { fit: isWalk() ? (shown ? varianceExplained(partialSum(shown)) : 0) : null });
    }
  },
  {
    title: 'Rebuilding a real walking signal', get dur() { return 2.5 * COMP.length; },
    tag: () => `${COMP.length} sinusoids · stride ${fmt(STRIDE, 2)} Hz · step ${fmt(2 * STRIDE, 2)} Hz`,
    subtitle: '',
    presets: { example: 'walk', k: 10 },
    setup() {}, draw(p) { STEPS[1].draw(p); }
  }
];

// ------------------------------------------------------------ step machine
let step = 0, progress = 0, playing = false, raf = 0, lastT = 0;
const speedMult = () => parseFloat($('speed').value);
function cur() { return STEPS[step]; }
function updateHead() {
  const d = cur();
  $('title').innerHTML = d.title + (d.tag ? `<span class="tag">${d.tag()}</span>` : '');
  $('subtitle').textContent = d.subtitle;
  $('counter').textContent = `${step + 1} / ${STEPS.length}`;
}
function enterStep(k, completed = false) {
  step = clamp(k, 0, STEPS.length - 1); stopPlay();
  applyPresets(cur().presets);
  build();
  try { history.replaceState(null, '', '#' + (step + 1)); } catch (_) {}
  progress = 0; cur().setup();
  if (!cur().dur || completed || speedMult() === 0) { progress = 1; cur().draw(1); updateHead(); }
  else { cur().draw(0); updateHead(); startPlay(); }
}
function redraw() { build(); cur().setup(); cur().draw(progress); updateHead(); }
function onDial() { redraw(); }
function tick(t) {
  if (!playing) return;
  const dt = Math.max(0, Math.min(0.1, (t - lastT) / 1000)); lastT = t;
  progress = Math.min(1, progress + dt * speedMult() / cur().dur);
  cur().draw(progress); updateHead();
  if (progress >= 1) { stopPlay(); return; }
  raf = requestAnimationFrame(tick);
}
function startPlay() { if (progress >= 1 || !cur().dur) return; playing = true; lastT = performance.now(); $('play').textContent = '⏸'; raf = requestAnimationFrame(tick); }
function stopPlay() { playing = false; cancelAnimationFrame(raf); $('play').textContent = '▶'; }
function finish() { stopPlay(); progress = 1; cur().draw(1); updateHead(); }
function next() { if (progress < 1) { finish(); return; } if (step < STEPS.length - 1) enterStep(step + 1); }
function prev() { if (step > 0) enterStep(step - 1, true); }
function restart() { enterStep(step); }
function wire() {
  $('next').addEventListener('click', e => { e.stopPropagation(); next(); });
  $('prev').addEventListener('click', e => { e.stopPropagation(); prev(); });
  $('restart').addEventListener('click', e => { e.stopPropagation(); restart(); });
  $('reset').addEventListener('click', e => { e.stopPropagation(); for (const id in dirty) dirty[id] = false; applyPresets(cur().presets, true); restart(); });
  $('play').addEventListener('click', e => { e.stopPropagation(); if (playing) stopPlay(); else if (progress >= 1) restart(); else startPlay(); });
  $('shuffle').addEventListener('click', e => { e.stopPropagation(); seed = (Date.now() & 0xffff) + 1; $('example').value = 'random'; dirty['example'] = true; restart(); });
  $('speed').addEventListener('click', e => e.stopPropagation());
  $('speed').addEventListener('change', e => { e.stopPropagation(); if (speedMult() === 0) finish(); });
  $('slide').addEventListener('click', () => next());
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
    else if (e.key === ' ') { e.preventDefault(); $('play').click(); }
    else if (e.key === 'r') { restart(); }
  });
  const h = parseInt((location.hash || '').replace('#', ''), 10);
  enterStep(isNaN(h) ? 0 : h - 1);
}
// hover: show the value of every sinusoid and the sum at the cursor time
chart.addEventListener('mousemove', evt => {
  const r = chart.getBoundingClientRect(), x = (evt.clientX - r.left) / r.width * W;
  if (x < LX || x > LX + LW || !COMP.length) { $('tt').style.display = 'none'; return; }
  const i = clamp(Math.round((x - LX) / LW * (N - 1)), 0, N - 1);
  let html = `<div>t = ${fmt(T[i], 2)} s</div>`;
  COMP.forEach((c, k) => html += `<div style="color:${COL[k].replace('var(--c', '').replace(')', '') ? '' : ''}">${fmt(c.f, 1)} Hz: ${fmt(c.y[i], 2)}</div>`);
  html += `<div><b>sum: ${fmt(SUM[i], 2)}</b></div>`;
  const tt = $('tt'); tt.innerHTML = html; tt.style.display = 'block';
  tt.style.left = (evt.clientX - r.left + 14) + 'px'; tt.style.top = (evt.clientY - r.top - 10) + 'px';
});
chart.addEventListener('mouseleave', () => { $('tt').style.display = 'none'; });
wire();
})();
</script>

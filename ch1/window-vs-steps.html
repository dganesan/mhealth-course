<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Window Size vs Step Peaks</title>
</head>
<body>
<style>
  :root {
    color-scheme: light;
    --paper: #ffffff;
    --ink: #222222;
    --ink-2: #666666;
    --ink-3: #9a9a9a;
    --rule: #dcdcdc;
    --grid: #ececec;
    --raw: #b4b4b4;
    --raw-dot: #8c8c8c;
    --ma: #2a78d6;
    --lp: #1baf7a;
    --bad: #eb6834;
    --wm: #4a3aa7;
    --sans: "Helvetica Neue", Helvetica, -apple-system, Arial, sans-serif;
    --mono: Menlo, "SF Mono", Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--sans); font-size: 15px; line-height: 1.4;
    padding-block: 18px 28px; padding-inline: 16px; -webkit-font-smoothing: antialiased;
  }
  .stage { max-width: 1200px; margin: 0 auto; display: grid; gap: 14px; }
  .slide {
    background: var(--paper); border: 1px solid var(--rule); border-radius: 6px;
    padding: 26px 34px 14px; display: grid; grid-template-rows: auto 1fr auto; gap: 8px;
    position: relative; outline: none; cursor: pointer; user-select: none;
  }
  .slide:focus-visible { box-shadow: 0 0 0 3px rgba(42,120,214,.35); }
  .head { display: flex; justify-content: space-between; gap: 24px; align-items: flex-start; }
  .head h1 { margin: 0; font-size: clamp(22px, 2.6vw, 30px); font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; line-height: 1.15; }
  .head h1 .tag {
    display: inline-block; font-family: var(--mono); font-weight: 400; font-size: 0.6em; color: var(--ink-2);
    margin-left: 10px; vertical-align: middle; background: #f4f4f4; padding: 2px 8px; border-radius: 4px;
  }
  .head p { margin: 6px 0 0; color: #444; font-size: clamp(15px, 1.6vw, 18px); max-width: none; }
  .counter { flex: 0 0 auto; text-align: right; font-family: var(--mono); line-height: 1.1; min-width: 200px; }
  .counter .lbl { font-family: var(--sans); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
  .counter .big { font-size: clamp(34px, 4vw, 52px); font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
  .counter .big.bad { color: var(--bad); }
  .counter .big.good { color: var(--lp); }
  .counter .sub { font-size: 13px; color: var(--ink-2); margin-top: 4px; }
  .counter .sub b { color: var(--ink); font-weight: 700; }

  .chart-wrap { position: relative; min-height: 0; }
  svg.chart { display: block; width: 100%; height: auto; overflow: visible; }
  .tt {
    position: absolute; pointer-events: none; display: none; background: #fff; border: 1px solid var(--rule);
    border-radius: 4px; padding: 6px 9px; font-family: var(--mono); font-size: 12px; color: var(--ink);
    box-shadow: 0 2px 8px rgba(0,0,0,.08); white-space: nowrap; z-index: 2;
  }
  .tt .row { display: flex; gap: 10px; justify-content: space-between; }
  .tt .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

  .foot { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--ink-3); padding-top: 4px; border-top: 1px solid var(--rule); }
  .foot .ctr { font-family: var(--mono); }

  .bar { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; padding: 14px 18px;
         border: 1px solid var(--rule); border-radius: 6px; background: #f6f7f9; font-size: 14px; color: var(--ink); }
  .group { display: flex; align-items: center; gap: 8px; }
  .group label { font-size: 13px; font-weight: 700; color: var(--ink); letter-spacing: 0; text-transform: none; }
  .val { font-family: var(--mono); font-size: 14px; font-weight: 700; color: var(--ma); min-width: 5ch; }
  button, select { font: inherit; font-size: 14px; color: var(--ink); background: #fff; border: 1px solid #9a9a9a;
                   border-radius: 5px; padding: 7px 13px; cursor: pointer; }
  button:hover, select:hover { border-color: var(--ink); }
  button.primary { background: var(--ma); color: #fff; border-color: var(--ma); min-width: 88px; font-weight: 700; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--ma); outline-offset: 2px; }
  input[type=range] { accent-color: var(--ma); width: 200px; height: 30px; cursor: pointer; }
  input[type=checkbox] { accent-color: var(--ma); width: 18px; height: 18px; }
  .hint { margin-left: auto; color: var(--ink-2); font-size: 12px; }
  .hint kbd { font-family: var(--mono); background: #fff; border: 1px solid var(--rule); border-radius: 3px; padding: 0 5px; font-size: 11px; }

  .grid line { stroke: var(--grid); stroke-width: 1; }
  .axis line, .axis path { stroke: var(--ink-2); stroke-width: 1; fill: none; }
  .axis text { font-family: var(--mono); font-size: 12px; fill: var(--ink-2); }
  .axis-title { font-family: var(--sans); font-size: 12px; fill: var(--ink-2); }
  .formula { font-family: var(--mono); font-size: 13px; fill: var(--ink); }
  .raw-line { fill: none; stroke: var(--raw); stroke-width: 1.3; }
  .out-line { fill: none; stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
  .pk-x { stroke-width: 2; stroke-linecap: round; }
  .pk-o { fill: none; stroke-width: 2; }
  .ripple { fill: none; stroke-width: 1.4; stroke-dasharray: 2 2; }
  .dlabel { font-family: var(--sans); font-size: 13px; font-weight: 700; }
  .ann text { font-family: var(--sans); font-size: 12px; fill: var(--ink-2); }
  .ann line, .ann path { stroke: var(--ink-2); stroke-width: 1; fill: none; }
  .wbar { fill: var(--ma); opacity: .8; }
  .wbar-lbl { font-family: var(--mono); font-size: 11px; fill: var(--ink-2); }
  .curve { fill: none; stroke: var(--ma); stroke-width: 2; }
  .cdot { fill: var(--ma); stroke: #fff; stroke-width: 1.5; }
  .truth { stroke: var(--lp); stroke-width: 1.5; stroke-dasharray: 5 4; }
  .good-band { fill: rgba(27,175,122,.10); }
  .crosshair { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 2 2; }
  .legend text { font-family: var(--sans); font-size: 12px; fill: var(--ink); }
  .legend .bg { fill: #fff; opacity: .9; stroke: var(--rule); }
  .cursor-w { stroke: var(--ink); stroke-width: 1; }

  @media (max-width: 720px) {
    .slide { padding: 18px 16px 12px; }
    .head { flex-direction: column; }
    .counter { text-align: left; }
    .hint { display: none; }
    input[type=range] { width: 140px; }
  }
</style>

<div class="stage">
  <section class="slide" id="slide" tabindex="0" aria-live="polite">
    <div class="head">
      <div>
        <h1 id="title">Local maxima of the raw magnitude</h1>
        <p id="subtitle"></p>
      </div>
      <div class="counter">
        <div class="lbl">detected peaks</div>
        <div class="big" id="count">0</div>
        <div class="sub">true steps ≈ <b id="truth">13</b> <span id="ripples"></span></div>
      </div>
    </div>
    <div class="chart-wrap">
      <svg class="chart" id="chart" viewBox="0 0 1200 650" role="img" aria-label="Walking accelerometer magnitude with detected peaks, and peak count versus window size"></svg>
      <div class="tt" id="tt"></div>
    </div>
    <div class="foot">
      <span>CS328 &nbsp;·&nbsp; Sensor Data Smoothing and Filtering</span>
      <span class="ctr" id="counter"></span>
    </div>
  </section>

  <div class="bar">
    <div class="group">
      <button id="prev" title="Previous (←)">‹ Prev</button>
      <button id="play" class="primary" title="Play / pause (space)">Play</button>
      <button id="next" title="Next (→)">Next ›</button>
      <button id="restart" title="Restart this step (r)">Restart</button>
      <button id="reset" title="Clear your dial changes and restart the step">Reset dials</button>
    </div>
    <div class="group" id="g-win">
      <label for="win">Window w</label>
      <input type="range" id="win" min="1" max="51" step="2" value="5">
      <span class="val" id="win-val">5</span>
    </div>
    <div class="group" id="g-cut">
      <label for="cut">Cutoff</label>
      <input type="range" id="cut" min="1" max="6" step="0.5" value="3">
      <span class="val" id="cut-val">3 Hz</span>
    </div>
    <div class="group">
      <label for="speed">Speed</label>
      <select id="speed">
        <option value="0.25">very slow</option>
        <option value="0.5">slow</option>
        <option value="1" selected>normal</option>
        <option value="2.5">fast</option>
        <option value="0">instant</option>
      </select>
    </div>
    <span class="hint"><kbd>→</kbd> finish / next &nbsp; <kbd>←</kbd> back &nbsp; <kbd>space</kbd> play &nbsp; <kbd>r</kbd> restart</span>
  </div>
</div>

<script>
// Butterworth IIR design + filtering, mirroring scipy.signal.butter / lfilter / filtfilt.
// Design path: analog Butterworth prototype (zpk) -> lp2lp / lp2hp / lp2bp / lp2bs -> bilinear -> SOS.
// Usage:
//   const sos = butter(4, 100, 1000, 'lowpass');            // cutoff Hz, fs Hz
//   const sos = butter(4, [58, 62], 1000, 'bandstop');
//   const y = sosfilt(sos, x);                              // causal (lfilter)
//   const y = sosfiltfilt(sos, x);                          // zero-phase (filtfilt)
//   const mag = sosFreqz(sos, fHz, fs);                     // |H| at one frequency
(function (global) {
  // ---- minimal complex arithmetic
  const C = (re, im = 0) => ({ re, im });
  const cadd = (a, b) => C(a.re + b.re, a.im + b.im);
  const csub = (a, b) => C(a.re - b.re, a.im - b.im);
  const cmul = (a, b) => C(a.re * b.re - a.im * b.im, a.re * b.im + a.im * b.re);
  const cdiv = (a, b) => { const d = b.re * b.re + b.im * b.im; return C((a.re * b.re + a.im * b.im) / d, (a.im * b.re - a.re * b.im) / d); };
  const csqrt = a => { const r = Math.hypot(a.re, a.im); const re = Math.sqrt(Math.max(0, (r + a.re) / 2)); const im = Math.sign(a.im || 1) * Math.sqrt(Math.max(0, (r - a.re) / 2)); return C(re, im); };
  const cscale = (a, s) => C(a.re * s, a.im * s);

  function buttap(N) { // analog prototype poles, unit cutoff
    const p = [];
    for (let k = 1; k <= N; k++) { const th = Math.PI * (2 * k - 1) / (2 * N); p.push(C(-Math.sin(th), Math.cos(th))); }
    return { z: [], p, k: 1 };
  }
  function lp2lp(zpk, wo) { return { z: zpk.z.map(v => cscale(v, wo)), p: zpk.p.map(v => cscale(v, wo)), k: zpk.k * Math.pow(wo, zpk.p.length - zpk.z.length) }; }
  function lp2hp(zpk, wo) {
    const z = zpk.z.map(v => cdiv(C(wo), v)), p = zpk.p.map(v => cdiv(C(wo), v));
    const deg = zpk.p.length - zpk.z.length;
    for (let i = 0; i < deg; i++) z.push(C(0));
    let num = C(1), den = C(1);
    zpk.z.forEach(v => { num = cmul(num, cscale(v, -1)); });
    zpk.p.forEach(v => { den = cmul(den, cscale(v, -1)); });
    const kk = cdiv(num, den);
    return { z, p, k: zpk.k * kk.re };
  }
  function lp2bp(zpk, wo, bw) {
    const deg = zpk.p.length - zpk.z.length;
    const tr = v => { const s = cscale(v, bw / 2); const r = csqrt(csub(cmul(s, s), C(wo * wo))); return [cadd(s, r), csub(s, r)]; };
    const z = [], p = [];
    zpk.z.forEach(v => z.push(...tr(v)));
    zpk.p.forEach(v => p.push(...tr(v)));
    for (let i = 0; i < deg; i++) z.push(C(0));
    return { z, p, k: zpk.k * Math.pow(bw, deg) };
  }
  function lp2bs(zpk, wo, bw) {
    const deg = zpk.p.length - zpk.z.length;
    const tr = v => { const s = cdiv(C(bw / 2), v); const r = csqrt(csub(cmul(s, s), C(wo * wo))); return [cadd(s, r), csub(s, r)]; };
    const z = [], p = [];
    zpk.z.forEach(v => z.push(...tr(v)));
    zpk.p.forEach(v => p.push(...tr(v)));
    for (let i = 0; i < deg; i++) { z.push(C(0, wo)); z.push(C(0, -wo)); }
    let num = C(1), den = C(1);
    zpk.z.forEach(v => { num = cmul(num, cscale(v, -1)); });
    zpk.p.forEach(v => { den = cmul(den, cscale(v, -1)); });
    const kk = cdiv(num, den);
    return { z, p, k: zpk.k * kk.re };
  }
  function bilinear(zpk, fs) {
    const fs2 = 2 * fs;
    const deg = zpk.p.length - zpk.z.length;
    const tr = v => cdiv(cadd(C(fs2), v), csub(C(fs2), v));
    const z = zpk.z.map(tr), p = zpk.p.map(tr);
    for (let i = 0; i < deg; i++) z.push(C(-1));
    let num = C(1), den = C(1);
    zpk.z.forEach(v => { num = cmul(num, csub(C(fs2), v)); });
    zpk.p.forEach(v => { den = cmul(den, csub(C(fs2), v)); });
    const kk = cdiv(num, den);
    return { z, p, k: zpk.k * kk.re };
  }
  // pair conjugates -> second-order sections [b0,b1,b2,a0,a1,a2]
  function zpk2sos(zpk) {
    const pairUp = arr => {
      const rest = arr.slice(); const pairs = [];
      while (rest.length) {
        const a = rest.shift();
        if (Math.abs(a.im) < 1e-9) { // real: pair with the nearest real
          let j = rest.findIndex(v => Math.abs(v.im) < 1e-9);
          if (j >= 0) { pairs.push([a, rest.splice(j, 1)[0]]); } else pairs.push([a]);
        } else {
          let j = rest.findIndex(v => Math.abs(v.re - a.re) < 1e-7 && Math.abs(v.im + a.im) < 1e-7);
          if (j >= 0) { pairs.push([a, rest.splice(j, 1)[0]]); } else pairs.push([a, C(a.re, -a.im)]);
        }
      }
      return pairs;
    };
    const poly = pr => { // (x - r1)(x - r2) -> real coefficients [1, c1, c2]
      if (pr.length === 1) return [1, -pr[0].re, 0];
      const s = cadd(pr[0], pr[1]), m = cmul(pr[0], pr[1]);
      return [1, -s.re, m.re];
    };
    // sort poles by closeness to the unit circle so each section pairs zeros nearby (stability of cascade)
    const P = zpk.p.slice().sort((a, b) => Math.hypot(b.re, b.im) - Math.hypot(a.re, a.im));
    const Z = zpk.z.slice();
    const pp = pairUp(P);
    const sos = [];
    pp.forEach((pair, idx) => {
      // choose the zero(s) nearest this pole pair
      const zs = [];
      for (let n = 0; n < pair.length && Z.length; n++) {
        let best = 0, bd = Infinity;
        Z.forEach((v, j) => { const d = Math.hypot(v.re - pair[0].re, Math.abs(v.im) - Math.abs(pair[0].im)); if (d < bd) { bd = d; best = j; } });
        const zz = Z.splice(best, 1)[0];
        zs.push(zz);
        if (Math.abs(zz.im) > 1e-9) { // also remove its conjugate
          const cj = Z.findIndex(v => Math.abs(v.re - zz.re) < 1e-7 && Math.abs(v.im + zz.im) < 1e-7);
          if (cj >= 0) { zs.push(Z.splice(cj, 1)[0]); n++; }
        }
      }
      const b = zs.length ? poly(zs) : [1, 0, 0];
      const a = poly(pair);
      const g = idx === 0 ? zpk.k : 1;
      sos.push([b[0] * g, b[1] * g, b[2] * g, a[0], a[1], a[2]]);
    });
    return sos;
  }

  function butter(N, cutoffHz, fs, btype = 'lowpass') {
    const warp = f => 2 * fs * Math.tan(Math.PI * f / fs);
    let zpk = buttap(N);
    if (btype === 'lowpass') zpk = lp2lp(zpk, warp(cutoffHz));
    else if (btype === 'highpass') zpk = lp2hp(zpk, warp(cutoffHz));
    else {
      const w1 = warp(cutoffHz[0]), w2 = warp(cutoffHz[1]);
      const bw = w2 - w1, wo = Math.sqrt(w1 * w2);
      zpk = btype === 'bandpass' ? lp2bp(zpk, wo, bw) : lp2bs(zpk, wo, bw);
    }
    return zpk2sos(bilinear(zpk, fs));
  }

  function sosfilt(sos, x, zi) { // direct form II transposed, per section
    let y = Float64Array.from(x);
    const st = zi || sos.map(() => [0, 0]);
    sos.forEach(([b0, b1, b2, a0, a1, a2], s) => {
      const z = st[s]; const out = new Float64Array(y.length);
      for (let n = 0; n < y.length; n++) {
        const xn = y[n];
        const yn = b0 * xn + z[0];
        z[0] = b1 * xn - a1 * yn + z[1];
        z[1] = b2 * xn - a2 * yn;
        out[n] = yn;
      }
      y = out;
    });
    return y;
  }
  // steady-state initial conditions for a step of amplitude 1 (like scipy sosfilt_zi)
  function sosfiltZi(sos) {
    let scale = 1;
    return sos.map(([b0, b1, b2, a0, a1, a2]) => {
      // solve for zi such that output is constant for constant input (scale)
      const g = (b0 + b1 + b2) / (1 + a1 + a2); // dc gain of this section
      const z0 = scale * ((b1 - a1 * b0) + (b2 - a2 * b0)) / (1 + a1 + a2) * 1; // approx via steady state
      // exact: z1 = scale*(b2 - a2*b0)... use the standard linear solve
      // Steady state: y = g*scale; z0 = y - b0*scale; z1 = z0 - (b1*scale - a1*y)
      const y = g * scale;
      const zz0 = y - b0 * scale;
      const zz1 = zz0 - (b1 * scale - a1 * y);
      scale = y;
      return [zz0, zz1];
    });
  }
  function sosfiltfilt(sos, x) {
    const n = x.length;
    const pad = Math.min(n - 1, 3 * 3 * sos.length); // ~ 3 * (order) samples (scipy: 3*max(len(a),len(b)))
    // odd extension
    const ext = new Float64Array(n + 2 * pad);
    for (let i = 0; i < pad; i++) ext[i] = 2 * x[0] - x[pad - i];
    for (let i = 0; i < n; i++) ext[pad + i] = x[i];
    for (let i = 0; i < pad; i++) ext[pad + n + i] = 2 * x[n - 1] - x[n - 2 - i];
    const zi = sosfiltZi(sos);
    let y = sosfilt(sos, ext, zi.map(z => [z[0] * ext[0], z[1] * ext[0]]));
    y.reverse();
    y = sosfilt(sos, y, zi.map(z => [z[0] * y[0], z[1] * y[0]]));
    y.reverse();
    return y.slice(pad, pad + n);
  }
  function sosFreqz(sos, fHz, fs) { // magnitude response at a frequency (Hz)
    const w = 2 * Math.PI * fHz / fs;
    const e1 = C(Math.cos(-w), Math.sin(-w)), e2 = C(Math.cos(-2 * w), Math.sin(-2 * w));
    let H = C(1);
    sos.forEach(([b0, b1, b2, a0, a1, a2]) => {
      const num = cadd(C(b0), cadd(cscale(e1, b1), cscale(e2, b2)));
      const den = cadd(C(a0), cadd(cscale(e1, a1), cscale(e2, a2)));
      H = cmul(H, cdiv(num, den));
    });
    return Math.hypot(H.re, H.im);
  }
  function sosPhase(sos, fHz, fs) {
    const w = 2 * Math.PI * fHz / fs;
    const e1 = C(Math.cos(-w), Math.sin(-w)), e2 = C(Math.cos(-2 * w), Math.sin(-2 * w));
    let H = C(1);
    sos.forEach(([b0, b1, b2, a0, a1, a2]) => {
      const num = cadd(C(b0), cadd(cscale(e1, b1), cscale(e2, b2)));
      const den = cadd(C(a0), cadd(cscale(e1, a1), cscale(e2, a2)));
      H = cmul(H, cdiv(num, den));
    });
    return Math.atan2(H.im, H.re);
  }

  // ---- real FFT magnitude (radix-2, zero-padded), returns {f, mag} one-sided, mag scaled 2/N
  function rfftMag(x, fs) {
    let N = 1; while (N < x.length) N <<= 1;
    const re = new Float64Array(N), im = new Float64Array(N);
    for (let i = 0; i < x.length; i++) re[i] = x[i];
    for (let i = 1, j = 0; i < N; i++) { // bit reversal
      let bit = N >> 1; for (; j & bit; bit >>= 1) j ^= bit; j ^= bit;
      if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; }
    }
    for (let len = 2; len <= N; len <<= 1) {
      const ang = -2 * Math.PI / len, wr = Math.cos(ang), wi = Math.sin(ang);
      for (let i = 0; i < N; i += len) {
        let cr = 1, ci = 0;
        for (let j = 0; j < len / 2; j++) {
          const ur = re[i + j], ui = im[i + j];
          const vr = re[i + j + len / 2] * cr - im[i + j + len / 2] * ci;
          const vi = re[i + j + len / 2] * ci + im[i + j + len / 2] * cr;
          re[i + j] = ur + vr; im[i + j] = ui + vi;
          re[i + j + len / 2] = ur - vr; im[i + j + len / 2] = ui - vi;
          const t = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = t;
        }
      }
    }
    const half = N / 2 + 1, f = new Float64Array(half), mag = new Float64Array(half);

      const w = wShown;
      const r = showMA(w, N - 1);
      setCount(r.n, r.ripples, 'bad');
      drawCurve(sweep.length - 1); panelCursorAt(w, sweep[(w - 1) / 2].n); goodBand(false);
      if (w >= 2 * periodSamples - 5) { // window spans about two steps: bracket two real steps under one hump
        const a = refPeaks[3], b = refPeaks[4];
        const y0 = PT + 48;
        el('path', { d: `M${xs(a)},${y0 + 8}V${y0}H${xs(b)}V${y0 + 8}` }, G.ann);
        el('text', { x: (xs(a) + xs(b)) / 2, y: y0 - 6, 'text-anchor': 'middle' }, G.ann).textContent = 'two real steps, one smoothed hump';
        [a, b].forEach(i => el('line', { x1: xs(i), x2: xs(i), y1: y0 + 8, y2: ys(sweep[(w - 1) / 2].y[i]) - 6, 'stroke-dasharray': '2 3' }, G.ann));
      }
    } else if (d.id === 'rule') {
      const w = wShown;
      const r = showMA(w, N - 1);
      setCount(r.n, r.ripples, r.n > trueSteps * 1.5 ? 'bad' : '');
      drawCurve(sweep.length - 1); panelCursorAt(w, sweep[(w - 1) / 2].n); goodBand(true);
      const a = refPeaks[5], b = refPeaks[6];
      const y0 = PT + 48;
      el('path', { d: `M${xs(a)},${y0 + 8}V${y0}H${xs(b)}V${y0 + 8}` }, G.ann);
      el('text', { x: (xs(a) + xs(b)) / 2, y: y0 - 4, 'text-anchor': 'middle' }, G.ann).textContent = `one step: T ≈ ${((b - a) / FS).toFixed(2)} s = ${b - a} samples`;
      const bars = [5, 13, 25, 51];
      if (!bars.includes(w)) { bars.push(w); bars.sort((p, q) => p - q); }
      bars.forEach((bw, k) => {
        const y = mainBottom + 36 + k * 13;
        const len = xs(bw - 1) - xs(0);
        const x0 = (xs(a) + xs(b)) / 2 - len / 2;
        el('rect', { class: 'wbar', x: x0, y, width: len, height: 6, rx: 1, opacity: bw === w ? 1 : 0.4 }, G.ann);
        el('text', { x: x0 + len + 8, y: y + 6, class: 'wbar-lbl' }, G.ann).textContent = `w = ${bw}  (${(bw / (b - a)).toFixed(2)} T)${bw === w ? '  ← current' : ''}`;
      });
    } else if (d.id === 'lp') {
      ensureLP();
      const upto = cursor;
      el('path', { class: 'out-line', d: linePath(lp, Math.max(0, upto)), stroke: 'var(--lp)' }, G.out);
      const r = markPeaks(lp, lpPeaks, 'var(--lp)', 'o', upto);
      setCount(r.n, 0, upto >= N - 1 && r.n === trueSteps ? 'good' : '');
      const s = sweep[(wShown - 1) / 2];
      if (upto >= N - 1) {
        el('path', { class: 'out-line', d: linePath(s.y), stroke: 'var(--ma)', opacity: 0.55, 'stroke-width': 1.6 }, G.out);
        const y1 = ys(lp[N - 1]) + 4;
        el('text', { x: W - PR + 8, y: y1, class: 'dlabel', fill: 'var(--lp)' }, G.labels).textContent = `low-pass ${lpCut} Hz: ${lpPeaks.length}`;
        let y2 = ys(s.y[N - 1]) + 4; if (Math.abs(y2 - y1) < 16) y2 = y1 + 16;
        el('text', { x: W - PR + 8, y: y2, class: 'dlabel', fill: 'var(--ma)', opacity: 0.7 }, G.labels).textContent = `moving avg w=${wShown}: ${s.n}`;
      }
      drawCurve(sweep.length - 1); panelCursorAt(wShown, s.n); goodBand(true);
    }
  }

  // ------------------------------------------------------------ hover
  const tt = $('tt');
  function svgPoint(evt) { const pt = chart.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY; return pt.matrixTransform(chart.getScreenCTM().inverse()); }
  function placeTT(evt, html) {
    tt.innerHTML = html; tt.style.display = 'block';
    const wrap = chart.parentElement.getBoundingClientRect();
    const px = evt.clientX - wrap.left, py = evt.clientY - wrap.top;
    tt.style.left = (px + 16 + tt.offsetWidth > wrap.width ? px - tt.offsetWidth - 12 : px + 16) + 'px';
    tt.style.top = Math.max(0, py - 10) + 'px';
  }
  function currentW() {
    const d = steps[step];
    if (hoverW != null) return hoverW;
    if (d.id === 'sweep') return sweep[Math.max(0, Math.min(sweep.length - 1, cursor))].w;
    return W_LIVE();
  }
  function hoverMain(evt) {
    const p = svgPoint(evt);
    const i = Math.max(0, Math.min(N - 1, Math.round((p.x - PL) / (W - PL - PR) * (N - 1))));
    G.hover.innerHTML = '';
    el('line', { class: 'crosshair', x1: xs(i), x2: xs(i), y1: PT, y2: mainBottom }, G.hover);
    const d = steps[step];
    let html = `<div class="row"><span>t</span><b>${(i / FS).toFixed(2)} s</b></div><div class="row"><span><i class="sw" style="background:var(--raw-dot)"></i>raw</span><span>${fmt1(WALK[i])}</span></div>`;
    if (d.id !== 'raw') { const w = currentW(); html += `<div class="row"><span><i class="sw" style="background:var(--ma)"></i>avg w=${w}</span><span>${fmt1(sweep[(w - 1) / 2].y[i])}</span></div>`; }
    if (d.id === 'lp') { ensureLP(); html += `<div class="row"><span><i class="sw" style="background:var(--lp)"></i>low-pass</span><span>${fmt1(lp[i])}</span></div>`; }
    placeTT(evt, html);
  }
  function hoverPanel(evt) {
    const p = svgPoint(evt);
    let w = Math.round((p.x - PL) / (W - PL - PR) * 50) + 1; w = Math.max(1, Math.min(51, w)); if (w % 2 === 0) w += 1; w = Math.min(51, w);
    const d = steps[step];
    if (d.id === 'raw') return;
    if (d.id === 'sweep' && cursor < sweep.length - 1) return;
    if (d.id === 'ma5' && cursor < N - 1) return;
    hoverW = w; render();
    placeTT(evt, `<div class="row"><span>window</span><b>${w}</b></div><div class="row"><span>peaks</span><b>${sweep[(w - 1) / 2].n}</b></div>`);
  }
  function unhover() { tt.style.display = 'none'; G.hover.innerHTML = ''; }

  // ------------------------------------------------------------ step control
  const total = () => steps[step].id === 'sweep' ? sweep.length - 1 : (steps[step].id === 'big' || steps[step].id === 'rule') ? 0 : N - 1;
  const rate = () => (steps[step].id === 'sweep' ? 2 : 100) * speedMult;
  const cursorDone = () => cursor >= total();

  function enterStep(k, completed = false) {
    step = k; hoverW = null;
    const d = steps[step];
    if (!G.rawLine) drawStatic();
    applyPresets(d);
    $('counter').textContent = `${step + 1} / ${steps.length}`;
    $('prev').disabled = step === 0;
    $('next').disabled = false;
    try { history.replaceState(null, '', '#' + (step + 1)); } catch (_) {}
    stopPlay();
    cursor = -1;
    if (completed || speedMult === 0 || reduceMotion || total() === 0) finish();
    else { render(); startPlay(); }
  }
  function finish() { cursor = total(); stopPlay(); render(); }
  function tick(t) {
    if (!playing) return;
    const dt = Math.min(0.1, (t - lastT) / 1000); lastT = t;
    acc += dt * rate();
    while (acc >= 1 && cursor < total()) { cursor++; acc -= 1; }
    render();
    if (cursorDone()) { finish(); return; }
    raf = requestAnimationFrame(tick);
  }
  function startPlay() { if (cursorDone()) return; playing = true; lastT = performance.now(); acc = 0; $('play').textContent = 'Pause'; raf = requestAnimationFrame(tick); }
  function stopPlay() { playing = false; cancelAnimationFrame(raf); $('play').textContent = 'Play'; }
  function next() { if (!cursorDone()) { finish(); return; } if (step < steps.length - 1) enterStep(step + 1); }
  function prev() { if (step > 0) enterStep(step - 1, true); }
  function restart() { enterStep(step); }
  function resetDials() { for (const k in dials) dials[k].dirty = false; enterStep(step); }

  // ------------------------------------------------------------ wiring
  $('next').addEventListener('click', e => { e.stopPropagation(); next(); });
  $('prev').addEventListener('click', e => { e.stopPropagation(); prev(); });
  $('restart').addEventListener('click', e => { e.stopPropagation(); restart(); });
  $('reset').addEventListener('click', e => { e.stopPropagation(); resetDials(); });
  $('play').addEventListener('click', e => { e.stopPropagation(); if (playing) stopPlay(); else if (cursorDone()) { if (total() > 0) restart(); else next(); } else startPlay(); });
  $('slide').addEventListener('click', () => next());
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
    else if (e.key === ' ') { e.preventDefault(); $('play').click(); }
    else if (e.key === 'r' || e.key === 'R') restart();
  });
  $('speed').addEventListener('change', e => { speedMult = parseFloat(e.target.value); });
  function onDial(name) {
    dials[name].dirty = true;
    dials[name].val.textContent = dials[name].fmt(dials[name].get());
    const d = steps[step];
    if (d.id === 'sweep' && name === 'win') { cursor = (W_LIVE() - 1) / 2; stopPlay(); render(); return; } // jump the sweep to this w
    if (d.id === 'raw') { setHead(); return; }
    if (!cursorDone()) finish(); else render();
  }
  ['win', 'cut'].forEach(id => {
    $(id).addEventListener('input', () => onDial(id));
    $(id).addEventListener('click', e => e.stopPropagation());
  });
  document.querySelector('.bar').addEventListener('click', e => e.stopPropagation());

  $('truth').textContent = trueSteps;
  for (const k in dials) dials[k].val.textContent = dials[k].fmt(dials[k].get());
  const h = parseInt((location.hash || '').replace('#', ''), 10);
  if (h >= 1 && h <= steps.length) step = h - 1;
  enterStep(step, h >= 1);
})();
</script>

</body>
</html>

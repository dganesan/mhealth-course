9/xhtml"><span class="nodeLabel"><p>Record All 50 Falls<br/>in Single Session</p></span></div></foreignObject></g></g><g transform="translate(138, 704.078125)" id="flowchart-D-3" class="node default"><rect height="222" width="260" y="-111" x="-130" style="fill:#f3e5f5 !important;stroke:#7b1fa2 !important;stroke-width:4px !important" class="basic label-container"></rect><g transform="translate(-100, -96)" style="" class="label"><rect></rect><foreignObject height="192" width="200"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>Instructions:<br/>1. Start SensorLogger recording<br/>2. Perform fall<br/>3. Get up slowly<br/>4. Wait 3 seconds<br/>5. Repeat 49 more times<br/>6. Stop recording</p></span></div></foreignObject></g></g><g transform="translate(448, 704.078125)" id="flowchart-E-4" class="node default"><rect height="246" width="260" y="-123" x="-130" style="fill:#fce4ec !important;stroke:#c2185b !important;stroke-width:4px !important" class="basic label-container"></rect><g transform="translate(-100, -108)" style="" class="label"><rect></rect><foreignObject height="216" width="200"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>Data Processing:<br/>1. Find impact peaks in data<br/>2. Extract 5s window around each peak<br/>3. Remove get-up/wait segments<br/>4. Verify 50 clean fall segments</p></span></div></foreignObject></g></g><g transform="translate(893.6640625, 492.078125)" id="flowchart-F-5" class="node default"><rect height="78" width="177.5" y="-39" x="-88.75" style="fill:#e8f5e9 !important;stroke:#2e7d32 !important;stroke-width:4px !important" class="basic label-container"></rect><g transform="translate(-58.75, -24)" style="" class="label"><rect></rect><foreignObject height="4
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Random Forest Hyperparameters</title>
</head>
<body>
<style>
  :root {
    color-scheme: light;
    --paper: #ffffff; --ink: #222222; --ink-2: #666666; --ink-3: #9a9a9a; --rule: #dcdcdc; --grid: #ececec; --ma: #2a78d6;
    --sans: "Helvetica Neue", Helvetica, -apple-system, Arial, sans-serif;
    --mono: Menlo, "SF Mono", Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  #app { height: 100vh; padding: 10px 14px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px; }
  .head { padding: 4px 16px 0; }
  h1 { margin: 0; font-size: clamp(24px, 2.4vw, 36px); font-weight: 700; letter-spacing: -0.01em; }
  .main { user-select: none; -webkit-user-select: none; min-height: 0; border: 1px solid var(--rule); border-radius: 6px; padding: 10px 16px; }
  .main svg { width: 100%; height: 100%; display: block; }
  svg text { font-family: var(--sans); }
  .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 18px; border: 1px solid var(--rule); border-radius: 6px; background: #f6f7f9; }
  button { font: inherit; font-size: 18px; color: var(--ink); background: #fff; border: 1px solid #9a9a9a; border-radius: 6px; padding: 9px 16px; cursor: pointer; }
  button:hover { border-color: var(--ink); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--ma); color: #fff; border-color: var(--ma); font-weight: 700; min-width: 120px; }
  .ctl { display: inline-flex; align-items: center; gap: 10px; margin-left: 10px; flex: 1; max-width: 640px; }
  .ctl .lbl { font-family: var(--mono); font-size: 17px; color: var(--ink-2); white-space: nowrap; }
  .ctl b { font-family: var(--mono); font-size: 18px; color: var(--ma); min-width: 3ch; }
  input[type=range] { flex: 1; accent-color: var(--ma); height: 26px; }
  .step { font-family: var(--mono); font-size: 17px; color: var(--ink-2); margin-left: auto; }
  .hide { display: none !important; }
</style>

<div id="app">
  <div class="head"><h1 id="title"></h1></div>
  <div class="main"><svg id="fig" viewBox="0 0 1600 760"></svg></div>
  <div class="bar">
    <button id="prev" title="Previous step (←)">⏮ step</button>
    <button id="next" title="Next step (→)">step ⏭</button>
    <button id="play" class="primary" title="Play again (space)">▶ Play</button>
    <span class="ctl" id="c-nest"><span class="lbl">n_estimators</span><input type="range" id="nest" min="0" max="13" step="1"><b id="v-nest"></b></span>
    <span class="ctl" id="c-mfeat"><span class="lbl">max_features</span><input type="range" id="mfeat" min="1" max="48" step="1"><b id="v-mfeat"></b></span>
    <span class="step" id="stepno"></span>
  </div>
</div>

<script>
(() => {
// ------------------------------------------------------------ shared by the chapter 6 pages (built by tools/ch6-pages/build.py)
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const el = (parent, tag, attrs, text) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; parent.appendChild(e); return e; };
const BLUE = '#2a78d6', DEEP = '#1d5fae', TINT = '#e8f1fd', GREY = '#9a9a9a', OK = '#1baf7a', BAD = '#d6453d';
const CLS = { W: { name: 'Walking', col: '#2a78d6' }, R: { name: 'Running', col: '#7a3fb0' } };
const clamp01 = v => Math.max(0, Math.min(1, v));
const ease = u => { u = clamp01(u); return u * u * (3 - 2 * u); };
// a rounded box with centred lines of text; kind is 'data' (grey), 'model' (white, blue edge), 'agg' (blue tint) or 'out' (blue tint, bold)
function box(g, cx, cy, w, h, lines, kind = 'model', o = {}) {
  const st = { data: ['#f6f7f9', GREY, '#222', 400], model: ['#fff', BLUE, '#222', 400], agg: [TINT, BLUE, DEEP, 700], out: [TINT, BLUE, DEEP, 700] }[kind];
  const b = el(g, 'g', { opacity: o.opacity == null ? 1 : o.opacity });
  el(b, 'rect', { x: cx - w / 2, y: cy - h / 2, width: w, height: h, rx: 12, fill: o.fill || st[0], stroke: o.stroke || st[1], 'stroke-width': kind === 'out' ? 3 : 2 });
  const fs = o.fs || 23, n = lines.length;
  lines.forEach((s, i) => el(b, 'text', { x: cx, y: cy + (o.dy || 0) + (i - (n - 1) / 2) * fs * 1.2 + fs * 0.36, 'text-anchor': 'middle', 'font-size': fs, 'font-weight': o.weight || st[3], fill: o.color || st[2] }, s));
  return b;
}
// an arrow from (x1,y1) to (x2,y2), drawn up to fraction u of its length
function arrow(g, x1, y1, x2, y2, u = 1, o = {}) {
  if (u <= 0) return;
  const x = x1 + (x2 - x1) * u, y = y1 + (y2 - y1) * u, a = Math.atan2(y2 - y1, x2 - x1), col = o.col || '#7a8ea8', w = o.w || 2.5;
  el(g, 'line', { x1, y1, x2: x - Math.cos(a) * 8, y2: y - Math.sin(a) * 8, stroke: col, 'stroke-width': w, 'stroke-dasharray': o.dash || 'none' });
  el(g, 'path', { d: `M${x},${y} L${x - Math.cos(a - 0.4) * 15},${y - Math.sin(a - 0.4) * 15} L${x - Math.cos(a + 0.4) * 15},${y - Math.sin(a + 0.4) * 15} Z`, fill: col });
}
// the small tree drawn in the book's figures: a root, two inner nodes, four leaves
function miniTree(g, cx, cy, s, col = BLUE, opacity = 1) {
  const t = el(g, 'g', { opacity });
  const P = { r: [0, -1], a: [-0.7, -0.3], b: [0.7, -0.3], l: [[-1, 0.4], [-0.4, 0.4], [0.4, 0.4], [1, 0.4]] }, X = p => cx + p[0] * s, Y = p => cy + p[1] * s;
  [[P.r, P.a], [P.r, P.b], [P.a, P.l[0]], [P.a, P.l[1]], [P.b, P.l[2]], [P.b, P.l[3]]].forEach(([p, q]) => el(t, 'line', { x1: X(p), y1: Y(p), x2: X(q), y2: Y(q), stroke: col, 'stroke-width': Math.max(1.5, s / 18) }));
  el(t, 'circle', { cx: X(P.r), cy: Y(P.r), r: s * 0.13, fill: col });
  [P.a, P.b].forEach(p => el(t, 'circle', { cx: X(p), cy: Y(p), r: s * 0.1, fill: col }));
  P.l.forEach(p => el(t, 'circle', { cx: X(p), cy: Y(p), r: s * 0.085, fill: col, 'fill-opacity': 0.75 }));
  return t;
}
// a numbered chip for one training window, coloured by its activity
function chip(g, x, y, id, c, o = {}) {
  const s = o.s || 1, w = 40 * s, h = 32 * s;
  const k = el(g, 'g', { opacity: o.opacity == null ? 1 : o.opacity });
  el(k, 'rect', { x: x - w / 2, y: y - h / 2, width: w, height: h, rx: 6 * s, fill: CLS[c].col, stroke: o.ring || 'none', 'stroke-width': o.ring ? 4 : 0 });
  el(k, 'text', { x, y: y + 7 * s, 'text-anchor': 'middle', 'font-size': 20 * s, 'font-weight': 700, fill: '#fff' }, id);
  return k;
}
// a seeded random generator, so a page shows the same draw every time it loads
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

// ------------------------------------------------------------ steps: each has a title, draw(g, t) and T, the length of its animation in seconds
// `ctl` lists the ids of the bar controls the step shows; Play runs the animation
let step = 0, t = 0, timer = null, STEPS = [];
function draw() {
  const S = STEPS[step], svg = $('fig'); svg.innerHTML = '';
  $('title').textContent = S.title; $('stepno').textContent = `step ${step + 1} of ${STEPS.length}`;
  $('prev').disabled = step === 0; $('next').disabled = step === STEPS.length - 1;
  $('play').classList.toggle('hide', !S.T); $('play').textContent = S.playLabel || '▶ Play';
  document.querySelectorAll('.ctl').forEach(c => c.classList.toggle('hide', !(S.ctl || []).includes(c.id)));
  S.draw(el(svg, 'g', {}), t);
}
function play() {
  const S = STEPS[step]; clearInterval(timer); t = 0; if (S.reset) S.reset();
  if (!S.T) { draw(); return; }
  const t0 = performance.now();
  timer = setInterval(() => { t = Math.min(S.T, (performance.now() - t0) / 1000); if (t >= S.T) clearInterval(timer); draw(); }, 30);
  draw();
}
// a step opens at the start of its animation and waits for Play; Back shows it finished
function go(s, back = false) {
  clearInterval(timer); step = Math.max(0, Math.min(STEPS.length - 1, s)); history.replaceState(null, '', '#' + (step + 1));
  if (STEPS[step].enter) STEPS[step].enter();
  t = back ? STEPS[step].T || 0 : 0; draw();
}
function start() {
  $('prev').onclick = () => go(step - 1, true); $('next').onclick = () => go(step + 1); $('play').onclick = () => play();
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight') go(step + 1); else if (e.key === 'ArrowLeft') go(step - 1, true);
    else if (e.key === ' ' && STEPS[step].T) { e.preventDefault(); play(); }
  });
  go((parseInt(location.hash.slice(1), 10) || 1) - 1);
}

    el(g, 'text', { x: RX, y: 336 + k * 110, 'font-size': 36, 'font-weight': 700, style: 'font-family: var(--mono)', fill: col }, S[cur].m.toFixed(3));

  });
}
let ni = RF.n_estimators.x.indexOf(100), mfv = 6;
const lx = v => X0 + (Math.log10(v) - Math.log10(0.8)) / (Math.log10(250) - Math.log10(0.8)) * (X1 - X0);

const nest = g => curves(g, RF.n_estimators, lx, [1, 10, 100], 'n_estimators (number of trees)', 0.88, 1.02, 0.02, ni, [[100, 'default 100']], ['n_estimators', v => v]);
const mfeat = g => curves(g, RF.max_features, fx, [1, 10, 20, 30, 40, 48], `max_features (out of ${RF.n_features} total)`, 0.955, 1.005, 0.01, mfv - 1,
  [[6, "'sqrt' = 6"], [5, "'log2' = 5"]], ['max_features', v => v]);
// the classifier call: the two new hyperparameters, then the ones a forest inherits from a decision tree, at their defaults
const CALL = [
  ['from sklearn.ensemble import RandomForestClassifier', 0], ['', 0],
  ['rf = RandomForestClassifier(', 0], ['    n_estimators=100,', 1], ["    max_features='sqrt',", 1], ['    max_depth=None,', 2], ['    min_samples_split=2,', 2], ['    min_samples_leaf=1,', 2], ['    random_state=42', 0], [')', 0],
  ['rf.fit(X_train, y_train)', 0], ['predictions = rf.predict(X_test)', 0]];
const PARAMS = [
  ['n_estimators', 'how many trees are in the forest'],
  ['max_features', 'how many features each split considers'],
  ['max_depth, min_samples_split, min_samples_leaf', 'as for a single decision tree'],
  ['random_state', 'fixes the random draws, so a run is reproducible']];
function call(g) {
  el(g, 'rect', { x: 20, y: 40, width: 880, height: 640, rx: 10, fill: '#f6f7f9', stroke: '#dcdcdc' });
  CALL.forEach(([s, k], i) => el(g, 'text', { x: 50, y: 100 + i * 50, 'xml:space': 'preserve', 'font-size': 27, style: 'white-space: pre; font-family: var(--mono)', fill: k === 1 ? DEEP : k === 2 ? '#666' : '#222', 'font-weight': k === 1 ? 700 : 400 }, s));
  PARAMS.forEach(([n, d], i) => { const y = 110 + i * 150, sm = n.length > 20;
    el(g, 'text', { x: 950, y, 'font-size': sm ? 22 : 28, style: 'font-family: var(--mono)', 'font-weight': 700, fill: i < 2 ? DEEP : '#666' }, n);
    el(g, 'text', { x: 950, y: y + 42, 'font-size': 23, fill: '#222' }, d); });
}
// the same call in one line above a figure: the hyperparameter the step is about highlighted with its current value, the other greyed at its default
function strip(g, on, val) {
  el(g, 'rect', { x: 0, y: 0, width: 1600, height: 46, rx: 6, fill: '#f6f7f9', stroke: '#dcdcdc' });
  const parts = [['rf = RandomForestClassifier(', 'fn'], [`n_estimators=${on === 'n' ? val : 100}`, on === 'n' ? 'on' : ''], [', ', ''], [`max_features=${on === 'm' ? val : "'sqrt'"}`, on === 'm' ? 'on' : ''], [', random_state=42', ''], [')', 'fn']];
  let x = 20;
  parts.forEach(([s, k]) => {
    const tx = el(g, 'text', { x, y: 30, 'xml:space': 'preserve', 'font-size': 21, style: 'white-space: pre; font-family: var(--mono)', fill: k === 'on' ? DEEP : k === 'fn' ? '#222' : '#9a9a9a', 'font-weight': k === 'on' ? 700 : 400 }, s);
    const w = tx.getComputedTextLength();
    if (k === 'on') g.insertBefore(el(g, 'rect', { x: x - 5, y: 8, width: w + 10, height: 30, rx: 5, fill: TINT }), tx);
    x += w;
  });
}
// the book's listing
const CODE = [
  ['from sklearn.ensemble import RandomForestClassifier', 0], ['from sklearn.model_selection import GridSearchCV, train_test_split', 0], ['', 0],
  ['# Note: For real wearable data, split by subject ID (covered in Chapter 7)', 2], ['X_train, X_test, y_train, y_test = train_test_split(', 0], ['    X, y, test_size=0.3, random_state=42)', 0], ['', 0],
  ['param_grid = {', 0], ["    'n_estimators': [50, 100, 200],", 1], ["    'max_depth': [5, 10, None],         # None = no limit", 0], ["    'max_features': ['sqrt', 'log2'],", 1], ["    'min_samples_split': [2, 5, 10]", 0], ['}', 0], ['', 0],
  ['grid = GridSearchCV(', 0], ['    RandomForestClassifier(random_state=42),', 0], ["    param_grid, cv=5, scoring='accuracy')", 0], ['grid.fit(X_train, y_train)', 0], ['', 0],
  ['print(f"Best params: {grid.best_params_}")', 0], ['print(f"Test accuracy: {grid.score(X_test, y_test):.3f}")', 0]];
function code(g) {

}
STEPS = [

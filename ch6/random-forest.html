<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Random Forests</title>
</head>
<body>
<style>
  :root {
    color-scheme: light;
    --paper: #ffffff; --ink: #222222; --ink-2: #666666; --ink-3: #9a9a9a; --rule: #dcdcdc; --grid: #ececec; --ma: #2a78d6;
    --sans: "Helvetica Neue", Helvetica, -apple-system, Arial, sans-serif;
    --mono: Menlo, "SF Mono", Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  #app { height: 100vh; padding: 10px 14px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px; }
  .head { padding: 4px 16px 0; }
  h1 { margin: 0; font-size: clamp(24px, 2.4vw, 36px); font-weight: 700; letter-spacing: -0.01em; }
  .main { user-select: none; -webkit-user-select: none; min-height: 0; border: 1px solid var(--rule); border-radius: 6px; padding: 10px 16px; }
  .main svg { width: 100%; height: 100%; display: block; }
  svg text { font-family: var(--sans); }
  .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 18px; border: 1px solid var(--rule); border-radius: 6px; background: #f6f7f9; }
  button { font: inherit; font-size: 18px; color: var(--ink); background: #fff; border: 1px solid #9a9a9a; border-radius: 6px; padding: 9px 16px; cursor: pointer; }
  button:hover { border-color: var(--ink); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--ma); color: #fff; border-color: var(--ma); font-weight: 700; min-width: 120px; }
  .ctl { display: inline-flex; align-items: center; gap: 10px; margin-left: 10px; flex: 1; max-width: 640px; }
  .ctl .lbl { font-family: var(--mono); font-size: 17px; color: var(--ink-2); white-space: nowrap; }
  .ctl b { font-family: var(--mono); font-size: 18px; color: var(--ma); min-width: 3ch; }
  input[type=range] { flex: 1; accent-color: var(--ma); height: 26px; }
  .step { font-family: var(--mono); font-size: 17px; color: var(--ink-2); margin-left: auto; }
  .hide { display: none !important; }
</style>

<div id="app">
  <div class="head"><h1 id="title"></h1></div>
  <div class="main"><svg id="fig" viewBox="0 0 1600 760"></svg></div>
  <div class="bar">
    <button id="prev" title="Previous step (←)">⏮ step</button>
    <button id="next" title="Next step (→)">step ⏭</button>
    <button id="play" class="primary" title="Play again (space)">▶ Play</button>
    <span class="ctl" id="c-mf"><span class="lbl">max_features</span><input type="range" id="mf" min="1" max="10" step="1"><b id="v-mf"></b></span>
    <span class="step" id="stepno"></span>
  </div>
</div>

<script>
(() => {
// ------------------------------------------------------------ shared by the chapter 6 pages (built by tools/ch6-pages/build.py)
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const el = (parent, tag, attrs, text) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; parent.appendChild(e); return e; };
const BLUE = '#2a78d6', DEEP = '#1d5fae', TINT = '#e8f1fd', GREY = '#9a9a9a', OK = '#1baf7a', BAD = '#d6453d';
const CLS = { W: { name: 'Walking', col: '#2a78d6' }, R: { name: 'Running', col: '#7a3fb0' } };
const clamp01 = v => Math.max(0, Math.min(1, v));
const ease = u => { u = clamp01(u); return u * u * (3 - 2 * u); };
// a rounded box with centred lines of text; kind is 'data' (grey), 'model' (white, blue edge), 'agg' (blue tint) or 'out' (blue tint, bold)
function box(g, cx, cy, w, h, lines, kind = 'model', o = {}) {
  const st = { data: ['#f6f7f9', GREY, '#222', 400], model: ['#fff', BLUE, '#222', 400], agg: [TINT, BLUE, DEEP, 700], out: [TINT, BLUE, DEEP, 700] }[kind];
  const b = el(g, 'g', { opacity: o.opacity == null ? 1 : o.opacity });
  el(b, 'rect', { x: cx - w / 2, y: cy - h / 2, width: w, height: h, rx: 12, fill: o.fill || st[0], stroke: o.stroke || st[1], 'stroke-width': kind === 'out' ? 3 : 2 });
  const fs = o.fs || 23, n = lines.length;
  lines.forEach((s, i) => el(b, 'text', { x: cx, y: cy + (o.dy || 0) + (i - (n - 1) / 2) * fs * 1.2 + fs * 0.36, 'text-anchor': 'middle', 'font-size': fs, 'font-weight': o.weight || st[3], fill: o.color || st[2] }, s));
  return b;
}
// an arrow from (x1,y1) to (x2,y2), drawn up to fraction u of its length
function arrow(g, x1, y1, x2, y2, u = 1, o = {}) {
  if (u <= 0) return;
  const x = x1 + (x2 - x1) * u, y = y1 + (y2 - y1) * u, a = Math.atan2(y2 - y1, x2 - x1), col = o.col || '#7a8ea8', w = o.w || 2.5;
  el(g, 'line', { x1, y1, x2: x - Math.cos(a) * 8, y2: y - Math.sin(a) * 8, stroke: col, 'stroke-width': w, 'stroke-dasharray': o.dash || 'none' });
  el(g, 'path', { d: `M${x},${y} L${x - Math.cos(a - 0.4) * 15},${y - Math.sin(a - 0.4) * 15} L${x - Math.cos(a + 0.4) * 15},${y - Math.sin(a + 0.4) * 15} Z`, fill: col });
}
// the small tree drawn in the book's figures: a root, two inner nodes, four leaves
function miniTree(g, cx, cy, s, col = BLUE, opacity = 1) {
  const t = el(g, 'g', { opacity });
  const P = { r: [0, -1], a: [-0.7, -0.3], b: [0.7, -0.3], l: [[-1, 0.4], [-0.4, 0.4], [0.4, 0.4], [1, 0.4]] }, X = p => cx + p[0] * s, Y = p => cy + p[1] * s;
  [[P.r, P.a], [P.r, P.b], [P.a, P.l[0]], [P.a, P.l[1]], [P.b, P.l[2]], [P.b, P.l[3]]].forEach(([p, q]) => el(t, 'line', { x1: X(p), y1: Y(p), x2: X(q), y2: Y(q), stroke: col, 'stroke-width': Math.max(1.5, s / 18) }));
  el(t, 'circle', { cx: X(P.r), cy: Y(P.r), r: s * 0.13, fill: col });
  [P.a, P.b].forEach(p => el(t, 'circle', { cx: X(p), cy: Y(p), r: s * 0.1, fill: col }));
  P.l.forEach(p => el(t, 'circle', { cx: X(p), cy: Y(p), r: s * 0.085, fill: col, 'fill-opacity': 0.75 }));
  return t;
}
// a numbered chip for one training window, coloured by its activity
function chip(g, x, y, id, c, o = {}) {
  const s = o.s || 1, w = 40 * s, h = 32 * s;
  const k = el(g, 'g', { opacity: o.opacity == null ? 1 : o.opacity });
  el(k, 'rect', { x: x - w / 2, y: y - h / 2, width: w, height: h, rx: 6 * s, fill: CLS[c].col, stroke: o.ring || 'none', 'stroke-width': o.ring ? 4 : 0 });
  el(k, 'text', { x, y: y + 7 * s, 'text-anchor': 'middle', 'font-size': 20 * s, 'font-weight': 700, fill: '#fff' }, id);
  return k;
}
// a seeded random generator, so a page shows the same draw every time it loads
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

// ------------------------------------------------------------ steps: each has a title, draw(g, t) and T, the length of its animation in seconds
// `ctl` lists the ids of the bar controls the step shows; Play runs the animation
let step = 0, t = 0, timer = null, STEPS = [];
function draw() {
  const S = STEPS[step], svg = $('fig'); svg.innerHTML = '';
  $('title').textContent = S.title; $('stepno').textContent = `step ${step + 1} of ${STEPS.length}`;
  $('prev').disabled = step === 0; $('next').disabled = step === STEPS.length - 1;
  $('play').classList.toggle('hide', !S.T); $('play').textContent = S.playLabel || '▶ Play';
  document.querySelectorAll('.ctl').forEach(c => c.classList.toggle('hide', !(S.ctl || []).includes(c.id)));
  S.draw(el(svg, 'g', {}), t);
}
function play() {
  const S = STEPS[step]; clearInterval(timer); t = 0; if (S.reset) S.reset();
  if (!S.T) { draw(); return; }
  const t0 = performance.now();
  timer = setInterval(() => { t = Math.min(S.T, (performance.now() - t0) / 1000); if (t >= S.T) clearInterval(timer); draw(); }, 30);
  draw();
}
// a step opens at the start of its animation and waits for Play; Back shows it finished
function go(s, back = false) {
  clearInterval(timer); step = Math.max(0, Math.min(STEPS.length - 1, s)); history.replaceState(null, '', '#' + (step + 1));
  if (STEPS[step].enter) STEPS[step].enter();
  t = back ? STEPS[step].T || 0 : 0; draw();
}
function start() {
  $('prev').onclick = () => go(step - 1, true); $('next').onclick = () => go(step + 1); $('play').onclick = () => play();
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight') go(step + 1); else if (e.key === 'ArrowLeft') go(step - 1, true);
    else if (e.key === ' ' && STEPS[step].T) { e.preventDefault(); play(); }
  });
  go((parseInt(location.hash.slice(1), 10) || 1) - 1);
}

// ------------------------------------------------------------ the book's section on random forests: the high-level idea (Figure 6.5), the three key ideas
// (bagging, random feature subsets as in Figure 6.6, majority voting as in Figure 6.7), then the three together
const DATA = 'WWRWRRWWRW'.split('').map((c, i) => ({ id: i + 1, c }));
const PANEL = '#f3f7fd';
// the three key ideas as a row above the figure, the ones a step is about filled in
const IDEAS = ['1  Bagging', '2  Random feature subsets', '3  Majority voting'];
function ideas(g, on) {
  IDEAS.forEach((s, k) => { const x = 330 + k * 330, lit = on.includes(k);
    el(g, 'rect', { x: x - 150, y: 6, width: 300, height: 40, rx: 20, fill: lit ? BLUE : '#fff', stroke: lit ? BLUE : '#c9d0da', 'stroke-width': 2 });
    el(g, 'text', { x, y: 33, 'text-anchor': 'middle', 'font-size': 20, 'font-weight': 700, fill: lit ? '#fff' : '#9a9a9a' }, s); });
}
function forest(g, t) {
  el(g, 'rect', { x: 50, y: 80, width: 440, height: 580, rx: 14, fill: PANEL, stroke: '#c9d6e8' });
  el(g, 'text', { x: 270, y: 130, 'text-anchor': 'middle', 'font-size': 28, 'font-weight': 700, fill: DEEP }, 'Single decision tree');
  miniTree(g, 270, 420, 120);
  el(g, 'rect', { x: 540, y: 80, width: 1010, height: 580, rx: 14, fill: PANEL, stroke: '#c9d6e8' });
  el(g, 'text', { x: 1045, y: 130, 'text-anchor': 'middle', 'font-size': 28, 'font-weight': 700, fill: DEEP }, 'Random forest');
  for (let i = 0; i < 10; i++) miniTree(g, 645 + (i % 5) * 200, 300 + Math.floor(i / 5) * 230, 62, BLUE, clamp01((t - 0.3 - 0.2 * i) / 0.3));
}
// Key idea 1: each tree is trained on its own bootstrap sample
let seed = 21, played = false;
function samples(g, t) {
  el(g, 'text', { x: 175, y: 290, 'text-anchor': 'middle', 'font-size': 26, 'font-weight': 700, fill: '#222' }, 'Training data');
  el(g, 'rect', { x: 50, y: 315, width: 250, height: 130, rx: 12, fill: '#f6f7f9', stroke: GREY, 'stroke-width': 2 });
  DATA.forEach((d, i) => chip(g, 80 + (i % 5) * 48, 350 + Math.floor(i / 5) * 58, d.id, d.c, { s: 0.95 }));
  for (let k = 0; k < 5; k++) {
    const y = 128 + k * 128, u = clamp01((t - 0.4 * k) / 0.5), r = rng(seed * 7 + k);
    arrow(g, 300, 380, 470, y, ease(u));
    const row = el(g, 'g', { opacity: u });
    el(row, 'text', { x: 490, y: y - 32, 'font-size': 21, fill: '#666' }, `Bootstrap ${k + 1}`);
    Array.from({ length: 10 }, () => Math.floor(r() * 10)).sort((p, q) => p - q).forEach((i, j) => chip(row, 510 + j * 48, y + 8, DATA[i].id, DATA[i].c, { s: 0.95 }));
    arrow(row, 1000, y + 8, 1110, y + 8, 1);
    miniTree(row, 1180, y + 12, 40);
    el(row, 'text', { x: 1250, y: y + 18, 'font-size': 24, 'font-weight': 700, fill: '#222' }, `Tree ${k + 1}`);
  }
}
// Key idea 2: at every split, only a random subset of the features is considered (the book's draw for 3 of 10 first)
const BOOK = { A: [3, 7, 8], B: [1, 5, 9], C: [2, 4, 6] };
let fseed = 0, mf = 3;
function subsets() {
  if (fseed === 0 && mf === 3) return BOOK;
  const r = rng(100 + fseed * 13 + mf), out = {};
  ['A', 'B', 'C'].forEach(s => { const f = Array.from({ length: 10 }, (_, i) => i + 1); for (let i = 9; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [f[i], f[j]] = [f[j], f[i]]; } out[s] = f.slice(0, mf).sort((p, q) => p - q); });
  return out;
}
function features(g, t) {
  const N = { A: [260, 200], B: [130, 380], C: [390, 380] }, L = [60, 200, 320, 460], S = subsets();
  [['A', 'B'], ['A', 'C']].forEach(([p, q]) => el(g, 'line', { x1: N[p][0], y1: N[p][1], x2: N[q][0], y2: N[q][1], stroke: BLUE, 'stroke-width': 4 }));
  [['B', 0], ['B', 1], ['C', 2], ['C', 3]].forEach(([p, i]) => { el(g, 'line', { x1: N[p][0], y1: N[p][1], x2: L[i], y2: 560, stroke: BLUE, 'stroke-width': 4 }); el(g, 'circle', { cx: L[i], cy: 560, r: 13, fill: BLUE, 'fill-opacity': 0.75 }); });
  ['A', 'B', 'C'].forEach((s, k) => {
    const u = clamp01((t - 0.5 * k) / 0.4), now = u > 0 && u < 1;
    el(g, 'circle', { cx: N[s][0], cy: N[s][1], r: 34, fill: TINT, stroke: BLUE, 'stroke-width': now ? 6 : 3 });
    el(g, 'text', { x: N[s][0], y: N[s][1] + 10, 'text-anchor': 'middle', 'font-size': 28, 'font-weight': 700, fill: DEEP }, s);
    const y = 220 + k * 150;
    el(g, 'text', { x: 760, y: y + 9, 'text-anchor': 'end', 'font-size': 26, 'font-weight': 700, fill: DEEP }, `Split ${s}:`);
    for (let f = 1; f <= 10; f++) {
      const on = S[s].includes(f) && u > 0, x = 800 + (f - 1) * 76;
      el(g, 'rect', { x, y: y - 24, width: 64, height: 48, rx: 6, fill: on ? TINT : '#fff', stroke: on ? BLUE : '#b9c3d0', 'stroke-width': on ? 3.5 : 1.5, opacity: on ? 0.4 + 0.6 * u : 1 });
      el(g, 'text', { x: x + 32, y: y + 8, 'text-anchor': 'middle', 'font-size': 22, 'font-weight': on ? 700 : 400, fill: on ? DEEP : '#9a9a9a' }, `f${f}`);
    }
  });
}
// Key idea 3: every tree votes, and the class with the most votes wins
const TV = ['W', 'W', 'R', 'W', 'R'];
function voting(g, t) {
  const IX = 150, TX = 520, VX = 800, AX = 1170, OX = 1460, CY = 400, Y = k => 150 + k * 125;
  box(g, IX, CY, 220, 110, ['New', 'example'], 'data', { fs: 26 });
  const tally = { W: 0, R: 0 };
  TV.forEach((c, k) => {
    arrow(g, IX + 110, CY, TX - 90, Y(k), ease(t / 0.7));
    box(g, TX, Y(k), 170, 100, [`Tree ${k + 1}`], 'model', { fs: 22, dy: 26 }); miniTree(g, TX, Y(k) - 14, 24);
    const u = clamp01((t - 1.0 - 0.45 * k) / 0.35);
    arrow(g, TX + 85, Y(k), VX - 85, Y(k), ease(u));
    const v = el(g, 'g', { opacity: u }), win = c === 'W';
    el(v, 'rect', { x: VX - 80, y: Y(k) - 26, width: 160, height: 52, rx: 8, fill: win ? TINT : '#fff', stroke: BLUE, 'stroke-width': win ? 3 : 1.5 });
    el(v, 'text', { x: VX, y: Y(k) + 9, 'text-anchor': 'middle', 'font-size': 24, 'font-weight': 700, fill: CLS[c].col }, CLS[c].name);
    const w = clamp01((t - 1.3 - 0.45 * k) / 0.35);
    arrow(g, VX + 80, Y(k), AX - 140, CY + (k - 2) * 26, ease(w));
    if (w >= 1) tally[c]++;
  });
  box(g, AX, CY, 280, 200, ['Tally'], 'agg', { fs: 28, dy: -56 });
  [['W', 0], ['R', 1]].forEach(([c, j]) => el(g, 'text', { x: AX, y: CY + 10 + j * 46, 'text-anchor': 'middle', 'font-size': 26, 'font-weight': 700, fill: CLS[c].col }, `${CLS[c].name} × ${tally[c]}`));
  arrow(g, AX + 140, CY, OX - 100, CY, ease((t - 3.8) / 0.5));
  box(g, OX, CY, 200, 100, ['Walking'], 'out', { fs: 30, opacity: clamp01((t - 4.2) / 0.4) });
}
// all three together: each tree gets its own bootstrap sample (1), is grown with a random feature subset at every split (2), and votes (3)
const FLOW = [{ split: ['f3 f7 f8', 'f1 f5 f9', 'f2 f4 f6'], vote: 'W' }, { split: ['f2 f6 f9', 'f3 f4 f10', 'f1 f7 f8'], vote: 'R' }, { split: ['f1 f4 f5', 'f2 f8 f9', 'f3 f6 f10'], vote: 'W' }];
function flow(g, t) {
  const DX = 140, BX = 480, TX = 870, VX = 1160, AX = 1330, OX = 1500, YS = [190, 410, 630], CY = 410;
  ideas(g, [0, 1, 2].filter(k => t >= 0.01 + 1.4 * k));
  box(g, DX, CY, 190, 120, ['Training', 'data'], 'data', { fs: 25 });
  YS.forEach((y, k) => {
    arrow(g, DX + 95, CY, BX - 175, y, ease(t / 0.8));
    const b = el(g, 'g', { opacity: clamp01((t - 0.5) / 0.4) }), r = rng(31 + k);
    box(b, BX, y, 340, 110, [`Bootstrap ${k + 1}`], 'data', { fs: 22, dy: -26 });
    Array.from({ length: 10 }, () => Math.floor(r() * 10)).sort((p, q) => p - q).forEach((i, j) => chip(b, BX - 148 + j * 33, y + 22, DATA[i].id, DATA[i].c, { s: 0.72 }));
    arrow(g, BX + 170, y, TX - 160, y, ease((t - 1.2) / 0.5));
    // the tree, its three splits labelled with the features each one may use
    const tr = el(g, 'g', { opacity: clamp01((t - 1.5) / 0.4) }), N = [[TX, y - 58], [TX - 80, y], [TX + 80, y]];
    [[0, 1], [0, 2]].forEach(([a, c]) => el(tr, 'line', { x1: N[a][0], y1: N[a][1], x2: N[c][0], y2: N[c][1], stroke: BLUE, 'stroke-width': 3 }));
    [[1, -110], [1, -50], [2, 50], [2, 110]].forEach(([a, dx]) => { el(tr, 'line', { x1: N[a][0], y1: N[a][1], x2: TX + dx, y2: y + 52, stroke: BLUE, 'stroke-width': 3 }); el(tr, 'circle', { cx: TX + dx, cy: y + 52, r: 8, fill: BLUE, 'fill-opacity': 0.75 }); });
    N.forEach(([x, yy], j) => { el(tr, 'rect', { x: x - 54, y: yy - 15, width: 108, height: 30, rx: 15, fill: TINT, stroke: BLUE, 'stroke-width': 2 });
      el(tr, 'text', { x, y: yy + 7, 'text-anchor': 'middle', 'font-size': 16, 'font-weight': 700, fill: DEEP }, FLOW[k].split[j]); });
    el(tr, 'text', { x: TX, y: y + 90, 'text-anchor': 'middle', 'font-size': 21, 'font-weight': 700, fill: '#222' }, `Tree ${k + 1}`);
    const u = clamp01((t - 2.9 - 0.3 * k) / 0.4), c = FLOW[k].vote;
    arrow(g, TX + 150, y, VX - 75, y, ease(u));
    el(el(g, 'g', { opacity: u }), 'text', { x: VX, y: y + 9, 'text-anchor': 'middle', 'font-size': 25, 'font-weight': 700, fill: CLS[c].col }, CLS[c].name);
    arrow(g, VX + 70, y, AX - 80, y, ease((t - 3.9) / 0.5));   // straight into the tall vote box
  });
  box(g, AX, CY, 160, 540, ['Majority', 'vote'], 'agg', { fs: 24, opacity: clamp01((t - 4.3) / 0.4) });
  arrow(g, AX + 80, CY, OX - 75, CY, ease((t - 4.7) / 0.4));
  box(g, OX, CY, 140, 90, ['Walking'], 'out', { fs: 25, opacity: clamp01((t - 5.0) / 0.4) });
}
STEPS = [
  { title: 'What is a random forest?', T: 2.4, draw: forest },
  { title: 'How does each tree get different training data?', T: 2.4, draw: (g, t) => { ideas(g, [0]); samples(g, t); }, playLabel: '▶ Draw',
    enter() { seed = 21; played = false; }, reset() { if (played) seed++; played = true; } },
  { title: 'Which features can each split consider?', T: 1.6, draw: (g, t) => { ideas(g, [1]); features(g, t); }, ctl: ['c-mf'], playLabel: '▶ Draw',
    enter() { fseed = 0; mf = 3; $('mf').value = 3; $('v-mf').textContent = 3; played = false; }, reset() { if (played) fseed++; played = true; } },
  { title: 'How does the forest make a prediction?', T: 4.7, draw: (g, t) => { ideas(g, [2]); voting(g, t); } },
  { title: 'How do the three ideas work together?', T: 5.4, draw: flow },
];
$('mf').addEventListener('input', () => { mf = +$('mf').value; $('v-mf').textContent = mf; t = STEPS[step].T; draw(); });
start();

})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pitch and Intensity Contours</title>
</head>
<body>
<style>
  :root {
    color-scheme: light;
    --paper: #ffffff; --ink: #222222; --ink-2: #666666; --ink-3: #9a9a9a;
    --rule: #dcdcdc; --grid: #ececec; --raw: #8f8f8f; --raw-dot: #8c8c8c; --clean: #444444;
    --ma: #2a78d6; --med: #1baf7a; --wm: #4a3aa7; --ewma: #eb6834;
    --sans: "Helvetica Neue", Helvetica, -apple-system, Arial, sans-serif;
    --mono: Menlo, "SF Mono", Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.4; padding-block: 10px 10px; padding-inline: 14px; -webkit-font-smoothing: antialiased; }
  .stage { max-width: 1880px; margin: 0 auto; display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 10px; height: calc(100vh - 20px); }
  .slide { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 16px 30px 8px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 6px; min-height: 0; position: relative; outline: none; cursor: pointer; user-select: none; }
  .slide:focus-visible { box-shadow: 0 0 0 3px rgba(42,120,214,.35); }
  .head h1 { margin: 0; font-size: clamp(20px, 2.2vw, 28px); font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; line-height: 1.15; }
  .head h1 .tag { display: inline-block; font-family: var(--mono); font-weight: 400; font-size: 0.6em; color: var(--ink-2); margin-left: 10px; vertical-align: middle; background: #f4f4f4; padding: 2px 8px; border-radius: 4px; }
  .head p { margin: 6px 0 0; color: #444; font-size: clamp(15px, 1.6vw, 18px); max-width: none; }
  .chart-wrap { position: relative; min-height: 0; height: 100%; display: flex; justify-content: center; align-items: center; }
  svg.chart { display: block; height: 100%; width: auto; max-width: 100%; max-height: 100%; overflow: visible; }
  .tt { position: absolute; pointer-events: none; display: none; background: #fff; border: 1px solid var(--rule); border-radius: 4px; padding: 6px 9px; font-family: var(--mono); font-size: 12px; color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,.08); white-space: nowrap; z-index: 2; }
  .tt .row { display: flex; gap: 10px; justify-content: space-between; }
  .foot { position: absolute; top: 9px; right: 16px; display: flex; gap: 14px; align-items: baseline; font-size: 12px; color: var(--ink-3); padding: 0; pointer-events: none; }
  .foot .ctr { font-family: var(--mono); }
  .bar { display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; padding:9px 14px; border:1px solid var(--rule); border-radius:6px; background:#f6f7f9; font-size:14px; color:var(--ink); }
  .group { display:flex; align-items:center; gap:8px; }
  .group label { font-size:13px; font-weight:700; color:var(--ink); }
  .val { font-family:var(--mono); font-size:14px; font-weight:700; color:var(--ma); min-width:5ch; }
  button, select { font:inherit; font-size:14px; color:var(--ink); background:#fff; border:1px solid #9a9a9a; border-radius:5px; padding:7px 13px; cursor:pointer; }
  button:hover, select:hover { border-color:var(--ink); }
  button.primary { background:var(--ma); color:#fff; border-color:var(--ma); min-width:88px; font-weight:700; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline:2px solid var(--ma); outline-offset:2px; }
  input[type=range] { accent-color:var(--ma); width:150px; height:30px; cursor:pointer; }
  .hint { margin-left:auto; color:var(--ink-2); font-size:12px; }
  .hint kbd { font-family:var(--mono); background:#fff; border:1px solid var(--rule); border-radius:3px; padding:0 5px; font-size:11px; }
  .grid line { stroke: var(--grid); stroke-width: 1; }
  .axis line, .axis path { stroke: var(--ink-2); stroke-width: 1; fill: none; }
  .axis text { font-family: var(--mono); font-size: 15px; fill: var(--ink-2); }
  .axis-title { font-family: var(--sans); font-size: 18px; fill: var(--ink-2); }
  .ptitle { font-family: var(--sans); font-size: 15px; font-weight: 700; fill: var(--ink); }
  .wave-fill { fill: #8f8f8f; stroke: none; }
  .win-rect { fill: rgba(42,120,214,.15); stroke: var(--ma); stroke-width: 1.5; }
  .pitch-line { fill: none; stroke: var(--ma); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
  .int-line { fill: none; stroke: var(--ewma); stroke-width: 2.2; stroke-dasharray: 6 4; stroke-linejoin: round; }
  .dlabel { font-family: var(--sans); font-size: 13px; font-weight: 700; }
  .mono { font-family: var(--mono); font-size: 15px; fill: var(--ink); }
  .crosshair { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 2 2; }
  @media (max-width: 720px) { .slide { padding: 18px 16px 12px; min-height: 0; } .hint { display: none; } }
  .hint { display:none !important; }
  button.tb { min-width:44px; padding:6px 10px; font-size:17px; line-height:1; }
  button.primary.tb { min-width:52px; }
</style>

<div class="stage">
  <section class="slide" id="slide" tabindex="0" aria-live="polite">
    <div class="head">
      <h1 id="title">Intensity</h1>
      <p id="subtitle"></p>
    </div>
    <div class="chart-wrap">
      <svg class="chart" id="chart" viewBox="0 0 1500 680" role="img" aria-label="Waveform with pitch and intensity contours"></svg>
      <div class="tt" id="tt"></div>
    </div>
    <div class="foot">
      <span>CS328 &nbsp;·&nbsp; Voice-Based Health Analytics</span>
      <span class="ctr" id="counter"></span>
    </div>
  </section>

  <div class="bar">
    <div class="group">
      <button id="prev" class="tb" title="Previous step (←)">⏮</button>
      <button id="play" class="primary tb" title="Play / pause (space)">▶</button>
      <button id="next" class="tb" title="Next step (→)">⏭</button>
      <button id="restart" class="tb" title="Restart this step (r)">↺</button>
      <button id="reset" title="Reset all dials to defaults">Reset dials</button>
    </div>
    <div class="group">
      <label for="clip">Clip</label>
      <select id="clip">
        <option value="sad" selected>sad_DC_sa01.wav</option>
        <option value="angry">angry_DC_a01.wav</option>
      </select>
    </div>
    <div class="group">
      <label for="rmsw">RMS window</label>
      <input type="range" id="rmsw" min="10" max="100" step="2" value="46">
      <span class="val" id="rmswVal">46 ms</span>
    </div>
    <div class="group">
      <label for="speed">Speed</label>
      <select id="speed">
        <option value="6">very slow</option>
        <option value="12">slow</option>
        <option value="25" selected>normal</option>
        <option value="60">fast</option>
        <option value="0">instant</option>
      </select>
    </div>
    <span class="hint"><kbd>→</kbd> finish / next &nbsp; <kbd>←</kbd> back &nbsp; <kbd>space</kbd> play</span>
  </div>
</div>

    const yy = v => y1 - (v - lo) / (hi - lo) * (y1 - y0);
    const ticks = kind === 'pitch' ? [100, 200, 300] : [-40, -30, -20, -10, 0];
    ticks.forEach(v => { el('line', { x1: PL, x2: PL + PW, y1: yy(v), y2: yy(v) }, grid); el('text', { x: PL - 8, y: yy(v) + 4, 'text-anchor': 'end' }, axis).textContent = v; });
    el('path', { d: `M${PL},${y0}V${y1}H${PL + PW}` }, axis);
    yTitle(g, y0, y1, kind === 'pitch' ? 'F₀ (Hz)' : (y1 - y0 < 100 ? 'dB' : 'intensity (dB)'));
    el('text', { x: PL, y: y0 - 8, class: 'ptitle' }, g).textContent = kind === 'pitch' ? 'pitch contour' : 'intensity contour';
    const vals = kind === 'pitch' ? c.f0 : c.rmsDb;
    let d = '', pen = false;
    for (let k = 0; k < Math.min(c.T, upto); k++) { const v = vals[k]; if (v == null) { pen = false; continue; } d += (pen ? 'L' : 'M') + tx(c.times[k]).toFixed(1) + ',' + yy(v).toFixed(1); pen = true; }
    if (d) el('path', { class: kind === 'pitch' ? 'pitch-line' : 'int-line', d }, g);
    const k = Math.min(c.T - 1, upto - 1);
    if (upto > 0 && upto < c.T) {
      const v = vals[k];
      if (v != null) { el('circle', { cx: tx(c.times[k]), cy: yy(v), r: 5, fill: kind === 'pitch' ? 'var(--ma)' : 'var(--ewma)', stroke: '#fff', 'stroke-width': 1.5 }, g); el('text', { x: tx(c.times[k]) + 10, y: yy(v) - 10, class: 'dlabel', fill: kind === 'pitch' ? 'var(--ma)' : 'var(--ewma)' }, g).textContent = kind === 'pitch' ? `F₀ = ${v.toFixed(0)} Hz` : `${v.toFixed(1)} dB`; }
      else if (kind === 'pitch') { el('text', { x: tx(c.times[k]) + 10, y: y0 + 18, class: 'dlabel', fill: 'var(--ink-2)' }, g).textContent = 'unvoiced'; }
    }
    return yy;
  }
  function zoomPanel(g, c, k, y0, y1) {
    const t = c.times[k], w = 0.046, half = w / 2;
    const i0 = Math.round((t - half - c.t0) * FS), n = Math.round(w * FS);
    const grid = el('g', { class: 'grid' }, g), axis = el('g', { class: 'axis' }, g);
    const xx = ms => PL + (ms / (w * 1000)) * PW;
    let mx = 0.05; for (let i = i0; i < i0 + n; i++) if (i >= 0 && i < c.x.length) mx = Math.max(mx, Math.abs(c.x[i]));
    mx = Math.ceil(mx * 10) / 10;
    const yy = v => (y0 + y1) / 2 - v / mx * (y1 - y0) / 2;
    for (let ms = 0; ms <= 46; ms += 5) { el('line', { x1: xx(ms), x2: xx(ms), y1: y0, y2: y1 }, grid); el('text', { x: xx(ms), y: y1 + 16, 'text-anchor': 'middle' }, axis).textContent = ms; }
    [-mx, 0, mx].forEach(v => { el('line', { x1: PL, x2: PL + PW, y1: yy(v), y2: yy(v) }, grid); el('text', { x: PL - 8, y: yy(v) + 4, 'text-anchor': 'end' }, axis).textContent = v.toFixed(1); });
    el('path', { d: `M${PL},${y0}V${y1}H${PL + PW}` }, axis);
    el('text', { x: PL + PW + 22, y: y1 + 16, class: 'axis-title' }, g).textContent = 'ms';
    el('text', { x: PL, y: y0 - 8, class: 'ptitle' }, g).textContent = `the 46-ms window at ${t.toFixed(2)} s`;
    const f0 = c.f0[k];
    if (f0 != null) {
      const T0 = 1000 / f0;
      // period marks aligned to the largest peak in the window
      let pk = 0, pv = -1e9; for (let i = 0; i < n; i++) { const v = c.x[i0 + i] || 0; if (v > pv) { pv = v; pk = i; } }
      const base = (pk / FS * 1000) % T0;
      for (let m = base; m <= w * 1000; m += T0) el('line', { x1: xx(m), x2: xx(m), y1: y0, y2: y1, stroke: 'var(--ma)', 'stroke-width': 1, 'stroke-dasharray': '4 3' }, g);
      const a = base, b = base + T0;
      el('path', { d: `M${xx(a)},${y0 + 14}H${xx(b)}`, stroke: 'var(--ma)', 'stroke-width': 2, 'marker-start': 'url(#arrL)', 'marker-end': 'url(#arrR)' }, g);
      el('text', { x: xx(b) + 6, y: y0 + 18, class: 'dlabel', fill: 'var(--ma)' }, g).textContent = `T₀ = ${T0.toFixed(2)} ms  →  F₀ = 1/T₀ = ${f0.toFixed(0)} Hz`;
    } else {
      el('text', { x: PL + 8, y: y0 + 18, class: 'dlabel', fill: 'var(--ink-2)' }, g).textContent = 'no periodic structure: unvoiced';
    }
    let d = ''; for (let i = 0; i < n; i++) { const v = (i0 + i >= 0 && i0 + i < c.x.length) ? c.x[i0 + i] : 0; d += (i ? 'L' : 'M') + xx(i / FS * 1000).toFixed(1) + ',' + yy(v).toFixed(1); }
    el('path', { d, fill: 'none', stroke: '#333', 'stroke-width': 1.2 }, g);
  }

  // ------------------------------------------------------------ render
  function render() {
    chart.innerHTML = '';
    hoverFn = null;
    const defs = el('defs', {}, chart);
    [['arrL', 'M10,0L0,5L10,10Z', 1], ['arrR', 'M0,0L10,5L0,10Z', 9]].forEach(([id, d, refX]) => { const m = el('marker', { id, viewBox: '0 0 10 10', refX, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto' }, defs); el('path', { d, fill: 'var(--ma)' }, m); });
    const d = steps[step];
    const cur = Math.min(d.n, cursor);
    if (d.id === 'int') {
      const c = CLIPS[clipId];
      const k = Math.max(0, Math.min(c.T - 1, cur - 1));
      const g = el('g', {}, chart); wavePanel(g, c, 40, 300, `waveform: ${c.name}`);
      if (cur < c.T) windowRect(g, c, k, 40, 300, rmsMs);
      legend(g, PL + 8, 46, [{ c: '#8f8f8f', n: 'waveform', box: true }, { c: 'rgba(42,120,214,.3)', s: 'var(--ma)', n: `RMS window (${rmsMs} ms)`, box: true }]);
      const g2 = el('g', {}, chart); contourPanel(g2, c, 380, 620, 'int', cur, true);
      legend(g2, PL + 8, 386, [{ c: 'var(--ewma)', n: 'intensity = 20·log10(RMS)', dash: true }]);
      el('text', { x: PL + PW - 8, y: 402, class: 'mono', 'text-anchor': 'end' }, g2).textContent = 'RMS = sqrt( (1/N) Σ x[i]² )';
      hoverFn = mkHover(c, [[40, 300], [380, 620]]);
    } else if (d.id === 'pitch') {
      const c = CLIPS[clipId];
      const k = Math.max(0, Math.min(c.T - 1, cur - 1));
      const g = el('g', {}, chart); wavePanel(g, c, 30, 190, `waveform: ${c.name}`);
      if (cur < c.T) windowRect(g, c, k, 30, 190, 46);
      legend(g, PL + 8, 36, [{ c: '#8f8f8f', n: 'waveform', box: true }, { c: 'rgba(42,120,214,.3)', s: 'var(--ma)', n: 'current 46-ms window', box: true }]);
      const g2 = el('g', {}, chart); zoomPanel(g2, c, cur < c.T ? k : c.T - 1, 250, 380);
      const g3 = el('g', {}, chart); contourPanel(g3, c, 460, 640, 'pitch', cur, true);
      legend(g3, PL + 8, 466, [{ c: 'var(--ma)', n: 'pitch F₀ (Hz), voiced windows only' }]);
      hoverFn = mkHover(c, [[30, 190], [460, 640]]);
    } else {
      const rows = [['sad', 40, 180, 232, 312], ['angry', 372, 512, 564, 644]];
      rows.forEach(([id, wy0, wy1, iy0, iy1], r) => {
        const c = CLIPS[id]; const up = Math.min(c.T, cur);
        const k = Math.max(0, up - 1);
        const g = el('g', {}, chart); const wp = wavePanel(g, c, wy0, wy1, `${c.label} clip: ${c.name}`);
        if (up < c.T) windowRect(g, c, k, wy0, wy1, rmsMs);
        // pitch on a right-hand axis over the waveform
        const yy = v => wy1 - (v - 60) / (350 - 60) * (wy1 - wy0);
        const axis = el('g', { class: 'axis' }, g);
        [100, 200, 300].forEach(v => { el('line', { x1: PL + PW, x2: PL + PW + 4, y1: yy(v), y2: yy(v) }, axis); el('text', { x: PL + PW + 8, y: yy(v) + 4, fill: 'var(--ma)' }, axis).textContent = v; });
        yTitle(g, wy0, wy1, 'F₀ (Hz)', PL + PW + 56, { fill: 'var(--ma)' });
        let dd = '', pen = false; for (let j = 0; j < up; j++) { const v = c.f0[j]; if (v == null) { pen = false; continue; } dd += (pen ? 'L' : 'M') + tx(c.times[j]).toFixed(1) + ',' + yy(v).toFixed(1); pen = true; }
        if (dd) el('path', { class: 'pitch-line', d: dd }, g);
        if (up > 0 && up < c.T && c.f0[k] != null) el('circle', { cx: tx(c.times[k]), cy: yy(c.f0[k]), r: 5, fill: 'var(--ma)', stroke: '#fff', 'stroke-width': 1.5 }, g);
        legend(g, PL + PW - 275, wy0 + 6, [{ c: '#8f8f8f', n: 'waveform', box: true }, { c: 'var(--ma)', n: 'pitch F₀ (Hz, right axis)' }, { c: 'var(--ewma)', n: 'intensity (dB, panel below)', dash: true }]);
        const g2 = el('g', {}, chart); contourPanel(g2, c, iy0, iy1, 'int', up, r === 1);
      });
      hoverFn = null;
    }
  }
  function mkHover(c, ranges) {
    return (px, py) => {
      if (px < PL || px > PL + PW || !ranges.some(([a, b]) => py >= a && py <= b)) return null;
      const t = (px - PL) / PW * TMAX; const k = Math.round((t - c.f0t0) / HOP);
      if (k < 0 || k >= c.T) return null;
      const f0 = c.f0[k];
      return `<div class="row"><span>time</span><b>${c.times[k].toFixed(3)} s</b></div><div class="row"><span>F₀</span><span>${f0 == null ? 'unvoiced' : f0.toFixed(1) + ' Hz'}</span></div><div class="row"><span>intensity</span><span>${c.rmsDb[k].toFixed(1)} dB</span></div>`;
    };
  }

  // ------------------------------------------------------------ hover
  const tt = $('tt');
  function hover(evt) {
    if (!hoverFn) { unhover(); return; }
    const pt = chart.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY;
    const p = pt.matrixTransform(chart.getScreenCTM().inverse());
    const html = hoverFn(p.x, p.y);
    if (!html) { unhover(); return; }
    tt.innerHTML = html; tt.style.display = 'block';
    const wrap = chart.parentElement.getBoundingClientRect();
    const px = evt.clientX - wrap.left, py = evt.clientY - wrap.top;
    tt.style.left = (px + 16 + tt.offsetWidth > wrap.width ? px - tt.offsetWidth - 12 : px + 16) + 'px';
    tt.style.top = Math.max(0, py - 10) + 'px';
  }
  function unhover() { tt.style.display = 'none'; }

  // ------------------------------------------------------------ step control
  function setHead() { const d = steps[step]; $('title').innerHTML = d.title + (d.tag ? `<span class="tag">${d.tag}</span>` : ''); $('subtitle').textContent = d.subtitle; $('counter').textContent = `${step + 1} / ${steps.length}`; }
  function enterStep(k, completed = false) {
    step = k; setHead();
    try { history.replaceState(null, '', '#' + (step + 1)); } catch (_) {}
    stopPlay(); cursor = 0;
    if (completed || speed === 0 || reduceMotion) finish(); else { render(); startPlay(); }
  }
  function cursorDone() { return cursor >= steps[step].n; }
  function finish() { cursor = steps[step].n; stopPlay(); render(); }
  function tick(t) {
    if (!playing) return;
    const dt = Math.max(0, Math.min(0.1, (t - lastT) / 1000)); lastT = t;
    acc += dt * speed;
    while (acc >= 1 && cursor < steps[step].n) { cursor++; acc -= 1; }
    render();
    if (cursorDone()) { finish(); return; }
    raf = requestAnimationFrame(tick);
  }
  function startPlay() { if (cursorDone()) return; playing = true; lastT = performance.now(); acc = 0; $('play').textContent = '⏸'; raf = requestAnimationFrame(tick); }
  function stopPlay() { playing = false; cancelAnimationFrame(raf); $('play').textContent = '▶'; }
  function next() { if (!cursorDone()) { finish(); return; } if (step < steps.length - 1) enterStep(step + 1); }
  function prev() { if (step > 0) enterStep(step - 1, true); }
  function restart() { enterStep(step); }
  function rebuild() {
    const frac = steps ? cursor / steps[step].n : 0;
    computeAll(); steps = stepDefs();
    cursor = Math.round(frac * steps[step].n);
    setHead(); render(); if (cursorDone()) stopPlay();
  }
  function applyDial(id, v) {
    if (id === 'clip') { clipId = v; $('clip').value = v; }
    if (id === 'rmsw') { rmsMs = v; $('rmsw').value = v; $('rmswVal').textContent = v + ' ms'; }
  }

  // ------------------------------------------------------------ wiring
  $('next').addEventListener('click', e => { e.stopPropagation(); next(); });
  $('prev').addEventListener('click', e => { e.stopPropagation(); prev(); });
  $('restart').addEventListener('click', e => { e.stopPropagation(); restart(); });
  $('play').addEventListener('click', e => { e.stopPropagation(); if (playing) stopPlay(); else if (cursorDone()) restart(); else startPlay(); });
  $('slide').addEventListener('click', () => next());
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
    else if (e.key === ' ') { e.preventDefault(); $('play').click(); }
    else if (e.key === 'r' || e.key === 'R') restart();
  });
  $('clip').addEventListener('change', e => { dirty.clip = true; applyDial('clip', e.target.value); rebuild(); });
  $('rmsw').addEventListener('input', e => { dirty.rmsw = true; applyDial('rmsw', parseInt(e.target.value, 10)); rebuild(); });
  $('speed').addEventListener('change', e => { speed = parseInt(e.target.value, 10); });
  $('reset').addEventListener('click', e => { e.stopPropagation(); dirty.clip = dirty.rmsw = false; applyDial('clip', 'sad'); applyDial('rmsw', 46); rebuild(); restart(); });
  chart.addEventListener('mousemove', hover);
  chart.addEventListener('mouseleave', unhover);

  const h = parseInt((location.hash || '').replace('#', ''), 10);
  if (h >= 1 && h <= 3) step = h - 1;
  computeAll(); steps = stepDefs();
  enterStep(step);
})();
</script>
</body>
</html>

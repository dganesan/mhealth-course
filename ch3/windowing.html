<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Segmenting a Stream into Windows</title>
</head>
<body>
<style>
  :root {
    color-scheme: light;
    --paper: #ffffff;
    --ink: #222222;
    --ink-2: #666666;
    --ink-3: #9a9a9a;
    --rule: #dcdcdc;
    --grid: #ececec;
    --raw: #8f8f8f;
    --raw-dot: #8c8c8c;
    --clean: #444444;
    --window: rgba(34, 34, 34, 0.06);
    --window-edge: #222222;
    --ma: #2a78d6;
    --med: #1baf7a;
    --wm: #4a3aa7;
    --ewma: #eb6834;
    --sans: "Helvetica Neue", Helvetica, -apple-system, Arial, sans-serif;
    --mono: Menlo, "SF Mono", Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.4;
    padding-block: 10px 10px;
    padding-inline: 14px;
    -webkit-font-smoothing: antialiased;
  }
  .stage { max-width: 1880px; margin: 0 auto; display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 10px; height: calc(100vh - 20px); }

  /* ---------- slide frame ---------- */
  .slide {
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 16px 30px 8px;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    gap: 6px;
    min-height: 0;
    position: relative;
    outline: none;
    cursor: pointer;
    user-select: none;
  }
  .slide:focus-visible { box-shadow: 0 0 0 3px rgba(42,120,214,.35); }
  .head h1 {
    margin: 0;
    font-size: clamp(24px, 2.4vw, 36px);
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.15;
  }
  .head h1 .tag {
    display: inline-block;
    font-family: var(--mono);
    font-weight: 400;
    font-size: 0.6em;
    color: var(--ink-2);
    margin-left: 10px;
    vertical-align: middle;
    background: #f4f4f4;
    padding: 2px 8px;
    border-radius: 4px;
    white-space: nowrap;
  }
  .head p { margin: 6px 0 0; color: #444; font-size: clamp(18px, 1.7vw, 24px); max-width: none; }
  .head p:empty { display: none; }
  .code { margin: 8px 0 0; font-family: var(--mono); font-size: clamp(15px, 1.4vw, 21px); color: var(--ink); background: #f4f6f9; border: 1px solid var(--rule); border-radius: 5px; padding: 6px 12px; white-space: pre; overflow-x: auto; }
  .code[hidden] { display: none; }
  .code .p { color: var(--ma); font-weight: 700; }

  .chart-wrap { position: relative; min-height: 0; height: 100%; display: flex; justify-content: center; align-items: center; }
  svg.chart { display: block; height: 100%; width: auto; max-width: 100%; max-height: 100%; overflow: visible; }
  .tt {
    position: absolute; pointer-events: none; display: none;
    background: #fff; border: 1px solid var(--rule); border-radius: 4px;
    padding: 6px 9px; font-family: var(--mono); font-size: 15px; color: var(--ink);
    box-shadow: 0 2px 8px rgba(0,0,0,.08); white-space: nowrap; z-index: 2;
  }
    box-shadow: 0 2px 8px rgba(0,0,0,.08); white-space: nowrap; z-index: 2;
  }
  .tt .row { display: flex; gap: 10px; justify-content: space-between; }
  .tt .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

  .foot { position: absolute; top: 9px; right: 16px; display: flex; gap: 14px; align-items: baseline; font-size: 14px; color: var(--ink-3); padding: 0; pointer-events: none; }
  .foot .ctr { font-family: var(--mono); }

  /* ---------- control bar ---------- */
  .bar { display:flex; flex-direction:column; gap:12px; padding:12px 24px;
         border:1px solid var(--rule); border-radius:6px; background:#f6f7f9; font-size:19px; color:var(--ink); }
  .bar .row { display:flex; justify-content:flex-start; align-items:center; gap:16px 32px; flex-wrap:wrap; }
  .bar .row.dials .group { flex:1 1 0; }
  .bar .row.dials input[type=range] { flex:1 1 auto; width:auto; }
  .group { display:flex; align-items:center; gap:10px; }
  .group label { font-size:18px; font-weight:700; color:var(--ink); letter-spacing:0; text-transform:none; white-space:nowrap; }
  .val { font-family:var(--mono); font-size:19px; font-weight:700; color:var(--ma); min-width:5ch; white-space:nowrap; }
  button, select { font:inherit; font-size:18px; color:var(--ink); background:#fff; border:1px solid #9a9a9a; border-radius:6px; padding:9px 16px; cursor:pointer; }
  button:hover, select:hover { border-color:var(--ink); }
  button.primary { background:var(--ma); color:#fff; border-color:var(--ma); min-width:88px; font-weight:700; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline:2px solid var(--ma); outline-offset:2px; }
  input[type=range] { -webkit-appearance:none; appearance:none; accent-color:var(--ma); width:260px; height:36px; background:transparent; cursor:pointer; }
  input[type=range]::-webkit-slider-runnable-track { height:8px; border-radius:4px; background:#c9d1dc; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:26px; height:26px; border-radius:50%; background:var(--ma); border:3px solid #fff; box-shadow:0 0 0 1.5px var(--ma); margin-top:-9px; }
  input[type=range]::-moz-range-track { height:8px; border-radius:4px; background:#c9d1dc; }
  input[type=range]::-moz-range-thumb { width:26px; height:26px; border-radius:50%; background:var(--ma); border:3px solid #fff; }
  .hint { margin-left:auto; color:var(--ink-2); font-size:12px; }
  .hint kbd { font-family:var(--mono); background:#fff; border:1px solid var(--rule); border-radius:3px; padding:0 5px; font-size:11px; }

  /* ---------- svg parts ---------- */
  .grid line { stroke: var(--grid); stroke-width: 1.3; }
  .axis line, .axis path { stroke: var(--ink-2); stroke-width: 1.3; fill: none; }
  .axis text { font-family: var(--mono); font-size: 20px; fill: var(--ink-2); }
  .axis-title { font-family: var(--sans); font-size: 22px; fill: var(--ink-2); }
  .raw-line { fill: none; stroke: var(--raw); stroke-width: 2.0; }
  .out-line { fill: none; stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; }
  .thin-line { fill: none; stroke-width: 1.7; stroke-linejoin: round; }
  .win-rect { fill: var(--window); stroke: var(--window-edge); stroke-width: 1; stroke-dasharray: 3 3; }
  .dlabel { font-family: var(--sans); font-size: 17px; font-weight: 700; }
  .mono { font-family: var(--mono); font-size: 20px; fill: var(--ink); }
  .mono-2 { font-family: var(--mono); font-size: 20px; fill: var(--ink-2); }
  .note { font-family: var(--sans); font-size: 20px; fill: var(--ink-2); }
  .crosshair { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 2 2; }
  .cursor-line { stroke: var(--ink); stroke-width: 1.3; stroke-dasharray: 3 3; opacity: .7; }

  @media (max-width: 720px) {
    .slide { padding: 18px 16px 12px; min-height: 0; }
    .hint { display: none; }
  }

  .hint { display:none !important; }
  button.tb { min-width:54px; padding:9px 12px; font-size:22px; line-height:1; }
  button.primary.tb { min-width:64px; }
</style>

<div class="stage">
  <section class="slide" id="slide" tabindex="0" aria-live="polite">
    <div class="head">
      <h1 id="title"></h1>
      <p id="subtitle"></p>
      <pre class="code" id="code" hidden></pre>
    </div>
    <div class="chart-wrap">
      <svg class="chart" id="chart" viewBox="0 0 1360 620" role="img" aria-label="A stream of acceleration magnitude cut into windows"></svg>
      <div class="tt" id="tt"></div>
    </div>
    <div class="foot">

    </div>
  </section>

  <div class="bar">
   <div class="row">
    <div class="group">
      <button id="prev" class="tb" title="Previous step (←)">⏮</button>
      <button id="play" class="primary tb" title="Play / pause (space)">▶</button>
      <button id="next" class="tb" title="Next step (→)">⏭</button>
      <button id="restart" class="tb" title="Restart this step (r)">↺</button>
      <button id="reset" title="Reset all dials to the step's presets">Reset dials</button>
    </div>
    <div class="group">
      <label for="speed">Speed</label>
      <select id="speed">

        <option value="slow">slow</option>
        <option value="normal" selected>normal</option>
        <option value="fast">fast</option>
        <option value="instant">instant</option>
      </select>
    </div>
   </div>
   <div class="row dials">
    <div class="group">
      <label for="win">Window length</label>

      <span class="val" id="ovVal">0 %</span>
    </div>
   </div>
  </div>
</div>

      let m = 0; for (let i = i0; i < i1; i++) m += STREAM[i]; m /= (i1 - i0);
      const la = labelAt(a), lb = labelAt(b - 1 / FS);
      out.push({ k: k + 1, a, b, mean: m, label: la === lb ? la : `${la} + ${lb}: label ?` });
      if (out.length > 400) break;
    }
    return out;
  }
  const tagTxt = () => `w = ${wTxt()} · overlap ${ov()} % · ${windows().length} windows`;

  const PAGE = {
    defaults: { win: 2, ov: 0 },
    durNormal: 6,
    steps: [
      { id: 'stream', title: () => 'Continuous stream of samples', tag: () => `50 Hz · ${VIEW} s shown`,
        subtitle: '' },
      { id: 'nonov', presets: { win: 2, ov: 0 }, title: () => `Non-overlapping ${w() < 1 ? fmt(w(), 1) : w()}-second windows`, tag: tagTxt,
        subtitle: () => `Cutting the stream into consecutive windows of ${Math.round(w() * FS)} samples, each producing one feature vector.` },
      { id: 'ov', presets: { win: 2, ov: 50 }, title: () => `Overlapping windows`, tag: tagTxt,
        subtitle: () => `Sliding windows with ${ov()} % overlap, each starting ${fmt(stepLen(), 1)} s after the previous.` },
      { id: 'short', presets: { win: 0.2, ov: 0 }, title: 'Window shorter than one step', tag: tagTxt,
        subtitle: '' },
      { id: 'long', presets: { win: 30, ov: 0 }, title: 'Window spanning two activities', tag: tagTxt,
        subtitle: '' }
    ],
    setup(step) {
      VIEW = viewFor(step);
      chart.innerHTML = ''; G = {};
      const xt = []; const dx = VIEW <= 4 ? 0.5 : VIEW <= 15 ? 1 : 5; for (let v = 0; v <= VIEW + 1e-9; v += dx) xt.push(v);
      drawAxes(chart, { x0: P.x0, x1: P.x1, y0: P.y0, y1: P.yAx, xs, ys, xTicks: xt, yTicks: [0, 5, 10, 15, 20], xTitle: 'time (seconds)', yTitle: '|a| (m/s²)', xFmt: v => dx < 1 ? fmt(v, 1) : v });
      G.strip = el('g', {}, chart);
      G.sig = el('g', {}, chart);
      G.wins = el('g', {}, chart);
      G.anno = el('g', {}, chart);
      const items = [{ c: COL.ink2, n: 'acceleration magnitude |a|', w: 1.5 }];
      LABELS.filter(l => l.t0 < VIEW).forEach(l => items.push({ c: ACT_COL[l.name], n: `label: ${l.name}`, fill: true }));
      if (step.id !== 'stream') items.push({ c: '#8c8c8c', n: 'window', fill: true, op: .18, stroke: 'var(--ink-2)', dash: true });
      drawLegend(chart, P.x1 - 6, P.y1 - (items.length * 30 + 12) - 6, items, true);   // the 0–5 m/s² band is empty
      G.hover = el('g', {}, chart);
      el('rect', { x: P.x0, y: P.y0, width: P.x1 - P.x0, height: P.yAx - P.y0, fill: 'transparent' }, chart);
      drawStrip();
    },
    draw(step, t) {
      G.sig.innerHTML = ''; G.wins.innerHTML = ''; G.anno.innerHTML = '';
      const last = Math.min(Math.round(VIEW * FS), N) - 1;
      const upto = step.id === 'stream' ? Math.min(last, Math.floor(t * FS)) : last;
      el('path', { class: 'thin-line', d: path(upto), stroke: COL.ink2, 'stroke-width': 1.2 }, G.sig);
      if (step.id === 'stream') {
        if (t < VIEW - 1e-9) { el('line', { class: 'cursor-line', x1: xs(t), x2: xs(t), y1: P.y0, y2: P.yAx }, G.sig); txt(G.sig, xs(t) + 6, P.y1 - 8, `t = ${fmt(t, 2)} s · sample ${upto + 1}`, { class: 'mono-2' }); }
        return;
      }
      drawWindows(t);
      if (step.id === 'short') drawStepPeriod();
    }
  };
  let G = {};
  const W = 1360;
  const P = { x0: 80, x1: W - 36, y0: 40, y1: 468, yAx: 500 };  // signal 0..22 lives in y0..y1, label strip between y1 and yAx
  const xs = t => P.x0 + (t / VIEW) * (P.x1 - P.x0);
  const ys = v => P.y1 - (v / 22) * (P.y1 - P.y0);
  function path(upto) { let d = ''; for (let i = 0; i <= upto; i++) d += (i ? 'L' : 'M') + xs(i / FS).toFixed(1) + ',' + ys(STREAM[i]).toFixed(1); return d; }
  function drawStrip() {
    LABELS.forEach(l => {
      if (l.t0 >= VIEW) return;
      const a = xs(l.t0), b = xs(Math.min(l.t1, VIEW));
      el('rect', { x: a, y: P.y1 + 6, width: b - a, height: P.yAx - P.y1 - 10, fill: ACT_COL[l.name], 'fill-opacity': .35 }, G.strip);
      txt(G.strip, (a + b) / 2, P.yAx - 9, `label: ${l.name}`, { class: 'dlabel', 'text-anchor': 'middle', fill: 'var(--ink)' });
    });
  }
  function drawWindows(t) {
    const ws = windows(), o = ov();
    const nl = o === 0 ? 1 : Math.min(5, Math.ceil(w() / stepLen()));
    const oneLine = !ws.length || xs(ws[0].b) - xs(ws[0].a) >= 270;   // 'mean = 10.0 · Walking' fits on one line only in wide windows
    const laneH = oneLine ? 44 : 64;
    ws.forEach((win, j) => {
      if (win.a >= t) return;
      const doneW = win.b <= t + 1e-9;
      const xa = xs(win.a), xb = xs(Math.min(win.b, t)), xe = xs(win.b), wpx = xe - xa;
      // shading: alternate grey for non-overlapping (as in the chapter figure), blue while a window is being filled
      if (o === 0 && j % 2 === 0) el('rect', { x: xa, y: P.y0, width: xb - xa, height: P.y1 - P.y0, fill: '#8c8c8c', 'fill-opacity': .18 }, G.wins);
      if (!doneW) el('rect', { x: xa, y: P.y0, width: xb - xa, height: P.y1 - P.y0, fill: COL.blue, 'fill-opacity': .12 }, G.wins);
      if (o === 0) { el('line', { x1: xa, x2: xa, y1: P.y0, y2: P.y1, stroke: 'var(--ink-2)', 'stroke-width': .8, 'stroke-dasharray': '4 3' }, G.wins); if (doneW) el('line', { x1: xe, x2: xe, y1: P.y0, y2: P.y1, stroke: 'var(--ink-2)', 'stroke-width': .8, 'stroke-dasharray': '4 3' }, G.wins); }
      // bracket in a lane
      const ly = P.y0 + 12 + (j % nl) * laneH;
      const g = el('g', {}, G.wins);
      el('path', { d: `M${xa},${ly + 6}V${ly}H${xb}` + (doneW ? `V${ly + 6}` : ''), fill: 'none', stroke: doneW ? 'var(--ink)' : COL.blue, 'stroke-width': 1.2 }, g);
      if (!doneW) return;
      const cx = (xa + xe) / 2;
      const lc = win.label.endsWith('?') ? COL.red : 'var(--ink)';
      if (wpx >= 140) {
        txt(g, cx, ly + 18, `window ${win.k}`, { class: 'dlabel', 'text-anchor': 'middle', fill: 'var(--ink)' });
        if (oneLine) txt(g, cx, ly + 40, `mean = ${fmt(win.mean, 1)} · ${win.label}`, { class: 'mono', 'text-anchor': 'middle', fill: lc });
        else { txt(g, cx, ly + 40, `mean = ${fmt(win.mean, 1)}`, { class: 'mono', 'text-anchor': 'middle', fill: 'var(--ink)' }); txt(g, cx, ly + 60, win.label, { class: 'mono', 'text-anchor': 'middle', fill: lc }); }
      } else if (wpx >= 34) {
        txt(g, cx, ly + 18, `${win.k}`, { class: 'dlabel', 'text-anchor': 'middle', fill: 'var(--ink)' });
        txt(g, cx, ly + 38, fmt(win.mean, 1), { class: 'mono', 'text-anchor': 'middle', 'font-size': 15 });
      }
    });
  }
  // step 4: mark one walking step (peak to peak) so the window can be compared with it
  function drawStepPeriod() {
    const n = Math.min(N, Math.round(VIEW * FS)), pk = [];
    for (let i = 1; i < n - 1 && pk.length < 2; i++) {
      if (STREAM[i] > 12 && STREAM[i] >= STREAM[i - 1] && STREAM[i] > STREAM[i + 1] && i / FS > 0.4 && (!pk.length || i - pk[pk.length - 1] >= 15)) pk.push(i);
    }
    if (pk.length < 2) return;
    const a = pk[0] / FS, b = pk[1] / FS, y = ys(Math.max(STREAM[pk[0]], STREAM[pk[1]])) - 22;
    const g = el('g', {}, G.anno);
    el('path', { d: `M${xs(a)},${y + 8}V${y}H${xs(b)}V${y + 8}`, fill: 'none', stroke: COL.red, 'stroke-width': 1.5 }, g);
    [pk[0], pk[1]].forEach(i => el('circle', { cx: xs(i / FS), cy: ys(STREAM[i]), r: 4, fill: 'none', stroke: COL.red, 'stroke-width': 1.5 }, g));
    txt(g, (xs(a) + xs(b)) / 2, y - 8, `one step ≈ ${fmt(b - a, 2)} s`, { class: 'dlabel', 'text-anchor': 'middle', fill: COL.red });
  }

  chart.addEventListener('mousemove', evt => {
    const p = svgPoint(chart, evt);
    const t = Math.max(0, Math.min(VIEW, (p.x - P.x0) / (P.x1 - P.x0) * VIEW));
    const i = Math.min(N - 1, Math.round(t * FS));
    G.hover.innerHTML = '';
    el('line', { class: 'crosshair', x1: xs(i / FS), x2: xs(i / FS), y1: P.y0, y2: P.y1 }, G.hover);
    let html = `<div class="row"><span>t</span><b>${fmt(i / FS, 2)} s</b></div><div class="row"><span>|a|</span><span>${fmt(STREAM[i])}</span></div><div class="row"><span>label</span><span>${labelAt(i / FS)}</span></div>`;
    if (cur().id !== 'stream') { const inW = windows().filter(x => x.a <= i / FS && i / FS < x.b && x.b <= ENG.t + 1e-9).map(x => x.k); if (inW.length) html += `<div class="row"><span>window</span><span>${inW.join(', ')}</span></div>`; }
    showTip(chart, evt, html);
  });
  chart.addEventListener('mouseleave', () => { hideTip(); if (G.hover) G.hover.innerHTML = ''; });

  dial('win', { valId: 'winVal', list: WINS, fmt: v => (v < 1 ? fmt(v, 1) : v) + ' s' });
  dial('ov', { valId: 'ovVal', list: OVS, fmt: v => v + ' %' });
  PAGE.steps.forEach(s => { s.span = () => VIEW; });
  boot();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accelerometer Traces of Six Activities</title>
</head>
<body>
<style>
  :root {
    color-scheme: light;
    --paper: #ffffff;
    --ink: #222222;
    --ink-2: #666666;
    --ink-3: #9a9a9a;
    --rule: #dcdcdc;
    --grid: #ececec;
    --raw: #8f8f8f;
    --raw-dot: #8c8c8c;
    --clean: #444444;
    --window: rgba(34, 34, 34, 0.06);
    --window-edge: #222222;
    --ma: #2a78d6;
    --med: #1baf7a;
    --wm: #4a3aa7;
    --ewma: #eb6834;
    --sans: "Helvetica Neue", Helvetica, -apple-system, Arial, sans-serif;
    --mono: Menlo, "SF Mono", Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.4;
    padding-block: 10px 10px;
    padding-inline: 14px;
    -webkit-font-smoothing: antialiased;
  }
  .stage { max-width: 1880px; margin: 0 auto; display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 10px; height: calc(100vh - 20px); }

  /* ---------- slide frame ---------- */
  .slide {
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 16px 30px 8px;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    gap: 6px;
    min-height: 0;
    position: relative;
    outline: none;
    cursor: pointer;
    user-select: none;
  }
  .slide:focus-visible { box-shadow: 0 0 0 3px rgba(42,120,214,.35); }
  .head h1 {
    margin: 0;
    font-size: clamp(20px, 2.2vw, 28px);
    font-weight: 700;
    letter-spacing: -0.01em;
    text-wrap: balance;
    line-height: 1.15;
  }
  .head h1 .tag {
    display: inline-block;
    font-family: var(--mono);
    font-weight: 400;
    font-size: 0.6em;
    color: var(--ink-2);
    margin-left: 10px;
    vertical-align: middle;
    background: #f4f4f4;
    padding: 2px 8px;
    border-radius: 4px;
    white-space: nowrap;
  }
  .head p { margin: 6px 0 0; color: #444; font-size: clamp(15px, 1.6vw, 18px); max-width: none; }
  .code { margin: 8px 0 0; font-family: var(--mono); font-size: clamp(13px, 1.35vw, 16px); color: var(--ink); background: #f4f6f9; border: 1px solid var(--rule); border-radius: 5px; padding: 6px 12px; white-space: pre; overflow-x: auto; }
  .code[hidden] { display: none; }
  .code .p { color: var(--ma); font-weight: 700; }

  .chart-wrap { position: relative; min-height: 0; height: 100%; display: flex; justify-content: center; align-items: center; }
  svg.chart { display: block; height: 100%; width: auto; max-width: 100%; max-height: 100%; overflow: visible; }
  .tt {
    position: absolute; pointer-events: none; display: none;
    background: #fff; border: 1px solid var(--rule); border-radius: 4px;
    padding: 6px 9px; font-family: var(--mono); font-size: 12px; color: var(--ink);
    box-shadow: 0 2px 8px rgba(0,0,0,.08); white-space: nowrap; z-index: 2;
  }
  .tt .row { display: flex; gap: 10px; justify-content: space-between; }
  .tt .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

  .foot { position: absolute; top: 9px; right: 16px; display: flex; gap: 14px; align-items: baseline; font-size: 12px; color: var(--ink-3); padding: 0; pointer-events: none; }
  .foot .ctr { font-family: var(--mono); }

  /* ---------- control bar ---------- */
  .bar { display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; padding:9px 14px; border:1px solid var(--rule); border-radius:6px; background:#f6f7f9; font-size:14px; color:var(--ink); }
  .group { display:flex; align-items:center; gap:8px; }
  .group label { font-size:13px; font-weight:700; color:var(--ink); letter-spacing:0; text-transform:none; }
  .val { font-family:var(--mono); font-size:14px; font-weight:700; color:var(--ma); min-width:5ch; }
  button, select { font:inherit; font-size:14px; color:var(--ink); background:#fff; border:1px solid #9a9a9a; border-radius:5px; padding:7px 13px; cursor:pointer; }
  button:hover, select:hover { border-color:var(--ink); }
  button.primary { background:var(--ma); color:#fff; border-color:var(--ma); min-width:88px; font-weight:700; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline:2px solid var(--ma); outline-offset:2px; }
  input[type=range] { accent-color:var(--ma); width:150px; height:30px; cursor:pointer; }
  .hint { margin-left:auto; color:var(--ink-2); font-size:12px; }
  .hint kbd { font-family:var(--mono); background:#fff; border:1px solid var(--rule); border-radius:3px; padding:0 5px; font-size:11px; }

  /* ---------- svg parts ---------- */
  .grid line { stroke: var(--grid); stroke-width: 1; }
  .axis line, .axis path { stroke: var(--ink-2); stroke-width: 1; fill: none; }
  .axis text { font-family: var(--mono); font-size: 15px; fill: var(--ink-2); }
  .axis-title { font-family: var(--sans); font-size: 18px; fill: var(--ink-2); }
  .raw-line { fill: none; stroke: var(--raw); stroke-width: 1.5; }
  .out-line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .thin-line { fill: none; stroke-width: 1.3; stroke-linejoin: round; }
  .win-rect { fill: var(--window); stroke: var(--window-edge); stroke-width: 1; stroke-dasharray: 3 3; }
  .dlabel { font-family: var(--sans); font-size: 13px; font-weight: 700; }
  .mono { font-family: var(--mono); font-size: 12px; fill: var(--ink); }
  .mono-2 { font-family: var(--mono); font-size: 12px; fill: var(--ink-2); }
  .note { font-family: var(--sans); font-size: 12px; fill: var(--ink-2); }
  .crosshair { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 2 2; }
  .cursor-line { stroke: var(--ink); stroke-width: 1; stroke-dasharray: 3 3; opacity: .7; }

  @media (max-width: 720px) {
    .slide { padding: 18px 16px 12px; min-height: 0; }
    .hint { display: none; }
  }

  .hint { display:none !important; }
  button.tb { min-width:44px; padding:6px 10px; font-size:17px; line-height:1; }
  button.primary.tb { min-width:52px; }
</style>

<div class="stage">
  <section class="slide" id="slide" tabindex="0" aria-live="polite">
    <div class="head">
      <h1 id="title"></h1>
      <p id="subtitle"></p>
      <pre class="code" id="code" hidden></pre>
    </div>
    <div class="chart-wrap">
      <svg class="chart" id="chart" viewBox="0 0 1360 620" role="img" aria-label="Three-axis accelerometer traces"></svg>
      <div class="tt" id="tt"></div>
    </div>
    <div class="foot">
      <span>CS328 &nbsp;·&nbsp; The Activity Recognition Pipeline</span>
      <span class="ctr" id="counter"></span>
    </div>
  </section>

  <div class="bar">
    <div class="group">
      <button id="prev" class="tb" title="Previous step (←)">⏮</button>
      <button id="play" class="primary tb" title="Play / pause (space)">▶</button>
      <button id="next" class="tb" title="Next step (→)">⏭</button>
      <button id="restart" class="tb" title="Restart this step (r)">↺</button>
      <button id="reset" title="Reset all dials to the step's presets">Reset dials</button>
    </div>
    <div class="group">
      <label for="start">Segment start</label>
      <input type="range" id="start" min="0" max="5" step="0.5" value="0">
      <span class="val" id="startVal">0.0 s</span>
    </div>
    <div class="group">
      <label for="axes">Axes shown</label>
      <select id="axes">
        <option value="xyz" selected>x, y and z</option>
        <option value="x">x only</option>
        <option value="y">y only</option>
        <option value="z">z only</option>
      </select>
    </div>
    <div class="group">
      <label for="speed">Speed</label>
      <select id="speed">
        <option value="vslow">very slow</option>
        <option value="slow">slow</option>
        <option value="normal" selected>normal</option>
        <option value="fast">fast</option>
        <option value="instant">instant</option>
      </select>
    </div>
    <span class="hint"><kbd>→</kbd> finish / next &nbsp; <kbd>←</kbd> back &nbsp; <kbd>space</kbd> play</span>
  </div>
</div>

  const txt = (parent, x, y, s, attrs = {}) => { const t = el('text', Object.assign({ x, y }, attrs), parent); t.textContent = s; return t; };
  const fmt = (v, d = 2) => (Math.round(v * Math.pow(10, d)) / Math.pow(10, d)).toFixed(d);
  const COL = { blue: '#2a78d6', red: '#eb6834', green: '#1baf7a', violet: '#4a3aa7', raw: '#8f8f8f', ink: '#222222', ink2: '#666666', ink3: '#9a9a9a' };
  const ACT_COL = { Walking: COL.blue, Sitting: COL.red };

  // axes: thin grid, mono ticks, 12 px sans titles
  function drawAxes(parent, o) {
    const grid = el('g', { class: 'grid' }, parent);
    const axis = el('g', { class: 'axis' }, parent);
    o.yTicks.forEach(v => {
      const y = o.ys(v);
      el('line', { x1: o.x0, x2: o.x1, y1: y, y2: y }, grid);
      txt(axis, o.x0 - 8, y + 4, o.yFmt ? o.yFmt(v) : v, { 'text-anchor': 'end' });
    });
    o.xTicks.forEach(v => {
      const x = o.xs(v);
      el('line', { x1: x, x2: x, y1: o.y0, y2: o.y1 }, grid);
      txt(axis, x, o.y1 + 17, o.xFmt ? o.xFmt(v) : v, { 'text-anchor': 'middle' });
    });
    el('path', { d: `M${o.x0},${o.y0}V${o.y1}H${o.x1}` }, axis);
    if (o.xTitle) txt(parent, o.x1, o.y1 + 38, o.xTitle, { class: 'axis-title', 'text-anchor': 'end' });
    if (o.yTitle) { const t = txt(parent, 0, 0, o.yTitle, { class: 'axis-title', 'text-anchor': 'middle' }); t.setAttribute('transform', `translate(${o.x0 - (o.yTx || 62)},${(o.y0 + o.y1) / 2}) rotate(-90)`); }
  }
  // conventional legend on a white 90 % rounded rect
  function drawLegend(parent, x, y, items) {
    const rowH = 18, padX = 10, padY = 8;
    const wdt = Math.max(...items.map(i => i.n.length)) * 7.2 + 2 * padX + 40;
    const g = el('g', {}, parent);
    el('rect', { x, y, width: wdt, height: items.length * rowH + 2 * padY - 4, rx: 4, fill: '#fff', 'fill-opacity': .9, stroke: 'var(--rule)' }, g);
    items.forEach((it, j) => {
      const yy = y + padY + j * rowH + 6;
      if (it.fill) el('rect', { x: x + padX, y: yy - 6, width: 18, height: 12, fill: it.c, 'fill-opacity': it.op == null ? .35 : it.op, stroke: it.stroke || 'none', 'stroke-dasharray': it.dash ? '3 3' : 'none' }, g);
      else el('line', { x1: x + padX, x2: x + padX + 18, y1: yy, y2: yy, stroke: it.c, 'stroke-width': it.w || 2.5, 'stroke-dasharray': it.dash ? '5 4' : 'none' }, g);
      txt(g, x + padX + 26, yy + 4, it.n, { class: 'axis-title', fill: 'var(--ink)' });
    });
    return g;
  }

  // ------------------------------------------------------------ dials (persist unless the step presets them; dirty on user input)
  const DIALS = {};
  function dial(id, o) {
    const inp = $(id), val = o.valId ? $(o.valId) : null;
    const d = { id, dirty: false, list: o.list || null, fmt: o.fmt || (v => v),
      get() { const raw = inp.tagName === 'SELECT' ? inp.value : parseFloat(inp.value); return d.list ? d.list[raw | 0] : (inp.tagName === 'SELECT' ? raw : raw); },
      set(v) { if (d.list) { const i = d.list.indexOf(v); inp.value = i < 0 ? 0 : i; } else inp.value = v; d.show(); },
      show() { if (val) val.textContent = d.fmt(d.get()); } };
    inp.addEventListener(inp.tagName === 'SELECT' ? 'change' : 'input', () => { d.dirty = true; d.show(); if (ENG.ready) ENG.onDial(); });
    DIALS[id] = d; d.show();
    return d;
  }
  function applyPresets(step, force) {
    const p = Object.assign({}, PAGE.defaults, step.presets || {});
    for (const id in p) if (DIALS[id] && (force || !DIALS[id].dirty)) DIALS[id].set(p[id]);
  }

  // ------------------------------------------------------------ step engine
  const ENG = { step: 0, t: 0, playing: false, raf: 0, lastT: 0, ready: false };
  const SPEED = { vslow: 0.25, slow: 0.5, normal: 1, fast: 2.5, instant: 0 };
  const speedFactor = () => SPEED[$('speed').value];
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cur = () => PAGE.steps[ENG.step];
  const span = () => cur().span();
  const done = () => cur().static || ENG.t >= span() - 1e-9;

  function enterStep(k, completed = false) {
    ENG.step = k;
    const d = cur();
    stopPlay();
    applyPresets(d, false);
    ENG.t = 0;
    setup();
    if (d.static || completed || speedFactor() === 0 || reduceMotion) finish();
    else { render(); startPlay(); }
  }
  function setup() {
    const d = cur();
    PAGE.setup(d);   // page computes its live quantities first, so the tag below reads them
    $('title').innerHTML = d.title() + (d.tag ? `<span class="tag">${d.tag()}</span>` : '');
    $('subtitle').textContent = typeof d.subtitle === 'function' ? d.subtitle() : d.subtitle;
    const code = typeof d.code === 'function' ? d.code() : (d.code || '');
    $('code').hidden = !code; $('code').innerHTML = code;
    $('counter').textContent = `${ENG.step + 1} / ${PAGE.steps.length}`;
    try { history.replaceState(null, '', '#' + (ENG.step + 1)); } catch (_) {}
  }
  function render() { PAGE.draw(cur(), Math.min(ENG.t, span())); }
  function finish() { ENG.t = span(); stopPlay(); render(); }
  function tick(now) {
    if (!ENG.playing) return;
    const dt = Math.min(0.1, (now - ENG.lastT) / 1000); ENG.lastT = now;
    ENG.t += dt * speedFactor() * span() / (PAGE.durNormal || 6);
    if (ENG.t >= span()) { finish(); return; }
    render();
    ENG.raf = requestAnimationFrame(tick);
  }
  function startPlay() {
    if (done()) return;
    ENG.playing = true; ENG.lastT = performance.now();
    $('play').textContent = '⏸';
    ENG.raf = requestAnimationFrame(tick);
  }
  function stopPlay() { ENG.playing = false; cancelAnimationFrame(ENG.raf); $('play').textContent = '▶'; }
  function next() { if (!done()) { finish(); return; } if (ENG.step < PAGE.steps.length - 1) enterStep(ENG.step + 1); }
  function prev() { if (ENG.step > 0) enterStep(ENG.step - 1, true); }
  function restart() { enterStep(ENG.step); }
  // a dial moved: recompute from live values, redraw at the current progress
  ENG.onDial = () => { const was = ENG.playing; stopPlay(); setup(); ENG.t = Math.min(ENG.t, span()); render(); if (was && !done()) startPlay(); };

  $('next').addEventListener('click', e => { e.stopPropagation(); next(); });
  $('prev').addEventListener('click', e => { e.stopPropagation(); prev(); });
  $('restart').addEventListener('click', e => { e.stopPropagation(); restart(); });
  $('reset').addEventListener('click', e => { e.stopPropagation(); for (const id in DIALS) DIALS[id].dirty = false; $('speed').value = 'normal'; applyPresets(cur(), true); restart(); });
  $('play').addEventListener('click', e => { e.stopPropagation(); if (ENG.playing) stopPlay(); else if (done()) { if (cur().static) next(); else restart(); } else startPlay(); });
  $('slide').addEventListener('click', () => next());
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
    else if (e.key === ' ') { e.preventDefault(); $('play').click(); }
    else if (e.key === 'r' || e.key === 'R') restart();
  });
  function boot() {
    ENG.ready = true;
    const h = parseInt((location.hash || '').replace('#', ''), 10);
    enterStep(h >= 1 && h <= PAGE.steps.length ? h - 1 : 0);
  }
  // hover tooltip helper: returns svg coords of the mouse
  const tt = $('tt');
  function svgPoint(chart, evt) { const pt = chart.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY; return pt.matrixTransform(chart.getScreenCTM().inverse()); }
  function showTip(chart, evt, html) {
    tt.innerHTML = html; tt.style.display = 'block';
    const wrap = chart.parentElement.getBoundingClientRect();
    const px = evt.clientX - wrap.left, py = evt.clientY - wrap.top;
    tt.style.left = (px + 16 + tt.offsetWidth > wrap.width ? px - tt.offsetWidth - 12 : px + 16) + 'px';
    tt.style.top = Math.max(0, py - 10) + 'px';
  }
  function hideTip() { tt.style.display = 'none'; }


  // ------------------------------------------------------------ page
  const FS = 50, DUR = 5, NS = DUR * FS;
  const AXES = [{ k: 'x', c: COL.blue, n: 'acceleration x' }, { k: 'y', c: COL.red, n: 'acceleration y' }, { k: 'z', c: COL.green, n: 'acceleration z' }];
  const ORDER = ['Sitting', 'Standing', 'Walking', 'Upstairs', 'Downstairs', 'Running'];
  const NAME = { Sitting: 'sitting', Standing: 'standing', Walking: 'walking', Upstairs: 'walking upstairs', Downstairs: 'walking downstairs', Running: 'running' };
  const SUB = {
    Sitting: 'The three accelerometer axes while sitting with the phone in a hip pocket.',
    Standing: 'The same three axes while standing, at different baselines than sitting.',
    Walking: 'The periodic peaks in the accelerometer axes produced by each step.',
    Upstairs: 'How walking upstairs resembles walking with added irregular bumps.',
    Downstairs: 'How walking downstairs also resembles walking and looks much like upstairs.',
    Running: 'How running shows the walking pattern with faster and larger swings.'
  };
  const chart = $('chart');
  const W = 1360;
  const YLO = -20, YHI = 22;
  const start = () => DIALS.start.get();
  const offset = () => Math.round(start() * FS);
  const selAxes = () => { const a = DIALS.axes.get(); return a === 'xyz' ? AXES : AXES.filter(x => x.k === a); };
  const tagTxt = () => `50 Hz · start ${fmt(start(), 1)} s · hip pocket`;

  const PAGE = {
    defaults: { start: 0, axes: 'xyz' },
    durNormal: 6,
    steps: ORDER.map(act => ({
      act, title: () => `Accelerometer traces during ${NAME[act]}`, tag: tagTxt, subtitle: SUB[act], span: () => DUR
    })).concat([{
      act: null, static: true, title: () => 'The six activities side by side', tag: tagTxt,
      subtitle: 'Comparing all six activities on identical axes from the same user and phone.', span: () => DUR
    }]),
    setup(step) { chart.innerHTML = ''; G = {}; if (step.act) setupSingle(step); else setupGrid(); },
    draw(step, t) { if (step.act) drawSingle(step, t); }
  };
  let G = {};

  // ---- one activity, full slide
  const S = { x0: 80, x1: W - 36, y0: 40, y1: 548 };
  const xs = t => S.x0 + (t / DUR) * (S.x1 - S.x0);
  const ys = v => S.y1 - ((v - YLO) / (YHI - YLO)) * (S.y1 - S.y0);
  function setupSingle(step) {
    drawAxes(chart, { x0: S.x0, x1: S.x1, y0: S.y0, y1: S.y1, xs, ys, xTicks: [0, 1, 2, 3, 4, 5], yTicks: [-20, -10, 0, 10, 20], xTitle: 'time (seconds)', yTitle: 'm/s²', xFmt: v => v });
    G.lines = el('g', {}, chart);
    G.cursor = el('g', {}, chart);
    drawLegend(chart, S.x1 - 170, S.y0 + 8, selAxes().map(a => ({ c: a.c, n: a.n })));
    G.hover = el('g', {}, chart);
    el('rect', { x: S.x0, y: S.y0, width: S.x1 - S.x0, height: S.y1 - S.y0, fill: 'transparent' }, chart);
  }
  function path(arr, o, upto, xsf, ysf) {
    let d = '';
    for (let i = 0; i <= upto; i++) d += (i ? 'L' : 'M') + xsf(i / FS).toFixed(1) + ',' + ysf(arr[o + i]).toFixed(1);
    return d;
  }
  function drawSingle(step, t) {
    G.lines.innerHTML = ''; G.cursor.innerHTML = '';
    const upto = Math.min(NS - 1, Math.floor(t * FS));
    const o = offset(), tr = TRACES[step.act];
    selAxes().forEach(a => el('path', { class: 'thin-line', d: path(tr[a.k], o, upto, xs, ys), stroke: a.c }, G.lines));
    if (t < DUR - 1e-9) {
      el('line', { class: 'cursor-line', x1: xs(t), x2: xs(t), y1: S.y0, y2: S.y1 }, G.cursor);
      txt(G.cursor, xs(t) + 6, S.y1 - 8, `t = ${fmt(t, 2)} s · sample ${upto + 1}`, { class: 'mono-2' });
    }
  }
  chart.addEventListener('mousemove', evt => {
    const step = cur(); if (!step.act) return;
    const p = svgPoint(chart, evt);
    const t = Math.max(0, Math.min(DUR, (p.x - S.x0) / (S.x1 - S.x0) * DUR));
    const i = Math.min(NS - 1, Math.round(t * FS)), o = offset(), tr = TRACES[step.act];
    G.hover.innerHTML = '';
    el('line', { class: 'crosshair', x1: xs(i / FS), x2: xs(i / FS), y1: S.y0, y2: S.y1 }, G.hover);
    let html = `<div class="row"><span>t</span><b>${fmt(i / FS, 2)} s</b></div>`;
    selAxes().forEach(a => { html += `<div class="row"><span><i class="sw" style="background:${a.c}"></i>${a.k}</span><span>${fmt(tr[a.k][o + i], 1)}</span></div>`; });
    showTip(chart, evt, html);
  });
  chart.addEventListener('mouseleave', () => { hideTip(); if (G.hover) G.hover.innerHTML = ''; });

  // ---- six small panels, 3 rows x 2 columns as in the chapter figure
  function setupGrid() {
    const GAP = 84, PW = (W - 80 - 36 - GAP) / 2, PH = 138, GX = [80, 80 + PW + GAP], GY = [42, 224, 406];
    ORDER.forEach((act, k) => {
      const px0 = GX[k % 2], py0 = GY[Math.floor(k / 2)], px1 = px0 + PW, py1 = py0 + PH;
      const pxs = t => px0 + (t / DUR) * PW, pys = v => py1 - ((v - YLO) / (YHI - YLO)) * PH;
      const bottom = k >= 4;
      const g = el('g', {}, chart);
      const grid = el('g', { class: 'grid' }, g), axis = el('g', { class: 'axis' }, g);
      [-20, 0, 20].forEach(v => { el('line', { x1: px0, x2: px1, y1: pys(v), y2: pys(v) }, grid); txt(axis, px0 - 8, pys(v) + 4, v, { 'text-anchor': 'end' }); });
      [0, 1, 2, 3, 4, 5].forEach(v => { el('line', { x1: pxs(v), x2: pxs(v), y1: py0, y2: py1 }, grid); if (bottom) txt(axis, pxs(v), py1 + 16, v, { 'text-anchor': 'middle' }); });
      el('path', { d: `M${px0},${py0}V${py1}H${px1}` }, axis);
      { const yt = txt(g, 0, 0, 'm/s²', { class: 'axis-title', 'text-anchor': 'middle' }); yt.setAttribute('transform', `translate(${px0 - 58},${(py0 + py1) / 2}) rotate(-90)`); }
      if (bottom) txt(g, px1, py1 + 36, 'time (seconds)', { class: 'axis-title', 'text-anchor': 'end' });
      txt(g, px0 + PW / 2, py0 - 8, NAME[act], { class: 'dlabel', 'text-anchor': 'middle', fill: 'var(--ink)' });
      const o = offset();
      selAxes().forEach(a => el('path', { class: 'thin-line', d: path(TRACES[act][a.k], o, NS - 1, pxs, pys), stroke: a.c, 'stroke-width': 1.1 }, g));
      if (k === 0) drawLegend(g, px1 - 172, py0 + 4, selAxes().map(a => ({ c: a.c, n: a.n })));
    });
  }

  dial('start', { valId: 'startVal', fmt: v => fmt(v, 1) + ' s' });
  dial('axes', {});
  boot();
})();
</script>
</body>
</html>
